<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An animated, chapter-by-chapter explainer of how input and output tokens work in a large language model like Claude Fable 5.">
<title>Tokens In, Tokens Out</title>
<style>
/* ============ Design tokens ============ */
:root {
  --bg: #f4f3ee;
  --surface: #ffffff;
  --surface-2: #f1f0ea;
  --surface-3: #e6e4dc;
  --ink: #1c1c1a;
  --ink-2: #55544e;
  --ink-3: #85847c;
  --line: #dbd9d0;
  --line-2: #c4c1b6;
  /* semantic token kinds */
  --in: #2d6be0;     /* input tokens */
  --out: #dc5a24;    /* output tokens */
  --think: #8455d2;  /* thinking (output) tokens */
  --sys: #55677d;    /* system prompt / instructions */
  --tool: #13906a;   /* tools, tool results */
  --cache: #b07f06;  /* cached tokens */
  --bad: #cf3f3f;
  --good: #3c8419;   /* finished / ok (olive, distinct from tool teal) */
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 10px 30px rgba(0, 0, 0, .06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1013; --surface: #17191e; --surface-2: #1f2229; --surface-3: #2a2d36;
    --ink: #eceae4; --ink-2: #b0aea7; --ink-3: #7f7e78; --line: #2d3038; --line-2: #3d414c;
    --in: #6f9eff; --out: #ff8a55; --think: #b48eff; --sys: #96a7bd; --tool: #3ccb98; --cache: #f0be3d;
    --bad: #ff6b6b; --good: #93d05a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1013; --surface: #17191e; --surface-2: #1f2229; --surface-3: #2a2d36;
  --ink: #eceae4; --ink-2: #b0aea7; --ink-3: #7f7e78; --line: #2d3038; --line-2: #3d414c;
  --in: #6f9eff; --out: #ff8a55; --think: #b48eff; --sys: #96a7bd; --tool: #3ccb98; --cache: #f0be3d;
  --bad: #ff6b6b; --good: #93d05a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* ============ Page shell ============ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; height: 100dvh; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.brand { font-weight: 680; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand small { font-weight: 450; color: var(--ink-2); font-size: 14px; }
.top-actions { display: flex; gap: 8px; flex: none; }

.btn {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 9px; height: 36px; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 550;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; line-height: 1;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .timeline:focus-visible, .big-play:focus-visible { outline: 2px solid var(--in); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.icon { width: 38px; padding: 0; }
.btn.play { width: 46px; height: 40px; border-radius: 11px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.play .i-pause { display: none; }
.is-playing .btn.play .i-play { display: none; }
.is-playing .btn.play .i-pause { display: block; }
select.btn { padding: 0 10px; }

.viewer { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 16px 0; gap: 12px; }
.stage-wrap { position: relative; flex: 1; min-height: 180px; }
.stage {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow);
}
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
  background: color-mix(in srgb, var(--bg) 40%, transparent);
}
.overlay[hidden] { display: none; }
.big-play {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 14px;
  background: var(--ink); color: var(--bg); font: inherit; font-size: 18px; font-weight: 650;
  padding: 16px 26px 16px 20px; border-radius: 999px; box-shadow: var(--shadow);
}
.big-play small { display: block; font-size: 13px; font-weight: 500; opacity: .75; margin-top: 2px; text-align: left; }
.big-play span { text-align: left; }

.caption-box { max-width: 1000px; width: 100%; margin: 0 auto; min-height: 104px; padding: 0 4px; }
.chapter-label { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
#caption { font-size: 19px; line-height: 1.5; margin: 6px 0 0; text-wrap: pretty; }
#caption b { font-weight: 680; }
#caption code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
#caption.fade { animation: capin .45s ease both; }
@keyframes capin { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.controls { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; }
.timeline { flex: 1; display: flex; gap: 3px; height: 30px; align-items: center; cursor: pointer; touch-action: none; border-radius: 6px; min-width: 120px; }
.seg { flex: 1 1 0; height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: hidden; transition: height .15s; }
.timeline:hover .seg { height: 10px; }
.seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink-2); }
.seg.active i { background: var(--in); }
.time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); min-width: 88px; text-align: right; }

.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 19; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--surface);
  border-left: 1px solid var(--line); transform: translateX(102%); transition: transform .25s ease; z-index: 20;
  display: flex; flex-direction: column; box-shadow: var(--shadow); visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; }
.drawer > header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.drawer ol { list-style: none; margin: 0; padding: 8px; overflow: auto; flex: 1; }
.drawer li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: baseline;
  padding: 10px 10px; border-radius: 9px; background: none; border: 0; color: inherit; font: inherit; font-size: 15px; cursor: pointer;
}
.drawer li button:hover { background: var(--surface-2); }
.drawer li.active button { background: var(--surface-2); font-weight: 650; }
.drawer li .n { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
.drawer li .d { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
.drawer-note { margin: 0; padding: 12px 18px 18px; font-size: 12.5px; color: var(--ink-3); line-height: 1.9; border-top: 1px solid var(--line); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

@media (max-width: 760px) {
  #app { height: auto; }
  .viewer { display: contents; }
  .stage-wrap { order: 1; margin: 12px 16px 0; }
  .controls { order: 2; }
  .caption-box { order: 3; padding: 0 16px 24px; }
  .brand small { display: none; }
  .btn span { display: none; }
  .btn:not(.icon) { width: 38px; padding: 0; }
  select.btn { width: auto; padding: 0 8px; }
  .stage-wrap { flex: none; aspect-ratio: 16 / 9; min-height: 0; }
  .caption-box { min-height: 0; }
  #caption { font-size: 17px; }
  .controls { flex-wrap: wrap; }
  .timeline { order: -1; flex-basis: 100%; }
  .time { margin-left: auto; }
}

/* ============ Scene primitives (inside the 1280×720 stage) ============ */
.scene { position: absolute; inset: 0; overflow: hidden; color: var(--ink); font-family: var(--font); }
.scene .svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.center { text-align: center; }

.s-kicker { font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.s-title { font-size: 68px; font-weight: 760; letter-spacing: -.025em; line-height: 1.04; }
.s-h { font-size: 40px; font-weight: 720; letter-spacing: -.015em; line-height: 1.15; }
.s-h2 { font-size: 28px; font-weight: 660; line-height: 1.22; }
.s-body { font-size: 24px; line-height: 1.42; color: var(--ink-2); }
.s-small { font-size: 19px; line-height: 1.4; color: var(--ink-2); }
.s-mono { font-family: var(--mono); }
.s-num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 16px; }
.card-label { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.pill {
  display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px; border-radius: 999px;
  font-size: 19px; font-weight: 620; border: 1.5px solid var(--k, var(--line-2)); white-space: nowrap;
  background: color-mix(in srgb, var(--k, var(--ink-3)) 10%, var(--surface));
}
.dot { display: inline-block; width: 13px; height: 13px; border-radius: 4px; background: var(--k, var(--ink-3)); flex: none; }
.tag-illus {
  font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  border: 1.5px dashed var(--line-2); padding: 4px 9px; border-radius: 7px; white-space: nowrap;
}
.row { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; }

/* kinds: put k-* on anything, then use var(--k) */
.k-in { --k: var(--in); } .k-out { --k: var(--out); } .k-think { --k: var(--think); }
.k-sys { --k: var(--sys); } .k-tool { --k: var(--tool); } .k-cache { --k: var(--cache); }
.k-bad { --k: var(--bad); } .k-good { --k: var(--good); } .k-ink { --k: var(--ink-3); }
.ck { color: var(--k); }
.bk { background: color-mix(in srgb, var(--k) 13%, var(--surface)); }
.fk { background: var(--k); }
.brk { border-color: var(--k); }

/* token chip */
.tok {
  display: inline-flex; align-items: center; font-family: var(--mono); font-size: 24px; line-height: 1;
  padding: 8px 11px; border-radius: 9px; border: 2px solid var(--k, var(--line-2));
  background: color-mix(in srgb, var(--k, var(--ink-3)) 14%, var(--surface)); color: var(--ink);
  white-space: pre; flex: none;
}
.tok .sp { color: var(--ink-3); }
.tok.sm { font-size: 18px; padding: 6px 8px; border-radius: 7px; }
.tok.lg { font-size: 32px; padding: 10px 14px; border-radius: 11px; }
.tok.ghost { --k: var(--line-2); background: transparent; color: var(--ink-3); border-style: dashed; }

/* the model "box" */
.model {
  border: 2px solid var(--line-2); background: var(--surface-2); border-radius: 24px;
  display: flex; flex-direction: column; padding: 18px 18px 14px; gap: 10px;
}
.model-layers { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 9px; }
.model-layer { height: 9px; border-radius: 5px; background: linear-gradient(90deg, var(--in), var(--think), var(--out)); opacity: .25; }
.model-label { font-weight: 720; font-size: 20px; text-align: center; letter-spacing: -.01em; white-space: nowrap; }
.model-sub { font-size: 15px; text-align: center; color: var(--ink-3); margin-top: -6px; }

/* code / JSON block */
.code {
  font-family: var(--mono); font-size: 22px; line-height: 1.55; background: var(--surface-2); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 18px 24px; white-space: pre; color: var(--ink);
}
.code .key { color: var(--in); } .code .num { color: var(--out); } .code .str { color: var(--tool); } .code .pun { color: var(--ink-3); }
.code .hl { background: color-mix(in srgb, var(--k, var(--cache)) 20%, transparent); border-radius: 5px; }

/* SVG strokes */
.ln { fill: none; stroke: var(--k, var(--ink-3)); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ln.thin { stroke-width: 1.5; }
.ln.thick { stroke-width: 4; }
.ln.dashed { stroke-dasharray: 7 7; }
.hd { fill: var(--k, var(--ink-3)); }
.svg text { font-family: var(--font); fill: var(--ink-2); }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Tokens In, Tokens Out <small>· how a model like Claude Fable 5 reads and writes</small></div>
    <div class="top-actions">
      <button class="btn" id="btn-narrate" type="button" aria-pressed="false" title="Read captions aloud (V)">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span>Narrate</span>
      </button>
      <button class="btn icon" id="btn-theme" type="button" title="Switch light / dark theme" aria-label="Switch light or dark theme">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
      </button>
      <button class="btn" id="btn-chapters" type="button" aria-expanded="false" aria-controls="drawer" title="Chapters (C)">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Chapters</span>
      </button>
    </div>
  </header>

  <main class="viewer">
    <div class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage" aria-hidden="true"></div>
      <div class="overlay" id="overlay">
        <button class="big-play" id="btn-start" type="button">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 5.5v17l14-8.5z" fill="currentColor"/></svg>
          <span>Play the explainer <small id="runtime"></small></span>
        </button>
      </div>
    </div>
    <div class="caption-box" aria-live="polite">
      <div class="chapter-label" id="chapter-label"></div>
      <p id="caption"></p>
    </div>
  </main>

  <footer class="controls">
    <button class="btn icon" id="btn-prev" type="button" title="Previous chapter (Shift+←)" aria-label="Previous chapter">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3 6 8l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn icon play" id="btn-play" type="button" title="Play / pause (Space)" aria-label="Play">
      <svg class="i-play" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>
      <svg class="i-pause" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>
    </button>
    <button class="btn icon" id="btn-next" type="button" title="Next chapter (Shift+→)" aria-label="Next chapter">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Playback position" aria-valuemin="0"></div>
    <div class="time" id="time">0:00 / 0:00</div>
    <label class="speed">
      <span class="sr">Playback speed</span>
      <select class="btn" id="speed" title="Playback speed">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Chapters">
    <header><strong>Chapters</strong><button class="btn icon" id="btn-close" type="button" aria-label="Close chapters">✕</button></header>
    <ol id="chapter-list"></ol>
    <p class="drawer-note">Keyboard: <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> ±5 s · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> chapter · <kbd>V</kbd> narrate · <kbd>C</kbd> chapters</p>
  </aside>
</div>
<script>
/* Tokens In, Tokens Out: a tiny seekable animation engine.
 * Every scene renders as a pure function of its local time t (ms), so the
 * film can be paused, scrubbed, sped up, or deep-linked to any frame. */
(function () {
  'use strict';
  var W = 1280, H = 720;
  var TA = (window.TA = { W: W, H: H, scenes: [] });
  TA.scene = function (def) { TA.scenes.push(def); };

  /* ---------------- math ---------------- */
  function clamp(x, a, b) { a = a == null ? 0 : a; b = b == null ? 1 : b; return x < a ? a : x > b ? b : x; }
  function lerp(a, b, q) { return a + (b - a) * q; }
  var ease = {
    linear: function (x) { return x; },
    in: function (x) { return x * x * x; },
    out: function (x) { return 1 - Math.pow(1 - x, 3); },
    inOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    soft: function (x) { return x * x * (3 - 2 * x); },
    back: function (x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  };
  /** eased progress 0..1 of an animation that starts at `start` and lasts `dur` ms */
  function p(t, start, dur, e) {
    if (dur <= 0) return t >= start ? 1 : 0;
    var f = typeof e === 'function' ? e : ease[e || 'inOut'] || ease.inOut;
    return f(clamp((t - start) / dur));
  }
  /** 0..1 envelope: fades in at `a`, fades out starting at `b` (each over `d` ms) */
  function win(t, a, b, d) { d = d == null ? 400 : d; return Math.min(p(t, a, d, 'out'), 1 - p(t, b, d, 'in')); }
  /** staggered progress for item i: starts at start + i*each */
  function stag(t, start, each, i, dur, e) { return p(t, start + i * each, dur == null ? 500 : dur, e || 'out'); }
  /** smooth oscillation between lo and hi (default 0..1) with the given period */
  function pulse(t, period, lo, hi) {
    period = period || 1600; lo = lo == null ? 0 : lo; hi = hi == null ? 1 : hi;
    return lo + (hi - lo) * (0.5 - 0.5 * Math.cos((t / period) * Math.PI * 2));
  }
  /** deterministic PRNG (mulberry32) */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0; var x = a;
      x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- DOM ---------------- */
  function el(tag, cls, parent, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(tag, cls, parent, text) { var e = el(tag, cls, parent); e.textContent = text; return e; }
  function at(e, x, y, w, h) {
    e.style.position = 'absolute'; e.style.left = x + 'px'; e.style.top = y + 'px';
    if (w != null) e.style.width = w + 'px';
    if (h != null) e.style.height = h + 'px';
    return e;
  }
  function css(e, o) {
    for (var k in o) { if (k.charAt(0) === '-') e.style.setProperty(k, o[k]); else e.style[k] = o[k]; }
    return e;
  }
  function op(e, o) {
    o = clamp(o);
    e.style.opacity = o < 0.001 ? '0' : o > 0.999 ? '1' : o.toFixed(3);
    e.style.visibility = o < 0.001 ? 'hidden' : 'inherit';   // always set, so style order is stable across seeks
    return e;
  }
  function f2(n) { return Math.abs(n) < 0.005 ? '0' : n.toFixed(2); }
  function tf(e, x, y, s, r) {

    function show(e, pr, dy, dx, s0) {   // like h.show, transform written first (stable style order)
      dy = dy == null ? 14 : dy; dx = dx || 0; s0 = s0 == null ? 1 : s0;
      h.tf(e, (1 - pr) * dx, (1 - pr) * dy, h.lerp(s0, 1, h.clamp(pr)));
      return h.op(e, pr);
    }
    var C = [0, 7400, 14300, 21500, 27900, 35800, 43300];

    /* ---------- header ---------- */
    var kick = h.txt('div', 's-kicker', root, 'Chapter 17');
    h.at(kick, 80, 48);
    var head = h.txt('div', 's-h', root, 'Recap: one request, start to finish');
    h.at(head, 80, 74);

    var svg = h.svg(root);

    /* ---------- 1 · your request (input) ---------- */
    var QX = 80, QY = 150, QW = 226, QH = 250;
    var Q = h.at(h.el('div', 'card', root), QX, QY, QW, QH);
    h.at(h.txt('div', 'card-label', Q, 'Your request'), 18, 16);
    var LAY = [['Tool definitions', 'tool'], ['System prompt', 'sys'], ['History', 'in'], ['Documents', 'in'], ['Your message', 'in']];
    var lays = LAY.map(function (l, i) { return h.at(h.txt('div', 'rc-layer k-' + l[1], Q, l[0]), 16, 50 + i * 38, QW - 35, 32); });
    var qGlow = h.at(h.el('div', 'rc-glow', Q), 10, 44, QW - 23, 5 * 38 + 6);
    var stIn = h.at(h.txt('div', 'rc-st k-in', root, 'Input tokens'), QX, QY + QH + 12, QW);

    /* ---------- 2 · the model (prefill) ---------- */
    var MX = 342, MY = 166, MW = 214, MH = 218;
    var mdl = h.model(root, MX, MY, MW, MH, 'Claude Fable 5');
    var MC = { x: MX + MW / 2, y: MY + 90 };
    var stPf = h.at(h.txt('div', 'rc-st', root, 'Prefill: reads it all at once'), MX - 40, QY + QH + 12, MW + 80);
    var a12 = h.arrow(svg, [[QX + QW + 8, 275], [MX - 8, 275]], 'in');
    // token bits that stream from every layer into the model in parallel
    var bits = [];
    LAY.forEach(function (l, i) {
      for (var j = 0; j < 3; j++) {
        // start just past the layer chips' right edge, so the bits never sit on the layer labels
        var b = h.at(h.el('div', 'rc-bit k-' + l[1], root), QX + QW - 16, QY + 59 + i * 38);
        bits.push({ e: b, i: i, j: j, x: QX + QW - 9, y: QY + 66 + i * 38 });
      }
    });

    /* ---------- 3 · decode loop (output) ---------- */
    var DX = 606, DY = 150, DW = 346, DH = 250;
    var D = h.at(h.el('div', 'card', root), DX, DY, DW, DH);
    h.at(h.txt('div', 'card-label', D, 'Its reply'), 18, 16);
    var ill = h.txt('div', 'tag-illus', D, 'illustrative');
    h.at(ill, 0, 12);
    ill.style.left = (DW - 16 - h.box(ill).w) + 'px';
    var thL = h.at(h.txt('div', 'rc-sub k-think', D, 'thinking'), 18, 48);
    var thRow = h.row(D, 18, 74, 6, DW - 36);
    var thToks = [0, 1, 2, 3, 4].map(function () { return h.tok('   ', 'think', thRow, 'sm'); });
    var anL = h.at(h.txt('div', 'rc-sub k-out', D, 'answer'), 18, 126);
    var anRow = h.row(D, 18, 152, 6, DW - 36);
    var anToks = h.toks(anRow, ['Tokens', ' are', ' small', ' pieces', ' of', ' text', '.'], 'out', 'sm');
    var stOut = h.at(h.txt('div', 'rc-st k-out', root, 'Output: one token at a time'), DX, QY + QH + 12, DW);
    var a23 = h.arrow(svg, [[MX + MW + 6, 252], [DX - 8, 252]], 'out');
    var a32 = h.arrow(svg, [[DX - 8, 300], [MX + MW + 8, 300]], 'ink', { dash: true, head: 11 });
    var dot = h.el('div', 'rc-dot k-out', root);
    h.at(dot, 0, 0);
    var outT = [];                          // [time, kind] of every output token, in order
    thToks.forEach(function (c, i) { outT.push([C[2] + 900 + i * 420, 'think', c]); });
    anToks.forEach(function (c, i) { outT.push([C[2] + 3300 + i * 380, 'out', c]); });

    /* ---------- 4 · the response: stop_reason + usage ---------- */
    var RX = 990, RW = 210;
    var R = h.at(h.el('div', 'card', root), RX, DY, RW, DH);
    h.at(h.txt('div', 'card-label', R, 'Response'), 18, 16);
    h.at(h.txt('div', 'rc-key', R, 'stop_reason'), 18, 50);
    var sr = h.at(h.tok('end_turn', 'good', R, 'sm'), 18, 76);
    h.at(h.txt('div', 'rc-key', R, 'input_tokens'), 18, 126);
    var vIn = h.at(h.txt('div', 'rc-val k-in', R, '23,440'), 18, 150);
    h.at(h.txt('div', 'rc-key', R, 'output_tokens'), 18, 188);
    var vOut = h.at(h.txt('div', 'rc-val k-out', R, '3,650'), 18, 212);
    var stR = h.at(h.txt('div', 'rc-st', root, 'stop_reason + usage'), 0, QY + QH + 12);
    stR.style.left = Math.min(RX + RW / 2 - h.box(stR).w / 2, 1200 - h.box(stR).w) + 'px';
    var a34 = h.arrow(svg, [[DX + DW + 6, 275], [RX - 8, 275]], 'ink');
    // the response numbers reuse earlier examples (23,440 from chapter 4, 3,650 from chapter 7): illustrative
    var rIll = h.txt('div', 'tag-illus', root, 'illustrative');
    h.at(rIll, 0, DY - 36);
    rIll.style.left = (RX + RW - h.box(rIll).w) + 'px';

    /* ---------- Fable 5 at a glance ---------- */
    var GX = 80, GY = 446, GW = 1120, GH = 180;
    var G = h.at(h.el('div', 'card', root), GX, GY, GW, GH);
    h.at(h.txt('div', 'card-label', G, 'Claude Fable 5 at a glance'), 24, 16);
    var g51 = h.txt('div', 'rc-note', G, 'Fable 5.1: same limits and input/output prices; cache reads $0.25 per million');
    h.at(g51, 0, 13);
    g51.style.left = (GW - 3 - 24 - h.box(g51).w) + 'px';
    var TILES = [
      ['1M', 'token context window, shared by input and output'],
      ['128K', 'max output tokens per response'],
      ['<span class="k-in">$10</span><span class="sl"> / </span><span class="k-out">$50</span>', 'per million input / output tokens'],
      ['<span class="k-cache ck">$1</span>', 'per million tokens read from cache'],
      ['<span class="k-good ck">50% off</span>', 'Batch API, for work that can wait']
    ];
    var tiles = TILES.map(function (tl, i) {
      var e = h.at(h.el('div', 'rc-tile', G), 24 + i * 216, 46, 204, 124);
      h.el('div', 'rc-big', e, tl[0]);
      h.txt('div', 'rc-desc', e, tl[1]);
      return e;
    });
    var TILE_T = [C[4] + 1300, C[4] + 4700, C[5] + 400, C[5] + 3300, C[5] + 5200];

    /* ---------- closing sweep: each station glows in turn ---------- */
    var rings = [[QX, QY, QW, QH, 'in'], [MX, MY, MW, MH, 'think'], [DX, DY, DW, DH, 'out'], [RX, DY, RW, DH, 'good']].map(function (r) {
      return h.at(h.el('div', 'rc-ring k-' + r[4], root), r[0], r[1], r[2], r[3]);
    });
    rings[1].style.borderRadius = '24px';

    /* ---------- closing ---------- */
    var close = h.el('div', 'rc-close', root, '<span class="k-in">Tokens in</span>, <span class="k-out">tokens out</span>.');
    h.at(close, 80, 640);
    var note = h.txt('div', 'rc-note', root, 'Prices as of October 2026. Check Anthropic’s pricing page.');
    h.at(note, 0, 650);
    note.style.left = (1200 - h.box(note).w) + 'px';

    return {
      update: function (t) {
        show(kick, h.p(t, 200, 600, 'out'), 10);
        show(head, h.p(t, 300, 700, 'out'), 14);

        /* request assembles, layer by layer, as the narration lists them */
        show(Q, h.p(t, 600, 600, 'out'), 16);
        var LT = [2500, 3300, 4100, 4800, 5700];
        lays.forEach(function (e, i) { show(e, h.p(t, LT[i], 450, 'back'), 0, -18, 0.9); });
        show(stIn, h.p(t, 6300, 450, 'out'), 8);

        /* prefill: every layer streams into the model at the same time */
        show(mdl, h.p(t, C[1] + 100, 600, 'out'), 0, 0, 0.92);
        a12.set(h.p(t, C[1] + 500, 450));
        var FL = C[1] + 1300;
        bits.forEach(function (b) {
          var st = FL + b.j * 160 + b.i * 30;
          var f = h.p(t, st, 900, 'inOut');
          h.tf(b.e, (MC.x - b.x) * f, (MC.y - b.y) * f - 30 * Math.sin(Math.PI * f) * (b.i - 2) / 2, h.lerp(1, 0.5, f));
          h.op(b.e, h.p(t, st - 150, 150, 'linear') * (1 - h.p(t, st + 750, 150, 'linear')));
        });
        h.op(qGlow, h.win(t, FL - 200, FL + 1500, 300));
        show(stPf, h.p(t, C[1] + 2600, 450, 'out'), 8);
        var busy = Math.max(h.win(t, FL + 400, C[2] + 200, 500), 0.55 * h.win(t, C[2] + 700, outT[outT.length - 1][0] + 300, 300), 0.25 * h.p(t, C[6] + 600, 800));
        mdl.pulse(t, busy);

        /* decode loop: one token per pass, each fed back in */
        show(D, h.p(t, C[2] + 100, 500, 'out'), 16);
        a23.set(h.p(t, C[2] + 400, 400));
        a32.set(h.p(t, C[2] + 700, 400));
        h.op(ill, h.p(t, C[2] + 600, 400, 'out'));
        show(thL, h.p(t, C[2] + 700, 400, 'out'), 0, -8);
        show(anL, h.p(t, C[2] + 3100, 400, 'out'), 0, -8);
        show(stOut, h.p(t, C[2] + 2200, 450, 'out'), 8);
        outT.forEach(function (o) { show(o[2], h.p(t, o[0], 300, 'back'), 0, -14, 0.6); });
        // a travelling dot: model -> reply (the new token), then reply -> model (fed back in)
        var dx = MX + MW + 6, dk = 'out', dop = 0, ddx = 0, ddy = 0;
        for (var k = 0; k < outT.length; k++) {
          var tk = outT[k][0];
          if (t >= tk - 320 && t < tk + 300) {
            dk = outT[k][1];
            if (t < tk) { var q = h.p(t, tk - 320, 320, 'inOut'); ddx = h.lerp(dx, DX - 14, q); ddy = 252; dop = 1; }
            else { var r = h.p(t, tk + 20, 280, 'inOut'); ddx = h.lerp(DX - 14, dx + 4, r); ddy = 300; dop = 1 - h.p(t, tk + 220, 80, 'linear'); }
          }
        }
        dot.className = 'rc-dot k-' + dk;
        h.tf(dot, ddx - 7, ddy - 7);
        h.op(dot, dop);

        /* receipt */
        show(R, h.p(t, C[3] + 100, 500, 'out'), 16);
        a34.set(h.p(t, C[3] + 400, 400));
        show(sr, h.p(t, C[3] + 900, 450, 'back'), 0, -10, 0.7);
        vIn.textContent = h.num(Math.round(h.lerp(0, 23440, h.p(t, C[3] + 2300, 1000, 'out'))));
        show(vIn, h.p(t, C[3] + 2300, 300, 'out'), 6);
        vOut.textContent = h.num(Math.round(h.lerp(0, 3650, h.p(t, C[3] + 3300, 1000, 'out'))));
        show(vOut, h.p(t, C[3] + 3300, 300, 'out'), 6);
        show(stR, h.p(t, C[3] + 1500, 450, 'out'), 8);
        show(rIll, h.p(t, C[3] + 2300, 450, 'out'), 6);

        /* at a glance */
        show(G, h.p(t, C[4] + 200, 600, 'out'), 18);
        tiles.forEach(function (e, i) { show(e, h.p(t, TILE_T[i], 500, 'back'), 14, 0, 0.9); });
        show(g51, h.p(t, TILE_T[3] + 900, 450, 'out'), 6);

        /* closing */
        show(close, h.p(t, C[6] + 300, 600, 'out'), 12);
        show(note, h.p(t, C[6] + 1300, 500, 'out'), 8);
        rings.forEach(function (rg, i) { h.op(rg, h.win(t, C[6] + 1700 + i * 650, C[6] + 2500 + i * 650, 350)); });
      }
    };
  }
});

</script>
<script>
TA.boot();
</script>
