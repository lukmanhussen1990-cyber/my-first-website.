<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brushstroke Rick</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1c1a4a; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #play {
    position: fixed; inset: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; border: 0; background: transparent;
    color: transparent; font-size: 1px; cursor: pointer;
  }
  #play:focus-visible { outline: 3px dashed #ffc23a; outline-offset: -14px; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="A painted figure in a trench coat dances to an 80s synth-pop tune, drawn entirely in moving brushstrokes."></canvas>
<button id="play" type="button" aria-label="Play the dance with sound">Play</button>
<script>
'use strict';
/* =====================================================================
   BRUSHSTROKE RICK
   A one-minute dance painted in code. Every stroke, shadow and note is
   generated here: canvas brushwork for the picture, WebAudio synthesis
   for an original late-80s synth-pop tune at 113 BPM.
   ===================================================================== */

// ---------- small math + colour kit ----------
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const snap = (u, p) => Math.sign(u) * Math.pow(Math.abs(u), p);
const beatDip = b => Math.pow(0.5 + 0.5 * Math.cos(TAU * b), 2);   // 1 on the beat, 0 between

function rng(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function css(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
const BLACK = [12, 8, 30], WHITE = [255, 250, 238];
// a palette entry: five shades from deep to bright, pre-baked as CSS strings
function pal(h) {
  const c = typeof h === 'string' ? hex(h) : h;
  return {
    c, base: css(c),
    s: [css(mix(c, BLACK, .42)), css(mix(c, BLACK, .2)), css(c), css(mix(c, WHITE, .2)), css(mix(c, WHITE, .42))]
  };
}

const INK = pal('#171230');
const P = {
  coat: pal('#c99a5b'), coatDark: pal('#8a6232'), coatLight: pal('#efcf93'),
  hair: pal('#d4582a'), hairDark: pal('#93341a'), hairLight: pal('#f59445'),
  skin: pal('#f2c29d'), skinShade: pal('#d88f6c'), cheek: pal('#ff7f86'),
  shirt: pal('#211d33'), trousers: pal('#2d3052'), shoe: pal('#15121f'),
  mic: pal('#2b2a35'), micHead: pal('#cfd2dc'), cord: pal('#1c1a26')
};

// Each section repaints the wall in its own ground colour; the accents are
// the Memphis-style confetti and paint that the dance throws around.
const SECTIONS = [
  { bar: 0,  name: 'intro',  ground: '#1c1a4a', floor: '#0f0d2b', acc: ['#ffc23a', '#ff5d8f', '#36d6c3', '#f4efe4'] },
  { bar: 4,  name: 'verse',  ground: '#2944d6', floor: '#131a5e', acc: ['#ff6b4a', '#ffd84d', '#9af0d9', '#f4efe4'] },
  { bar: 12, name: 'pre',    ground: '#ae2596', floor: '#46103f', acc: ['#ffb000', '#2f4de0', '#fff1d6', '#36d6c3'] },
  { bar: 16, name: 'chorus', ground: '#10b39b', floor: '#0a4a45', acc: ['#ffc23a', '#ff3d7f', '#2944d6', '#f4efe4'] },
  { bar: 24, name: 'outro',  ground: '#17123a', floor: '#0b0922', acc: ['#ffc23a', '#ff3d7f', '#36d6c3', '#ff6b4a'] }
];
SECTIONS.forEach(s => { s.g = hex(s.ground); s.f = hex(s.floor); s.a = s.acc.map(pal); s.gp = pal(s.ground); });
function sectionIndex(bar) { let k = 0; for (let i = 0; i < SECTIONS.length; i++) if (bar >= SECTIONS[i].bar) k = i; return k; }
function sectionOf(bar) { return SECTIONS[sectionIndex(bar)]; }

// ---------- the song: an original tune in A minor, 113 BPM ----------
const BPM = 113, SPB = 60 / BPM, BAR = SPB * 4, STEP = SPB / 4;
const BARS = 28, SONG_END = BARS * BAR, TAIL = 3.4, TOTAL = SONG_END + TAIL;
const TOTAL_STEPS = BARS * 16 + 1;           // one extra step for the final hit
const CHORDS = ['Am','F','C','G',  'Am','F','C','G','Am','F','C','G',  'Dm','Em','F','G',
                'F','G','C','Am','F','G','E','Am',  'F','G','E','E',  'A'];
const CH = {
  Am: { root: 33, v: [57, 60, 64] }, F:  { root: 29, v: [57, 60, 65] },
  C:  { root: 36, v: [55, 60, 64] }, G:  { root: 31, v: [55, 59, 62] },
  Dm: { root: 38, v: [57, 62, 65] }, Em: { root: 28, v: [55, 59, 64] },
  E:  { root: 28, v: [56, 59, 64] }, A:  { root: 33, v: [57, 61, 64] }
};
// Melody, one token per eighth note: a note name, '-' to hold, '.' to rest.
const MEL = {
  2: 'E5 . G5 . C6 . B5 G5',   3: 'A5 - G5 - D5 - . .',
  4: '. E5 E5 D5 E5 - C5 -',   5: 'A4 - C5 D5 - C5 A4 -',  6: '. G4 C5 E5 - D5 C5 -',  7: 'D5 - - B4 - . . .',
  8: '. E5 E5 D5 E5 - G5 -',   9: 'F5 - E5 D5 - C5 A4 -', 10: '. C5 E5 G5 - E5 D5 C5', 11: 'D5 - - - . B4 C5 D5',
  12: 'F5 - E5 D5 - A4 - .',  13: 'G5 - F5 E5 - B4 - .',  14: 'A5 - G5 F5 - E5 F5 -', 15: 'G5 - - - D5 E5 F5 G5',
  16: 'C6 - A5 - G5 A5 - F5', 17: '- - G5 - D5 - B4 D5',  18: 'E5 - G5 - C6 - B5 A5', 19: 'A5 - - - E5 - . .',
  20: 'C6 - A5 - G5 A5 - C6', 21: '- - D6 - B5 - G5 A5',  22: 'B5 - G#5 - E5 - D6 -', 23: 'C6 - B5 - A5 - - -',
  24: 'C6 - A5 - G5 A5 - F5', 25: '- - G5 - D5 - B4 D5',  26: 'E5 - G#5 - B5 - D6 -', 27: 'E6 - - - . . . .',
  28: 'A5 - - - - - - -'
};
const NOTE_IDX = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const n2m = s => { const m = /^([A-G]#?)(\d)$/.exec(s); return 12 * (+m[2] + 1) + NOTE_IDX[m[1]]; };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const LEAD = [];
(function parseMelody() {
  let cur = null;
  for (let bar = 0; bar <= 28; bar++) {
    const toks = MEL[bar] ? MEL[bar].split(' ') : '. . . . . . . .'.split(' ');
    toks.forEach((tk, j) => {
      const step = bar * 16 + j * 2;
      if (tk === '-') { if (cur) cur.len += 2; return; }
      if (cur) { LEAD.push(cur); cur = null; }
      if (tk !== '.') cur = { step, len: 2, m: n2m(tk) };
    });
  }
  if (cur) LEAD.push(cur);
  LEAD.forEach(n => { n.t = n.step * STEP; n.d = n.len * STEP; });
})();
const LEAD_BY_STEP = {};
LEAD.forEach(n => { (LEAD_BY_STEP[n.step] = LEAD_BY_STEP[n.step] || []).push(n); });

// drum grid: returns what hits on a given sixteenth
function drumsAt(bar, s) {
  const r = {};
  if (bar >= 28) { if (s === 0) { r.kick = 1; r.crash = 1; r.snare = 0.9; } return r; }
  const sec = sectionOf(bar).name;
  const big = sec === 'chorus' || sec === 'outro';
  if (s % 4 === 0) r.kick = 1;
  if (big && s === 14 && bar % 2 === 1) r.kick = 0.7;
  if (sec === 'verse' && s === 10 && bar % 2 === 1) r.kick = 0.6;
  if ((s === 4 || s === 12) && bar > 0) { r.snare = 1; if (big || sec === 'pre') r.clap = 1; }
  if (bar === 0) {
    r.hat = s % 2 === 0 ? 0.25 + s / 40 : 0.12;
    if (s >= 12) r.snare = 0.35 + (s - 12) * 0.2;
  } else {
    r.hat = s % 2 === 0 ? 0.55 : 0.3;
    if (s % 4 === 2) { r.ohat = 1; r.hat = 0; }
  }
  if (bar === 15) {                      // snare roll into the chorus
    r.snare = 0.2 + (s / 15) * 0.8; r.hat = 0; r.ohat = 0; r.clap = 0;
    if (s > 12) r.kick = 0;
  }
  if (s === 0 && [1, 4, 12, 16, 20, 24].includes(bar)) r.crash = 1;
  if (bar === 27) {                      // tom fill and the big wind-up
    r.hat = s < 8 ? r.hat : 0; r.ohat = s < 8 ? r.ohat : 0;
    if (s >= 8) { r.kick = s === 8 || s === 12 ? 1 : 0; r.snare = 0; r.clap = 0; r.tom = [262, 247, 220, 196, 175, 165, 131, 110][s - 8]; }
  }
  return r;
}
function bassAt(bar, s) {
  if (bar === 0) return null;
  if (bar >= 28) return s === 0 ? { m: CH.A.root, d: 14 } : null;
  const ch = CH[CHORDS[bar]], sec = sectionOf(bar).name;
  if (bar === 27 && s >= 8) return s === 8 ? { m: ch.root, d: 3 } : null;
  if (bar === 15 && s >= 14) return null;
  if (s % 2 === 0) return { m: ch.root + ((s / 2) % 2 ? 12 : 0), d: 1.55 };
  if ((sec === 'chorus' || sec === 'outro') && s === 15) return { m: ch.root + 12, d: 0.8 };
  return null;
}

// =====================================================================
//  AUDIO: every sound below is synthesized; no samples.
// =====================================================================
const A = { ctx: null };
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = A.ctx = new AC();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
  comp.attack.value = 0.004; comp.release.value = 0.2;
  const out = ctx.createGain(); out.gain.value = 0.92;
  comp.connect(out); out.connect(ctx.destination);
  A.master = ctx.createGain(); A.master.gain.value = 0.8; A.master.connect(comp);
  A.drums = ctx.createGain(); A.drums.gain.value = 1; A.drums.connect(A.master);
  A.synth = ctx.createGain(); A.synth.gain.value = 1; A.synth.connect(A.master);

  // lush hall reverb
  const verb = ctx.createConvolver(); verb.buffer = makeIR(2.6, 3.2, false);
  A.verb = ctx.createGain(); A.verb.gain.value = 1;
  const vOut = ctx.createGain(); vOut.gain.value = 0.3;
  A.verb.connect(verb); verb.connect(vOut); vOut.connect(A.master);
  // the gated snare room, pure 1987
  const gverb = ctx.createConvolver(); gverb.buffer = makeIR(0.34, 0, true);
  A.gate = ctx.createGain(); A.gate.gain.value = 1;
  const gOut = ctx.createGain(); gOut.gain.value = 0.5;
  A.gate.connect(gverb); gverb.connect(gOut); gOut.connect(A.master);
  // dotted-eighth echo for the lead
  A.echo = ctx.createGain(); A.echo.gain.value = 1;
  const dl = ctx.createDelay(1.5); dl.delayTime.value = SPB * 0.75;
  const fb = ctx.createGain(); fb.gain.value = 0.34;
  const dlf = ctx.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 3000;
  const dOut = ctx.createGain(); dOut.gain.value = 0.26;
  A.echo.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(dOut); dOut.connect(A.master);

  const len = ctx.sampleRate * 2;
  A.noise = ctx.createBuffer(1, len, ctx.sampleRate);
  const nd = A.noise.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
}
function makeIR(dur, decay, gated) {
  const ctx = A.ctx, len = Math.floor(ctx.sampleRate * dur);
  const b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const x = i / len;
      const e = gated ? (x < 0.82 ? 0.8 - x * 0.3 : (1 - x) / 0.18 * 0.55) : Math.pow(1 - x, decay);
      d[i] = (Math.random() * 2 - 1) * e;
    }
  }
  return b;
}
function noiseSrc(t, dur) {
  const s = A.ctx.createBufferSource(); s.buffer = A.noise;
  s.start(t, Math.random() * 1.2); s.stop(t + dur + 0.05); return s;
}
function envGain(t, peak, attack, decay, floor = 0.0001) {
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(floor, t + attack + decay);
  return g;
}
function filt(type, f, q = 0.7) { const b = A.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function panner(p) {
  if (A.ctx.createStereoPanner) { const n = A.ctx.createStereoPanner(); n.pan.value = p; return n; }
  return A.ctx.createGain();
}
function osc(type, f, t, dur, detune = 0) {
  const o = A.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
  o.start(t); o.stop(t + dur); return o;
}

// ---- drums ----
function kick(t, v) {
  const o = osc('sine', 165, t, 0.5);
  o.frequency.exponentialRampToValueAtTime(52, t + 0.1);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.42);
  const g = envGain(t, 0.95 * v, 0.003, 0.42);
  o.connect(g); g.connect(A.drums);
  const n = noiseSrc(t, 0.03), f = filt('bandpass', 3400, 0.8), ng = envGain(t, 0.22 * v, 0.001, 0.018);
  n.connect(f); f.connect(ng); ng.connect(A.drums);
}
function snare(t, v) {
  const n = noiseSrc(t, 0.3), hp = filt('highpass', 950), g = envGain(t, 0.5 * v, 0.002, 0.17);
  n.connect(hp); hp.connect(g); g.connect(A.drums); g.connect(A.gate);
  const o = osc('triangle', 210, t, 0.2); o.frequency.exponentialRampToValueAtTime(165, t + 0.09);
  const og = envGain(t, 0.36 * v, 0.002, 0.1); o.connect(og); og.connect(A.drums); og.connect(A.gate);
}
function clap(t, v) {
  const n = noiseSrc(t, 0.3), bp = filt('bandpass', 1250, 1.3), g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  [0, 0.011, 0.022].forEach(o => { g.gain.setValueAtTime(0.42 * v, t + o); g.gain.exponentialRampToValueAtTime(0.05 * v, t + o + 0.009); });
  g.gain.setValueAtTime(0.32 * v, t + 0.031); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  n.connect(bp); bp.connect(g); g.connect(A.drums); g.connect(A.gate); g.connect(A.verb);
}
function hat(t, v, open) {
  const n = noiseSrc(t, open ? 0.35 : 0.08), hp = filt('highpass', open ? 7200 : 8200), g = envGain(t, (open ? 0.12 : 0.1) * v, 0.001, open ? 0.24 : 0.035);
  const p = panner(open ? -0.25 : 0.2);
  n.connect(hp); hp.connect(g); g.connect(p); p.connect(A.drums);
}
function crash(t, v) {
  const n = noiseSrc(t, 2.2), hp = filt('highpass', 4200), g = envGain(t, 0.26 * v, 0.002, 1.9);
  n.connect(hp); hp.connect(g); g.connect(A.drums); g.connect(A.verb);
}
function tom(t, f, v) {
  const o = osc('sine', f * 1.7, t, 0.5); o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
  const g = envGain(t, 0.55 * v, 0.002, 0.34); o.connect(g); g.connect(A.drums); g.connect(A.verb); g.connect(A.gate);
}

// ---- synths ----
function bass(t, m, d) {
  const f = mtof(m);
  const o1 = osc('sawtooth', f, t, d + 0.1), o2 = osc('square', f, t, d + 0.1, 7);
  const lp = filt('lowpass', 2400, 5);
  lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(360, t + 0.17);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.34, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.12); g.gain.setValueAtTime(0.22, t + d - 0.02);
  g.gain.linearRampToValueAtTime(0.0001, t + d + 0.03);
  const o2g = A.ctx.createGain(); o2g.gain.value = 0.5;
  o1.connect(lp); o2.connect(o2g); o2g.connect(lp); lp.connect(g); g.connect(A.synth);
}
function pad(t, notes, d, o = {}) {
  const vol = (o.vol || 1) * 0.034, att = o.att || 0.18;
  notes.forEach((m, i) => {
    const lp = filt('lowpass', o.cut0 || o.cut || 1500, 0.9);
    if (o.cut0) { lp.frequency.setValueAtTime(o.cut0, t); lp.frequency.exponentialRampToValueAtTime(o.cut1, t + d); }
    const g = A.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att);
    g.gain.setValueAtTime(vol, t + d); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.45);
    const p = panner([-0.45, 0.45, 0][i % 3]);
    [-9, 9].forEach(dt => { const x = osc('sawtooth', mtof(m), t, d + 0.5, dt); x.connect(lp); });
    lp.connect(g); g.connect(p); p.connect(A.synth); p.connect(A.verb);
  });
}
function stab(t, notes, d, v = 1) {
  notes.forEach((m, i) => {
    const lp = filt('lowpass', 500, 2);
    lp.frequency.setValueAtTime(500, t); lp.frequency.exponentialRampToValueAtTime(3400, t + 0.018);
    lp.frequency.exponentialRampToValueAtTime(900, t + 0.2);
    const g = envGain(t, 0.05 * v, 0.006, d + 0.12);
    const p = panner([-0.3, 0.3, 0][i % 3]);
    [-6, 6].forEach(dt => { const x = osc('sawtooth', mtof(m), t, d + 0.2, dt); x.connect(lp); });
    lp.connect(g); g.connect(p); p.connect(A.synth); p.connect(A.verb);
  });
}
function bell(t, m, d, v = 1) {     // two-operator FM electric piano
  const f = mtof(m);
  const car = osc('sine', f, t, d + 1.6);
  const mod = osc('sine', f, t, d + 1.6), mg = A.ctx.createGain();
  mg.gain.setValueAtTime(f * 3.2 * v, t); mg.gain.exponentialRampToValueAtTime(f * 0.45, t + 0.9);
  const tine = osc('sine', f * Math.min(14, 15000 / f), t, 0.3), tg = A.ctx.createGain();
  tg.gain.setValueAtTime(f * 1.4, t); tg.gain.exponentialRampToValueAtTime(1, t + 0.09);
  mod.connect(mg); mg.connect(car.frequency); tine.connect(tg); tg.connect(car.frequency);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.19 * v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.07 * v, t + Math.min(d, 0.5));
  g.gain.setValueAtTime(0.07 * v, t + d); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 1.2);
  car.connect(g); g.connect(A.synth); g.connect(A.echo); g.connect(A.verb);
}
function brass(t, m, d, v = 1) {    // bright saw lead with delayed vibrato
  const f = mtof(m);
  const lfo = osc('sine', 5.6, t, d + 0.3), lg = A.ctx.createGain();
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.22); lg.gain.linearRampToValueAtTime(9, t + 0.5);
  lfo.connect(lg);
  const lp = filt('lowpass', 700, 1.4);
  lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(4600, t + 0.05);
  lp.frequency.exponentialRampToValueAtTime(2300, t + 0.3);
  [-7, 7].forEach(dt => { const o = osc('sawtooth', f, t, d + 0.3, dt); lg.connect(o.detune); o.connect(lp); });
  const sq = osc('square', f / 2, t, d + 0.3), sg = A.ctx.createGain(); sg.gain.value = 0.35; sq.connect(sg); sg.connect(lp);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.085 * v, t + 0.02);
  g.gain.setValueAtTime(0.085 * v, t + d); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.16);
  lp.connect(g); g.connect(A.synth); g.connect(A.verb); g.connect(A.echo);
}
function pluck(t, m, v, pan) {
  const o = osc('square', mtof(m), t, 0.3);
  const lp = filt('lowpass', 5200, 3); lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(700, t + 0.13);
  const g = envGain(t, 0.045 * v, 0.002, 0.2), p = panner(pan);

  const sg = SIL.g;
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.globalAlpha = 1;
  sg.globalCompositeOperation = 'copy'; sg.drawImage(FIG.cv, 0, 0);
  sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#0b0720'; sg.fillRect(0, 0, SIL.cv.width, SIL.cv.height);
  sg.globalCompositeOperation = 'source-over';

  applyCam(g, m);
  drawHalo(g, lv.halo, sc.acc);
  drawSunburst(g, b, lv.sun, sc.acc);
  drawWallShadow(g, b, lv.shadow, R.P[0]);
  drawFloor(g, sc.floor, sc.acc);
  drawBeams(g, b, lv.beams, sc.acc, R.P[0]);
  drawShadows(g, b, lv.shadow, R.P[0]);
  if (lv.echo > 0.01) {
    const e2 = histAt(0.2), e1 = histAt(0.1);
    if (e2) drawEcho(g, e2, sc.acc[2], 0.32 * lv.echo);
    if (e1) drawEcho(g, e1, sc.acc[1], 0.42 * lv.echo);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.drawImage(FIG.cv, FR.x, FR.y, FR.w, FR.h);
  drawParts(g);

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawOverlays(g, t);
  if (state === 'ready') drawTitle(g, 1, now);
  else if (t < 1.4) drawTitle(g, 1 - smooth(t / 1.4), now);
  if (state === 'paused') drawFooterNote(g, 1, 'PAUSED  ·  TAP TO CARRY ON', 'pause');
  if (state === 'done' || t > SONG_END + 1.8) drawFooterNote(g, smooth((t - SONG_END - 1.8) / 1.2), 'TAP TO DANCE AGAIN');
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  BOIL = Math.floor(now / (REDUCED ? 400 : 100));
  MR = [2.4 + Math.sin(BOIL * 1.7) * 0.7, -1.8 + Math.cos(BOIL * 1.3) * 0.5];
  if (state === 'paused') dt = 0;
  clock += dt;
  let t = -1, b, p;
  if (state === 'ready') { b = clock / SPB; p = MOVES.idle(b); LOOK.reveal = 0; }
  else {
    if (state === 'playing') schedule();
    t = songTime(); b = Math.max(0, t / SPB);
    p = poseAt(b);
    LOOK.reveal = clamp(t / (BAR * 1.6), 0, 1);
    const si = Math.min(TOTAL_STEPS - 1, Math.floor(t / STEP));
    if (si - stepSeen > 24) stepSeen = si - 1;          // returning from a hidden tab: skip the backlog
    while (stepSeen < si) { stepSeen++; onStep(stepSeen); }
    if (state === 'playing' && t > TOTAL) { state = 'done'; btn.setAttribute('aria-label', 'Play the dance again'); }
  }
  const mt = t >= 0 ? mouthTarget(t) : 0;
  LOOK.mouth = lerp(LOOK.mouth, Math.max(mt, p.mouth), 1 - Math.exp(-dt * 30));
  if (clock > BL.next) { BL.until = clock + 0.12; BL.next = clock + 2.2 + Math.random() * 2.6; }
  LOOK.blink = clock < BL.until;
  R = solveRig(p);
  stepPhysics(R, dt);
  if (dt > 0) { HIST.push({ time: clock, R }); if (HIST.length > 40) HIST.shift(); }
  const m = camUpdate(t, dt);
  stepParts(dt, m);
  render(t, b, m, now);
}
function mouthTarget(t) {
  for (const n of LEAD) if (t >= n.t && t < n.t + n.d * 0.92) return 0.35 + 0.65 * Math.exp(-(t - n.t) * 4);
  return 0;
}
function start() {
  if (!A.ctx) initAudio();
  A.ctx.resume();
  SCHED.t0 = A.ctx.currentTime + 0.15; SCHED.next = 0; stepSeen = -1;
  resetBackground(SECTIONS[0]);
  PARTS.length = 0; FLOOR_SPLATS.length = 0;
  state = 'playing'; btn.setAttribute('aria-label', 'Pause the dance');
}
btn.addEventListener('click', () => {
  if (state === 'ready' || state === 'done') start();
  else if (state === 'playing') { A.ctx.suspend(); state = 'paused'; btn.setAttribute('aria-label', 'Resume the dance'); }
  else if (state === 'paused') { A.ctx.resume(); state = 'playing'; btn.setAttribute('aria-label', 'Pause the dance'); }
});
window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.key === 'Enter') && document.activeElement !== btn) { e.preventDefault(); btn.click(); }
});
setInterval(() => { if (state === 'playing') schedule(); }, 25);
function resize() {
  let snap = null;
  if (BG.cv.width && state !== 'ready') {
    snap = document.createElement('canvas'); snap.width = BG.cv.width; snap.height = BG.cv.height;
    snap.getContext('2d').drawImage(BG.cv, 0, 0);
  }
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > 5.2e6) DPR = Math.sqrt(5.2e6 / (W * H));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(H / 980, W / 730); GY = H - Math.max(H * 0.15, 64);
  FK = Math.min(S * DPR * 1.12, Math.sqrt(4e6 / (FR.w * FR.h)));
  FIG.cv.width = SIL.cv.width = Math.round(FR.w * FK); FIG.cv.height = SIL.cv.height = Math.round(FR.h * FK);
  BG.cv.width = cv.width; BG.cv.height = cv.height;
  if (snap) { BG.g.setTransform(1, 0, 0, 1, 0, 0); BG.g.drawImage(snap, 0, 0, BG.cv.width, BG.cv.height); }
  else resetBackground(SECTIONS[0]);
  grainPat = null;
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
