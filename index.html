<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#5c94fc" />
<title>Super Mario — Canvas Platformer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e52521'/%3E%3Crect x='5' y='3' width='6' height='3' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-shell">
    <div id="stage">
      <canvas id="game" width="640" height="360" aria-label="Super Mario game canvas"></canvas>

      <!-- Overlays -->
      <div class="overlay" id="overlay-title">
        <div class="panel">
          <h1 class="logo">SUPER<span>MARIO</span></h1>
          <p class="tagline">A hand-built canvas platformer</p>
          <button class="btn" id="btn-start">▶ START GAME</button>
          <div class="controls-hint">
            <div><b>← →</b> or <b>A / D</b> — Move</div>
            <div><b>Space</b> / <b>↑</b> / <b>W</b> — Jump (hold higher)</div>
            <div><b>Shift</b> — Run &nbsp;·&nbsp; <b>P</b> — Pause &nbsp;·&nbsp; <b>M</b> — Mute</div>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="overlay-pause">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="btn" id="btn-resume">▶ RESUME</button>
          <button class="btn btn-ghost" id="btn-restart-pause">↺ RESTART LEVEL</button>
        </div>
      </div>

      <div class="overlay hidden" id="overlay-message">
        <div class="panel">
          <h2 id="message-title">LEVEL COMPLETE</h2>
          <p id="message-sub"></p>
          <button class="btn" id="btn-next">CONTINUE</button>
        </div>
      </div>

      <!-- Touch controls -->
      <div id="touch-controls" class="hidden">
        <div class="pad-left">
          <button class="tbtn" data-key="left" aria-label="Left">◀</button>
          <button class="tbtn" data-key="right" aria-label="Right">▶</button>
        </div>
        <div class="pad-right">
          <button class="tbtn" data-key="run" aria-label="Run">B</button>
          <button class="tbtn tbtn-a" data-key="jump" aria-label="Jump">A</button>
        </div>
      </div>
    </div>
    <p class="footer-note">Built with vanilla JavaScript &amp; the Canvas API — no images, no libraries.</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
