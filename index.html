<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Backrooms</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Courier New", Courier, monospace; color: #e9dfae; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 245, 200, 0.55); }

  /* Overlay screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 6, 2, 0.82); text-align: center; }
  .screen h1 { font-size: clamp(32px, 7vw, 72px); letter-spacing: 0.25em; margin: 0 0 0.3em; color: #f3e6a2; text-shadow: 0 0 18px rgba(255, 220, 120, 0.35); }
  .screen p { max-width: 640px; line-height: 1.5; opacity: 0.85; padding: 0 16px; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(40, 34, 14, 0.85); color: #f1e4a6; border: 1px solid #8a7a3a; padding: 12px 28px; margin: 6px; font: inherit; font-size: 18px; letter-spacing: 0.15em; min-width: 240px; }
  .btn:hover { background: rgba(90, 76, 28, 0.9); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
</div>

<div id="startScreen" class="screen">
  <h1>THE BACKROOMS</h1>
  <p>Click to enter. WASD to move, mouse to look, Shift to run, C to crouch.</p>
  <button class="btn" id="btnStart">ENTER</button>
</div>

<div id="loadError" class="screen hidden">
  <h1>NO SIGNAL</h1>
  <p>Could not load Three.js from the internet. Check your connection and reload the page.</p>
</div>

<script type="module">
// ============================================================================
//  BOOT: load Three.js from a CDN (with fallbacks)
// ============================================================================
const CDN_URLS = [

  'https://unpkg.com/three@0.160.0/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',

//  CONSTANTS & UTILITIES

  renderer.setSize(window.innerWidth, window.innerHeight);

// ============================================================================

const CHUNK = 8;                      // cells per chunk side

        o.connect(og); og.connect(p); env(og, t, 0.005, 0.8, 0.12); o.start(t); o.stop(t + 0.2);
      }
    },
    whisper(px, pz) {
      const [x, z] = around(px, pz, 5 + Math.random() * 6), p = panner(x, 1.6, z, 2, 1.2, 0.7);
      const t = now(), dur = 1.6 + Math.random() * 1.4;
      const s = noiseSrc(), bp = filter('bandpass', 1200, 5), bp2 = filter('bandpass', 2600, 6), g = gain(0);
      s.connect(bp); s.connect(bp2); bp.connect(g); bp2.connect(g); g.connect(p);
      for (let tt = 0; tt < dur; tt += 0.09 + Math.random() * 0.08) {
        bp.frequency.setValueAtTime(500 + Math.random() * 1500, t + tt);
        bp2.frequency.setValueAtTime(1800 + Math.random() * 1800, t + tt);
        g.gain.setValueAtTime(0.05 + Math.random() * 0.25, t + tt);
      }
      g.gain.setValueAtTime(0.0001, t + dur);
      s.start(t, Math.random() * 2, dur + 0.1);
    },
    slam(px, pz) {
      const [x, z] = around(px, pz, 14 + Math.random() * 12), p = panner(x, 1.2, z, 5, 1, 1.0);
      const t = now();
      const s = noiseSrc(), f = filter('lowpass', 900, 0.8), g = gain(0);
      s.connect(f); f.connect(g); g.connect(p); env(g, t, 0.002, 1.4, 0.35); s.start(t, Math.random() * 2, 0.6);
      const s2 = noiseSrc(), f2 = filter('bandpass', 1400, 3), g2 = gain(0);
      s2.connect(f2); f2.connect(g2); g2.connect(p); env(g2, t + 0.12, 0.002, 0.4, 0.12); s2.start(t + 0.12, Math.random() * 2, 0.3);
    },
    knock(px, pz) {
      const [x, z] = around(px, pz, 8 + Math.random() * 10), p = panner(x, 1.4, z, 3, 1, 0.7);
      const t0 = now(), n = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        const t = t0 + i * 0.32 + (i === n - 1 ? 0.25 : 0);
        const s = noiseSrc(), f = filter('bandpass', 420 + Math.random() * 120, 3), g = gain(0);
        s.connect(f); f.connect(g); g.connect(p); env(g, t, 0.002, 1.3, 0.09); s.start(t, Math.random() * 2, 0.15);
      }
    },
    groan(px, pz) {
      const [x, z] = around(px, pz, 20 + Math.random() * 15), p = panner(x, 1.5, z, 5, 1, 1.0);
      const t = now(), dur = 3 + Math.random() * 2;
      const lp = filter('lowpass', 260, 2), g = gain(0);
      for (const det of [0, 0.9, -1.3]) {
        const o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(48 + det, t); o.frequency.linearRampToValueAtTime(38 + det, t + dur);
        o.connect(lp); o.start(t); o.stop(t + dur + 0.1);
      }
      lp.connect(g); g.connect(p);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.45, t + dur * 0.4); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    },
    crackle(px, pz) {

      for (let i = 0; i < 9; i++) {
        const t = t0 + Math.random() * 0.9;

        s.connect(f); f.connect(g); g.connect(p); env(g, t, 0.001, 0.25 + Math.random() * 0.3, 0.015); s.start(t, Math.random() * 2, 0.05);
      }
    },
  };
  function randomDistant(px, pz) {
    if (!ctx) return;
    const keys = ['thud', 'creak', 'steps', 'whisper', 'slam', 'knock', 'groan', 'crackle', 'thud', 'creak', 'crackle'];
    const k = keys[Math.floor(Math.random() * keys.length)];
    distant[k](px, pz);
    return k;
  }

  // ---------------- per-frame update ----------------
  function setListener(pos, fwd) {
    if (!ctx) return;
    const L = ctx.listener;
    if (L.positionX) {
      L.positionX.value = pos.x; L.positionY.value = pos.y; L.positionZ.value = pos.z;
      L.forwardX.value = fwd.x; L.forwardY.value = fwd.y; L.forwardZ.value = fwd.z;
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else { L.setPosition(pos.x, pos.y, pos.z); L.setOrientation(fwd.x, fwd.y, fwd.z, 0, 1, 0); }
  }
  function setBuzz(level) {
    if (!ctx || !buzzGain) return;
    buzzGain.gain.setTargetAtTime(level, now(), 0.025);
  }
  function setDrone(level) { if (ctx && droneGain) droneGain.gain.setTargetAtTime(level, now(), 0.5); }
  function setVolume(v) { volume = v; if (master) master.gain.setTargetAtTime(v, now(), 0.05); }
  function setHRTF(on) { hrtf = on; }

  return {
    init, footstep, click, zap, paper, heartbeat, breathe, randomDistant, distant, setListener, setBuzz, setDrone,
    setVolume, setHRTF, suspend, resume,
    get ctx() { return ctx; },
    // exposed helpers for other systems
    _: { noiseSrc: (...a) => noiseSrc(...a), filter: (...a) => filter(...a), gain: (...a) => gain(...a), panner: (...a) => panner(...a), env: (...a) => env(...a), setPos: (...a) => setPos(...a), get sfx() { return sfx; }, get revIn() { return revIn; }, get master() { return master; }, get noiseBuf() { return noiseBuf; }, get brownBuf() { return brownBuf; } },
  };
})();

// Ambient sound director: buzz from nearby fixtures, flicker zaps, random distant noises
const ambience = { nextDistant: 6 + Math.random() * 6, prevLevels: new Map(), lastEvent: '' };
function updateAmbientAudio(dt) {
  const px = player.pos.x, pz = player.pos.z;
  const cx = Math.floor(px / CELL), cz = Math.floor(pz / CELL);
  let buzz = 0;
  const seen = new Set();
  for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
    const lx = cx + dx, lz = cz + dz, t = world.lightType(lx, lz);
    if (t < 0 || t === LIGHT.BROKEN) continue;
    const x = (lx + 0.5) * CELL, z = (lz + 0.5) * CELL;
    const d2 = (x - px) ** 2 + (z - pz) ** 2 + 1.3 ** 2;
    const lvl = lightLevelCPU(world.lightSeed(lx, lz), x, z);
    buzz += lvl / (1 + d2 * 0.35);
    const key = ckey(lx, lz); seen.add(key);
    const prev = ambience.prevLevels.get(key);
    if (prev !== undefined && Math.abs(prev - lvl) > 0.5 && d2 < 30 && Math.random() < 0.6) Sound.zap(0.35 / (1 + d2 * 0.15));
    ambience.prevLevels.set(key, lvl);
  }
  if (ambience.prevLevels.size > 200) for (const k of ambience.prevLevels.keys()) if (!seen.has(k)) ambience.prevLevels.delete(k);
  Sound.setBuzz(clamp(buzz, 0, 1.5) * 0.06);
  ambience.nextDistant -= dt;
  if (ambience.nextDistant <= 0) {
    ambience.lastEvent = Sound.randomDistant(px, pz) || '';
    ambience.nextDistant = 9 + Math.random() * 16;
  }
}

// ============================================================================
//  INPUT
// ============================================================================
const keys = Object.create(null);
const input = { lookX: 0, lookY: 0, sensitivity: 1.0, locked: false };

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyC' && !e.repeat) player.crouchToggle = !player.crouchToggle;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.addEventListener('mousemove', (e) => {
  if (!input.locked || game.state !== 'playing') return;
  input.lookX += e.movementX || 0;
  input.lookY += e.movementY || 0;
});
document.addEventListener('pointerlockchange', () => {
  input.locked = document.pointerLockElement === renderer.domElement;
});
function requestLock() {
  try {
    const p = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* pointer lock unavailable (e.g. headless) */ }
}
renderer.domElement.addEventListener('click', () => { if (game.state === 'playing' && !input.locked) requestLock(); });

// ============================================================================
//  PLAYER
// ============================================================================
const player = {
  pos: new THREE.Vector3(CELL * 0.5, 0, CELL * 0.5),
  vel: new THREE.Vector3(),
  yaw: Math.PI, pitch: 0,
  radius: 0.28,
  eye: 1.62,
  crouchToggle: false,
  crouching: false, running: false, moving: false,
  bobPhase: 0, bobAmt: 0,
  speed: 0,
};
const SPEED_WALK = 2.6, SPEED_RUN = 5.2, SPEED_CROUCH = 1.25;
const EYE_STAND = 1.62, EYE_CROUCH = 0.92;

const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _wish = new THREE.Vector3();
function updatePlayer(dt) {
  // --- look ---
  const sens = 0.0022 * input.sensitivity;
  player.yaw -= input.lookX * sens;
  player.pitch -= input.lookY * sens;
  player.pitch = clamp(player.pitch, -1.45, 1.45);
  input.lookX = 0; input.lookY = 0;

  // --- move intent ---
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  player.moving = len > 0.05;

  player.crouching = player.crouchToggle;
  const wantRun = (keys.ShiftLeft || keys.ShiftRight) && player.moving && mz > 0.1 && !player.crouching;
  player.running = wantRun;
  const target = player.crouching ? SPEED_CROUCH : player.running ? SPEED_RUN : SPEED_WALK;

  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _right.set(-_fwd.z, 0, _fwd.x);
  _wish.set(0, 0, 0).addScaledVector(_fwd, mz).addScaledVector(_right, mx).multiplyScalar(target);

  const accel = player.moving ? 10 : 12;
  const k = 1 - Math.exp(-accel * dt);
  player.vel.x += (_wish.x - player.vel.x) * k;
  player.vel.z += (_wish.z - player.vel.z) * k;
  player.speed = Math.hypot(player.vel.x, player.vel.z);

  // --- integrate with sub-steps + collision ---
  const dist = player.speed * dt;
  const steps = Math.max(1, Math.ceil(dist / 0.1));
  for (let i = 0; i < steps; i++) {
    player.pos.x += (player.vel.x * dt) / steps;
    player.pos.z += (player.vel.z * dt) / steps;
    resolveCircle(player.pos, player.radius);
  }

  // --- crouch height & head bob ---
  const eyeTarget = player.crouching ? EYE_CROUCH : EYE_STAND;
  player.eye += (eyeTarget - player.eye) * (1 - Math.exp(-10 * dt));
  const stepLen = player.running ? 1.05 : player.crouching ? 0.55 : 0.75;
  const prevPhase = player.bobPhase;
  player.bobPhase += (player.speed * dt / stepLen) * Math.PI;
  player.bobAmt += ((player.speed > 0.3 ? 1 : 0) - player.bobAmt) * (1 - Math.exp(-6 * dt));
  if (Math.floor(prevPhase / Math.PI) !== Math.floor(player.bobPhase / Math.PI) && player.speed > 0.5) {
    onFootstep();
  }

  const bobScale = player.running ? 0.065 : player.crouching ? 0.025 : 0.04;
  const bobY = Math.abs(Math.sin(player.bobPhase)) * bobScale * player.bobAmt;
  const bobX = Math.cos(player.bobPhase) * bobScale * 0.6 * player.bobAmt;
  camera.position.set(
    player.pos.x + _right.x * bobX,
    player.eye + bobY - bobScale * 0.5 * player.bobAmt,
    player.pos.z + _right.z * bobX
  );
  camera.rotation.set(player.pitch, player.yaw, Math.cos(player.bobPhase) * 0.004 * player.bobAmt);
}

let footstepCount = 0;
function onFootstep() {
  footstepCount++;
  const kind = player.running ? 'run' : player.crouching ? 'crouch' : 'walk';
  Sound.footstep(kind, world.level === 2 ? 'water' : 'carpet');
}

// ============================================================================
//  GAME STATE
// ============================================================================
const game = { state: 'menu', time: 0, danger: 0, heartTimer: 0 };
function startGame() {
  $('startScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  game.state = 'playing';
  Sound.init();
  requestLock();
}
$('btnStart').addEventListener('click', startGame);

// ============================================================================
//  MAIN LOOP
// ============================================================================
const clock = new THREE.Clock();
const _camDir = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (game.state === 'playing') {
    game.time += dt;
    U.uTime.value = (U.uTime.value + dt) % 1000;
    updatePlayer(dt);
    updateChunks(player.pos.x, player.pos.z);
    updateAmbientAudio(dt);
    camera.getWorldDirection(_camDir);
    Sound.setListener(camera.position, _camDir);
    // heartbeat when danger is near
    if (game.danger > 0.04) {
      game.heartTimer -= dt;
      if (game.heartTimer <= 0) { Sound.heartbeat(clamp(0.25 + game.danger, 0, 1.2)); game.heartTimer = 60 / lerp(62, 165, clamp(game.danger, 0, 1)); }
    } else game.heartTimer = 0;
  }
  renderer.render(scene, camera);
}
camera.position.set(player.pos.x, EYE_STAND, player.pos.z);
camera.rotation.set(0, player.yaw, 0);
updateChunks(player.pos.x, player.pos.z, true);
frame();

// Debug / test hook
window.__bk = { THREE, Sound, ambience, game, player, keys, input, camera, get world() { return world; }, chunkMeshes, updateChunks, startGame, get footsteps() { return footstepCount; } };
</script>
