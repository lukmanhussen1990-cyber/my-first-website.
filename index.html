<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>imran</title>
  <meta name="description" content="imran — animated logo with chess cards and sound design.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230000FF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <canvas id="canvas" role="img" aria-label="imran logo animation: chess cards spin, become the name imran, break into pixels and spiral away"></canvas>
    <button class="start" id="start" type="button">
      <span class="start__icon" aria-hidden="true"></span>
      Play with sound
    </button>
  </main>

  <nav class="controls" aria-label="Animation controls">
    <button id="replay" type="button">Replay</button>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <button id="loop" type="button" aria-pressed="true">Loop on</button>
    <a href="media/imran.mp4" download>Video</a>
  </nav>

  <script src="js/glyphs.js"></script>
  <script src="js/chess.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
