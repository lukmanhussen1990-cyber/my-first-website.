<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f2d;
      font-family: system-ui, sans-serif;
      color: #e8f0fe;
    }

    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding: 2.5rem 3rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
    }

    .icon-card img {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 0 18px rgba(74, 108, 247, 0.6));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .icon-card img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 28px rgba(74, 108, 247, 0.9));
    }

    .icon-label {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232, 240, 254, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <h1>My First Website</h1>
  <div class="icon-card">
    <img src="icons/icon-6.svg" alt="Lens icon" width="96" height="96">
    <span class="icon-label">icon-6 &mdash; Lens</span>
  </div>
</body>
</html>
