<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070405">
<meta name="description" content="Elemental cards — Ember, Solar, Breeze and Bloom.">
<title>Elemental Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --u: 1px;                 /* 1 design unit (1px of the 1920-wide reference) */
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #070405; }
  body {
    font-family: var(--sans);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #070405;
    touch-action: pinch-zoom;
    contain: strict;
  }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- background tint per element ---------- */
  #bg { background: radial-gradient(ellipse 70% 60% at 50% 42%, #0f0607 0%, #0a0506 45%, #060304 100%); }
  #bg .glow, #bg .fline { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  #bg .floor { position: absolute; inset: 0; }

  canvas.layer { display: block; }
  #reflect { opacity: .46; will-change: filter; }

  /* ---------- cards ---------- */
  #track { position: absolute; inset: 0; pointer-events: none; }
  .card {
    position: absolute;
    left: 0; top: 0;
    width: calc(var(--u) * 304);
    height: calc(var(--u) * 491);
    border-radius: calc(var(--u) * 152);
    overflow: hidden;
    background: #000;
    pointer-events: auto;
    cursor: pointer;
    outline: none;
    will-change: transform, opacity;
    transform-origin: 50% 50%;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    --act: 0;
    --hov: 0;
  }
  .card.is-center { cursor: default; }
  .card > div { position: absolute; inset: 0; border-radius: inherit; }
  .card .tint { background: var(--tint); }
  .card .mesh { opacity: 0; background: var(--mesh); }
  .card .mesh i {
    position: absolute;
    left: 0; top: 0;
    width: calc(var(--u) * 320);
    height: calc(var(--u) * 320);
    margin: calc(var(--u) * -160) 0 0 calc(var(--u) * -160);
    border-radius: 50%;
    will-change: transform;
  }
  .card .rim { opacity: 0; }
  .card .sheen {
    background:
      radial-gradient(ellipse 80% 30% at 50% 0%, rgba(255,255,255,.075), rgba(255,255,255,0) 72%),
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 30%);
    opacity: calc(1 + var(--hov) * .8);
  }
  .card .edge {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,calc(.12 + var(--hov) * .06 + var(--act) * .1)),
      inset 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(255,255,255,.05);
    pointer-events: none;
  }
  .card .content { color: #fff; text-align: center; }
  .card .num {
    position: absolute; left: 0; right: 0;
    top: calc(var(--u) * 35.5);
    font: 500 calc(var(--u) * 13)/1 var(--mono);
    letter-spacing: .14em;
    padding-left: .14em;
    opacity: calc(.52 + var(--act) * .3 + var(--hov) * .1);
  }
  .card .icon {
    position: absolute;
    left: 50%;
    top: calc(var(--u) * 211);
    width: calc(var(--u) * 120);
    height: calc(var(--u) * 144);
    margin: calc(var(--u) * -72) 0 0 calc(var(--u) * -60);
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: calc(.7 + var(--act) * .3 + var(--hov) * .1);
  }
  .card .icon .dot { fill: currentColor; stroke: none; }
  .card .title {
    position: absolute; left: 0; right: 0;
    top: calc(var(--u) * 347.5);
    font: 700 calc(var(--u) * 38)/1 var(--sans);
    letter-spacing: -.025em;
    opacity: calc(.65 + var(--act) * .35 + var(--hov) * .1);
  }
  .card .sub {
    position: absolute; left: 0; right: 0;
    top: calc(var(--u) * 399);
    font: 500 calc(var(--u) * 11.5)/1 var(--mono);
    letter-spacing: .21em;
    padding-left: .21em;
    white-space: nowrap;
    opacity: calc(.55 + var(--act) * .35 + var(--hov) * .1);
  }
  .card:focus-visible .edge { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }

  /* inactive bottom tints */
  .card[data-el="ember"]  { --tint: radial-gradient(ellipse 80% 26% at 50% 100%, rgba(62,0,4,.85), rgba(62,0,4,0) 100%), linear-gradient(180deg, rgba(48,0,2,0) 50%, rgba(48,0,2,.82) 78%, #300002 94%); }
  .card[data-el="solar"]  { --tint: radial-gradient(ellipse 58% 24% at 66% 97%, rgba(98,30,14,.8), rgba(98,30,14,0) 100%), linear-gradient(180deg, rgba(74,7,13,0) 47%, rgba(74,7,13,.82) 76%, #4d080e 94%); }
  .card[data-el="breeze"] { --tint: radial-gradient(ellipse 80% 26% at 50% 100%, rgba(26,70,38,.8), rgba(26,70,38,0) 100%), linear-gradient(180deg, rgba(18,55,27,0) 52%, rgba(18,55,27,.82) 80%, #12371b 94%); }
  .card[data-el="bloom"]  { --tint: radial-gradient(ellipse 80% 26% at 50% 100%, rgba(62,0,12,.85), rgba(62,0,12,0) 100%), linear-gradient(180deg, rgba(47,0,4,0) 50%, rgba(47,0,4,.82) 78%, #300005 94%); }

  /* ---------- grain & vignette ---------- */
  #grain, #grainBg {
    position: absolute;
    left: -256px; top: -256px;
    right: -256px; bottom: -256px;
    pointer-events: none;
    will-change: transform;
  }
  /* background grain: ~±3/255 in every tone, like the reference (cards stay clean) */
  #grainBg { mix-blend-mode: hard-light; }
  /* faint animated film grain over everything */
  #grain { mix-blend-mode: overlay; opacity: .14; }
  #vignette {
    background:
      radial-gradient(ellipse 78% 74% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 86%, rgba(0,0,0,.62) 100%);
  }

  /* ---------- sound toggle ---------- */
  #sound {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.72);
    cursor: pointer;
    opacity: .62;
    transition: opacity .25s ease, background-color .25s ease, border-color .25s ease;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #sound:hover, #sound:focus-visible { opacity: 1; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.24); outline: none; }
  #sound svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound[aria-pressed="false"] .on { display: none; }
  #sound[aria-pressed="false"] .off { display: inline; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="stage" aria-roledescription="carousel" aria-label="Elemental cards. Use the left and right arrow keys to switch.">
  <div id="bg" class="layer" aria-hidden="true">
    <div class="glow" data-el="ember"></div>
    <div class="glow" data-el="solar"></div>
    <div class="glow" data-el="breeze"></div>
    <div class="glow" data-el="bloom"></div>
    <div class="floor"></div>
    <div class="fline" data-el="ember"></div>
    <div class="fline" data-el="solar"></div>

  <canvas id="reflect" class="layer" aria-hidden="true"></canvas>

  <div id="grainBg" aria-hidden="true"></div>
  <div id="track">
    <div class="card" data-el="ember" role="button" tabindex="-1" aria-label="01 Ember — Fire · Courage">
      <div class="tint"></div>

        <svg class="icon" viewBox="-60 -72 120 144">
          <circle class="dot" cx="-5.5" cy="-57.5" r="2.7"/>

          <path d="M0.5 44C18 44 30.5 31 30.5 15C30.5-2 22-18 7-42.5C5-27 1-13-4.5-3.5C-7.5-9-11-14-14.5-20C-23-10-30 2-30 15C-30 31-17.5 44 0.5 44Z"/>

      <div class="tint"></div>

<button id="sound" type="button" aria-pressed="true" aria-label="Sound on">

    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
  </svg>
</button>

<script>
(() => {
'use strict';

/* =====================================================================
   Constants & helpers
   ===================================================================== */
// Design units (du): 1du = 1px of the 1920x1440 reference video.
const CW = 304, CH = 491, CR = 152, CH2 = 93.5;   // card width/height, cap radius, straight half-length
const SPACING = 606;                              // distance between card centres
const FLOOR = 420;                                // floor line below the card centre
const SLIDE_MS = 440;
const TAU = Math.PI * 2;

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInQuad = t => clamp(t) * clamp(t);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const wrap4 = x => x - 4 * Math.floor((x + 2) / 4);       // -> [-2, 2)
const mod4 = n => ((n % 4) + 4) % 4;
// critically under-damped spring step response (0 -> 1 with overshoot)
const spring = (t, w = 17, z = .52) => {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
};

function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x, d = dx(t);
      if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    if (t < 0 || t > 1 || Math.abs(sx(t) - x) > 1e-4) {
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    }
    return sy(t);
  };
}
// Measured from the reference video: quick start, long soft landing.
const slideEase = cubicBezier(.26, .16, .16, 1);

const reducedMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
let REDUCED = reducedMQ.matches;
let PS = REDUCED ? .35 : 1;                // particle scale
if (reducedMQ.addEventListener) reducedMQ.addEventListener('change', e => { REDUCED = e.matches; PS = REDUCED ? .35 : 1; });

/* ---------- capsule geometry (du, centred on the card) ---------- */
function capsulePath(ctx, x, y, sc, inflate = 0) {
  const r = (CR + inflate) * sc, h = CH2 * sc;
  ctx.beginPath();
  ctx.arc(x, y - h, r, Math.PI, 0);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x, y + h, r, 0, Math.PI);
  ctx.closePath();
}
// distance from the card centre to the capsule edge along angle a
function capsuleRadius(a, inflate = 0) {
  const r = CR + inflate, c = Math.cos(a), s = Math.sin(a);
  const ac = Math.abs(c);
  if (ac > 1e-6) {
    const t = r / ac;
    if (Math.abs(t * s) <= CH2) return t;
  }
  const cy = s >= 0 ? CH2 : -CH2;
  const b = s * cy;
  return b + Math.sqrt(Math.max(0, b * b - cy * cy + r * r));
}
// point on the outline by arc-length fraction u, with outward normal
const PERIM = TAU * CR + 4 * CH2;
function capsulePoint(u, inflate = 0) {
  const r = CR + inflate;
  let d = ((u % 1) + 1) % 1 * PERIM;
  const arc = Math.PI * CR, side = 2 * CH2;
  if (d < arc) {                       // top cap, from left to right
    const a = Math.PI + d / CR;
    return { x: Math.cos(a) * r, y: -CH2 + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) };
  }
  d -= arc;
  if (d < side) return { x: r, y: -CH2 + d, nx: 1, ny: 0 };
  d -= side;
  if (d < arc) {                       // bottom cap, right to left
    const a = d / CR;
    return { x: Math.cos(a) * r, y: CH2 + Math.sin(a) * r, nx: Math.cos(a), ny: Math.sin(a) };
  }
  d -= arc;
  return { x: -r, y: CH2 - d, nx: -1, ny: 0 };
}
function glowStroke(ctx, C, inflate, passes, alpha = 1) {
  capsulePath(ctx, C.x, C.y, C.sc, inflate);
  for (const [lw, col, a] of passes) {
    ctx.globalAlpha = clamp(a * alpha);
    ctx.lineWidth = Math.max(.6, lw * C.sc);
    ctx.strokeStyle = col;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- sprites ---------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function dotSprite(stops, size = 64) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const SPR = {
  spark: dotSprite([[0, 'rgba(255,253,248,1)'], [.12, 'rgba(255,242,228,.95)'], [.26, 'rgba(255,172,134,.4)'], [.5, 'rgba(240,80,50,.08)'], [1, 'rgba(220,40,20,0)']]),
  ember: dotSprite([[0, 'rgba(255,214,200,1)'], [.12, 'rgba(255,110,90,.9)'], [.3, 'rgba(230,40,30,.35)'], [.6, 'rgba(200,20,10,.08)'], [1, 'rgba(180,10,0,0)']]),
  gold: dotSprite([[0, 'rgba(255,253,236,1)'], [.12, 'rgba(255,230,150,.95)'], [.28, 'rgba(250,190,70,.42)'], [.6, 'rgba(220,150,30,.1)'], [1, 'rgba(200,120,20,0)']]),
  pink: dotSprite([[0, 'rgba(255,240,248,1)'], [.14, 'rgba(255,150,200,.9)'], [.32, 'rgba(255,70,150,.35)'], [.65, 'rgba(230,30,120,.08)'], [1, 'rgba(220,20,110,0)']]),
  teal: dotSprite([[0, 'rgba(230,255,250,1)'], [.14, 'rgba(140,250,215,.9)'], [.32, 'rgba(60,220,170,.35)'], [.65, 'rgba(30,180,130,.08)'], [1, 'rgba(20,160,120,0)']]),
  soft: dotSprite([[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']], 128)
};
// light ray: bright at x=0 fading to the right, gaussian across
SPR.ray = (() => {
  const W = 512, H = 64, c = makeCanvas(W, H), g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0, 'rgba(255,248,220,0)');
  lg.addColorStop(.025, 'rgba(255,246,210,1)');
  lg.addColorStop(.14, 'rgba(255,222,128,.86)');
  lg.addColorStop(.42, 'rgba(240,180,62,.44)');
  lg.addColorStop(.72, 'rgba(200,140,34,.15)');
  lg.addColorStop(1, 'rgba(164,121,27,0)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  // across the ray: thin bright core + soft wings
  g.globalCompositeOperation = 'destination-in';
  const vg = g.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 16; i++) {
    const y = (i / 16 - .5) * H;
    const v = .78 * Math.exp(-((y / 4.2) ** 2)) + .3 * Math.exp(-((y / 15) ** 2));
    vg.addColorStop(i / 16, `rgba(0,0,0,${Math.min(1, v).toFixed(3)})`);
  }
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

// Lotus petal sprite, modelled on the reference: a soft rounded oval with a deep magenta core
// that brightens to a white-pink rim over ~25du, a frosted pale base, faint veins and fine grain.
// Built per pixel from a distance-to-edge field (no stroke seams). Base at bottom centre, tip at top.
const PETAL = (() => {
  const L = 420, Wd = 190, pad = 8;
  const cw = Wd + pad * 2, ch = L + pad * 2;

        ctx.globalAlpha = a;
        ctx.fillStyle = p.col;

}

const FXS_LIST = [new EmberFX(cards[0]), new SolarFX(cards[1]), new BreezeFX(cards[2]), new BloomFX(cards[3])];

/* =====================================================================
   Audio (Web Audio, everything synthesised)
   ===================================================================== */
const AUDIO = (() => {
  let ctx = null, master = null, noise = null, enabled = true, wantLoop = -1;
  try { enabled = localStorage.getItem('elemental-sound') !== 'off'; } catch (e) {}
  const loops = [null, null, null, null];

  function ensure() {
    if (ctx) return ctx;

    if (!AC) return null;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5;
    comp.attack.value = .004; comp.release.value = .25;
    master = ctx.createGain();
    master.gain.value = enabled ? .75 : 0;
    master.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    noise = ctx.createBuffer(1, len, ctx.sampleRate);

  }
  const ready = () => ctx && enabled && ctx.state === 'running';

    bp.frequency.exponentialRampToValueAtTime(520, t + .3);

    o.type = 'triangle'; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(1100, t + .025);

    o.connect(cg); cg.connect(master); o.start(t); o.stop(t + .05);
  }
  function tick() {
    if (!ready()) return;
    const t = ctx.currentTime + .003;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(3100, t); o.frequency.exponentialRampToValueAtTime(2100, t + .018);
    g.gain.setValueAtTime(.016, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .04);
  }
  function sparkle(base = 1) {
    if (!ready()) return;
    const t = ctx.currentTime + .02;
    const notes = [4186, 3520, 3136, 2637, 2349, 2093];
    for (let i = 0; i < 6; i++) tone(t + i * .055 + rnd(0, .02), notes[i] * base * rnd(.995, 1.005), 'sine', .018 * (1 - i * .12), .004, .32);
    const s = noiseSrc(t, .5), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 6500;
    env(g, t, .03, .035, .42);
    s.connect(hp); hp.connect(g); g.connect(master);
  }
  function introEmber() {
    const t = ctx.currentTime + .01;
    // ignition whoosh
    const s = noiseSrc(t, 1.2), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = 'lowpass'; lp.Q.value = .7;
    lp.frequency.setValueAtTime(220, t); lp.frequency.exponentialRampToValueAtTime(3200, t + .32); lp.frequency.exponentialRampToValueAtTime(800, t + 1.1);
    env(g, t, .13, .26, 1);
    s.connect(lp); lp.connect(g); g.connect(master);
    // low body
    const s2 = noiseSrc(t, 1.2), lp2 = ctx.createBiquadFilter(), g2 = ctx.createGain();
    lp2.type = 'lowpass'; lp2.frequency.value = 170;
    env(g2, t, .08, .5, 1);
    s2.connect(lp2); lp2.connect(g2); g2.connect(master);

    const t = ctx.currentTime + .01;

    hp.type = 'highpass'; hp.frequency.value = 5200;
    env(g, t, .32, .03, .7);

  }
  function introBreeze() {
    const t = ctx.currentTime + .01;
    const s = noiseSrc(t, 1.6), bp = ctx.createBiquadFilter(), g = ctx.createGain(), p = panner(-.6);
    bp.type = 'bandpass'; bp.Q.value = 1.3;
    bp.frequency.setValueAtTime(320, t); bp.frequency.exponentialRampToValueAtTime(1500, t + .5); bp.frequency.exponentialRampToValueAtTime(420, t + 1.4);
    env(g, t, .36, .32, 1.1);
    if (p.pan) { p.pan.setValueAtTime(-.65, t); p.pan.linearRampToValueAtTime(.45, t + 1.2); }
    s.connect(bp); bp.connect(g); g.connect(p); p.connect(master);
    const s2 = noiseSrc(t, 1.3), bp2 = ctx.createBiquadFilter(), g2 = ctx.createGain();
    bp2.type = 'bandpass'; bp2.Q.value = 4; bp2.frequency.setValueAtTime(900, t); bp2.frequency.exponentialRampToValueAtTime(2400, t + .6); bp2.frequency.exponentialRampToValueAtTime(1100, t + 1.2);
    env(g2, t, .4, .06, .8);
    s2.connect(bp2); bp2.connect(g2); g2.connect(master);
  }
  function introBloom() {
    const t = ctx.currentTime + .01;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.connect(master);
    [523.25, 659.25, 783.99, 987.77, 1174.66, 1318.51, 1567.98].forEach((f, i) => {
      const tt = t + i * .068;
      tone(tt, f, 'triangle', .05, .004, 1.3, lp);
      tone(tt, f * 2, 'sine', .012, .004, .6, lp);
    });
    [261.63, 392, 493.88, 659.25].forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.02, t + .6); g.gain.exponentialRampToValueAtTime(.0001, t + 2.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 2.5);
    });

    bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = .7;

    s.connect(bp); bp.connect(g); g.connect(master);

    const L = { out, nodes, next: ctx.currentTime + .1, kind: i };

      const s = noiseSrc(ctx.currentTime), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = .5; lp.type = 'lowpass'; lp.frequency.value = 1800;

        if (L.kind === 0) { pop(L.next, L.out, rnd(.015, .09)); L.next += -Math.log(1 - Math.random()) / 7; }

/* =====================================================================
   Carousel state
   ===================================================================== */
let simTime = 0;                 // seconds
let pos = 0, target = 0, anim = null;
let active = 0;
let pendingIntro = null;
let fadeAnim = null;             // reduced-motion crossfade

function setActive(next, dir) {
  const prev = active;
  active = next;
  FXS_LIST[prev].outro();
  AUDIO.outro(prev);
  pendingIntro = { i: next, at: simTime + (REDUCED ? .12 : .25) };
  AUDIO.setLoop(next);
  // gradients
  const now = simTime;
  cards.forEach(c => {
    if (c.i === next) c.meshAnim = { from: c.meshA, to: 1, t0: now + .14, dur: .24 };
    else if (c.meshA > 0 || c.meshAnim) c.meshAnim = { from: c.meshA, to: 0, t0: now, dur: .2 };
  });
  liveEl.textContent = `${ELEMENTS[next].name} — ${ELEMENTS[next].sub.replace(' · ', ', ').toLowerCase()}`;
}

function move(dir) {
  if (!dir) return;
  AUDIO.unlock();
  target += dir;
  const next = mod4(target);
  if (REDUCED) {
    fadeAnim = { t0: simTime, dur: .36, switched: false, to: target };
  } else {
    anim = { from: pos, to: target, t0: simTime, dur: SLIDE_MS / 1000 * Math.min(1.6, Math.max(1, Math.abs(target - pos))) };
  }
  AUDIO.swoosh(dir);
  setActive(next, dir);
}
function goToCard(i) {
  const off = Math.round(wrap4(i - target));
  if (off === 0) return;
  move(off > 0 ? 1 : -1);
  if (Math.abs(off) === 2) move(off > 0 ? 1 : -1);
}

/* =====================================================================
   Input
   ===================================================================== */
cardsEl.forEach((el, i) => {
  el.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    AUDIO.unlock();
    goToCard(i);
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToCard(i); }
  });
  el.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse') return;
    cards[i].hoverT = 1;
    if (Math.round(wrap4(i - pos)) !== 0 && Math.abs(wrap4(i - pos)) < 1.4) AUDIO.tick();
  });
  el.addEventListener('pointerleave', () => { cards[i].hoverT = 0; });
});

window.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
});

// swipe (touch / pen / mouse drag)
let drag = null, suppressClick = false;
stage.addEventListener('pointerdown', e => {
  AUDIO.unlock();
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, type: e.pointerType };
});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const thr = drag.type === 'mouse' ? 60 : 36;
  if (Math.abs(dx) > thr && Math.abs(dx) > Math.abs(dy) * 1.2 && performance.now() - drag.t < 900) {
    suppressClick = true;
    setTimeout(() => (suppressClick = false), 0);
    move(dx < 0 ? 1 : -1);
  }
  drag = null;
});
window.addEventListener('pointercancel', () => (drag = null));

// wheel / trackpad: one gesture = one move
let wheelAcc = 0, wheelLock = false, wheelQuiet = null, wheelLast = 0, wheelMoveAt = 0, wheelPeak = 0;
window.addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  const mag = Math.abs(d) * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const now = performance.now();
  clearTimeout(wheelQuiet);
  wheelQuiet = setTimeout(() => { wheelLock = false; wheelAcc = 0; wheelPeak = 0; }, 170);
  if (wheelLock) {
    // a fresh, stronger flick after the inertia has decayed starts a new gesture
    if (now - wheelMoveAt > 380 && mag > wheelPeak * 1.8 && mag > 12) { wheelLock = false; wheelAcc = 0; }
    else { wheelPeak = Math.min(wheelPeak, mag) || mag; wheelLast = now; return; }
  }
  wheelAcc += Math.sign(d) * mag;
  wheelLast = now;
  if (Math.abs(wheelAcc) >= 34) {
    move(wheelAcc > 0 ? 1 : -1);
    wheelLock = true; wheelMoveAt = now; wheelPeak = mag; wheelAcc = 0;
  }
}, { passive: false });

// sound toggle
const soundBtn = $('#sound');
function syncSoundBtn() {
  soundBtn.setAttribute('aria-pressed', AUDIO.enabled ? 'true' : 'false');
  soundBtn.setAttribute('aria-label', AUDIO.enabled ? 'Sound on' : 'Sound off');
  soundBtn.title = AUDIO.enabled ? 'Sound on' : 'Sound off';
}
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  AUDIO.setEnabled(!AUDIO.enabled);
  syncSoundBtn();
});
soundBtn.addEventListener('pointerdown', e => e.stopPropagation());
syncSoundBtn();

/* =====================================================================
   Frame update
   ===================================================================== */
function updateCards(dt) {
  // slide animation
  if (anim) {
    const k = clamp((simTime - anim.t0) / anim.dur);
    pos = lerp(anim.from, anim.to, slideEase(k));
    if (k >= 1) { pos = anim.to; anim = null; }
  }
  let fade = 1;
  if (fadeAnim) {
    const k = clamp((simTime - fadeAnim.t0) / fadeAnim.dur);
    if (k >= .4 && !fadeAnim.switched) { fadeAnim.switched = true; pos = fadeAnim.to; }
    fade = k < .4 ? 1 - k / .4 : (k - .4) / .6;
    if (k >= 1) fadeAnim = null;
  }
  for (const c of cards) {
    const off = wrap4(c.i - pos);
    const aoff = Math.abs(off);
    c.off = off;
    // hover (only side cards that are settled)
    const canHover = Math.abs(Math.round(off)) === 1 && Math.abs(off - Math.round(off)) < .25;
    const ht = c.hoverT && canHover ? 1 : 0;
    c.hover += (ht - c.hover) * (1 - Math.exp(-dt / .12));
    // gradient fade
    if (c.meshAnim) {
      const m = c.meshAnim, k = clamp((simTime - m.t0) / m.dur);
      if (simTime >= m.t0) c.meshA = lerp(m.from, m.to, m.to < m.from ? 1 - (1 - k) * (1 - k) : k);
      if (k >= 1 && simTime >= m.t0) { c.meshA = m.to; c.meshAnim = null; }
    }
    c.act = c.meshA;
    const sc = K * (1 + .015 * Math.max(0, 1 - aoff));
    c.sc = sc;
    c.x = CX + off * SPACING * K;
    c.y = CY - 12 * K * c.hover;
    const sideFade = 1 - smooth(1.05, 1.9, aoff);
    const isAway = fadeAnim && Math.round(wrap4(c.i - pos)) !== 0 ? 1 : 1;
    c.opacity = sideFade * (fadeAnim ? fade : 1) * isAway;
    const el = c.el;
    el.style.transform = `translate3d(${(c.x - CW * K / 2).toFixed(2)}px, ${(c.y - CH * K / 2).toFixed(2)}px, 0) scale(${(sc / K).toFixed(4)})`;
    el.style.opacity = c.opacity.toFixed(3);
    el.style.zIndex = String(10 - Math.round(aoff * 2));
    el.style.visibility = c.opacity < .01 ? 'hidden' : 'visible';
    const center = Math.round(wrap4(c.i - target)) === 0;
    el.classList.toggle('is-center', center);
    el.tabIndex = Math.abs(Math.round(wrap4(c.i - target))) === 1 ? 0 : -1;
    const vars = `${c.act.toFixed(3)}|${c.hover.toFixed(3)}`;
    if (vars !== c.lastVars) {
      c.lastVars = vars;
      el.style.setProperty('--act', c.act.toFixed(3));
      el.style.setProperty('--hov', c.hover.toFixed(3));
    }
    // mesh: fades out from the centre (like burning paper) and fills edge-first
    if (c.meshA !== c.lastMesh) {
      c.lastMesh = c.meshA;
      const m = c.meshA, st = c.mesh.style;
      st.opacity = Math.min(1, m * 2.6).toFixed(3);
      let mi = 'none';
      if (m < .995) {
        const r = (1 - m) * 122;
        mi = `radial-gradient(ellipse 70% 58% at 50% 46%, rgba(0,0,0,0) ${(r - 36).toFixed(1)}%, #000 ${(r + 6).toFixed(1)}%)`;
      }
      st.webkitMaskImage = mi; st.maskImage = mi;
    }
    if (c.meshA > .001) {
      const tt = simTime * (REDUCED ? .3 : 1);
      for (const b of c.blobs) {
        b.x = b.x0 + Math.sin(tt * b.wx + b.px) * b.ax;
        b.y = b.y0 + Math.sin(tt * b.wy + b.py) * b.ay;
        b.s = b.s0 * (1 + .12 * Math.sin(tt * b.ws + b.px * 1.3));
        b.el.style.transform = `translate3d(${(b.x * K).toFixed(1)}px, ${(b.y * K).toFixed(1)}px, 0) scale(${b.s.toFixed(3)})`;
      }
    }
  }
}

function updateRims() {
  // inner glow on the card edge, driven by the element effects
  const E = FXS_LIST;
  const specs = [
    [E[0].burn * 1.0 + E[0].rim * .35, 'rgba(255,70,40,', 26, 4],
    [Math.max(E[1].rim * .62, E[1].ring * .6), 'rgba(255,236,180,', 20, 2],
    [E[2].glow * .3, 'rgba(120,255,210,', 20, 2],
    [E[3].rim * .22, 'rgba(255,170,215,', 22, 2]
  ];
  specs.forEach(([a, col, blur, spread], i) => {
    const c = cards[i];
    const v = clamp(a);
    if (Math.abs(v - c.rim.a) < .003) return;
    c.rim.a = v;
    if (!c.rim.css) {
      c.rim.css = `inset 0 0 calc(var(--u) * ${blur}) calc(var(--u) * ${spread}) ${col}.9), inset 0 0 calc(var(--u) * 5) calc(var(--u) * 1) ${col}.85)`;
      c.rimEl.style.boxShadow = c.rim.css;
    }
    c.rimEl.style.opacity = v.toFixed(3);
  });
}

function updateBg() {
  FXS_LIST.forEach((f, i) => {
    const v = f.presence.toFixed(3);
    if (glowEls[i]._v !== v) { glowEls[i]._v = v; glowEls[i].style.opacity = v; flineEls[i].style.opacity = v; }
  });
}

/* =====================================================================
   Render
   ===================================================================== */
function cardC(c) { return { x: c.x, y: c.y, sc: c.sc, o: c.opacity }; }

function render() {
  const fx = FXS_LIST;
  // fire (WebGL)
  if (FIRE && FIRE.ok) {
    const e = fx[0];
    if (e.active && (e.amp > .003 || e.rim > .003)) FIRE.render(cardC(cards[0]), simTime, e.amp, e.rim);
    else FIRE.clear();
  }
  for (const [ctx, fn] of [[ctxBack, 'drawBack'], [ctxFront, 'drawFront']]) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.setTransform(FXS, 0, 0, FXS, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const f of fx) {
      if (!f.active) continue;
      const C = cardC(f.card);
      if (C.o <= .01) continue;
      ctx.globalAlpha = 1;
      f[fn](ctx, C, simTime);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  renderReflection();
}

function renderReflection() {
  const ctx = ctxRef, rh = VH - FY;
  if (rh < 4) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cvRef.width, cvRef.height);
  // mirror around the floor line: scene (X, Y) -> canvas (X, FY - Y)
  ctx.setTransform(REFS, 0, 0, -REFS, 0, REFS * FY);
  const y0 = Math.max(0, FY - rh);
  // cards (simplified)
  for (const c of cards) {
    if (c.opacity < .02) continue;
    const top = c.y - CH * c.sc / 2;
    if (top + CH * c.sc < y0) continue;
    ctx.save();
    ctx.globalAlpha = c.opacity;
    capsulePath(ctx, c.x, c.y, c.sc);
    ctx.clip();
    ctx.fillStyle = '#000';
    ctx.fillRect(c.x - CR * c.sc, top, CW * c.sc, CH * c.sc);
    const T = c.E.tint;
    const lg = ctx.createLinearGradient(0, top, 0, top + CH * c.sc);
    lg.addColorStop(.5, T[1]); lg.addColorStop(.94, T[2]);
    ctx.fillStyle = lg;
    ctx.fillRect(c.x - CR * c.sc, top, CW * c.sc, CH * c.sc);
    if (c.meshA > .01) {
      ctx.globalAlpha = c.opacity * c.meshA * .8;
      ctx.fillStyle = c.E.mesh.base;
      ctx.fillRect(c.x - CR * c.sc, top, CW * c.sc, CH * c.sc);
      for (const b of c.blobs) {
        const bx = c.x - CR * c.sc + b.x * c.sc, by = top + b.y * c.sc, R = 160 * b.s * c.sc;
        const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
        g.addColorStop(0, rgba(b.c, 1)); g.addColorStop(.6, rgba(b.c, .45)); g.addColorStop(1, rgba(b.c, 0));
        ctx.fillStyle = g; ctx.fillRect(bx - R, by - R, R * 2, R * 2);
      }
    }
    ctx.globalAlpha = c.opacity * (.66 + .34 * c.act + .1 * c.hover);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `700 ${38 * c.sc}px Inter, "Helvetica Neue", Arial, sans-serif`;
    ctx.fillText(c.E.name, c.x, top + 380 * c.sc);
    ctx.globalAlpha *= .8;
    ctx.font = `500 ${11.5 * c.sc}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.fillText(c.E.sub, c.x, top + 409 * c.sc);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = c.opacity * .5;
    capsulePath(ctx, c.x, c.y, c.sc);
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
    ctx.restore();
  }
  // effects (weaker than the cards: glows spread a lot once blurred)
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .6;
  const srcY = y0 * FXS, srcH = (FY - y0) * FXS;
  if (srcH > 1) {
    if (FIRE && FIRE.ok && FXS_LIST[0].active) {
      const s = cvFire.width / VW;
      ctx.drawImage(cvFire, 0, y0 * s, cvFire.width, (FY - y0) * s, 0, y0, VW, FY - y0);
    }
    ctx.drawImage(cvBack, 0, srcY, cvBack.width, srcH, 0, y0, VW, FY - y0);
    ctx.drawImage(cvFront, 0, srcY, cvFront.width, srcH, 0, y0, VW, FY - y0);
  }
  ctx.globalAlpha = 1;
  // fade with distance from the floor
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'destination-in';
  const fg = ctx.createLinearGradient(0, 0, 0, cvRef.height);
  fg.addColorStop(0, 'rgba(0,0,0,1)');
  fg.addColorStop(Math.min(1, 330 * K / rh), 'rgba(0,0,0,.72)');
  fg.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, 0, cvRef.width, cvRef.height);
  ctx.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   Main loop
   ===================================================================== */
function step(dt, draw = true) {
  simTime += dt;
  if (pendingIntro && simTime >= pendingIntro.at) {
    const i = pendingIntro.i;
    pendingIntro = null;
    if (i === active) { FXS_LIST[i].intro(); AUDIO.intro(i); }
  }
  updateCards(dt);
  for (const f of FXS_LIST) f.update(dt);
  updateRims();
  updateBg();
  updateGrain(dt);
  if (draw) render();
}

let raf = 0, last = 0, running = false;
const MANUAL = /[?&]manual\b/.test(location.search);
function frame(ts) {
  if (!running) return;
  const dt = last ? Math.min(.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
  last = ts;
  step(dt);
  raf = requestAnimationFrame(frame);
}
function start() {
  if (running || MANUAL) return;
  running = true; last = 0;
  raf = requestAnimationFrame(frame);
}
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); AUDIO.suspend(); }
  else { AUDIO.resume(); start(); }
});

let resizeT = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeT);
  resizeT = requestAnimationFrame(() => { layout(); if (MANUAL) step(0); });
});

layout();
// Start state: Ember in the centre, Bloom left, Solar right.
cards[0].meshA = 1;
liveEl.textContent = 'Ember — fire, courage';
FXS_LIST[0].intro();
AUDIO.setLoop(0);
step(0);
const boot = () => { if (!document.hidden) start(); };
if (document.fonts && document.fonts.ready) {
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]).then(boot);
} else boot();

// Test hooks: ?manual freezes the clock so frames can be stepped deterministically.
if (MANUAL) {
  window.__ec = {
    advance(sec, h = 1 / 60) { while (sec > 1e-9) { const d = Math.min(h, sec); sec -= d; step(d, sec <= 1e-9); } },
    move, goToCard,
    hover(i, on) { cards[i].hoverT = on ? 1 : 0; },
    state: () => ({ pos, target, active, t: simTime, fx: FXS_LIST.map(f => [f.state, +f.t.toFixed(3), +f.presence.toFixed(3)]) }),
    sprite: name => ({ petal: PETAL.body, frost: PETAL.frost, petalGlow: PETAL.glow })[name].toDataURL()
  };
}
})();
</script>
</body>
</html>
