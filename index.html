<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SHADOW BLADE: OLD CITY</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="SHADOW BLADE: OLD CITY - a retro 2008-style mobile stealth-action game in one HTML file. Keypad controls: 4/6 move, 2 jump, 8 crouch, 5 attack, 0 stealth, * block, # pause.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07060c;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Courier New",Courier,monospace;color:#cfd3e6}
button{appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;font:inherit;color:inherit;background:none;cursor:pointer;touch-action:none;outline:none}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#241c3b 0%,#120d20 45%,#07060c 100%)}
#app::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px)}

/* ---------- phone ---------- */
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#phone{position:relative;width:300px;padding:16px 18px 22px;border-radius:40px 40px 52px 52px;
  background:linear-gradient(158deg,#454b63 0%,#272b3c 28%,#171a27 62%,#0e1019 100%);
  box-shadow:0 0 0 2px #05060a,0 0 0 4px #858ba3,0 0 0 5px #20222f,0 22px 46px rgba(0,0,0,.75),
    inset 0 3px 4px rgba(255,255,255,.22),inset 0 -4px 8px rgba(0,0,0,.65)}
#ph-top{height:30px;position:relative;display:flex;align-items:center;justify-content:center}
#ph-top .spk{width:70px;height:7px;border-radius:4px;background:#05060a;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.18)}
#ph-top .cam{position:absolute;right:30px;top:10px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#6c7cff 0,#1a1d38 45%,#05060a 70%);box-shadow:0 0 0 2px #0b0c14}
#ph-top .brand{position:absolute;left:26px;top:7px;font:700 11px/1 Arial,Helvetica,sans-serif;letter-spacing:3px;color:#aab0c6;text-shadow:0 1px 0 #000}
#bezel{background:#050509;border-radius:14px;padding:12px;
  box-shadow:inset 0 0 0 2px #1b1d28,inset 0 3px 9px #000,0 1px 0 rgba(255,255,255,.16),0 0 0 3px #0c0d15}
#screen{position:relative;width:240px;height:320px;background:#000;overflow:hidden;border-radius:2px}
#view{position:absolute;left:0;top:0;width:240px;height:320px;display:block;image-rendering:auto;touch-action:none}
#view.px{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#grid{position:absolute;inset:0;pointer-events:none;opacity:0;
  background-image:linear-gradient(to right,rgba(0,0,0,.24) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.24) 1px,transparent 1px);
  background-size:calc(100%/240) calc(100%/320)}
#grid.on{opacity:1}
#glass{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 34%),
    radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.30) 100%)}
#ph-nav{position:relative;height:104px;margin-top:8px}
#ph-nav .soft{position:absolute;top:8px;width:62px;height:22px;border-radius:12px;
  background:linear-gradient(#cfd3e2,#8d92a8);box-shadow:0 2px 0 #090a10,inset 0 1px 0 #fff}
#ph-nav .soft::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:3px;margin:-1px 0 0 -9px;border-radius:2px;background:#4b5068}
#ph-nav .sl{left:6px}#ph-nav .sr{right:6px}
#ph-nav .call,#ph-nav .endk{position:absolute;top:50px;width:62px;height:30px;border-radius:15px;box-shadow:0 2px 0 #090a10,inset 0 1px 0 rgba(255,255,255,.5)}
#ph-nav .call{left:2px;background:linear-gradient(#58d27a,#1e8a43)}#ph-nav .endk{right:2px;background:linear-gradient(#ea6258,#a42a24)}
#ph-nav .call::after,#ph-nav .endk::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:7px;margin:-3px 0 0 -8px;border-radius:5px 5px 2px 2px;background:#eaffee;opacity:.9}
#ph-nav .endk::after{background:#ffecea;transform:rotate(180deg)}
#navi{position:absolute;left:50%;top:0;width:96px;height:96px;margin-left:-48px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#d6dae8 0,#9ca1b8 45%,#656a83 100%);box-shadow:0 3px 0 #090a10,0 0 0 3px #1a1c29,inset 0 2px 2px #fff}
#navi button{position:absolute;color:#2c3045;font:700 15px/1 Arial,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:12px}
#navi .nu{left:30px;top:2px;width:36px;height:28px}#navi .nd{left:30px;bottom:2px;width:36px;height:28px}
#navi .nl{left:2px;top:30px;width:28px;height:36px}#navi .nr{right:2px;top:30px;width:28px;height:36px}
#navi .nc{left:31px;top:31px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4f6ff,#a9aec6);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 1px 0 #fff}
#ph-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 8px;margin-top:2px;padding:0 4px}
.key{position:relative}
.num{height:38px;border-radius:19px / 15px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(#5a5f77,#2f3345 55%,#262939);box-shadow:0 3px 0 #07080d,inset 0 1px 0 rgba(255,255,255,.28);color:#eef0fa}
.num b{font:700 21px/1 Arial,Helvetica,sans-serif;text-shadow:0 1px 0 #000}
.num i{display:block;text-align:left;font:normal 7px/1.15 Arial,Helvetica,sans-serif;color:#8d93ad;letter-spacing:.3px;min-width:34px}
.num i u{display:block;text-decoration:none;color:#f2b44e;font-weight:700}
.key.on{transform:translateY(2px);filter:brightness(1.55)}
#ph-chin{height:2px}
.plain #phone{width:240px;padding:0;border-radius:0;background:none;box-shadow:none}
.plain #ph-top,.plain #ph-nav,.plain #ph-keys,.plain #ph-chin,.plain #glass{display:none}
.plain #bezel{padding:0;background:none;box-shadow:none;border-radius:0}
.plain #screen{border-radius:0}

/* ---------- translucent touch overlay ---------- */
#tc{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;display:none}
.touch.plain #tc{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.40);
  background:rgba(255,255,255,.10);color:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:700 24px/1 "Courier New",monospace;text-shadow:0 1px 2px rgba(0,0,0,.8);touch-action:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.tb small{font:700 9px/1 "Courier New",monospace;letter-spacing:1px;opacity:.85;margin-top:3px}
.tb.sq{border-radius:20%}
.tb.on{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.75)}
.tb.sm{font-size:15px;background:rgba(255,255,255,.07)}

/* ---------- toolbar ---------- */
#tools{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:30}
.tool{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.26);background:rgba(20,16,36,.62);
  display:flex;align-items:center;justify-content:center;color:#d3d7ec}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.tool.off{opacity:.5}
.tool:active{background:rgba(255,255,255,.25)}
#toast{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:11px/1.3 "Courier New",monospace;color:#8f94ad;pointer-events:none;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}

</style>

<body>
<div id="app"></div>
<noscript>SHADOW BLADE: OLD CITY needs JavaScript enabled.</noscript>
<script>
(function(){
/* ---- 00_util.js ---- */
/* ============================================================================
   SHADOW BLADE: OLD CITY  --  00_util.js : shared foundation
   Palette, math helpers, palette-indexed pixel buffers (PBuf) and texture atlas.
   Everything in the game is drawn procedurally from this 32-colour palette.
   ========================================================================== */
'use strict';

const VW = 240, VH = 320, TS = 16;          // virtual screen size + tile size

/* ---- the one and only palette (32 colours, warm "2008 colour LCD" feel) ---- */
const PAL_HEX = [
  '#0a0812', '#1b1230', '#2e1f4a', '#4a2e63', '#6e3f7a', '#a0527f', '#d27d7d', '#f0b490',
  '#fbe2b0', '#ffffff', '#3a2418', '#5e3a22', '#8a5a2e', '#b9823f', '#e0b45c', '#f6e08a',
  '#1e3a3a', '#2b5e52', '#4a8a5a', '#86b86a', '#1e2c52', '#2e4a8a', '#4a7ac0', '#8ab8e0',
  '#b02e3a', '#e0503c', '#f08a3c', '#5c5c70', '#8a8a9c', '#bcbccc', '#2a2a3a', '#6a4a3a'
];
/* palette indices by name */
const C = {
  ink: 0, night: 1, dpurp: 2, purp: 3, plum: 4, rose: 5, salm: 6, peach: 7,
  cream: 8, white: 9, dbrn: 10, brn: 11, tan: 12, ochre: 13, gold: 14, lgold: 15,
  dteal: 16, teal: 17, green: 18, lgrn: 19, navy: 20, blue: 21, sky: 22, pale: 23,
  red: 24, bred: 25, orng: 26, dgray: 27, gray: 28, lgray: 29, slate: 30, dusty: 31
};
const NONE = 255;                            // transparent pixel in a PBuf
const PAL_RGB = PAL_HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

/* ---- tiny maths helpers ---- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, target, step) => v < target ? Math.min(v + step, target) : Math.max(v - step, target);

/* seeded RNG (mulberry32): rng(seed) returns a function giving floats in [0,1) */
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* cheap 2D integer hash -> 0..1 (stable per tile position, used for tile variants) */
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (((h ^ (h >>> 16)) >>> 0) % 65536) / 65536;
}
/* 4x4 Bayer ordered-dither threshold in 0..1 for pixel (x,y) */
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (BAYER4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ============================================================================
   PBuf : palette-indexed pixel buffer with drawing primitives.
   Pixels hold palette indices (0..31) or NONE (255 = transparent).
   Drawing coordinates may be floats; they are floored to integer pixels.
   ========================================================================== */
class PBuf {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8Array(w * h).fill(NONE); }
  set(x, y, c) {
    x = Math.floor(x); y = Math.floor(y);
    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c;
    return this;
  }
  get(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    return (x >= 0 && y >= 0 && x < this.w && y < this.h) ? this.d[y * this.w + x] : NONE;
  }
  clear() { this.d.fill(NONE); return this; }
  rect(x, y, w, h, c) {
    x = Math.floor(x); y = Math.floor(y);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  }
  hline(x, y, w, c) { return this.rect(x, y, w, 1, c); }
  vline(x, y, h, c) { return this.rect(x, y, 1, h, c); }
  /* Bresenham line; th=2 paints a 2x2 brush (chunky limbs) */
  line(x0, y0, x1, y1, c, th) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    th = th || 1;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      this.set(x0, y0, c);
      if (th > 1) { this.set(x0 + 1, y0, c); this.set(x0, y0 + 1, c); this.set(x0 + 1, y0 + 1, c); }
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return this;
  }
  disc(cx, cy, r, c) {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) this.set(cx + x, cy + y, c);
    return this;
  }
  ell(cx, cy, rx, ry, c) {
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
      const nx = x / (rx + 0.35), ny = y / (ry + 0.35);
      if (nx * nx + ny * ny <= 1) this.set(cx + x, cy + y, c);
    }
    return this;
  }
  /* even-odd scanline polygon fill; pts = [[x,y],...] */
  poly(pts, c) {
    let miny = Infinity, maxy = -Infinity;
    for (const p of pts) { if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }
    for (let y = Math.floor(miny); y <= Math.ceil(maxy); y++) {
      const yy = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yy && b[1] > yy) || (b[1] <= yy && a[1] > yy)) xs.push(a[0] + (yy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x < Math.round(xs[i + 1]); x++) this.set(x, y, c);
    }
    return this;
  }
  /* classic sprite outline: every transparent pixel touching a painted one becomes colour c.
     diag=true also checks diagonals (thicker, rounder outline). Call on a buffer with a 1px margin. */
  outline(c, diag) {
    const w = this.w, h = this.h, d = this.d, mark = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[y * w + x] !== NONE) continue;
      let hit = false;
      if (x > 0 && d[y * w + x - 1] !== NONE) hit = true;
      else if (x < w - 1 && d[y * w + x + 1] !== NONE) hit = true;
      else if (y > 0 && d[(y - 1) * w + x] !== NONE) hit = true;
      else if (y < h - 1 && d[(y + 1) * w + x] !== NONE) hit = true;
      else if (diag) {
        if (x > 0 && y > 0 && d[(y - 1) * w + x - 1] !== NONE) hit = true;
        else if (x < w - 1 && y > 0 && d[(y - 1) * w + x + 1] !== NONE) hit = true;
        else if (x > 0 && y < h - 1 && d[(y + 1) * w + x - 1] !== NONE) hit = true;
        else if (x < w - 1 && y < h - 1 && d[(y + 1) * w + x + 1] !== NONE) hit = true;
      }
      if (hit) mark.push(y * w + x);
    }
    for (const i of mark) d[i] = c;
    return this;
  }
  /* copy non-transparent pixels of src onto this at (dx,dy) */
  blit(src, dx, dy) {
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const v = src.d[y * src.w + x];
      if (v !== NONE) this.set(dx + x, dy + y, v);
    }
    return this;
  }
  replace(from, to) { const d = this.d; for (let i = 0; i < d.length; i++) if (d[i] === from) d[i] = to; return this; }
  flipH() {
    const o = new PBuf(this.w, this.h), w = this.w;
    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) o.d[y * w + (w - 1 - x)] = this.d[y * w + x];
    return o;
  }
  clone() { const o = new PBuf(this.w, this.h); o.d.set(this.d); return o; }
  toCanvas() {
    const cv = mkCanvas(this.w, this.h), g = cv.getContext('2d');
    const id = g.createImageData(this.w, this.h), px = id.data, d = this.d;
    for (let i = 0; i < d.length; i++) {
      const v = d[i];
      if (v === NONE) continue;
      const rgb = PAL_RGB[v], o = i * 4;
      px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
    }
    g.putImageData(id, 0, 0);
    return cv;
  }
}

/* ============================================================================
   Atlas : shelf-packed texture atlas. add() takes a PBuf or a canvas and returns
   a Spr = { c: atlasCanvas, x, y, w, h }.  Drawing from one big canvas keeps the
   GPU batching happy on Android.
   ========================================================================== */
class Atlas {
  constructor(w, h) {
    this.w = w || 1024; this.h = h || this.w;
    this.c = mkCanvas(this.w, this.h);
    this.g = this.c.getContext('2d');
    this.x = 0; this.y = 0; this.rowH = 0;
  }
  add(src) {
    const cv = (src instanceof PBuf) ? src.toCanvas() : src;
    const w = cv.width, h = cv.height;
    if (this.x + w > this.w) { this.x = 0; this.y += this.rowH + 1; this.rowH = 0; }
    if (this.y + h > this.h) throw new Error('Atlas full (' + this.w + 'x' + this.h + ')');
    this.g.drawImage(cv, this.x, this.y);
    const s = { c: this.c, x: this.x, y: this.y, w: w, h: h };
    this.x += w + 1;
    if (h > this.rowH) this.rowH = h;
    return s;
  }
}
/* draw a Spr with its top-left at (x,y) -- coordinates must be integers */
function blit(g, s, x, y) { g.drawImage(s.c, s.x, s.y, s.w, s.h, x, y, s.w, s.h); }

/* ---- 10_audio.js ---- */
/* ============================================================================
   SHADOW BLADE: OLD CITY  --  10_audio.js : chiptune audio engine  (global `Snd`)
   Web Audio only, everything synthesised: pulse (PeriodicWave 12.5/25/50%), triangle, saw, noise.
   SFX = tiny layer recipes (T = tone, N = noise, B = bell, J = jingle). Music = DATA (pattern strings)
   driven by a look-ahead step sequencer (4 voices + ambience, intensity 0..1 fades layers in).
   API: init ready setSfx setMusic sfx music stopMusic setIntensity suspend unsuspend duck  (+ _test)
   ========================================================================== */
const Snd = (function () {
  'use strict';
  const AC = typeof window !== 'undefined' ? (window.AudioContext || window.webkitAudioContext) : null;
  const EPS = 1e-4, CAP = 28, SFXV = 0.6, MUSV = 0.35, AHEAD = 0.15, TICK = 25, NO = {};
  const NT = { tri: 'triangle', saw: 'sawtooth', sin: 'sine', sq: 'square' };
  const WG = { p12: 1.7, p25: 1.3, p50: 0.8, bas: 1, tri: 1.2, saw: 0.8, sin: 1 };     // loudness trim per waveform
  const cl = (v, a, b) => v < a ? a : v > b ? b : v;
  const noop = () => {};
  const HZ = []; for (let m = 0; m < 128; m++) HZ[m] = 440 * Math.pow(2, (m - 69) / 12);

  /* ---- state (module-level so the same synth code can target a realtime or an Offline context) ---- */
  let ctx = null, sfxBus, musBus, duckG, musLP, lfoG, noiseBuf, WV = {};
  let sfxOn = true, musOn = true, userSusp = false, susT = 0, vnow = -1, tmr = 0;
  let want = null, seq = null, Itgt = 0, Icur = 0, lpI = -1, lastT = 0, rs = 1234567, LOG = null, noAmb = false, soloV = -1;
  const act = [], lastSfx = {};
  const cur = { t: 0, vol: 1, rate: 1, pan: 0, pri: 3, dest: null, echo: null, tag: -1 };   // "current sound" context for T/N/B/J
  const rnd = () => (rs = (rs * 1664525 + 1013904223) >>> 0) / 4294967296;
  const now = () => vnow >= 0 ? vnow : ctx.currentTime;

  /* ---- note names -> midi ; pattern strings -> events ---- */
  const NN = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function midi(s) {                              // 'f#4' -> 66, 'bb3' -> 58, anything else -> -1
    const m = /^([a-g])([#b]?)(\d)$/.exec(s);
    return m ? NN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12 : -1;
  }
  const memo = {};
  /* 'a4:2 r:1 (c5 d5)x2 | .' -> {ev:[[startStep, token, lenSteps],...], n: totalSteps}. '.'/'r' = rest, 'x' repeats groups, '|' ignored */
  function parse(str) {
    if (memo[str]) return memo[str];
    let s = str.replace(/\|/g, ' '), p;
    while ((p = s.replace(/\(([^()]*)\)x(\d+)/g, (a, b, n) => (b + ' ').repeat(+n))) !== s) s = p;
    const ev = []; let n = 0;
    s.split(/\s+/).forEach(tk => {
      if (!tk) return;
      const q = tk.split(':'), len = q[1] ? +q[1] : 1;
      if (q[0] !== '.' && q[0] !== 'r') ev.push([n, q[0], len]);
      n += len;
    });
    return (memo[str] = { ev: ev, n: n });
  }

  /* ---- graph ---- */
  const SAT = new Float32Array(1025);             // safety soft-clip curve: unity slope, ceiling ~0.4 (x2 post-gain), covers inputs up to +-2
  for (let i = 0; i < 1025; i++) SAT[i] = 0.4 * Math.tanh((i / 512 - 1) / 0.4);
  function pw(c, d) {                              // pulse wave with duty d as PeriodicWave
    const N = 40, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let n = 1; n <= N; n++) {
      re[n] = 2 * Math.sin(2 * Math.PI * n * d) / (Math.PI * n);
      im[n] = 2 * (1 - Math.cos(2 * Math.PI * n * d)) / (Math.PI * n);
    }
    return c.createPeriodicWave(re, im);
  }
  function hw(c, h) {                              // custom harmonic-sum wave (the "warm bass" wave)
    const re = new Float32Array(h.length + 1), im = new Float32Array(h.length + 1);
    for (let i = 0; i < h.length; i++) im[i + 1] = h[i];
    return c.createPeriodicWave(re, im);
  }
  function build(c, raw) {                         // raw=true omits the safety stage (tests measure the true level)
    ctx = c;
    const mk = v => { const g = c.createGain(); g.gain.value = v; return g; };
    const mix = mk(1), comp = c.createDynamicsCompressor(), lim = c.createDynamicsCompressor(), master = mk(0.9);
    comp.threshold.value = -12; comp.knee.value = 18; comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.22;     // glue
    lim.threshold.value = -3; lim.knee.value = 3; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;           // soft limiter
    mix.connect(comp); comp.connect(lim);
    if (raw) lim.connect(master);
    else {
      const pre = mk(0.5), sh = c.createWaveShaper(), post = mk(2);
      sh.curve = SAT; lim.connect(pre); pre.connect(sh); sh.connect(post); post.connect(master);
    }
    master.connect(c.destination);
    sfxBus = mk(SFXV); sfxBus.connect(mix);
    musBus = mk(MUSV); musBus.connect(mix);
    duckG = mk(1); duckG.connect(musBus);
    musLP = c.createBiquadFilter(); musLP.type = 'lowpass'; musLP.frequency.value = 2400; musLP.Q.value = 0.4; musLP.connect(duckG);
    const sr = c.sampleRate, nb = c.createBuffer(1, Math.floor(sr * 1.5), sr), d = nb.getChannelData(0);
    let x = 0x2545F491;                            // one shared white-noise buffer (xorshift32)
    for (let i = 0; i < d.length; i++) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; d[i] = (x >>> 0) / 2147483648 - 1; }
    noiseBuf = nb;
    WV = { p12: pw(c, 0.125), p25: pw(c, 0.25), p50: pw(c, 0.5), bas: hw(c, [1, 0.42, 0.22, 0.12, 0.07, 0.045, 0.03, 0.02]) };
    const l = c.createOscillator(); l.frequency.value = 5.2; lfoG = mk(9); l.connect(lfoG); l.start(0);   // shared vibrato LFO (cents)
  }

  /* ---- voice bookkeeping: cap, priority stealing, cleanup ---- */
  function claim(pri, end) {
    const n0 = now();
    for (let i = act.length - 1; i >= 0; i--) if (act[i].end < n0) act.splice(i, 1);
    if (act.length >= CAP) {
      let vi = 0;
      for (let i = 1; i < act.length; i++) { const a = act[i], b = act[vi]; if (a.pri < b.pri || (a.pri === b.pri && a.end < b.end)) vi = i; }
      if (act[vi].pri > pri) return null;           // everything playing outranks the newcomer: drop the newcomer
      kill(act[vi]);
    }
    const r = { pri: pri, end: end, nodes: [], g: null, s: null, lfo: null };
    act.push(r);
    return r;
  }
  function kill(r) {
    const i = act.indexOf(r); if (i >= 0) act.splice(i, 1);
    try {
      const n = now();
      if (r.g) { r.g.gain.cancelScheduledValues(n); r.g.gain.setTargetAtTime(0, n, 0.004); }
      if (r.s) r.s.stop(n + 0.03);
    } catch (e) { /* ignore */ }
  }
  function ended() {                               // shared onended handler (this = source node)
    const r = this._r; if (!r) return; this._r = null;
    const i = act.indexOf(r); if (i >= 0) act.splice(i, 1);
    for (let k = 0; k < r.nodes.length; k++) { try { r.nodes[k].disconnect(); } catch (e) { /* ignore */ } }
    if (r.lfo) { try { lfoG.disconnect(r.lfo); } catch (e) { /* ignore */ } }
  }

  /* ---- envelope: attack -> exp decay to sustain ratio s over d -> hold until dur -> linear release r. Returns end time. ---- */
  function adsr(p, t, dur, pk, o, pc) {            // pc: percussive defaults (exp decay across the whole duration)
    let a = o.a, d = o.d, s = o.s, r = o.r;
    if (a === undefined) a = pc ? 0.002 : 0.003;
    if (d === undefined) d = pc ? dur : 0;
    if (s === undefined) s = pc ? 0.02 : 1;
    if (r === undefined) r = pc ? 0.012 : 0.02;
    p.setValueAtTime(EPS, t);
    p.linearRampToValueAtTime(pk, t + a);
    let te = t + a, lv = pk;
    if (d > 0 && s < 1) {
      const dd = Math.min(d, Math.max(dur - a, 0.002));
      lv = Math.max(pk * Math.pow(s, dd / d), EPS);
      te = t + a + dd;
      p.exponentialRampToValueAtTime(lv, te);
    }
    const tg = Math.max(t + dur, te);
    if (tg > te) p.setValueAtTime(lv, tg);
    p.linearRampToValueAtTime(0, tg + r);
    return tg + r;
  }
  function route(r, g, o) {                        // gain -> (panner) -> destination (+ optional echo send)
    let out = g;
    if (cur.pan && ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = cur.pan; g.connect(pn); r.nodes.push(pn); out = pn; }
    out.connect(cur.dest);
    if (o.echo && cur.echo) g.connect(cur.echo);
  }

  /* ---- T: tone  T(wave, f0, f1(0=no slide), dur, vol, delay, opts{a,d,s,r,x(1=percussive),bt,lp,q,det,vib,echo}) ---- */
  function T(w, f0, f1, dur, vol, dly, o) {
    o = o || NO;
    const t = cur.t + (dly || 0), rt = cur.rate;
    const r = claim(cur.pri, t + dur + 0.2); if (!r) return;
    const os = ctx.createOscillator(), g = ctx.createGain();
    if (WV[w]) os.setPeriodicWave(WV[w]); else os.type = NT[w];
    f0 *= rt; f1 = f1 ? f1 * rt : f0;
    os.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) os.frequency.exponentialRampToValueAtTime(f1, t + (o.bt || dur));
    if (o.det) os.detune.value = o.det;
    const end = adsr(g.gain, t, dur, vol * cur.vol * (WG[w] || 1), o, o.x) + 0.03;
    r.nodes.push(os, g); r.s = os; r.g = g; r.end = end;
    if (LOG) LOG.push([t, w, f0, dur, vol * cur.vol, cur.tag]);
    if (o.lp) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp * rt; f.Q.value = o.q || 0.7;
      os.connect(f); f.connect(g); r.nodes.push(f);
    } else os.connect(g);
    route(r, g, o);
    if (o.vib && dur > 0.2) { lfoG.connect(os.detune); r.lfo = os.detune; }
    os._r = r; os.onended = ended;
    os.start(t); os.stop(end);
  }
  /* ---- N: filtered noise  N(dur, vol, 'bp'|'hp'|'lp'|0, f0, f1, delay, opts{a,d,s,r,x(0=sustained),q,fd}) ---- */
  function N(dur, vol, ft, f0, f1, dly, o) {
    o = o || NO;
    const t = cur.t + (dly || 0), rt = cur.rate;
    const r = claim(cur.pri, t + dur + 0.3); if (!r) return;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    const end = adsr(g.gain, t, dur, vol * cur.vol, o, o.x === undefined ? 1 : o.x) + 0.03;
    r.nodes.push(s, g); r.s = s; r.g = g; r.end = end;
    if (LOG) LOG.push([t, 'n', f0, dur, vol * cur.vol, cur.tag]);
    if (ft) {
      const f = ctx.createBiquadFilter();
      f.type = ft === 'bp' ? 'bandpass' : ft === 'hp' ? 'highpass' : 'lowpass';
      f.Q.value = o.q || (ft === 'bp' ? 1.1 : 0.7);
      f.frequency.setValueAtTime(f0 * rt, t);
      if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1 * rt, t + (o.fd || dur));
      s.connect(f); f.connect(g); r.nodes.push(f);
    } else s.connect(g);
    route(r, g, o);
    s._r = r; s.onended = ended;
    s.start(t, rnd() * 0.9); s.stop(end);
  }
  /* ---- B: inharmonic metallic strike (bells, clangs): partial sines with their own decays ---- */
  function B(f, dur, vol, dly, parts) {
    const P = parts || [1, 2.76, 5.4, 8.93];
    for (let i = 0; i < P.length; i++) T('sin', f * P[i], 0, dur / (1 + i * 0.7), vol / (1 + i * 0.9), dly, { x: 1, a: 0.002 });
  }
  /* ---- J: jingle from a note string ('d5 f#5:2 r a5'); step = seconds per step, gate = note fraction ---- */
  function J(w, str, step, gate, vol, dly, o) {
    const q = parse(str);
    for (let i = 0; i < q.ev.length; i++) {
      const e = q.ev[i], m = midi(e[1]);
      if (m >= 0) T(w, HZ[m], 0, e[2] * step * gate, vol, (dly || 0) + e[0] * step, o);
    }
  }

    suspend: suspend, unsuspend: unsuspend, duck: duck, _test: _test,

})();

    6: '.###./#..../#..../####./#...#/#...#/.###.', 7: '#####/....#/...#./..#../.#.../.#.../.#...',
    8: '.###./#...#/#...#/.###./#...#/#...#/.###.', 9: '.###./#...#/#...#/.####/....#/....#/.###.',
    '.': '.../.../.../.../.../.#./.#.', ',': '.../.../.../.../.##/..#/.#.', ':': '.../.#./.#./.../.#./.#./...',
    ';': '.../.#./.#./.../.#./.#./#..', '!': '#/#/#/#/#/./#', '?': '.###./#...#/....#/...#./..#../...../..#..',
    "'": '#/#/././././.', '"': '#.#/#.#/.../.../.../.../...', '-': '..../..../..../####/..../..../....',

    '@': '.###./#...#/#.###/#.#.#/#.###/#..../.###.', '_': '...../...../...../...../...../...../#####',

    '$': '..#../.####/#.#../.###./..#.#/####./..#..', '|': '#/#/#/#/#/#/#',

    '▲': '..#../..#../.###./.###./#####/#####/.....', '▼': '...../#####/#####/.###./.###./..#../..#..'
  };
  const GL = {};                       // char -> { rows:[7 strings], x0, w }
  for (const k in RAW) {
    const rows = RAW[k].split('/');
    let x0 = 99, x1 = -1;
    rows.forEach(r => { for (let i = 0; i < r.length; i++) if (r[i] === '#') { if (i < x0) x0 = i; if (i > x1) x1 = i; } });
    GL[k] = { rows, x0, w: x1 - x0 + 1 };
  }
  GL[' '] = { rows: [], x0: 0, w: 3 };
  const cache = new Map();             // colour index -> { c, off:{ch:x} }
  function atlasFor(col) {
    let a = cache.get(col);
    if (a) return a;
    const keys = Object.keys(GL).filter(k => k !== ' ');
    let wsum = 0; keys.forEach(k => wsum += GL[k].w + 1);
    const b = new PBuf(wsum, 7), off = {};
    let x = 0;
    keys.forEach(k => {
      const g = GL[k]; off[k] = x;
      g.rows.forEach((r, y) => { for (let i = g.x0; i < g.x0 + g.w; i++) if (r[i] === '#') b.set(x + i - g.x0, y, col); });
      x += g.w + 1;
    });

    return a;
  }
  const norm = s => String(s).toUpperCase();
  function width(str, scale) {
    scale = scale || 1; str = norm(str);
    let w = 0;
    for (let i = 0; i < str.length; i++) { const g = GL[str[i]] || GL['?']; w += (g.w + 1) * scale; }
    return Math.max(0, w - scale);
  }
  function draw(g, str, x, y, col, scale, shadow) {
    scale = scale || 1; str = norm(str); x = Math.round(x); y = Math.round(y);
    if (shadow !== undefined && shadow !== null && shadow >= 0) draw(g, str, x + scale, y + scale, shadow, scale);
    const a = atlasFor(col === undefined ? C.white : col);
    for (let i = 0; i < str.length; i++) {
      const ch = str[i], gl = GL[ch] || GL['?'];
      if (ch !== ' ') g.drawImage(a.c, a.off[GL[ch] ? ch : '?'], 0, gl.w, 7, x, y, gl.w * scale, 7 * scale);
      x += (gl.w + 1) * scale;
    }
  }
  /* text with 1px outline (4-neighbour) for legibility on busy backgrounds */
  function outlined(g, str, x, y, col, ol, scale) {
    scale = scale || 1; ol = ol === undefined ? C.ink : ol;
    draw(g, str, x - scale, y, ol, scale); draw(g, str, x + scale, y, ol, scale);
    draw(g, str, x, y - scale, ol, scale); draw(g, str, x, y + scale, ol, scale);
    draw(g, str, x, y, col, scale);
  }
  function center(g, str, cx, y, col, scale, shadow) { draw(g, str, cx - width(str, scale) / 2, y, col, scale, shadow); }
  function right(g, str, rx, y, col, scale, shadow) { draw(g, str, rx - width(str, scale), y, col, scale, shadow); }
  /* word-wrap into lines no wider than maxW (px at given scale) */
  function wrap(str, maxW, scale) {
    const out = [];
    norm(str).split('\n').forEach(par => {
      let line = '';
      par.split(' ').forEach(wd => {
        const t = line ? line + ' ' + wd : wd;
        if (width(t, scale) <= maxW || !line) line = t; else { out.push(line); line = wd; }
      });
      out.push(line);
    });
    return out;
  }
  return { draw, outlined, center, right, width, wrap, H: 7 };
})();

/* ---- 21_save.js ---- */
/* 21_save.js : localStorage persistence (progress, best results, options). Always guarded: storage may be blocked. */
const Save = (() => {
  const KEY = 'shadowblade_oldcity_v1';
  const def = () => ({ v: 1, unlocked: 1, best: {}, cont: null, plays: 0, coins: 0,
    opts: { snd: 1, mus: 1, cone: 1, grid: 1, vib: 1, frame: -1, fx: 1 } });
  let d = def();
  function load() {
    try {
      const s = window.localStorage.getItem(KEY);
      if (s) { const o = JSON.parse(s), b = def(); d = Object.assign(b, o); d.opts = Object.assign(b.opts, o.opts || {}); if (!(d.unlocked >= 1)) d.unlocked = 1; }
    } catch (e) { d = def(); }
    return d;
  }
  function flush() { try { window.localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* ignore */ } }
  return { get d() { return d; }, load, flush, reset() { d = def(); flush(); } };
})();

/* ---- 22_fx.js ---- */
/* ============================================================================
   22_fx.js : small procedural sprites for HUD icons, items, projectiles, effects,
   and the dithered light masks used by the dark levels.
   ========================================================================== */
const FX = {};
FX.build = function () {
  const A = new Atlas(512, 512);
  const M = { k: C.ink, w: C.white, r: C.bred, R: C.red, y: C.gold, Y: C.lgold, o: C.orng, g: C.lgrn, G: C.green, b: C.sky, B: C.blue,
    p: C.pale, d: C.dgray, l: C.lgray, s: C.gray, t: C.tan, n: C.brn, c: C.cream, e: C.peach, m: C.plum, u: C.purp, v: C.dpurp };
  const asc = (rows, ol) => {
    const w = rows[0].length, h = rows.length, b = new PBuf(w + 2, h + 2);
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) if (r[x] !== '.') b.set(x + 1, y + 1, M[r[x]]); });
    if (ol !== false) b.outline(C.ink);
    return b;
  };
  const add = b => A.add(b);
  /* --- HUD icons --- */
  FX.heart = add(asc(['.rr.rr.', 'rwrrrrr', 'rrrrrrr', '.rrrrR.', '..rrR..', '...R...']));
  FX.heartEmpty = add(asc(['.dd.dd.', 'dsdddd d'.replace(' ', ''), 'ddddddd', '.dddds.', '..ddd..', '...d...']));
  FX.coinIcon = add(asc(['.yyy.', 'yYYyt', 'yYytt', 'yyttt', '.ttt.']));
  FX.eye = [];                                                   // 0 hidden, 1 caution, 2 alert, 3 search
  [C.lgrn, C.lgold, C.bred, C.orng].forEach((col, i) => {
    const b = new PBuf(13, 9);
    b.ell(6, 4, 5, 3, C.white); b.disc(6, 4, 2, col); b.set(6, 4, C.ink); b.set(7, 3, C.white);
    if (i === 0) { b.rect(1, 0, 11, 3, C.ink); }              // half-closed lid
    b.outline(C.ink); FX.eye.push(add(b));
  });
  FX.eyeShut = add((() => { const b = new PBuf(13, 9); b.line(1, 4, 11, 4, C.gray); b.line(2, 5, 10, 5, C.dgray); b.outline(C.ink); return b; })());
  FX.key = add(asc(['.yyy....', 'y...y...', 'y...yyyy', '.yyy.y.y', '.....y.y']));
  FX.scroll = add(asc(['.cccccc.', 'cYYYYYYc', '.cYttYc.', '.cYYYYc.', '.cYttYc.', 'cYYYYYYc', '.cccccc.']));
  FX.seal = add((() => { const b = new PBuf(12, 12); b.disc(6, 6, 5, C.gold); b.disc(6, 6, 3, C.red); b.disc(6, 6, 1, C.lgold); b.set(3, 3, C.lgold); b.outline(C.ink); return b; })());
  FX.skull = add(asc(['.ccccc.', 'ccccccc', 'cvccvcc', 'ccccccc', '.ccvcc.', '.c.c.c.']));
  /* --- pickups --- */
  FX.coin = [];
  [3, 2, 0, 2].forEach((rx, i) => {
    const b = new PBuf(9, 10);
    if (rx === 0) { b.rect(4, 1, 1, 7, C.tan); b.rect(4, 1, 1, 2, C.lgold); }
    else { b.ell(4, 4, rx, 3, C.gold); b.ell(4, 4, Math.max(0, rx - 1), 2, C.lgold); if (rx > 1) { b.set(3, 3, C.cream); b.rect(5, 5, 1, 2, C.tan); } }
    b.outline(C.ink); FX.coin.push(add(b));
  });
  FX.gem = [0, 1].map(i => add(asc(['..pp..', '.pwBb.', 'pwBbBb', '.BbBb.', '..Bb..'].map(r => r), true)));
  FX.spark = [0, 1, 2].map(i => {
    const b = new PBuf(9, 9);
    if (i === 0) { b.rect(4, 3, 1, 3, C.white); b.rect(3, 4, 3, 1, C.white); }
    else if (i === 1) { b.rect(4, 0, 1, 9, C.lgold); b.rect(0, 4, 9, 1, C.lgold); b.line(1, 1, 7, 7, C.white); b.line(7, 1, 1, 7, C.white); b.rect(3, 3, 3, 3, C.white); }
    else { [[1, 1], [7, 1], [1, 7], [7, 7], [4, 0], [4, 8], [0, 4], [8, 4]].forEach(p => b.set(p[0], p[1], C.pale)); b.set(4, 4, C.white); }
    return add(b);
  });
  /* --- projectiles --- */
  const proj = (rows) => { const b = asc(rows); return { r: add(b), l: add(b.flipH()) }; };
  FX.arrow = proj(['wnnnnnnllw', 'nttttttlll', 'wnnnnnnllw'].map(r => r));
  FX.knife = proj(['nnlllw', 'nnllll']);
  FX.pebble = add(asc(['dd', 'dl']));
  FX.bolt = [0, 1].map(i => {
    const b = new PBuf(13, 13);
    b.disc(6, 6, 5, C.purp); b.disc(6, 6, 3, C.plum); b.disc(6, 6, 1, C.white);
    if (i) { b.set(0, 6, C.rose); b.set(12, 6, C.rose); b.set(6, 0, C.rose); b.set(6, 12, C.rose); }
    b.outline(C.dpurp); return add(b);
  });
  FX.dart = proj(['llww']);
  /* --- slash arcs for the hero (facing right). 3 attacks x 3 frames, 26x26 cells --- */
  FX.slash = [];
  for (let k = 0; k < 3; k++) {
    const row = [];
    for (let f = 0; f < 3; f++) {
      const b = new PBuf(28, 28);
      const R = [13, 14, 15][k], cx = [4, 6, 6][k], cy = [14, 14, 18][k];
      const sweep = (f + 1) / 3;
      for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
        if (d > R || d < R - 4 + f * 1.5) continue;
        let ang = Math.atan2(dy, dx);                               // -PI..PI, 0 = forward
        const a0 = [-1.25, 1.25, -1.9][k], a1 = [1.25, -1.25, 1.2][k];
        const t = (ang - Math.min(a0, a1)) / Math.abs(a1 - a0);
        if (t < 0 || t > 1) continue;
        const front = k === 1 ? 1 - t : (k === 2 ? t : t);
        if (front > sweep + 0.05 || front < sweep - 0.55) continue;
        if (f === 2 && ((x + y) & 1)) continue;
        b.set(x, y, d > R - 1.5 ? C.white : (d > R - 3 ? C.pale : C.sky));
      }
      row.push({ r: add(b), l: add(b.flipH()) });
    }
    FX.slash.push(row);
  }
  /* --- dust puff (4 frames) and smoke (5 frames) --- */
  FX.dust = [0, 1, 2, 3].map(i => {
    const b = new PBuf(12, 8), r = rng(40 + i);
    const n = 4 + i;
    for (let j = 0; j < n; j++) b.disc(2 + Math.floor(r() * 8), 5 - Math.floor(r() * (1 + i)), 1 + (i > 1 ? 1 : 0), i < 2 ? C.cream : C.tan);
    if (i === 3) for (let y = 0; y < 8; y++) for (let x = 0; x < 12; x++) if ((x + y) & 1) b.set(x, y, NONE);
    return add(b);
  });
  FX.smoke = [0, 1, 2, 3, 4].map(i => {
    const b = new PBuf(32, 32), r = rng(70 + i), R = 4 + i * 2.6;
    for (let j = 0; j < 9; j++) {
      const a = r() * 6.28, d = r() * R * 0.6;
      b.disc(16 + Math.cos(a) * d, 16 + Math.sin(a) * d * 0.8, Math.max(2, R * 0.5 | 0), i < 3 ? C.gray : C.dgray);
    }
    b.disc(16, 16, Math.max(1, R * 0.4 | 0), C.lgray);
    if (i >= 3) for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (((x >> 0) + y + i) % 3 === 0) b.set(x, y, NONE);
    return add(b);
  });
  /* --- fire jet (3 frames 16x40) --- */
  FX.fire = [0, 1, 2].map(i => {
    const b = new PBuf(16, 40), r = rng(90 + i);
    for (let y = 0; y < 40; y++) {
      const t = y / 39, w = Math.max(1, Math.round((1 - t) * 6 + 1 + (r() < 0.5 ? 1 : 0)));
      const cx = 8 + Math.round(Math.sin(y * 0.5 + i * 2) * 1.4 * t);
      b.rect(cx - w, y, w * 2, 1, t < 0.25 ? C.cream : t < 0.5 ? C.lgold : t < 0.78 ? C.orng : C.bred);
    }
    return add(b);
  });
  /* --- pendulum blade: 15 angles, pivot at top centre of a 56x56 cell --- */
  FX.pend = [];
  for (let i = 0; i < 15; i++) {
    const a = (i - 7) / 7 * 1.15, b = new PBuf(56, 56), px = 28, py = 1, L = 40;
    const ex = px + Math.sin(a) * L, ey = py + Math.cos(a) * L;
    b.line(px, py, ex, ey, C.dgray);
    const nx = Math.cos(a), ny = -Math.sin(a);
    b.poly([[ex - nx * 7, ey - ny * 7], [ex + nx * 7, ey + ny * 7], [ex + Math.sin(a) * 7, ey + Math.cos(a) * 7]], C.lgray);
    b.line(ex - nx * 6, ey - ny * 6, ex + Math.sin(a) * 6, ey + Math.cos(a) * 6, C.white);
    b.disc(px, py, 2, C.gray); b.outline(C.ink);
    FX.pend.push(add(b));
  }
  /* --- dart launcher block (faces right / left) --- */
  const dl = new PBuf(16, 16); dl.rect(0, 0, 16, 16, C.dgray); dl.rect(0, 0, 16, 2, C.gray); dl.rect(0, 14, 16, 2, C.slate); dl.rect(10, 6, 6, 4, C.ink); dl.rect(11, 7, 4, 2, C.slate); dl.rect(2, 4, 1, 8, C.slate); dl.rect(5, 4, 1, 8, C.slate);
  FX.dartBlock = { r: add(dl), l: add(dl.flipH()) };
  /* --- hint-bubble arrow + misc --- */
  FX.tail = add((() => { const b = new PBuf(7, 4); b.poly([[0, 0], [7, 0], [3.5, 4]], C.ink); return b; })());
  /* --- dithered radial light masks (alpha only): diameters 48, 80, 120 --- */
  FX.light = {};
  [48, 80, 120].forEach(d => {
    const cv = mkCanvas(d, d), g = cv.getContext('2d'), id = g.createImageData(d, d), px = id.data, lv = [0, 0.34, 0.66, 1];
    for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
      const rho = Math.hypot(x - d / 2 + 0.5, y - d / 2 + 0.5) / (d / 2);
      let I = rho >= 1 ? 0 : 1 - rho; I = I * I * (3 - 2 * I);
      const q = I * 3, fl = Math.floor(q), fr = q - fl, lvl = fl + (fr > bayer(x, y) ? 1 : 0);
      const o = (y * d + x) * 4; px[o] = px[o + 1] = px[o + 2] = 0; px[o + 3] = Math.round(lv[Math.min(3, lvl)] * 255);
    }
    g.putImageData(id, 0, 0); FX.light[d] = cv;
  });

  const chk = mkCanvas(2, 2), cg = chk.getContext('2d'); cg.fillStyle = '#fff'; cg.fillRect(0, 0, 1, 1); cg.fillRect(1, 1, 1, 1);
  FX.checker = chk;
  return FX;
};

/* ---- 30_chars.js ---- */
/* ============================================================================
   SHADOW BLADE: OLD CITY  --  30_chars.js : procedural character sprites
   One skeletal pixel rig (2-bone IK limbs, shaded polygons, ribbons, weapons)
   builds every animation frame of the hero, guards and bosses at load time.
   Global: Chars.build(atlas) -> CH   (see CONTRACT B)
   ========================================================================== */
const Chars = (function () {
  'use strict';
  const PI = Math.PI, sin = Math.sin, cos = Math.cos, R = Math.round, FL = Math.floor, abs = Math.abs, hyp = Math.hypot;
  const dr = d => d * PI / 180;
  const lp = (a, b, t) => a + (b - a) * t;
  const lp2 = (a, b, t) => [lp(a[0], b[0], t), lp(a[1], b[1], t)];
  const ease = t => t * t * (3 - 2 * t);
  const fr = t => t - FL(t);
  const TAU = PI * 2;

  /* ---- 2-bone IK: root r, target t, bones l1/l2, bend side s (+1/-1). returns joint j and clamped end e ---- */
  function ik(r, t, l1, l2, s) {
    const dx = t[0] - r[0], dy = t[1] - r[1], d = hyp(dx, dy) || 1e-3;
    const m = Math.min(d, l1 + l2 - 0.02), a = (l1 * l1 - l2 * l2 + m * m) / (2 * m), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    return { j: [r[0] + ux * a - s * uy * h, r[1] + uy * a + s * ux * h], e: [r[0] + ux * m, r[1] + uy * m] };
  }

  /* ---- drawing context: pose-space (origin = anchor, y down) -> pixel buffer ---- */

/* ---------------------------------------------------------------- hero sprite selection */
function heroFrame(CHh, P) {
  const A = CHh.anims;
  const pick = (name, i) => { const a = A[name] || A.idle; return a[((i % a.length) + a.length) % a.length]; };
  const t = P.animT;
  switch (P.st) {
    case PS.GROUND:
      if (P.landT > 0) return pick('land', P.landT > 5 ? 0 : 1);
      if (P.crouch) return Math.abs(P.vx) > 0.15 ? pick('sneak', t / 6 | 0) : pick('crouch', t / 24 | 0);
      return Math.abs(P.vx) > 0.25 ? pick('run', t / 5 | 0) : pick('idle', t / 20 | 0);
    case PS.AIR: return P.vy < -0.4 ? pick('jump', 0) : pick('fall', 0);
    case PS.CLIMB: return pick('climb', t / 8 | 0);
    case PS.HANG: return pick('hang', t / 30 | 0);
    case PS.LEDGE: return pick('ledgeUp', Math.min(5, P.stT / 22 * 6 | 0));
    case PS.ATK: return P.atkAir ? pick('airAtk', Math.min(2, P.atkT / 5 | 0)) : pick(['atk1', 'atk2', 'atk3'][P.atkN], Math.min(A[['atk1', 'atk2', 'atk3'][P.atkN]].length - 1, P.atkT / ATK_DUR[P.atkN] * A[['atk1', 'atk2', 'atk3'][P.atkN]].length | 0));
    case PS.BLOCK: return P.parryT > 0 ? pick('parry', P.parryT > 7 ? 0 : 1) : pick('block', P.blkT < 5 ? 0 : 1);
    case PS.ROLL: return pick('roll', Math.min(5, P.rollT / 22 * 6 | 0));
    case PS.HURT: return pick('hurt', P.stT > 6 ? 1 : 0);
    case PS.DEAD: return pick('dead', Math.min(4, P.deadT / 7 | 0));
    case PS.TAKE: return pick('takedown', Math.min(5, P.takeT / 26 * 6 | 0));
    case PS.THROW: return pick('throw', Math.min(2, P.stT / 5 | 0));
    case PS.HIDE: return pick('hide', 0);
  }
  return pick('idle', 0);
}

/* ============================================================================
   64_ai.js : guards. Patrol routes, vision cones (range / direction / line of sight / light / stance),
   suspicion meter, noise + body reactions, investigate / search / return-to-patrol, shouted alerts,
   tile-graph pathfinding (walk / hop / drop / ladders), melee + ranged combat.
   ========================================================================== */
const GS = { PATROL: 0, WAIT: 1, NOTICE: 2, INVEST: 3, LOOK: 4, RETURN: 5, ALERT: 6, ATTACK: 7, SEARCH: 8, HURT: 9, STAGGER: 10, BLOCK: 11, DEAD: 12, SLEEP: 13, SCRIPT: 14, AIM: 15 };

  /* ============================================================ RENDER */

  drawBackground(g, E, cx, cy) {

  },
  strip(g, cv, off, y, _) {
    const W = cv.width, H = cv.height; let x = -((off % W) + W) % W; y = Math.round(y - H);

  },
  drawBacks(g, E, cx, cy) {

      const c0 = Math.max(b.c0, Math.floor(cx / TS)), c1 = Math.min(b.c1, Math.floor((cx + VW) / TS)), r0 = Math.max(b.r0, Math.floor(cy / TS)), r1 = Math.min(b.r1, Math.floor((cy + VH) / TS));

  drawDecor(g, E, d, cx, cy) {

  drawTiles(g, E, c0, c1, r0, r1, cx, cy) {

  drawObjects(g, E, cx, cy) {

    for (const b of w.bells) { const d = dc.bell; if (d) blit(g, d.frames[b.ring > 0 ? ((t >> 3) & 1) : 0], Math.round(b.x - 8 - cx), Math.round(b.y - d.h - 6 - cy)); }

    for (const l of w.levers) { const d = dc.lever; if (d) blit(g, d.frames[l.on ? 1 : 0], Math.round(l.x - 8 - cx), Math.round(l.y - d.h - cy)); }

    }

      const bob = c.drop ? 0 : Math.round(Math.sin((t + c.ph * 3) / 14) * 1.5);

      else if (c.gem) blit(g, FX.gem[(t >> 4) & 1], Math.round(c.x - 4 - cx), Math.round(c.y - 5 + bob - cy));
      else blit(g, FX.coin[((t >> 3) + c.ph) & 3], Math.round(c.x - 5 - cx), Math.round(c.y - 5 + bob - cy));
      if (!c.drop && !((t + c.ph * 5) % 70)) Fx.px(c.x + (Math.random() - 0.5) * 6, c.y - 3, 0, -0.1, 14, C.white, 1, 0);
    }
    for (const it of w.items) {

    }
  },
  drawTrapsFront(g, w, cx, cy) {
    for (const tr of w.traps) {
      if (tr.kind === 'fire') {

  /* ---- characters ---- */
  guardFrame(g) {
    const CH = ART.CH, ch = CH[g.T.anim || g.type] || CH.guard, A = ch.anims, t = g.animT;
    const pick = (n, i) => { const a = A[n] || A.idle; return a[((i % a.length) + a.length) % a.length]; };
    const T = g.T;
    if (g.dead) return pick('dead', Math.min(4, g.deadT / 6 | 0));
    if (g.fr && g.boss) return pick(g.fr[0], g.fr[1]);
    if (g.climbing) return pick('climb', (g.y / 5) | 0);
    switch (g.state) {
      case GS.ATTACK: {
        if (g.type === 'brute') { const a = g.atkT < T.wind ? 'wind' : g.atkT < T.wind + T.strike ? 'smash' : 'recover'; const n = (A[a] || A.idle).length; const k = a === 'wind' ? g.atkT / T.wind : a === 'smash' ? (g.atkT - T.wind) / T.strike : (g.atkT - T.wind - T.strike) / T.rec; return pick(a, Math.min(n - 1, k * n | 0)); }

  drawGuard(g, gd, cx, cy) {

  /* ---- vision cones (dithered) ---- */
  drawCones(g, w, cx, cy) {
    if (!this.conePat) {

    }
    for (const gd of w.guards) {
      if (gd.dead || !gd.active || gd.state === GS.SLEEP || gd.state === GS.SCRIPT || gd.script) continue;
      if (gd.x < cx - 130 || gd.x > cx + VW + 130 || gd.y < cy - 20 || gd.y - 40 > cy + VH) continue;
      const engaged = gd.state === GS.ALERT || gd.state === GS.ATTACK || gd.state === GS.AIM || gd.state === GS.SEARCH;
      const range = gd.T.sight * (engaged ? 1.25 : 1) * (gd.wary > 0 ? 1.18 : 1);
      const col = (gd.state === GS.ALERT || gd.state === GS.ATTACK || gd.state === GS.AIM) ? 2 : (gd.state === GS.NOTICE || gd.state === GS.INVEST || gd.state === GS.SEARCH || gd.sus > 28) ? 1 : 0;
      const f = gd.face, ex = gd.x + f * 3, ey = gd.y - gd.T.eye;

      let cc = gd.cone;

        const hh = Math.min(30, 13 + range * 0.3), rows = [];
        for (let dy = -hh; dy <= hh; dy += 2) {
          const ad = Math.abs(dy), xs = ad > 13 ? (ad - 13) / 0.3 : 0;
          let len = range;
          if (xs >= range) { rows.push(null); continue; }
          const yy = ey + dy;

          let x = xs; for (; x < range; x += 4) if (w.solidPx(ex + f * x, yy)) break;
          rows.push([xs, Math.min(range, x)]);

        cc = gd.cone = { t: w.t >> 2, f, rows, hh };
      }
      g.fillStyle = this.conePat[col];
      const rows = cc.rows;
      for (let i = 0; i < rows.length; i++) {

    const sus = lv === 2 ? 100 : w.maxSus; if (sus > 0) { g.fillStyle = PAL_HEX[sus > 66 ? C.bred : sus > 33 ? C.orng : C.lgold]; g.fillRect(ex + 17, 12, Math.round(38 * sus / 100), 2); }

    if (w.ambient < 1) { const lit = w.lightAt(P.x, P.y - 12); const sh = lit > 0.6 ? 'LIT' : 'SHADOW'; Font.draw(g, sh, 150, 2, lit > 0.6 ? C.lgold : C.pale); g.fillStyle = ink; g.fillRect(150, 11, 30, 4); g.fillStyle = PAL_HEX[lit > 0.6 ? C.lgold : C.sky]; g.fillRect(151, 12, Math.round(28 * clamp(lit, 0, 1)), 2); }

      else { const sc = (w.t >> 1) % (wd + 60); Font.draw(g, s, 4 - sc, VH - 11, C.cream); Font.draw(g, s, 4 - sc + wd + 60, VH - 11, C.cream); }
    }
    /* boss bar */
    if (w.boss && !w.boss.dead && w.boss.active) {

      g.fillStyle = 'rgba(10,8,18,.78)'; g.fillRect(x - 4, y - 10, bw + 8, 22);
      Font.center(g, b.name || b.type.toUpperCase(), VW / 2, y - 7, C.bred);
      g.fillStyle = ink; g.fillRect(x - 1, y + 2, bw + 2, 7); g.fillStyle = PAL_HEX[C.dpurp]; g.fillRect(x, y + 3, bw, 5);
      g.fillStyle = PAL_HEX[C.bred]; g.fillRect(x, y + 3, Math.max(0, Math.round(bw * b.hp / b.maxhp)), 5); g.fillStyle = PAL_HEX[C.salm]; g.fillRect(x, y + 3, Math.max(0, Math.round(bw * b.hp / b.maxhp)), 1);
    }
    /* tutorial hint bubble / toasts */

    /* pebble ready / stealth hints are kept out of the HUD to keep it clean */

/* ---- 70_scenes.js ---- */
/* ============================================================================
   70_scenes.js : scene manager + retro transitions + all menu / story screens.
   ========================================================================== */
const S = {
  cur: null, stack: [], trn: null, shuffle: null,
  go(sc) { if (this.cur && this.cur.leave) this.cur.leave(); this.stack.length = 0; this.cur = sc; Inp.clear(); if (sc.enter) sc.enter(); },
  push(sc) { this.stack.push(this.cur); this.cur = sc; Inp.clear(); if (sc.enter) sc.enter(); },
  pop() { const p = this.stack.pop(); if (this.cur.leave) this.cur.leave(); this.cur = p; Inp.clear(); if (p.resume) p.resume(); },
  trans(type, cb) {
    if (this.trn) return;
    this.trn = { type, t: 0, dur: type === 'iris' ? 22 : 18, cb, mid: false };
    if (!this.shuffle) { const a = []; for (let i = 0; i < 12 * 16; i++) a.push(i); const r = rng(5); for (let i = a.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } this.shuffle = a; }
    Snd.sfx('menuMove', { vol: 0.3 });
  },
  update() {
    const t = this.trn;
    if (t) {
      t.t++;
      if (!t.mid && t.t >= t.dur) { t.mid = true; Inp.clear(); if (t.cb) t.cb(); }
      if (t.t >= t.dur * 2) this.trn = null;
      return;
    }
    this.cur.update();
  },
  draw(g) {
    if (this.cur.overlay && this.stack.length) this.stack[this.stack.length - 1].draw(g);
    this.cur.draw(g);
    if (this.trn) this.drawTrans(g);
  },
  drawTrans(g) {
    const t = this.trn; let p = t.t < t.dur ? t.t / t.dur : 2 - t.t / t.dur;
    p = clamp(p, 0, 1); g.fillStyle = PAL_HEX[C.ink];
    if (t.type === 'blinds') {
      const bw = 24, w = Math.ceil(bw * p);
      for (let x = 0; x < VW; x += bw) g.fillRect(x, 0, w, VH);
    } else if (t.type === 'dissolve') {
      const n = Math.floor(p * 192), sh = this.shuffle;
      for (let i = 0; i < n; i++) { const k = sh[i]; g.fillRect((k % 12) * 20, ((k / 12) | 0) * 20, 20, 20); }
    } else {
      const R = (1 - p) * 210, cx = VW / 2, cy = VH / 2;
      for (let y = 0; y < VH; y += 4) {
        const dy = y + 2 - cy, h = R * R - dy * dy;
        if (h <= 0) g.fillRect(0, y, VW, 4); else { const hw = Math.sqrt(h) >> 2 << 2; g.fillRect(0, y, cx - hw, 4); g.fillRect(cx + hw, y, VW - cx - hw, 4); }
      }
    }
  }
};

/* ---------------------------------------------------------------- shared UI bits */
function softkeys(g, l, r) {
  g.fillStyle = PAL_HEX[C.ink]; g.fillRect(0, VH - 15, VW, 15); g.fillStyle = PAL_HEX[C.dpurp]; g.fillRect(0, VH - 15, VW, 1);
  if (l) Font.draw(g, l, 5, VH - 11, C.lgold);
  if (r) Font.right(g, r, VW - 5, VH - 11, C.lgold);
}
function panel(g, x, y, w, h, fill) {
  g.fillStyle = PAL_HEX[C.ink]; g.fillRect(x, y, w, h); g.fillStyle = PAL_HEX[C.gold]; g.fillRect(x + 1, y + 1, w - 2, h - 2);
  g.fillStyle = PAL_HEX[fill === undefined ? C.night : fill]; g.fillRect(x + 2, y + 2, w - 4, h - 4);
}
function bgStars(g, t, seed) {
  const r = rng(seed || 3);
  for (let i = 0; i < 46; i++) { const x = (r() * VW) | 0, y = (r() * 190) | 0, tw = ((t >> 4) + i) % 9 === 0; g.fillStyle = PAL_HEX[tw ? C.white : (i % 3 ? C.pale : C.sky)]; g.fillRect(x, y, 1, 1); }
}

class MenuList {
  constructor(items, x, y, w, rowH) { this.items = items; this.x = x; this.y = y; this.w = w; this.rh = rowH || 15; this.cur = 0; this.t = 0; }
  update() {
    this.t++;
    const p = Inp.pressed, n = this.items.length;
    if (p & IN.U) { this.move(-1); } if (p & IN.D) { this.move(1); }
    const it = this.items[this.cur];
    if ((p & IN.L) && it.adj) { it.adj(-1); Snd.sfx('menuMove'); }
    if ((p & IN.R) && it.adj) { it.adj(1); Snd.sfx('menuMove'); }
    if ((p & (IN.OK | IN.ACT)) && !it.off) { Snd.sfx('menuOk'); if (it.fn) it.fn(); else if (it.adj) it.adj(1); }
  }
  move(d) { const n = this.items.length; let k = this.cur; do { k = (k + d + n) % n; } while (this.items[k].off && k !== this.cur); this.cur = k; Snd.sfx('menuMove'); }
  tap(x, y) {
    const i = Math.floor((y - this.y) / this.rh);
    if (x >= this.x && x <= this.x + this.w && i >= 0 && i < this.items.length) {
      if (this.items[i].off) return false;
      if (i === this.cur) { Snd.sfx('menuOk'); const it = this.items[i]; if (it.fn) it.fn(); else if (it.adj) it.adj(1); }
      else { this.cur = i; Snd.sfx('menuMove'); }
      return true;
    }
    return false;
  }
  draw(g) {
    this.items.forEach((it, i) => {
      const y = this.y + i * this.rh, sel = i === this.cur, lab = typeof it.label === 'function' ? it.label() : it.label;
      if (sel) { g.fillStyle = PAL_HEX[C.ink]; g.fillRect(this.x - 2, y - 2, this.w + 4, this.rh); g.fillStyle = PAL_HEX[C.lgold]; g.fillRect(this.x - 1, y - 1, this.w + 2, this.rh - 2); g.fillStyle = PAL_HEX[C.gold]; g.fillRect(this.x - 1, y + this.rh - 4, this.w + 2, 1); }
      const col = it.off ? C.dgray : sel ? C.ink : C.cream;
      Font.draw(g, lab, this.x + 12, y + 2, col);
      if (sel && ((this.t >> 3) & 1)) Font.draw(g, '►', this.x + 3, y + 2, C.ink);
    });
  }
}

  if (secretsTotal && st.secrets >= secretsTotal) p += 10;
  if (coinsTotal && (st.coins + st.gems) >= coinsTotal * 0.8) p += 10;
  if (st.time < (def.par || 300)) p += 10;

}
