    var W = R * 2 + 4, H = R + 6;
    var c = mk(W, H), ctx = g(c);
    if (ctx) {
      var cols = ['#ff4d4d', '#ff9a3c', '#ffe45c', '#5ad07a', '#4db8ff', '#4a5ae8', '#a86ae8'];
      var cx = W / 2, cy = H;
      var outer = R, inner = R - bands * band;
      /* scan the bounding box once and classify each pixel by its radius */
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var dx = x - cx + 0.5, dy = y - cy + 0.5;
          if (dy > 0) continue;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > outer || d < inner) continue;
          var bi = Math.floor((outer - d) / band);
          if (bi < 0 || bi >= bands) continue;
          px(ctx, x, y, 1, 1, cols[bi]);
        }
      }
      /* dithered outer edge so it fades into the sky instead of hard-stopping */
      ctx.globalAlpha = 0.5;
      for (var y2 = 0; y2 < H; y2++) {
        for (var x2 = (y2 & 1); x2 < W; x2 += 2) {
          var ddx = x2 - cx + 0.5, ddy = y2 - cy + 0.5;
          if (ddy > 0) continue;
          var dd = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dd <= outer && dd > outer - 1.5) px(ctx, x2, y2, 1, 1, cols[0]);
          if (dd >= inner && dd < inner + 1.5) px(ctx, x2, y2, 1, 1, cols[6]);
        }
      }
      ctx.globalAlpha = 1;
    }
    CB[key] = c;
    return c;
  }

  /** Tileable sky strip with sparsely scattered clouds (not a solid band). */
  function cloudStrip(theme, idx) {
    var key = 'clouds|' + theme + '|' + idx;
    if (CB[key]) return CB[key];
    var T = T_(theme);
    var W = 320, H = 48;
    var c = mk(W, H), ctx = g(c);
    if (ctx) {
      var r = rngOf(hash(theme) * 17 + idx * 6151);
      var n = idx === 0 ? 3 : 4;
      for (var i = 0; i < n; i++) {
        var big = r() < 0.5;
        var img = dCloud(T, big);
        /* keep clouds clear of the wrap seam so tiling is invisible */
        var x = Math.round(8 + (i / n) * (W - 80) + r() * 26);
        var y = Math.round(r() * (H - 24));
        ctx.globalAlpha = idx === 0 ? 1 : 0.75;
        ctx.drawImage(img, x, y);
        ctx.globalAlpha = 1;
      }
    }
    CB[key] = c;
    return c;
  }

  /** Deterministic star field, tileable. */
  function starField(theme) {
    var key = 'stars|' + theme;
    if (CB[key]) return CB[key];
    var W = 256, H = 160;
    var c = mk(W, H), ctx = g(c);
    if (ctx) {
      var r = rngOf(0xC0FFEE);
      for (var i = 0; i < 130; i++) {
        var x = Math.floor(r() * W), y = Math.floor(r() * H);
        var b = r();
        var col = b > 0.88 ? '#ffffff' : (b > 0.6 ? '#dfe8ff' : '#9fb0d8');
        px(ctx, x, y, 1, 1, col);
        if (b > 0.94) { px(ctx, x - 1, y, 3, 1, rgba(col, 0.5)); px(ctx, x, y - 1, 1, 3, rgba(col, 0.5)); }
      }
    }
    CB[key] = c;
    return c;
  }

  /** Horizontally tile `img` across width w at (offsetX, y). */
  function tileX(ctx, img, offsetX, y, w, alpha) {
    if (!img || !img.width) return;
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    var iw = img.width;
    var start = -(((offsetX % iw) + iw) % iw);
    for (var x = start; x < w; x += iw) ctx.drawImage(img, Math.round(x), Math.round(y));
    if (alpha !== undefined) ctx.globalAlpha = 1;
  }

  function drawBG(ctx, theme, camX, camY, t, w, h, quality) {
    if (!ctx) return;
    var T = T_(theme);
    quality = quality === undefined ? 1 : quality;

    /* --- sky --- */
    var sky = skyCanvas(theme, h);
    ctx.drawImage(sky, 0, 0, 2, h, 0, 0, w, h);
    if (quality <= 0) return;                    /* cheapest path: sky only */

    var yBase = h - Math.min(h * 0.55, 96) - camY * 0.14;

    switch (theme) {
      case 'night': {
        tileX(ctx, starField(theme), camX * 0.03, -camY * 0.05, w);
        /* twinkle: a few stars brighten on a slow cycle */
        var tw = (t * 1.4) | 0;
        for (var s = 0; s < 6; s++) {
          var sx = ((s * 97 + tw * 31) % 256) - (camX * 0.03 % 256);
          var sy = (s * 53) % 90;
          ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s));
          px(ctx, Math.round(((sx % w) + w) % w), Math.round(sy - camY * 0.05), 1, 1, '#ffffff');
          ctx.globalAlpha = 1;
        }
        /* moon */
        var mx = w - 54 - camX * 0.04, my = 22 - camY * 0.04;
        ell(ctx, Math.round(mx), Math.round(my), 26, 26, '#f4f0d8');
        ell(ctx, Math.round(mx + 7), Math.round(my - 3), 22, 22, T.sky1);
        if (quality >= 2) {
          ell(ctx, Math.round(mx + 4), Math.round(my + 14), 5, 5, '#ddd8c0');
          ell(ctx, Math.round(mx + 14), Math.round(my + 18), 4, 4, '#ddd8c0');
        }
        tileX(ctx, ridgeStrip(theme, 0), camX * 0.12, yBase, w, 0.85);
        tileX(ctx, ridgeStrip(theme, 1), camX * 0.3, yBase + 22, w);
        break;
      }
      case 'sunset': {
        /* low sun disc */
        var sunX = w * 0.72 - camX * 0.03, sunY = h * 0.44 - camY * 0.05;
        ell(ctx, Math.round(sunX - 30), Math.round(sunY - 30), 60, 60, rgba('#ffd36a', 0.85));
        ell(ctx, Math.round(sunX - 22), Math.round(sunY - 22), 44, 44, '#ffe9a8');
        /* long cloud bands */
        for (var b = 0; b < 5; b++) {
          var by = 18 + b * 13 - camY * 0.06;
          ctx.globalAlpha = 0.4 + b * 0.08;
          px(ctx, 0, Math.round(by), w, 3 + (b & 1), b & 1 ? '#ff9a6a' : '#c25a8a');
          ctx.globalAlpha = 1;
        }
        tileX(ctx, ridgeStrip(theme, 0), camX * 0.1, yBase - 8, w, 0.9);
        tileX(ctx, ridgeStrip(theme, 1), camX * 0.28, yBase + 20, w);
        if (quality >= 2) tileX(ctx, cloudStrip(theme, 0), camX * 0.06, 10 - camY * 0.05, w, 0.5);
        break;
      }
      case 'forest': {
        ctx.globalAlpha = 0.5;
        px(ctx, 0, Math.round(h * 0.3), w, Math.round(h * 0.7), mix(T.sky2, T.leafD, 0.35));
        ctx.globalAlpha = 1;
        tileX(ctx, treeLine(theme, 0), camX * 0.08, yBase - 26, w, 0.55);
        tileX(ctx, treeLine(theme, 1), camX * 0.2, yBase - 6, w, 0.75);
        if (quality >= 2) {
          tileX(ctx, treeLine(theme, 2), camX * 0.4, yBase + 14, w, 0.9);
          /* drifting light shafts */
          ctx.globalAlpha = 0.07;
          for (var sh = 0; sh < 4; sh++) {
            var shx = ((sh * 90 + t * 6) % (w + 120)) - 60;
            ctx.fillStyle = '#fff6d0';
            ctx.beginPath();
            ctx.moveTo(shx, 0); ctx.lineTo(shx + 26, 0);
            ctx.lineTo(shx + 60, h); ctx.lineTo(shx + 34, h);
            ctx.closePath(); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        break;
      }
      case 'cave': {
        /* faint rock strata */
        for (var st = 0; st < 6; st++) {
          var sy2 = (st * 34 - (camY * 0.1) % 34);
          ctx.globalAlpha = 0.25;
          px(ctx, 0, Math.round(sy2), w, 2, T.stoneD);
          ctx.globalAlpha = 1;
        }
        if (quality >= 1) {
          /* distant glowing crystals */
          var cr = rngOf(1337);
          for (var q = 0; q < 10; q++) {
            var qx = (q * 137) % 512, qy = 30 + (q * 61) % 120;
            var dx = qx - (camX * 0.18) % 512;
            dx = ((dx % (w + 60)) + (w + 60)) % (w + 60) - 30;
            ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 1.5 + q);
            ell(ctx, Math.round(dx), Math.round(qy - camY * 0.1), 6, 14, T.glow || '#7bd8ff');
            ctx.globalAlpha = 1;
          }
        }
        if (quality >= 2) {
          /* drifting dust motes */
          for (var d = 0; d < 14; d++) {
            var ddx = ((d * 73 + t * 9) % (w + 40)) - 20;
            var ddy = ((d * 51 + t * 5) % h);
            ctx.globalAlpha = 0.18;
            px(ctx, Math.round(ddx), Math.round(ddy), 1, 1, '#e8e0d0');
            ctx.globalAlpha = 1;
          }
        }
        break;
      }
      case 'water': {
        /* caustic light bands */
        for (var cb = 0; cb < 7; cb++) {
          var cy2 = (cb * 26 + Math.sin(t * 0.8 + cb) * 6) - (camY * 0.12) % 26;
          ctx.globalAlpha = 0.12;
          px(ctx, 0, Math.round(cy2), w, 4, '#a6e2ff');
          ctx.globalAlpha = 1;
        }
        tileX(ctx, ridgeStrip(theme, 0), camX * 0.1, yBase + 10, w, 0.5);
        if (quality >= 2) {
          /* slow rising bubbles */
          for (var bb = 0; bb < 12; bb++) {
            var bx2 = (bb * 83) % (w + 40) - 20;
            var by2 = h - ((t * 14 + bb * 47) % (h + 40));
            ctx.globalAlpha = 0.3;
            ell(ctx, Math.round(bx2), Math.round(by2), 3, 3, '#cfefff');
            ctx.globalAlpha = 1;
          }
        }
        break;
      }
      case 'castle': {
        /* pulsing lava glow along the bottom */
        var pulse = 0.35 + 0.15 * Math.sin(t * 1.6);
        ctx.globalAlpha = pulse;
        px(ctx, 0, Math.round(h * 0.62), w, Math.round(h * 0.38), '#8a1c06');
        ctx.globalAlpha = pulse * 0.6;
        px(ctx, 0, Math.round(h * 0.74), w, Math.round(h * 0.26), '#e8420e');
        ctx.globalAlpha = 1;
        /* pillar silhouettes */
        var pw = 22, gap = 74;
        var off = -((camX * 0.22) % gap);
        for (var pcol = 0; pcol * gap + off < w + gap; pcol++) {
          var pxx = Math.round(pcol * gap + off);
          px(ctx, pxx, 0, pw, h, '#160d18');
          px(ctx, pxx + pw - 3, 0, 3, h, '#241328');
          if (quality >= 2) {
            for (var ty2 = 20; ty2 < h; ty2 += 40) {
              px(ctx, pxx + 4, Math.round(ty2 - (camY * 0.22) % 40), pw - 8, 2, '#2e1a2e');
            }
          }
        }
        break;
      }
      default: {                                  /* grass */
        if (quality >= 1) {
          /* rainbow arcs over the valley, well behind the cloud layer */
          var rb = rainbowCanvas(theme);
          var period = 1400;                       /* world px between arcs */
          var rx = -(((camX * 0.09) % period) + period) % period;
          for (var ri = 0; rx + ri * period < w + rb.width; ri++) {
            ctx.globalAlpha = 0.45;
            ctx.drawImage(rb, Math.round(rx + ri * period), Math.round(yBase - rb.height + 30 - camY * 0.04));
            ctx.globalAlpha = 1;
          }
        }
        tileX(ctx, cloudStrip(theme, 0), camX * 0.05, 8 - camY * 0.05, w, 0.95);
        if (quality >= 1) tileX(ctx, cloudStrip(theme, 1), camX * 0.12, 40 - camY * 0.06, w, 0.8);
        tileX(ctx, ridgeStrip(theme, 0), camX * 0.14, yBase, w, 0.9);
        tileX(ctx, ridgeStrip(theme, 1), camX * 0.32, yBase + 24, w);
        break;
      }
    }
  }

  /* =========================================================================
   * 10. LOGO
   * =======================================================================*/

  /* 5x7 chunky letterforms for the wordmark (bit 4 = leftmost) */
  var LOGO_FONT = {
    E: [0x1F, 0x10, 0x10, 0x1E, 0x10, 0x10, 0x1F],
    M: [0x11, 0x1B, 0x15, 0x15, 0x11, 0x11, 0x11],
    B: [0x1E, 0x11, 0x11, 0x1E, 0x11, 0x11, 0x1E],
    R: [0x1E, 0x11, 0x11, 0x1E, 0x14, 0x12, 0x11],
    L: [0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x1F],
    A: [0x0E, 0x11, 0x11, 0x1F, 0x11, 0x11, 0x11],
    P: [0x1E, 0x11, 0x11, 0x1E, 0x10, 0x10, 0x10]
  };

  function buildLogo() {
    var word = 'EMBERLEAP';
    var S = 4;                                   /* pixels per font pixel */
    var lw = 5 * S, gapw = S;
    var W = word.length * (lw + gapw) + 16;
    var H = 7 * S + 18;
    var c = mk(W, H), ctx = g(c);
    if (!ctx) return c;

    for (var i = 0; i < word.length; i++) {
      var gl = LOGO_FONT[word[i]];
      if (!gl) continue;
      var ox = 8 + i * (lw + gapw);
      var oy = 8;
      for (var r = 0; r < 7; r++) {
        for (var b = 0; b < 5; b++) {
          if (!((gl[r] >> (4 - b)) & 1)) continue;
          var X = ox + b * S, Y = oy + r * S;
          /* warm vertical gradient across the whole wordmark */
          var t = r / 6;
          var face = mix('#ffe27a', '#e8420e', t);
          px(ctx, X, Y, S, S, face);
          px(ctx, X, Y, S, 1, mix(face, '#ffffff', 0.55));       /* top bevel */
          px(ctx, X, Y + S - 1, S, 1, shade(face, -40));         /* bottom bevel */
        }
      }
    }
    outline(c, INK);
    outline(c, INK);                             /* 2px outline reads better big */

    /* leaf motif sprouting from the final P */
    var lx = 8 + (word.length - 1) * (lw + gapw) + lw - 4;
    ell(ctx, lx, 0, 14, 9, PAL.leaf);
    ell(ctx, lx + 2, 1, 9, 5, PAL.leafL);
    px(ctx, lx + 1, 7, 2, 5, PAL.leafD);
    return c;
  }

  function drawLogo(ctx, x, y, t) {
    if (!ctx || !LOGO) return;
    var bob = Math.round(Math.sin(t * 1.6) * 3);
    var dx = Math.round(x - LOGO.width / 2);
    var dy = Math.round(y + bob);
    /* drop shadow */
    ctx.globalAlpha = 0.3;
    ctx.drawImage(LOGO, dx + 3, dy + 4);
    ctx.globalAlpha = 1;
    ctx.drawImage(LOGO, dx, dy);
    /* travelling shine sweep */
    var sweep = ((t * 90) % (LOGO.width + 160)) - 80;
    ctx.save();
    ctx.beginPath();
    ctx.rect(dx, dy, LOGO.width, LOGO.height);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(dx + sweep, dy + LOGO.height);
    ctx.lineTo(dx + sweep + 22, dy + LOGO.height);
    ctx.lineTo(dx + sweep + 46, dy);
    ctx.lineTo(dx + sweep + 24, dy);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* =========================================================================
   * 11. INIT + PUBLIC API
   * =======================================================================*/

  function init() {
    if (ready) return;
    BLANK = mk(1, 1);
    BLANK16 = mk(16, 16);
    buildAllTiles();
    buildAllHeroes();
    buildAllEnemies();
    buildAllItems();
    buildAllDecor();
    LOGO = buildLogo();
    ready = true;
  }

  function tile(id, theme, variantSeed) {
    var v = ((variantSeed | 0) % 4 + 4) % 4;
    return CT[id + '|' + theme + '|' + v] ||
      CT[id + '|grass|' + v] ||
      BLANK16;
  }

  function hero(form, anim, frame) {
    var k = form + '|' + anim + '|' + (frame | 0);
    var r = CH[k];
    if (r) return r;
    var n = HERO_ANIMS[anim];
    if (n) {
      r = CH[form + '|' + anim + '|' + (((frame | 0) % n + n) % n)];
      if (r) return r;
    }
    return CH[form + '|idle|0'] || CH['small|idle|0'];
  }

  function enemy(type, anim, frame) {
    var k = type + '|' + anim + '|' + (frame | 0);
    var r = CE[k];
    if (r) return r;
    var anims = ENEMY_ANIMS[type];
    if (anims && anims[anim]) {
      var n = anims[anim];
      r = CE[type + '|' + anim + '|' + (((frame | 0) % n + n) % n)];
      if (r) return r;
    }
    if (anims) {
      for (var first in anims) return CE[type + '|' + first + '|0'];
    }
    return { c: BLANK16, ox: 0, oy: 0 };
  }

  function item(name, frame) {
    var n = ITEM_FRAMES[name] || 1;
    return CI[name + '|' + (((frame | 0) % n + n) % n)] || { c: BLANK16, ox: 0, oy: 0 };
  }

  function decor(name, theme, frame) {
    var n = DECOR_FRAMES[name] || 1;
    return CD[name + '|' + theme + '|' + (((frame | 0) % n + n) % n)] ||
      CD[name + '|grass|0'] || BLANK16;
  }

  return {
    init: init,
    tile: tile,
    hero: hero,
    enemy: enemy,
    item: item,
    decor: decor,
    drawBG: drawBG,
    logo: drawLogo,
    logoCanvas: function () { return LOGO; },
    PAL: PAL,
    THEMES: THEMES,
    tileCanvasSize: TS,
    isReady: function () { return ready; }
  };
})();

/* ========================================================================
   PROCEDURAL AUDIO ENGINE
   ======================================================================== */

/* =========================================================================
 * EMBERLEAP — audio.js
 * Original chiptune music + SFX engine. 100% procedural Web Audio.
 * No samples, no fetch, no base64, no libraries.
 *
 * Public API (see SPEC.md "Audio module contract"):
 *   const audio = new AudioManager();
 *   audio.unlock()                        -> bool   (call from a user gesture)
 *   audio.setMusicVolume(v) / setSfxVolume(v)
 *   audio.playMusic(name, {fade:0.4})     -> void
 *   audio.stopMusic({fade:0.3}) / pauseMusic() / resumeMusic()
 *   audio.sfx(name)                       -> void
 *   audio.duckForJingle(name)             -> number (jingle length in seconds)
 *   audio.setLowQuality(bool)
 *   audio.suspend() / audio.resume()
 *
 * Every method is guarded: if there is no AudioContext the whole manager is a
 * silent no-op and NOTHING throws.
 *
 * Signal graph
 *   music players -> musicDuck -> musicGain -\
 *   jingle voices -------------> musicGain ---> master -> limiter -> dest
 *   sfx voices ---------------> sfxGain   --/
 *   (+ two feedback-delay sends: fxMusic -> musicGain, fxSfx -> sfxGain)
 *
 * Scheduling: ONE setInterval(25ms) lookahead scheduler that queues every note
 * falling inside the next 100ms against ctx.currentTime. Never a timer per note.
 * ========================================================================= */

class AudioManager {

  constructor() {
    // --- core nodes (all null until unlock()) ---------------------------
    this.ctx = null;
    this.master = null;
    this.limiter = null;
    this.musicGain = null;   // user music volume
    this.musicDuck = null;   // pause / jingle ducking (bypassed by jingles)
    this.sfxGain = null;
    this.fxMusic = null;     // echo send for music voices
    this.fxSfx = null;       // echo send for sfx voices
    this.noiseBuf = null;
    this.waves = null;       // PeriodicWave cache for pulse timbres
    this.vibGain = null;     // shared vibrato LFO output (cents)

    // --- mixer state ----------------------------------------------------
    this.musicVol = 0.55;
    this.sfxVol = 0.75;
    this.lowQuality = false;
    this.maxVoices = 12;
    this.suspended = false;

    // --- scheduler state ------------------------------------------------
    this.timer = null;
    this.LOOKAHEAD = 0.1;    // seconds scheduled ahead
    this.TICK_MS = 25;
    this.players = [];       // active music players (incl. ones fading out)
    this.currentName = null; // name of the non-fading player, or null
    this.musicPaused = false;
    this.jingleTimer = null;

    // --- sfx voice budget / rate limiting -------------------------------
    this.voices = [];        // {end, vel, stop}
    this._group = null;      // node collector for the sfx currently being built
    this.lastPlay = Object.create(null);
    this.RATE_LIMIT = 0.03;  // one identical sfx per 30ms

    // --- static music data ----------------------------------------------
    this.NOTE_STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    this.CHORDS = {
      maj:  [0, 4, 7, 12],
      min:  [0, 3, 7, 12],
      maj7: [0, 4, 7, 11],
      dom7: [0, 4, 7, 10],
      min7: [0, 3, 7, 10],
      dim:  [0, 3, 6, 9],
      sus4: [0, 5, 7, 12],
      five: [0, 7, 12, 19]
    };
    this._chordCache = Object.create(null);
    this.rawTracks = this._buildTracks();
    this.tracks = Object.create(null);   // prepared lazily on first play
    this.jingles = this._buildJingles();

    // Which jingles hand the music back afterwards.
    //   powerup / 1up      -> music resumes where it left off
    //   levelclear         -> music STAYS stopped (engine starts the next track)
    //   gameover           -> music STAYS stopped
    //   bossdead           -> music STAYS stopped (a levelclear normally follows)
    this.jingleResumes = { powerup: true, '1up': true, levelclear: false, gameover: false, bossdead: false };
  }

  /* =====================================================================
   * 1. LIFECYCLE
   * ===================================================================== */

  /** Create the AudioContext. MUST be called from a user gesture. Safe to
   *  call repeatedly. Returns true when audio is live. */
  unlock() {
    try {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.suspended = false;
        this._startClock();
        return true;
      }
      const Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
        : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext
        : null;
      if (!Ctor) return false;

      const ctx = new Ctor();
      this.ctx = ctx;

      // limiter -> destination
      const lim = ctx.createDynamicsCompressor();
      lim.threshold.value = -8;
      lim.knee.value = 6;
      lim.ratio.value = 12;
      lim.attack.value = 0.003;
      lim.release.value = 0.25;
      lim.connect(ctx.destination);
      this.limiter = lim;

      const master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(lim);
      this.master = master;

      this.musicGain = ctx.createGain();
      this.musicGain.gain.value = this.musicVol;
      this.musicGain.connect(master);

      this.musicDuck = ctx.createGain();
      this.musicDuck.gain.value = 1;
      this.musicDuck.connect(this.musicGain);

      this.sfxGain = ctx.createGain();
      this.sfxGain.gain.value = this.sfxVol;
      this.sfxGain.connect(master);

      this.fxMusic = this._makeEcho(this.musicGain, 0.21, 0.34, 0.5);
      this.fxSfx = this._makeEcho(this.sfxGain, 0.135, 0.22, 0.4);

      this.noiseBuf = this._makeNoise(ctx, 2.0);
      this.waves = {
        pulse25: this._makePulse(ctx, 0.25),
        pulse12: this._makePulse(ctx, 0.125),
        pulse50: this._makePulse(ctx, 0.5)
      };

      // one shared vibrato LFO for every melodic music voice (cheap character)
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 5.4;
      const lg = ctx.createGain();
      lg.gain.value = 5.5;              // ±5.5 cents
      lfo.connect(lg);
      lfo.start();
      this.vibGain = lg;

      if (ctx.state === 'suspended') ctx.resume();
      this._startClock();
      return true;
    } catch (e) {
      this.ctx = null;
      return false;
    }
  }

  /** Page hidden -> silence and stop burning CPU. */
  suspend() {
    if (!this.ctx) return;
    try {
      this.suspended = true;
      this._stopClock();
      if (this.ctx.suspend) this.ctx.suspend();
    } catch (e) { /* ignore */ }
  }

  /** Page visible again. */
  resume() {
    if (!this.ctx) return;
    try {
      this.suspended = false;
      if (this.ctx.resume) this.ctx.resume();
      const now = this.ctx.currentTime;
      for (let i = 0; i < this.players.length; i++) this.players[i].nextTime = now + 0.03;
      this._startClock();
    } catch (e) { /* ignore */ }
  }

  setMusicVolume(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    this.musicVol = Math.max(0, Math.min(1, v));
    if (!this.ctx) return;
    try { this._ramp(this.musicGain.gain, this.musicVol, 0.05); } catch (e) { /* ignore */ }
  }

  setSfxVolume(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    this.sfxVol = Math.max(0, Math.min(1, v));
    if (!this.ctx) return;
    try { this._ramp(this.sfxGain.gain, this.sfxVol, 0.05); } catch (e) { /* ignore */ }
  }

  /** Weak devices: halve polyphony and kill the echo sends. */
  setLowQuality(on) {
    this.lowQuality = !!on;
    this.maxVoices = this.lowQuality ? 6 : 12;
    if (!this.ctx) return;
    try {
      const g = this.lowQuality ? 0 : 1;
      this._ramp(this.fxMusic.gain, g, 0.1);
      this._ramp(this.fxSfx.gain, g, 0.1);
    } catch (e) { /* ignore */ }
  }

  /* =====================================================================
   * 2. GRAPH HELPERS
   * ===================================================================== */

  /** Feedback delay used as an aux send. Returns the send-input GainNode. */
  _makeEcho(dest, time, feedback, level) {
    const ctx = this.ctx;
    const input = ctx.createGain();
    input.gain.value = this.lowQuality ? 0 : 1;
    const dly = ctx.createDelay(1.0);
    dly.delayTime.value = time;
    const fb = ctx.createGain();
    fb.gain.value = feedback;
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 2600;
    const out = ctx.createGain();
    out.gain.value = level;
    input.connect(dly);
    dly.connect(tone);
    tone.connect(fb);
    fb.connect(dly);
    dly.connect(out);
    out.connect(dest);
    return input;
  }

  /** One reusable white-noise buffer (deterministic, seeded). */
  _makeNoise(ctx, seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let s = 0x2f6e2b1 >>> 0;
    for (let i = 0; i < len; i++) {
      s = (s * 1664525 + 1013904223) >>> 0;
      d[i] = ((s >>> 8) / 8388608) - 1;   // -1..1
    }
    return buf;
  }

  /** Band-limited pulse wave of the given duty cycle. */
  _makePulse(ctx, duty) {
    const H = 32;
    const real = new Float32Array(H);
    const imag = new Float32Array(H);
    for (let n = 1; n < H; n++) {
      imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
    }
    return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }

  _ramp(param, value, time) {
    const t = this.ctx.currentTime;
    try {
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.linearRampToValueAtTime(value, t + time);
    } catch (e) { param.value = value; }
  }

  /* =====================================================================
   * 3. NOTE / PITCH HELPERS
   * ===================================================================== */

  /** 'C#4' | 'Bb3' | 60  ->  midi number */
  _midi(n) {
    if (typeof n === 'number') return n;
    const s = String(n);
    const base = this.NOTE_STEP[s.charAt(0).toUpperCase()];
    if (base === undefined) return 60;
    let i = 1, acc = 0;
    while (i < s.length && (s.charAt(i) === '#' || s.charAt(i) === 'b')) {
      acc += (s.charAt(i) === '#') ? 1 : -1;
      i++;
    }
    const oct = parseInt(s.slice(i), 10);
    return (isNaN(oct) ? 4 : oct + 1) * 12 + base + acc;
  }

  _hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  /** 'C3:min' -> [midi...] */
  _chord(spec) {
    let c = this._chordCache[spec];
    if (c) return c;
    const parts = String(spec).split(':');
    const root = this._midi(parts[0]);
    const iv = this.CHORDS[parts[1]] || this.CHORDS.maj;
    c = iv.map((x) => root + x);
    this._chordCache[spec] = c;
    return c;
  }

  /** Chord tone by index, wrapping upward an octave at a time. */
  _chordTone(ch, idx) {
    const n = ch.length;
    const oct = Math.floor(idx / n);
    return ch[((idx % n) + n) % n] + 12 * oct;
  }

  /* =====================================================================
   * 4. LOW-LEVEL SYNTH VOICES
   * ===================================================================== */

  /**
   * Schedule one tone.
   * o = { wave, f0, f1, t, dur, peak, bus, a, d, s, r, glide, send, vib, q, filter, fEnd, detune }
   * Returns the absolute time the voice is fully silent.
   */
  _tone(o) {
    const ctx = this.ctx;
    const t = o.t;
    const dur = Math.max(0.02, o.dur);
    const peak = Math.max(0.0004, o.peak);
    const a = (o.a === undefined) ? 0.006 : o.a;
    const d = (o.d === undefined) ? 0.05 : o.d;
    const sus = (o.s === undefined) ? 0.7 : o.s;
    const rel = (o.r === undefined) ? 0.05 : o.r;

    const osc = ctx.createOscillator();
    const w = o.wave || 'square';
    if (this.waves && this.waves[w]) osc.setPeriodicWave(this.waves[w]);
    else osc.type = w;

    osc.frequency.setValueAtTime(Math.max(8, o.f0), t);
    if (o.f1 !== undefined && o.f1 !== o.f0) {
      const f1 = Math.max(8, o.f1);
      const gt = t + (o.glideTime === undefined ? dur : o.glideTime);
      if (o.glide === 'lin') osc.frequency.linearRampToValueAtTime(f1, gt);
      else osc.frequency.exponentialRampToValueAtTime(f1, gt);
    }
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);

    const g = ctx.createGain();
    const end = this._env(g.gain, t, dur, peak, a, d, sus, rel);

    let node = osc;
    let filt = null;
    if (o.filter) {
      filt = ctx.createBiquadFilter();
      filt.type = o.filter;
      filt.frequency.setValueAtTime(Math.max(30, o.fc || 1200), t);
      if (o.fEnd !== undefined) filt.frequency.exponentialRampToValueAtTime(Math.max(30, o.fEnd), t + dur);
      if (o.q !== undefined) filt.Q.value = o.q;
      node.connect(filt);
      node = filt;
    }
    node.connect(g);
    const bus = o.bus || this.sfxGain;
    g.connect(bus);
    if (o.send) { try { g.connect(o.send); } catch (e) { /* ignore */ } }

    if (o.vib && this.vibGain) {
      try { this.vibGain.connect(osc.detune); } catch (e) { /* ignore */ }
    }

    osc.onended = () => {
      if (o.vib && this.vibGain) { try { this.vibGain.disconnect(osc.detune); } catch (e) { /* ignore */ } }
      try { osc.disconnect(); } catch (e) { /* ignore */ }
      if (filt) { try { filt.disconnect(); } catch (e) { /* ignore */ } }
      try { g.disconnect(); } catch (e) { /* ignore */ }
    };
    osc.start(t);
    osc.stop(end + 0.02);
    if (this._group) this._group.push(osc, g);
    return end;
  }

  /**
   * Schedule one noise burst.
   * o = { t, dur, peak, bus, type, f0, f1, q, a, d, s, r, send, rate }
   */
  _noise(o) {
    const ctx = this.ctx;
    const t = o.t;
    const dur = Math.max(0.02, o.dur);
    const peak = Math.max(0.0004, o.peak);

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    // start from a rotating offset so repeated hits are not phase-identical
    const off = (this._noiseOff = ((this._noiseOff || 0) + 0.137) % 1.6);
    if (o.rate) src.playbackRate.value = o.rate;

    const filt = ctx.createBiquadFilter();
    filt.type = o.type || 'bandpass';
    filt.frequency.setValueAtTime(Math.max(30, o.f0 || 1200), t);
    if (o.f1 !== undefined) filt.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + dur);
    if (o.q !== undefined) filt.Q.value = o.q;

    const g = ctx.createGain();
    const end = this._env(g.gain, t, dur, peak,
      (o.a === undefined ? 0.002 : o.a),
      (o.d === undefined ? 0.04 : o.d),
      (o.s === undefined ? 0.4 : o.s),
      (o.r === undefined ? 0.04 : o.r));

    src.connect(filt);
    filt.connect(g);
    g.connect(o.bus || this.sfxGain);
    if (o.send) { try { g.connect(o.send); } catch (e) { /* ignore */ } }

    src.onended = () => {
      try { src.disconnect(); } catch (e) { /* ignore */ }
      try { filt.disconnect(); } catch (e) { /* ignore */ }
      try { g.disconnect(); } catch (e) { /* ignore */ }
    };
    src.start(t, off);
    src.stop(end + 0.02);
    if (this._group) this._group.push(src, g);
    return end;
  }

  /** AD(S)R on a gain param. Returns the absolute silence time. */
  _env(param, t, dur, peak, a, d, s, r) {
    const sl = Math.max(0.0002, peak * s);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + a);
    param.linearRampToValueAtTime(sl, t + a + d);
    const hold = Math.max(t + a + d + 0.001, t + dur);
    param.setValueAtTime(sl, hold);
    param.exponentialRampToValueAtTime(0.0001, hold + r);
    return hold + r;
  }

  /* =====================================================================
   * 5. SFX VOICE BUDGET
   * ===================================================================== */

  /** Reserve a slot; evicts the quietest live voice when over budget. */
  _budget(end, vel, stopFn) {
    const now = this.ctx.currentTime;
    // compact finished voices in place (no allocation)
    let w = 0;
    for (let i = 0; i < this.voices.length; i++) {
      if (this.voices[i].end > now) this.voices[w++] = this.voices[i];
    }
    this.voices.length = w;

    if (this.voices.length >= this.maxVoices) {
      let k = 0;
      for (let i = 1; i < this.voices.length; i++) {
        if (this.voices[i].vel < this.voices[k].vel) k = i;
      }
      const victim = this.voices[k];
      this.voices.splice(k, 1);
      if (victim && victim.stop) { try { victim.stop(); } catch (e) { /* ignore */ } }
    }
    this.voices.push({ end: end, vel: vel, stop: stopFn });
  }

  /* =====================================================================
   * 6. MUSIC DATA
   * Every track below is ORIGINAL material written for EMBERLEAP.
   * Format (raw):
   *   bpm, spb (steps per beat), barSteps, bars, chords[] (one per bar)
   *   lead : { wave, gain, notes:[ [step,'NOTE',durSteps,vel] ... ] }
   *   harm : { wave, gain, oct, arp:[ [stepInBar, chordToneIdx, dur, vel] ] }
   *   bass : { wave, gain, oct, arp:[...] }
   *   drums: { gain, pat:'k.s.h...' }   tiled over the loop
   * _prepTrack() expands this into per-voice {step,note(midi),dur,vel} arrays
   * indexed by step, which is what the scheduler walks.
   * ===================================================================== */

  _buildTracks() {
    const T = {};

    /* ---------------- TITLE: bright heroic fanfare, C major, 132bpm ---- */

          [64, 'C5', 4, 0.85], [68, 'E5', 4, 0.85], [72, 'G5', 6, 0.9], [78, 'E5', 2, 0.75],
          [80, 'A5', 4, 0.9], [84, 'G5', 4, 0.85], [88, 'E5', 8, 0.8],
          [96, 'D5', 4, 0.85], [100, 'F5', 4, 0.85], [104, 'A5', 4, 0.9], [108, 'F5', 4, 0.8],
          [112, 'D5', 4, 0.85], [116, 'B4', 4, 0.8], [120, 'C5', 8, 0.85]
        ]
      },
      harm: {
        wave: 'pulse25', gain: 0.05, oct: 1,
        arp: [[4, 1, 3, 0.35], [12, 2, 3, 0.3]]
      },
      bass: {
        wave: 'triangle', gain: 0.24, oct: 0,
        arp: [[0, 0, 6, 1], [8, 2, 6, 0.8]]
      },
      drums: { gain: 0.20, pat: '....h.......h...' + '....h.......h.h.' }
    };

    return T;
  }

  /** Expand a raw track definition into scheduler-ready voices. */
  _prepTrack(name) {
    const raw = this.rawTracks[name];
    if (!raw) return null;
    const len = raw.bars * raw.barSteps;
    const voices = [];

    const push = (kind, def, notes) => {
      const byStep = new Array(len);
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        const s = n.step % len;
        if (!byStep[s]) byStep[s] = [];
        byStep[s].push(n);
      }
      voices.push({
        kind: kind,
        wave: def.wave,
        gain: def.gain,
        vib: !!def.vib,
        echo: !!def.echo,
        byStep: byStep
      });
    };

    // melodic lead: explicit note list
    if (raw.lead) {
      const notes = raw.lead.notes.map((a) => ({
        step: a[0], note: this._midi(a[1]), dur: a[2], vel: (a[3] === undefined ? 1 : a[3])
      }));
      push('lead', raw.lead, notes);
    }
    // harmony + bass: chord-driven arpeggio patterns
    if (raw.harm) push('harm', raw.harm, this._expandArp(raw.harm, raw));
    if (raw.bass) push('bass', raw.bass, this._expandArp(raw.bass, raw));
    // drums: tiled pattern string
    if (raw.drums) {
      const pat = raw.drums.pat;
      const notes = [];
      for (let s = 0; s < len; s++) {
        const ch = pat.charAt(s % pat.length);
        if (ch && ch !== '.') notes.push({ step: s, note: ch, dur: 1, vel: 1 });
      }
      push('drums', raw.drums, notes);
    }

    const t = {
      name: name,
      len: len,
      stepDur: 60 / raw.bpm / raw.spb,
      voices: voices
    };
    this.tracks[name] = t;
    return t;
  }

  _expandArp(def, raw) {
    const out = [];
    const oct = def.oct || 0;
    for (let b = 0; b < raw.bars; b++) {
      const ch = this._chord(raw.chords[b % raw.chords.length]);
      for (let i = 0; i < def.arp.length; i++) {
        const p = def.arp[i];
        out.push({
          step: b * raw.barSteps + p[0],
          note: this._chordTone(ch, p[1]) + oct * 12,
          dur: p[2],
          vel: (p[3] === undefined ? 1 : p[3])
        });
      }
    }
    return out;
  }

  /* =====================================================================
   * 7. MUSIC TRANSPORT
   * ===================================================================== */

  _startClock() {
    if (this.timer || !this.ctx) return;
    this.timer = setInterval(() => { this._tick(); }, this.TICK_MS);
  }

  _stopClock() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }

  /** The one and only scheduler tick. */
  _tick() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const horizon = now + this.LOOKAHEAD;
      for (let i = this.players.length - 1; i >= 0; i--) {
        const p = this.players[i];
        if (p.deadAt !== undefined && now > p.deadAt) {
          try { p.bus.disconnect(); } catch (e) { /* ignore */ }
          this.players.splice(i, 1);
          continue;
        }
        if (this.musicPaused || p.fading) continue;
        // clock drift / long tab stall -> resync instead of spamming notes
        if (p.nextTime < now - 0.4) p.nextTime = now + 0.02;
        while (p.nextTime < horizon) {
          this._scheduleStep(p, p.step, p.nextTime);
          p.step = (p.step + 1) % p.def.len;
          p.nextTime += p.def.stepDur;
        }
      }
    } catch (e) { /* never let the clock die */ }
  }

  _scheduleStep(p, step, when) {
    const def = p.def;
    for (let v = 0; v < def.voices.length; v++) {
      const voice = def.voices[v];
      const list = voice.byStep[step];
      if (!list) continue;
      for (let i = 0; i < list.length; i++) {
        this._musicNote(p, voice, list[i], when);
      }
    }
  }

  _musicNote(p, voice, n, when) {
    const sd = p.def.stepDur;
    const dur = Math.max(0.03, n.dur * sd * 0.92);
    const send = (voice.echo && !this.lowQuality) ? this.fxMusic : null;

    if (voice.kind === 'drums') {
      this._drum(n.note, when, voice.gain, p.bus);
      return;
    }
    const peak = voice.gain * n.vel;
    let wave = voice.wave;
    // tiny pulse-width variation: alternate duty on adjacent notes for life
    if (wave === 'pulse25' && (n.step & 2)) wave = 'pulse12';
    else if (wave === 'pulse12' && (n.step & 2)) wave = 'pulse25';

    if (voice.kind === 'bass') {
      this._tone({
        wave: wave, f0: this._hz(n.note), t: when, dur: dur, peak: peak, bus: p.bus,
        a: 0.004, d: 0.06, s: 0.65, r: 0.05,
        filter: 'lowpass', fc: 1400
      });
    } else if (voice.kind === 'harm') {
      this._tone({
        wave: wave, f0: this._hz(n.note), t: when, dur: dur, peak: peak, bus: p.bus,
        a: 0.003, d: 0.05, s: 0.5, r: 0.05, send: send
      });
    } else {
      this._tone({
        wave: wave, f0: this._hz(n.note), t: when, dur: dur, peak: peak, bus: p.bus,
        a: 0.006, d: 0.07, s: 0.72, r: 0.06, vib: voice.vib, send: send
      });
    }
  }

  /** Noise/percussion kit used by the music tracks. */
  _drum(ch, t, gain, bus) {
    switch (ch) {
      case 'k': // kick
        this._tone({ wave: 'sine', f0: 155, f1: 44, t: t, dur: 0.11, peak: 0.55 * gain, bus: bus, a: 0.002, d: 0.05, s: 0.4, r: 0.05 });
        this._noise({ t: t, dur: 0.02, peak: 0.14 * gain, bus: bus, type: 'lowpass', f0: 900, a: 0.001, d: 0.015, s: 0.1, r: 0.02 });
        break;
      case 's': // snare
        this._noise({ t: t, dur: 0.09, peak: 0.30 * gain, bus: bus, type: 'bandpass', f0: 1900, f1: 1100, q: 0.8, a: 0.001, d: 0.05, s: 0.2, r: 0.05 });
        this._tone({ wave: 'triangle', f0: 220, f1: 170, t: t, dur: 0.05, peak: 0.16 * gain, bus: bus, a: 0.001, d: 0.03, s: 0.2, r: 0.03 });
        break;
      case 'h': // closed hat
        this._noise({ t: t, dur: 0.022, peak: 0.14 * gain, bus: bus, type: 'highpass', f0: 7200, q: 0.6, a: 0.001, d: 0.012, s: 0.15, r: 0.02 });
        break;
      case 'o': // open hat
        this._noise({ t: t, dur: 0.14, peak: 0.13 * gain, bus: bus, type: 'highpass', f0: 6400, q: 0.6, a: 0.001, d: 0.09, s: 0.25, r: 0.06 });
        break;
      case 't': // tom
        this._tone({ wave: 'triangle', f0: 240, f1: 120, t: t, dur: 0.13, peak: 0.30 * gain, bus: bus, a: 0.002, d: 0.07, s: 0.3, r: 0.05 });
        break;
      case 'c': // crash
        this._noise({ t: t, dur: 0.5, peak: 0.16 * gain, bus: bus, type: 'highpass', f0: 4200, q: 0.4, a: 0.002, d: 0.3, s: 0.25, r: 0.2 });
        break;
      default:
        break;
    }
  }

  /**
   * Start a track, crossfading out whatever is playing.
   * playMusic('overworld', {fade:0.4}) — calling it with the track that is
   * already playing is a no-op (it will un-pause a paused track though).
   */
  playMusic(name, opts) {
    if (!this.ctx) return;
    try {
      const fade = (opts && typeof opts.fade === 'number') ? Math.max(0.01, opts.fade) : 0.4;
      if (this.currentName === name) {
        if (this.musicPaused) this.resumeMusic();
        return;
      }
      const def = this.tracks[name] || this._prepTrack(name);
      if (!def) return;

      this._cancelJingleTimer();
      this.musicPaused = false;
      this._ramp(this.musicDuck.gain, 1, 0.05);

      const now = this.ctx.currentTime;
      // fade out everything currently running
      for (let i = 0; i < this.players.length; i++) {
        const old = this.players[i];
        if (old.fading) continue;
        old.fading = true;
        old.deadAt = now + fade + 0.15;
        this._ramp(old.bus.gain, 0.0001, fade);
      }

      const bus = this.ctx.createGain();
      bus.gain.value = 0.0001;
      bus.connect(this.musicDuck);
      bus.gain.setValueAtTime(0.0001, now);
      bus.gain.linearRampToValueAtTime(1, now + fade);

      this.players.push({
        name: name, def: def, bus: bus,
        step: 0, nextTime: now + 0.06,
        fading: false
      });
      this.currentName = name;
      this._startClock();
    } catch (e) { /* ignore */ }
  }

  /** Fade out and forget the current track. */
  stopMusic(opts) {
    if (!this.ctx) return;
    try {
      const fade = (opts && typeof opts.fade === 'number') ? Math.max(0.01, opts.fade) : 0.3;
      const now = this.ctx.currentTime;
      for (let i = 0; i < this.players.length; i++) {
        const p = this.players[i];
        p.fading = true;
        p.deadAt = now + fade + 0.15;
        this._ramp(p.bus.gain, 0.0001, fade);
      }
      this.currentName = null;
      this.musicPaused = false;
    } catch (e) { /* ignore */ }
  }

  /** Freeze the transport (keeps the play position). */
  pauseMusic() {
    if (!this.ctx || this.musicPaused) return;
    try {
      this.musicPaused = true;
      this._ramp(this.musicDuck.gain, 0.0001, 0.06);
    } catch (e) { /* ignore */ }
  }

  /** Resume from the frozen position. */
  resumeMusic() {
    if (!this.ctx || !this.musicPaused) return;
    try {
      this.musicPaused = false;
      const now = this.ctx.currentTime;
      for (let i = 0; i < this.players.length; i++) this.players[i].nextTime = now + 0.04;
      this._ramp(this.musicDuck.gain, 1, 0.12);
      this._startClock();
    } catch (e) { /* ignore */ }
  }

  /* =====================================================================
   * 8. JINGLES
   * Data: { dur, notes:[ [tSec, 'NOTE', durSec, vel, wave] ], drums:[[t,ch,gain]] }

   * ===================================================================== */

      },
      // Lost a life: slow sagging descent. Music stays stopped.
      gameover: {
        dur: 3.0,
        notes: [
          [0.00, 'G4', 0.24, 0.95, P], [0.26, 'F4', 0.24, 0.9, P], [0.52, 'Eb4', 0.24, 0.9, P],
          [0.78, 'D4', 0.36, 0.9, P],
          [1.20, 'Eb4', 0.24, 0.85, P], [1.46, 'D4', 0.24, 0.85, P], [1.72, 'Db4', 0.24, 0.85, P],
          [1.98, 'C4', 0.85, 0.95, P],
          [1.98, 'Eb4', 0.85, 0.55, Q], [1.98, 'G3', 0.85, 0.6, Q],

          [0.42, 'D5', 0.07, 0.9, P], [0.48, 'F#5', 0.07, 0.9, P], [0.54, 'A5', 0.07, 0.9, P],
          [0.60, 'D6', 0.07, 0.9, P], [0.66, 'F#6', 0.07, 0.9, P], [0.72, 'A6', 0.24, 1, P],

          [0.33, 'C6', 0.11, 1, Q], [0.44, 'D6', 0.11, 1, Q], [0.55, 'G6', 0.34, 1, Q],

        ],

      bossdead: {
        dur: 2.6,
        notes: [
          [0.55, 'E4', 0.10, 0.8, Q], [0.70, 'G4', 0.10, 0.8, Q], [0.85, 'B4', 0.10, 0.85, Q],

  }

  /**
   * Duck the music, play a jingle, then hand control back.
   *  'powerup' / '1up'                      -> music resumes automatically
   *  'levelclear' / 'gameover' / 'bossdead' -> music is left STOPPED
   * Returns the jingle length in seconds (0 if audio is unavailable), so the
   * engine can time its cutscene against it.
   */
  duckForJingle(name) {
    if (!this.ctx) return 0;
    try {
      const j = this.jingles[name];
      if (!j) return 0;
      const resumes = !!this.jingleResumes[name];
      this._cancelJingleTimer();

      if (resumes) this.pauseMusic();
      else this.stopMusic({ fade: 0.12 });

      const t0 = this.ctx.currentTime + 0.03;
      const bus = this.musicGain;   // jingles bypass musicDuck so they stay audible
      for (let i = 0; i < j.notes.length; i++) {
        const n = j.notes[i];
        this._tone({
          wave: n[4] || 'pulse25',
          f0: this._hz(this._midi(n[1])),
          t: t0 + n[0], dur: n[2], peak: 0.24 * (n[3] === undefined ? 1 : n[3]),
          bus: bus, a: 0.005, d: 0.05, s: 0.78, r: 0.07
        });
      }
      for (let i = 0; i < j.drums.length; i++) {
        const d = j.drums[i];
        this._drum(d[1], t0 + d[0], 0.45 * d[2], bus);
      }

      if (resumes) {
        const self = this;
        this.jingleTimer = setTimeout(() => {
          self.jingleTimer = null;
          self.resumeMusic();
        }, Math.round((j.dur + 0.08) * 1000));
      }
      return j.dur;
    } catch (e) {
      return 0;
    }
  }

  _cancelJingleTimer() {
    if (this.jingleTimer) { clearTimeout(this.jingleTimer); this.jingleTimer = null; }
  }

  /* =====================================================================
   * 9. SFX
   * ===================================================================== */

  /** Small deterministic-ish detune so repeated hits don't fatigue (±3%). */
  _wob(amount) {
    const a = (amount === undefined) ? 0.03 : amount;
    return 1 + (Math.random() * 2 - 1) * a;
  }

  /**
   * Play a named sound effect. Unknown names are ignored.
   * Rate limited to one identical sound per 30ms; polyphony capped by
   * setLowQuality()/maxVoices.
   */
  sfx(name) {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const last = this.lastPlay[name];
      if (last !== undefined && now - last < this.RATE_LIMIT) return;
      this.lastPlay[name] = now;

      const t = now + 0.002;
      const S = this.sfxGain;
      const group = [];
      this._group = group;   // collect this sound's nodes so it can be evicted
      const echo = this.lowQuality ? null : this.fxSfx;
      let end = t + 0.1;
      let vel = 0.6;

      switch (name) {

        /* --- movement ------------------------------------------------- */
        case 'jump':
          vel = 0.8;
          end = this._tone({ wave: 'pulse25', f0: 300 * this._wob(), f1: 720, t: t, dur: 0.13, peak: 0.20, bus: S, a: 0.004, d: 0.04, s: 0.6, r: 0.05, glide: 'exp' });
          break;
        case 'jumpbig':
          vel = 0.85;
          end = this._tone({ wave: 'pulse12', f0: 190 * this._wob(), f1: 520, t: t, dur: 0.17, peak: 0.23, bus: S, a: 0.005, d: 0.05, s: 0.6, r: 0.07, glide: 'exp' });
          this._tone({ wave: 'triangle', f0: 95, f1: 260, t: t, dur: 0.17, peak: 0.10, bus: S, a: 0.005, d: 0.05, s: 0.5, r: 0.06 });
          break;
        case 'land':
          vel = 0.4;
          end = this._noise({ t: t, dur: 0.05, peak: 0.13, bus: S, type: 'lowpass', f0: 1100, f1: 380, a: 0.001, d: 0.03, s: 0.2, r: 0.03 });
          this._tone({ wave: 'triangle', f0: 140, f1: 70, t: t, dur: 0.06, peak: 0.10, bus: S, a: 0.002, d: 0.03, s: 0.2, r: 0.03 });
          break;
        case 'swim':
          vel = 0.45;
          end = this._noise({ t: t, dur: 0.11, peak: 0.10, bus: S, type: 'bandpass', f0: 500 * this._wob(0.08), f1: 1500, q: 3, a: 0.01, d: 0.05, s: 0.4, r: 0.05 });
          this._tone({ wave: 'sine', f0: 320 * this._wob(), f1: 520, t: t, dur: 0.10, peak: 0.09, bus: S, a: 0.01, d: 0.04, s: 0.5, r: 0.05 });
          break;

        /* --- pickups -------------------------------------------------- */
        case 'coin': {
          vel = 0.7;
          const w = this._wob();
          this._tone({ wave: 'pulse25', f0: 1046 * w, t: t, dur: 0.045, peak: 0.15, bus: S, a: 0.002, d: 0.02, s: 0.8, r: 0.02 });
          end = this._tone({ wave: 'pulse25', f0: 1568 * w, t: t + 0.05, dur: 0.13, peak: 0.15, bus: S, a: 0.002, d: 0.03, s: 0.7, r: 0.07, send: echo });
          break;
        }
        case 'emberstone': {
          vel = 0.9;
          const base = [784, 988, 1174, 1568, 1976];
          for (let i = 0; i < base.length; i++) {
            end = this._tone({ wave: 'pulse12', f0: base[i], t: t + i * 0.045, dur: 0.10, peak: 0.15, bus: S, a: 0.002, d: 0.03, s: 0.7, r: 0.08, send: echo });
          }
          break;
        }
        case 'powerup': {
          vel = 0.9;
          const seq = [523, 659, 784, 1046, 1318, 1568];
          for (let i = 0; i < seq.length; i++) {
            end = this._tone({ wave: 'pulse25', f0: seq[i], t: t + i * 0.048, dur: 0.09, peak: 0.16, bus: S, a: 0.003, d: 0.03, s: 0.7, r: 0.06 });
          }
          break;
        }
        case 'powerdown': {
          vel = 0.85;
          const seq = [1046, 880, 698, 587, 466, 392];
          for (let i = 0; i < seq.length; i++) {
            end = this._tone({ wave: 'pulse12', f0: seq[i], t: t + i * 0.055, dur: 0.10, peak: 0.15, bus: S, a: 0.003, d: 0.03, s: 0.65, r: 0.06 });
          }
          break;

/* ------------------------------------------------------------------- math */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function approach(v, target, delta) {
  if (v < target) return Math.min(v + delta, target);
  if (v > target) return Math.max(v - delta, target);
  return target;
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
/* deterministic PRNG */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = Math.random;
function rrange(a, b) { return a + Math.random() * (b - a); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

const FONT_W = 5, FONT_H = 7;

const Text = (function () {
  const cache = new Map();
  let cacheKeys = [];

  function build(str, color, outline) {
    const w = str.length * (FONT_W + 1);
    const pad = outline ? 1 : 0;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w + pad * 2);
    c.height = FONT_H + pad * 2;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    // outline pass — 8-way dilation in the outline colour
    if (outline) {
      g.fillStyle = outline;
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (!ox && !oy) continue;
          blit(g, str, pad + ox, pad + oy);
        }
      }
    }
    g.fillStyle = color;
    blit(g, str, pad, pad);
    return c;

    function blit(g2, s, dx, dy) {
      for (let i = 0; i < s.length; i++) {
        const gl = FONT_GLYPHS[s[i]] || FONT_GLYPHS[s[i].toUpperCase()] || FONT_GLYPHS['?'];
        const bx = dx + i * (FONT_W + 1);
        for (let r = 0; r < FONT_H; r++) {
          const bits = gl[r];
          if (!bits) continue;
          // pack horizontal runs so we emit as few fillRects as possible
          let run = 0;
          for (let cbit = 0; cbit < FONT_W; cbit++) {
            const on = (bits >> (FONT_W - 1 - cbit)) & 1;
            if (on) run++;
            if ((!on || cbit === FONT_W - 1) && run) {
              const endCol = on ? cbit + 1 : cbit;
              g2.fillRect(bx + endCol - run, dy + r, run, 1);
              run = 0;
            }
          }
        }
      }
    }
  }

  function get(str, color, outline) {
    const key = str + '|' + color + '|' + (outline || '');
    let c = cache.get(key);
    if (!c) {
      c = build(str, color, outline);
      cache.set(key, c);
      cacheKeys.push(key);
      if (cacheKeys.length > 400) {          // bounded — avoids unbounded growth on score text
        for (let i = 0; i < 100; i++) cache.delete(cacheKeys[i]);
        cacheKeys = cacheKeys.slice(100);
      }
    }
    return c;
  }

  /** width of a string at a given scale (includes the 1px letter gap) */
  function width(str, scale) { return str.length * (FONT_W + 1) * (scale || 1); }

  /**
   * draw(ctx, str, x, y, {scale,color,outline,align})
   * align: 'left'|'center'|'right'.  x,y are in the destination ctx's units.
   */
  function draw(ctx, str, x, y, opt) {
    opt = opt || {};
    const s = opt.scale || 1;
    const col = opt.color || '#ffffff';
    const out = opt.outline === undefined ? '#1a1226' : opt.outline;
    const c = get(String(str), col, out);
    const pad = out ? 1 : 0;
    let dx = x;
    const w = (str.length * (FONT_W + 1)) * s;
    if (opt.align === 'center') dx = Math.round(x - w / 2);
    else if (opt.align === 'right') dx = Math.round(x - w);
    ctx.drawImage(c, Math.round(dx - pad * s), Math.round(y - pad * s), c.width * s, c.height * s);
    return w;
  }

  return { draw: draw, width: width, get: get, H: FONT_H, W: FONT_W };
})();

const SAVE_KEY = 'emberleap.save.v1';

const SaveManager = {
  data: null,

  defaults: function () {
    return {
      version: 1,
      unlocked: 1,            // number of levels unlocked (index+1)
      completed: {},          // levelId -> {score, sparks, time, cleared:true}
      bestScore: 0,
      totalSparks: 0,
      seenIntro: false,
      hasProgress: false,
      settings: {
        music: 0.6,
        sfx: 0.75,
        touchOpacity: 0.55,
        touchScale: 1.0,
        touchSide: 'auto',
        quality: 'auto',      // 'auto' | 'low' | 'high'
        screenShake: true,
        showFps: false
      },
      run: null               // in-progress run: {level, lives, score, sparks, form}
    };
  },

  load: function () {
    let d = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) { d = null; }
    const def = this.defaults();
    if (!d || typeof d !== 'object' || d.version !== 1) {
      this.data = def;
    } else {
      // merge defensively — a corrupt/partial save must never break boot
      this.data = def;
      if (typeof d.unlocked === 'number' && isFinite(d.unlocked)) this.data.unlocked = clamp(d.unlocked | 0, 1, 64);
      if (d.completed && typeof d.completed === 'object') {
        for (const k in d.completed) {
          const e = d.completed[k];
          if (e && typeof e === 'object') {
            this.data.completed[k] = {
              score: (+e.score) || 0,
              sparks: (+e.sparks) || 0,
              time: (+e.time) || 0,
              cleared: !!e.cleared
            };
          }
        }
      }
      if (isFinite(+d.bestScore)) this.data.bestScore = Math.max(0, +d.bestScore | 0);
      if (isFinite(+d.totalSparks)) this.data.totalSparks = Math.max(0, +d.totalSparks | 0);
      this.data.seenIntro = !!d.seenIntro;
      if (d.settings && typeof d.settings === 'object') {
        const s = this.data.settings, o = d.settings;
        if (isFinite(+o.music)) s.music = clamp(+o.music, 0, 1);
        if (isFinite(+o.sfx)) s.sfx = clamp(+o.sfx, 0, 1);
        if (isFinite(+o.touchOpacity)) s.touchOpacity = clamp(+o.touchOpacity, 0.15, 1);
        if (isFinite(+o.touchScale)) s.touchScale = clamp(+o.touchScale, 0.7, 1.6);
        if (o.quality === 'low' || o.quality === 'high' || o.quality === 'auto') s.quality = o.quality;
        if (typeof o.screenShake === 'boolean') s.screenShake = o.screenShake;
        if (typeof o.showFps === 'boolean') s.showFps = o.showFps;
      }
      if (d.run && typeof d.run === 'object' && isFinite(+d.run.level)) {
        this.data.run = {
          level: clamp(+d.run.level | 0, 0, 63),
          lives: clamp((+d.run.lives) | 0, 1, 99),
          score: Math.max(0, (+d.run.score) | 0),
          sparks: Math.max(0, (+d.run.sparks) | 0),
          form: ['small', 'big', 'ember', 'sky'].indexOf(d.run.form) >= 0 ? d.run.form : 'small'
        };
      }
      this.data.hasProgress = !!this.data.run || Object.keys(this.data.completed).length > 0;
    }
    return this.data;
  },

  save: function () {
    try {
      this.data.hasProgress = !!this.data.run || Object.keys(this.data.completed).length > 0;
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data));
    } catch (e) { /* quota / private mode — play on without persistence */ }
  },

  reset: function () {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
    this.data = this.defaults();
    this.save();
  },

  recordClear: function (levelId, score, sparks, timeLeft, levelIndex) {
    const prev = this.data.completed[levelId];
    if (!prev || score > prev.score) {
      this.data.completed[levelId] = {
        score: Math.max(score, prev ? prev.score : 0),
        sparks: Math.max(sparks, prev ? prev.sparks : 0),
        time: Math.max(timeLeft, prev ? prev.time : 0),
        cleared: true
      };
    } else {
      prev.cleared = true;
      prev.sparks = Math.max(prev.sparks, sparks);
      prev.time = Math.max(prev.time, timeLeft);
    }
    this.data.unlocked = Math.max(this.data.unlocked, Math.min(levelIndex + 2, 64));
    this.data.bestScore = Math.max(this.data.bestScore, score);
    this.save();
  }
};

/* ----------------------------------------------------------- InputManager */
const ACT = {
  LEFT: 0, RIGHT: 1, UP: 2, DOWN: 3, JUMP: 4, RUN: 5, PAUSE: 6, START: 7
};
const ACT_COUNT = 8;

class InputManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.held = new Uint8Array(ACT_COUNT);
    this.prev = new Uint8Array(ACT_COUNT);
    this.pressBuf = new Float32Array(ACT_COUNT);   // seconds since press, for buffering
    this.keyHeld = new Uint8Array(ACT_COUNT);
    this.touchHeld = new Uint8Array(ACT_COUNT);
    this.padHeld = new Uint8Array(ACT_COUNT);
    this.anyPressed = false;
    this.touchEnabled = false;
    this.pointers = new Map();      // pointerId -> button index
    this.buttons = [];              // rebuilt on resize: {id, act, x,y,r, shape,w,h, label}
    this.lastInputWasTouch = false;
    this.pauseTapRect = null;
    this._bindKeys();
    this._bindTouch();
  }

  _bindKeys() {
    const map = {
      ArrowLeft: ACT.LEFT, KeyA: ACT.LEFT,
      ArrowRight: ACT.RIGHT, KeyD: ACT.RIGHT,
      ArrowUp: ACT.UP, KeyW: ACT.UP,
      ArrowDown: ACT.DOWN, KeyS: ACT.DOWN,
      Space: ACT.JUMP, KeyZ: ACT.JUMP, KeyK: ACT.JUMP, Numpad0: ACT.JUMP,
      ShiftLeft: ACT.RUN, ShiftRight: ACT.RUN, KeyX: ACT.RUN, KeyJ: ACT.RUN,
      KeyP: ACT.PAUSE, Escape: ACT.PAUSE,
      Enter: ACT.START, NumpadEnter: ACT.START
    };
    const self = this;
    window.addEventListener('keydown', function (e) {
      const a = map[e.code];
      if (a !== undefined) {
        if (!self.keyHeld[a]) self.pressBuf[a] = 0;
        self.keyHeld[a] = 1;
        self.lastInputWasTouch = false;
        // stop the page scrolling / space-activating focused elements
        if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
      }
      self.anyPressed = true;
      if (self.onAnyKey) self.onAnyKey(e);
    }, { passive: false });
    window.addEventListener('keyup', function (e) {
      const a = map[e.code];
      if (a !== undefined) self.keyHeld[a] = 0;
    });
    // never leave a key stuck down when the tab loses focus
    window.addEventListener('blur', function () { self.keyHeld.fill(0); self.padHeld.fill(0); });
  }

  _bindTouch() {
    const self = this, cv = this.canvas;
    function localPos(e) {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
    }
    function hit(p) {
      for (let i = self.buttons.length - 1; i >= 0; i--) {
        const b = self.buttons[i];
        if (p.x >= b.hx && p.x <= b.hx + b.hw && p.y >= b.hy && p.y <= b.hy + b.hh) return i;
      }
      return -1;
    }
    function recompute() {
      self.touchHeld.fill(0);
      self.pointers.forEach(function (bi) {
        if (bi >= 0 && self.buttons[bi]) {
          const b = self.buttons[bi];
          if (!self.touchHeld[b.act]) self.pressBuf[b.act] = self.held[b.act] ? self.pressBuf[b.act] : 0;
          self.touchHeld[b.act] = 1;
        }
      });
    }
    function down(e) {
      self.touchEnabled = true; self.lastInputWasTouch = true; self.anyPressed = true;
      const p = localPos(e);
      const bi = hit(p);
      self.pointers.set(e.pointerId, bi);
      if (bi >= 0) {
        const b = self.buttons[bi];
        b.flash = 1;
        if (!self.touchHeld[b.act]) self.pressBuf[b.act] = 0;
      }
      recompute();
      if (self.onAnyKey) self.onAnyKey(e);
      e.preventDefault();
    }
    function move(e) {
      if (!self.pointers.has(e.pointerId)) return;
      const p = localPos(e);
      const bi = hit(p);
      const old = self.pointers.get(e.pointerId);
      if (bi !== old) {
        // sliding onto a new button counts as a fresh press (feels right for d-pads)
        if (bi >= 0) { self.buttons[bi].flash = 1; self.pressBuf[self.buttons[bi].act] = 0; }
        self.pointers.set(e.pointerId, bi);
        recompute();
      }
      e.preventDefault();
    }
    function up(e) {
      if (!self.pointers.has(e.pointerId)) return;
      self.pointers.delete(e.pointerId);
      recompute();
      e.preventDefault();
    }
    cv.addEventListener('pointerdown', down, { passive: false });
    cv.addEventListener('pointermove', move, { passive: false });
    cv.addEventListener('pointerup', up, { passive: false });
    cv.addEventListener('pointercancel', up, { passive: false });
    cv.addEventListener('lostpointercapture', up, { passive: false });
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('blur', function () { self.pointers.clear(); self.touchHeld.fill(0); });
  }

  /** Called by the renderer each resize: lay out the on-screen touch pad. */
  layoutTouch(dw, dh, scale, opacity) {
    const s = scale;
    const base = Math.min(dw, dh);
    const R = Math.round(clamp(base * 0.088, 26, 70) * s);       // button radius
    const marginX = Math.round(clamp(base * 0.045, 12, 44));
    const marginY = Math.round(clamp(base * 0.05, 12, 44));
    const b = [];
    const padCx = marginX + R * 1.25;
    const padCy = dh - marginY - R * 1.15;

    function btn(id, act, x, y, r, label, shape) {
      b.push({
        id: id, act: act, x: x, y: y, r: r, label: label, shape: shape || 'round',
        hx: x - r * 1.22, hy: y - r * 1.22, hw: r * 2.44, hh: r * 2.44, flash: 0
      });
    }
    // ---- left cluster: LEFT / RIGHT / DOWN
    btn('left', ACT.LEFT, padCx - R * 1.05, padCy, R, '◀');
    btn('right', ACT.RIGHT, padCx + R * 1.35, padCy, R, '▶');
    btn('down', ACT.DOWN, padCx + R * 0.15, padCy + R * 1.35, R * 0.8, '▼');
    btn('up', ACT.UP, padCx + R * 0.15, padCy - R * 1.35, R * 0.8, '▲');
    // ---- right cluster: JUMP (big) / RUN
    const jx = dw - marginX - R * 1.15, jy = dh - marginY - R * 1.1;
    btn('jump', ACT.JUMP, jx, jy, R * 1.18, 'A');
    btn('run', ACT.RUN, jx - R * 2.3, jy + R * 0.28, R * 0.92, 'B');
    // ---- pause, top right
    btn('pause', ACT.PAUSE, dw - marginX - R * 0.5, marginY + R * 0.5, R * 0.55, '||');

    this.buttons = b;
    this.touchOpacity = opacity;
    // re-resolve any live pointers against the new layout
    const self = this;
    const stale = [];
    this.pointers.forEach(function (v, k) { stale.push(k); });
    stale.forEach(function (k) { self.pointers.set(k, -1); });
    this.touchHeld.fill(0);
  }

  pollGamepad() {
    if (!navigator.getGamepads) return;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { return; }
    this.padHeld.fill(0);
    for (let i = 0; i < pads.length; i++) {
      const p = pads[i];
      if (!p || !p.connected) continue;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (ax < -0.4 || (p.buttons[14] && p.buttons[14].pressed)) this.padHeld[ACT.LEFT] = 1;
      if (ax > 0.4 || (p.buttons[15] && p.buttons[15].pressed)) this.padHeld[ACT.RIGHT] = 1;
      if (ay < -0.5 || (p.buttons[12] && p.buttons[12].pressed)) this.padHeld[ACT.UP] = 1;
      if (ay > 0.5 || (p.buttons[13] && p.buttons[13].pressed)) this.padHeld[ACT.DOWN] = 1;
      if (p.buttons[0] && p.buttons[0].pressed) this.padHeld[ACT.JUMP] = 1;
      if ((p.buttons[2] && p.buttons[2].pressed) || (p.buttons[1] && p.buttons[1].pressed)) this.padHeld[ACT.RUN] = 1;
      if (p.buttons[9] && p.buttons[9].pressed) this.padHeld[ACT.PAUSE] = 1;
      if (p.buttons[9] && p.buttons[9].pressed) this.padHeld[ACT.START] = 1;
    }
  }

  update(dt) {
    this.pollGamepad();
    for (let i = 0; i < ACT_COUNT; i++) {
      this.prev[i] = this.held[i];
      const h = (this.keyHeld[i] | this.touchHeld[i] | this.padHeld[i]) ? 1 : 0;
      if (h && !this.held[i]) this.pressBuf[i] = 0;
      this.held[i] = h;
      if (h || this.pressBuf[i] < 10) this.pressBuf[i] += dt;
    }
    for (let i = 0; i < this.buttons.length; i++) {
      const b = this.buttons[i];
      if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 5);
    }
  }

  down(a) { return !!this.held[a]; }
  pressed(a) { return !!this.held[a] && !this.prev[a]; }
  released(a) { return !this.held[a] && !!this.prev[a]; }
  /** true if `a` was pressed within `t` seconds and the buffer has not been eaten */
  buffered(a, t) { return this.pressBuf[a] <= t; }
  eatBuffer(a) { this.pressBuf[a] = 99; }
  anyConfirm() {
    return this.pressed(ACT.JUMP) || this.pressed(ACT.START) || this.pressed(ACT.RUN);
  }
}
