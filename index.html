const easeOut = (u) => 1 - Math.pow(1 - u, 3);

const matCache = new Map();
function M(color, o = {}) {

function door(parent, x, zA, zB, y0, y1, colour, hingeAtA, openSide) {

  for (const dx of [-0.075, 0.075]) {
    boxAt(parent, x + dx - 0.02, x + dx + 0.02, y0, y1 + 0.06, zA - 0.06, zA, frame, false);

  env(swell.gain, [[0, 0.2], [4, 0.8], [9, 0.5], [14, 1.0], [19, 0.7], [24, 1.0], [30, 1.3], [A.tenseEnd, 0]]);

  { const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true; const bq = ctx.createBiquadFilter(); bq.type = 'bandpass'; bq.Q.value = 1.2; bq.frequency.setValueAtTime(300, T0 + 28.6); bq.frequency.exponentialRampToValueAtTime(4000, T0 + 30.85);
    const g = ctx.createGain(); env(g.gain, [[28.6, 0], [30.75, 0.11], [30.9, 0]]); s.connect(bq); bq.connect(g); g.connect(sfx); s.start(T0 + 28.6); s.stop(T0 + 31); }

  const wl = ctx.createBiquadFilter(); wl.type = 'lowpass'; wl.frequency.value = 1500; wl.connect(warm);
  const chords = [[31.0, ['C3', 'E3', 'G3', 'C4', 'E4']], [33.4, ['F2', 'C3', 'F3', 'A3', 'C4']], [35.6, ['A2', 'E3', 'A3', 'C4', 'E4']], [37.6, ['G2', 'D3', 'G3', 'B3', 'D4']], [38.8, ['C3', 'E3', 'G3', 'C4', 'G4']]];
  chords.forEach(([t0, notes], i) => {

    const g = ctx.createGain(); g.connect(wl); env(g.gain, [[t0, 0], [t0 + 0.5, 1], [t1 - 0.5, 1], [t1, 0]]);
    for (const n of notes) { osc('triangle', NOTE(n), t0, t1, g, 0.035); osc('sine', NOTE(n) * 1.004, t0, t1, g, 0.03); }
    const arp = notes.slice(1).concat([notes[2]]);
    for (let s = t0 + 0.25, k = 0; s < Math.min(t1 - 0.4, 40); s += 0.3, k++) tone(s, NOTE(arp[k % arp.length]) * 2, NOTE(arp[k % arp.length]) * 2, 0.45, 0.05, 'triangle', warm);
  });

  const pop = (t) => { tone(t, 900, 240, 0.12, 0.55, 'sine'); noiseHit(t, 2600, 2, 0.03, 0.22); };
  for (const c of TIMELINE.overlay.counter) pop(c);
  const ding = (t) => { tone(t, NOTE('E6'), NOTE('E6'), 0.5, 0.13); tone(t + 0.1, NOTE('A6'), NOTE('A6'), 0.6, 0.12); };
  ding(B.cardPop); ding(B.replayCard);
  const bloop = (t) => tone(t, 420, 900, 0.16, 0.22, 'sine');
  [B.schoolBubble, B.schoolReply, B.picBubble, B.secretBubble, B.okBubble, B.meetBubble[0]].forEach(bloop);
  noiseHit(B.cardTap, 3500, 1, 0.03, 0.25);
  // camera shutter at the selfie
  noiseHit(B.flash - 0.01, 5200, 1.2, 0.025, 0.55); noiseHit(B.flash + 0.06, 2000, 1.5, 0.06, 0.5); tone(B.flash + 0.06, 300, 120, 0.06, 0.25, 'square');
  // whoosh for the time skip
  { const s = ctx.createBufferSource(); s.buffer = noise; const bq = ctx.createBiquadFilter(); bq.type = 'bandpass'; bq.Q.value = 0.9;
    bq.frequency.setValueAtTime(250, T0 + B.skipFlash[0]); bq.frequency.exponentialRampToValueAtTime(3000, T0 + B.skip); bq.frequency.exponentialRampToValueAtTime(600, T0 + B.skipFlash[1]);
    const g = ctx.createGain(); env(g.gain, [[B.skipFlash[0], 0], [B.skip, 0.35], [B.skipFlash[1], 0]]); s.connect(bq); bq.connect(g); g.connect(sfx); s.start(T0 + B.skipFlash[0]); s.stop(T0 + B.skipFlash[1] + 0.05); }
  // car rumble passing by
  { const g = ctx.createGain(); env(g.gain, [[B.car[0], 0], [7.4, 0.14], [8.4, 0.3], [B.car[1], 0]]); const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; f.connect(g); g.connect(duck);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.setValueAtTime(48, T0 + B.car[0]); o1.frequency.setValueAtTime(52, T0 + 8.4); o1.frequency.linearRampToValueAtTime(40, T0 + B.car[1]); o1.connect(f); o1.start(T0 + B.car[0]); o1.stop(T0 + B.car[1]);
    const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 73; o2.connect(f); o2.start(T0 + B.car[0]); o2.stop(T0 + B.car[1]); }

  tone(B.blocked, 160, 60, 0.3, 0.42, 'sine'); noiseHit(B.blocked, 700, 0.8, 0.1, 0.35, 'lowpass');
  tone(TIMELINE.overlay.banner, NOTE('C6'), NOTE('C6'), 0.9, 0.08); tone(TIMELINE.overlay.banner + 0.12, NOTE('G6'), NOTE('G6'), 1.0, 0.06);

async function loadVoice(ctx) {
  try { const res = await fetch(TIMELINE.voiceover.file); if (!res.ok) throw new Error(res.status); return await ctx.decodeAudioData(await res.arrayBuffer()); }
  catch (e) { console.warn('Voiceover not loaded (open via http:// to hear it):', e.message); return null; }
}
async function renderAudioWav() {
  const sr = TIMELINE.audio.sampleRate, len = Math.ceil(sr * TIMELINE.duration);
  const ctx = new OfflineAudioContext(2, len, sr);
  buildAudio(ctx, await loadVoice(ctx), 0);
  const buf = await ctx.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  const gain = peak > 0 ? 0.89 / peak : 1;

  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };

  out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, len * 4, true);

  for (let i = 0, o = 44; i < len; i++, o += 4) { out.setInt16(o, clamp(L0[i] * gain, -1, 1) * 32767, true); out.setInt16(o + 2, clamp(R1[i] * gain, -1, 1) * 32767, true); }

/* ============================================================================
   MODES:  ?render  → window.renderFrame(n) draws exactly frame n (no rAF timing)
           ?preview (default) → real-time playback synced to the audio clock
   ============================================================================ */
function draw(t) {
  update(t);
  renderer.render(scene, camera);
  updateOverlay(t);
}
async function init() {
  await document.fonts.load(`800 60px 'Baloo 2'`, 'AB'); await document.fonts.load(`700 40px 'Baloo 2'`, 'AB'); await document.fonts.load(`600 40px 'Baloo 2'`, 'AB');
  await document.fonts.load(`40px 'Noto Color Emoji'`, '🚩✅👇🏫📸🤫👍📍');
  await document.fonts.ready;
  // canvas textures were drawn before fonts loaded on some browsers: redraw text textures now
  rebuildTextTextures();
  renderPhoto();
  draw(0); renderer.compile(scene, camera);
}
function rebuildTextTextures() {
  const swap = (mesh, tex) => { mesh.material.map.dispose(); mesh.material.map = tex; mesh.material.needsUpdate = true; };
  swap(card, cardTexture('new')); swap(cardOk, cardTexture('ok'));
  for (const m of [bSchool, bSchoolReply, bPic, bSecret, bOk, bMeet]) {
    const [tex, w, h] = bubbleTexture(m.userData.spec); swap(m, tex);
    m.geometry.dispose(); m.geometry = new THREE.PlaneGeometry(w * BUBBLE_PX, h * BUBBLE_PX);
  }
}
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
window.TIMELINE = TIMELINE;
window.__three = { THREE, renderer, scene, camera, moonLight, L }; // handy for debugging in the console
window.renderFrame = (n) => { draw(n / TIMELINE.fps); return true; };
window.renderTime = (t) => { draw(t); return true; };
window.renderAudioWav = renderAudioWav;
function fit() { const s = RENDER ? 1 : Math.min(innerWidth / W, innerHeight / H); const st = $('stage').style; st.transform = `scale(${s})`; st.left = `${(innerWidth - W * s) / 2}px`; st.top = `${(innerHeight - H * s) / 2}px`; }
addEventListener('resize', fit); fit();
init().then(() => {
  window.__ready = true;
  if (RENDER) return;
  const startAt = parseFloat(params.get('t') || '0');
  const btn = $('play'); btn.style.display = 'flex';
  let ctx = null, voice = null, T0 = 0;
  const loop = () => {
    let t = ctx ? ctx.currentTime - T0 : startAt;
    if (t > TIMELINE.duration) t = TIMELINE.duration;
    draw(t);
    requestAnimationFrame(loop);
  };
  btn.onclick = async () => {
    btn.style.display = 'none';
    if (ctx) await ctx.close();
    ctx = new AudioContext({ sampleRate: TIMELINE.audio.sampleRate }); voice = voice || await loadVoice(ctx);
    T0 = ctx.currentTime + 0.15 - startAt;
    buildAudio(ctx, voice, T0);
    setTimeout(() => (btn.style.display = 'flex'), (TIMELINE.duration - startAt + 0.5) * 1000);
  };
  requestAnimationFrame(loop);
});
