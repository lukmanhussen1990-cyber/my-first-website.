<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16180f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Ruin Runner - a first-person parkour runner through an overgrown, ruined city. Swipe to dodge, jump, slide and wall-run.">
<title>Ruin Runner</title>
<style>
  :root{
    --ink:#eceed9;--ink2:rgba(236,238,217,.68);--acc:#d6df8e;--line:rgba(236,238,217,.24);
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#16180f;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
  body{font-family:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);font-stretch:condensed}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .layer{position:fixed;inset:0;pointer-events:none}
  .hidden{display:none!important}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;pointer-events:auto;touch-action:manipulation}

  /* ---------- HUD ---------- */
  #dist{position:absolute;top:calc(12px + var(--sat));left:0;right:0;text-align:center;font-size:36px;font-weight:700;
    letter-spacing:.05em;text-shadow:0 2px 12px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
  #dist small{font-size:.42em;margin-left:5px;opacity:.72;letter-spacing:.12em}
  #pauseBtn{position:absolute;top:calc(12px + var(--sat));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;
    background:rgba(14,16,9,.32);border:1px solid var(--line);display:grid;place-items:center}
  #pauseBtn i{display:block;width:14px;height:16px;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
  #toast{position:absolute;top:calc(62px + var(--sat));left:0;right:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:.2em;
    color:var(--acc);text-shadow:0 2px 8px rgba(0,0,0,.65);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:none}
  #hint{position:absolute;left:50%;bottom:calc(20% + var(--sab));transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:12px;opacity:0;transition:opacity .18s}
  #hint.on{opacity:1}
  #hintArrow{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(14,16,9,.35)}
  #hintArrow svg{width:30px;height:30px;fill:var(--ink)}
  #hint.on #hintArrow svg{animation:nudge .7s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(3px)}50%{transform:translateY(-6px)}}
  #hintText{font-size:18px;font-weight:700;letter-spacing:.16em;padding:9px 18px;border-radius:999px;background:rgba(14,16,9,.6);
    border:1px solid var(--line);white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.5)}

  /* ---------- screens ---------- */
  .screen{display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:calc(44px + var(--sat)) 22px calc(30px + var(--sab))}
  .split{justify-content:space-between}
  .center{justify-content:center}
  .dim{background:linear-gradient(180deg,rgba(12,13,8,.72) 0%,rgba(12,13,8,.18) 34%,rgba(12,13,8,0) 50%,rgba(12,13,8,.2) 64%,rgba(12,13,8,.86) 100%)}
  .veil{background:rgba(12,13,8,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #menu{pointer-events:auto;cursor:pointer}
  .kicker{font-size:13px;letter-spacing:.42em;color:var(--ink2);margin-bottom:12px;padding-left:.42em}
  h1{margin:0;font-size:clamp(56px,18vw,104px);line-height:.84;letter-spacing:.03em;font-weight:800;
    text-shadow:0 6px 34px rgba(0,0,0,.45)}
  h1 span{color:var(--acc)}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px}
  .best{font-size:15px;letter-spacing:.24em;color:var(--ink2)}
  .best b{color:var(--ink);font-weight:700}
  .primary{width:100%;max-width:320px;padding:17px 10px;font-size:22px;font-weight:800;letter-spacing:.22em;border-radius:14px;
    border:2px solid var(--ink);background:rgba(236,238,217,.1);text-shadow:0 2px 8px rgba(0,0,0,.4)}
  #playBtn{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(214,223,142,.0)}50%{transform:scale(1.03);box-shadow:0 0 30px 0 rgba(214,223,142,.18)}}
  .ghost{width:100%;max-width:320px;padding:13px 10px;font-size:17px;font-weight:700;letter-spacing:.2em;border-radius:12px;
    border:1px solid var(--line);background:rgba(14,16,9,.25)}
  .howto{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;letter-spacing:.12em;color:var(--ink2)}
  .howto b{color:var(--ink);margin-right:4px}
  .chip{padding:8px 14px;font-size:12px;letter-spacing:.2em;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:rgba(14,16,9,.3)}
  .panel{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
  .title{font-size:40px;font-weight:800;letter-spacing:.1em;margin-bottom:2px}
  .bigNum{font-size:76px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .bigNum small{font-size:.32em;opacity:.7;margin-left:6px;letter-spacing:.12em}
  .sub{font-size:15px;letter-spacing:.24em;color:var(--ink2);margin-bottom:8px}
  .sub.new{color:var(--acc)}
  #loading{justify-content:center;gap:22px;background:#16180f}
  #loading .t{font-size:40px;font-weight:800;letter-spacing:.06em;line-height:.9}
  .bar{width:180px;height:3px;background:rgba(236,238,217,.15);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  #loadMsg{font-size:12px;letter-spacing:.26em;color:var(--ink2)}
  #err{justify-content:center;gap:14px;background:#16180f;pointer-events:auto}
  #err p{max-width:320px;line-height:1.5;color:var(--ink2);letter-spacing:.04em}
  @media (orientation:landscape) and (max-height:500px){
    h1{font-size:56px}.screen{padding-top:calc(18px + var(--sat))}.bottom{gap:10px}.primary{padding:12px}
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" class="layer hidden">
  <div id="dist"><span id="distNum">0</span><small>M</small></div>
  <button id="pauseBtn" aria-label="Pause"><i></i></button>
  <div id="toast"></div>
  <div id="hint"><div id="hintArrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 10.5h5V21h5V10.5h5z"/></svg></div><div id="hintText"></div></div>
</div>

<div id="menu" class="layer screen split dim hidden">
  <div>
    <div class="kicker">FIRST-PERSON PARKOUR</div>
    <h1>RUIN<br><span>RUNNER</span></h1>
  </div>
  <div class="bottom">
    <div class="best">BEST&nbsp; <b id="bestMenu">0</b> M</div>
    <button id="playBtn" class="primary">TAP TO RUN</button>
    <div class="howto"><span><b>&larr; &rarr;</b>MOVE / WALL-RUN</span><span><b>&uarr;</b>JUMP</span><span><b>&darr;</b>SLIDE</span></div>
    <button id="soundBtn" class="chip">SOUND: ON</button>
  </div>
</div>

<div id="pause" class="layer screen center veil hidden">
  <div class="panel">
    <div class="title">PAUSED</div>
    <button id="resumeBtn" class="primary">RESUME</button>
    <button id="restartBtn" class="ghost">RESTART</button>
    <button id="menuBtn" class="ghost">MENU</button>
    <button id="soundBtn2" class="chip">SOUND: ON</button>
  </div>
</div>

<div id="over" class="layer screen center veil hidden">
  <div class="panel">
    <div id="overTitle" class="title">WIPED OUT</div>
    <div class="bigNum"><span id="overDist">0</span><small>M</small></div>
    <div id="overBest" class="sub">BEST 0 M</div>
    <button id="againBtn" class="primary">RUN AGAIN</button>
    <button id="overMenuBtn" class="ghost">MENU</button>
  </div>
</div>

<div id="loading" class="layer screen">
  <div class="t">RUIN<br>RUNNER</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">LOADING</div>
</div>

<div id="err" class="layer screen hidden">
  <div class="title">OOPS</div>
  <p id="errMsg">Something went wrong.</p>
  <button class="ghost" onclick="location.reload()">RELOAD</button>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#eceed9;font-family:sans-serif">Ruin Runner needs JavaScript.</p></noscript>

<script type="module">
// =====================================================================
//  RUIN RUNNER - first-person parkour through an overgrown ruined city
//  Single-file game. Everything (textures, level, audio) is generated
//  procedurally at runtime; only three.js is loaded from a CDN.
// =====================================================================

const $ = (id) => document.getElementById(id);
const ui = {
  loading: $('loading'), loadBar: $('loadBar'), loadMsg: $('loadMsg'), menu: $('menu'), hud: $('hud'),
  dist: $('distNum'), toast: $('toast'), hint: $('hint'), hintText: $('hintText'), hintArrow: $('hintArrow'),
  pause: $('pause'), over: $('over'), overTitle: $('overTitle'), overDist: $('overDist'), overBest: $('overBest'),
  bestMenu: $('bestMenu'), err: $('err'), errMsg: $('errMsg'), soundBtn: $('soundBtn'), soundBtn2: $('soundBtn2'),
};
function fatal(msg) {
  ui.loading.classList.add('hidden'); ui.menu.classList.add('hidden'); ui.hud.classList.add('hidden');
  ui.err.classList.remove('hidden'); ui.errMsg.textContent = msg;
}
function setLoad(p, msg) { ui.loadBar.style.width = Math.round(p * 100) + '%'; if (msg) ui.loadMsg.textContent = msg; }

const qs = new URLSearchParams(location.search);
const DEBUG = { autoplay: qs.has('autoplay'), seed: qs.has('seed') ? (+qs.get('seed') | 0) : null, nohints: qs.has('nohints'), play: qs.has('play') };

const store = {
  get(k, d) { try { const v = localStorage.getItem('ruinrunner.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ruinrunner.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

let THREE = null;
for (const url of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
                   'https://unpkg.com/three@0.160.0/build/three.module.min.js']) {
  try { THREE = await import(url); break; } catch (e) { console.warn('three.js load failed from', url, e); }
}
if (!THREE) { fatal("Couldn't load the 3D engine. Check your internet connection and reload."); throw new Error('three.js unavailable'); }
THREE.ColorManagement.enabled = false; // work directly in display space; grading happens in the post pass

// ---------------------------------------------------------------- math
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- tuning
const CFG = {
  laneW: 1.7, half: 2.6, eye: 1.62, slideEye: 0.74, bodyH: 1.72, slideH: 0.85,
  grav: 27, jumpV: 8.6, stepUp: 0.45, laneTime: 0.15, slideTime: 0.72, v0: 12.5, vMax: 23,
};
const LANES = [-CFG.laneW, 0, CFG.laneW];
const STEP = 1 / 120;
const speedAt = (s) => CFG.v0 + (CFG.vMax - CFG.v0) * (1 - Math.exp(-Math.max(0, s) / 2300));
function jumpDist(v, drop) {
  const g = CFG.grav, j = CFG.jumpV;
  return v * (j + Math.sqrt(j * j + 2 * g * Math.max(0, drop))) / g;
}

// =====================================================================
//  Procedural textures
// =====================================================================
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// tileable value noise (one octave), returns Float32Array W*H in 0..1
function vnoise(W, H, cx, cy, rnd) {
  cx = Math.max(1, Math.min(cx, W)) | 0; cy = Math.max(1, Math.min(cy, H)) | 0;
  const lat = new Float32Array(cx * cy);
  for (let i = 0; i < lat.length; i++) lat[i] = rnd();
  const out = new Float32Array(W * H);
  const X0 = new Int32Array(W), X1 = new Int32Array(W), TX = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const f = (x * cx) / W, i = f | 0, t = f - i;
    X0[x] = i % cx; X1[x] = (i + 1) % cx; TX[x] = t * t * (3 - 2 * t);
  }
  for (let y = 0; y < H; y++) {
    const f = (y * cy) / H, j = f | 0, t = f - j, ty = t * t * (3 - 2 * t);
    const r0 = (j % cy) * cx, r1 = ((j + 1) % cy) * cx, o = y * W;
    for (let x = 0; x < W; x++) {
      const tx = TX[x], a = lat[r0 + X0[x]], b = lat[r0 + X1[x]], c = lat[r1 + X0[x]], d = lat[r1 + X1[x]];
      const top = a + (b - a) * tx;
      out[o + x] = top + (c + (d - c) * tx - top) * ty;
    }
  }
  return out;
}
function fbm(W, H, cx, cy, oct, rnd, gain = 0.5) {
  const out = new Float32Array(W * H);
  let amp = 1;
  for (let k = 0; k < oct; k++) {
    const n = vnoise(W, H, cx, cy, rnd);
    for (let i = 0; i < out.length; i++) out[i] += n[i] * amp;
    amp *= gain; cx *= 2; cy *= 2;
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < out.length; i++) { const v = out[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  const k = 1 / (mx - mn || 1);
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) * k;
  return out;
}
function pixels(c, fn) {
  const g = c.getContext('2d'), W = c.width, H = c.height, img = g.createImageData(W, H), d = img.data, col = [0, 0, 0, 255];
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    fn(i, x, y, col);
    const p = i * 4; d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = col[3];
  }
  g.putImageData(img, 0, 0);
  return g;
}

function texConcrete(seed, o = {}) {
  const W = o.size || 512, rnd = mulberry32(seed), c = cnv(W, W);
  const big = fbm(W, W, 4, 4, 5, rnd, 0.55), fine = fbm(W, W, 64, 64, 2, rnd, 0.5);
  const mc = o.mc || 6, moss = fbm(W, W, mc, mc, 5, rnd, 0.55);
  const streak = fbm(W, W, 40, 3, 3, rnd, 0.55), spot = fbm(W, W, 10, 10, 4, rnd, 0.5);
  const base = o.base || [128, 128, 112], mcol = o.moss || [80, 100, 44];
  const mlo = o.mlo ?? 0.55, mhi = o.mhi ?? 0.78, sa = o.streak ?? 1, mAmt = o.mossAmt ?? 1;
  const g = pixels(c, (i, x, y, col) => {
    const f = fine[i];
    let v = 0.78 + (big[i] - 0.5) * 0.55 + (f - 0.5) * 0.32 - Math.max(0, streak[i] - 0.56) * sa;
    if (spot[i] < 0.22) v -= (0.22 - spot[i]) * 1.5;
    const m = sstep(mlo, mhi, moss[i] + (f - 0.5) * 0.3) * mAmt, mv = 0.5 + f * 0.8;
    col[0] = lerp(base[0] * v, mcol[0] * mv, m); col[1] = lerp(base[1] * v, mcol[1] * mv, m); col[2] = lerp(base[2] * v, mcol[2] * mv, m);
  });
  const line = (x, y, w, h, a) => {
    g.fillStyle = `rgba(20,22,12,${a})`; g.fillRect(x, y, w, h);
    g.fillStyle = `rgba(255,255,236,${a * 0.16})`;
    if (w < h) g.fillRect(x + w, y, 2, h); else g.fillRect(x, y + h, w, 2);
  };
  if (o.panels) { line(0, 0, W, 3, 0.55); line(0, 0, 3, W, 0.5); if (o.panels > 1) { line(0, W / 2, W, 2, 0.4); line(W / 2, 0, 2, W, 0.32); } }
  if (o.grooves) for (let k = 0; k < o.grooves; k++) line(Math.round((k * W) / o.grooves), 0, 3, W, 0.5);
  if (o.joints) for (let k = 0; k < o.joints; k++) line(0, Math.round((k * W) / o.joints), W, 3, 0.45);
  if (o.holes) {
    g.fillStyle = 'rgba(18,20,10,.55)';
    for (let yy = W / 8; yy < W; yy += W / 4) for (let xx = W / 8; xx < W; xx += W / 4) { g.beginPath(); g.arc(xx, yy, 3.2, 0, 7); g.fill(); }
  }
  g.strokeStyle = 'rgba(16,18,9,.42)'; g.lineWidth = 1.3;
  for (let k = 0; k < (o.cracks ?? 4); k++) {
    let x = rnd() * W, y = rnd() * W, a = rnd() * 6.28;
    g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 22; j++) { a += (rnd() - 0.5) * 1.1; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
    g.stroke();
  }
  return c;
}
function texWood(seed) {
  const W = 512, rnd = mulberry32(seed), c = cnv(W, W);
  const grain = fbm(W, W, 96, 6, 3, rnd, 0.5), big = fbm(W, W, 4, 4, 4, rnd, 0.5), moss = fbm(W, W, 6, 6, 4, rnd, 0.55), fine = fbm(W, W, 64, 64, 2, rnd, 0.5);
  const N = 6, pw = W / N, tint = Array.from({ length: N }, () => 0.72 + rnd() * 0.45), ends = Array.from({ length: N }, () => rnd() * W);
  pixels(c, (i, x, y, col) => {
    const p = Math.floor(x / pw), lx = x - p * pw;
    let v = tint[p] * (0.74 + (grain[i] - 0.5) * 0.7 + (big[i] - 0.5) * 0.3 + (fine[i] - 0.5) * 0.18);
    if (lx < 3) v *= 0.3 + lx * 0.12; else if (lx > pw - 2) v *= 0.6;
    if (Math.abs(y - ends[p]) < 2) v *= 0.35;
    const m = sstep(0.6, 0.84, moss[i] + (fine[i] - 0.5) * 0.3) * 0.8;
    col[0] = lerp(118 * v, 76, m); col[1] = lerp(103 * v, 90, m); col[2] = lerp(74 * v, 42, m);
  });
  return c;
}
function texStone(seed) {
  const W = 512, rnd = mulberry32(seed), c = cnv(W, W);
  const n = fbm(W, W, 16, 16, 4, rnd, 0.55), big = fbm(W, W, 4, 4, 4, rnd, 0.5), moss = fbm(W, W, 8, 8, 4, rnd, 0.55);
  const rows = 8, cols = 4, bh = W / rows, bw = W / cols, tint = Array.from({ length: rows * cols }, () => 0.68 + rnd() * 0.45);
  pixels(c, (i, x, y, col) => {
    const r = Math.floor(y / bh), off = r & 1 ? bw / 2 : 0, xx = (x + off) % W, ci = Math.floor(xx / bw);
    const lx = xx - ci * bw, ly = y - r * bh, mortar = lx < 4 || ly < 4, edge = Math.min(lx, bw - lx, ly, bh - ly);
    const v = mortar ? 0.32 : tint[r * cols + ci] * (0.7 + (n[i] - 0.5) * 0.55 + (big[i] - 0.5) * 0.3) * (edge < 8 ? 0.82 + edge * 0.022 : 1);
    const m = sstep(0.55, 0.8, moss[i] + (mortar ? 0.18 : 0)) * 0.85;
    col[0] = lerp(122 * v, 68, m); col[1] = lerp(117 * v, 86, m); col[2] = lerp(96 * v, 38, m);
  });
  return c;
}
function texFacade(seed) {
  const W = 256, H = 512, rnd = mulberry32(seed), c = cnv(W, H);
  const n = fbm(W, H, 8, 16, 4, rnd, 0.55), fine = fbm(W, H, 64, 128, 2, rnd, 0.5), moss = fbm(W, H, 4, 8, 4, rnd, 0.55), streak = fbm(W, H, 32, 2, 3, rnd, 0.5);
  const FL = 8, fh = H / FL, kind = Array.from({ length: FL * 8 }, () => rnd());
  pixels(c, (i, x, y, col) => {
    const f = Math.floor(y / fh), ly = y - f * fh;
    let v, dark = false;
    if (ly < 13) { v = 0.95 + (n[i] - 0.5) * 0.4 + (fine[i] - 0.5) * 0.25; if (ly > 10) v *= 0.7; }
    else {
      const wx = Math.floor(x / 32), lx = x - wx * 32, t = kind[f * 8 + wx];

  shadowTex.offset.x = (Math.floor((P.phase / Math.PI) * 2) % 4) * 0.25;
}

// =====================================================================
//  Camera rig
// =====================================================================
const _vel = new THREE.Vector3(), _foe = new THREE.Vector3();
function updateCamera(dt) {
  const c0 = level.curve.at(P.s, _f), px = c0.x, pz = c0.z, th0 = c0.th, thA = level.curve.at(P.s + 7, _g).th;
  const c = Math.cos(th0), sn = Math.sin(th0), v = speedAt(P.s);
  P.slideBlend = damp(P.slideBlend, P.slide > 0 && P.alive ? 1 : 0, 14, dt);
  const run = (P.grounded || P.wr) && P.alive ? 1 : 0;
  camCtl.bob = damp(camCtl.bob, run * (1 - P.slideBlend * 0.85), 10, dt);
  const ph = P.phase, bobY = (Math.abs(Math.sin(ph)) * 0.07 - 0.035) * camCtl.bob, bobX = Math.sin(ph) * 0.035 * camCtl.bob;
  if (P.landDip > 0) { camCtl.dipV += P.landDip * 9; P.landDip = 0; }
  camCtl.dipV += (-camCtl.dip * 150 - camCtl.dipV * 15) * dt;
  camCtl.dip += camCtl.dipV * dt;
  const eye = lerp(CFG.eye, CFG.slideEye, P.slideBlend);
  const dx = dt > 0 ? (P.x - camCtl.lastX) / dt : 0;
  camCtl.lastX = P.x;
  const dxc = clamp(dx, -14, 14);
  let rollT = (P.wr ? P.wr.side * 0.36 : 0) - dxc * 0.018 + P.slideBlend * 0.1 + Math.sin(ph) * 0.014 * camCtl.bob;
  let pitchT = -0.07 + clamp(P.vy * 0.011, -0.24, 0.06) - P.jumpKick * 0.04;
  const yawT = (P.wr ? P.wr.side * 0.13 : 0) - dxc * 0.004;
  P.jumpKick = damp(P.jumpKick, 0, 5, dt);
  if (!P.alive) {
    if (P.deathType === 'crash') { camCtl.deathPitch = damp(camCtl.deathPitch, 0.32, 4, dt); camCtl.deathRoll = damp(camCtl.deathRoll, 0.45, 3, dt); }
    else { camCtl.deathPitch = damp(camCtl.deathPitch, -0.9, 1.8, dt); camCtl.deathRoll = damp(camCtl.deathRoll, 0.2, 1, dt); }
    pitchT += camCtl.deathPitch; rollT += camCtl.deathRoll;
  }
  camCtl.roll = damp(camCtl.roll, rollT, P.wr ? 7 : 9, dt);
  camCtl.pitch = damp(camCtl.pitch, pitchT, 7, dt);
  camCtl.yaw = damp(camCtl.yaw, yawT, 6, dt);
  P.shake = Math.max(0, P.shake - dt * 1.6);
  const sh = P.shake * P.shake, rx = (Math.random() - 0.5) * sh * 0.16, ry = (Math.random() - 0.5) * sh * 0.16, rr = (Math.random() - 0.5) * sh * 0.07;
  const lx = P.x + bobX + rx, ly = P.y + eye + bobY - camCtl.dip * 0.6 + ry;
  camera.position.set(px + c * lx, ly, pz + sn * lx);
  const heading = lerp(th0, thA, 0.55);
  camera.rotation.set(camCtl.pitch, -heading + camCtl.yaw, camCtl.roll + rr);
  const fovT = lens.baseFov + clamp((v - 12) * 0.5, 0, 6) + P.slideBlend * 5 + (P.vy < -8 ? 4 : 0) + (P.wr ? 3 : 0);
  camCtl.fov = damp(camCtl.fov, fovT, 4, dt);
  camera.fov = camCtl.fov;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  // focus of expansion for the radial blur: project the motion direction, then undo the lens
  _vel.set(Math.sin(heading) * v, P.alive ? clamp(P.vy, -20, 20) : 0, -Math.cos(heading) * v).normalize();
  _foe.copy(camera.position).addScaledVector(_vel, 60).project(camera);
  if (_foe.z > 1) _foe.set(0, 0, 0);
  const qx = _foe.x * lens.sx, qy = _foe.y * lens.sy;
  let ox = qx / lens.zoom, oy = qy / lens.zoom;
  for (let i = 0; i < 4; i++) { const f = lens.zoom * (1 + lens.k * (ox * ox + oy * oy)); ox = qx / f; oy = qy / f; }
  post.uniforms.uFoe.value.set(clamp((ox / lens.sx) * 0.5 + 0.5, 0.2, 0.8), clamp((oy / lens.sy) * 0.5 + 0.5, 0.2, 0.8));
}

// =====================================================================
//  HUD helpers
// =====================================================================
let toastTimer = 0, flashV = 0, lastDist = -1;
function toast(t) { ui.toast.textContent = t; ui.toast.classList.add('on'); toastTimer = 1.1; }
function flash(v) { flashV = Math.max(flashV, v); }
const HINTS = {
  jump: ['SWIPE UP TO JUMP', 0], slide: ['SWIPE DOWN TO SLIDE', 180], lane: ['SWIPE LEFT / RIGHT', 90], wallrun: ['SWIPE TO THE WALL', 90],
};
function showHint(h) {
  game.hint = h;
  const [txt, rot] = HINTS[h.type];
  ui.hintText.textContent = h.type === 'wallrun' ? (h.side < 0 ? 'SWIPE LEFT TO WALL-RUN' : 'SWIPE RIGHT TO WALL-RUN') : txt;
  let r = rot;
  if (h.type === 'lane') { const free = level.botQ.find((q) => q.t === 'lane' && q.s > P.s - 1 && q.s < h.s + 4); r = free && free.lane < P.lane ? -90 : 90; }
  if (h.type === 'wallrun') r = h.side < 0 ? -90 : 90;
  ui.hintArrow.style.transform = `rotate(${r}deg)`;
  ui.hint.classList.add('on');
  if (game.tutorialSlow) game.tsTarget = 0.35;
}
function hintDone(type) {
  if (!game.hint || game.hint.type !== type) return;
  game.hint = null; ui.hint.classList.remove('on'); game.tsTarget = 1;
}
function hintTick() {
  if (game.hint) {
    if (P.s > game.hint.s + 2) { game.hint = null; ui.hint.classList.remove('on'); game.tsTarget = 1; }
    return;
  }
  if (!game.hintsOn) return;
  const v = speedAt(P.s);
  for (const h of level.hints) {
    if (h.s < P.s || game.seen[h.type]) continue;
    if (h.s - P.s < v * 1.05) { game.seen[h.type] = true; showHint(h); }
    break;
  }
}

// =====================================================================
//  Game flow
// =====================================================================
const game = {
  state: 'loading', best: store.get('best', 0), runs: store.get('runs', 0), timeScale: 1, tsTarget: 1,
  hint: null, hintsOn: false, tutorialSlow: false, seen: {}, overTimer: 0,
  newLevel(seed, opt) {
    if (level) level.dispose();
    level = new Level(seed, opt);
    level.update(0, 999);
    resetPlayer();
  },
  attract() {
    this.newLevel(DEBUG.seed ?? ((Math.random() * 1e9) | 0), {});
    bot.on = true; this.state = 'menu'; this.tsTarget = 1;
    ui.menu.classList.remove('hidden'); ui.hud.classList.add('hidden'); ui.over.classList.add('hidden'); ui.pause.classList.add('hidden');
    ui.bestMenu.textContent = this.best;
    post.uniforms.uFade.value = 0;
  },
  start() {
    sfx.init(); sfx.click();
    if (matchMedia('(pointer: coarse)').matches && document.fullscreenEnabled && !document.fullscreenElement) {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
      }).catch(() => {});
    }
    const tutorial = this.runs < 1 && !DEBUG.nohints;
    this.newLevel(DEBUG.seed ?? ((Math.random() * 1e9) | 0), { tutorial });
    this.runs++; store.set('runs', this.runs);
    this.hintsOn = this.runs <= 2 && !DEBUG.nohints; this.tutorialSlow = tutorial; this.seen = {}; this.hint = null;
    bot.on = DEBUG.autoplay; this.state = 'play'; this.timeScale = 1; this.tsTarget = 1; lastDist = -1;
    ui.menu.classList.add('hidden'); ui.over.classList.add('hidden'); ui.pause.classList.add('hidden'); ui.hud.classList.remove('hidden');
    ui.hint.classList.remove('on'); ui.toast.classList.remove('on');
    post.uniforms.uFade.value = 0;
    canvas.focus({ preventScroll: true });
  },
  pause() {
    if (this.state !== 'play') return;
    this.state = 'paused'; ui.pause.classList.remove('hidden'); sfx.click();
  },
  resume() {
    if (this.state !== 'paused') return;
    this.state = 'play'; ui.pause.classList.add('hidden'); sfx.resume(); lastT = performance.now();
  },
  onDeath(type) {
    if (this.state === 'menu') { this.overTimer = 1.6; return; }
    this.state = 'dead'; this.tsTarget = 0.35; this.overTimer = 1.15; this.deathType = type;
    ui.hint.classList.remove('on'); this.hint = null;
  },
  showOver() {
    this.state = 'over';
    const dist = Math.floor(P.s) + P.bonus, isBest = dist > this.best;
    if (isBest) { this.best = dist; store.set('best', dist); }
    ui.overTitle.textContent = this.deathType === 'fall' ? 'YOU FELL' : 'WIPED OUT';
    ui.overDist.textContent = dist;
    ui.overBest.textContent = isBest ? 'NEW BEST!' : 'BEST ' + this.best + ' M';
    ui.overBest.classList.toggle('new', isBest);
    ui.hud.classList.add('hidden'); ui.over.classList.remove('hidden');
  },
};

function bindBtn(el, fn) { el.addEventListener('click', (e) => { e.stopPropagation(); fn(); }); }
ui.menu.addEventListener('click', () => { if (game.state === 'menu') game.start(); });
bindBtn($('playBtn'), () => game.start());
bindBtn($('pauseBtn'), () => game.pause());
bindBtn($('resumeBtn'), () => game.resume());
bindBtn($('restartBtn'), () => game.start());
bindBtn($('menuBtn'), () => game.attract());
bindBtn($('againBtn'), () => game.start());
bindBtn($('overMenuBtn'), () => game.attract());
const soundLabel = () => { const t = 'SOUND: ' + (sfx.enabled ? 'ON' : 'OFF'); ui.soundBtn.textContent = t; ui.soundBtn2.textContent = t; };
const toggleSound = () => { sfx.init(); sfx.setEnabled(!sfx.enabled); soundLabel(); };
bindBtn(ui.soundBtn, toggleSound); bindBtn(ui.soundBtn2, toggleSound);
soundLabel();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (game.state === 'play') game.pause(); sfx.suspend(); }
  else if (game.state !== 'paused') sfx.resume();
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// =====================================================================
//  Main loop
// =====================================================================
let lastT = performance.now(), acc = 0, expo = 1, blur = 0;
const perf = { acc: 0, n: 0, good: 0 };
function perfSample(dt) {
  if (game.state !== 'play' && game.state !== 'menu') return;
  perf.acc += dt; perf.n++;
  if (perf.acc < 1.5) return;
  const avg = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0;
  if (avg > 1 / 45 && quality.scale > 0.5) { quality.scale = Math.max(0.5, quality.scale * 0.85); perf.good = 0; resize(); }
  else if (avg < 1 / 57) { if (++perf.good >= 3 && quality.scale < quality.max) { quality.scale = Math.min(quality.max, quality.scale * 1.08); perf.good = 0; resize(); } }
  else perf.good = 0;
}
function frame(t) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  step(rdt);
  render(rdt);
}
function step(rdt) {
  perfSample(rdt);
  const st = game.state, running = st === 'play' || st === 'menu' || st === 'dead';
  game.timeScale = damp(game.timeScale, game.tsTarget, 6, rdt);
  const sdt = running ? rdt * game.timeScale : 0;
  if (running) {
    acc += sdt;
    let n = 0;
    while (acc >= STEP && n < 14) { tick(STEP); acc -= STEP; n++; }
    if (n >= 14) acc = 0;
    level.update(P.s, 1);
    if (st === 'play') hintTick();
  }
  if (st === 'dead' || (st === 'menu' && !P.alive)) {
    game.overTimer -= rdt;
    if (game.overTimer <= 0) { if (st === 'dead') game.showOver(); else game.attract(); }
  }
  if (running) { updateCamera(sdt); updateBody(sdt); }
  updateShadow();
  if (toastTimer > 0) { toastTimer -= rdt; if (toastTimer <= 0) ui.toast.classList.remove('on'); }
  if (st === 'play') {
    const dist = Math.floor(P.s) + P.bonus;
    if (dist !== lastDist) { lastDist = dist; ui.dist.textContent = dist; }
  }
  sfx.update(speedAt(P.s) * (P.alive ? 1 : 0.3), !P.grounded && !P.wr, st, rdt);
  // exposure adapts to covered zones, blur follows speed
  const z = level.zoneAt(P.s + 3);
  expo = damp(expo, z === 'tunnel' ? 1.55 : z === 'cover' ? 1.42 : 1, 2.2, rdt);
  const v = speedAt(P.s);
  const bt = running && P.alive ? clamp((v - 6) / 20, 0, 1) * 0.17 + (P.vy < -7 ? 0.05 : 0) + P.slideBlend * 0.03 : st === 'over' || st === 'paused' ? blur : 0.02;
  blur = damp(blur, bt, 5, rdt);
  flashV = damp(flashV, 0, 5, rdt);
  if (!P.alive && P.deathType === 'fall' && st !== 'over') post.uniforms.uFade.value = clamp(P.deathT * 0.55, 0, 0.6);
}
function render(dt) {
  post.uniforms.uTime.value += dt;
  sky.material.uniforms.uTime.value += dt;
  sky.position.copy(camera.position);
  const th = level.curve.at(P.s, _f).th;
  sun.position.set(camera.position.x - Math.sin(th) * 40 + Math.cos(th) * 18, camera.position.y + 70, camera.position.z + Math.cos(th) * 40 + Math.sin(th) * 18);
  sun.target.position.copy(camera.position);
  post.uniforms.uExposure.value = expo;
  post.uniforms.uBlur.value = blur;
  post.uniforms.uFlash.value = flashV;
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

// =====================================================================
//  Boot
// =====================================================================
const nextFrame = () => new Promise((r) => setTimeout(r, 0));
async function boot() {
  const W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
  quality.max = Math.min(dpr, 2);
  quality.scale = Math.min(dpr, 1.6, Math.sqrt(1.15e6 / (W * H)));
  resize();
  const mk = (c, o = {}) => {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Math.min(maxAniso, o.aniso || 4);
    return t;
  };
  const steps = [
    ['concrete', () => mk(texConcrete(11, { panels: 1, holes: true }))],
    ['wall', () => mk(texConcrete(23, { panels: 2, mlo: 0.6, mhi: 0.82, streak: 1.2 }))],
    ['floor', () => mk(texConcrete(37, { grooves: 4, joints: 1, mlo: 0.5, mhi: 0.74, base: [132, 131, 114], streak: 0.4, cracks: 6 }), { aniso: 8 })],
    ['wood', () => mk(texWood(41), { aniso: 8 })],
    ['stone', () => mk(texStone(53), { aniso: 8 })],
    ['facade', () => mk(texFacade(61))],
    ['facade2', () => mk(texFacade(67))],
    ['louver', () => mk(texLouver(71))],
    ['perf', () => mk(texPerf(73))],
    ['metal', () => mk(texMetal(79))],
    ['grate', () => mk(texGrate())],
    ['ivy', () => mk(texLeaves(83, false))],
    ['moss', () => mk(texLeaves(89, true))],
    ['glow', () => mk(texGlow())],
    ['fabric', () => mk(texFabric(97, [62, 64, 56], false))],
    ['glove', () => mk(texFabric(101, [176, 178, 168], true))],
  ];
  const T = {};
  for (let i = 0; i < steps.length; i++) {
    setLoad(0.05 + (0.8 * i) / steps.length, 'BUILDING THE CITY');
    await nextFrame();
    T[steps[i][0]] = steps[i][1]();
  }
  const lam = (map, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ map, vertexColors: true }, o));
  MAT = {
    concrete: lam(T.concrete), wall: lam(T.wall), floor: lam(T.floor), wood: lam(T.wood), stone: lam(T.stone),
    facade: lam(T.facade), facade2: lam(T.facade2), louver: lam(T.louver), perf: lam(T.perf), metal: lam(T.metal),
    dark: new THREE.MeshLambertMaterial({ color: 0x1a1b14, vertexColors: true }),
    grate: lam(T.grate, { alphaTest: 0.5, side: THREE.DoubleSide }),
    ivy: lam(T.ivy, { alphaTest: 0.45, side: THREE.DoubleSide }),
    moss: lam(T.moss),
    cable: new THREE.MeshLambertMaterial({ color: 0x24251f, vertexColors: true, side: THREE.DoubleSide }),
    lamp: new THREE.MeshBasicMaterial({ color: 0xfff0c4 }),
    glow: new THREE.PointsMaterial({ map: T.glow, color: 0xffcf80, size: 2.6, sizeAttenuation: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }),
    texFabric: T.fabric, texGlove: T.glove,
  };
  GEO.cyl = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true).toNonIndexed();
  GEO.cylSeg = new THREE.CylinderGeometry(1, 1, 1, 10, 8, true).toNonIndexed();
  GEO.cylCap = new THREE.CylinderGeometry(1, 1, 1, 12, 1, false).toNonIndexed();
  GEO.cyl20 = new THREE.CylinderGeometry(1, 1, 1, 20, 1, true).toNonIndexed();
  GEO.cylCap20 = new THREE.CylinderGeometry(1, 1, 1, 20, 1, false).toNonIndexed();
  GEO.box = new THREE.BoxGeometry(1, 1, 1, 1, 1, 4).toNonIndexed();
  GEO.ico = new THREE.IcosahedronGeometry(1, 1);
  buildBody();
  buildShadow();
  setLoad(0.9, 'ALMOST THERE');
  await nextFrame();
  if (DEBUG.play) { game.newLevel(DEBUG.seed ?? 1, {}); game.start(); }
  else game.attract();
  setLoad(1);
  ui.loading.classList.add('hidden');
  lastT = performance.now();
  requestAnimationFrame(frame);
}

// debugging / automated testing hook
window.__game = {
  game, P, bot, CFG, get level() { return level; },
  // advance the simulation quickly (no rendering) with the autopilot driving
  sim(seconds, auto = true) {
    const prev = bot.on; bot.on = auto;
    let t = 0;
    while (t < seconds && P.alive) { tick(STEP); t += STEP; if (((t / STEP) | 0) % 30 === 0) level.update(P.s, 4); }
    bot.on = prev;
    return { s: P.s, alive: P.alive, deathType: P.deathType, y: P.y };
  },
  step, render,
};

boot().catch((e) => { console.error(e); fatal('Something went wrong while starting the game: ' + (e && e.message ? e.message : e)); });
</script>
