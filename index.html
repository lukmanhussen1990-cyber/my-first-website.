<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Blaster — a 2D arena shooter</title>
<style>
  :root{
    --bg:#070912;
    --ink:#e8ecff;
    --accent:#33e1ff;
    --accent2:#ff4d9d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #game{display:block;position:fixed;inset:0;cursor:crosshair}

  #overlay{
    position:fixed;inset:0;display:none;place-items:center;
    background:radial-gradient(120% 90% at 50% 40%, rgba(10,14,32,.72), rgba(4,6,14,.94));
    backdrop-filter:blur(3px);
    z-index:5;padding:20px;
  }
  #overlay.show{display:grid}
  .panel{
    text-align:center;max-width:560px;width:100%;
    border:1px solid rgba(51,225,255,.28);
    border-radius:18px;
    background:linear-gradient(180deg, rgba(18,24,48,.85), rgba(9,12,26,.85));
    box-shadow:0 0 60px rgba(51,225,255,.12), inset 0 0 40px rgba(51,225,255,.05);
    padding:34px 28px;
  }
  h1{
    margin:0 0 6px;font-size:clamp(30px,7vw,54px);letter-spacing:.14em;font-weight:800;
    background:linear-gradient(90deg,var(--accent),#a97bff,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(51,225,255,.35));
  }
  .sub{margin:0 0 18px;opacity:.72;font-size:15px;letter-spacing:.04em}
  .big{font-size:clamp(24px,5vw,34px);margin:2px 0 4px;font-weight:800;letter-spacing:.04em}
  .stat{opacity:.8;font-size:15px;margin:2px 0}
  .stat b{color:var(--accent)}
  .keys{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;
    margin:18px 0 22px;font-size:13px;opacity:.85;
  }
  .keys div{
    border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:9px 8px;
    background:rgba(255,255,255,.03);
  }
  kbd{
    display:inline-block;min-width:20px;padding:2px 6px;margin-right:4px;
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:6px;
    background:rgba(255,255,255,.07);font:600 11px ui-monospace,monospace;color:#fff;
  }
  button{
    font:800 17px/1 inherit;letter-spacing:.12em;color:#04121a;
    background:linear-gradient(180deg,#6ff0ff,#19c5e8);
    border:0;border-radius:12px;padding:15px 40px;cursor:pointer;
    box-shadow:0 8px 26px rgba(25,197,232,.35);
    transition:transform .08s ease, box-shadow .15s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(25,197,232,.45)}
  button:active{transform:translateY(1px)}
  .hint{margin:16px 0 0;font-size:12px;opacity:.45;letter-spacing:.05em}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ *
 * Neon Blaster — a wave-survival arena shooter in one file.
 * No assets: all art is canvas drawing, all sound is WebAudio synth.
 * ------------------------------------------------------------------ */

const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b));
const pick  = arr => arr[randi(0, arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

/* ---------------------------------- canvas */
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width  = W + "px";
  cvs.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------------------------------- audio */
let actx = null, muted = false;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type = "square", vol = 0.06, slideTo = 0) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(a.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
let noiseBuf = null;
function boom(dur = 0.35, vol = 0.16, freq = 700) {
  if (muted) return;
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const filt = a.createBiquadFilter(); filt.type = "lowpass";
  filt.frequency.setValueAtTime(freq, t);
  filt.frequency.exponentialRampToValueAtTime(80, t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt).connect(g).connect(a.destination);
  src.start(t); src.stop(t + dur);
}
const sfx = {
  shoot:   () => tone(rand(680, 760), 0.06, "square",   0.035, 240),
  hit:     () => tone(rand(240, 300), 0.05, "triangle", 0.045, 140),
  kill:    () => { boom(0.25, 0.12, 900); tone(160, 0.18, "sawtooth", 0.05, 60); },
  bigKill: () => { boom(0.7, 0.22, 1400); tone(90, 0.6, "sawtooth", 0.09, 35); },
  hurt:    () => { tone(180, 0.25, "sawtooth", 0.09, 60); boom(0.2, 0.1, 500); },
  dash:    () => tone(420, 0.14, "sine", 0.05, 900),
  power:   () => { tone(700, 0.09, "sine", 0.07, 1050); setTimeout(() => tone(1050, 0.12, "sine", 0.06, 1500), 70); },
  wave:    () => { tone(330, 0.14, "sine", 0.06, 500); setTimeout(() => tone(500, 0.2, "sine", 0.05, 760), 130); },
  bomb:    () => { boom(0.9, 0.25, 1800); tone(70, 0.8, "sawtooth", 0.1, 30); },
  over:    () => { tone(300, 0.5, "sawtooth", 0.09, 70); setTimeout(() => tone(160, 0.9, "square", 0.07, 45), 240); },
};

/* ---------------------------------- input */
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false };
let usingTouch = false;

addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Space"].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
  if (state === "title" && (e.key === "Enter" || e.key === " ")) startGame();
  else if (state === "over" && (e.key === "Enter" || e.key === "r" || e.key === "R")) startGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; mouse.down = false; });

cvs.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cvs.addEventListener("mousedown", e => {
  audio();
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) useBomb();
});
addEventListener("mouseup", () => { mouse.down = false; });
cvs.addEventListener("contextmenu", e => e.preventDefault());

/* touch: left half = virtual stick, right half = aim + auto-fire */
const stick = { id: null, bx: 0, by: 0, x: 0, y: 0 };
const aimTouch = { id: null, x: 0, y: 0 };
function handleTouches(e) {
  e.preventDefault();
  usingTouch = true;
  audio();
  for (const t of e.changedTouches) {
    if (e.type === "touchstart") {
      if (t.clientX < W * 0.5 && stick.id === null) {
        stick.id = t.identifier; stick.bx = t.clientX; stick.by = t.clientY;
        stick.x = t.clientX; stick.y = t.clientY;
      } else if (aimTouch.id === null) {
        aimTouch.id = t.identifier; aimTouch.x = t.clientX; aimTouch.y = t.clientY;
        if (state === "title" || state === "over") { /* handled by overlay buttons */ }
      }
    } else if (e.type === "touchmove") {
      if (t.identifier === stick.id) { stick.x = t.clientX; stick.y = t.clientY; }
      if (t.identifier === aimTouch.id) { aimTouch.x = t.clientX; aimTouch.y = t.clientY; }
    } else {
      if (t.identifier === stick.id) stick.id = null;
      if (t.identifier === aimTouch.id) aimTouch.id = null;
    }
  }
}
for (const ev of ["touchstart", "touchmove", "touchend", "touchcancel"])
  cvs.addEventListener(ev, handleTouches, { passive: false });

/* ---------------------------------- game state */
let state = "title";           // title | play | paused | over
let player, bullets, foes, foeBullets, parts, drops, texts, ripples;
let wave, spawnQueue, spawnTimer, waveDelay, banner;
let score, best, combo, comboTimer, shake, hitStop, flash, time, kills;

best = +(localStorage.getItem("neonblaster.best") || 0);

function newPlayer() {
  return {
    x: W / 2, y: H / 2, vx: 0, vy: 0, r: 13, ang: -Math.PI / 2,
    hp: 5, maxHp: 5, inv: 0, cool: 0,
    dashCd: 0, dashT: 0, dashAng: 0,
    bombs: 2, shield: 0, rapid: 0, spread: 0,
  };
}
function reset() {
  player = newPlayer();
  bullets = []; foes = []; foeBullets = []; parts = []; drops = []; texts = []; ripples = [];
  wave = 0; spawnQueue = []; spawnTimer = 0; waveDelay = 1.0; banner = 0;
  score = 0; combo = 1; comboTimer = 0; shake = 0; hitStop = 0; flash = 0; time = 0; kills = 0;
}
reset();

/* ---------------------------------- particles & fx */
function burst(x, y, color, n, spd, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.25, spd);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(life * 0.5, life), max: life, color, size: rand(size * 0.5, size),
    });
  }
}
function ring(x, y, color, r0, r1, life = 0.4, width = 3) {
  ripples.push({ x, y, color, r0, r1, t: 0, life, width });
}
function popText(x, y, str, color = "#fff", size = 16) {
  texts.push({ x, y, str, color, size, t: 0, life: 0.9 });
}
const addShake = a => { shake = Math.min(26, shake + a); };

/* ---------------------------------- waves */
const FOE = {
  grunt:   { r: 15, hp: 3,  spd: 62,  color: "#ff4d6d", sides: 4, score: 10 },
  swift:   { r: 11, hp: 2,  spd: 132, color: "#ffd166", sides: 3, score: 15 },
  gunner:  { r: 17, hp: 5,  spd: 48,  color: "#a97bff", sides: 6, score: 25 },
  splitter:{ r: 26, hp: 11, spd: 40,  color: "#06d6a0", sides: 8, score: 40 },
  shard:   { r: 9,  hp: 2,  spd: 150, color: "#7bf7c8", sides: 3, score: 8  },
  boss:    { r: 52, hp: 150,spd: 34,  color: "#ff3b6b", sides: 7, score: 500 },
};

function buildWave(n) {
  const q = [];
  if (n % 5 === 0) {
    q.push("boss");
    for (let i = 0; i < 3 + n / 5; i++) q.push("swift");
    return q;
  }
  const budget = 4 + n * 2.2;
  let spent = 0;
  const menu = [["grunt", 1]];
  if (n >= 2) menu.push(["swift", 1.2]);
  if (n >= 3) menu.push(["gunner", 2.2]);
  if (n >= 4) menu.push(["splitter", 3.4]);
  while (spent < budget) {
    const [type, cost] = pick(menu);
    q.push(type); spent += cost;
  }
  return q;
}

function spawnAt(type, x, y) {
  const b = FOE[type];
  const hpScale = type === "boss" ? 1 + (wave / 5 - 1) * 0.85 : 1 + wave * 0.11;
  const f = {
    type, x, y, vx: 0, vy: 0,
    r: b.r, hp: b.hp * hpScale, maxHp: b.hp * hpScale,
    spd: b.spd * (1 + Math.min(0.5, wave * 0.02)),
    color: b.color, sides: b.sides, score: b.score,
    rot: rand(0, TAU), hitT: 0, t: rand(0, 10),
    fireT: rand(0.8, 2.2), phase: 0,
  };
  foes.push(f);
  ring(x, y, b.color, 4, b.r * 2.2, 0.45, 2);
  return f;
}
function spawnEdge(type) {
  const m = 70;
  const side = randi(0, 4);
  let x, y;
  if (side === 0) { x = rand(-m, W + m); y = -m; }
  else if (side === 1) { x = W + m; y = rand(-m, H + m); }
  else if (side === 2) { x = rand(-m, W + m); y = H + m; }
  else { x = -m; y = rand(-m, H + m); }
  return spawnAt(type, x, y);
}
function startWave(n) {
  wave = n;
  spawnQueue = buildWave(n);
  spawnTimer = 0.4;
  banner = 2.2;
  sfx.wave();
}

/* ---------------------------------- powerups */
const DROPS = {
  rapid:  { color: "#33e1ff", label: "RAPID FIRE" },
  spread: { color: "#ffd166", label: "SPREAD" },
  heal:   { color: "#ff4d9d", label: "+1 HP" },
  bomb:   { color: "#a97bff", label: "+1 BOMB" },
  shield: { color: "#06d6a0", label: "SHIELD" },
};
function maybeDrop(x, y, force) {
  if (!force && Math.random() > 0.14) return;
  const pool = ["rapid", "spread", "bomb", "shield"];
  if (player.hp < player.maxHp) pool.push("heal", "heal");
  drops.push({ x, y, type: pick(pool), t: 0, life: 12, r: 11 });
}
function takeDrop(d) {
  const info = DROPS[d.type];
  if (d.type === "rapid")  player.rapid  = Math.min(14, player.rapid + 8);
  if (d.type === "spread") player.spread = Math.min(16, player.spread + 9);
  if (d.type === "heal")   player.hp = Math.min(player.maxHp, player.hp + 1);
  if (d.type === "bomb")   player.bombs = Math.min(5, player.bombs + 1);
  if (d.type === "shield") player.shield = Math.max(player.shield, 6);
  popText(d.x, d.y - 14, info.label, info.color, 15);
  burst(d.x, d.y, info.color, 18, 190, 0.5, 3);
  ring(d.x, d.y, info.color, 6, 46, 0.4, 3);
  sfx.power();
}

/* ---------------------------------- actions */
function shoot() {
  const rate = player.rapid > 0 ? 0.075 : 0.14;
  if (player.cool > 0) return;
  player.cool = rate;
  const spread = player.spread > 0 ? [-0.17, 0, 0.17] : [0];
  const muzzle = player.r + 6;
  for (const off of spread) {
    const a = player.ang + off + rand(-0.02, 0.02);
    bullets.push({
      x: player.x + Math.cos(a) * muzzle,
      y: player.y + Math.sin(a) * muzzle,
      vx: Math.cos(a) * 760, vy: Math.sin(a) * 760,
      r: 4, dmg: 1, life: 1.1,
    });
  }
  player.vx -= Math.cos(player.ang) * 26;
  player.vy -= Math.sin(player.ang) * 26;
  addShake(1.1);
  sfx.shoot();
}

function useBomb() {
  if (state !== "play" || player.bombs <= 0) return;
  player.bombs--;
  foeBullets.length = 0;
  ring(player.x, player.y, "#ffffff", 10, Math.max(W, H) * 0.85, 0.7, 8);
  ring(player.x, player.y, "#33e1ff", 10, Math.max(W, H) * 0.7, 0.55, 14);
  burst(player.x, player.y, "#9be9ff", 70, 620, 0.9, 4);
  addShake(22); flash = 0.5; hitStop = 0.07;
  for (let i = foes.length - 1; i >= 0; i--) damageFoe(foes[i], 14, true);
  sfx.bomb();
}

function hurtPlayer(amount) {
  if (player.inv > 0 || player.dashT > 0) return;
  if (player.shield > 0) {
    player.shield = 0; player.inv = 0.9;
    ring(player.x, player.y, "#06d6a0", 10, 70, 0.4, 5);
    burst(player.x, player.y, "#06d6a0", 26, 260, 0.5, 3);
    popText(player.x, player.y - 26, "SHIELD BREAK", "#06d6a0", 14);
    addShake(8); sfx.hurt();
    return;
  }
  player.hp -= amount;
  player.inv = 1.2;
  combo = 1; comboTimer = 0;
  burst(player.x, player.y, "#ff5470", 30, 320, 0.6, 4);
  addShake(16); flash = 0.35; hitStop = 0.05;
  sfx.hurt();
  if (player.hp <= 0) gameOver();
}

function damageFoe(f, dmg, silent) {
  f.hp -= dmg;
  f.hitT = 0.12;
  if (!silent) sfx.hit();
  if (f.hp > 0) return;

  const i = foes.indexOf(f);
  if (i >= 0) foes.splice(i, 1);

  kills++;
  const gained = Math.round(f.score * combo);
  score += gained;
  combo = Math.min(9.9, combo + (f.type === "boss" ? 1 : 0.12));
  comboTimer = 3;
  popText(f.x, f.y - f.r - 6, "+" + gained, f.color, f.type === "boss" ? 26 : 15);

  if (f.type === "boss") {
    burst(f.x, f.y, "#fff", 90, 520, 1.1, 5);
    burst(f.x, f.y, f.color, 70, 380, 1.3, 6);
    ring(f.x, f.y, "#fff", 20, 340, 0.8, 10);
    addShake(26); flash = 0.55; hitStop = 0.12;
    sfx.bigKill();
    for (let k = 0; k < 3; k++) maybeDrop(f.x + rand(-40, 40), f.y + rand(-40, 40), true);
  } else {
    burst(f.x, f.y, f.color, 20 + f.r, 300, 0.7, 4);
    ring(f.x, f.y, f.color, f.r * 0.5, f.r * 3.4, 0.4, 3);
    addShake(f.r * 0.22);
    sfx.kill();
    maybeDrop(f.x, f.y, false);
  }

  if (f.type === "splitter") {
    for (let k = 0; k < 3; k++) {
      const a = rand(0, TAU);
      const s = spawnAt("shard", f.x + Math.cos(a) * 22, f.y + Math.sin(a) * 22);
      s.vx = Math.cos(a) * 140; s.vy = Math.sin(a) * 140;
    }
  }
}

function gameOver() {
  state = "over";
  burst(player.x, player.y, "#ff4d6d", 90, 460, 1.2, 5);
  ring(player.x, player.y, "#ff4d6d", 10, 260, 0.8, 8);
  addShake(24); flash = 0.6;
  sfx.over();
  if (score > best) { best = score; localStorage.setItem("neonblaster.best", String(best)); }
  setTimeout(showGameOver, 700);
}

/* ---------------------------------- update */
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 46);
  flash = Math.max(0, flash - dt * 2.2);
  banner = Math.max(0, banner - dt);
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }

  /* ---- player */
  const p = player;
  p.cool  = Math.max(0, p.cool - dt);
  p.inv   = Math.max(0, p.inv - dt);
  p.dashCd= Math.max(0, p.dashCd - dt);
  p.dashT = Math.max(0, p.dashT - dt);
  p.rapid = Math.max(0, p.rapid - dt);
  p.spread= Math.max(0, p.spread - dt);
  p.shield= Math.max(0, p.shield - dt);

  let mx = 0, my = 0;
  if (keys["a"] || keys["arrowleft"])  mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  if (keys["w"] || keys["arrowup"])    my -= 1;
  if (keys["s"] || keys["arrowdown"])  my += 1;
  if (stick.id !== null) {
    const dx = stick.x - stick.bx, dy = stick.y - stick.by;
    const len = Math.hypot(dx, dy);
    if (len > 6) { const k = Math.min(1, len / 52) / len; mx += dx * k; my += dy * k; }
  }
  const mlen = Math.hypot(mx, my);
  if (mlen > 1) { mx /= mlen; my /= mlen; }

  const accel = 2600, maxSpd = 330;
  p.vx += mx * accel * dt;
  p.vy += my * accel * dt;
  const drag = Math.pow(0.0016, dt);
  p.vx *= drag; p.vy *= drag;
  const sp = Math.hypot(p.vx, p.vy);
  const cap = p.dashT > 0 ? 1150 : maxSpd;
  if (sp > cap) { p.vx = p.vx / sp * cap; p.vy = p.vy / sp * cap; }
  p.x = clamp(p.x + p.vx * dt, p.r, W - p.r);
  p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);

  /* aim */
  if (usingTouch && aimTouch.id !== null) {
    p.ang = Math.atan2(aimTouch.y - p.y, aimTouch.x - p.x);
  } else if (!usingTouch) {
    p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  } else if (mlen > 0.1) {
    p.ang = Math.atan2(my, mx);
  }

  /* dash */
  if ((keys[" "] || keys["shift"]) && p.dashCd <= 0) {
    const a = (mlen > 0.1) ? Math.atan2(my, mx) : p.ang;
    p.dashT = 0.16; p.dashCd = 1.1; p.dashAng = a;
    p.vx = Math.cos(a) * 1150; p.vy = Math.sin(a) * 1150;
    burst(p.x, p.y, "#33e1ff", 22, 260, 0.4, 3);
    ring(p.x, p.y, "#33e1ff", 6, 52, 0.3, 3);
    sfx.dash();
  }
  if (keys["e"]) { keys["e"] = false; useBomb(); }
  if (p.dashT > 0 && Math.random() < 0.8) {
    parts.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-30, 30),
                 life: 0.3, max: 0.3, color: "#33e1ff", size: 5 });
  }

  /* fire */
  const firing = (mouse.down && !usingTouch) || (usingTouch && aimTouch.id !== null) || keys["j"];
  if (firing) shoot();

  /* thruster */
  if (mlen > 0.2 && Math.random() < 0.7) {
    const a = Math.atan2(-my, -mx) + rand(-0.5, 0.5);
    parts.push({
      x: p.x + Math.cos(a) * 10, y: p.y + Math.sin(a) * 10,
      vx: Math.cos(a) * rand(60, 150) + p.vx * 0.2,
      vy: Math.sin(a) * rand(60, 150) + p.vy * 0.2,
      life: 0.28, max: 0.28, color: "#7fe3ff", size: rand(2, 4),
    });
  }

  /* ---- waves */
  if (spawnQueue.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const type = spawnQueue.shift();
      if (type === "boss") {
        const b = spawnEdge("boss");
        b.isBoss = true;
      } else spawnEdge(type);
      spawnTimer = Math.max(0.16, 0.72 - wave * 0.02);
    }
  } else if (foes.length === 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) { waveDelay = 1.6; startWave(wave + 1); }
  }

  /* ---- foes */
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i];
    f.t += dt;
    f.hitT = Math.max(0, f.hitT - dt);
    f.rot += dt * (f.type === "swift" ? 5 : 1.4);

    const dx = p.x - f.x, dy = p.y - f.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    if (f.type === "gunner") {
      const want = 250;
      const push = d > want + 30 ? 1 : d < want - 30 ? -1 : 0;
      f.vx = lerp(f.vx, (ux * push - uy * 0.45) * f.spd, dt * 3);
      f.vy = lerp(f.vy, (uy * push + ux * 0.45) * f.spd, dt * 3);
      f.fireT -= dt;
      if (f.fireT <= 0 && d < 620) {
        f.fireT = rand(1.5, 2.4);
        const a = Math.atan2(dy, dx);
        for (const o of [-0.12, 0, 0.12]) {
          foeBullets.push({ x: f.x, y: f.y, vx: Math.cos(a + o) * 250, vy: Math.sin(a + o) * 250,
                            r: 6, life: 4, color: f.color });
        }
        tone(320, 0.09, "sawtooth", 0.03, 180);
      }
    } else if (f.type === "boss") {
      const want = 230;
      const push = d > want ? 1 : -0.6;
      const orbit = Math.sin(f.t * 0.6) * 0.9;
      f.vx = lerp(f.vx, (ux * push - uy * orbit) * f.spd, dt * 2);
      f.vy = lerp(f.vy, (uy * push + ux * orbit) * f.spd, dt * 2);
      f.fireT -= dt;
      if (f.fireT <= 0) {
        f.phase++;
        if (f.phase % 3 === 0) {
          f.fireT = 2.6;
          for (let k = 0; k < 3; k++) {
            const s = spawnAt("swift", f.x + rand(-40, 40), f.y + rand(-40, 40));
            s.hp = s.maxHp = 2;
          }
          ring(f.x, f.y, f.color, 20, 110, 0.4, 4);
        } else {
          f.fireT = 1.9;
          const n = 18, base = Math.atan2(dy, dx);
          for (let k = 0; k < n; k++) {
            const a = base + (k / n) * TAU;
            foeBullets.push({ x: f.x, y: f.y, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210,
                              r: 7, life: 5, color: "#ff8fb0" });
          }
          ring(f.x, f.y, "#ff8fb0", 20, 130, 0.35, 5);
          tone(180, 0.25, "sawtooth", 0.05, 90);
        }
      }
    } else {
      const wob = f.type === "swift" ? Math.sin(f.t * 7) * 0.55 : Math.sin(f.t * 1.6) * 0.2;
      f.vx = lerp(f.vx, (ux - uy * wob) * f.spd, dt * 2.6);
      f.vy = lerp(f.vy, (uy + ux * wob) * f.spd, dt * 2.6);
    }

    f.x += f.vx * dt; f.y += f.vy * dt;

    /* soft separation so they don't stack */
    for (let j = i - 1; j >= 0; j--) {
      const g = foes[j];
      const ddx = g.x - f.x, ddy = g.y - f.y;
      const rr = f.r + g.r;
      const dd = Math.hypot(ddx, ddy);
      if (dd > 0 && dd < rr) {
        const k = (rr - dd) / dd * 0.5;
        f.x -= ddx * k; f.y -= ddy * k;
        g.x += ddx * k; g.y += ddy * k;
      }
    }

    /* touch damage */
    if (d < f.r + p.r) {
      hurtPlayer(1);
      f.vx = -ux * 260; f.vy = -uy * 260;
      if (f.type !== "boss") damageFoe(f, 1, false);
    }
  }

  /* ---- player bullets */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
      bullets.splice(i, 1); continue;
    }
    for (let j = foes.length - 1; j >= 0; j--) {
      const f = foes[j];
      const rr = f.r + b.r;
      if ((f.x - b.x) ** 2 + (f.y - b.y) ** 2 < rr * rr) {
        burst(b.x, b.y, f.color, 5, 140, 0.3, 2.4);
        damageFoe(f, b.dmg, false);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  /* ---- enemy bullets */
  for (let i = foeBullets.length - 1; i >= 0; i--) {
    const b = foeBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) {
      foeBullets.splice(i, 1); continue;
    }
    const rr = b.r + p.r * 0.8;
    if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < rr * rr) {
      foeBullets.splice(i, 1);
      hurtPlayer(1);
    }
  }

  /* ---- drops */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt; d.life -= dt;
    if (d.life <= 0) { drops.splice(i, 1); continue; }
    const dx = p.x - d.x, dy = p.y - d.y;
    const dd = Math.hypot(dx, dy) || 1;
    if (dd < 140) { d.x += dx / dd * 260 * dt * (1 - dd / 220); d.y += dy / dd * 260 * dt * (1 - dd / 220); }
    if (dd < p.r + d.r) { takeDrop(d); drops.splice(i, 1); }
  }

  /* ---- fx */
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const f = Math.pow(0.02, dt);
    q.vx *= f; q.vy *= f;
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].t += dt;
    if (ripples[i].t >= ripples[i].life) ripples.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.t += dt; t.y -= 26 * dt;
    if (t.t >= t.life) texts.splice(i, 1);
  }
}

/* ---------------------------------- drawing */
function poly(x, y, r, sides, rot) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + (i / sides) * TAU;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawBackground() {
  ctx.fillStyle = "#070912";
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, "rgba(40,70,140,.20)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const step = 56;
  const off = (time * 14) % step;
  ctx.strokeStyle = "rgba(90,150,255,.075)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -off; x < W + step; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -off; y < H + step; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.strokeStyle = "rgba(51,225,255,.16)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
}

function drawPlayer() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.ang);

  if (p.inv > 0 && Math.floor(p.inv * 18) % 2 === 0) ctx.globalAlpha = 0.35;

  ctx.shadowColor = "#33e1ff";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(p.r + 8, 0);
  ctx.lineTo(-p.r + 2, p.r - 1);
  ctx.lineTo(-p.r + 7, 0);
  ctx.lineTo(-p.r + 2, -p.r + 1);
  ctx.closePath();
  ctx.fillStyle = "#0d2f42";
  ctx.fill();
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = "#7ff0ff";
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(1, 0, 3.4, 0, TAU);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.restore();

  if (p.shield > 0) {
    ctx.save();
    const a = 0.35 + Math.sin(time * 9) * 0.15 + Math.min(0.3, p.shield * 0.05);
    ctx.globalAlpha = a;
    ctx.strokeStyle = "#06d6a0";
    ctx.shadowColor = "#06d6a0";
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 11 + Math.sin(time * 6) * 1.5, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawFoe(f) {
  ctx.save();
  ctx.shadowColor = f.color;
  ctx.shadowBlur = f.type === "boss" ? 34 : 14;
  ctx.lineWidth = f.type === "boss" ? 4 : 2.4;
  ctx.strokeStyle = f.hitT > 0 ? "#ffffff" : f.color;
  ctx.fillStyle = f.hitT > 0 ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.06)";

  poly(f.x, f.y, f.r, f.sides, f.rot);
  ctx.fill();
  ctx.stroke();

  if (f.type === "boss") {
    ctx.globalAlpha = 0.55;
    poly(f.x, f.y, f.r * 0.62, f.sides, -f.rot * 1.4);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (f.type === "gunner") {
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 0.4, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (f.maxHp > 4 && f.hp < f.maxHp && f.type !== "boss") {
    const w = f.r * 2;
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(f.x - w / 2, f.y - f.r - 10, w, 4);
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x - w / 2, f.y - f.r - 10, w * (f.hp / f.maxHp), 4);
  }
}

function drawFx() {
  for (const q of parts) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size * a + 0.5);
  }
  ctx.globalAlpha = 1;

  for (const r of ripples) {
    const t = r.t / r.life;
    ctx.globalAlpha = (1 - t) * 0.9;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width * (1 - t) + 0.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, lerp(r.r0, r.r1, 1 - Math.pow(1 - t, 2)), 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const t of texts) {
    const k = 1 - t.t / t.life;
    ctx.globalAlpha = clamp(k * 1.4, 0, 1);
    ctx.font = `800 ${t.size}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 10;
    ctx.fillText(t.str, t.x, t.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

function drawBullets() {
  ctx.shadowBlur = 12;
  for (const b of bullets) {
    ctx.shadowColor = "#9be9ff";
    ctx.strokeStyle = "#dffaff";
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.016, b.y - b.vy * 0.016);
    ctx.stroke();
  }
  for (const b of foeBullets) {
    ctx.shadowColor = b.color;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.4, 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawDrops() {
  for (const d of drops) {
    const info = DROPS[d.type];
    const pulse = 1 + Math.sin(d.t * 6) * 0.12;
    const fade = d.life < 3 ? (Math.floor(d.life * 8) % 2 ? 0.35 : 1) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.t * 1.6);
    ctx.shadowColor = info.color;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = info.color;
    ctx.fillStyle = "rgba(255,255,255,.10)";
    ctx.lineWidth = 2.4;
    poly(0, 0, d.r * pulse, 4, 0);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawHud() {
  const p = player;

  /* hearts */
  for (let i = 0; i < p.maxHp; i++) {
    const x = 22 + i * 22, y = 26;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, TAU);
    if (i < p.hp) {
      ctx.fillStyle = "#ff4d6d";
      ctx.shadowColor = "#ff4d6d"; ctx.shadowBlur = 12;
      ctx.fill(); ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = 2; ctx.stroke();
    }
  }

  /* bombs */
  for (let i = 0; i < p.bombs; i++) {
    const x = 22 + i * 20, y = 50;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#a97bff"; ctx.shadowColor = "#a97bff"; ctx.shadowBlur = 10;
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  /* dash meter */
  const dw = 92, dx = 18, dy = 66;
  ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.fillRect(dx, dy, dw, 5);
  ctx.fillStyle = p.dashCd > 0 ? "rgba(51,225,255,.45)" : "#33e1ff";
  ctx.fillRect(dx, dy, dw * (1 - p.dashCd / 1.1), 5);

  /* score */
  ctx.textAlign = "right";
  ctx.fillStyle = "#fff";
  ctx.font = "800 30px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText(String(score), W - 20, 36);
  ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fillText("BEST " + Math.max(best, score), W - 20, 54);

  if (combo > 1.05) {
    ctx.font = "800 18px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "#ffd166";
    ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 12;
    ctx.fillText("x" + combo.toFixed(1), W - 20, 78);
    ctx.shadowBlur = 0;
    const cw = 70;
    ctx.fillStyle = "rgba(255,209,102,.25)";
    ctx.fillRect(W - 20 - cw, 84, cw, 4);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(W - 20 - cw, 84, cw * clamp(comboTimer / 3, 0, 1), 4);
  }
  ctx.textAlign = "left";

  /* wave label */
  ctx.textAlign = "center";
  ctx.font = "700 13px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.fillText("WAVE " + wave, W / 2, 28);

  /* powerup timers */
  const buffs = [];
  if (p.rapid > 0)  buffs.push(["RAPID",  p.rapid,  "#33e1ff"]);
  if (p.spread > 0) buffs.push(["SPREAD", p.spread, "#ffd166"]);
  if (p.shield > 0) buffs.push(["SHIELD", p.shield, "#06d6a0"]);
  buffs.forEach((b, i) => {
    const y = H - 24 - i * 20;
    ctx.textAlign = "left";
    ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = b[2];
    ctx.fillText(b[0], 20, y);
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(78, y - 9, 64, 5);
    ctx.fillStyle = b[2];
    ctx.fillRect(78, y - 9, 64 * clamp(b[1] / 16, 0, 1), 5);
  });
  ctx.textAlign = "center";

  /* boss bar */
  const boss = foes.find(f => f.type === "boss");
  if (boss) {
    const bw = Math.min(520, W - 80), bx = (W - bw) / 2, by = H - 46;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(bx - 2, by - 2, bw + 4, 14);
    ctx.fillStyle = "rgba(255,59,107,.25)";
    ctx.fillRect(bx, by, bw, 10);
    ctx.fillStyle = "#ff3b6b";
    ctx.shadowColor = "#ff3b6b"; ctx.shadowBlur = 14;
    ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxHp, 0, 1), 10);
    ctx.shadowBlur = 0;
    ctx.font = "800 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.fillText("OVERSEER", W / 2, by - 8);
  }

  /* wave banner */
  if (banner > 0) {
    const k = banner > 1.9 ? (2.2 - banner) / 0.3 : Math.min(1, banner / 0.5);
    ctx.globalAlpha = clamp(k, 0, 1);
    ctx.font = "800 clamp(28px, 6vw, 52px) ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#33e1ff"; ctx.shadowBlur = 24;
    const isBoss = wave % 5 === 0;
    ctx.fillText(isBoss ? "WAVE " + wave + " — OVERSEER" : "WAVE " + wave, W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  if (muted) {
    ctx.textAlign = "left";
    ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText("MUTED (M)", 20, H - 6);
  }
  ctx.textAlign = "left";
}

function drawTouchUi() {
  if (!usingTouch) return;
  if (stick.id !== null) {
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.bx, stick.by, 46, 0, TAU); ctx.stroke();
    const dx = stick.x - stick.bx, dy = stick.y - stick.by;
    const len = Math.hypot(dx, dy) || 1, k = Math.min(1, len / 46);
    ctx.fillStyle = "#33e1ff";
    ctx.beginPath();
    ctx.arc(stick.bx + dx / len * 46 * k, stick.by + dy / len * 46 * k, 18, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) {
    ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  }

  drawBackground();
  drawDrops();
  drawFx();
  for (const f of foes) drawFoe(f);
  drawBullets();
  if (state !== "over") drawPlayer();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }
  /* vignette */
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  drawHud();
  drawTouchUi();
}

/* ---------------------------------- overlay screens */
const overlay = document.getElementById("overlay");
function show(html) { overlay.innerHTML = html; overlay.classList.add("show"); }
function hide() { overlay.classList.remove("show"); }

const CONTROLS = `
  <div class="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</div>
    <div><kbd>Mouse</kbd> aim &amp; hold to fire</div>
    <div><kbd>Space</kbd> dash (i-frames)</div>
    <div><kbd>E</kbd> / right-click bomb</div>
    <div><kbd>P</kbd> pause &nbsp; <kbd>M</kbd> mute</div>
    <div>Touch: left half moves, right half aims</div>
  </div>`;

function showTitle() {
  state = "title";
  show(`<div class="panel">
    <h1>NEON BLASTER</h1>
    <p class="sub">Endless waves. One ship. How far can you get?</p>
    ${CONTROLS}
    <button data-act="play">PLAY</button>
    <p class="hint">Best score: ${best}</p>
  </div>`);
}
function showPause() {
  show(`<div class="panel">
    <h1>PAUSED</h1>
    <p class="sub">Wave ${wave} &nbsp;·&nbsp; Score ${score}</p>
    ${CONTROLS}
    <button data-act="resume">RESUME</button>
    <p class="hint">Press <kbd>P</kbd> to resume, or click below to restart</p>
    <p class="hint"><a href="#" data-act="play" style="color:#ff8fb0">restart run</a></p>
  </div>`);
}
function showGameOver() {
  const isBest = score >= best;
  show(`<div class="panel">
    <h1>GAME OVER</h1>
    <p class="big">${score.toLocaleString()}</p>
    <p class="stat">${isBest && score > 0 ? "★ NEW BEST ★" : "Best <b>" + best.toLocaleString() + "</b>"}</p>
    <p class="stat">Reached wave <b>${wave}</b> &nbsp;·&nbsp; <b>${kills}</b> kills &nbsp;·&nbsp; <b>${Math.floor(time)}s</b> survived</p>
    <div style="height:18px"></div>
    <button data-act="play">PLAY AGAIN</button>
    <p class="hint">or press <kbd>Enter</kbd></p>
  </div>`);
}

overlay.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  e.preventDefault();
  audio();
  if (el.dataset.act === "play") startGame();
  else if (el.dataset.act === "resume") togglePause();
});

function startGame() {
  /* the key that started the run must not also fire a dash on frame one */
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  reset();
  hide();
  state = "play";
  startWave(1);
  last = performance.now();
}
function togglePause() {
  if (state === "play") { state = "paused"; showPause(); }
  else if (state === "paused") { state = "play"; hide(); last = performance.now(); }
}
function toggleMute() {
  muted = !muted;
  if (!muted) { audio(); tone(660, 0.08, "sine", 0.05); }
}

/* ---------------------------------- loop */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);

  if (state === "play") {
    if (hitStop > 0) hitStop -= dt;
    else update(dt);
    render();
  } else if (state === "title") {
    time += dt;
    /* idle beauty pass: drifting particles behind the title */
    if (Math.random() < 0.25) {
      parts.push({
        x: rand(0, W), y: H + 10, vx: rand(-20, 20), vy: rand(-70, -30),
        life: 3, max: 3, color: pick(["#33e1ff", "#a97bff", "#ff4d9d"]), size: rand(1.5, 3),
      });
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
    drawBackground();
    drawFx();
  } else {
    /* paused / game over: keep the last frame alive with decaying fx */
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      const f = Math.pow(0.02, dt);
      q.vx *= f; q.vy *= f;
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].t += dt;
      if (ripples[i].t >= ripples[i].life) ripples.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 46);
    flash = Math.max(0, flash - dt * 2.2);
    render();
  }

  requestAnimationFrame(frame);
}

showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
