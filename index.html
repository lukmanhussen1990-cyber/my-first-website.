/* ==========================================================================
   EMBERLEAP — engine part 6
   Renderer · UIManager · WorldMap · Game state machine · main loop
   ========================================================================== */

const BASE_H = 208;

/* ------------------------------------------------------------- Renderer
   Draws the world into an internal-resolution buffer, then blits it to the
   visible canvas with nearest-neighbour scaling. Touch controls are drawn
   afterwards at full device resolution so they stay smooth.                 */
class Renderer {
  constructor(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.buf = document.createElement('canvas');
    this.bx = this.buf.getContext('2d', { alpha: false });
    this.vw = 320; this.vh = BASE_H;
    this.scale = 1;
    this.offX = 0; this.offY = 0;
    this.dpr = 1;
    this.resize();
  }

  resize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    // cap DPR: on a 3x phone a full-res backbuffer costs more than it shows
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(w * this.dpr), ch = Math.round(h * this.dpr);
    if (this.cv.width !== cw || this.cv.height !== ch) {
      this.cv.width = cw; this.cv.height = ch;
    }
    this.cv.style.width = w + 'px';
    this.cv.style.height = h + 'px';

    const aspect = w / h;
    let vw = Math.round(BASE_H * aspect);
    vw = clamp(vw, 288, 480);
    if (vw & 1) vw++;
    this.vw = vw; this.vh = BASE_H;
    if (this.buf.width !== vw || this.buf.height !== BASE_H) {
      this.buf.width = vw; this.buf.height = BASE_H;
    }
    this.bx.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingEnabled = false;

    // integer scale when it fits, otherwise fractional to fill the screen
    const sx = cw / vw, sy = ch / this.vh;
    this.scale = Math.min(sx, sy);
    this.dispW = Math.floor(vw * this.scale);
    this.dispH = Math.floor(this.vh * this.scale);
    this.offX = Math.floor((cw - this.dispW) / 2);
    this.offY = Math.floor((ch - this.dispH) / 2);
  }

  present() {
    const c = this.ctx;
    c.imageSmoothingEnabled = false;
    if (this.offX > 0 || this.offY > 0) {
      c.fillStyle = '#000000';
      c.fillRect(0, 0, this.cv.width, this.cv.height);
    }
    c.drawImage(this.buf, 0, 0, this.vw, this.vh, this.offX, this.offY, this.dispW, this.dispH);
  }

  /** convert a device-pixel point to buffer coordinates */
  toBuffer(x, y) {
    return {
      x: (x - this.offX) / this.scale,
      y: (y - this.offY) / this.scale
    };
  }
}

/* ------------------------------------------------------------ Menu widget */
class Menu {
  constructor(items) {
    this.items = items;          // {label, action, get?, set?, kind?}
    this.sel = 0;
    this.t = 0;
    this.rects = [];
  }
  setItems(items) {
    this.items = items;
    this.sel = clamp(this.sel, 0, items.length - 1);
  }
  update(dt, input, audio) {
    this.t += dt;
    const n = this.items.length;
    if (!n) return null;
    if (input.pressed(ACT.UP)) { this.sel = (this.sel - 1 + n) % n; audio.sfx('menu_move'); }
    if (input.pressed(ACT.DOWN)) { this.sel = (this.sel + 1) % n; audio.sfx('menu_move'); }
    const it = this.items[this.sel];
    if (it.kind === 'slider') {
      let d = 0;
      if (input.pressed(ACT.LEFT)) d = -1;
      if (input.pressed(ACT.RIGHT)) d = 1;
      if (d) { it.set(clamp(it.get() + d * (it.step || 0.1), it.min === undefined ? 0 : it.min, it.max === undefined ? 1 : it.max)); audio.sfx('select'); }
    } else if (it.kind === 'toggle') {
      if (input.pressed(ACT.LEFT) || input.pressed(ACT.RIGHT)) { it.set(!it.get()); audio.sfx('select'); }
    } else if (it.kind === 'choice') {
      let d = 0;
      if (input.pressed(ACT.LEFT)) d = -1;
      if (input.pressed(ACT.RIGHT)) d = 1;
      if (d) { it.cycle(d); audio.sfx('select'); }
    }
    if (input.anyConfirm()) {
      if (it.kind === 'toggle') { it.set(!it.get()); audio.sfx('confirm'); return null; }
      if (it.action) { audio.sfx('confirm'); return it.action; }
    }
    return null;
  }
  /** returns an action if a tap landed on an item */
  tap(bx, by, audio) {
    for (let i = 0; i < this.rects.length; i++) {
      const r = this.rects[i];
      if (bx >= r.x && bx <= r.x + r.w && by >= r.y && by <= r.y + r.h) {
        if (this.sel !== i) { this.sel = i; audio.sfx('menu_move'); return null; }
        const it = this.items[i];
        if (it.kind === 'slider') {
          const k = clamp((bx - (r.x + r.w - 66)) / 60, 0, 1);
          it.set(clamp((it.min || 0) + k * ((it.max === undefined ? 1 : it.max) - (it.min || 0)), it.min || 0, it.max === undefined ? 1 : it.max));
          audio.sfx('select');
          return null;
        }
        if (it.kind === 'toggle') { it.set(!it.get()); audio.sfx('confirm'); return null; }
        if (it.kind === 'choice') { it.cycle(1); audio.sfx('select'); return null; }
        if (it.action) { audio.sfx('confirm'); return it.action; }
      }
    }
    return null;
  }
  render(g, x, y, opt) {
    opt = opt || {};
    const lh = opt.lineHeight || 16;
    const scale = opt.scale || 1;
    this.rects.length = 0;
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      const iy = y + i * lh;
      const selected = i === this.sel;
      const wob = selected ? Math.sin(this.t * 7) * 1.2 : 0;
      const col = it.disabled ? '#7a7488' : (selected ? '#ffe45c' : '#e8e0f0');
      let label = it.label;
      if (it.kind === 'choice') label = it.label + ': ' + it.text();
      if (it.kind === 'toggle') label = it.label + ': ' + (it.get() ? 'ON' : 'OFF');
      const w = Text.width(label, scale);
      const lx = opt.center ? x - w / 2 : x;
      if (selected) Text.draw(g, '▶', lx - 10 * scale + wob, iy, { color: '#ffe45c', scale: scale });
      Text.draw(g, label, lx, iy, { color: col, scale: scale });
      if (it.kind === 'slider') {
        const bw = 60, bh = 5;
        const bxx = lx + w + 10, byy = iy + 1;
        g.fillStyle = '#2a1c3a'; g.fillRect(bxx, byy, bw, bh);
        const k = clamp((it.get() - (it.min || 0)) / ((it.max === undefined ? 1 : it.max) - (it.min || 0)), 0, 1);
        g.fillStyle = selected ? '#ffe45c' : '#9a90b0';
        g.fillRect(bxx, byy, Math.round(bw * k), bh);
        g.fillStyle = '#160d18'; g.fillRect(bxx + Math.round(bw * k) - 1, byy - 1, 2, bh + 2);
        this.rects.push({ x: lx - 12, y: iy - 3, w: w + bw + 24, h: lh });
      } else {
        this.rects.push({ x: lx - 12, y: iy - 3, w: Math.max(w + 24, 90), h: lh });
      }
    }
  }
}

/* ------------------------------------------------------------- WorldMap */
const WORLD_INFO = [
  { name: 'GREEN VALLEY', col: '#4f9e4a', col2: '#2b6c34' },
  { name: 'SUNSET RIDGE', col: '#d4863a', col2: '#8a4a2a' },
  { name: 'MISTY FOREST', col: '#3f8a6a', col2: '#245046' },
  { name: 'EMBER FORTRESS', col: '#a83a2a', col2: '#5c1c14' }
];

class WorldMap {
  constructor(game) {
    this.game = game;
    this.t = 0;
    this.sel = 0;
    this.avatarX = 0; this.avatarY = 0;
    this.moveT = 1;
    this.fromNode = 0;
    this.hopPhase = 0;
    this.nodes = [];
    this.layout();
  }
  layout() {
    // a winding path across the four biome bands
    const pts = [
      [42, 132], [86, 116],
      [140, 138], [186, 100],
      [238, 130], [286, 104],
      [336, 134], [392, 112]
    ];
    this.nodes = pts.map((p, i) => ({
      x: p[0], y: p[1], world: (i >> 1) + 1, index: i,
      id: ((i >> 1) + 1) + '-' + ((i & 1) + 1)
    }));
    this.avatarX = this.nodes[0].x;
    this.avatarY = this.nodes[0].y;
  }
  setSel(i, animate) {
    i = clamp(i, 0, this.nodes.length - 1);
    if (animate && i !== this.sel) {
      this.fromNode = this.sel;
      this.moveT = 0;
    } else if (!animate) {
      this.avatarX = this.nodes[i].x;
      this.avatarY = this.nodes[i].y;
      this.moveT = 1;
    }
    this.sel = i;
  }
  unlockedCount() { return clamp(SaveManager.data.unlocked, 1, this.nodes.length); }

  update(dt, input, audio) {
    this.t += dt;
    if (this.moveT < 1) {
      this.moveT = Math.min(1, this.moveT + dt * 2.2);
      const a = this.nodes[this.fromNode], b = this.nodes[this.sel];
      const k = easeInOutQuad(this.moveT);
      this.avatarX = lerp(a.x, b.x, k);
      this.avatarY = lerp(a.y, b.y, k) - Math.sin(this.moveT * Math.PI) * 14;
      this.hopPhase += dt * 14;
      return null;
    }
    const maxSel = this.unlockedCount() - 1;
    if (input.pressed(ACT.RIGHT) && this.sel < maxSel) { this.setSel(this.sel + 1, true); audio.sfx('menu_move'); }
    if (input.pressed(ACT.LEFT) && this.sel > 0) { this.setSel(this.sel - 1, true); audio.sfx('menu_move'); }
    if (input.anyConfirm()) { audio.sfx('confirm'); return 'enter'; }
    if (input.pressed(ACT.PAUSE)) { audio.sfx('back'); return 'back'; }
    return null;
  }
  tap(bx, by, audio) {
    const maxSel = this.unlockedCount() - 1;
    for (let i = 0; i <= maxSel; i++) {
      const n = this.nodes[i];
      if (Math.abs(bx - (n.x - this.scrollX)) < 14 && Math.abs(by - n.y) < 14) {
        if (this.sel === i) { audio.sfx('confirm'); return 'enter'; }
        this.setSel(i, true); audio.sfx('menu_move');
        return null;
      }
    }
    return null;
  }

  render(g, vw, vh) {
    // horizontal scroll so the selected node stays comfortably in view
    const target = clamp(this.nodes[this.sel].x - vw * 0.5, 0, Math.max(0, 430 - vw));
    this.scrollX = this.scrollX === undefined ? target : lerp(this.scrollX, target, 0.12);
    const sx = Math.round(this.scrollX);

    // sky
    const grd = g.createLinearGradient(0, 0, 0, vh);
    grd.addColorStop(0, '#2b3f78');
    grd.addColorStop(0.5, '#5a86c4');
    grd.addColorStop(1, '#a8d4e8');
    g.fillStyle = grd;
    g.fillRect(0, 0, vw, vh);

    // biome bands
    for (let w = 0; w < 4; w++) {
      const info = WORLD_INFO[w];
      const x0 = w * 108 - sx, x1 = x0 + 112;
      g.fillStyle = info.col2;
      g.fillRect(Math.round(x0), 84, Math.round(x1 - x0), vh - 84);
      g.fillStyle = info.col;
      for (let x = 0; x < 112; x += 2) {
        const hgt = 18 + Math.sin((x + w * 40) * 0.06) * 8 + Math.sin(x * 0.13) * 4;
        g.fillRect(Math.round(x0 + x), Math.round(96 - hgt * 0.4), 2, Math.round(hgt + 40));
      }
    }
    // drifting clouds
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 97 + this.t * 6) % (vw + 80)) - 40;
      const img = Art.decor(i & 1 ? 'cloudsmall' : 'cloudbig', 'grass', 0);
      if (img) { g.globalAlpha = 0.8; g.drawImage(img, Math.round(cx), 12 + (i % 3) * 14); g.globalAlpha = 1; }
    }

    // path
    g.strokeStyle = '#f0d8a0';
    g.lineWidth = 3;
    g.setLineDash([4, 4]);
    g.beginPath();
    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      if (i === 0) g.moveTo(n.x - sx, n.y);
      else g.lineTo(n.x - sx, n.y);
    }
    g.stroke();
    g.setLineDash([]);

    // nodes
    const unlocked = this.unlockedCount();
    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      const x = Math.round(n.x - sx), y = n.y;
      if (x < -20 || x > vw + 20) continue;
      const open = i < unlocked;
      const done = !!(SaveManager.data.completed[n.id] || {}).cleared;
      const isBoss = n.id === '4-2';

      g.fillStyle = '#160d18';
      g.beginPath(); g.arc(x, y, isBoss ? 10 : 8, 0, 6.283); g.fill();
      g.fillStyle = !open ? '#5a5468' : (done ? '#5ad07a' : (isBoss ? '#d43a2a' : '#ffd34d'));
      g.beginPath(); g.arc(x, y, isBoss ? 8 : 6, 0, 6.283); g.fill();
      if (open && !done) {
        g.fillStyle = '#fff6d0';
        g.beginPath(); g.arc(x - 2, y - 2, 2, 0, 6.283); g.fill();
      }
      if (!open) {
        Text.draw(g, 'x', x, y - 3, { color: '#2a2438', align: 'center', outline: null });
      } else if (done) {
        Text.draw(g, '★', x, y - 3, { color: '#ffffff', align: 'center', outline: '#1c5a2c' });
      }
      if (i === this.sel) {
        const b = Math.sin(this.t * 6) * 1.5;
        Text.draw(g, '▼', x, y - 20 + b, { color: '#ffffff', align: 'center', outline: '#160d18' });
      }
      Text.draw(g, n.id, x, y + 11, { color: open ? '#ffffff' : '#8a84a0', align: 'center', outline: '#160d18' });
    }

    // hero avatar
    const hop = this.moveT < 1 ? Math.abs(Math.sin(this.hopPhase)) * 3 : Math.sin(this.t * 3) * 1;
    const art = Art.hero(this.game.playerForm || 'small', this.moveT < 1 ? 'walk' : 'idle',
      (this.hopPhase | 0) & 3);
    if (art && art.c) {
      g.drawImage(art.c, Math.round(this.avatarX - sx - art.c.width / 2),
        Math.round(this.avatarY - art.c.height - 6 - hop));
    }

    // banner
    const node = this.nodes[this.sel];
    const info = WORLD_INFO[node.world - 1];
    g.fillStyle = 'rgba(12,8,20,0.78)';
    g.fillRect(0, 0, vw, 26);
    g.fillStyle = info.col;
    g.fillRect(0, 25, vw, 1);
    Text.draw(g, 'WORLD ' + node.world + '  ' + info.name, vw / 2, 5, { color: '#ffe45c', align: 'center', scale: 1 });
    const rec = SaveManager.data.completed[node.id];
    Text.draw(g, rec && rec.cleared ? 'BEST ' + rec.score : 'NEW STAGE', vw / 2, 15,
      { color: '#e8e0f0', align: 'center' });

    // footer hint
    g.fillStyle = 'rgba(12,8,20,0.72)';
    g.fillRect(0, vh - 14, vw, 14);
    Text.draw(g, 'ARROWS / TAP  SELECT      JUMP  START      ESC  TITLE', vw / 2, vh - 11,
      { color: '#b8b0c8', align: 'center' });
  }
}

/* ------------------------------------------------------------- UIManager */
class UIManager {
  constructor(game) { this.game = game; this.t = 0; }

  hud(g, lvl, vw) {
    const G = this.game;
    g.fillStyle = 'rgba(10,7,16,0.55)';
    g.fillRect(0, 0, vw, 20);

    Text.draw(g, 'SCORE', 6, 3, { color: '#b8b0c8' });
    Text.draw(g, String(G.score).padStart(6, '0'), 6, 11, { color: '#ffffff' });

    const sx = 78;
    const sparkArt = Art.item('spark', ((this.t * 10) | 0) & 7);
    if (sparkArt && sparkArt.c) g.drawImage(sparkArt.c, sx - 2, 4);
    Text.draw(g, 'x' + String(G.sparks).padStart(2, '0'), sx + 10, 7, { color: '#ffe45c' });

    Text.draw(g, 'WORLD', vw * 0.5 - 20, 3, { color: '#b8b0c8' });
    Text.draw(g, lvl ? lvl.def.id : '-', vw * 0.5 - 20, 11, { color: '#ffffff' });

    const lx = vw * 0.5 + 30;
    Text.draw(g, '♥', lx, 7, { color: '#ff5a7a' });
    Text.draw(g, 'x' + G.lives, lx + 8, 7, { color: '#ffffff' });

    if (lvl) {
      const warn = lvl.time <= 100;
      Text.draw(g, 'TIME', vw - 6, 3, { color: '#b8b0c8', align: 'right' });
      Text.draw(g, String(Math.max(0, lvl.time)), vw - 6, 11, {
        color: warn && (((this.t * 6) | 0) & 1) ? '#ff5a4a' : '#ffffff', align: 'right'
      });
    }

    // power state pip
    if (lvl) {
      const p = lvl.player;
      let label = null, col = '#ffffff';
      if (p.star > 0) { label = 'STAR ' + Math.ceil(p.star); col = '#ffe45c'; }
      else if (p.form === 'ember') { label = 'EMBER'; col = '#ff8a3d'; }
      else if (p.form === 'sky') { label = 'SKY'; col = '#a8d4f0'; }
      else if (p.form === 'big') { label = 'GROWN'; col = '#8bff8a'; }
      if (p.shield) { label = (label ? label + ' +' : '') + 'SHIELD'; col = '#8fe4ff'; }
      if (label) Text.draw(g, label, vw * 0.5, 22, { color: col, align: 'center' });
    }
  }

  bossBar(g, boss, vw) {
    if (!boss || boss.state === 'intro') return;
    const w = Math.min(180, vw - 40), x = Math.round((vw - w) / 2), y = 30;
    g.fillStyle = 'rgba(10,7,16,0.8)';
    g.fillRect(x - 2, y - 2, w + 4, 12);
    g.fillStyle = '#3a1c22';
    g.fillRect(x, y, w, 8);
    const k = clamp(boss.hp / boss.maxHp, 0, 1);
    const col = boss.hp > 8 ? '#ff8a3d' : (boss.hp > 4 ? '#ff5a2a' : '#d41a1a');
    g.fillStyle = col;
    g.fillRect(x, y, Math.round(w * k), 8);
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(x, y, Math.round(w * k), 2);
    // phase dividers
    g.fillStyle = '#160d18';
    g.fillRect(x + Math.round(w * 4 / 12), y, 1, 8);
    g.fillRect(x + Math.round(w * 8 / 12), y, 1, 8);
    Text.draw(g, 'THE CINDER WARDEN', vw / 2, y - 11, { color: '#ffd0a0', align: 'center' });
    if (boss.vulnerable) {
      const f = ((this.t * 8) | 0) & 1;
      if (f) Text.draw(g, 'STUNNED - STOMP!', vw / 2, y + 11, { color: '#ffe45c', align: 'center' });
    }
  }

  /** dark scrim used behind every overlay menu */
  scrim(g, vw, vh, a) {
    g.fillStyle = 'rgba(8,5,14,' + (a === undefined ? 0.72 : a) + ')';
    g.fillRect(0, 0, vw, vh);
  }

  panel(g, x, y, w, h, title) {
    g.fillStyle = 'rgba(20,12,30,0.94)';
    g.fillRect(x, y, w, h);
    g.strokeStyle = '#ffd34d';
    g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    g.strokeStyle = '#7a5a2a';
    g.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
    if (title) {
      g.fillStyle = 'rgba(20,12,30,0.94)';
      const tw = Text.width(title, 1) + 12;
      g.fillRect(x + (w - tw) / 2, y - 4, tw, 10);
      Text.draw(g, title, x + w / 2, y - 3, { color: '#ffe45c', align: 'center' });
    }
  }
}

/* ------------------------------------------------------------------ Game */
class Game {
  constructor(canvas) {
    this.renderer = new Renderer(canvas);
    this.input = new InputManager(canvas);
    this.audio = new AudioManager();
    this.camera = new Camera();
    this.particles = new ParticleSystem(280);
    this.ui = new UIManager(this);
    this.worldMap = new WorldMap(this);

    this.state = 'boot';
    this.stateT = 0;
    this.level = null;
    this.levelIndex = 0;
    this.score = 0;
    this.sparks = 0;
    this.lives = 3;
    this.playerForm = 'small';
    this.time = 0;
    this.fade = 1;          // 1 = fully black
    this.fadeDir = -1;
    this.pendingAction = null;

    this.quality = 1;
    this.autoQuality = true;
    this.frameTimes = new Float32Array(45);
    this.frameIdx = 0;
    this.fps = 60;
    this.qualityCooldown = 0;

    this.taps = [];
    this.bindTaps(canvas);
    this.buildMenus();

    this.titleScene = {
      t: 0, heroX: -40, heroDir: 1,
      walkers: [{ x: 140, dir: -1 }, { x: 250, dir: 1 }],
      blocks: [{ x: 90, y: 96 }, { x: 118, y: 96 }, { x: 146, y: 96 }]
    };

    const self = this;
    window.addEventListener('resize', function () { self.onResize(); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { self.onResize(); }, 120); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        self.audio.suspend();
        if (self.state === 'play') self.setState('pause');
      } else self.audio.resume();
    });
  }

  bindTaps(canvas) {
    const self = this;
    canvas.addEventListener('pointerdown', function (e) {
      const r = canvas.getBoundingClientRect();
      const dx = (e.clientX - r.left) * (canvas.width / r.width);
      const dy = (e.clientY - r.top) * (canvas.height / r.height);
      const b = self.renderer.toBuffer(dx, dy);
      self.taps.push(b);
      if (self.taps.length > 6) self.taps.shift();
    }, { passive: true });
  }

  onResize() {
    this.renderer.resize();
    this.camera.setView(this.renderer.vw, this.renderer.vh);
    if (this.level) this.camera.setBounds(this.level.map.pixW, this.level.map.pixH);
    this.layoutTouch();
  }

  layoutTouch() {
    const s = SaveManager.data.settings;
    this.input.layoutTouch(this.renderer.cv.width, this.renderer.cv.height,
      s.touchScale * this.renderer.dpr, s.touchOpacity);
  }

  /* ------------------------------------------------------------- menus */
  buildMenus() {
    const G = this;
    const S = () => SaveManager.data.settings;

    this.mainMenu = new Menu([]);
    this.refreshMainMenu();

    this.settingsMenu = new Menu([
      { label: 'MUSIC', kind: 'slider', min: 0, max: 1, step: 0.1, get: () => S().music, set: v => { S().music = v; G.audio.setMusicVolume(v); SaveManager.save(); } },
      { label: 'SOUND', kind: 'slider', min: 0, max: 1, step: 0.1, get: () => S().sfx, set: v => { S().sfx = v; G.audio.setSfxVolume(v); G.audio.sfx('coin'); SaveManager.save(); } },
      { label: 'PAD SIZE', kind: 'slider', min: 0.7, max: 1.6, step: 0.1, get: () => S().touchScale, set: v => { S().touchScale = v; G.layoutTouch(); SaveManager.save(); } },
      { label: 'PAD FADE', kind: 'slider', min: 0.15, max: 1, step: 0.05, get: () => S().touchOpacity, set: v => { S().touchOpacity = v; G.layoutTouch(); SaveManager.save(); } },
      {
        label: 'QUALITY', kind: 'choice',
        text: () => S().quality.toUpperCase(),
        cycle: d => {
          const o = ['auto', 'low', 'high'];
          let i = (o.indexOf(S().quality) + d + o.length) % o.length;
          S().quality = o[i];
          G.applyQualitySetting();
          SaveManager.save();
        }
      },
      { label: 'SHAKE', kind: 'toggle', get: () => S().screenShake, set: v => { S().screenShake = v; SaveManager.save(); } },
      { label: 'SHOW FPS', kind: 'toggle', get: () => S().showFps, set: v => { S().showFps = v; SaveManager.save(); } },
      { label: 'RESET SAVE', action: 'resetsave' },
      { label: 'BACK', action: 'back' }
    ]);

    this.pauseMenu = new Menu([
      { label: 'RESUME', action: 'resume' },
      { label: 'RESTART LEVEL', action: 'restart' },
      { label: 'SETTINGS', action: 'settings' },
      { label: 'QUIT TO MAP', action: 'quitmap' }
    ]);

    this.gameOverMenu = new Menu([
      { label: 'CONTINUE', action: 'continue' },
      { label: 'QUIT TO TITLE', action: 'title' }
    ]);

    this.confirmMenu = new Menu([
      { label: 'NO, KEEP IT', action: 'no' },
      { label: 'YES, ERASE', action: 'yes' }
    ]);
  }

  refreshMainMenu() {
    const has = SaveManager.data.hasProgress;
    const items = [{ label: 'START GAME', action: 'start' }];
    if (has) items.push({ label: 'CONTINUE', action: 'continue' });
    if (SaveManager.data.unlocked > 1) items.push({ label: 'LEVEL SELECT', action: 'levelselect' });
    items.push({ label: 'SETTINGS', action: 'settings' });
    items.push({ label: 'CONTROLS', action: 'controls' });
    this.mainMenu.setItems(items);
  }

  applyQualitySetting() {
    const q = SaveManager.data.settings.quality;
    this.autoQuality = q === 'auto';
    if (q === 'low') this.setQuality(0);
    else if (q === 'high') this.setQuality(2);
  }

  setQuality(q) {
    this.quality = clamp(q, 0, 2);
    if (this.level) this.level.quality = this.quality;
    this.particles.setBudget(this.quality === 0 ? 60 : (this.quality === 1 ? 150 : 280));
    this.audio.setLowQuality(this.quality === 0);
  }

  /* -------------------------------------------------------------- flow */
  setState(s) {
    this.state = s;
    this.stateT = 0;
    if (s === 'pause') this.audio.pauseMusic();
  }

  fadeTo(action, dur) {
    if (this.fadeDir > 0) return;      // already fading out
    this.fadeDir = 1;
    this.fadeDur = dur || 0.35;
    this.pendingAction = action;
  }

  startNewGame() {
    this.score = 0; this.sparks = 0; this.lives = 3;
    this.playerForm = 'small';
    SaveManager.data.run = { level: 0, lives: 3, score: 0, sparks: 0, form: 'small' };
    SaveManager.save();
    this.worldMap.setSel(0, false);
    this.fadeTo(() => { this.enterMap(); });
  }

  continueGame() {
    const run = SaveManager.data.run;
    if (run) {
      this.score = run.score; this.sparks = run.sparks;
      this.lives = run.lives; this.playerForm = run.form;
      this.worldMap.setSel(clamp(run.level, 0, 7), false);
    } else {
      this.worldMap.setSel(clamp(SaveManager.data.unlocked - 1, 0, 7), false);
    }
    this.fadeTo(() => { this.enterMap(); });
  }

  enterMap() {
    this.level = null;
    this.setState('map');
    this.audio.playMusic('map');
  }

  startLevel(index) {
    index = clamp(index, 0, LEVELS.length - 1);
    this.levelIndex = index;
    const def = LEVELS[index];
    this.level = new Level(this, def, index);
    this.level.quality = this.quality;
    this.camera.setView(this.renderer.vw, this.renderer.vh);
    this.camera.setBounds(this.level.map.pixW, this.level.map.pixH);
    // carry the player's form between levels
    if (this.playerForm !== 'small') this.level.player.setForm(this.playerForm, true);
    this.level.camera.snapTo(this.level.player.x - this.camera.vw * 0.5,
      this.level.player.y - this.camera.vh * 0.55);
    this.setState('play');
    this.audio.playMusic(def.music || 'overworld');
    SaveManager.data.run = {
      level: index, lives: this.lives, score: this.score,
      sparks: this.sparks, form: this.playerForm
    };
    SaveManager.save();
  }

  onLevelFailed() {
    this.lives--;
    this.playerForm = 'small';
    if (this.lives <= 0) {
      this.setState('gameover');
      this.audio.duckForJingle('gameover');
      SaveManager.data.run = null;
      SaveManager.save();
    } else {
      this.fadeTo(() => {
        this.level.respawn();
        this.setState('play');
      }, 0.3);
    }
  }

  onLevelCleared(lvl) {
    this.playerForm = lvl.player.form;
    this.clearInfo = {
      timeLeft: lvl.time,
      sparks: lvl.sparksThisLevel,
      score: lvl.scoreThisLevel,
      tally: 0,
      done: false
    };
    SaveManager.recordClear(lvl.def.id, this.score, lvl.sparksThisLevel, lvl.time, lvl.index);
    SaveManager.data.run = {
      level: Math.min(lvl.index + 1, LEVELS.length - 1),
      lives: this.lives, score: this.score, sparks: this.sparks, form: this.playerForm
    };
    SaveManager.save();
    this.refreshMainMenu();
    this.setState('levelclear');
    this.audio.duckForJingle('levelclear');
  }

  /* ------------------------------------------------------------ update */
  update(dt) {
    this.time += dt;
    this.ui.t = this.time;
    this.input.update(dt);

    /* fade transitions */
    if (this.fadeDir > 0) {
      this.fade = Math.min(1, this.fade + dt / (this.fadeDur || 0.35));
      if (this.fade >= 1) {
        this.fadeDir = -1;
        const a = this.pendingAction;
        this.pendingAction = null;
        if (a) a();
      }
    } else if (this.fade > 0) {
      this.fade = Math.max(0, this.fade - dt / 0.3);
    }

    const tap = this.taps.length ? this.taps[this.taps.length - 1] : null;

    switch (this.state) {
      case 'boot': this.updateBoot(dt); break;
      case 'title': this.updateTitle(dt, tap); break;
      case 'menu': this.updateMenu(dt, tap); break;
      case 'settings': this.updateSettings(dt, tap); break;
      case 'controls': this.updateControls(dt, tap); break;
      case 'confirmreset': this.updateConfirm(dt, tap); break;
      case 'levelselect': this.updateLevelSelect(dt, tap); break;
      case 'map': this.updateMap(dt, tap); break;
      case 'play': this.updatePlay(dt); break;
      case 'pause': this.updatePause(dt, tap); break;
      case 'levelclear': this.updateLevelClear(dt); break;
      case 'gameover': this.updateGameOver(dt, tap); break;
      case 'victory': this.updateVictory(dt, tap); break;
    }
    this.taps.length = 0;
    this.trackPerf(dt);
  }

  updateBoot(dt) {
    if (this.stateT === 0) { /* first frame */ }
    this.stateT += dt;
    if (this.stateT > 0.35) {
      this.setState('title');
      this.fade = 1; this.fadeDir = -1;
    }
  }

  updateTitle(dt, tap) {
    this.stateT += dt;
    const s = this.titleScene;
    s.t += dt;
    s.heroX += 62 * dt * s.heroDir;
    if (s.heroX > this.renderer.vw + 30) { s.heroX = -30; }
    s.walkers.forEach(w => {
      w.x += 22 * dt * w.dir;
      if (w.x < 20 || w.x > this.renderer.vw - 20) w.dir *= -1;
    });
    if (this.input.anyPressed || tap) {
      this.input.anyPressed = false;
      if (this.stateT > 0.4) {
        this.audio.unlock();
        this.audio.setMusicVolume(SaveManager.data.settings.music);
        this.audio.setSfxVolume(SaveManager.data.settings.sfx);
        this.audio.sfx('confirm');
        this.refreshMainMenu();
        this.setState('menu');
        this.audio.playMusic('title');
      }
    }
  }

  updateMenu(dt, tap) {
    this.stateT += dt;
    let a = this.mainMenu.update(dt, this.input, this.audio);
    if (tap) a = this.mainMenu.tap(tap.x, tap.y, this.audio) || a;
    if (this.input.pressed(ACT.PAUSE)) { this.setState('title'); this.audio.sfx('back'); return; }
    if (!a) return;
    switch (a) {
      case 'start': this.startNewGame(); break;
      case 'continue': this.continueGame(); break;
      case 'levelselect': this.setState('levelselect'); break;
      case 'settings': this.settingsFrom = 'menu'; this.setState('settings'); break;
      case 'controls': this.setState('controls'); break;
    }
  }

  updateSettings(dt, tap) {
    this.stateT += dt;
    let a = this.settingsMenu.update(dt, this.input, this.audio);
    if (tap) a = this.settingsMenu.tap(tap.x, tap.y, this.audio) || a;
    if (this.input.pressed(ACT.PAUSE)) a = 'back';
    if (a === 'back') {
      this.audio.sfx('back');
      this.setState(this.settingsFrom === 'pause' ? 'pause' : 'menu');
    } else if (a === 'resetsave') {
      this.confirmMenu.sel = 0;
      this.setState('confirmreset');
    }
  }

  updateConfirm(dt, tap) {
    this.stateT += dt;
    let a = this.confirmMenu.update(dt, this.input, this.audio);
    if (tap) a = this.confirmMenu.tap(tap.x, tap.y, this.audio) || a;
    if (this.input.pressed(ACT.PAUSE)) a = 'no';
    if (a === 'yes') {
      SaveManager.reset();
      this.audio.setMusicVolume(SaveManager.data.settings.music);
      this.audio.setSfxVolume(SaveManager.data.settings.sfx);
      this.score = 0; this.sparks = 0; this.lives = 3; this.playerForm = 'small';
      this.worldMap.setSel(0, false);
      this.refreshMainMenu();
      this.layoutTouch();
      this.audio.sfx('powerdown');
      this.setState('menu');
    } else if (a === 'no') {
      this.audio.sfx('back');
      this.setState('settings');
    }
  }

  updateControls(dt, tap) {
    this.stateT += dt;
    if (this.input.anyConfirm() || this.input.pressed(ACT.PAUSE) || (tap && this.stateT > 0.25)) {
      this.audio.sfx('back');
      this.setState('menu');
    }
  }

  updateLevelSelect(dt, tap) {
    this.stateT += dt;
    const max = clamp(SaveManager.data.unlocked, 1, LEVELS.length) - 1;
    if (this.input.pressed(ACT.RIGHT) || this.input.pressed(ACT.DOWN)) {
      this.lsSel = clamp((this.lsSel || 0) + 1, 0, max); this.audio.sfx('menu_move');
    }
    if (this.input.pressed(ACT.LEFT) || this.input.pressed(ACT.UP)) {
      this.lsSel = clamp((this.lsSel || 0) - 1, 0, max); this.audio.sfx('menu_move');
    }
    if (tap) {
      const vw = this.renderer.vw;
      for (let i = 0; i <= max; i++) {
        const r = this.lsRect(i, vw);
        if (tap.x >= r.x && tap.x <= r.x + r.w && tap.y >= r.y && tap.y <= r.y + r.h) {
          if (this.lsSel === i) { this.audio.sfx('confirm'); this.selectLevel(i); return; }
          this.lsSel = i; this.audio.sfx('menu_move');
        }
      }
    }
    if (this.input.anyConfirm()) { this.audio.sfx('confirm'); this.selectLevel(this.lsSel || 0); }
    if (this.input.pressed(ACT.PAUSE)) { this.audio.sfx('back'); this.setState('menu'); }
  }

  lsRect(i, vw) {
    const cols = 2, cw = 116, ch = 20;
    const x0 = (vw - cols * cw) / 2;
    return { x: x0 + (i % cols) * cw, y: 52 + ((i / cols) | 0) * ch, w: cw - 6, h: ch - 4 };
  }

  selectLevel(i) {
    this.worldMap.setSel(i, false);
    this.lives = Math.max(this.lives, 3);
    this.fadeTo(() => this.startLevel(i));
  }

  updateMap(dt, tap) {
    this.stateT += dt;
    let a = this.worldMap.update(dt, this.input, this.audio);
    if (tap) a = this.worldMap.tap(tap.x, tap.y, this.audio) || a;
    if (a === 'enter') this.fadeTo(() => this.startLevel(this.worldMap.sel));
    else if (a === 'back') this.fadeTo(() => { this.refreshMainMenu(); this.setState('menu'); this.audio.playMusic('title'); });
  }

  updatePlay(dt) {
    const lvl = this.level;
    if (!lvl) { this.enterMap(); return; }
    if (this.input.pressed(ACT.PAUSE)) {
      this.pauseMenu.sel = 0;
      this.setState('pause');
      this.audio.sfx('pause');
      return;
    }
    lvl.update(dt, this.input);
    lvl.checkCheckpoint();
    this.playerForm = lvl.player.form;

    // camera follows unless a cinematic owns it
    if (lvl.state === 'play' || lvl.state === 'bossdead') {
      this.camera.follow(lvl.player, dt, {});
    } else if (lvl.state === 'poleslide' || lvl.state === 'clear') {
      this.camera.follow(lvl.player, dt, { lookAhead: 10, deadzone: 40 });
    } else {
      this.camera.follow(lvl.player, dt, {});
    }

    if (lvl.state === 'clear' && lvl.index === LEVELS.length - 1) {
      // final level cleared -> victory
    }
  }

  updatePause(dt, tap) {
    this.stateT += dt;
    let a = this.pauseMenu.update(dt, this.input, this.audio);
    if (tap) a = this.pauseMenu.tap(tap.x, tap.y, this.audio) || a;
    if (this.input.pressed(ACT.PAUSE)) a = 'resume';
    switch (a) {
      case 'resume':
        this.audio.sfx('pause'); this.audio.resumeMusic(); this.setState('play'); break;
      case 'restart':
        this.audio.sfx('confirm');
        this.fadeTo(() => { this.startLevel(this.levelIndex); }); break;
      case 'settings':
        this.settingsFrom = 'pause'; this.setState('settings'); break;
      case 'quitmap':
        this.audio.sfx('back');
        this.fadeTo(() => { this.enterMap(); }); break;
    }
  }

  updateLevelClear(dt) {
    this.stateT += dt;
    const ci = this.clearInfo;
    if (!ci) { this.enterMap(); return; }
    if (this.level) {
      this.level.particles.update(dt);
      this.level.player.update(dt, this.input, this.level);
    }
    // tally the time bonus, 1 unit at a time, with a tick sound
    if (!ci.done) {
      if (this.stateT > 0.9) {
        const step = Math.max(1, Math.ceil(ci.timeLeft / 40));
        if (ci.timeLeft > 0) {
          const take = Math.min(step, ci.timeLeft);
          ci.timeLeft -= take;
          this.score += take * 50;
          ci.tally += take * 50;
          if ((((this.stateT * 60) | 0) & 1) === 0) this.audio.sfx('coin');
        } else {
          ci.done = true;
          SaveManager.data.bestScore = Math.max(SaveManager.data.bestScore, this.score);
          SaveManager.save();
        }
      }
    } else if (this.stateT > 2.2 && (this.input.anyConfirm() || this.stateT > 4.5)) {
      const last = this.levelIndex >= LEVELS.length - 1;
      this.fadeTo(() => {
        if (last) { this.setState('victory'); this.audio.duckForJingle('bossdead'); }
        else {
          this.worldMap.setSel(this.levelIndex, false);
          this.enterMap();
          this.worldMap.setSel(Math.min(this.levelIndex + 1, 7), true);
        }
      });
    }
  }

  updateGameOver(dt, tap) {
    this.stateT += dt;
    if (this.stateT < 1.2) return;
    let a = this.gameOverMenu.update(dt, this.input, this.audio);
    if (tap) a = this.gameOverMenu.tap(tap.x, tap.y, this.audio) || a;
    if (a === 'continue') {
      this.lives = 3;
      this.score = 0;
      this.sparks = 0;
      this.playerForm = 'small';
      this.fadeTo(() => this.startLevel(this.levelIndex));
    } else if (a === 'title') {
      this.fadeTo(() => { this.refreshMainMenu(); this.setState('menu'); this.audio.playMusic('title'); });
    }
  }

  updateVictory(dt, tap) {
    this.stateT += dt;
    if (this.stateT > 2 && (this.input.anyConfirm() || tap)) {
      this.fadeTo(() => { this.refreshMainMenu(); this.setState('menu'); this.audio.playMusic('title'); });
    }
  }

  /* ------------------------------------------------------- performance */
  trackPerf(dt) {
    this.frameTimes[this.frameIdx] = dt;
    this.frameIdx = (this.frameIdx + 1) % this.frameTimes.length;
    let sum = 0;
    for (let i = 0; i < this.frameTimes.length; i++) sum += this.frameTimes[i];
    const avg = sum / this.frameTimes.length;
    this.fps = avg > 0 ? 1 / avg : 60;
    if (this.qualityCooldown > 0) { this.qualityCooldown -= dt; return; }
    if (!this.autoQuality) return;
    if (this.fps < 45 && this.quality > 0) {
      this.setQuality(this.quality - 1);
      this.qualityCooldown = 3;
    } else if (this.fps > 57 && this.quality < 2) {
      this.setQuality(this.quality + 1);
      this.qualityCooldown = 6;
    }
  }

  /* ---------------------------------------------------------- rendering */
  render(alpha) {
    const g = this.renderer.bx;
    const vw = this.renderer.vw, vh = this.renderer.vh;
    g.imageSmoothingEnabled = false;

    switch (this.state) {
      case 'boot': this.renderBoot(g, vw, vh); break;
      case 'title': this.renderTitle(g, vw, vh); break;
      case 'menu': this.renderTitle(g, vw, vh, true); this.renderMainMenu(g, vw, vh); break;
      case 'settings': this.renderBehind(g, vw, vh, alpha); this.renderSettings(g, vw, vh); break;
      case 'confirmreset': this.renderBehind(g, vw, vh, alpha); this.renderConfirm(g, vw, vh); break;
      case 'controls': this.renderTitle(g, vw, vh, true); this.renderControls(g, vw, vh); break;
      case 'levelselect': this.renderTitle(g, vw, vh, true); this.renderLevelSelect(g, vw, vh); break;
      case 'map': this.worldMap.render(g, vw, vh); break;
      case 'play': this.renderPlay(g, vw, vh, alpha); break;
      case 'pause': this.renderPlay(g, vw, vh, alpha); this.renderPause(g, vw, vh); break;
      case 'levelclear': this.renderPlay(g, vw, vh, alpha); this.renderLevelClear(g, vw, vh); break;
      case 'gameover': this.renderPlay(g, vw, vh, alpha); this.renderGameOver(g, vw, vh); break;
      case 'victory': this.renderVictory(g, vw, vh); break;
    }

    if (this.fade > 0) {
      g.globalAlpha = this.fade;
      g.fillStyle = '#000000';
      g.fillRect(0, 0, vw, vh);
      g.globalAlpha = 1;
    }
    if (SaveManager.data.settings.showFps) {
      Text.draw(g, Math.round(this.fps) + 'F Q' + this.quality + ' P' + this.particles.count, vw - 4, vh - 9,
        { color: '#8bff8a', align: 'right' });
    }

    this.renderer.present();
    if (this.state === 'play' && this.input.touchEnabled) this.renderTouch();
  }

  renderBehind(g, vw, vh, alpha) {
    if (this.settingsFrom === 'pause' && this.level) this.renderPlay(g, vw, vh, alpha);
    else this.renderTitle(g, vw, vh, true);
  }

  renderBoot(g, vw, vh) {
    g.fillStyle = '#0a0710';
    g.fillRect(0, 0, vw, vh);
    Text.draw(g, 'LOADING', vw / 2, vh / 2 - 4, { color: '#ffe45c', align: 'center', scale: 1 });
  }

  /* ------------------------------------------------------- title screen */
  renderTitle(g, vw, vh, dim) {
    const s = this.titleScene;
    const t = s.t;
    Art.drawBG(g, 'grass', t * 12, 0, t, vw, vh, this.quality);

    // ground strip
    const groundY = vh - 32;
    const gt = Art.tile(T.GROUND, 'grass', 0);
    for (let x = -((t * 12) % 16); x < vw + 16; x += 16) {
      for (let y = groundY; y < vh; y += 16) if (gt) g.drawImage(gt, Math.round(x), y);
    }

    // floating reward blocks
    const qb = Art.tile(T.QCOIN, 'grass', ((t * 5) | 0) & 3);
    s.blocks.forEach((b, i) => {
      const yy = b.y + Math.sin(t * 2 + i) * 3;
      if (qb) g.drawImage(qb, Math.round(b.x - (t * 12) % 320), Math.round(yy));
    });

    // enemies patrolling
    s.walkers.forEach(w => {
      const art = Art.enemy('walker', 'walk', ((t * 6) | 0) & 1);
      if (art && art.c) {
        g.save();
        if (w.dir > 0) { g.translate(Math.round(w.x) + 7, groundY - 16); g.scale(-1, 1); g.drawImage(art.c, -7 + art.ox, art.oy); }
        else g.drawImage(art.c, Math.round(w.x) + art.ox, groundY - 16 + art.oy);
        g.restore();
      }
    });

    // hero running through the scene
    const hart = Art.hero('big', 'run', ((t * 11) | 0) & 3);
    if (hart && hart.c) {
      g.drawImage(hart.c, Math.round(s.heroX) + hart.ox, groundY - 26 + hart.oy);
      if (((t * 20) | 0) % 3 === 0) {
        this.particles.dust(s.heroX + 6, groundY, 1, 1);
      }
    }
    this.particles.update(1 / 60);
    this.particles.render(g, 0, 0, 1);

    if (dim) {
      g.fillStyle = 'rgba(8,5,14,0.55)';
      g.fillRect(0, 0, vw, vh);
      return;
    }

    Art.logo(g, vw / 2, 20, t);
    if (((t * 2) | 0) & 1) {
      Text.draw(g, 'PRESS START', vw / 2, vh - 92, { color: '#ffffff', align: 'center', scale: 2 });
    }
    Text.draw(g, 'TAP OR PRESS ANY KEY', vw / 2, vh - 72, { color: '#c8c0d8', align: 'center' });
    g.fillStyle = 'rgba(10,7,16,0.55)';
    g.fillRect(0, vh - 12, vw, 12);
    Text.draw(g, 'AN ORIGINAL PIXEL PLATFORMER', vw / 2, vh - 9, { color: '#c0b8d0', align: 'center' });
    if (SaveManager.data.bestScore > 0) {
      Text.draw(g, 'BEST ' + SaveManager.data.bestScore, 6, 6, { color: '#ffe45c' });
    }
  }

  renderMainMenu(g, vw, vh) {
    Art.logo(g, vw / 2, 12, this.titleScene.t);
    const n = this.mainMenu.items.length;
    const y = vh / 2 - (n * 16) / 2 + 14;
    this.ui.panel(g, vw / 2 - 76, y - 12, 152, n * 16 + 18);
    this.mainMenu.render(g, vw / 2, y, { center: true, lineHeight: 16 });
  }

  renderSettings(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.78);
    const n = this.settingsMenu.items.length;
    const h = n * 14 + 24;
    const y = Math.max(24, (vh - h) / 2);
    this.ui.panel(g, 24, y, vw - 48, h, 'SETTINGS');
    this.settingsMenu.render(g, 44, y + 14, { lineHeight: 14 });
  }

  renderConfirm(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.85);
    this.ui.panel(g, vw / 2 - 84, vh / 2 - 34, 168, 68, 'ARE YOU SURE?');
    Text.draw(g, 'THIS ERASES ALL PROGRESS,', vw / 2, vh / 2 - 20, { color: '#e8e0f0', align: 'center' });
    Text.draw(g, 'RECORDS AND SETTINGS.', vw / 2, vh / 2 - 10, { color: '#e8e0f0', align: 'center' });
    this.confirmMenu.render(g, vw / 2, vh / 2 + 4, { center: true, lineHeight: 14 });
  }

  renderControls(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.8);
    this.ui.panel(g, 20, 18, vw - 40, vh - 44, 'CONTROLS');
    const rows = [
      ['MOVE', 'ARROWS / WASD'],
      ['JUMP', 'SPACE / Z  (HOLD = HIGHER)'],
      ['RUN + THROW', 'SHIFT / X'],
      ['CROUCH / TUNNEL', 'DOWN'],
      ['CLIMB', 'UP ON VINES'],
      ['PAUSE', 'P / ESC'],
      ['', ''],
      ['TOUCH', 'ON-SCREEN PAD, MULTI-TOUCH'],
      ['TIP', 'HOLD JUMP TO GLIDE AS SKY PIP'],
      ['TIP', 'STOMP A SHELL, THEN KICK IT']
    ];
    let y = 32;
    rows.forEach(r => {
      if (r[0]) {
        Text.draw(g, r[0], 30, y, { color: '#ffe45c' });
        Text.draw(g, r[1], 112, y, { color: '#e8e0f0' });
      }
      y += 12;
    });
    Text.draw(g, 'PRESS JUMP TO GO BACK', vw / 2, vh - 22, { color: '#b8b0c8', align: 'center' });
  }

  renderLevelSelect(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.8);
    this.ui.panel(g, 16, 26, vw - 32, vh - 52, 'LEVEL SELECT');
    const max = clamp(SaveManager.data.unlocked, 1, LEVELS.length);
    for (let i = 0; i < LEVELS.length; i++) {
      const r = this.lsRect(i, vw);
      const open = i < max;
      const rec = SaveManager.data.completed[LEVELS[i].id];
      const sel = (this.lsSel || 0) === i;
      g.fillStyle = sel ? 'rgba(255,212,77,0.22)' : 'rgba(0,0,0,0.25)';
      g.fillRect(r.x, r.y, r.w, r.h);
      if (sel) { g.strokeStyle = '#ffe45c'; g.lineWidth = 1; g.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1); }
      const col = !open ? '#6a6480' : (sel ? '#ffe45c' : '#e8e0f0');
      Text.draw(g, LEVELS[i].id + ' ' + LEVELS[i].name.slice(0, 13), r.x + 5, r.y + 3, { color: col });
      if (!open) Text.draw(g, 'LOCKED', r.x + 5, r.y + 11, { color: '#6a6480' });
      else if (rec && rec.cleared) Text.draw(g, '★ ' + rec.score, r.x + 5, r.y + 11, { color: '#8bff8a' });
      else Text.draw(g, 'READY', r.x + 5, r.y + 11, { color: '#b8b0c8' });
    }
    Text.draw(g, 'ESC BACK', vw / 2, vh - 22, { color: '#b8b0c8', align: 'center' });
  }

  renderPlay(g, vw, vh, alpha) {
    if (!this.level) { g.fillStyle = '#000'; g.fillRect(0, 0, vw, vh); return; }
    this.level.render(g, alpha, this.time);
    this.ui.hud(g, this.level, vw);
    if (this.level.boss && this.level.boss.active && !this.level.boss.defeated) {
      this.ui.bossBar(g, this.level.boss, vw);
    }
    if (this.level.state === 'dying') {
      Text.draw(g, 'OUCH!', vw / 2, vh / 2 - 20, { color: '#ff8a7a', align: 'center', scale: 2 });
    }
  }

  renderPause(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.7);
    const n = this.pauseMenu.items.length;
    this.ui.panel(g, vw / 2 - 74, vh / 2 - 42, 148, n * 15 + 26, 'PAUSED');
    this.pauseMenu.render(g, vw / 2, vh / 2 - 28, { center: true, lineHeight: 15 });
    Text.draw(g, 'LV ' + this.level.def.id + '  ' + this.level.def.name, vw / 2, vh / 2 + 34,
      { color: '#b8b0c8', align: 'center' });
  }

  renderLevelClear(g, vw, vh) {
    const ci = this.clearInfo;
    if (!ci) return;
    this.ui.scrim(g, vw, vh, 0.6);
    this.ui.panel(g, vw / 2 - 82, 44, 164, 84, 'STAGE CLEAR');
    Text.draw(g, this.level.def.name.toUpperCase(), vw / 2, 58, { color: '#ffe45c', align: 'center' });
    Text.draw(g, 'TIME LEFT', vw / 2 - 66, 74, { color: '#e8e0f0' });
    Text.draw(g, String(ci.timeLeft), vw / 2 + 66, 74, { color: '#ffffff', align: 'right' });
    Text.draw(g, 'x 50', vw / 2 - 66, 86, { color: '#b8b0c8' });
    Text.draw(g, '+' + ci.tally, vw / 2 + 66, 86, { color: '#8bff8a', align: 'right' });
    Text.draw(g, 'SPARKS', vw / 2 - 66, 98, { color: '#e8e0f0' });
    Text.draw(g, String(ci.sparks), vw / 2 + 66, 98, { color: '#ffe45c', align: 'right' });
    Text.draw(g, 'SCORE', vw / 2 - 66, 112, { color: '#e8e0f0' });
    Text.draw(g, String(this.score), vw / 2 + 66, 112, { color: '#ffffff', align: 'right' });
    if (ci.done && (((this.time * 2) | 0) & 1)) {
      Text.draw(g, 'PRESS JUMP', vw / 2, 134, { color: '#ffffff', align: 'center' });
    }
  }

  renderGameOver(g, vw, vh) {
    this.ui.scrim(g, vw, vh, 0.82);
    Text.draw(g, 'GAME OVER', vw / 2, vh / 2 - 40, { color: '#ff5a4a', align: 'center', scale: 2 });
    Text.draw(g, 'SCORE ' + this.score, vw / 2, vh / 2 - 14, { color: '#ffffff', align: 'center' });
    if (this.stateT > 1.2) {
      this.gameOverMenu.render(g, vw / 2, vh / 2 + 6, { center: true, lineHeight: 15 });
    }
  }

  renderVictory(g, vw, vh) {
    const t = this.stateT;
    Art.drawBG(g, 'sunset', t * 8, 0, t, vw, vh, this.quality);
    const groundY = vh - 30;
    const gt = Art.tile(T.GROUND, 'sunset', 0);
    for (let x = 0; x < vw + 16; x += 16) for (let y = groundY; y < vh; y += 16) if (gt) g.drawImage(gt, x, y);

    // castle silhouette + celebrating hero
    const cst = Art.decor('castle', 'sunset', 0);
    if (cst) g.drawImage(cst, Math.round(vw * 0.5 - 32), groundY - 64);
    const hart = Art.hero(this.playerForm, 'victory', ((t * 4) | 0) & 1);
    if (hart && hart.c) g.drawImage(hart.c, Math.round(vw * 0.5 - 40) + hart.ox, groundY - 26 + hart.oy);

    if (Math.random() < 0.4) {
      this.particles.spawn(P_KIND.SPARK, rrange(0, vw), rrange(0, vh * 0.6), {
        vx: rrange(-20, 20), vy: rrange(-30, -8), life: rrange(0.6, 1.2), size: 2,
        col: '#ffe45c', col2: '#ff8a3d', grav: 40
      });
    }
    this.particles.update(1 / 60);
    this.particles.render(g, 0, 0, 1);

    this.ui.scrim(g, vw, vh, 0.35);
    Text.draw(g, 'YOU SAVED THE VALLEY!', vw / 2, 30, { color: '#ffe45c', align: 'center', scale: 2 });
    Text.draw(g, 'THE CINDER WARDEN IS NO MORE.', vw / 2, 54, { color: '#ffffff', align: 'center' });
    Text.draw(g, 'FINAL SCORE  ' + this.score, vw / 2, 70, { color: '#ffffff', align: 'center' });
    Text.draw(g, 'THANKS FOR PLAYING', vw / 2, vh - 40, { color: '#e8e0f0', align: 'center' });
    if (t > 2 && (((t * 2) | 0) & 1)) {
      Text.draw(g, 'PRESS JUMP', vw / 2, vh - 24, { color: '#ffe45c', align: 'center' });
    }
  }

  /* ---------------------------------------------- on-screen touch pad */
  renderTouch() {
    const c = this.renderer.ctx;
    const btns = this.input.buttons;
    const base = SaveManager.data.settings.touchOpacity;
    c.save();
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      const held = this.input.touchHeld[b.act];
      const a = base * (held ? 1.35 : 1) * (0.55 + b.flash * 0.45);
      c.globalAlpha = clamp(a, 0, 1);
      c.beginPath();
      c.arc(b.x, b.y, b.r, 0, 6.283);
      c.fillStyle = held ? 'rgba(255,212,77,0.55)' : 'rgba(20,14,30,0.45)';
      c.fill();
      c.lineWidth = Math.max(1.5, b.r * 0.06);
      c.strokeStyle = held ? 'rgba(255,240,190,0.95)' : 'rgba(230,225,240,0.6)';
      c.stroke();
      c.globalAlpha = clamp(a * 1.5, 0, 1);
      c.fillStyle = held ? '#2a1c10' : '#f2eefa';
      c.font = 'bold ' + Math.round(b.r * (b.label.length > 1 ? 0.6 : 0.95)) + 'px system-ui, sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(b.label, b.x, b.y + b.r * 0.04);
    }
    c.restore();
  }
}

/* --------------------------------------------------------------- bootstrap */
(function main() {
  const canvas = document.getElementById('game');
  const loading = document.getElementById('loading');

  function fail(msg) {
    if (loading) loading.textContent = msg;
  }
  if (!canvas || !canvas.getContext) { fail('Canvas is not supported in this browser.'); return; }

  SaveManager.load();

  let game;
  try {
    Art.init();
  } catch (e) {
    fail('Could not build graphics: ' + e.message);
    return;
  }

  try {
    game = new Game(canvas);
  } catch (e) {
    fail('Could not start: ' + e.message);
    return;
  }

  game.audio.setMusicVolume(SaveManager.data.settings.music);
  game.audio.setSfxVolume(SaveManager.data.settings.sfx);
  game.applyQualitySetting();
  game.onResize();
  if (loading) loading.style.display = 'none';

  /* ---- fixed-timestep loop with render interpolation ---- */
  const STEP = 1 / 60;
  const MAX_STEPS = 5;
  let acc = 0;
  let last = performance.now();
  let rafId = 0;

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    // a long stall (tab switch, GC) must not fast-forward the simulation
    if (dt > 0.25) dt = STEP;
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < MAX_STEPS) {
      game.update(STEP);
      acc -= STEP;
      steps++;
    }
    if (steps === MAX_STEPS) acc = 0;      // give up on the backlog
    game.render(clamp(acc / STEP, 0, 1));
  }
  rafId = requestAnimationFrame(frame);

  // debug handle: useful in the console, and what the test harness drives
  window.EMBERLEAP = {
    version: '1.0',
    game: game,
    levels: LEVELS,
    Level: Level,
    resetSave: function () { SaveManager.reset(); location.reload(); },
    goto: function (i) { game.fade = 0; game.fadeDir = -1; game.startLevel(i | 0); },
    stop: function () { cancelAnimationFrame(rafId); }
  };
})();

</script>
