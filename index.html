<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceHub - Explore the Universe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h1 {
            font-size: 3.5em;
            background: linear-gradient(45deg, #00d4ff, #7c3aed, #ff006e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .tagline {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        nav button {
            padding: 10px 20px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active {
            background: #00d4ff;
            color: #0f0c29;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* Cards */
        .content-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideUp 0.6s ease-out both;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            transform: translateY(-10px);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .card p {
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
        }

        .card-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
        }

        .card.expanded .card-details {
            display: block;
            animation: expandDown 0.3s ease-out;
        }

        @keyframes expandDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Interactive elements */
        .interactive-box {
            background: rgba(124, 58, 237, 0.1);
            border: 2px solid #7c3aed;
            border-radius: 15px;
            padding: 30px;
            margin: 40px 0;
            text-align: center;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        .counter {
            display: inline-block;
            font-size: 2em;
            font-weight: bold;
            color: #7c3aed;
            margin: 10px 20px;
            min-width: 100px;
        }

        button.action-btn {
            background: linear-gradient(45deg, #7c3aed, #ff006e);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px 5px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }

        button.action-btn:active {
            transform: scale(0.95);
        }

        /* Info section */
        .info-section {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #00d4ff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            animation: fadeIn 1s ease-out;
        }

        .info-section h4 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            margin-top: 60px;
            color: rgba(255, 255, 255, 0.6);
            animation: fadeIn 1s ease-out 1s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .content-area {
                grid-template-columns: 1fr;
            }

            header {
                padding: 30px 20px;
            }

            nav {
                gap: 10px;
            }

            nav button {
                padding: 8px 15px;
                font-size: 0.9em;
            }
        }

        .pulse {
            animation: pulse 0.6s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <header>
            <h1>🌌 ScienceHub</h1>
            <p class="tagline">Explore the wonders of science and the universe</p>
        </header>

        <nav>
            <button class="nav-btn active" data-category="all">All Topics</button>
            <button class="nav-btn" data-category="space">Space</button>
            <button class="nav-btn" data-category="physics">Physics</button>
            <button class="nav-btn" data-category="biology">Biology</button>
        </nav>

        <div class="content-area" id="contentArea">
            <!-- Cards will be populated by JavaScript -->
        </div>

        <div class="interactive-box">
            <h2>🚀 Science Facts Counter</h2>
            <p>You've discovered <span class="counter" id="factCounter">0</span> amazing facts!</p>
            <button class="action-btn" onclick="incrementFacts()">Learn More Facts</button>
            <button class="action-btn" onclick="resetCounter()">Reset Counter</button>
        </div>

        <div class="info-section">
            <h4>💡 Did You Know?</h4>
            <p id="randomFact">Click "Learn More Facts" to discover amazing science facts!</p>
        </div>

        <footer>
            <p>✨ Explore. Learn. Discover. ✨</p>
            <p>ScienceHub © 2024 - Bringing Science to Everyone</p>
        </footer>
    </div>

    <script>
        // Science content database
        const scienceContent = [
            {
                title: "The Big Bang",
                category: "space",
                icon: "🌌",
                description: "The cosmic event that started the universe",
                details: "The Big Bang occurred approximately 13.8 billion years ago and is the leading explanation for how the universe began."
            },
            {
                title: "Black Holes",
                category: "space",
                icon: "🕳️",
                description: "Regions of spacetime with extreme gravity",
                details: "Black holes are formed when massive stars collapse and their gravity is so strong that nothing, not even light, can escape."
            },
            {
                title: "Quantum Mechanics",
                category: "physics",
                icon: "⚛️",
                description: "The physics of the subatomic world",
                details: "Quantum mechanics describes how particles behave at microscopic scales, often in ways that defy intuition."
            },
            {
                title: "DNA Structure",
                category: "biology",
                icon: "🧬",
                description: "The blueprint of life itself",
                details: "DNA carries the genetic instructions for life. Its double helix structure was discovered by Watson and Crick."
            },
            {
                title: "Evolution",
                category: "biology",
                icon: "🦎",
                description: "How life adapts and changes over time",
                details: "Evolution is the process by which organisms change and adapt over generations through natural selection."
            },
            {
                title: "Relativity",
                category: "physics",
                icon: "🌉",
                description: "Space, time, and gravity redefined",
                details: "Einstein's theory of relativity showed that space and time are interconnected and relative to the observer."
            }
        ];

        const facts = [
            "Light takes 8 minutes to reach Earth from the Sun! ☀️",
            "A single bolt of lightning is hotter than the surface of the Sun! ⚡",
            "Honey never spoils - archaeologists have found pots of honey in Egyptian tombs that are over 3000 years old! 🍯",
            "The human brain uses about 20% of the body's energy! 🧠",
            "There are more stars in the universe than grains of sand on Earth! ⭐",
            "A day on Venus is longer than its year! 🪐",
            "Octopuses have three hearts! 🐙",
            "Diamonds rain on Jupiter and Saturn! 💎",
            "The Mariana Trench is deeper than Mount Everest is tall! 🏔️",
            "Your body is made of stardust! 💫"
        ];

        let currentFactIndex = 0;
        let factCounter = 0;

        // Generate random stars
        function generateStars() {
            const starsContainer = document.getElementById('starsContainer');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Render cards
        function renderCards(category = 'all') {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            const filtered = category === 'all'
                ? scienceContent
                : scienceContent.filter(item => item.category === category);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <div class="card-details">
                        <p>${item.details}</p>
                    </div>
                `;
                card.addEventListener('click', () => {
                    card.classList.toggle('expanded');
                });
                contentArea.appendChild(card);
            });
        }

        // Counter functions
        function incrementFacts() {
            factCounter++;
            document.getElementById('factCounter').textContent = factCounter;
            document.getElementById('factCounter').classList.add('pulse');
            setTimeout(() => {
                document.getElementById('factCounter').classList.remove('pulse');
            }, 600);

            currentFactIndex = (currentFactIndex + 1) % facts.length;
            document.getElementById('randomFact').textContent = facts[currentFactIndex];
        }

        function resetCounter() {
            factCounter = 0;
            currentFactIndex = 0;
            document.getElementById('factCounter').textContent = '0';
            document.getElementById('randomFact').textContent = 'Click "Learn More Facts" to discover amazing science facts!';
        }

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const category = e.target.getAttribute('data-category');
                renderCards(category);
            });
        });

        // Initialize
        generateStars();
        renderCards();
    </script>
</body>
</html>
