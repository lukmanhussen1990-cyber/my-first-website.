<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Frankenwriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #181818; overflow: hidden; }
  body {
    position: fixed; inset: 0; overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: "Courier Prime", "Courier New", monospace;
  }
  #app {
    position: absolute; left: 50%; top: 0; width: 100%; max-width: 440px; height: 100%;
    transform: translateX(-50%); overflow: hidden; background: #181818; contain: strict;
  }
  #paper { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; background: #eae5d9; }
  #paper canvas, #paper div { position: absolute; left: 0; top: 0; pointer-events: none; }
  #light { transform-origin: 0 0; will-change: transform, opacity; opacity: 0; }
  #vignette { inset: 0; width: 100%; height: 100%; opacity: 0;
    background: radial-gradient(ellipse 75% 60% at 50% 38%, rgba(0,0,0,0) 55%, rgba(0,0,0,.16) 100%); }
  #scene { position: absolute; left: 0; pointer-events: none; }
  #glow { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; will-change: transform, opacity;
          background: radial-gradient(closest-side, rgb(62,86,72) 0%, rgb(53,74,62) 25%, rgb(33,46,39) 50%, rgb(14,19,16) 75%, rgba(0,0,0,0) 100%); }
  button { -webkit-appearance: none; appearance: none; background: none; border: 0; padding: 0; margin: 0;
           color: inherit; font: inherit; cursor: pointer; outline: none; }
  button:focus-visible { outline: 1px dashed rgba(200,200,190,.5); outline-offset: 3px; }
  .icon { position: absolute; display: flex; align-items: center; justify-content: center; }
  .icon svg { display: block; overflow: visible; }
  #back { color: #b3b3aa; }
  #share { color: #b0b2a7; }
  #sound { color: #b0b2a7; opacity: .9; }
  #counter { position: absolute; color: #d4d4d4; white-space: pre; line-height: 1; font-weight: 400;
             pointer-events: none; transform: scaleX(0.8); transform-origin: 100% 50%;
             -webkit-text-stroke: 0.42px #181818; }
  #dial { color: #202012; }
  #dial svg .ln { stroke: #e9e4d6; }
  #controls { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; pointer-events: none; }
  #controls.on { pointer-events: auto; }
  .sl { position: absolute; touch-action: none; }
  .sl-lbl { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
            color: #b4b4b1; text-transform: uppercase; white-space: pre; line-height: 1; -webkit-text-stroke: 0.35px #31312e; }
  .sl-lbl .v { text-transform: none; }
  .sl-track { position: absolute; left: 0; right: 0; }
  .sl-track svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .sl-thumb { position: absolute; top: 0; background: #d2d2cd; box-shadow: 0 0 0 .5px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.35); }
  .sl-thumb::after { content: ""; position: absolute; left: 50%; top: 22%; bottom: 22%; width: 1px; margin-left: -.5px; background: #3b3b37; }
  #input {
    position: absolute; left: 0; top: 0; width: 40px; height: 24px; padding: 0; margin: 0; border: 0;
    opacity: 0; color: transparent; background: transparent; caret-color: transparent; resize: none;
    font-size: 16px; line-height: 24px; outline: none; overflow: hidden; white-space: pre-wrap; z-index: 0;
    -webkit-user-select: text; user-select: text;
  }
  #tap { position: absolute; left: 0; width: 100%; }
  #hintBtn { position: absolute; z-index: 2; }
  #toast { position: absolute; left: 50%; transform: translate(-50%, 6px); padding: 7px 12px; border-radius: 6px;
           background: rgba(20,20,18,.92); color: #d8d8d2; font-size: 12px; letter-spacing: .04em;
           opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <div id="paper">
    <div id="vignette"></div>
    <canvas id="light"></canvas>
    <canvas id="grain"></canvas>
  </div>
  <div id="tap"></div>
  <button id="hintBtn" aria-label="Need a first line?"></button>
  <canvas id="scene"></canvas>
  <div id="glow"></div>
  <textarea id="input" autocapitalize="sentences" autocorrect="on" spellcheck="true" autocomplete="off"
            maxlength="3000" rows="1" aria-label="Typewriter text"></textarea>

  <button id="back" class="icon" aria-label="Back">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19.6 12H4.6M10.9 5.6 4.5 12l6.4 6.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="sound" class="icon" aria-label="Sound on or off">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 9.6h3.2L12 6.2v11.6l-4.3-3.4H4.5z"/>
      <g class="on"><path d="M15 9.4a3.7 3.7 0 0 1 0 5.2"/><path d="M17.4 7.2a6.9 6.9 0 0 1 0 9.6"/></g>
      <g class="off" style="display:none"><path d="M15.4 9.8l4.4 4.4M19.8 9.8l-4.4 4.4"/></g>
    </svg>
  </button>
  <div id="counter">0 / 3 000</div>
  <button id="share" class="icon" aria-label="Share">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.9 9.8H3.85v11.1h16.3V9.8H16.1"/><path d="M12 3.6v11.6M8.5 7.1 12 3.6l3.5 3.5"/>
    </svg>
  </button>

  <div id="controls">
    <div class="sl" id="sl-light"><div class="sl-lbl"><span>LIGHT</span><span class="v">Low</span></div><div class="sl-track"><svg></svg><div class="sl-thumb"></div></div></div>
    <div class="sl" id="sl-spread"><div class="sl-lbl"><span>SPREAD</span><span class="v">144°</span></div><div class="sl-track"><svg></svg><div class="sl-thumb"></div></div></div>
    <div class="sl" id="sl-reach"><div class="sl-lbl"><span>REACH</span><span class="v">210%</span></div><div class="sl-track"><svg></svg><div class="sl-thumb"></div></div></div>
  </div>
  <button id="dial" class="icon" aria-label="Lamp on or off">
    <svg viewBox="-16 -16 32 32" width="32" height="32">
      <g fill="none" stroke="currentColor" stroke-linecap="round" class="rays"></g>
      <circle r="9.15" fill="currentColor"/>
      <path class="ln" d="M-3.6 3.6 3.6-3.6" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';

/* ============================================================================
   Frankenwriter – a Halloween typewriter.
   All geometry is measured from the reference recording at 440 CSS px width
   and scaled by k = width / 440.
   ========================================================================== */

const COLS = 19;            // characters per line
const MAX = 3000;           // character limit
const LS = { text: 'fw.text', sound: 'fw.sound', lamp: 'fw.lamp', sliders: 'fw.sliders' };

const $ = (s) => document.querySelector(s);
const app = $('#app'), paperEl = $('#paper'), lightCv = $('#light'), grainCv = $('#grain'),
      vignette = $('#vignette'), scene = $('#scene'), input = $('#input'), tapEl = $('#tap'),
      counterEl = $('#counter'), dialEl = $('#dial'), controlsEl = $('#controls'), toastEl = $('#toast');
const sctx = scene.getContext('2d');
const glowEl = document.getElementById('glow');

/* ---------------------------------------------------------------- utils -- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const E = {
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  outSine: (t) => Math.sin((t * Math.PI) / 2),
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inQuad: (t) => t * t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
};
function cubicBezier(x1, y1, x2, y2) {
  const ax = 3 * x1 - 3 * x2 + 1, bx = 3 * x2 - 6 * x1, cx = 3 * x1;
  const ay = 3 * y1 - 3 * y2 + 1, by = 3 * y2 - 6 * y1, cy = 3 * y1;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i++) { const f = ((ax * t + bx) * t + cx) * t - x; const d = (3 * ax * t + 2 * bx) * t + cx; if (Math.abs(d) < 1e-6) break; t -= f / d; }
    return ((ay * t + by) * t + cy) * t;
  };
}
E.ease = cubicBezier(0.25, 0.1, 0.25, 1);
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function hash(n) { // integer hash → [0,1)
  n = (n | 0) ^ 0x9e3779b9; n = Math.imul(n ^ (n >>> 16), 0x85ebca6b); n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const rnd = (i, s) => hash(i * 7919 + s * 104729 + 17);
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* ------------------------------------------------------------- geometry -- */
let W = 440, H = 956, k = 1, dpr = 1;
const G = {};
let stableW = 0, stableH = 0;

function measure() {
  const iw = window.innerWidth, ih = window.innerHeight;
  // keep the layout height stable while the on-screen keyboard is open
  if (Math.abs(iw - stableW) > 1 || document.activeElement !== input || ih > stableH) { stableW = iw; stableH = ih; }
  H = stableH;
  // portrait phones: full width (max 440). Wide/short screens (desktop, landscape): keep the
  // phone composition by also limiting the column to 0.6 × height.
  W = H / iw < 1.3 ? Math.min(iw, 440, H * 0.6) : Math.min(iw, 440);
  k = W / 440;
  dpr = Math.min(2, window.devicePixelRatio || 1);
}

function layout() {
  measure();
  app.style.height = H + 'px';
  app.style.width = W + 'px';
  G.paperTop = Math.round(H * 0.1935);
  G.railY = H * 0.444;
  G.base = G.railY - 55.84 * k;       // typing baseline of the first line (template-matched to the recording)
  G.base2 = 1.33 * k;                 // from the second line on, the typing line sits ~1 px lower (as recorded)
  G.lineH = 24.67 * k;                // line spacing on the paper
  G.cell = 13.1 * k;                  // carriage step per character
  G.textLeft = 88.8 * k;              // left edge of column 0 (the T sits on its centre)
  G.glyphDX = 1.2 * k;                // glyphs land slightly right of the T centre in the recording
  G.font = 22 * k;
  G.hintBase = G.railY - 136.6 * k;
  G.hintFont = 11.7 * k;
  G.capHW = 45.8 * k; G.capHH = 21.7 * k;
  G.capCY = G.railY - 0.8 * k;
  G.railT = G.railY - 11 * k; G.railB = G.railY + 10.25 * k;
  G.rx = 53.3 * k; G.ry = 160 * k;     // paper corner ellipse
  G.sceneTop = G.paperTop - 2;
  G.sceneBot = Math.min(H, G.railY + 160 * k);
  G.dialX = W - 44.4 * k; G.dialY = H * 0.601;

  paperEl.style.top = G.paperTop + 'px';
  paperEl.style.borderRadius = `${G.rx}px ${G.rx}px 0 0 / ${G.ry}px ${G.ry}px 0 0`;
  scene.style.top = G.sceneTop + 'px';
  scene.style.width = W + 'px';
  scene.style.height = (G.sceneBot - G.sceneTop) + 'px';
  scene.width = Math.round(W * dpr);
  scene.height = Math.round((G.sceneBot - G.sceneTop) * dpr);
  tapEl.style.top = G.paperTop + 'px';
  tapEl.style.height = (H - G.paperTop) + 'px';

  // top bar
  placeIcon($('#back'), 47.7 * k, H * 0.0918, k);
  placeIcon($('#share'), 399.7 * k, H * 0.0896 - 0.25 * k, k);
  placeIcon($('#sound'), 214 * k, H * 0.0885, k);   // clear of the longest counter ("3 000 / 3 000")
  counterEl.style.fontSize = (14.4 * k) + 'px';
  counterEl.style.letterSpacing = (0.2 * k) + 'px';
  counterEl.style.right = (W - 369.2 * k) + 'px';
  counterEl.style.top = (H * 0.0866 - 5.6 * k) + 'px';
  counterEl.style.webkitTextStroke = (0.42 * k) + 'px #181818';
  // dial
  placeIcon(dialEl, G.dialX, G.dialY, k);
  buildDialRays();
  layoutSliders();
  toastEl.style.top = (G.paperTop - 34 * k) + 'px';
  glowEl.style.width = glowEl.style.height = (280 * k) + 'px';

  const hb = $('#hintBtn');
  hb.style.left = (W / 2 - 80 * k) + 'px'; hb.style.width = (160 * k) + 'px';
  hb.style.top = (G.hintBase - 22 * k) + 'px'; hb.style.height = (32 * k) + 'px';
  input.style.left = G.textLeft + 'px';
  input.style.top = (G.base - 18 * k) + 'px';

  buildGrain();
  buildRail();
  buildCapsules();
  buildSprites();
  buildCaptions();
  lightDirty = true;
  invalidateText();
  car.x = car.from = car.to = carriageTarget(); car.pending = null; car.dur = 0; lightX = lastCarX = car.x;
  initWebs();
  onViewport();
}

function placeIcon(el, cx, cy, s) {
  const sz = 44 * k;
  el.style.width = sz + 'px'; el.style.height = sz + 'px';
  el.style.left = (cx - sz / 2) + 'px'; el.style.top = (cy - sz / 2) + 'px';
  const svg = el.querySelector('svg');
  if (svg && el.id !== 'dial') { svg.style.width = (24 * s) + 'px'; svg.style.height = (24 * s) + 'px'; }
  if (svg && el.id === 'dial') { svg.style.width = (32 * k) + 'px'; svg.style.height = (32 * k) + 'px'; }
}

function buildDialRays() {
  // the recording's dial has 10 rays, 36° apart, starting straight up
  const g = dialEl.querySelector('.rays');
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const r0 = 11.7, r1 = 14.6;
    d += `M${(Math.cos(a) * r0).toFixed(2)} ${(Math.sin(a) * r0).toFixed(2)}L${(Math.cos(a) * r1).toFixed(2)} ${(Math.sin(a) * r1).toFixed(2)}`;
  }
  g.innerHTML = `<path d="${d}" stroke-width="1.75"/>`;
}

/* ------------------------------------------------------------ paper grain -- */
function buildGrain() {
  const w = W, h = H - G.paperTop;
  grainCv.width = Math.round(w * dpr); grainCv.height = Math.round(h * dpr);
  grainCv.style.width = w + 'px'; grainCv.style.height = h + 'px';
  const g = grainCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = mulberry(9157);
  // soft mottling
  for (let i = 0; i < 70; i++) {
    const x = R() * w, y = R() * h, r = (20 + R() * 70) * k;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = R() < 0.5;
    gr.addColorStop(0, dark ? 'rgba(120,100,70,0.018)' : 'rgba(255,252,240,0.016)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // faint fibres
  g.lineCap = 'round';
  for (let i = 0; i < 160; i++) {
    const x = R() * w, y = R() * h, len = (4 + R() * 16) * k, a = R() * Math.PI;
    g.strokeStyle = `rgba(110,95,70,${0.025 + R() * 0.05})`;
    g.lineWidth = (0.35 + R() * 0.3) * k;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + (R() - 0.5) * 4 * k, y + Math.sin(a) * len * 0.5 + (R() - 0.5) * 4 * k,
      x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  // specks & dust
  const n = Math.round((w * h) / (1250 * k * k));
  for (let i = 0; i < n; i++) {
    const x = R() * w, y = R() * h;
    const s = (0.28 + Math.pow(R(), 3) * 0.95) * k;
    const a = 0.3 + R() * 0.6;
    g.fillStyle = `rgba(${40 + R() * 25 | 0},${32 + R() * 18 | 0},${22 + R() * 12 | 0},${a})`;
    const t = R();
    g.beginPath();
    if (t < 0.62) { g.ellipse(x, y, s, s * (0.6 + R() * 0.5), R() * 3, 0, Math.PI * 2); }
    else if (t < 0.93) { // tiny triangle / chip
      const r2 = s * 1.4, a0 = R() * 6.28;
      g.moveTo(x + Math.cos(a0) * r2, y + Math.sin(a0) * r2);
      g.lineTo(x + Math.cos(a0 + 2.2) * r2, y + Math.sin(a0 + 2.2) * r2);
      g.lineTo(x + Math.cos(a0 + 4.1) * r2 * 0.7, y + Math.sin(a0 + 4.1) * r2 * 0.7);
    } else { // dash
      const a0 = R() * 6.28, l = s * 1.9;
      g.ellipse(x, y, l, s * 0.4, a0, 0, Math.PI * 2);
    }
    g.fill();
  }
  // fine grain tile
  const tile = document.createElement('canvas'); tile.width = tile.height = 128;
  const tg = tile.getContext('2d'); const id = tg.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = R(); id.data[i] = id.data[i + 1] = id.data[i + 2] = v < 0.5 ? 150 : 255; id.data[i + 3] = (Math.abs(v - 0.5) * 2) * 10;
  }
  tg.putImageData(id, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = g.createPattern(tile, 'repeat');
  g.fillRect(0, 0, grainCv.width, grainCv.height);
}

/* ------------------------------------------------------------------ rail -- */
const railCv = [document.createElement('canvas'), document.createElement('canvas')]; // [light, lamp]
// median vertical profiles across the pipe, measured from the recording (f = 0 top edge … 1 bottom edge)
const RAIL_STOPS = [
  [[0, '#3a3e3b'], [0.03, '#262d2b'], [0.08, '#2a3031'], [0.145, '#32383b'], [0.18, '#3c4245'], [0.21, '#4c5255'],
   [0.24, '#62686b'], [0.27, '#7e8487'], [0.305, '#949a9d'], [0.34, '#9aa0a3'], [0.37, '#91979a'], [0.4, '#7e8487'],
   [0.435, '#6b7174'], [0.47, '#5a6063'], [0.5, '#51575a'], [0.565, '#4c5255'], [0.63, '#454a4d'], [0.66, '#3e4547'],
   [0.695, '#363c3f'], [0.725, '#303437'], [0.76, '#282c2f'], [0.79, '#1e2326'], [0.855, '#1b1d1e'], [0.92, '#141414'],
   [0.97, '#131312'], [1, '#181614']],
  [[0, '#1b1a17'], [0.03, '#13110f'], [0.11, '#141312'], [0.18, '#191816'], [0.24, '#222321'], [0.3, '#2b2c29'],
   [0.34, '#2d2d2a'], [0.4, '#292926'], [0.47, '#212120'], [0.5, '#1e1f1c'], [0.6, '#1f1f1c'], [0.66, '#20201d'],
   [0.73, '#1c1c1a'], [0.82, '#191816'], [0.86, '#121211'], [0.95, '#0f0f0d'], [1, '#10100f']],
];
function buildRail() {
  const top = G.railT - 8 * k, bot = G.railB + 22 * k;
  G.railSpriteTop = top;
  for (let m = 0; m < 2; m++) {
    const cv = railCv[m];
    cv.width = Math.round(W * dpr); cv.height = Math.round((bot - top) * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, -top * dpr);
    // soft shadow on the paper below the rail
    const sh = c.createLinearGradient(0, G.railB - 1 * k, 0, G.railB + 17 * k);
    if (m === 0) {   // falloff measured below the pipe in the recording
      for (const [o, a] of [[0, 0.8], [0.139, 0.5], [0.211, 0.37], [0.289, 0.23], [0.361, 0.17], [0.433, 0.11], [0.511, 0.067], [0.583, 0.04], [0.656, 0.02], [0.733, 0]])
        sh.addColorStop(o, `rgba(30,24,16,${a})`);

    this.burst(t, { f: 950 * p, q: 1.1, gain: 0.32, d: 0.06 });
    this.tone(t, { f: 92 * p, f2: 55, gain: 0.42, d: 0.09 });
  },
  backspace() {
    if (!this.ready()) return; const t = this.ctx.currentTime + 0.003;
    this.burst(t, { f: 2600, type: 'highpass', q: 0.8, gain: 0.3, d: 0.012 });
    this.tone(t, { f: 1400 + Math.random() * 120, type: 'square', gain: 0.03, d: 0.01 });
    this.tone(t + 0.004, { f: 210, f2: 120, gain: 0.18, d: 0.03 });
  },
  spark(v = 1) {
    if (!this.ready()) return; const t0 = this.ctx.currentTime + 0.004;
    const n = 4 + ((Math.random() * 5) | 0), dur = 0.08 + Math.random() * 0.07;
    for (let i = 0; i < n; i++) this.burst(t0 + Math.random() * dur, { f: 3000 + Math.random() * 3000, type: 'highpass', q: 0.6, gain: (0.1 + Math.random() * 0.22) * v, a: 0.0005, d: 0.003 + Math.random() * 0.006 });
    this.buzz(t0, dur, 0.06 * v, 110 + Math.random() * 40);
  },
  buzz(t, dur, gain, f) {
    const o = this.ctx.createOscillator(), am = this.ctx.createOscillator(), amg = this.ctx.createGain(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = f; am.type = 'square'; am.frequency.value = 23 + Math.random() * 30;
    amg.gain.value = 0.5; am.connect(amg); amg.connect(g.gain);
    fl.type = 'bandpass'; fl.frequency.value = 1300; fl.Q.value = 0.9;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(this.sfx); o.start(t); am.start(t); o.stop(t + dur + 0.02); am.stop(t + dur + 0.02);
  },
  zap(v = 1) {
    if (!this.ready()) return; const t0 = this.ctx.currentTime + 0.004;
    for (let i = 0; i < 14; i++) this.burst(t0 + Math.random() * 0.32, { f: 2500 + Math.random() * 4000, type: 'highpass', q: 0.6, gain: (0.12 + Math.random() * 0.25) * v, a: 0.0005, d: 0.004 + Math.random() * 0.01 });
    this.buzz(t0, 0.17, 0.11 * v, 72 + Math.random() * 20);
    this.buzz(t0 + 0.15, 0.2, 0.07 * v, 140);
    this.tone(t0 + 0.15, { f: 160, f2: 60, gain: 0.25 * v, d: 0.12 });
  },
  carriageReturn(cols) {
    if (!this.ready()) return; const t0 = this.ctx.currentTime + 0.004, D = 0.267, n = Math.max(3, Math.min(18, cols));
    for (let i = 1; i <= n; i++) {   // one ratchet click per character the carriage passes (ease-out-sine timing)
      const tt = t0 + D * (2 / Math.PI) * Math.asin(i / n);
      this.burst(tt, { f: 3200 + Math.random() * 600, q: 2.2, gain: 0.16, d: 0.007 });
      this.tone(tt, { f: 900, type: 'triangle', gain: 0.025, d: 0.006 });
    }
    // slide hiss following the carriage speed
    const ns = this.noiseSrc(t0, D + 0.05), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    fl.type = 'bandpass'; fl.Q.value = 0.8; fl.frequency.setValueAtTime(1600, t0); fl.frequency.exponentialRampToValueAtTime(600, t0 + D);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + D + 0.03);
    ns.connect(fl); fl.connect(g); g.connect(this.sfx);
    this.zap(1.05);
    this.ding(t0 + 0.02);
  },
  ding(t) {
    const f = 2093 * (0.995 + Math.random() * 0.01);
    for (const [mul, gn, d] of [[1, 0.13, 1.3], [2.76, 0.05, 0.6], [5.4, 0.025, 0.3], [1.004, 0.07, 1.1]]) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.value = f * mul; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gn, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.sfx); g.connect(this.verb); o.start(t); o.stop(t + d + 0.05);
    }
  },
  lampSwitch(on) {
    if (!this.ready()) return; const t = this.ctx.currentTime + 0.003;
    this.burst(t, { f: 2200, type: 'highpass', q: 0.7, gain: 0.32, d: 0.01 });
    this.tone(t, { f: on ? 190 : 160, f2: 90, gain: 0.28, d: 0.04 });
    this.burst(t + 0.035, { f: 3500, q: 2, gain: 0.08, d: 0.015 });
    if (on) {   // warm-up flicker buzz as the bulb catches, then the hum
      const ft = t + 0.62;
      const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = 100; o2.type = 'square'; o2.frequency.value = 50; fl.type = 'lowpass'; fl.frequency.value = 1800;
      g.gain.setValueAtTime(0.0001, ft);
      const pat = [[0, 0.05], [0.03, 0.0001], [0.05, 0.06], [0.1, 0.0001], [0.12, 0.04], [0.2, 0.03], [0.32, 0.0001]];
      for (const [dt, v] of pat) g.gain.setValueAtTime(v, ft + dt);
      o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(this.sfx);
      o.start(ft); o2.start(ft); o.stop(ft + 0.4); o2.stop(ft + 0.4);
      this.humOn(0.8);
    } else this.humOff(0.35);
  },
  humOn(delay) {
    if (!this.ctx || this.hum) return;
    const t = this.ctx.currentTime + delay, g = this.ctx.createGain(), fl = this.ctx.createBiquadFilter(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    fl.type = 'lowpass'; fl.frequency.value = 420; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.011, t + 0.5);
    const oscs = [[60, 1], [120, 0.55], [180, 0.22], [240, 0.08]].map(([f, a]) => { const o = this.ctx.createOscillator(), og = this.ctx.createGain(); o.frequency.value = f; og.gain.value = a; o.connect(og); og.connect(fl); o.start(t); return o; });
    lfo.frequency.value = 0.27; lg.gain.value = 0.003; lfo.connect(lg); lg.connect(g.gain); lfo.start(t);
    fl.connect(g); g.connect(this.sfx);
    this.hum = { g, oscs, lfo };
  },
  humOff(fade) {
    if (!this.hum) return; const h = this.hum; this.hum = null; const t = this.ctx.currentTime;
    h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(Math.max(0.0001, h.g.gain.value), t); h.g.gain.exponentialRampToValueAtTime(0.0001, t + fade + 0.02);
    for (const o of h.oscs) o.stop(t + fade + 0.05); h.lfo.stop(t + fade + 0.05);
  },
  tick() {
    if (!this.ready()) return; const t = this.ctx.currentTime + 0.002;
    this.tone(t, { f: 3400 + Math.random() * 300, type: 'square', gain: 0.025, d: 0.004 });
    this.burst(t, { f: 5000, type: 'highpass', gain: 0.07, d: 0.005 });
  },
  // ---- background music: playful-spooky loop, 114 BPM ----
  startMusic() {
    if (!this.ctx || this.musicOn) return;
    this.musicOn = true; this.step = 0; this.nextNote = this.ctx.currentTime + 0.12;
    // theremin voice: one gliding oscillator pair with vibrato
    const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator(), g = this.ctx.createGain(), g2 = this.ctx.createGain(), fl = this.ctx.createBiquadFilter();
    const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(), dry = this.ctx.createGain();
    o.type = 'sine'; o2.type = 'triangle'; g2.gain.value = 0.18; lfo.frequency.value = 5.6; lg.gain.value = 26;
    lfo.connect(lg); lg.connect(o.detune); lg.connect(o2.detune);
    fl.type = 'lowpass'; fl.frequency.value = 2200; fl.Q.value = 0.4;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(fl); fl.connect(dry); dry.gain.value = 1;
    dry.connect(this.music); fl.connect(this.verb);
    g.gain.value = 0.0001; o.start(); o2.start(); lfo.start();
    this.ther = { o, o2, g, lfo };
    clearInterval(this.timer);
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() {
    if (!this.musicOn) return; this.musicOn = false; clearInterval(this.timer);
    const t = this.ctx.currentTime, th = this.ther;
    if (th) { th.g.gain.cancelScheduledValues(t); th.g.gain.setTargetAtTime(0.0001, t, 0.05); th.o.stop(t + 0.4); th.o2.stop(t + 0.4); th.lfo.stop(t + 0.4); this.ther = null; }
  },
  schedule() {
    if (!this.musicOn || this.ctx.state !== 'running') { if (this.ctx) this.nextNote = Math.max(this.nextNote, this.ctx.currentTime + 0.05); return; }
    const B = 60 / 114, S16 = B / 4;
    while (this.nextNote < this.ctx.currentTime + 0.14) { this.playStep(this.step, this.nextNote, B); this.nextNote += S16; this.step = (this.step + 1) % (16 * 8); }
  },
  playStep(step, t, B) {
    const bar = (step / 16) | 0, s = step % 16, M = this.music;
    const PROG = [[45, [57, 60, 64]], [45, [57, 60, 64]], [50, [57, 62, 65]], [52, [56, 59, 62, 64]], [45, [57, 60, 64]], [41, [57, 60, 65]], [50, [57, 62, 65]], [52, [56, 59, 62, 64]]];
    const [root, tones] = PROG[bar];
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    if (s % 4 === 0) {   // soft kick on every beat
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(M); o.start(t); o.stop(t + 0.3);
    }
    if (s === 0 || s === 8) {   // plucked bass "oom"
      const m = s === 0 ? root - 12 : root - 5;
      const o = this.ctx.createOscillator(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.value = hz(m); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(220, t + 0.3);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.42, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(fl); fl.connect(g); g.connect(M); o.start(t); o.stop(t + 0.5);
    }
    if (s === 4 || s === 12 || (s === 14 && bar % 2 === 1)) {   // plucky chord "pah"
      for (const m of tones) {
        const o = this.ctx.createOscillator(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = hz(m); o.detune.value = (Math.random() - 0.5) * 8;
        fl.type = 'lowpass'; fl.frequency.setValueAtTime(2600, t); fl.frequency.exponentialRampToValueAtTime(420, t + 0.16);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(fl); fl.connect(g); g.connect(M); o.start(t); o.stop(t + 0.25);
      }
    }
    if (s % 4 === 2) {   // shaker on the off-beats
      const n = this.noiseSrc(t, 0.05), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      fl.type = 'highpass'; fl.frequency.value = 7000; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      n.connect(fl); fl.connect(g); g.connect(M);
    }
    // theremin melody: [bar, 16th, midi, length in 16ths]
    const MEL = [[0, 0, 76, 10], [0, 10, 72, 6], [1, 0, 69, 8], [1, 8, 71, 4], [1, 12, 72, 4], [2, 0, 74, 8], [2, 8, 77, 8],
      [3, 0, 76, 8], [3, 8, 68, 8], [4, 0, 81, 8], [4, 8, 76, 8], [5, 0, 77, 6], [5, 6, 72, 6], [5, 12, 69, 4],
      [6, 0, 74, 8], [6, 8, 77, 4], [6, 12, 76, 4], [7, 0, 68, 6], [7, 6, 71, 6], [7, 12, 76, 4]];
    const th = this.ther;
    for (const [b, st, m, len] of MEL) if (b === bar && st === s && th) {
      const f = hz(m), dur = len * B / 4;
      th.o.frequency.setTargetAtTime(f, t, 0.045); th.o2.frequency.setTargetAtTime(f * 2, t, 0.045);
      th.g.gain.cancelScheduledValues(t);
      th.g.gain.setTargetAtTime(0.05, t, 0.04);                 // swell in
      th.g.gain.setTargetAtTime(0.036, t + dur * 0.55, 0.12);    // relax
      th.g.gain.setTargetAtTime(0.012, t + dur - 0.06, 0.03);    // breathe before the next note
    }
    if (s === 0 && bar % 4 === 0) {   // occasional bell chime
      const f = hz(bar === 0 ? 88 : 81);
      const car = this.ctx.createOscillator(), mod = this.ctx.createOscillator(), mg = this.ctx.createGain(), g = this.ctx.createGain();
      car.frequency.value = f; mod.frequency.value = f * 3.5; mg.gain.setValueAtTime(f * 1.4, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.6);
      mod.connect(mg); mg.connect(car.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      car.connect(g); g.connect(M); g.connect(this.verb); car.start(t); mod.start(t); car.stop(t + 2.7); mod.stop(t + 2.7);
    }
  },
};
// unlock audio on the first gesture (browser rule)
const unlock = () => AU.resume();
for (const ev of ['pointerdown', 'touchend', 'keydown', 'click']) window.addEventListener(ev, unlock, { capture: true, passive: true });
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.hidden) AU.ctx.suspend().catch(() => {}); else if (AU.on) AU.ctx.resume().catch(() => {});
});
const soundBtn = $('#sound');
function paintSound() {
  soundBtn.querySelector('.on').style.display = AU.on ? '' : 'none';
  soundBtn.querySelector('.off').style.display = AU.on ? 'none' : '';
  soundBtn.setAttribute('aria-pressed', AU.on ? 'true' : 'false');
}
soundBtn.addEventListener('click', () => { AU.setOn(!AU.on); paintSound(); });
paintSound();

/* ---------------------------------------------------------- idle sparks -- */
let nextIdle = 0, lastActivity = 0;
function updateIdle(t) {
  const idle = t - Math.max(lastKey, lastActivity);
  if (idle < 2.4) { nextIdle = Math.max(nextIdle, t + (2.4 - idle) + Math.random() * 0.6); return; }
  if (t >= nextIdle) {
    fx.zap(Math.random() < 0.72, 0.8);
    AU.spark(0.32);
    nextIdle = t + 0.6 + Math.random() * 1.0;
  }
}

/* --------------------------------------------------------------- loop -- */
let lastT = now();
let lightX = 0, drawDt = 1 / 60;
function frame() {
  const t = now();
  const dt = Math.min(0.05, t - lastT); lastT = t;
  stepChannels(dt);
  pumpPending(t);
  updateCarriage(t);
  updateIdle(t);
  stepWebs(dt, t);
  if (appearAt.size > 64) for (const [i, a] of appearAt) if (a < t - 1) appearAt.delete(i);
  if (lightDirty && (lampOn || CH.light.v > 0)) renderLight();
  // light layer follows the carriage
  const lv = CH.light.v;
  if (lv > 0) {
    const grow = 0.15 + 0.85 * E.outCubic(lv);
    const flick = lampOn && lv < 1 ? flicker(lv) : 1;
    lightX += (car.x - lightX) * (1 - Math.exp(-dt / 0.03));
    if (Math.abs(car.x - lightX) > 200 * k) lightX = car.x;
    const ax = lightX, ay = G.capCY - G.capHH - G.paperTop;
    setStyle(lightCv, 'transform', `translate(${(ax - L.ax).toFixed(2)}px, ${(ay - L.ay).toFixed(2)}px) translate(${L.ax}px, ${L.ay}px) scale(${grow.toFixed(4)}) translate(${-L.ax}px, ${-L.ay}px)`);
    setStyle(lightCv, 'opacity', ((lampOn ? E.outSine(lv) : lv) * flick).toFixed(3));
  } else setStyle(lightCv, 'opacity', '0');
  drawDt = dt;
  draw(t);
  requestAnimationFrame(frame);
}
function flicker(p) {
  // quick warm-up flicker of the bulb (p = 0…1); kept short so the ramp still matches the recording
  const keys = [[0, 1], [0.06, 1], [0.09, 0.45], [0.13, 1], [0.21, 1], [0.24, 0.7], [0.28, 1], [1, 1]];
  for (let i = 1; i < keys.length; i++) if (p <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], (p - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]));
  return 1;
}

/* ---------------------------------------------------------------- debug -- */
if (/[?&]debug\b/.test(location.search)) {
  window.__fw = {
    get text() { return text; }, get lines() { return lines.map((l) => l.idx.map((i) => text[i]).join('')); },
    get carX() { return car.x; }, get target() { return carriageTarget(); }, get col() { return caretCol(); },
    get lamp() { return lampOn; }, colX, G, AU, fx, WEB,
  };
}

/* --------------------------------------------------------------- boot -- */
function boot() {
  text = (store.get(LS.text, '') || '').slice(0, MAX);
  lines = wrap(text);
  input.value = text;
  try { const s = JSON.parse(store.get(LS.sliders, 'null')); if (s) Object.assign(sliders, s); } catch (e) {}
  layout();
  shiftAnim.from = shiftAnim.to = lines.length > 1 ? 1 : 0;
  car.x = car.from = car.to = carriageTarget(); car.dur = 0; lightX = car.x; lastCarX = car.x;
  initWebs();
  setLamp(store.get(LS.lamp, '0') === '1', true);
  onTextChanged();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load(FONT(22)), document.fonts.load('700 22px "Courier Prime"')]).then(() => { fontReady = true; invalidateText(); buildCaptions(); });
  }
  if (!('ontouchstart' in window)) focusInput();
  lastActivity = now();
  requestAnimationFrame(frame);
}
boot();
})();
</script>
