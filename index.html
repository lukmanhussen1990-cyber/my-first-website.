             letter-spacing: .12em; color: #e6dcc8; background: rgba(36,32,29,.82); pointer-events: none; opacity: 0; transition: opacity .25s; text-transform: uppercase; }
  #pageTag.on { opacity: 1; }
  @media print {
    html, body { overflow: visible !important; position: static !important; background: #fff !important; height: auto !important; }
    body > *:not(#print) { display: none !important; }
    #print { display: block !important; color: #111; font: 12pt/1.55 "Courier Prime", "Courier New", monospace; white-space: pre-wrap; }

  }

</style>

<body>

<script>
(() => {
'use strict';

/* ============================================================================
   Frankenwriter – a Halloween typewriter.
   All geometry is measured from the reference recording at 440 CSS px width
   and scaled by k = width / 440.
   ========================================================================== */

const COLS = 19;            // characters per line
const MAX = 3000;           // characters per sheet
const MAX_IN = MAX * 4;     // a paste may run on over a few sheets
const LS = { text: 'fw.text', sound: 'fw.sound', lamp: 'fw.lamp', sliders: 'fw.sliders', skin: 'fw.skin', tip: 'fw.tip' };

const $ = (s) => document.querySelector(s);
const app = $('#app'), paperEl = $('#paper'), lightCv = $('#light'), grainCv = $('#grain'),
      vignette = $('#vignette'), scene = $('#scene'), input = $('#input'), tapEl = $('#tap'),
      counterEl = $('#counter'), dialEl = $('#dial'), controlsEl = $('#controls'), toastEl = $('#toast');
const sctx = scene.getContext('2d');
const glowEl = document.getElementById('glow');

/* ---------------------------------------------------------------- utils -- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const E = {
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  outSine: (t) => Math.sin((t * Math.PI) / 2),
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inQuad: (t) => t * t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
};
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function hash(n) { // integer hash → [0,1)
  n = (n | 0) ^ 0x9e3779b9; n = Math.imul(n ^ (n >>> 16), 0x85ebca6b); n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const rnd = (i, s) => hash(i * 7919 + s * 104729 + 17);
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* ---------------------------------------------------------------- prefs -- */
// everything the control panel sets, remembered; the defaults are the recorded machine
const PREF_DEF = { paper: 'cream', ink: 'black', pack: 'electric', vol: 1, ambience: true, bell: true, haptics: true };
const prefs = Object.assign({}, PREF_DEF, (() => { try { return JSON.parse(store.get('fw.prefs', '{}')) || {}; } catch (e) { return {}; } })());
for (const key in PREF_DEF) if (typeof prefs[key] !== typeof PREF_DEF[key] || (typeof prefs[key] === 'number' && !Number.isFinite(prefs[key]))) prefs[key] = PREF_DEF[key];
function savePrefs() { store.set('fw.prefs', JSON.stringify(prefs)); }
// paper themes: base colour on the cream side / under the lamp, ink (normal / lamp), caption greys, caret
const PAPERS = {
  cream:     { name: 'Cream', light: '#eee7db', dark: '#30302d', ink: ['#3c3429', '#120e06'], hint: [[12, 10, 6], [55, 54, 50]],
               ph: [[104, 96, 84], [92, 86, 74]], caret: [54, 46, 35], grainA: 1 },
  parchment: { name: 'Old Parchment', light: '#e2cc9a', dark: '#2f291d', ink: ['#3a2612', '#140b03'], hint: [[44, 28, 10], [64, 56, 40]],
               ph: [[124, 98, 60], [98, 86, 62]], caret: [72, 46, 18], grainA: 1 },
  blueprint: { name: 'Blueprint', light: '#1e4d8c', dark: '#0f2645', ink: ['#f0f5ff', '#dfe9ff'], hint: [[214, 228, 255], [120, 150, 200]],
               ph: [[150, 182, 232], [104, 134, 186]], caret: [232, 240, 255], grainA: 0.3, lightInk: true },
  black:     { name: 'Black Paper', light: '#22201d', dark: '#0f0f0e', ink: ['#efe9dd', '#dcd4c6'], hint: [[214, 208, 196], [104, 100, 92]],
               ph: [[146, 140, 128], [98, 94, 86]], caret: [232, 226, 214], grainA: 0.22, lightInk: true },
};
// ribbon colours: [on light paper, on dark paper]; black is the paper's own ink
const INKS = { black: null, red: ['#a8241c', '#ff7262'], blue: ['#24408f', '#94b4ff'], sepia: ['#6b4423', '#dcab7c'] };
const paperTheme = () => PAPERS[prefs.paper] || PAPERS.cream;
function inkFor(lamp) {
  const P = paperTheme(), I = INKS[prefs.ink];
  if (!I) return lamp ? P.ink[1] : P.ink[0];
  if (P.lightInk) return I[1];
  if (!lamp) return I[0];
  const c = hex(I[0]);   // under the lamp the ribbon reads darker, like the recorded ink…
  // …and never lighter than half the darkened sheet, so a brown ink on old parchment still stands out of the shadow
  const lum = (q) => 0.299 * q[0] + 0.587 * q[1] + 0.114 * q[2];
  const f = Math.min(0.62, 0.5 * lum(hex(P.dark)) / Math.max(1, lum(c)));
  return '#' + c.map((v) => Math.round(v * f).toString(16).padStart(2, '0')).join('');
}

/* ------------------------------------------------------------- geometry -- */
let W = 440, H = 956, k = 1, dpr = 1;
const G = {};
let stableW = 0, stableH = 0;
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // no flashes, bats or flying paper
const STILL = /[?&]still\b/.test(location.search);   // test switch: only the recorded machine (no dust, sparks, flicker, creatures)

function measure() {
  const iw = Math.max(1, window.innerWidth), ih = Math.max(1, window.innerHeight);
  // on touch devices keep the layout height stable while the on-screen keyboard is open (a shorter
  // window with the textarea focused); desktops always follow the window
  if (!TOUCH || Math.abs(iw - stableW) > 1 || document.activeElement !== input || ih > stableH) { stableW = iw; stableH = ih; }
  H = Math.max(200, stableH);
  // portrait phones: full width (max 440). Wide/short screens (desktop, landscape): keep the
  // phone composition by also limiting the column to 0.6 × height.
  W = H / iw < 1.3 ? Math.min(iw, 440, H * 0.6) : Math.min(iw, 440);
  k = W / 440;
  dpr = Math.min(2, window.devicePixelRatio || 1);
}

function layout() {
  measure();
  app.style.height = H + 'px';
  app.style.width = W + 'px';
  G.paperTop = Math.round(H * 0.1935);
  G.railY = H * 0.444;
  G.base = G.railY - 55.84 * k;       // typing baseline of the first line (template-matched to the recording)
  G.base2 = 1.33 * k;                 // from the second line on, the typing line sits ~1 px lower (as recorded)
  G.lineH = 24.67 * k;                // line spacing on the paper
  G.cell = 13.1 * k;                  // carriage step per character
  G.textLeft = 88.8 * k;              // left edge of column 0 (the T sits on its centre)
  G.glyphDX = 1.2 * k;                // glyphs land slightly right of the T centre in the recording
  G.font = 22 * k;
  G.hintBase = G.railY - 136.6 * k;
  G.hintFont = 11.7 * k;
  G.capHW = 45.8 * k; G.capHH = 21.7 * k;
  G.capCY = G.railY - 0.8 * k;
  G.railT = G.railY - 11 * k; G.railB = G.railY + 10.25 * k;
  G.rx = 53.3 * k; G.ry = 160 * k;     // paper corner ellipse
  G.sceneTop = G.paperTop - 2;
  G.sceneBot = Math.min(H, G.railY + 160 * k);
  G.dialX = W - 44.4 * k; G.dialY = H * 0.601;

  paperEl.style.top = G.paperTop + 'px';
  paperEl.style.borderRadius = `${G.rx}px ${G.rx}px 0 0 / ${G.ry}px ${G.ry}px 0 0`;
  scene.style.top = G.sceneTop + 'px';
  scene.style.width = W + 'px';
  scene.style.height = (G.sceneBot - G.sceneTop) + 'px';
  scene.width = Math.round(W * dpr);
  scene.height = Math.round((G.sceneBot - G.sceneTop) * dpr);
  tapEl.style.top = G.paperTop + 'px';
  tapEl.style.height = (H - G.paperTop) + 'px';

  // top bar
  placeIcon($('#back'), 47.7 * k, H * 0.0918, k);
  placeIcon($('#gear'), 97 * k, H * 0.0918, k);
  placeIcon($('#share'), 399.7 * k, H * 0.0896 - 0.25 * k, k);
  placeIcon($('#sound'), 214 * k, H * 0.0885, k);   // clear of the longest counter ("3 000 / 3 000")
  counterEl.style.fontSize = (14.4 * k) + 'px';
  counterEl.style.letterSpacing = (0.2 * k) + 'px';
  counterEl.style.right = (W - 369.2 * k) + 'px';
  counterEl.style.top = (H * 0.0866 - 5.6 * k) + 'px';
  counterEl.style.webkitTextStroke = (0.42 * k) + 'px #181818';
  // dial
  placeIcon(dialEl, G.dialX, G.dialY, k);
  buildDialRays();
  layoutSliders();
  toastEl.style.top = (G.paperTop - 34 * k) + 'px';
  glowEl.style.width = glowEl.style.height = (280 * k) + 'px';

  const hb = $('#hintBtn');
  hb.style.left = (W / 2 - 80 * k) + 'px'; hb.style.width = (160 * k) + 'px';
  hb.style.top = (G.hintBase - 22 * k) + 'px'; hb.style.height = (32 * k) + 'px';
  input.style.left = G.textLeft + 'px';
  input.style.top = (G.base - 18 * k) + 'px';

  buildGrain();
  buildPaperFx();
  buildRelief();
  buildEdge();
  buildRail();
  buildCapsules();
  layoutSkinUI();
  layoutMenu();
  layoutBackdrop();
  layoutSheets();
  buildSprites();
  buildCaptions();
  lightDirty = true;
  invalidateText();
  car.x = car.from = car.to = carriageTarget(); car.pending = null; car.dur = 0; lightX = lastCarX = car.x; carHist.n = 0;
  initWebs();
  onViewport();
}

function placeIcon(el, cx, cy, s) {
  const sz = 44 * k;
  el.style.width = sz + 'px'; el.style.height = sz + 'px';
  el.style.left = (cx - sz / 2) + 'px'; el.style.top = (cy - sz / 2) + 'px';
  const svg = el.querySelector('svg');
  if (svg && el.id !== 'dial') { svg.style.width = (24 * s) + 'px'; svg.style.height = (24 * s) + 'px'; }
  if (svg && el.id === 'dial') { svg.style.width = (32 * k) + 'px'; svg.style.height = (32 * k) + 'px'; }
}

function buildDialRays() {
  // the recording's dial has 10 rays, 36° apart, starting straight up
  const g = dialEl.querySelector('.rays');
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const r0 = 13.1, r1 = 15.4;   // measured: the rays stand a little clear of the disc
    d += `M${(Math.cos(a) * r0).toFixed(2)} ${(Math.sin(a) * r0).toFixed(2)}L${(Math.cos(a) * r1).toFixed(2)} ${(Math.sin(a) * r1).toFixed(2)}`;
  }
  g.innerHTML = `<path d="${d}" stroke-width="1.75"/>`;
}

/* ------------------------------------------------------------ paper grain -- */
function buildGrain() {
  const w = W, h = H - G.paperTop;
  grainCv.width = Math.round(w * dpr); grainCv.height = Math.round(h * dpr);
  grainCv.style.width = w + 'px'; grainCv.style.height = h + 'px';
  const g = grainCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintGrain(g, w, h, k, grainCv.width, grainCv.height);
}
// paper grain (w × h css px at scale k; pw × ph device px for the fine tile). k is a parameter on purpose:
// the share card paints the same paper at its own scale
function paintGrain(g, w, h, k, pw, ph, fine = true) {
  const R = mulberry(9157);
  // soft mottling
  for (let i = 0; i < 70; i++) {
    const x = R() * w, y = R() * h, r = (20 + R() * 70) * k;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = R() < 0.5;
    gr.addColorStop(0, dark ? 'rgba(120,100,70,0.018)' : 'rgba(255,252,240,0.016)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // faint fibres
  g.lineCap = 'round';
  for (let i = 0; i < 160; i++) {
    const x = R() * w, y = R() * h, len = (4 + R() * 16) * k, a = R() * Math.PI;
    g.strokeStyle = `rgba(110,95,70,${0.025 + R() * 0.05})`;
    g.lineWidth = (0.35 + R() * 0.3) * k;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + (R() - 0.5) * 4 * k, y + Math.sin(a) * len * 0.5 + (R() - 0.5) * 4 * k,
      x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  // specks & dust (density and size distribution matched to the recording at full resolution: ~1 per 190 px²)
  const n = Math.round((w * h) / (190 * k * k));
  for (let i = 0; i < n; i++) {
    const x = R() * w, y = R() * h;
    const s = (0.19 + Math.pow(R(), 5) * 0.55) * k;   // size distribution checked at full resolution (tiny sharp flecks)
    const a = 0.3 + R() * 0.5;
    g.fillStyle = `rgba(${40 + R() * 25 | 0},${32 + R() * 18 | 0},${22 + R() * 12 | 0},${a})`;
    const t = R();
    g.beginPath();
    if (t < 0.45) { g.ellipse(x, y, s, s * (0.6 + R() * 0.5), R() * 3, 0, Math.PI * 2); }
    else if (t < 0.85) { // tiny triangle / chip
      const r2 = s * 1.6, a0 = R() * 6.28;
      g.moveTo(x + Math.cos(a0) * r2, y + Math.sin(a0) * r2);
      g.lineTo(x + Math.cos(a0 + 2.2) * r2, y + Math.sin(a0 + 2.2) * r2);
      g.lineTo(x + Math.cos(a0 + 4.1) * r2 * 0.7, y + Math.sin(a0 + 4.1) * r2 * 0.7);
    } else { // dash / hair
      const a0 = R() * 6.28, l = s * (1.6 + R() * 1.6);
      g.ellipse(x, y, l, s * 0.35, a0, 0, Math.PI * 2);
    }
    g.fill();
  }
  if (!fine) return;
  // fine grain tile
  const tile = document.createElement('canvas'); tile.width = tile.height = 128;
  const tg = tile.getContext('2d'); const id = tg.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = R(); id.data[i] = id.data[i + 1] = id.data[i + 2] = v < 0.5 ? 150 : 255; id.data[i + 3] = (Math.abs(v - 0.5) * 2) * 12;
  }
  tg.putImageData(id, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = g.createPattern(tile, 'repeat');
  g.fillRect(0, 0, pw, ph);
}

/* ---------------------------------------------------------- paper themes -- */
// extra layers for the non-cream papers (cream is the recorded paper and has none): parchment stains and a
// burnt edge, a blueprint grid, light fibres on black paper. Also used by the share picture.
const paperFxCv = document.getElementById('paperFx');
function paintPaperFx(g, w, h, k, id, card) {
  const R = mulberry(4711);
  if (id === 'parchment') {
    const e = g.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.25, w / 2, h * 0.42, Math.max(w, h) * 0.75);
    e.addColorStop(0, 'rgba(120,80,30,0)'); e.addColorStop(0.7, 'rgba(120,80,30,0.12)'); e.addColorStop(1, 'rgba(90,50,15,0.38)');
    g.fillStyle = e; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) {   // stains and foxing

document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  const act = (fn) => { e.preventDefault(); lastActivity = now(); fn(); };
  if (key === 'l' && !e.shiftKey) act(() => { setLamp(!lampOn); AU.lampSwitch(lampOn); refreshPanel(); });
  else if (key === 'p' && !e.shiftKey) act(printDraft);
  else if (key === 'o' && !e.shiftKey) act(() => (sheetOpen === draftsEl ? closeSheet() : openSheet(draftsEl, true)));
  else if (key === ',') act(() => (sheetOpen === panelEl ? closeSheet() : openSheet(panelEl, true)));
  else if (key === 'enter' && e.shiftKey) act(newPage);
  else if (key === 'm' && !e.shiftKey) act(() => { const next = { all: 'fx', fx: 'off', off: 'all' }[AU.mode]; AU.setMode(next); paintSound(); refreshPanel(); toast(next === 'all' ? 'Music and sound on' : next === 'fx' ? 'Music off' : 'Sound off'); });

    renderLightForTest(scale, spread) { const s0 = L.scale; L.scale = scale; sliders.spread = spread; renderLight(); L.scale = s0; },
  };
}

/* --------------------------------------------------------------- boot -- */
function boot() {
  loadDrafts();
  text = (DR.cur.text || '').slice(0, MAX);
  lines = wrap(text);
  input.value = text;
  try { const s = JSON.parse(store.get(LS.sliders, 'null')); if (s) Object.assign(sliders, s); } catch (e) {}
  layout();
  shiftAnim.from = shiftAnim.to = lines.length > 1 ? 1 : 0;
  car.x = car.from = car.to = carriageTarget(); car.dur = 0; lightX = car.x; lastCarX = car.x;
  initWebs();
  setLamp(store.get(LS.lamp, '0') === '1', true);
  onTextChanged();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load(FONT(22)), document.fonts.load('700 22px "Courier Prime"')]).then(() => { invalidateText(); buildCaptions(); buildCapsules(); buildPaperFx(); trayKey = ''; });
  }
  if (!TOUCH) focusInput();
  lastActivity = now();
  blinkT0 = now() + 0.34;
  requestAnimationFrame(frame);
}
boot();
})();
</script>
