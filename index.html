<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Clawd Dance — 8-bit Mascot</title>
<style>
  :root{
    /* pixel unit — scales the whole character with the viewport */
    --u: min(5.4vmin, 30px);
    --orange: #f15a40;
    --orange-dark: #d84428;
    --eye: #0e0e0e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#000;
    color:#f6f6f6;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  .screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    /* soft warm spotlight so the orange pops on pure black */
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(255,120,80,.10), rgba(255,120,80,0) 55%),
      radial-gradient(140% 120% at 50% 120%, rgba(255,255,255,.04), rgba(0,0,0,0) 60%),
      #000;
  }

  /* retro title */
  .title{
    position:absolute; top:6%;
    font-weight:700; letter-spacing:.5em;
    font-size: clamp(18px, 4.4vmin, 40px);
    text-indent:.5em; /* balance the letter-spacing */
    color:#ffd9cf;
    text-shadow: 0 0 1px #f15a40, .12em .12em 0 #7a2413;
  }
  .subtitle{
    position:absolute; top:calc(6% + clamp(26px,6vmin,54px));
    font-size: clamp(9px, 1.8vmin, 13px);
    letter-spacing:.35em; text-indent:.35em;
    color:#8f8f8f;
  }

  /* ---- STAGE: nested wrappers, each carries one simple animation ---- */
  .stage{
    position:relative;
    width: calc(var(--u) * 14);
    height: calc(var(--u) * 14);
    display:flex; align-items:center; justify-content:center;
    perspective: 700px;              /* gives the turn-around depth */
  }

  .glow{
    position:absolute; width: calc(var(--u)*13); height: calc(var(--u)*13);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,110,70,.16), rgba(255,110,70,0) 62%);
    opacity:.55; transition: opacity .09s ease, transform .09s ease;
    pointer-events:none;
  }
  .stage.beat .glow{ opacity:.95; transform:scale(1.06); }

  .shadow{
    position:absolute; bottom: calc(var(--u)*1.1);
    width: calc(var(--u)*8); height: calc(var(--u)*1.5);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 70%);
    filter: blur(1px);
    animation: shadowPulse .5s ease-in-out infinite;
  }

  .sideStep{ animation: sideStep 2s ease-in-out infinite; }
  .spinner { animation: spin 8s ease-in-out infinite; transform-style:preserve-3d; }
  .bouncer { animation: bounce .5s cubic-bezier(.3,.7,.4,1) infinite; }
  .squash  { animation: squash .5s ease-in-out infinite; }

  /* pause everything until the show starts, so it stays in sync with the audio */
  .stage:not(.playing) .sideStep,
  .stage:not(.playing) .spinner,
  .stage:not(.playing) .bouncer,
  .stage:not(.playing) .squash,
  .stage:not(.playing) .shadow,
  .stage:not(.playing) .clawd *{
    animation-play-state: paused !important;
  }

  /* ---- CLAWD, built from flat pixel blocks ---- */
  .clawd{
    position:relative;
    width: calc(var(--u)*10);
    height: calc(var(--u)*9);
  }
  .px{ position:absolute; background:var(--orange); }

  .body{ left:calc(var(--u)*2); top:0; width:calc(var(--u)*6); height:calc(var(--u)*7); }

  .arm{ top:calc(var(--u)*3); width:calc(var(--u)*2); height:calc(var(--u)*2); }
  .arm.l{ left:0;                 transform-origin:right center; animation: wiggleL 1s ease-in-out infinite; }
  .arm.r{ left:calc(var(--u)*8); transform-origin:left center;  animation: wiggleR 1s ease-in-out infinite; }

  .leg{ top:calc(var(--u)*6.6); width:calc(var(--u)*1.2); height:calc(var(--u)*2.2); transform-origin:top center; }
  .leg.a{ left:calc(var(--u)*2.4); animation: stepA 1s ease-in-out infinite; }
  .leg.b{ left:calc(var(--u)*4.4); animation: stepB 1s ease-in-out infinite; }
  .leg.c{ left:calc(var(--u)*6.4); animation: stepA 1s ease-in-out infinite; }

  .eye{ background:var(--eye); top:calc(var(--u)*.9); width:calc(var(--u)*1.3); height:calc(var(--u)*1.5); }
  .eye.l{ left:calc(var(--u)*2.95); }
  .eye.r{ left:calc(var(--u)*5.75); }

  /* ---------------- keyframes (all periods divide 8s → seamless) --------------- */
  @keyframes bounce{
    0%   { transform: translateY(0); }
    40%  { transform: translateY(calc(var(--u)*-1.4)); }   /* up */
    75%  { transform: translateY(0); }                      /* land */
    100% { transform: translateY(0); }
  }
  @keyframes squash{
    0%,100%{ transform: scale(1,1); }
    38%    { transform: scale(.94,1.08); }   /* stretch going up */
    76%    { transform: scale(1.09,.9); }     /* squash on landing */
    88%    { transform: scale(.98,1.02); }
  }
  @keyframes shadowPulse{
    0%,100%{ transform: scaleX(1);   opacity:.55; }
    40%    { transform: scaleX(.72); opacity:.32; }  /* smaller when airborne */
    76%    { transform: scaleX(1.05);opacity:.6; }
  }
  @keyframes sideStep{
    0%   { transform: translateX(0)                     rotate(0deg); }
    25%  { transform: translateX(calc(var(--u)*1.1))    rotate(4deg); }
    50%  { transform: translateX(0)                     rotate(0deg); }
    75%  { transform: translateX(calc(var(--u)*-1.1))   rotate(-4deg); }
    100% { transform: translateX(0)                     rotate(0deg); }
  }
  @keyframes spin{
    0%,78% { transform: rotateY(0deg)   scale(1); }
    90%    { transform: rotateY(180deg) scale(1.07); }  /* turn-around */
    100%   { transform: rotateY(360deg) scale(1); }
  }
  @keyframes wiggleL{
    0%,100%{ transform: rotate(0deg); }
    25%    { transform: rotate(-22deg); }
    50%    { transform: rotate(6deg); }
    75%    { transform: rotate(-14deg); }
  }
  @keyframes wiggleR{
    0%,100%{ transform: rotate(0deg); }
    25%    { transform: rotate(22deg); }
    50%    { transform: rotate(-6deg); }
    75%    { transform: rotate(14deg); }
  }
  @keyframes stepA{
    0%,100%{ transform: translateY(0)               scaleY(1); }
    30%    { transform: translateY(calc(var(--u)*-.5)) scaleY(.82); }
    60%    { transform: translateY(0)               scaleY(1.05); }
  }
  @keyframes stepB{
    0%,100%{ transform: translateY(0)               scaleY(1); }
    55%    { transform: translateY(calc(var(--u)*-.5)) scaleY(.82); }
    80%    { transform: translateY(0)               scaleY(1.05); }
  }

  /* CRT scanlines + vignette overlay */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.14) 3px, rgba(0,0,0,.14) 4px),
      radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
    opacity:.6;
  }

  /* start / controls */
  .start{
    position:absolute; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
    cursor:pointer;
  }
  .start button{
    font: inherit; font-size: clamp(13px, 2.6vmin, 18px); font-weight:700;
    letter-spacing:.2em; color:#0e0e0e; background:var(--orange);
    border:0; padding:.9em 1.6em; cursor:pointer;
    box-shadow: 6px 6px 0 #7a2413;
    image-rendering: pixelated;
    animation: pulseBtn 1s ease-in-out infinite;
  }
  .start button:active{ transform: translate(3px,3px); box-shadow:3px 3px 0 #7a2413; }
  @keyframes pulseBtn{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
  .start.hidden{ display:none; }

  .controls{
    position:absolute; bottom:5%; z-index:8;
    display:flex; gap:12px;
  }
  .controls button{
    font: inherit; font-size: clamp(10px,1.8vmin,13px); letter-spacing:.15em;
    color:#f6f6f6; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25); border-radius:2px;
    padding:.6em 1em; cursor:pointer;
  }
  .controls button:hover{ background:rgba(255,255,255,.16); }

  @media (prefers-reduced-motion: reduce){
    .sideStep,.spinner,.bouncer,.squash,.shadow,.arm,.leg,.start button{ animation-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="title">CLAWD</div>
    <div class="subtitle">♪ NOW DANCING ♪</div>

    <div class="stage" id="stage">
      <div class="glow"></div>
      <div class="shadow"></div>
      <div class="sideStep">
        <div class="spinner">
          <div class="bouncer">
            <div class="squash">
              <div class="clawd">
                <div class="px body"></div>
                <div class="px arm l"></div>
                <div class="px arm r"></div>
                <div class="px leg a"></div>
                <div class="px leg b"></div>
                <div class="px leg c"></div>
                <div class="px eye l"></div>
                <div class="px eye r"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="muteBtn" hidden>🔊 SOUND ON</button>
    </div>

    <div class="start" id="startOverlay">
      <button id="startBtn">▶ START THE SHOW</button>
    </div>
  </div>
  <div class="crt"></div>

<script>
(() => {
  "use strict";

  const stage      = document.getElementById('stage');
  const startOv    = document.getElementById('startOverlay');
  const startBtn   = document.getElementById('startBtn');
  const muteBtn    = document.getElementById('muteBtn');

  /* ============================ 8-BIT AUDIO ENGINE ============================ */
  let ctx, master, comp, noiseBuf;
  let schedTimer = null, nextTime = 0, stepIndex = 0;
  let muted = false, running = false;

  const BPM = 120;
  const STEP = (60 / BPM) / 2;   // eighth note = 0.25s
  const PATTERN = 32;            // 32 eighths = 8s loop (matches the visuals)

  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  // I–V–vi–IV in C major: happy and bouncy. One chord per 2s bar.
  const chords = [
    [60, 64, 67],   // C  E  G
    [55, 59, 62],   // G  B  D
    [57, 60, 64],   // Am A  C  E
    [53, 57, 60],   // F  A  C
  ];
  // arpeggio shape across the 8 steps of a bar (index into the chord, +7 = octave up)
  const arpShape = [0, 1, 2, 9, 2, 1, 2, 10];

  function makeNoise(){
    const len = ctx.sampleRate * 1;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function env(node, t, a, d, peak){
    const g = node.gain;
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(peak, t + a);
    g.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  // tonal blip (square/triangle) with a plucky decay
  function tone(freq, t, dur, vol, type = 'square', glideTo = null){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    env(g, t, 0.006, dur, vol);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function kick(t){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.004, 0.14, 0.9);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.2);
  }

  function noiseHit(t, dur, vol, hp, lp){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const g = ctx.createGain();
    let node = s;
    if (hp){ const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; node.connect(f); node=f; }
    if (lp){ const f = ctx.createBiquadFilter(); f.type='lowpass';  f.frequency.value=lp; node.connect(f); node=f; }
    env(g, t, 0.002, dur, vol);
    node.connect(g).connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }

  const snare = t => { noiseHit(t, 0.14, 0.35, 1400, null); tone(180, t, 0.08, 0.15, 'triangle'); };
  const hat   = (t, accent) => noiseHit(t, accent ? 0.05 : 0.03, accent ? 0.16 : 0.09, 8000, null);

  // tiny "boing" for the hops
  function boing(t){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(680, t + 0.06);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.18);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.26);
  }

  // soft "whoosh" for the spin / turn-around
  function whoosh(t){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(2600, t + 0.35);
    f.frequency.exponentialRampToValueAtTime(500, t + 0.75);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    s.connect(f).connect(g).connect(master);
    s.start(t); s.stop(t + 0.85);
  }

  function scheduleStep(s, t){
    const bar   = Math.floor(s / 8) % 4;
    const chord = chords[bar];
    const inBar = s % 8;

    // drums
    if (s % 4 === 0) kick(t);
    if (s % 4 === 2) snare(t);
    hat(t, s % 2 === 1);

    // bass — root, two octaves down, on every beat
    if (s % 2 === 0) tone(midi(chord[0] - 24), t, 0.42, 0.22, 'square');

    // melody arpeggio — one plucky note per eighth
    const shape = arpShape[inBar];
    const oct   = shape >= 7 ? 12 : 0;
    const note  = chord[(shape % 7) % chord.length] + oct;
    tone(midi(note), t, 0.2, 0.12, 'square', midi(note) * 1.0);
    if (inBar % 2 === 0) tone(midi(note + 12), t, 0.14, 0.05, 'triangle'); // sparkle

    // SFX synced to the choreography
    if (s % 8 === 0) boing(t);   // hop on every downbeat (every 2s)
    if (s === 26)    whoosh(t);  // the turn-around near the end of the loop

    // visual beat pulse locked to the kick
    if (s % 4 === 0){
      const delay = Math.max(0, (t - ctx.currentTime) * 1000);
      setTimeout(() => {
        stage.classList.add('beat');
        setTimeout(() => stage.classList.remove('beat'), 90);
      }, delay);
    }
  }

  function scheduler(){
    while (nextTime < ctx.currentTime + 0.12){
      scheduleStep(stepIndex % PATTERN, nextTime);
      nextTime += STEP;
      stepIndex++;
    }
  }

  function startAudio(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(comp).connect(ctx.destination);
    noiseBuf = makeNoise();

    stepIndex = 0;
    nextTime = ctx.currentTime + 0.08;
    schedTimer = setInterval(scheduler, 25);
  }

  /* ============================ START / CONTROLS ============================ */
  function begin(){
    if (running) return;
    running = true;
    startAudio();
    // launch the visuals in the same tick so they stay locked to the music
    stage.classList.add('playing');
    startOv.classList.add('hidden');
    muteBtn.hidden = false;
  }

  startBtn.addEventListener('click', begin);
  startOv.addEventListener('click', begin);

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ctx.currentTime, 0.02);
    muteBtn.textContent = muted ? '🔇 SOUND OFF' : '🔊 SOUND ON';
  });

  // keep audio alive if the tab is backgrounded then refocused
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx && ctx.state === 'suspended') ctx.resume();
  });
})();
</script>
</body>
</html>
