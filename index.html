<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>@imran</title>
  <meta name="description" content="IMRAN — forever young." />
  <meta name="theme-color" content="#050507" />
  <meta property="og:title" content="IMRAN" />
  <meta property="og:description" content="forever young." />
  <meta property="og:image" content="assets/pfp.jpg" />
  <link rel="icon" href="assets/pfp.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background: your video (poster image shows while it loads) -->
  <div class="bg">
    <video id="bgVideo" class="bg__video" src="assets/bg.mp4" poster="assets/poster.jpg"
           autoplay muted loop playsinline preload="auto"></video>
    <div class="bg__shade"></div>
    <div class="bg__grain"></div>
  </div>
  <canvas id="particles" class="particles" aria-hidden="true"></canvas>

  <!-- Click to enter (needed so browsers allow the music to autoplay) -->
  <div id="enter" class="enter" role="button" tabindex="0" aria-label="Click to enter">
    <div class="enter__inner">
      <p class="enter__text"><span id="enterText"></span><span class="caret">_</span></p>
      <p class="enter__hint">sound on 🔊</p>
    </div>
  </div>

  <main class="stage">
    <article id="card" class="card">
      <div class="card__shine" aria-hidden="true"></div>

      <div class="avatar" id="avatar">
        <div class="avatar__ring" aria-hidden="true"></div>
        <img src="assets/pfp.jpg" alt="IMRAN" class="avatar__img" width="512" height="512" />
        <span class="avatar__status" title="online"></span>
      </div>

      <h1 class="name" data-text="IMRAN">IMRAN</h1>

      <div class="badges">
        <span class="badge" data-tip="Verified">
          <svg viewBox="0 0 24 24"><path d="M12 1.5l2.6 2.1 3.3-.4 1.2 3.1 3.1 1.2-.4 3.3 2.1 2.6-2.1 2.6.4 3.3-3.1 1.2-1.2 3.1-3.3-.4L12 22.5l-2.6-2.1-3.3.4-1.2-3.1-3.1-1.2.4-3.3L.1 12l2.1-2.6-.4-3.3 3.1-1.2 1.2-3.1 3.3.4z"/><path d="M7.5 12.2l3 3 6-6" fill="none" stroke="#050507" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="badge" data-tip="Premium">
          <svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z"/></svg>
        </span>
        <span class="badge" data-tip="Early Supporter">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.8 8.1 3 4 6.9 4c2.2 0 3.7 1.2 5.1 3 1.4-1.8 2.9-3 5.1-3C21 4 23.2 8.1 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
        </span>
        <span class="badge" data-tip="Forever Young">
          <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
        </span>
      </div>

      <p class="bio"><span id="bio"></span><span class="caret caret--bio">|</span></p>

      <div class="meta">
        <span class="meta__item">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
          somewhere, forever
        </span>
        <span class="meta__item">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.4V6h-2v7.4l5.1 3.1 1-1.7z"/></svg>
          <span id="clock">--:--</span>
        </span>
      </div>

      <!-- Socials: replace each "#" with your real profile link -->
      <nav class="socials" aria-label="Social links">
        <a class="social" href="#" target="_blank" rel="noopener" data-tip="Instagram" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.9.9 1.4.2.4.4 1.1.4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.9.7-1.4.9-.4.2-1.1.4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.9-.9-1.4-.2-.4-.4-1.1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.9-.7 1.4-.9.4-.2 1.1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.7a5.1 5.1 0 100 10.2 5.1 5.1 0 000-10.2zm0 8.4a3.3 3.3 0 110-6.6 3.3 3.3 0 010 6.6zm5.3-9.8a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>
        </a>
        <a class="social" href="#" target="_blank" rel="noopener" data-tip="TikTok" aria-label="TikTok">
          <svg viewBox="0 0 24 24"><path d="M16.6 2h-3.3v13.4a2.9 2.9 0 11-2.9-2.9c.3 0 .6 0 .9.1V9.2a6.3 6.3 0 105.3 6.2V8.6a7.7 7.7 0 004.4 1.4V6.7a4.4 4.4 0 01-4.4-4.4z"/></svg>
        </a>
        <button class="social" type="button" id="discordBtn" data-discord="imran" data-tip="Discord · click to copy" aria-label="Copy Discord username">
          <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.6 19.6 0 0015.4 3l-.6 1.3a18 18 0 00-5.6 0L8.6 3a19.6 19.6 0 00-4.9 1.5C.6 9.1-.3 13.7.1 18.2a19.8 19.8 0 006 3l1.3-2a12.7 12.7 0 01-2-1l.5-.4a14 14 0 0012.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.7 19.7 0 006-3c.5-5.2-.8-9.8-3.6-13.8zM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>
        </button>
        <a class="social" href="#" target="_blank" rel="noopener" data-tip="Snapchat" aria-label="Snapchat">
          <svg viewBox="0 0 24 24"><path d="M12.1 2c1.9 0 4.9.9 5.8 4.3.3 1.2.1 2.8 0 3.9.4.2 1 .1 1.5-.2.6-.2 1.2.2 1.2.7 0 .6-.8.9-1.6 1.2-.5.2-1.1.4-1 1 .5 1.5 2.1 3.4 4 3.8.3.1.4.3.3.6-.3.7-1.6 1.1-2.9 1.3-.2.3-.2 1.1-.6 1.3-.5.2-1.4-.2-2.6-.1-1.6.1-2.4 2.2-5 2.2s-3.4-2.1-5-2.2c-1.2-.1-2.1.3-2.6.1-.4-.2-.4-1-.6-1.3-1.3-.2-2.6-.6-2.9-1.3-.1-.3 0-.5.3-.6 1.9-.4 3.5-2.3 4-3.8.1-.6-.5-.8-1-1-.8-.3-1.6-.6-1.6-1.2 0-.5.6-.9 1.2-.7.5.3 1.1.4 1.5.2-.1-1.1-.3-2.7 0-3.9C7.2 2.9 10.2 2 12.1 2z"/></svg>
        </a>
        <a class="social" href="#" target="_blank" rel="noopener" data-tip="YouTube" aria-label="YouTube">
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 00.5 6.2 31 31 0 000 12a31 31 0 00.5 5.8 3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1A31 31 0 0024 12a31 31 0 00-.5-5.8zM9.6 15.6V8.4l6.2 3.6z"/></svg>
        </a>
        <a class="social" href="#" target="_blank" rel="noopener" data-tip="Spotify" aria-label="Spotify">
          <svg viewBox="0 0 24 24"><path d="M12 0a12 12 0 100 24 12 12 0 000-24zm5.5 17.3a.7.7 0 01-1 .3c-2.8-1.7-6.4-2.1-10.6-1.2a.7.7 0 11-.3-1.5c4.6-1 8.5-.6 11.7 1.4.3.2.4.7.2 1zm1.5-3.3a.9.9 0 01-1.3.3c-3.2-2-8.2-2.6-12-1.4a.9.9 0 11-.5-1.8c4.4-1.3 9.8-.7 13.5 1.6.4.3.5.9.3 1.3zm.1-3.4C15.3 8.3 8.9 8.1 5.2 9.2a1.1 1.1 0 11-.6-2.1c4.3-1.3 11.3-1 15.7 1.6a1.1 1.1 0 01-1.2 1.9z"/></svg>
        </a>
      </nav>

      <!-- Music player -->
      <div class="player" id="player">
        <img class="player__cover" src="assets/pfp.jpg" alt="" aria-hidden="true" />
        <div class="player__body">
          <div class="player__top">
            <div class="player__info">
              <span class="player__title">Forever Young</span>
              <span class="player__artist">Alphaville</span>
            </div>
            <canvas id="viz" class="player__viz" width="144" height="36" aria-hidden="true"></canvas>
          </div>
          <div class="player__bar" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="player__fill" id="seekFill"></div>
          </div>
          <div class="player__row">
            <span class="player__time" id="tCur">0:00</span>
            <div class="player__controls">
              <button class="icon-btn" id="back" type="button" aria-label="Back 10 seconds">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>
              </button>
              <button class="icon-btn icon-btn--main" id="play" type="button" aria-label="Play">
                <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
              </button>
              <button class="icon-btn" id="mute" type="button" aria-label="Mute">
                <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg>
                <svg class="i-muted" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0014 8v2.2l2.5 2.5V12zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0021 12a9 9 0 00-7-8.8v2.1a7 7 0 015 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 003.7-1.8l2 2 1.3-1.3L4.3 3zM12 4L9.9 6.1 12 8.2z"/></svg>
              </button>
              <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
            </div>
            <span class="player__time" id="tDur">0:00</span>
          </div>
        </div>
      </div>
    </article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="music" src="assets/forever-young.mp3" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
