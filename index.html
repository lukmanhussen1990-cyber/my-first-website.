<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House · Interactive Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #scene { display: block; width: 100vw; height: 100vh; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0b1020; color: #cdd6f4;
    gap: 18px; z-index: 20; transition: opacity .6s ease;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,255,255,.15);
    border-top-color: #89b4fa; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(15, 20, 40, .55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 14px 18px; color: #eaf0ff; max-width: 280px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #hud h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; margin-bottom: 4px; }
  #hud p { font-size: 12px; opacity: .75; line-height: 1.5; }
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: rgba(15, 20, 40, .55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #controls button {
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
    color: #eaf0ff; padding: 8px 14px; border-radius: 10px; font-size: 13px;
    cursor: pointer; transition: all .2s ease; font-weight: 500;
  }
  #controls button:hover { background: rgba(137,180,250,.25); border-color: #89b4fa; transform: translateY(-1px); }
  #controls button.active { background: #89b4fa; color: #0b1020; border-color: #89b4fa; }
  @media (max-width: 520px) { #hud { max-width: 200px; padding: 10px 12px; } #hud h1 { font-size: 14px; } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Building the house…</div></div>

<div id="hud">
  <h1>🏡 Little Hillside Cottage</h1>
  <p>Drag to orbit · Scroll to zoom · Right-drag to pan. A fully 3D scene rendered in your browser.</p>
</div>

<div id="controls">
  <button id="btnDay" class="active">☀️ Day</button>
  <button id="btnNight">🌙 Night</button>
  <button id="btnRotate" class="active">🔄 Auto-rotate</button>
  <button id="btnReset">🎯 Reset view</button>
</div>

<canvas id="scene"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
const DEFAULT_CAM = new THREE.Vector3(9, 6, 12);
camera.position.copy(DEFAULT_CAM);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2 - 0.03; // don't go under ground
controls.target.set(0, 1.6, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0xbfd7ff, 0x4a3f35, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff2d6, 2.1);
sun.position.set(12, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.0004;
scene.add(sun);

// warm glow from windows at night
const windowGlow = new THREE.PointLight(0xffcc66, 0, 8, 2);
windowGlow.position.set(0, 2, 0);
scene.add(windowGlow);

/* ---------- Materials ---------- */
const matWall     = new THREE.MeshStandardMaterial({ color: 0xf3e9d2, roughness: 0.9 });
const matTrim     = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
const matRoof     = new THREE.MeshStandardMaterial({ color: 0x8c3b2e, roughness: 0.8 });
const matDoor     = new THREE.MeshStandardMaterial({ color: 0x5b3a29, roughness: 0.7 });
const matGlass    = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, roughness: 0.15, metalness: 0.1, emissive: 0x000000 });
const matChimney  = new THREE.MeshStandardMaterial({ color: 0x9c5b4a, roughness: 0.95 });
const matStone    = new THREE.MeshStandardMaterial({ color: 0xb8b2a8, roughness: 1.0 });
const matWood     = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.85 });
const matLeaf     = new THREE.MeshStandardMaterial({ color: 0x3f7d3b, roughness: 1.0 });

/* ---------- Ground ---------- */
const groundGeo = new THREE.CircleGeometry(40, 64);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x6ba34f, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// subtle dirt path to the door
const path = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 8),
  new THREE.MeshStandardMaterial({ color: 0xc2a878, roughness: 1 })
);
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.01, 6);
path.receiveShadow = true;
scene.add(path);

/* ---------- House group ---------- */
const house = new THREE.Group();
scene.add(house);

// Base / body of the house
const bodyW = 6, bodyH = 3.2, bodyD = 5;
const body = new THREE.Mesh(new THREE.BoxGeometry(bodyW, bodyH, bodyD), matWall);
body.position.y = bodyH / 2;
body.castShadow = true; body.receiveShadow = true;
house.add(body);

// Stone foundation
const foundation = new THREE.Mesh(new THREE.BoxGeometry(bodyW + 0.3, 0.5, bodyD + 0.3), matStone);
foundation.position.y = 0.25;
foundation.castShadow = true; foundation.receiveShadow = true;
house.add(foundation);

// Gabled roof (triangular prism) built from a shape + extrude
const roofShape = new THREE.Shape();
roofShape.moveTo(-(bodyW/2 + 0.4), 0);
roofShape.lineTo(bodyW/2 + 0.4, 0);
roofShape.lineTo(0, 2.4);
roofShape.lineTo(-(bodyW/2 + 0.4), 0);
const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: bodyD + 0.8, bevelEnabled: false });
roofGeo.translate(0, 0, -(bodyD + 0.8) / 2);
const roof = new THREE.Mesh(roofGeo, matRoof);
roof.position.y = bodyH;
roof.castShadow = true; roof.receiveShadow = true;
house.add(roof);

// Gable trim triangles (front & back) to close the peaks nicely
function gable(zPos) {
  const g = new THREE.Shape();
  g.moveTo(-(bodyW/2 + 0.4), 0);
  g.lineTo(bodyW/2 + 0.4, 0);
  g.lineTo(0, 2.4);
  g.lineTo(-(bodyW/2 + 0.4), 0);
  const gm = new THREE.Mesh(new THREE.ShapeGeometry(g), matWall);
  gm.position.set(0, bodyH, zPos);
  gm.castShadow = true;
  return gm;
}
// (roof already spans; the gable faces are covered by body top — add thin fill just in case)

// Chimney
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.2, 0.7), matChimney);
chimney.position.set(1.7, bodyH + 1.6, -0.8);
chimney.castShadow = true;
house.add(chimney);
const chimTop = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.9), matStone);
chimTop.position.set(1.7, bodyH + 2.75, -0.8);
chimTop.castShadow = true;
house.add(chimTop);

/* ---------- Door ---------- */
const doorGroup = new THREE.Group();
const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 0.12), matDoor);
door.position.set(0, 1.05, bodyD/2 + 0.02);
door.castShadow = true;
doorGroup.add(door);
// door frame
const frame = new THREE.Mesh(new THREE.BoxGeometry(1.35, 2.35, 0.16), matTrim);
frame.position.set(0, 1.15, bodyD/2 - 0.01);
doorGroup.add(frame);
frame.renderOrder = -1;
// door knob
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.3 }));
knob.position.set(0.4, 1.05, bodyD/2 + 0.1);
doorGroup.add(knob);
// two steps
for (let i = 0; i < 2; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.6 + i*0.4, 0.2, 0.5 + i*0.3), matStone);
  step.position.set(0, 0.1 + (1 - i) * 0.2, bodyD/2 + 0.3 + i * 0.35);
  step.castShadow = true; step.receiveShadow = true;
  doorGroup.add(step);
}
house.add(doorGroup);

/* ---------- Windows ---------- */
function makeWindow(x, y, z, ry = 0) {
  const wg = new THREE.Group();
  const frameW = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.14), matTrim);
  wg.add(frameW);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.95, 0.16), matGlass);
  glass.position.z = 0.01;
  glass.name = 'glass';
  wg.add(glass);
  // muntins (cross bars)
  const barV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 0.18), matTrim);
  const barH = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 0.18), matTrim);
  wg.add(barV, barH);
  // flower box
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.25, 0.3), matWood);
  box.position.set(0, -0.75, 0.15);
  box.castShadow = true;
  wg.add(box);
  wg.position.set(x, y, z);
  wg.rotation.y = ry;
  return wg;
}
// front windows (either side of door)
house.add(makeWindow(-2, 1.8, bodyD/2 + 0.02));
house.add(makeWindow( 2, 1.8, bodyD/2 + 0.02));
// side windows
house.add(makeWindow(-bodyW/2 - 0.02, 1.8, 0, Math.PI/2));
house.add(makeWindow( bodyW/2 + 0.02, 1.8, 0, -Math.PI/2));

/* ---------- Trees & bushes ---------- */
function makeTree(x, z, scale = 1) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 1.4, 8), matWood);
  trunk.position.y = 0.7; trunk.castShadow = true;
  t.add(trunk);
  const cols = [0x2f6d2b, 0x3f7d3b, 0x4c9142];
  for (let i = 0; i < 3; i++) {
    const foliage = new THREE.Mesh(
      new THREE.SphereGeometry(0.9 - i * 0.15, 12, 12),
      new THREE.MeshStandardMaterial({ color: cols[i], roughness: 1 })
    );
    foliage.position.y = 1.5 + i * 0.55;
    foliage.castShadow = true;
    t.add(foliage);
  }
  t.position.set(x, 0, z);
  t.scale.setScalar(scale);
  return t;
}
scene.add(makeTree(-6, -3, 1.3));
scene.add(makeTree(7, -4, 1.0));
scene.add(makeTree(-7, 4, 0.85));
scene.add(makeTree(6.5, 5, 1.15));

function makeBush(x, z) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), matLeaf);
  b.scale.y = 0.7;
  b.position.set(x, 0.35, z);
  b.castShadow = true;
  return b;
}
scene.add(makeBush(-3.2, 3.3));
scene.add(makeBush(3.2, 3.3));
scene.add(makeBush(-3.6, 3.0));
scene.add(makeBush(3.6, 3.0));

// scattered rocks
for (let i = 0; i < 6; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.2),
    new THREE.MeshStandardMaterial({ color: 0x9a938a, roughness: 1 }));
  const a = Math.random() * Math.PI * 2, d = 8 + Math.random() * 6;
  r.position.set(Math.cos(a) * d, 0.15, Math.sin(a) * d);
  r.castShadow = true; r.receiveShadow = true;
  scene.add(r);
}

/* ---------- Clouds ---------- */
const clouds = new THREE.Group();
function makeCloud(x, y, z) {
  const c = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.9 });
  for (let i = 0; i < 4; i++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.8 + Math.random() * 0.5, 10, 10), m);
    puff.position.set(i * 0.9 - 1.3, Math.random() * 0.3, Math.random() * 0.6);
    c.add(puff);
  }
  c.position.set(x, y, z);
  return c;
}
clouds.add(makeCloud(-10, 12, -8));
clouds.add(makeCloud(9, 14, -12));
clouds.add(makeCloud(0, 15, 14));
scene.add(clouds);

/* ---------- Sky ---------- */
function setSky(top, bottom) {
  scene.background = new THREE.Color(bottom);
}
setSky(0x4a90d9, 0x9fd0ff);
scene.fog = new THREE.Fog(0xbfe0ff, 30, 70);

/* ---------- Day / Night ---------- */
const glassMeshes = [];
house.traverse(o => { if (o.name === 'glass') glassMeshes.push(o); });

function setDay() {
  scene.background = new THREE.Color(0x9fd0ff);
  scene.fog.color.set(0xbfe0ff);
  sun.intensity = 2.1; sun.color.set(0xfff2d6);
  hemi.intensity = 0.55; ambient.intensity = 0.25;
  windowGlow.intensity = 0;
  glassMeshes.forEach(g => g.material.emissive.set(0x000000));
  clouds.visible = true;
}
function setNight() {
  scene.background = new THREE.Color(0x0b1230);
  scene.fog.color.set(0x0b1230);
  sun.intensity = 0.25; sun.color.set(0x8fb0ff);
  hemi.intensity = 0.15; ambient.intensity = 0.08;
  windowGlow.intensity = 2.5;
  glassMeshes.forEach(g => g.material.emissive.set(0xffb347));
  clouds.visible = false;
}

// stars (only visible at night via being far away & dark bg)
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 600; i++) {
  const r = 60;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(Math.random());
  starVerts.push(Math.sin(ph) * Math.cos(th) * r, Math.abs(Math.cos(ph)) * r, Math.sin(ph) * Math.sin(th) * r);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25 }));
scene.add(stars);

/* ---------- UI ---------- */
const btnDay = document.getElementById('btnDay');
const btnNight = document.getElementById('btnNight');
const btnRotate = document.getElementById('btnRotate');
const btnReset = document.getElementById('btnReset');

btnDay.addEventListener('click', () => { setDay(); btnDay.classList.add('active'); btnNight.classList.remove('active'); });
btnNight.addEventListener('click', () => { setNight(); btnNight.classList.add('active'); btnDay.classList.remove('active'); });
btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('active', controls.autoRotate);
});
btnReset.addEventListener('click', () => {
  camera.position.copy(DEFAULT_CAM);
  controls.target.set(0, 1.6, 0);
});

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  clouds.children.forEach((c, i) => { c.position.x += 0.004 * (i % 2 ? 1 : -0.7); if (c.position.x > 18) c.position.x = -18; });
  controls.update();
  renderer.render(scene, camera);
}
animate();

// hide loader once first frame is ready
requestAnimationFrame(() => {
  const l = document.getElementById('loading');
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 600);
});
</script>
</body>
</html>
