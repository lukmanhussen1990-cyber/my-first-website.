<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alien PFP</title>
  <style>
    :root { --bg: #05030f; --fg: #e8e6ff; --accent: #00f0ff; --accent2: #ff2ad4; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #140b33 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
    }
    main { text-align: center; }
    .pfp {
      width: min(80vw, 360px); aspect-ratio: 1; border-radius: 50%;
      box-shadow: 0 0 40px rgba(0,240,255,.35), 0 0 90px rgba(255,42,212,.25);
      animation: float 5s ease-in-out infinite;
    }
    .pfp img { width: 100%; height: 100%; display: block; border-radius: 50%; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    h1 { margin: 28px 0 6px; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: .08em; text-transform: uppercase;
         background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: 0 0 20px; opacity: .75; }
    a.btn {
      display: inline-block; padding: 10px 20px; border-radius: 999px; text-decoration: none; color: var(--bg); font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
  </style>
</head>
<body>
  <main>
    <div class="pfp"><img src="alien-pfp.svg" alt="Neon alien profile picture"></div>
    <h1>Neon Alien</h1>
    <p>A profile picture drawn 100% in SVG code.</p>
    <a class="btn" href="alien-pfp.svg" download="alien-pfp.svg">Download SVG</a>
  </main>
</body>
</html>
