<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07171d">
<meta name="description" content="What Is an Ecosystem? An interactive animated lesson for Grade 8.">
<title>What Is an Ecosystem? — Interactive Lesson</title>
<style>
:root{
  --ink:#eafcf6;
  --ink-dim:#a9c7c2;
  --panel:linear-gradient(180deg,rgba(10,30,36,.90),rgba(5,17,23,.95));
  --edge:rgba(140,255,220,.20);
  --glow:0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
  --green:#2ee0a2;
  --green2:#12a97a;
  --sun:#ffd257;
  --blue:#57c8ff;
  --pink:#ff86c8;
  --bad:#ff7a6b;
  --r:18px;
  --safeb:env(safe-area-inset-bottom,0px);
  --safet:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04121a;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD scaffold ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--glow)}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:calc(8px + var(--safet));left:8px;right:8px;
  display:flex;gap:8px;align-items:center;pointer-events:none}
#topbar > *{pointer-events:auto}
#chapTag{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--glow);max-width:62vw}
#chapNum{font-size:11px;font-weight:800;letter-spacing:.12em;color:#0a2018;
  background:linear-gradient(180deg,var(--green),var(--green2));padding:4px 8px;border-radius:8px;white-space:nowrap}
#chapName{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;min-width:42px;border-radius:13px;border:1px solid var(--edge);
  background:var(--panel);box-shadow:var(--glow);color:var(--ink);font-size:19px;line-height:1;
  display:grid;place-items:center;cursor:pointer;transition:transform .14s ease,background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.55}

/* ---------- caption / narration ---------- */
#caption{position:absolute;left:50%;transform:translateX(-50%) translateY(16px);
  bottom:calc(10px + var(--safeb));width:min(760px,calc(100vw - 16px));
  background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--glow);
  padding:12px 14px 10px;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,.9,.3,1),visibility .35s}
#caption.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#capRow{display:flex;gap:10px;align-items:flex-start}
#capIcon{width:34px;height:34px;min-width:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:radial-gradient(circle at 30% 25%,#2ee0a2,#0e7d5c);box-shadow:0 0 16px rgba(46,224,162,.45)}
#capText{font-size:clamp(15px,3.9vw,19px);line-height:1.35;font-weight:600;letter-spacing:.01em;
  min-height:2.7em;display:block;padding-top:2px}
#capText b{color:var(--sun)}
#capText i{font-style:normal;color:var(--blue)}
#capText u{text-decoration:none;color:var(--green)}
#capBar{display:flex;align-items:center;gap:8px;margin-top:8px}
#dots{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.20);transition:all .3s}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);width:18px}
.dot.done{background:rgba(46,224,162,.5)}
.btn{border:0;border-radius:13px;padding:10px 15px;font-size:14px;font-weight:800;cursor:pointer;
  color:#06241a;background:linear-gradient(180deg,#39eeb0,#10a075);box-shadow:0 6px 18px rgba(16,160,117,.35);
  transition:transform .13s ease,filter .2s;letter-spacing:.02em;white-space:nowrap}
.btn:active{transform:scale(.94)}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid var(--edge);box-shadow:none}
.btn.warn{background:linear-gradient(180deg,#ff9a86,#e8543d);color:#2a0b06}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:11px}

/* ---------- tool docks ---------- */
#tools{position:absolute;left:8px;right:8px;bottom:calc(112px + var(--safeb));
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#tools > *{pointer-events:auto}
.dock{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:16px;
  background:var(--panel);border:1px solid var(--edge);box-shadow:var(--glow);
  max-width:min(720px,calc(100vw - 16px));opacity:0;transform:translateY(10px);
  transition:opacity .3s,transform .3s;display:none}
.dock.show{display:flex;opacity:1;transform:translateY(0)}
.chip{border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);
  border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:transform .13s,background .2s,border-color .2s;min-height:40px}
.chip:active{transform:scale(.93)}
.chip.on{background:linear-gradient(180deg,rgba(46,224,162,.30),rgba(18,169,122,.18));border-color:rgba(46,224,162,.65);
  box-shadow:0 0 16px rgba(46,224,162,.28)}
.chip.gone{background:linear-gradient(180deg,rgba(255,122,107,.30),rgba(180,50,40,.18));border-color:rgba(255,122,107,.6)}
.chip .em{font-size:16px}

/* day-night slider */
#dayDock{flex-direction:column;gap:6px;width:min(520px,calc(100vw - 22px))}
#dnRow{display:flex;align-items:center;gap:10px;width:100%}
#dnRow span{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;
  background:linear-gradient(90deg,#0b1e3a,#2a5f9e,#7fc7ff,#ffd257,#ff9d5c,#3b2a6b,#0b1230)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;
  background:linear-gradient(90deg,#0b1e3a,#2a5f9e,#7fc7ff,#ffd257,#ff9d5c,#3b2a6b,#0b1230)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:99px;margin-top:-7px;
  background:radial-gradient(circle at 32% 30%,#fff,#cfeee4);border:2px solid #0d3a2c;box-shadow:0 3px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:99px;
  background:radial-gradient(circle at 32% 30%,#fff,#cfeee4);border:2px solid #0d3a2c}
#dnLabel{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ink-dim);text-align:center}

/* ---------- info card ---------- */
#infoCard{position:absolute;left:50%;transform:translate(-50%,24px) scale(.96);
  bottom:calc(112px + var(--safeb));width:min(420px,calc(100vw - 20px));
  background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--glow);
  padding:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s cubic-bezier(.2,.9,.3,1)}
#infoCard.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#icTop{display:flex;gap:11px;align-items:center}
#icEmoji{width:52px;height:52px;min-width:52px;border-radius:16px;display:grid;place-items:center;font-size:29px;
  background:rgba(255,255,255,.08);border:1px solid var(--edge)}
#icName{font-size:19px;font-weight:800;letter-spacing:.01em}
#icTag{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.09em;
  padding:3px 9px;border-radius:99px}
#icTag.bio{background:rgba(46,224,162,.20);color:#7dfbcd;border:1px solid rgba(46,224,162,.45)}
#icTag.abio{background:rgba(87,200,255,.18);color:#a5e2ff;border:1px solid rgba(87,200,255,.45)}
#icBody{margin-top:10px;font-size:14.5px;line-height:1.45;color:#dbf3ec}
#icJob{margin-top:9px;font-size:13px;line-height:1.4;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
#icJob b{color:var(--sun)}
#icClose{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;border:1px solid var(--edge);
  background:rgba(255,255,255,.08);color:var(--ink);font-size:16px;cursor:pointer;display:grid;place-items:center}

/* ---------- big banner text ---------- */
#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:min(1000px,94vw);
  text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#bTitle{font-size:clamp(28px,10.5vw,96px);font-weight:900;letter-spacing:.10em;line-height:1;
  background:linear-gradient(180deg,#ffffff,#9df7d6 60%,#2ee0a2);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 6px 26px rgba(0,0,0,.55))}
#bSub{margin-top:10px;font-size:clamp(13px,3.4vw,19px);font-weight:700;color:#dff8ef;
  text-shadow:0 3px 14px rgba(0,0,0,.7);letter-spacing:.04em}

/* ---------- split labels (biotic/abiotic) ---------- */
.sideLabel{position:absolute;top:calc(66px + var(--safet));width:44%;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .5s,transform .5s}
.sideLabel.show{opacity:1}
#sideL{left:2%}#sideR{right:2%}
.sideLabel .t{font-size:clamp(18px,5.4vw,34px);font-weight:900;letter-spacing:.12em;
  text-shadow:0 4px 18px rgba(0,0,0,.6)}
.sideLabel .s{font-size:clamp(11px,2.9vw,15px);font-weight:700;opacity:.92;margin-top:2px;
  text-shadow:0 3px 12px rgba(0,0,0,.7)}
#sideL .t{color:#8ff9cf}#sideR .t{color:#a9defc}

/* ---------- population meters ---------- */
#meters{position:absolute;right:8px;top:calc(60px + var(--safet));width:150px;padding:10px;overflow:hidden;
  background:var(--panel);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--glow);
  display:none;opacity:0;transition:opacity .35s}
#meters.show{display:block;opacity:1}
.meter{margin-bottom:8px}
.meter:last-child{margin-bottom:0}
.meter .lab{display:flex;justify-content:space-between;gap:6px;font-size:10px;font-weight:800;letter-spacing:.02em;
  color:var(--ink-dim);margin-bottom:4px;white-space:nowrap}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .5s ease}
.bar.p i{background:linear-gradient(90deg,#2ee0a2,#7dffcb)}
.bar.h i{background:linear-gradient(90deg,#ffd257,#ffe9a8)}
.bar.c i{background:linear-gradient(90deg,#ff9a86,#ffd0c4)}

/* ---------- quiz ---------- */
#quiz{position:absolute;left:50%;transform:translateX(-50%) translateY(16px);
  bottom:calc(10px + var(--safeb));width:min(760px,calc(100vw - 16px));
  background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--glow);
  padding:12px 14px;opacity:0;display:none;transition:opacity .3s,transform .3s}
#quiz.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
#qHead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#qBadge{font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;
  background:rgba(255,210,87,.18);color:#ffdf95;border:1px solid rgba(255,210,87,.4)}
#qScore{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink-dim)}
#qText{font-size:clamp(15px,3.9vw,19px);font-weight:700;line-height:1.35}
#qOpts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.opt{flex:1 1 46%;min-width:130px;text-align:left;border:1px solid var(--edge);background:rgba(255,255,255,.07);
  color:var(--ink);border-radius:13px;padding:11px 12px;font-size:13.5px;font-weight:700;cursor:pointer;
  transition:transform .13s,background .25s,border-color .25s}
.opt:active{transform:scale(.97)}
.opt.right{background:linear-gradient(180deg,rgba(46,224,162,.34),rgba(18,169,122,.2));border-color:#2ee0a2}
.opt.wrong{background:linear-gradient(180deg,rgba(255,122,107,.30),rgba(180,50,40,.18));border-color:#ff7a6b}
#qHint{margin-top:9px;font-size:13.5px;line-height:1.4;padding:9px 11px;border-radius:12px;display:none;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}
#qHint.show{display:block}
#qHint.good{background:rgba(46,224,162,.14);border-color:rgba(46,224,162,.4)}
#qHint.bad{background:rgba(255,122,107,.13);border-color:rgba(255,122,107,.38)}
#qFoot{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
.shake{animation:shk .42s}
@keyframes shk{10%,90%{transform:translateX(-50%) translateX(-2px)}30%,70%{transform:translateX(-50%) translateX(5px)}50%{transform:translateX(-50%) translateX(-5px)}}

/* ---------- chapter menu ---------- */
#menu{position:absolute;inset:0;background:rgba(3,12,17,.72);opacity:0;pointer-events:none;
  transition:opacity .3s;display:grid;place-items:center;padding:14px}
#menu.show{opacity:1;pointer-events:auto}
#menuCard{width:min(520px,100%);max-height:82vh;overflow-y:auto;padding:14px;
  background:var(--panel);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--glow);
  -webkit-overflow-scrolling:touch}
#menuCard h3{margin:2px 0 10px;font-size:15px;letter-spacing:.12em;color:var(--ink-dim);font-weight:800}
.mItem{display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:6px;transition:background .2s,transform .12s}
.mItem:active{transform:scale(.98)}
.mItem.cur{background:linear-gradient(90deg,rgba(46,224,162,.25),rgba(46,224,162,.05));border-color:rgba(46,224,162,.5)}
.mItem .n{width:26px;height:26px;min-width:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;
  font-weight:800;background:rgba(255,255,255,.09)}
.mItem .tt{font-size:14px;font-weight:700}
.mItem .ss{font-size:11.5px;color:var(--ink-dim);margin-top:1px}

/* ---------- start screen ---------- */
#start{position:absolute;inset:0;display:grid;place-items:center;padding:18px;
  background:radial-gradient(120% 90% at 50% 40%,rgba(3,18,24,.14),rgba(2,10,15,.72));
  transition:opacity .7s;z-index:9}
#start.hide{opacity:0;pointer-events:none}
#sCard{text-align:center;max-width:min(900px,94vw)}
#sTitle{font-size:clamp(28px,10.5vw,92px);font-weight:900;letter-spacing:.10em;line-height:.98;
  background:linear-gradient(180deg,#fff,#a6ffe0 55%,#20d79a);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 8px 30px rgba(0,0,0,.6));animation:pop 1s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.9)}to{opacity:1;transform:none}}
#sSub{margin-top:8px;font-size:clamp(13px,3.6vw,18px);font-weight:700;color:#d9f6ec;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#sGo{margin-top:22px;font-size:17px;padding:15px 30px;border-radius:99px}
#sHint{margin-top:14px;font-size:12px;color:#9dbdb7;letter-spacing:.05em}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 6px 18px rgba(16,160,117,.35)}50%{box-shadow:0 6px 34px rgba(46,224,162,.75)}}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;top:calc(64px + var(--safet));transform:translateX(-50%) translateY(-12px);
  padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--edge);box-shadow:var(--glow);
  font-size:14px;font-weight:700;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;
  max-width:calc(100vw - 24px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- tap ripple ---------- */
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:99px;
  border:2px solid rgba(255,255,255,.85);pointer-events:none;animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(3.4);opacity:0}}

@media (max-width:420px){
  #capText{min-height:3.4em}
  .chip{padding:8px 10px;font-size:12px}
  #tools{bottom:calc(120px + var(--safeb))}
}
@media (min-width:900px){
  #caption{padding:14px 16px 12px}
}
/* short screens (phone held sideways): shrink the chrome so the world stays visible */
@media (max-height:540px){
  #caption{padding:8px 11px 7px;border-radius:15px}
  #capText{font-size:15px;min-height:0;line-height:1.3}
  #capIcon{width:28px;height:28px;min-width:28px;font-size:15px;border-radius:9px}
  #capBar{margin-top:6px}
  #capRow{gap:8px}
  .btn.sm{padding:7px 11px;font-size:12.5px}
  .iconbtn{width:36px;height:36px;min-width:36px;font-size:16px;border-radius:11px}
  #chapTag{padding:5px 9px}
  #chapName{font-size:12px}
  #banner{top:28%}
  #infoCard{width:min(380px,calc(100vw - 20px));padding:11px}
  #icEmoji{width:40px;height:40px;min-width:40px;font-size:22px}
  #icName{font-size:16px}
  #icBody{font-size:13px;margin-top:7px}
  #icJob{font-size:12.5px;padding:7px 9px;margin-top:7px}
  #qText{font-size:15px}
  .opt{padding:8px 10px;font-size:12.5px}
  .chip{padding:7px 10px;font-size:12px;min-height:34px}
  #meters{width:148px;padding:8px;top:calc(50px + var(--safet))}
  .meter .lab{font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .pulse{animation:none}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Animated ecosystem scene"></canvas>

<div id="hud">

  <div id="topbar">
    <div id="chapTag"><span id="chapNum">1 / 13</span><span id="chapName">Welcome</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSound" title="Sound on/off" aria-label="Toggle sound">🔊</button>
    <button class="iconbtn" id="btnMenu" title="Chapters" aria-label="Open chapter menu">☰</button>
  </div>

  <div id="banner"><div id="bTitle">ECOSYSTEM</div><div id="bSub"></div></div>

  <div id="sideL" class="sideLabel"><div class="t">BIOTIC</div><div class="s">Living things</div></div>
  <div id="sideR" class="sideLabel"><div class="t">ABIOTIC</div><div class="s">Non-living things</div></div>

  <div id="meters">
    <div class="meter"><div class="lab"><span>🌿 PLANTS</span><span id="mP">100%</span></div><div class="bar p"><i id="bP"></i></div></div>
    <div class="meter"><div class="lab"><span>🐇 PLANT EATERS</span><span id="mH">100%</span></div><div class="bar h"><i id="bH"></i></div></div>
    <div class="meter"><div class="lab"><span>🐅 MEAT EATERS</span><span id="mC">100%</span></div><div class="bar c"><i id="bC"></i></div></div>
  </div>

  <div id="tools">
    <div class="dock" id="dockRemove"></div>
    <div class="dock" id="dockWeather"></div>
    <div class="dock" id="dockBiome"></div>
    <div class="dock" id="dockPart"></div>
    <div class="dock" id="dayDock">
      <div id="dnRow"><span>🌙</span><input id="dnSlider" type="range" min="0" max="1000" value="500" aria-label="Day and night slider"><span>☀️</span></div>
      <div id="dnLabel">MIDDAY</div>
    </div>
  </div>

  <div id="infoCard">
    <button id="icClose" aria-label="Close">✕</button>
    <div id="icTop"><div id="icEmoji">🌳</div><div><div id="icName">Tree</div><span id="icTag" class="bio">LIVING</span></div></div>
    <div id="icBody"></div>
    <div id="icJob"></div>
  </div>

  <div id="quiz">
    <div id="qHead"><span id="qBadge">CHALLENGE</span><span id="qScore">0 / 6</span></div>
    <div id="qText"></div>
    <div id="qOpts"></div>
    <div id="qHint"></div>
    <div id="qFoot"><button class="btn ghost sm" id="qSkip">Skip</button><button class="btn sm" id="qNext">Next →</button></div>
  </div>

  <div id="caption">
    <div id="capRow">
      <div id="capIcon">🌿</div>
      <div id="capText"></div>
    </div>

<script>
"use strict";
/* =====================================================================
   WHAT IS AN ECOSYSTEM?  —  single-file interactive lesson

/* ------------------------------ 0. utils ---------------------------- */
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }

/* --------------------------- 1. canvas & camera --------------------- */
const cv = $('#stage');
const ctx = cv.getContext('2d', { alpha: false, desynchronized: true });

const W = 1600, H = 1300;          // world units
const GY = 700;                    // ground line

let vw = 0, vh = 0, dpr = 1, baseScale = 1, viewW = 1200, viewH = 900;

// quality tier: 2 = full, 1 = medium, 0 = light

})();

// The world is worth looking at from y=-300 (open sky) down to y=1030 (pond floor).
// Zooming out is allowed until that whole band is on screen; the free camera is then

const Y_TOP = -300, Y_BOT = 1030;

function resize() {

  viewW = vw / baseScale;

// world <-> screen
function w2s(x, y) { const S = baseScale * cam.z; return [(x - cam.x) * S + vw / 2, (y - cam.y) * S + vh / 2]; }

  splash() { this.blip(320, .18, 'sine', .10, -180); },
  good() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, .16, 'triangle', .12), i * 78)); },
  bad() { this.blip(220, .22, 'sawtooth', .07, -70); },
  tap() { this.blip(880, .06, 'triangle', .07); },
  whoosh() { this.blip(180, .35, 'sine', .06, 420); },

/* ---------------------------- 3. world state ------------------------ */
let now = 0, dt = 0, frame = 0;
let scene = 'land';                 // 'land' | 'water'
let weather = 'sun';                // 'sun' | 'rain' | 'wind'
let windPower = 0.35;               // 0..1
let dayT = 0.5;                     // 0 = midnight, .25 sunrise, .5 midday, .75 sunset
let connMode = false, connT = 0;
let focusId = null;                 // highlighted / selected entity
let pulseId = null, pulseT = 0;     // attention pulse
let quizMode = null;                // active quiz question when tapping in-scene
let biomeView = null;               // 'forest'|'pond'|'ocean'|'desert'|'grass'
let biomeT = 0;

const env = { light: 1, warm: 1, wet: 0, sky: [0, 0, 0], amb: [0, 0, 0] };

// simulation health values (1 = healthy)
const sim = {
  light: 1, water: 1, plants: 1, herb: 1, pred: 1, insects: 1, soil: 1,
  t: { light: 1, water: 1, plants: 1, herb: 1, pred: 1, insects: 1, soil: 1 },
  removed: {},
  step(d) {
    const k = 1 - Math.pow(0.06, d);
    for (const key of ['light', 'water', 'plants', 'herb', 'pred', 'insects', 'soil'])
      this[key] = lerp(this[key], this.t[key], k);
  },
  reset() { for (const k in this.t) this.t[k] = 1; this.removed = {}; }
};

/* palettes for sky at 4 times of day  (top, mid, bottom) */
const SKY = [
  { t: 0.00, a: '#050a1c', b: '#0a1330', c: '#101c3a', l: 0.10 },  // night
  { t: 0.22, a: '#2a2350', b: '#7a4a6a', c: '#e0865f', l: 0.42 },  // dawn
  { t: 0.33, a: '#2f7ec8', b: '#7cc4ee', c: '#cdeaf7', l: 0.92 },  // morning
  { t: 0.50, a: '#2a86d8', b: '#63b6ea', c: '#bfe6f5', l: 1.00 },  // midday
  { t: 0.68, a: '#2f6fbe', b: '#8fb6dd', c: '#ffd9a8', l: 0.85 },  // afternoon
  { t: 0.79, a: '#3b2a63', b: '#c25f6a', c: '#ffb268', l: 0.40 },  // sunset
  { t: 0.90, a: '#0d1233', b: '#1b1f45', c: '#2b2a53', l: 0.16 },  // dusk
  { t: 1.00, a: '#050a1c', b: '#0a1330', c: '#101c3a', l: 0.10 }
];
function skyAt(t) {
  let i = 0; while (i < SKY.length - 2 && t > SKY[i + 1].t) i++;
  const A = SKY[i], B = SKY[i + 1], f = smooth(clamp(inv(A.t, B.t, t), 0, 1));
  return { a: mix(A.a, B.a, f), b: mix(A.b, B.b, f), c: mix(A.c, B.c, f), l: lerp(A.l, B.l, f) };
}
function updateEnv(d) {
  const s = skyAt(dayT);
  let l = s.l * (weather === 'rain' ? 0.62 : 1) * sim.light;
  env.light = lerp(env.light, l, 1 - Math.pow(0.02, d));
  const dark = weather === 'rain' ? 0.72 : 1;
  const gl = 0.35 + 0.65 * sim.light;
  env.skyA = shade(s.a, dark * gl); env.skyB = shade(s.b, dark * gl); env.skyC = shade(s.c, dark * gl);
  env.wet = lerp(env.wet, weather === 'rain' ? 1 : 0, d * 0.35);

// tint any colour by the current light level (cheap day/night shading).
// called several hundred times per frame, so both the hex parse and the
// resulting colour string are cached.
const _rgbCache = Object.create(null), _litCache = Object.create(null);
function RGBc(h) { return _rgbCache[h] || (_rgbCache[h] = RGB(h)); }
function lit(hex, extra) {

  return `rgb(${(r + (tr - r) * t) | 0},${(g + (tg - g) * t) | 0},${(b + (tb - b) * t) | 0})`;

/* ------------------------ 4. environment artwork -------------------- */
// wind sway helper

}

const onWater = (x) => terrainY(x) > WATER_Y + 4;

/* ---- sky, sun, moon, stars ---- */
function drawSky() {

const clouds = [];

  }

  const dark = weather === 'rain' ? 1 : 0;
  for (const c of clouds) {
    c.x += dt * c.sp * (0.5 + windPower * 2.2);
    if (c.x > W + 320) c.x = -320;
    const L = env.light;
    const top = mix([255, 255, 255], [90, 100, 125], dark * .75);
    const bot = mix([205, 218, 235], [58, 66, 90], dark * .8);
    const T = shade(mix(top, [40, 55, 95], clamp(1 - L, 0, 1) * .8), 1);
    const B = shade(mix(bot, [25, 36, 70], clamp(1 - L, 0, 1) * .8), 1);

    ctx.globalAlpha = c.o * (0.55 + 0.45 * clamp(env.light + .25, 0, 1));
    const g = ctx.createLinearGradient(0, -50, 0, 40);
    g.addColorStop(0, css(T)); g.addColorStop(1, css(B));

    ctx.ellipse(c.puffs[0].x + span / 2, 4, span * .58 + 24, 15, 0, 0, TAU);

}

/* ---- distant hills / forest silhouettes ---- */

/* ---- tree ---- */
function makeTree(seed, size) {
  const branches = [], leaves = [];
  function grow(x, y, ang, len, wdt, d) {
    const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    branches.push({ x, y, ex, ey, w: wdt, d, cx: x + Math.cos(ang - .12) * len * .55, cy: y + Math.sin(ang - .12) * len * .55 });
    if (d >= 3) { leaves.push({ x: ex, y: ey, r: len * (1.05 + hash(seed + d + x) * .55), p: hash(x + d) * TAU }); return; }
    const n = hash(seed + d * 3.3 + x) > .45 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const sp = lerp(-0.72, 0.72, n === 1 ? .5 : i / (n - 1)) + (hash(seed + i + d) - .5) * .3;
      grow(ex, ey, ang + sp, len * (0.66 + hash(seed + i * 7 + d) * .16), wdt * .62, d + 1);
    }
  }
  grow(0, 0, -Math.PI / 2, size * .34, size * .11, 0);
  // extra canopy blobs for volume
  const extra = tier === 2 ? 14 : tier === 1 ? 8 : 4;
  const base = leaves.slice();
  for (let i = 0; i < extra; i++) {
    const b = base[(i * 3) % base.length];
    leaves.push({ x: b.x + (hash(seed + i) - .5) * size * .5, y: b.y + (hash(seed + i * 2) - .5) * size * .32, r: b.r * (0.7 + hash(seed + i * 3) * .5), p: hash(i + seed) * TAU });
  }
  return { branches, leaves, seed, size };
}

  shadowEllipse(0, 4, t.size * .55, t.size * .09);
  const dead = 1 - sim.plants;
  const wind = (0.35 + windPower * 1.3);

  for (let i = 0; i < t.branches.length; i++) {

  }

  ctx.strokeStyle = lit('#563a24'); ctx.lineWidth = t.size * .018; ctx.globalAlpha = .55;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-t.size * .03 + i * t.size * .03, -2);
    ctx.quadraticCurveTo(-t.size * .02 + i * t.size * .03, -t.size * .17, -t.size * .01 + i * t.size * .03, -t.size * .32);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // leaf clusters
  const leafA = o.leafAlpha === undefined ? 1 : o.leafAlpha;
  if (leafA > .02) {
    ctx.globalAlpha = leafA;
    for (let i = 0; i < t.leaves.length; i++) {
      const L = t.leaves[i];
      const s = Math.sin(now * 1.25 + L.p) * 5.5 * wind;
      const shadeK = i % 3 === 0 ? .78 : i % 3 === 1 ? 1 : 1.16;
      ctx.fillStyle = lit(mix(o.autumn ? '#d98a2b' : '#2f8f4e', '#8a7638', dead * .9), shadeK);
      ctx.beginPath(); ctx.arc(L.x + s, L.y + Math.cos(now * .9 + L.p) * 2, L.r, 0, TAU); ctx.fill();
    }

    ctx.globalAlpha = leafA * .45 * clamp(env.light, 0, 1);
    ctx.fillStyle = lit(o.autumn ? '#ffc06a' : '#7fd77a', 1.2);

    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

/* ---- water: surface, depth, ripples, light shafts ---- */

  ctx.restore();
  // ripples
  ctx.save(); ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 2;
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    const k = r.t / r.life; if (k >= 1) { ripples.splice(i, 1); continue; }
    ctx.globalAlpha = (1 - k) * .55;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r + k * r.max, (r.r + k * r.max) * .3, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* -------------------------- 5. creature artwork --------------------- */
function begin(o, flip) {
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : clamp(o.alpha, 0, 1);
  ctx.translate(o.x, o.y);
  ctx.scale((flip === false ? 1 : o.dir) * o.s, o.s);
}
const end = () => ctx.restore();
// two-segment leg
function leg(hx, hy, l1, l2, ph, swing, w, col, hoof) {
  const t1 = Math.sin(ph) * swing;
  const kx = hx + Math.sin(t1) * l1, ky = hy + Math.cos(t1) * l1;
  const t2 = t1 - Math.max(0, Math.sin(ph + 1.1)) * swing * 1.15;
  let fx = kx + Math.sin(t2) * l2, fy = ky + Math.cos(t2) * l2;
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
  if (hoof) { ctx.fillStyle = hoof; ctx.beginPath(); ctx.ellipse(fx, fy + 1, w * .55, w * .45, 0, 0, TAU); ctx.fill(); }
  return [fx, fy];
}
function eye(x, y, r, look) {
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#181008'; ctx.beginPath(); ctx.arc(x + r * .28 * (look || 1), y + r * .08, r * .58, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x + r * .05, y - r * .35, r * .24, 0, TAU); ctx.fill();
}

/* ---------------- rabbit ---------------- */
function drawRabbit(o) {
  const hop = o.hop || 0, air = Math.sin(hop * Math.PI);
  const eat = o.eat || 0, bob = Math.sin(o.t * 9) * 3 * eat;
  begin({ ...o, y: o.y - air * 44 * o.s });
  shadowEllipse(0, 2, 30 - air * 8, 7 - air * 2, .2);
  const fur = lit('#ece5da'), fur2 = lit('#c9bfb0'), pink = lit('#f6a6b4');
  ctx.fillStyle = fur2;
  ctx.beginPath(); ctx.arc(-28, -26, 10, 0, TAU); ctx.fill();          // tail
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.arc(-28, -27, 8.5, 0, TAU); ctx.fill();
  // back leg
  ctx.fillStyle = fur2;
  ctx.beginPath(); ctx.ellipse(-13, -12 + air * 5, 16, 11, -0.25 - air * .5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-16, -4 + air * 8, 9, 5.5, 0.1, 0, TAU); ctx.fill();
  // body
  const bg = ctx.createLinearGradient(0, -46, 0, -6);
  bg.addColorStop(0, fur); bg.addColorStop(1, fur2);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(-2, -26, 28, 21, -0.12 + air * .1, 0, TAU); ctx.fill();
  // front leg
  ctx.fillStyle = fur2;
  ctx.beginPath(); ctx.ellipse(15, -11 + air * 4, 6.5, 12 - air * 3, air * .5, 0, TAU); ctx.fill();
  // head
  ctx.save(); ctx.translate(23, -37 + bob); ctx.rotate(eat * .38 + air * -.12);
  // ears
  for (let i = 0; i < 2; i++) {
    ctx.save(); ctx.translate(-2 + i * 6, -9); ctx.rotate((i ? .16 : -.30) + Math.sin(o.t * 2.2 + i) * .07 - air * .35);
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -16, 6, 18, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = pink; ctx.beginPath(); ctx.ellipse(0, -16, 3, 13, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 13.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, 4, 8.5, 7, .2, 0, TAU); ctx.fill();   // muzzle
  eye(5, -3, 3.2);
  ctx.fillStyle = pink; ctx.beginPath(); ctx.ellipse(17, 3, 2.6, 2.1, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(70,60,50,.5)'; ctx.lineWidth = .9;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(16, 4); ctx.lineTo(30, 1 + i * 5); ctx.stroke(); }
  ctx.restore();
  end();
}

/* ---------------- deer ---------------- */
function drawDeer(o) {
  const walk = o.walk || 0, ph = o.t * 5.2, eat = o.eat || 0;

  ctx.fillStyle = lit('#2b1d12'); ctx.beginPath(); ctx.ellipse(20, 9, 3.4, 2.7, .3, 0, TAU); ctx.fill();

/* ---------------- tiger ---------------- */
function drawTiger(o) {

  ctx.fillStyle = lit('#e07a7a');

  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1;

  ctx.fillStyle = lit('#ffe08a'); ctx.beginPath(); ctx.ellipse(-4, -3, 4.2, 3.6, 0, 0, TAU); ctx.fill();

  ctx.fillStyle = blk;

  ctx.beginPath(); ctx.ellipse(11, -4, 1.5, 2.8, 0, 0, TAU); ctx.fill();

/* ---------------- snake ---------------- */
function drawSnake(o) {
  const N = 16, seg = 11 * o.s, amp = 13 * o.s;
  ctx.save(); ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const x = o.x - o.dir * i * seg;
    const y = o.y - 8 * o.s + Math.sin(now * 3.4 - i * .62 + (o.ph || 0)) * amp * (i / N * .7 + .3);
    pts.push([x, y]);
  }
  shadowEllipse(o.x - o.dir * N * seg * .5, o.y + 2, N * seg * .5, 6 * o.s, .18);
  const top = [], bot = [];
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[Math.min(i + 1, N - 1)];
    let ang = Math.atan2(q[1] - p[1], q[0] - p[0]) + Math.PI / 2;
    const w = (10 - Math.pow(i / N, 1.6) * 8) * o.s;
    top.push([p[0] + Math.cos(ang) * w, p[1] + Math.sin(ang) * w]);
    bot.push([p[0] - Math.cos(ang) * w, p[1] - Math.sin(ang) * w]);
  }
  ctx.beginPath(); ctx.moveTo(top[0][0], top[0][1]);
  for (const p of top) ctx.lineTo(p[0], p[1]);
  for (let i = N - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(o.x, o.y - 30 * o.s, o.x, o.y + 6 * o.s);
  g.addColorStop(0, lit('#7ec24a')); g.addColorStop(.6, lit('#4f9438')); g.addColorStop(1, lit('#2f6b28'));
  ctx.fillStyle = g; ctx.fill();
  // pattern
  ctx.save(); ctx.clip(); ctx.fillStyle = lit('#2b4a1c'); ctx.globalAlpha *= .8;
  for (let i = 0; i < N; i += 2) { ctx.beginPath(); ctx.ellipse(pts[i][0], pts[i][1], 5 * o.s, 8 * o.s, .5, 0, TAU); ctx.fill(); }
  ctx.restore();
  // head
  const h = pts[0], nx = pts[1];
  const ang = Math.atan2(h[1] - nx[1], h[0] - nx[0]);
  ctx.save(); ctx.translate(h[0], h[1]); ctx.rotate(ang); ctx.scale(o.s, o.s);
  ctx.fillStyle = lit('#6fb641');
  ctx.beginPath(); ctx.ellipse(4, 0, 13, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = lit('#ffd257'); ctx.beginPath(); ctx.arc(7, -4, 2.8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1a1208'; ctx.beginPath(); ctx.ellipse(8, -4, 1.1, 2.4, 0, 0, TAU); ctx.fill();
  const flick = Math.sin(now * 3) > .75 ? 1 : 0;
  if (flick) {
    ctx.strokeStyle = lit('#ff5566'); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(16, 2); ctx.lineTo(26, 2); ctx.moveTo(26, 2); ctx.lineTo(31, -2); ctx.moveTo(26, 2); ctx.lineTo(31, 5); ctx.stroke();
  }
  ctx.restore(); ctx.restore();
}

/* ---------------- eagle ---------------- */
function drawEagle(o) {
  // k = -1 wings fully down, +1 wings fully up
  const k = clamp(o.glide ? .30 + Math.sin(o.t * 1.5) * .16 : .25 + Math.sin(o.t * 5.4) * .75, -.5, 1);
  begin(o);
  const dark = lit('#3a2718'), body2 = lit('#6f4c2e'), head = lit('#f5f1e6'), beak = lit('#ffc247');
  // ---- far wing (behind the body, slightly delayed) ----
  wing(k * .72 - .10, dark, .92);
  // ---- tail fan ----
  ctx.fillStyle = head;
  ctx.beginPath(); ctx.moveTo(-20, -6);
  ctx.quadraticCurveTo(-40, -12, -50, -6);
  ctx.quadraticCurveTo(-52, 2, -46, 8);
  ctx.quadraticCurveTo(-34, 8, -20, 5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,50,.35)'; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-22, -2 + i * 3); ctx.lineTo(-48, -4 + i * 5); ctx.stroke(); }
  // ---- body ----
  const g = ctx.createLinearGradient(0, -15, 0, 14);
  g.addColorStop(0, body2); g.addColorStop(.65, lit('#523722')); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(24, -6);
  ctx.quadraticCurveTo(6, -16, -18, -8);
  ctx.quadraticCurveTo(-26, 0, -18, 7);
  ctx.quadraticCurveTo(4, 14, 24, 6); ctx.closePath(); ctx.fill();
  // tucked feet
  ctx.strokeStyle = beak; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, 9); ctx.lineTo(-2, 13); ctx.moveTo(10, 8); ctx.lineTo(6, 12); ctx.stroke();
  // ---- white head + hooked beak ----
  ctx.fillStyle = head;
  ctx.beginPath(); ctx.moveTo(16, -12);
  ctx.quadraticCurveTo(30, -18, 36, -10);
  ctx.quadraticCurveTo(38, -2, 28, 2);
  ctx.quadraticCurveTo(18, 3, 16, -3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = beak;
  ctx.beginPath(); ctx.moveTo(35, -11); ctx.quadraticCurveTo(48, -8, 45, 1);
  ctx.quadraticCurveTo(41, -3, 34, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1208'; ctx.beginPath(); ctx.arc(31, -10, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(31.7, -10.9, .95, 0, TAU); ctx.fill();
  // ---- near wing (in front) ----
  wing(k, body2, 1);
  end();
  function wing(kk, col, al) {
    const tx = -26 - Math.abs(kk) * 10;         // tip sweeps back as it rises
    const ty = -6 - kk * 32;                    // tip height
    ctx.save(); ctx.globalAlpha *= al;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(10, -8);
    ctx.quadraticCurveTo(-4, ty * .55 - 8, tx, ty);                  // leading edge out to the tip
    ctx.quadraticCurveTo(tx + 10, ty + 13, tx + 20, ty + 15);        // rounded tip
    ctx.quadraticCurveTo(-6, ty * .35 + 6, 8, 2);                    // trailing edge back to body
    ctx.closePath(); ctx.fill();
    // primary feather lines
    ctx.globalAlpha *= .5; ctx.strokeStyle = '#241708'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const f = i / 3;
      ctx.beginPath(); ctx.moveTo(6 - i * 2, -4 + i);
      ctx.lineTo(lerp(tx + 20, tx + 1, f), lerp(ty + 14, ty + 2, f)); ctx.stroke();
    }
    // shoulder highlight
    ctx.globalAlpha *= .8; ctx.fillStyle = 'rgba(255,235,200,.28)';
    ctx.beginPath(); ctx.ellipse(2, -6, 9, 4.5, -.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- frog ---------------- */
function drawFrog(o) {
  const j = o.jump || 0, str = Math.sin(j * Math.PI);

    ctx.fillStyle = lit('#ff8fa6'); ctx.beginPath(); ctx.arc(22 + L, -18, 3.4, 0, TAU); ctx.fill();

  end();
}

/* ---------------- butterfly ---------------- */
function drawButterfly(o) {
  const f = Math.sin(o.t * 13) * .9;
  begin(o);
  const c1 = o.c1 || '#ff8a3d', c2 = o.c2 || '#ffd257', dk = lit('#2a1b12');
  for (let side = -1; side <= 1; side += 2) {
    ctx.save(); ctx.scale(1, 1);
    const sc = Math.abs(Math.cos(f * .9)) * .85 + .18;
    ctx.translate(0, 0); ctx.transform(sc, 0, 0, 1, 0, 0); ctx.rotate(side * f * .16);
    // upper wing

/* ---- generic pose handling ---- */
let posed = false;
function setPose(map) {
  posed = true;
  for (const e of ents) e.pose = null;
  for (const key in map) {
    const list = entsById(key);
    if (!list.length) continue;
    const e = list[0];
    e.pose = Object.assign({ s: e.s0 || e.s }, map[key]);
    if (e.s0 === undefined) e.s0 = e.s;
  }
}
function clearPoses() {
  posed = false;
  for (const e of ents) { if (e.pose) { e.pose = null; if (e.s0 !== undefined) e.sTarget = e.s0; } }
}
function entsById(id) { return ents.filter(e => e.id === id); }
function firstById(id) { return ents.find(e => e.id === id); }
function posOf(id) {
  if (id === 'sun') return [spots[0].x, spots[0].y];
  const s = spots.find(s => s.id === id); if (s) return [s.x, s.y];
  const e = firstById(id); if (!e) return [W / 2, GY];
  return [e.x, e.y + (e.hy || -30)];
}
function applyPose(e, d) {
  if (!e.pose) {
    if (e.sTarget !== undefined) { e.s = lerp(e.s, e.sTarget, 1 - Math.pow(.02, d)); if (Math.abs(e.s - e.sTarget) < .01) { e.s = e.sTarget; e.sTarget = undefined; } }
    return false;
  }
  const k = 1 - Math.pow(.06, d);
  e.x = lerp(e.x, e.pose.x, k);
  e.y = lerp(e.y, e.pose.y, k);
  if (e.pose.s) e.s = lerp(e.s, e.pose.s, k);
  if (e.pose.dir) e.dir = e.pose.dir;
  return true;
}

/* ---- behaviour update ---- */
function nearestBlade(x) {
  let best = null, bd = 1e9;
  for (const b of blades) { const d = Math.abs(b.x - x); if (d < bd) { bd = d; best = b; } }
  return best;
}
function updateEnts(d) {
  const speedK = connMode ? 0.12 : 1;
  const dd = d * speedK;
  for (const e of ents) {
    e.t += dd;
    if (e.glow > 0) e.glow = Math.max(0, e.glow - d * .8);
    const wasPosed = applyPose(e, d);
    // fade with population health
    let target = 1;
    if (e.group === 'herb') target = sim.herb;
    else if (e.group === 'pred') target = sim.pred;
    else if (e.group === 'insect') target = sim.insects;
    else if (e.kind === 'tree' || e.kind === 'bush' || e.kind === 'flowerspot') target = clamp(sim.plants * 1.2, 0, 1);
    if (e.kind === 'fish') target = Math.min(target, sim.water);
    // during a scripted scene, dim the animals that are not part of the story
    if (posed && !e.pose && ANIMAL_KINDS.includes(e.kind)) target = Math.min(target, .14);
    e.alpha = lerp(e.alpha, e.forceAlpha === undefined ? target : e.forceAlpha, 1 - Math.pow(.05, d));
    if (wasPosed || connMode) { idleAnim(e, dd); continue; }
    switch (e.kind) {
      case 'rabbit': updRabbit(e, dd); break;
      case 'deer': updDeer(e, dd); break;
      case 'tiger': updTiger(e, dd); break;
      case 'frog': updFrog(e, dd); break;
      case 'snake': updSnake(e, dd); break;
      case 'eagle': updEagle(e, dd); break;
      case 'hopper': updHopper(e, dd); break;
      case 'bfly': updBfly(e, dd); break;
      case 'fish': updFish(e, dd); break;
    }
  }
  // decomposer microbes drift
  for (const b of bacteria) {
    b.x += b.vx * dd * .3; b.y += b.vy * dd * .3;
    if (b.x < 690 || b.x > 930) b.vx *= -1;
    if (b.y < terrainY(810) + 40 || b.y > terrainY(810) + 190) b.vy *= -1;
  }
}
function idleAnim(e, d) {
  if (e.kind === 'bfly' || e.kind === 'eagle') { e.y += Math.sin(now * 1.6 + e.eid) * 6 * d; }
  if (e.hop) e.hop = Math.max(0, e.hop - d);
  if (e.jump) e.jump = Math.max(0, e.jump - d);
  if (e.walk) e.walk = Math.max(0, e.walk - d * 2);
}
function updRabbit(e, d) {
  e.tm -= d;
  const fear = Math.abs(tiger.x - e.x) < 190 && sim.pred > .4;
  if (e.st === 'idle') {
    e.eat = lerp(e.eat, 0, d * 4); e.hop = Math.max(0, e.hop - d * 2);
    if (e.tm <= 0 || fear) { e.st = 'hop'; e.tm = fear ? 1.6 : rnd(2.2, .9); e.dir = fear ? (tiger.x > e.x ? -1 : 1) : (Math.random() < .5 ? -1 : 1); e.hopT = 0; }
  } else if (e.st === 'hop') {
    e.hopT = (e.hopT || 0) + d * 2.4;
    e.hop = (e.hopT % 1);
    e.x += e.dir * d * (fear ? 130 : 62);
    e.x = clamp(e.x, 60, 880);
    if (e.x <= 60 || e.x >= 880) e.dir *= -1;
    e.y = terrainY(e.x);
    if (e.tm <= 0) { e.hop = 0; e.st = Math.random() < .7 ? 'eat' : 'idle'; e.tm = rnd(3.4, 1.6); }
  } else if (e.st === 'eat') {
    e.eat = lerp(e.eat, 1, d * 5);
    const b = nearestBlade(e.x + e.dir * 22);
    if (b && Math.random() < d * 3) { b.eaten = Math.min(1, b.eaten + .5); spawn('crumb', e.x + e.dir * 24, e.y - 12, 2); }
    if (e.tm <= 0) { e.st = 'idle'; e.tm = rnd(2.2, .8); }
  }
  e.y = terrainY(e.x);
}
function updDeer(e, d) {
  e.tm -= d;
  if (e.st === 'idle') {
    e.walk = lerp(e.walk, 0, d * 3); e.eat = lerp(e.eat, 0, d * 3);
    if (e.tm <= 0) { e.st = Math.random() < .55 ? 'walk' : 'eat'; e.tm = rnd(5, 2.5); if (e.st === 'walk') e.dir = Math.random() < .5 ? -1 : 1; }
  } else if (e.st === 'walk') {
    e.walk = lerp(e.walk, 1, d * 3);
    e.x += e.dir * d * 34; e.x = clamp(e.x, 120, 890);
    if (e.x <= 120 || e.x >= 890) e.dir *= -1;
    if (e.tm <= 0) { e.st = 'idle'; e.tm = rnd(2.5, 1); }
  } else if (e.st === 'eat') {
    e.walk = lerp(e.walk, 0, d * 3); e.eat = lerp(e.eat, 1, d * 2.4);
    const b = nearestBlade(e.x + e.dir * 44);
    if (b && Math.random() < d * 2) { b.eaten = Math.min(1, b.eaten + .5); spawn('crumb', e.x + e.dir * 46, e.y - 16, 2); }
    if (e.tm <= 0) { e.st = 'idle'; e.tm = rnd(3, 1.5); }
  }
  e.y = terrainY(e.x);
}
function updTiger(e, d) {
  e.tm -= d;
  if (e.st === 'rest') {
    e.walk = lerp(e.walk, 0, d * 3);
    if (e.tm <= 0) { e.st = 'walk'; e.tm = rnd(12, 7); e.dir = e.x < 400 ? 1 : -1; }
  } else {
    e.walk = lerp(e.walk, 1, d * 2);
    e.x += e.dir * d * 42; e.x = clamp(e.x, 90, 880);
    if (e.x <= 90 || e.x >= 880) e.dir *= -1;
    if (e.tm <= 0) { e.st = 'rest'; e.tm = rnd(14, 8); }
  }
  e.y = terrainY(e.x);
}
function updFrog(e, d) {
  e.tm -= d;
  e.tongue = Math.max(0, e.tongue - d * 2.2);
  if (e.st === 'idle') {
    e.jump = Math.max(0, e.jump - d * 2);
    // look for a nearby insect
    let prey = null, bd = 260 * 260;
    for (const h of hoppers) { if (h.alpha < .4) continue; const dd2 = dist2(h.x, h.y, e.x, e.y); if (dd2 < bd) { bd = dd2; prey = h; } }
    if (prey && e.tm <= 0 && sim.insects > .4) { e.st = 'leap'; e.prey = prey; e.dir = prey.x > e.x ? 1 : -1; e.jump = 0; e.tm = 1; Audio2.blip(240, .12, 'sine', .05, 160); }
    else if (e.tm <= 0) { e.tm = rnd(3, 1.4); e.st = 'hopish'; e.jump = 0; e.dir = Math.random() < .5 ? 1 : -1; }
  } else if (e.st === 'leap') {
    e.jump += d * 1.25;
    const p = e.prey;
    if (p) e.x = lerp(e.x, clamp(p.x - e.dir * 40, POND.x0 - 220, POND.x0 + 10), d * 3.2);
    if (e.jump > .55 && !e.done) { e.tongue = 1; e.done = true; }
    if (e.jump >= 1) {
      e.jump = 0; e.done = false; e.st = 'idle'; e.tm = rnd(5, 3);

function drawWeatherOverlay() {

let showBiomes = false;
const BIOMES = [
  { k: 'forest', n: 'FOREST', e: '🌲' }, { k: 'pond', n: 'POND', e: '🪷' }, { k: 'ocean', n: 'OCEAN', e: '🐠' },
  { k: 'desert', n: 'DESERT', e: '🌵' }, { k: 'grass', n: 'GRASSLAND', e: '🦓' }
];
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBiomeCards() {
  biomeT = lerp(biomeT, showBiomes ? 1 : 0, dt * 4);
  if (biomeT < .01) return;
  screenSpace();
  const top = 72 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safet')) || 0);
  const bottom = vh - 176;
  const cols = vw < 560 ? 2 : vw < 980 ? 3 : 5;
  const rows = Math.ceil(BIOMES.length / cols);
  const gap = 9, pad = 12;
  const cw = (vw - pad * 2 - gap * (cols - 1)) / cols;
  const ch = Math.min((bottom - top - gap * (rows - 1)) / rows, cw * .8);
  const totalH = ch * rows + gap * (rows - 1);
  const y0 = top + Math.max(0, (bottom - top - totalH) / 2);
  ctx.save();
  ctx.globalAlpha = biomeT * .55; ctx.fillStyle = '#04121a'; ctx.fillRect(0, 0, vw, vh);
  ctx.globalAlpha = 1;
  for (let i = 0; i < BIOMES.length; i++) {
    const c = i % cols, r = (i / cols) | 0;
    const rowCount = Math.min(cols, BIOMES.length - r * cols);
    const rowW = rowCount * cw + (rowCount - 1) * gap;
    const x = (vw - rowW) / 2 + c * (cw + gap);
    const y = y0 + r * (ch + gap);
    const app = clamp((biomeT - i * .07) * 2.4, 0, 1);
    if (app <= 0) continue;
    ctx.save();
    ctx.globalAlpha = app;
    ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(.9 + .1 * app, .9 + .1 * app); ctx.translate(-cw / 2, -ch / 2);
    rr(0, 0, cw, ch, 16); ctx.save(); ctx.clip();
    miniScene(BIOMES[i].k, cw, ch, i);
    ctx.restore();
    ctx.strokeStyle = 'rgba(160,255,225,.35)'; ctx.lineWidth = 2; rr(1, 1, cw - 2, ch - 2, 15); ctx.stroke();
    // label
    ctx.fillStyle = 'rgba(4,18,24,.72)'; rr(8, ch - 30, cw - 16, 22, 9); ctx.fill();
    ctx.fillStyle = '#eafcf6'; ctx.font = `800 ${Math.min(13, cw * .11)}px ui-rounded, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(BIOMES[i].e + '  ' + BIOMES[i].n, cw / 2, ch - 19);
    ctx.restore();
  }
  ctx.restore();
}
function miniScene(k, w, h, seed) {
  const t = now;
  const G = (a, b) => { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  if (k === 'forest') {
    ctx.fillStyle = G('#8fd0f0', '#d9f0e2'); ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(w * .82, h * .2, h * .09, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2f6f5a'; ctx.beginPath(); ctx.moveTo(0, h * .7);
    for (let x = 0; x <= w; x += 12) ctx.lineTo(x, h * .68 - Math.sin(x * .05 + seed) * h * .05);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const x = w * (.12 + i * .19), s = h * (.30 + (i % 2) * .07), yb = h * .82;
      ctx.fillStyle = '#6b4a2f'; ctx.fillRect(x - w * .012, yb - s * .4, w * .024, s * .4);
      ctx.fillStyle = i % 2 ? '#2f8f4e' : '#3fa65c';
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.moveTo(x - s * (.36 - j * .08), yb - s * (.34 + j * .28));
        ctx.lineTo(x + s * (.36 - j * .08), yb - s * (.34 + j * .28));
        ctx.lineTo(x + Math.sin(t * 1.4 + i) * 2, yb - s * (.62 + j * .3)); ctx.closePath(); ctx.fill();
      }

    ctx.fillStyle = '#4aa153'; ctx.fillRect(0, h * .82, w, h * .18);
  } else if (k === 'pond') {

    ctx.fillStyle = 'rgba(255,255,255,.45)';

    ctx.strokeStyle = '#3d8f34'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const x = w * (.06 + i * .04);

    }

    ctx.fillStyle = G('#2aa0d8', '#052a4d'); ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 4; i++) {

    }

const ptrs = new Map();
let dragMoved = 0, dragT = 0, pinch0 = 0, camZ0 = 1;
function tappable() {
  const list = [];
  for (const e of ents) if (e.id && INFO[e.id] && e.alpha > .25) list.push({ id: e.id, x: e.x, y: e.y + (e.hy || -30), r: e.hit || 40 });
  for (const s of spots) if (INFO[s.id]) list.push({ id: s.id, x: s.x, y: s.y, r: s.r });
  return list;
}
function hitTest(sx, sy) {
  let best = null, bd = 1e9;
  for (const t of tappable()) {
    const [px, py] = w2s(t.x, t.y);
    const rs = Math.max(t.r * baseScale * cam.z, 30);
    const d = Math.hypot(px - sx, py - sy);
    if (d < rs && d < bd) { bd = d; best = t; }
  }
  return best;
}
function ripAt(x, y) {
  const el = document.createElement('div'); el.className = 'rip';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  $('#hud').appendChild(el); setTimeout(() => el.remove(), 560);
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
  if (ptrs.size === 1) { dragMoved = 0; dragT = performance.now(); }
  if (ptrs.size === 2) {
    const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); camZ0 = cam.tz;
  }
  Audio2.init(); Audio2.resume();
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const a = [...ptrs.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (pinch0 > 10) { cam.fit = null; cam.tz = clamp(camZ0 * (d / pinch0), zMin(), ZMAX); }
    dragMoved = 99;
    return;
  }
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (dragMoved > 10) {
    const S = baseScale * cam.z;
    cam.fit = null;
    cam.tx -= dx / S; cam.ty -= dy / S;
    cam.x -= dx / S; cam.y -= dy / S;
    cam.ty = clamp(cam.ty, 120, H - 160); cam.y = clamp(cam.y, 120, H - 160);
  }
});
function endPtr(e) {
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (!p) return;
  if (ptrs.size === 0 && dragMoved < 12 && performance.now() - dragT < 700) {
    ripAt(e.clientX, e.clientY);
    const hit = hitTest(e.clientX, e.clientY);
    if (quizMode) { quizTap(hit); return; }
    if (hit) { openInfo(hit.id); if (lesson) lesson.onTap(hit.id); }
    else { closeInfo(); }
  }
}
cv.addEventListener('pointerup', endPtr);

/* ---- scripted scenes are laid out around x=700 and squeezed on narrow screens ---- */
const SPREAD = () => clamp(viewW / 1150, .55, 1);
const PSCALE = () => .74 + .26 * SPREAD();
const stageX = {};   // positions of the currently posed 'stage' scenes
const XX = (x) => 700 + (x - 700) * SPREAD();

/* ---- day animation helper ---- */
let dayAnim = null;
function animateDay(target) { dayAnim = { from: dayT, to: target, t: 0, d: 2.6 }; }

/* ---- new plant growing after decomposition ---- */
let newPlant = 0;
function drawNewPlant() {
  if (newPlant <= 0) return;
  newPlant = Math.min(1, newPlant + dt * .35);
  const x = 866, y = terrainY(x), h = 70 * ease(newPlant);
  layer(1); ctx.save();
  // a soft halo so the new sprout reads against the bushes behind it
  const gl = ctx.createRadialGradient(x, y - h * .6, 0, x, y - h * .6, 90);
  gl.addColorStop(0, `rgba(190,255,208,${.30 * (1 - newPlant * .5)})`);
  gl.addColorStop(1, 'rgba(190,255,208,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y - h * .6, 90, 0, TAU); ctx.fill();
  ctx.strokeStyle = lit('#4aa153'); ctx.lineWidth = 4; ctx.lineCap = 'round';
  const s = sway(x, 1, 8, 1.3);
  ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.quadraticCurveTo(x + s * .4, y - h * .6, x + s, y - h); ctx.stroke();
  ctx.fillStyle = lit('#5fc25f');
  for (let i = 0; i < 2; i++) {
    ctx.save(); ctx.translate(x + s * .55, y - h * (.5 + i * .3)); ctx.rotate(i ? -.7 : .7);
    ctx.beginPath(); ctx.ellipse(12 * (i ? -1 : 1), 0, 14 * ease(newPlant), 6.5 * ease(newPlant), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- the lesson state machine ---- */
let pulseCycle = 0;
lesson = {
  ci: 0, si: 0, t: 0, free: false, started: false,
  goto(ci, si) {
    const prev = chapters[this.ci];
    if (prev && prev.exit && (ci !== this.ci)) prev.exit();
    if (ci !== this.ci) { clearTimers(); closeInfo(); hideDocks(); }
    this.ci = clamp(ci, 0, chapters.length - 1); this.si = si || 0;
    this.free = false;
    const c = chapters[this.ci];
    $('#chapNum').textContent = (this.ci + 1) + ' / ' + chapters.length;
    $('#chapName').textContent = c.name;
    buildDots();
    if (c.enter) c.enter();
    this.runStep();
  },
  runStep() {
    const c = chapters[this.ci], st = c.steps[this.si];
    this.t = 0;
    if (!st) return;
    hideBanner();
    if (st.on) st.on();
    if (st.t) say(st.t, st.icon); else if (st.icon) capIcon.textContent = st.icon;
    if (!st.t) capBox.classList.remove('show'); else capBox.classList.add('show');
    requestAnimationFrame(layoutPanels);
    this.dur = st.d || (2.4 + (st.t ? st.t.replace(/<[^>]+>/g, '').length * .052 : 0));
    this.auto = st.auto !== false;
    buildDots();
    $('#btnBack').disabled = (this.ci === 0 && this.si === 0);
    $('#btnNext').textContent = (this.ci === chapters.length - 1 && this.si === chapters[this.ci].steps.length - 1) ? '↺ Restart' : 'Next →';
  },
  next() {
    const c = chapters[this.ci];
    if (this.si < c.steps.length - 1) { this.si++; this.runStep(); }
    else if (this.ci < chapters.length - 1) { this.goto(this.ci + 1, 0); }
    else { this.goto(0, 0); }
  },
  back() {
    if (this.si > 0) { this.si--; this.runStep(); }
    else if (this.ci > 0) { const p = chapters[this.ci - 1]; this.goto(this.ci - 1, p.steps.length - 1); }
  },
  onTap(id) { const c = chapters[this.ci]; if (c.onTap) c.onTap(id); },
  tick(d) {
    this.t += d;
    if (this.auto && this.t > this.dur) this.next();
    // explore-chapter hints: point at something, and bring it into view if it is off screen
    if (this.ci === 1) {
      pulseCycle += d;
      if (pulseCycle > 4.2) {
        pulseCycle = 0;
        pulseId = pick(['tree', 'rabbit', 'water', 'sun', 'mushroom', 'deer', 'rock', 'frog', 'butterfly', 'fish', 'soil']);
        if (!icard.classList.contains('show')) {
          const q = posOf(pulseId), sp = w2s(q[0], q[1]);
          if (sp[0] < 70 || sp[0] > vw - 70 || sp[1] < 80 || sp[1] > vh - 170)
            cam.focus(q[0], q[1] + Math.min(viewH / cam.z * .12, 110), Math.max(1000, viewW));
        }
      }
      pulseT += d;
    }
  }
};
function buildDots() {
  const d = $('#dots'); const c = chapters[lesson.ci];
  if (d._n !== c.steps.length || d._ci !== lesson.ci) {
    d.innerHTML = ''; d._n = c.steps.length; d._ci = lesson.ci;
    for (let i = 0; i < c.steps.length; i++) { const s = document.createElement('i'); s.className = 'dot'; d.appendChild(s); }
  }
  [...d.children].forEach((el, i) => { el.className = 'dot' + (i === lesson.si ? ' on' : i < lesson.si ? ' done' : ''); });
}
$('#btnNext').onclick = () => { Audio2.tap(); lesson.next(); };
$('#btnBack').onclick = () => { Audio2.tap(); lesson.back(); };

/* --------------------------- 12. main loop -------------------------- */
let last = performance.now(), acc = 0, fpsAvg = 60, slowFrames = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  let d = (ts - last) / 1000; last = ts;
  if (d > .05) d = .05;                 // clamp after tab switches
  dt = d; now += d; frame++;
  // adaptive quality
  fpsAvg = fpsAvg * .95 + (1 / Math.max(d, .001)) * .05;
  if (frame > 120 && tier > 0) {
    if (fpsAvg < 34) { if (++slowFrames > 90) { tier--; dprCap = 1; resize(); slowFrames = 0; } }
    else slowFrames = Math.max(0, slowFrames - 2);   // only a sustained drop lowers quality
  }

  // timers
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].s -= d; if (timers[i].s <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  // day animation
  if (dayAnim) {
    dayAnim.t += d; const k = clamp(dayAnim.t / dayAnim.d, 0, 1);
    dayT = lerp(dayAnim.from, dayAnim.to, smooth(k));
    dn.value = Math.round(dayT * 1000);
    dn.dispatchEvent(new Event('input'));
    if (k >= 1) dayAnim = null;
  }
  connT = lerp(connT, connMode ? 1 : 0, d * 3);
  rootGlow = Math.max(0, rootGlow - d * .35);
  pulseT += d;

  updateEnv(d);
  cam.step(d);
  updateEnts(d);
  updateParts(d);
  sim.step(d);
  if (lesson.started) lesson.tick(d);
  if (frame % 12 === 0) { updateMeters(); Audio2.setBeds(); }
  if (frame % 30 === 0) layoutPanels();

  drawScene();
  drawNewPlant();
}

/* ----------------------------- 13. boot ----------------------------- */
resize();
requestAnimationFrame(loop);
$('#sGo').onclick = () => {
  Audio2.init(); Audio2.resume();
  $('#start').classList.add('hide');
  setTimeout(() => { $('#start').style.display = 'none'; }, 800);
  lesson.started = true;
  lesson.goto(0, 0);
};
// let the world animate behind the start screen
cam.home(true);
document.addEventListener('visibilitychange', () => { if (document.hidden) Audio2.vol(0); else if (Audio2.on) Audio2.vol(.5); });
</script>
