/* ---------------------------------------------------------- FlyingGuard */
class FlyingGuard extends Enemy {
  constructor(lvl, x, y, opt) {
    super(lvl, x, y - 14, 16, 14);
    this.type = 'flyingguard';
    this.gravity = 0;
    this.homeX = x; this.homeY = y - 14;
    this.range = (opt && opt.range) || 48;
    this.speed = (opt && opt.speed) || 34;
    this.vertical = !!(opt && opt.vertical);
    this.phase = Math.random() * 6.283;
    this.scoreValue = 200;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    this.phase += dt * (this.speed / Math.max(8, this.range));
    this.px = this.x; this.py = this.y;
    if (this.vertical) {
      this.y = this.homeY + Math.sin(this.phase) * this.range;
      this.x = this.homeX + Math.sin(this.phase * 0.5) * 4;
    } else {
      this.x = this.homeX + Math.sin(this.phase) * this.range;
      this.y = this.homeY + Math.sin(this.phase * 2) * 5;
      this.dir = Math.cos(this.phase) > 0 ? 1 : -1;
    }
  }
  render(g, camX, camY, alpha) {
    const art = this.flipDying ? Art.enemy('flyingguard', 'fly', 0)
      : Art.enemy('flyingguard', 'fly', ((this.animT * 10) | 0) & 1);
    this.drawArt(g, art, camX, camY, alpha, this.dir > 0, this.flipDying ? { sy: -1 } : null);
  }
}

/* -------------------------------------------------------- CannonCreature */
class CannonCreature extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x, y - 16, 16, 16);
    this.type = 'cannoncreature';
    this.gravity = 0;
    this.t = rrange(0.8, 2.0);
    this.telegraph = 0;
    this.scoreValue = 200;
    this.dir = -1;
    this.wakeDist = 24;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    const p = this.lvl.player;
    this.dir = p.cx < this.cx ? -1 : 1;
    const dist = Math.abs(p.cx - this.cx);
    if (dist > 200 || dist < 22) return;         // don't ambush at point-blank
    this.t -= dt;
    if (this.t <= 0.45 && this.telegraph <= 0) {
      this.telegraph = 0.45;
      this.lvl.particles.spawn(P_KIND.GLOW, this.cx + this.dir * 7, this.cy, {
        life: 0.45, size: 4, col: '#ff9d4d'
      });
    }
    if (this.telegraph > 0) this.telegraph -= dt;
    if (this.t <= 0) {
      this.t = rrange(1.7, 2.6);
      this.lvl.spawnEnemyShot(this.cx + this.dir * 9, this.cy - 1, this.dir * 74, 0);
      this.lvl.audio.sfx('cannon');
      this.lvl.particles.burst(this.cx + this.dir * 9, this.cy, 6, '#ffc178', '#8a5a2a', 90, 0.3);
      this.lvl.camera.addShake(0.7, 0.07);
    }
  }
  render(g, camX, camY, alpha) {
    const firing = this.telegraph > 0;
    const art = Art.enemy('cannoncreature', firing ? 'fire' : 'idle', 0);
    this.drawArt(g, art, camX, camY, alpha, this.dir > 0);
    if (firing) {
      const x = Math.round(this.cx - camX), y = Math.round(this.cy - camY);
      g.globalAlpha = 0.35 + Math.sin(this.animT * 40) * 0.2;
      g.fillStyle = '#ffb85c';
      g.fillRect(x + this.dir * 8 - 2, y - 2, 4, 4);
      g.globalAlpha = 1;
    }
  }
}

/* ---------------------------------------------------------- projectiles */
class Fireball extends Entity {
  constructor(lvl, x, y, dir) {
    super(lvl, x - 3, y - 3, 6, 6);
    this.vx = dir * PHYS.fireballSpeed;
    this.vy = 60;
    this.life = 3.2;
    this.animT = 0;
    this.isFireball = true;
    this.noSlopes = false;
  }
  update(dt) {
    this.animT += dt;
    this.life -= dt;
    if (this.life <= 0) { this.pop(); return; }
    this.vy = Math.min(this.vy + 1050 * dt, 320);
    moveActor(this, this.lvl.map, dt);
    if (this.onGround) this.vy = PHYS.fireballBounce;
    if (this.hitWall || this.hitCeil) { this.pop(); return; }
    if (rectHasTile(this.lvl.map, this.x, this.y, this.w, this.h, WATER_TILE)) { this.pop(); return; }
    if (this.lvl.particles.count < this.lvl.particles.budget - 20 && Math.random() < 0.5) {
      this.lvl.particles.spawn(P_KIND.EMBER, this.cx, this.cy, {
        vx: rrange(-12, 12), vy: rrange(-18, 4), life: 0.3, size: 2,
        col: '#ffcf66', col2: '#ff6a2a', drag: 2
      });
    }
  }
  pop() {
    if (this.remove) return;
    this.remove = true;
    this.lvl.particles.burst(this.cx, this.cy, 7, '#ffd27a', '#ff6a2a', 120, 0.32);
    this.lvl.audio.sfx('fizz');
  }
  render(g, camX, camY, alpha) {
    const art = Art.item('fireball', ((this.animT * 16) | 0) & 3);
    this.drawArt(g, art, camX, camY, alpha, false);
  }
}

class EnemyShot extends Entity {
  constructor(lvl, x, y, vx, vy) {
    super(lvl, x - 4, y - 4, 8, 8);
    this.vx = vx; this.vy = vy;
    this.life = 6;
    this.animT = 0;
    this.gravity = 0;
  }
  update(dt) {
    this.animT += dt;
    this.life -= dt;
    this.px = this.x; this.py = this.y;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const m = this.lvl.map;
    if (this.life <= 0 || m.rectSolid(this.x, this.y, this.w, this.h) ||
      this.x < -32 || this.x > m.pixW + 32 || this.y > m.pixH + 32) {
      this.remove = true;
      this.lvl.particles.burst(this.cx, this.cy, 5, '#c9a2ff', '#6a4a9a', 80, 0.3);
    }
  }
  render(g, camX, camY, alpha) {
    const art = Art.item('projectile', ((this.animT * 10) | 0) & 1);
    this.drawArt(g, art, camX, camY, alpha, false);
  }
}

/* --------------------------------------------------------- collectibles */
class Spark extends Entity {
  constructor(lvl, x, y, opt) {
    super(lvl, x + 3, y + 2, 10, 12);
    this.animT = Math.random() * 2;
    this.bob = (x * 0.13);
    this.gravity = 0;
    this.free = !!(opt && opt.free);      // spawned from a block (arcs upward)
    if (this.free) {
      this.vy = -230; this.vx = (opt.vx || 0);
      this.life = 0.85;
    }
    this.collected = false;
  }
  update(dt) {
    this.animT += dt;
    if (this.free) {
      this.px = this.x; this.py = this.y;
      this.vy += 1000 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;
      if (this.life <= 0) {
        this.remove = true;
        this.lvl.collectSpark(this.cx, this.cy, true);
      }
      return;
    }
    if (this.lvl.particles.count < 60 && Math.random() < 0.012) {
      this.lvl.particles.spawn(P_KIND.SPARK, this.cx + rrange(-5, 5), this.cy + rrange(-6, 6), {
        vy: -14, life: 0.45, size: 1, col: '#fff6c0', col2: '#ffd45c', drag: 1
      });
    }
  }
  render(g, camX, camY, alpha) {
    const f = ((this.animT * 11) | 0) & 7;
    const art = Art.item('spark', f);
    const yo = this.free ? 0 : Math.round(Math.sin(this.animT * 3 + this.bob) * 1.2);
    if (!art) return;
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY) + yo;
    g.drawImage(art.c, x + art.ox, y + art.oy);
  }
}

class Emberstone extends Entity {
  constructor(lvl, x, y) {
    super(lvl, x, y, 16, 16);
    this.animT = Math.random() * 2;
    this.gravity = 0;
  }
  update(dt) {
    this.animT += dt;
    if (Math.random() < 0.06) {
      this.lvl.particles.spawn(P_KIND.SPARK, this.cx + rrange(-8, 8), this.cy + rrange(-8, 8), {
        vy: -20, life: 0.5, size: 1, col: '#ffd0a0', col2: '#ff8a3d', drag: 1
      });
    }
  }
  render(g, camX, camY, alpha) {
    const art = Art.item('emberstone', ((this.animT * 6) | 0) & 3);
    const yo = Math.round(Math.sin(this.animT * 2.4) * 1.6);
    if (!art) return;
    g.drawImage(art.c, Math.round(this.x - camX) + art.ox, Math.round(this.y - camY) + art.oy + yo);
  }
}

/* ----------------------------------------------------------- power-ups */
class PowerUp extends Entity {
  constructor(lvl, x, y, kind) {
    super(lvl, x, y, 14, 14);
    this.kind = kind;
    this.animT = 0;
    this.emerge = 1;                 // 1 -> 0 while rising out of the block
    this.emergeFrom = y;
    this.dir = 1;
    this.state = 'emerge';
    this.vx = 0; this.vy = 0;
    this.floaty = (kind === 'feather');
  }
  update(dt) {
    this.animT += dt;
    this.px = this.x; this.py = this.y;
    if (this.state === 'emerge') {
      this.emerge -= dt / 0.55;
      this.y = this.emergeFrom - (1 - Math.max(0, this.emerge)) * 16;
      if (this.emerge <= 0) {
        this.state = 'live';
        this.y = this.emergeFrom - 16;
        if (this.kind === 'star') { this.vy = -170; this.vx = 62; }
        else if (this.kind === 'growth' || this.kind === 'shield' || this.kind === '1up') this.vx = 46;
        else if (this.kind === 'feather') this.vx = 0;
      }
      return;
    }
    if (this.kind === 'ember') {
      // stays put, gently bobbing — it's a stationary bloom
      return;
    }
    if (this.kind === 'feather') {
      this.vy = 26 + Math.sin(this.animT * 3) * 22;
      this.vx = Math.sin(this.animT * 1.4) * 26;
      moveActor(this, this.lvl.map, dt);
      if (this.onGround) this.vy = -40;
      return;
    }
    this.vy = Math.min(this.vy + 900 * dt, 300);
    this.vx = this.dir * (this.kind === 'star' ? 74 : 46);
    moveActor(this, this.lvl.map, dt);
    if (this.hitWall) this.dir = -this.dir;
    if (this.kind === 'star' && this.onGround) {
      this.vy = -170;
      this.lvl.particles.sparkle(this.cx, this.y + this.h, '#fff3a0');
    }
    if (this.y > this.lvl.map.pixH + 40) this.remove = true;
  }
  render(g, camX, camY, alpha) {
    const frames = { star: 4, spark: 8 };
    const f = this.kind === 'star' ? (((this.animT * 12) | 0) & 3) : 0;
    const art = Art.item(this.kind, f);
    if (!art) return;
    let x = Math.round(lerp(this.px, this.x, alpha) - camX);
    let y = Math.round(lerp(this.py, this.y, alpha) - camY);
    if (this.kind === 'ember' && this.state === 'live') y += Math.round(Math.sin(this.animT * 3) * 1.2);
    if (this.state === 'emerge') {
      // clip to the block mouth so it slides out rather than popping in
      g.save();
      g.beginPath();
      g.rect(x - 4, Math.round(this.emergeFrom - 16 - camY), this.w + 8, 16);
      g.clip();
      g.drawImage(art.c, x + art.ox, y + art.oy);
      g.restore();
      return;
    }
    g.drawImage(art.c, x + art.ox, y + art.oy);
  }
}

/* ------------------------------------------------------------ platforms */
class MovingPlatform extends Entity {
  constructor(lvl, x, y, opt) {
    opt = opt || {};
    const wTiles = opt.w || 3;
    super(lvl, x, y, wTiles * TILE, 8);
    this.homeX = x; this.homeY = y;
    this.dist = (opt.dist || 4) * TILE;
    this.speed = opt.speed || 32;
    this.vertical = opt.path === 'v';
    this.circular = opt.path === 'c';
    this.phase = opt.phase || 0;
    this.type = 'movingplat';
    this.solidTop = true;
    this.dx = 0; this.dy = 0;
  }
  update(dt) {
    this.px = this.x; this.py = this.y;
    this.phase += dt * (this.speed / Math.max(8, this.dist));
    const s = Math.sin(this.phase);
    let nx = this.homeX, ny = this.homeY;
    if (this.circular) { nx += Math.cos(this.phase) * this.dist; ny += s * this.dist * 0.6; }
    else if (this.vertical) ny += s * this.dist;
    else nx += s * this.dist;
    this.dx = nx - this.x; this.dy = ny - this.y;
    this.x = nx; this.y = ny;
  }
  render(g, camX, camY, alpha) {
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);
    const img = Art.tile(T.SEMI, this.lvl.map.theme, 0);
    for (let i = 0; i < this.w; i += TILE) {
      if (img) g.drawImage(img, x + i, y);
    }
    // bolts at the ends, so it reads as machinery rather than scenery
    g.fillStyle = '#3b2c22';
    g.fillRect(x + 2, y + 3, 2, 2);
    g.fillRect(x + this.w - 4, y + 3, 2, 2);
  }
}

class FallingPlatform extends Entity {
  constructor(lvl, x, y, opt) {
    opt = opt || {};
    super(lvl, x, y, (opt.w || 3) * TILE, 8);
    this.state = 'idle';
    this.t = 0;
    this.homeY = y;
    this.solidTop = true;
    this.type = 'fallingplat';
    this.shakeX = 0;
  }
  trigger() {
    if (this.state === 'idle') { this.state = 'shake'; this.t = 0.55; this.lvl.audio.sfx('bump'); }
  }
  update(dt) {
    this.px = this.x; this.py = this.y;
    if (this.state === 'shake') {
      this.t -= dt;
      this.shakeX = Math.sin(this.t * 60) * 1.4;
      if (this.t <= 0) { this.state = 'fall'; this.vy = 0; }
    } else if (this.state === 'fall') {
      this.vy = Math.min(this.vy + 900 * dt, 420);
      this.y += this.vy * dt;
      this.shakeX = 0;
      if (this.y > this.lvl.map.pixH + 40) { this.state = 'gone'; this.solidTop = false; this.remove = true; }
    }
    this.dx = 0; this.dy = this.y - this.py;
  }
  render(g, camX, camY, alpha) {
    const x = Math.round(lerp(this.px, this.x, alpha) - camX + this.shakeX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);
    const img = Art.tile(T.SEMI, this.lvl.map.theme, 1);
    for (let i = 0; i < this.w; i += TILE) if (img) g.drawImage(img, x + i, y);
    if (this.state === 'shake') {
      g.globalAlpha = 0.5 + Math.sin(this.t * 40) * 0.4;
      g.fillStyle = '#ff6a4a';
      g.fillRect(x, y - 1, this.w, 1);
      g.globalAlpha = 1;
    }
  }
}

class CloudPlatform extends Entity {
  constructor(lvl, x, y, opt) {
    opt = opt || {};
    super(lvl, x, y, (opt.w || 3) * TILE, 8);
    this.solidTop = true;
    this.type = 'cloudplat';
    this.t = Math.random() * 6.283;
    this.homeY = y;
  }
  update(dt) {
    this.px = this.x; this.py = this.y;
    this.t += dt;
    this.y = this.homeY + Math.sin(this.t * 1.3) * 2.5;
    this.dx = 0; this.dy = this.y - this.py;
  }
  render(g, camX, camY, alpha) {
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);
    const img = Art.decor('cloudsmall', this.lvl.map.theme, 0);
    if (img) for (let i = 0; i < this.w; i += 16) g.drawImage(img, x + i - 2, y - 4);
  }
}

/* ============================== BOSS ====================================
   The Cinder Warden — three escalating phases with readable telegraphs.
   Phase 1  stomp-slam pattern, vulnerable after each slam
   Phase 2  projectile volleys + a wall-shaking charge
   Phase 3  both, faster, plus falling debris
   ====================================================================== */
class BossWarden extends Enemy {
  constructor(lvl, x, y, arena) {
    super(lvl, x - 24, y - 44, 48, 44);
    this.type = 'boss';
    this.maxHp = 12;
    this.hp = 12;
    this.phase = 1;
    this.stompable = false;
    this.shellKillable = false;
    this.scoreValue = 5000;
    this.state = 'intro';
    this.t = 1.6;
    this.stun = 0;
    this.iframe = 0;
    this.flash = 0;
    this.dir = -1;
    this.animT = 0;
    this.arena = arena || { x0: x - 200, x1: x + 200 };
    this.spawnX = this.x; this.spawnY = this.y;   // used to reset the fight
    this.gravity = 1150;
    this.defeated = false;
    this.deathT = 0;
    this.telegraph = 0;
    this.volley = 0;
    this.active = true;
    this.wakeDist = 400;
    this.roarT = 0;
  }

  get vulnerable() { return this.stun > 0; }

  hurtBoss(amount, from) {
    if (this.iframe > 0 || this.defeated) return false;
    this.hp -= amount;
    this.iframe = 0.5;
    this.flash = 0.28;
    const lvl = this.lvl;
    lvl.audio.sfx('bosshit');
    lvl.camera.addShake(3.2, 0.22);
    lvl.hitStop(0.09);
    lvl.particles.burst(this.cx, this.cy, 16, '#ffd08a', '#ff5a2a', 190, 0.6);
    if (this.hp <= 0) { this.beginDefeat(); return true; }
    const newPhase = this.hp > 8 ? 1 : (this.hp > 4 ? 2 : 3);
    if (newPhase !== this.phase) {
      this.phase = newPhase;
      this.state = 'roar';
      this.t = 1.15;
      this.stun = 0;
      lvl.audio.sfx('bossroar');
      lvl.camera.addShake(4, 0.5);
      lvl.onBossPhase(this.phase);
    } else if (this.stun > 0) {
      this.stun = 0;
      this.state = 'recover';
      this.t = 0.5;
    }
    return true;
  }

  beginDefeat() {
    this.defeated = true;
    this.state = 'dead';
    this.deathT = 0;
    this.vx = 0;
    this.lvl.audio.sfx('bossroar');
    this.lvl.camera.addShake(5, 0.9);
    this.lvl.onBossDefeated();
  }

  onStomp(p, lvl) {
    if (this.defeated) return false;
    if (this.vulnerable) {
      this.hurtBoss(2, 'stomp');
      return true;
    }
    return false;             // not vulnerable -> the caller damages the player
  }

  update(dt) {
    this.animT += dt;
    if (this.iframe > 0) this.iframe -= dt;
    if (this.flash > 0) this.flash -= dt;
    const lvl = this.lvl, p = lvl.player;

    if (this.defeated) {
      this.deathT += dt;
      this.vx = 0;
      this.vy = Math.min(this.vy + this.gravity * dt, 400);
      moveActor(this, lvl.map, dt);
      if (this.deathT < 2.4 && Math.random() < 0.5) {
        lvl.particles.burst(this.cx + rrange(-22, 22), this.cy + rrange(-18, 18), 4,
          '#ffcf7a', '#ff4a2a', 140, 0.6);
        if (Math.random() < 0.25) lvl.camera.addShake(2, 0.15);
      }
      return;
    }

    if (this.stun > 0) {
      this.stun -= dt;
      this.vx = approach(this.vx, 0, 400 * dt);
      this.vy = Math.min(this.vy + this.gravity * dt, 420);
      moveActor(this, lvl.map, dt);
      if (Math.random() < 0.3) {
        lvl.particles.spawn(P_KIND.SMOKE, this.cx + rrange(-16, 16), this.y + rrange(0, 12), {
          vy: -18, life: 0.5, size: 2, col: '#d8d0c8', col2: '#8a8078', drag: 1.2
        });
      }
      if (this.stun <= 0) { this.state = 'recover'; this.t = 0.4; }
      return;
    }

    this.t -= dt;
    const speedMul = this.phase === 3 ? 1.55 : (this.phase === 2 ? 1.22 : 1);

    switch (this.state) {
      case 'intro':
        this.vx = 0;
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (this.t <= 0) { this.state = 'walk'; this.t = 1.3; lvl.audio.sfx('bossroar'); }
        break;

      case 'roar':
        this.vx = 0;
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (Math.random() < 0.6) {
          lvl.particles.spawn(P_KIND.EMBER, this.cx + rrange(-20, 20), this.cy + rrange(-16, 8), {
            vy: rrange(-50, -18), vx: rrange(-20, 20), life: 0.6, size: 2,
            col: '#ffc46a', col2: '#ff5a2a', drag: 1
          });
        }
        if (this.t <= 0) { this.state = 'walk'; this.t = 0.9; }
        break;

      case 'walk': {
        this.dir = p.cx < this.cx ? -1 : 1;
        this.vx = this.dir * 32 * speedMul;
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        this.clampArena();
        if (this.t <= 0) {
          // choose the next attack based on the phase and the player's distance
          const dist = Math.abs(p.cx - this.cx);
          let pick;
          if (this.phase === 1) pick = 'slam';
          else if (this.phase === 2) pick = dist > 70 ? 'volley' : 'charge';
          else pick = Math.random() < 0.4 ? 'volley' : (Math.random() < 0.6 ? 'charge' : 'slam');
          this.state = 'telegraph_' + pick;
          this.t = pick === 'charge' ? 0.62 : 0.5;
          this.telegraph = this.t;
          lvl.audio.sfx('heartbeat');
        }
        break;
      }

      case 'telegraph_slam':
      case 'telegraph_charge':
      case 'telegraph_volley': {
        this.vx = approach(this.vx, 0, 600 * dt);
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (Math.random() < 0.5) {
          lvl.particles.spawn(P_KIND.EMBER, this.cx + rrange(-18, 18), this.y + this.h - rrange(0, 10), {
            vy: rrange(-60, -25), life: 0.45, size: 2, col: '#ffd07a', col2: '#ff4a1a', drag: 1
          });
        }
        if (this.t <= 0) {
          const which = this.state.slice(10);
          if (which === 'slam') {
            this.state = 'jump';
            this.vy = -390;
            this.vx = clamp((p.cx - this.cx) * 1.15, -110, 110);
            lvl.audio.sfx('jumpbig');
          } else if (which === 'charge') {
            this.state = 'charge';
            this.dir = p.cx < this.cx ? -1 : 1;
            this.vx = this.dir * 190 * speedMul;
            this.t = 2.4;
            lvl.audio.sfx('bossroar');
          } else {
            this.state = 'volley';
            this.volley = this.phase === 3 ? 4 : 3;
            this.t = 0.16;
          }
        }
        break;
      }

      case 'jump':
        this.vy = Math.min(this.vy + this.gravity * dt, 460);
        moveActor(this, lvl.map, dt);
        this.clampArena();
        if (this.onGround) {
          this.state = 'land';
          this.t = 0.22;
          lvl.camera.addShake(4.4, 0.34);
          lvl.audio.sfx('bosshit');
          lvl.shockwave(this.cx, this.y + this.h);
          lvl.particles.landPuff(this.cx, this.y + this.h, 1.4);
          for (let i = 0; i < 10; i++) {
            lvl.particles.spawn(P_KIND.EMBER, this.cx + rrange(-26, 26), this.y + this.h - 2, {
              vx: rrange(-90, 90), vy: rrange(-140, -40), life: 0.6, size: 2,
              col: '#ffcf7a', col2: '#ff5a2a', grav: 320
            });
          }
          if (this.phase >= 3) lvl.dropDebris(3);
        }
        break;

      case 'land':
        this.vx = approach(this.vx, 0, 900 * dt);
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (this.t <= 0) { this.stun = this.phase === 3 ? 1.15 : 1.6; this.state = 'stunned'; }
        break;

      case 'charge':
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        this.vx = this.dir * 190 * speedMul;
        moveActor(this, lvl.map, dt);
        if (Math.random() < 0.7) {
          lvl.particles.dust(this.cx - this.dir * 18, this.y + this.h - 2, this.dir, 2);
        }
        if (this.hitWall || this.atArenaEdge()) {
          this.vx = 0;
          lvl.camera.addShake(4.8, 0.4);
          lvl.audio.sfx('bosshit');
          lvl.particles.burst(this.cx + this.dir * 22, this.cy, 14, '#e8dcc0', '#8a7050', 180, 0.6);
          if (this.phase >= 2) lvl.dropDebris(this.phase === 3 ? 4 : 2);
          this.stun = this.phase === 3 ? 1.2 : 1.7;
          this.state = 'stunned';
        } else if (this.t <= 0) {
          this.state = 'walk'; this.t = 0.7;
        }
        break;

      case 'volley':
        this.vx = 0;
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (this.t <= 0) {
          this.volley--;
          const dirTo = p.cx < this.cx ? -1 : 1;
          const spread = this.phase === 3 ? [-0.34, 0, 0.34] : [-0.22, 0.22];
          for (let i = 0; i < spread.length; i++) {
            lvl.spawnEnemyShot(this.cx + dirTo * 18, this.cy - 6,
              dirTo * 96, -70 + spread[i] * 150);
          }
          lvl.audio.sfx('cannon');
          lvl.camera.addShake(1.2, 0.1);
          this.t = this.phase === 3 ? 0.3 : 0.42;
          if (this.volley <= 0) { this.state = 'walk'; this.t = 0.85; }
        }
        break;

      case 'recover':
        this.vx = approach(this.vx, 0, 500 * dt);
        this.vy = Math.min(this.vy + this.gravity * dt, 420);
        moveActor(this, lvl.map, dt);
        if (this.t <= 0) { this.state = 'walk'; this.t = 0.75; }
        break;

      case 'stunned':
        break;
    }
  }

  atArenaEdge() {
    return (this.dir < 0 && this.x <= this.arena.x0 + 1) ||
      (this.dir > 0 && this.x + this.w >= this.arena.x1 - 1);
  }
  clampArena() {
    if (this.x < this.arena.x0) { this.x = this.arena.x0; this.vx = 0; }
    if (this.x + this.w > this.arena.x1) { this.x = this.arena.x1 - this.w; this.vx = 0; }
  }

  render(g, camX, camY, alpha) {
    let anim = 'idle', frame = 0;
    if (this.defeated) anim = 'dead';
    else if (this.stun > 0) anim = 'hurt';
    else if (this.state === 'roar' || this.state.indexOf('telegraph') === 0) anim = 'roar';
    else if (this.state === 'jump' || this.state === 'land') anim = 'jump';
    else if (this.state === 'charge' || this.state === 'walk') { anim = 'walk'; frame = ((this.animT * 7) | 0) & 1; }
    else frame = ((this.animT * 2.2) | 0) & 1;

    const art = Art.enemy('boss', anim, frame);
    if (!art || !art.c) return;
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);

    g.save();
    // telegraph glow: the whole silhouette pulses red just before an attack
    if (this.state.indexOf('telegraph') === 0) {
      g.globalAlpha = 0.35 + Math.sin(this.animT * 32) * 0.25;
      g.fillStyle = '#ff3a1a';
      g.fillRect(x - 3, y - 3, this.w + 6, this.h + 6);
      g.globalAlpha = 1;
    }
    if (this.defeated) {
      g.globalAlpha = clamp(1 - (this.deathT - 1.8) / 1.2, 0, 1);
    }
    if (this.dir > 0) {
      g.translate(x + this.w * 0.5, y);
      g.scale(-1, 1);
      g.drawImage(art.c, -this.w * 0.5 + art.ox, art.oy);
    } else {
      g.drawImage(art.c, x + art.ox, y + art.oy);
    }
    g.restore();

    if (this.flash > 0) {
      g.save();
      g.globalAlpha = clamp(this.flash * 3.2, 0, 0.85);
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = '#ffffff';
      g.fillRect(x, y, this.w, this.h);
      g.restore();
    }
    if (this.stun > 0) {
      // stun stars orbiting the head — the "hit me now" tell
      for (let i = 0; i < 3; i++) {
        const a = this.animT * 5 + i * 2.09;
        const sx = Math.round(x + this.w * 0.5 + Math.cos(a) * 15);
        const sy = Math.round(y - 5 + Math.sin(a) * 4);
        Text.draw(g, '★', sx, sy, { color: '#ffe45c', align: 'center', outline: '#5a2a10' });
      }
    }
  }
}

/* falling ceiling debris used in boss phase 3 */
class Debris extends Entity {
  constructor(lvl, x, y) {
    super(lvl, x - 5, y, 10, 10);
    this.vy = 0;
    this.warn = 0.55;
    this.animT = 0;
    this.landed = 0;
  }
  update(dt) {
    this.animT += dt;
    this.px = this.x; this.py = this.y;
    if (this.warn > 0) { this.warn -= dt; return; }
    this.vy = Math.min(this.vy + 900 * dt, 380);
    this.y += this.vy * dt;
    if (this.lvl.map.rectSolid(this.x, this.y + this.h, this.w, 1) || this.y > this.lvl.map.pixH) {
      this.remove = true;
      this.lvl.particles.burst(this.cx, this.cy, 8, '#c8a882', '#6a4a2a', 130, 0.45);
      this.lvl.audio.sfx('bump');
    }
  }
  render(g, camX, camY, alpha) {
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);
    if (this.warn > 0) {
      g.globalAlpha = 0.4 + Math.sin(this.animT * 30) * 0.3;
      g.fillStyle = '#ff5a3a';
      g.fillRect(x, y, this.w, 2);
      g.globalAlpha = 1;
      return;
    }
    g.fillStyle = '#7a5638';
    g.fillRect(x, y, this.w, this.h);
    g.fillStyle = '#a8794f';
    g.fillRect(x + 1, y + 1, this.w - 3, this.h - 4);
    g.fillStyle = '#5a3c26';
    g.fillRect(x + 2, y + this.h - 3, this.w - 4, 2);
  }
}

/* factory used by the level loader */
function makeEnemy(type, lvl, x, y, opt) {
  switch (type) {
    case 'walker': return new Walker(lvl, x, y);
    case 'shellcrawler': return new Shellcrawler(lvl, x, y);
    case 'winghopper': return new WingHopper(lvl, x, y);
    case 'tunnelplant': return new TunnelPlant(lvl, x, y);
    case 'beetle': return new Beetle(lvl, x, y);
    case 'flyingguard': return new FlyingGuard(lvl, x, y, opt);
    case 'cannoncreature': return new CannonCreature(lvl, x, y);
    default: return null;
  }
}

/* ========================================================================
   LEVEL RUNTIME
   ======================================================================== */

/* ==========================================================================
   EMBERLEAP — engine part 5
   Level runtime: spawning · interactions · blocks · warps · rendering
   ========================================================================== */

const POWER_ORDER = ['growth', 'ember', 'feather', 'shield', 'star'];

class Level {
  constructor(game, def, index) {
    this.game = game;
    this.def = def;
    this.index = index;
    this.audio = game.audio;
    this.map = new TileMap(def);
    this.camera = game.camera;
    this.particles = game.particles;

    this.player = new Player(this);
    this.enemies = [];
    this.items = [];          // sparks, emberstones, power-ups
    this.projectiles = [];
    this.platforms = [];
    this.effects = [];        // bumped-block animations etc.

    this.time = def.time || 300;
    this.timeAccum = 0;
    this.hurryPlayed = false;

    this.state = 'play';      // play | dying | clear | poleslide | done
    this.stateT = 0;
    this.hitStopT = 0;
    this.flashT = 0;
    this.flashCol = '#ffffff';

    this.checkpoint = null;
    this.startPos = { x: 32, y: 32 };
    this.warps = [];
    this.secrets = [];
    this.boss = null;
    this.bossIntro = 0;

    this.stompChain = 0;
    this.stompChainT = 0;
    this.shellChain = 0;

    this.sparksThisLevel = 0;
    this.scoreThisLevel = 0;
    this.quality = 1;

    this.bumps = [];          // {tx,ty,t,idx}
    this.multiBlocks = new Map();

    this.spawnAll();
    this.camera.setBounds(this.map.pixW, this.map.pixH);
    this.camera.snapTo(this.player.x - this.camera.vw * 0.5, this.player.y - this.camera.vh * 0.5);
  }

  /* -------------------------------------------------------------- spawning */
  spawnAll() {
    const def = this.def, map = this.map;

    // entities[] wins over ASCII platform chars: the level files carry BOTH a
    // visual 'M'/'F'/'c' marker and a parameterised record, and spawning both
    // would double up every moving platform.
    const platEnts = (def.entities || []).filter(e => /plat$/.test(e.type));
    const claimed = new Set();

    (def.entities || []).forEach(e => {
      const wx = e.x * TILE, wy = e.y * TILE;
      switch (e.type) {
        case 'movingplat':
          this.platforms.push(new MovingPlatform(this, wx, wy, e)); break;
        case 'fallingplat':
          this.platforms.push(new FallingPlatform(this, wx, wy, e)); break;
        case 'cloudplat':
          this.platforms.push(new CloudPlatform(this, wx, wy, e)); break;
        case 'warp':
          this.warps.push({
            x: wx, y: wy, w: (e.w || 2) * TILE, h: (e.h || 2) * TILE,
            dir: e.dir || 'down', to: e.to, back: e.back, used: false
          });
          break;
        case 'secret':
          this.secrets.push({
            x: wx, y: wy, w: (e.w || 4) * TILE, h: (e.h || 4) * TILE, found: 0
          });
          break;
        case 'enemy':
          if (e.kind) {
            const en = makeEnemy(e.kind, this, wx, wy + TILE, e);
            if (en) this.enemies.push(en);
          }
          break;
      }
    });

    map.spawns.forEach(s => {
      const bottom = s.y + TILE;              // spawns sit ON the tile they mark
      switch (s.type) {
        case 'start':
          this.startPos = { x: s.x, y: bottom };
          this.player.spawnAt(s.x, bottom);
          break;
        case 'spark':
          this.items.push(new Spark(this, s.x, s.y));
          break;
        case 'emberstone':
          this.items.push(new Emberstone(this, s.x, s.y));
          break;
        case 'boss': {
          const arena = this.findArena(s.tx);
          this.boss = new BossWarden(this, s.x + TILE / 2, bottom, arena);
          this.enemies.push(this.boss);
          this.buildBossGates(arena);
          break;
        }
        case 'movingplat': case 'fallingplat': case 'cloudplat': {
          const dupe = platEnts.some(e => Math.abs(e.x - s.tx) <= 1 && Math.abs(e.y - s.ty) <= 1);
          if (dupe) break;                     // already spawned from entities[]
          const Klass = s.type === 'movingplat' ? MovingPlatform
            : (s.type === 'fallingplat' ? FallingPlatform : CloudPlatform);
          this.platforms.push(new Klass(this, s.x, s.y, { w: 3 }));
          break;
        }
        default: {
          const en = makeEnemy(s.type, this, s.x, bottom);
          if (en) this.enemies.push(en);
          break;
        }
      }
    });
  }

  /** walls around the boss spawn define its charge arena */
  findArena(tx) {
    const map = this.map;
    let x0 = 0, x1 = map.pixW;
    const probeY = Math.floor(map.h * 0.5);
    for (let x = tx; x >= 0; x--) {
      let wall = false;
      for (let y = 1; y < map.h - 1; y++) if (map.isSolid(x, y) && map.at(x, y - 1) !== T.EMPTY) { wall = true; break; }
      if (wall && map.isSolid(x, probeY)) { x0 = (x + 1) * TILE; break; }
    }
    for (let x = tx; x < map.w; x++) {
      if (map.isSolid(x, probeY)) { x1 = x * TILE; break; }
    }
    if (x1 - x0 < 120) { x0 = Math.max(0, tx * TILE - 160); x1 = Math.min(map.pixW, tx * TILE + 160); }
    return { x0: x0, x1: x1 };
  }

  /* ------------------------------------------------------------ boss gates
     The arena walls stop a few rows above the floor, which would let the
     player simply run past the Warden to the goal. Slam shutters down on
     both sides when the player commits to the fight, and open on defeat.   */
  buildBossGates(arena) {
    const map = this.map;
    const cols = [Math.floor(arena.x0 / TILE) - 1, Math.floor(arena.x1 / TILE)];
    this.bossGates = [];
    cols.forEach(tx => {
      if (tx < 0 || tx >= map.w) return;
      // walk up from the floor and record the open cells that form the doorway
      for (let ty = map.h - 1; ty > 0; ty--) {
        if (SOLID_TILE[map.at(tx, ty)]) continue;
        if (map.at(tx, ty - 1) === T.EMPTY && map.at(tx, ty) === T.EMPTY) {
          this.bossGates.push({ tx: tx, ty: ty });
        }
        // stop once we reach the existing wall above the doorway
        if (SOLID_TILE[map.at(tx, ty - 1)]) break;
      }
    });
    this.gatesClosed = false;
  }

  closeBossGates() {
    if (this.gatesClosed || !this.bossGates || !this.bossGates.length) return;
    this.gatesClosed = true;
    this.bossGates.forEach(g => {
      this.map.set(g.tx, g.ty, T.SOLID);
      this.particles.burst(g.tx * TILE + 8, g.ty * TILE + 8, 5, '#c8a882', '#6a4a2a', 90, 0.35);
    });
    this.audio.sfx('bump');
    this.camera.addShake(2.4, 0.25);
  }

  openBossGates() {
    if (!this.bossGates) return;
    this.gatesClosed = false;
    this.bossGates.forEach(g => {
      this.map.set(g.tx, g.ty, T.EMPTY);
      this.particles.shards(g.tx * TILE + 8, g.ty * TILE + 8, '#c8a882', '#e0c8a0');
    });
    this.audio.sfx('brickbreak');
    this.camera.addShake(3, 0.3);
  }

  /* ---------------------------------------------------------------- helpers */
  hitStop(t) { this.hitStopT = Math.max(this.hitStopT, t); }
  flash(col, t) { this.flashCol = col || '#ffffff'; this.flashT = Math.max(this.flashT, t || 0.1); }

  addScore(n, x, y, popup) {
    this.scoreThisLevel += n;
    this.game.score += n;
    if (popup && x !== undefined) this.particles.popText(x, y - 4, String(n), '#fff6c0');
  }
  addLife() {
    this.game.lives = Math.min(99, this.game.lives + 1);
    this.audio.duckForJingle('1up');
    this.particles.popText(this.player.cx, this.player.y - 8, '1UP', '#8bff8a');
  }

  countFireballs() {
    let n = 0;
    for (let i = 0; i < this.projectiles.length; i++) if (this.projectiles[i].isFireball) n++;
    return n;
  }
  spawnFireball(x, y, dir) { this.projectiles.push(new Fireball(this, x, y, dir)); }
  spawnEnemyShot(x, y, vx, vy) { this.projectiles.push(new EnemyShot(this, x, y, vx, vy)); }

  shockwave(x, y) {
    this.particles.ring(x, y, '#ffd07a', 6);
    for (let i = 0; i < 8; i++) {
      const d = i < 4 ? -1 : 1;
      this.particles.spawn(P_KIND.DUST, x, y - 2, {
        vx: d * rrange(60, 190), vy: rrange(-60, -10),
        life: 0.5, size: 3, col: '#f2e8cf', col2: '#a8987a', grav: 220, drag: 1.5
      });
    }
  }
  dropDebris(n) {
    if (!this.boss) return;
    const a = this.boss.arena;
    for (let i = 0; i < n; i++) {
      const x = rrange(a.x0 + 20, a.x1 - 20);
      this.projectiles.push(new Debris(this, x, this.camera.y + 4));
    }
  }

  comboFromShell() {
    this.shellChain++;
    const v = Math.min(8000, 400 * Math.pow(2, Math.min(this.shellChain - 1, 4)));
    this.addScore(v, this.player.cx, this.player.y - 10, true);
  }

  onStarStart() {
    this.audio.playMusic('star');
    this.flash('#ffffff', 0.14);
  }
  onStarEnd() {
    this.audio.playMusic(this.def.music || 'overworld');
  }

  onPlayerDeath() {
    this.state = 'dying';
    this.stateT = 0;
    this.audio.stopMusic({ fade: 0.15 });
    this.audio.sfx('die');
    this.camera.addShake(2, 0.2);
  }

  onBossPhase(p) {
    this.flash('#ff9a4a', 0.16);
    if (p === 3) {
      // phase 3 raises the side ledges into play
      this.platforms.forEach(pl => { if (pl.type === 'movingplat') pl.speed *= 1.35; });
    }
  }
  onBossDefeated() {
    this.state = 'bossdead';
    this.stateT = 0;
    this.audio.stopMusic({ fade: 0.4 });
    this.addScore(5000, this.boss.cx, this.boss.y);
    this.player.controlLock = 3.0;
    this.openBossGates();
  }

  onPoleBottom() {
    this.audio.sfx('flag');
  }

  /* --------------------------------------------------------- block bumping */
  bumpFromBelow(p) {
    const map = this.map;
    // pick the bumpable tile nearest the player's centre among those overhead
    const ty = Math.floor((p.y - 1) / TILE);
    const cx = p.cx;
    const cands = [Math.floor((p.x + 1) / TILE), Math.floor((p.x + p.w - 1) / TILE)];
    let best = -1, bestD = 1e9;
    for (let i = 0; i < cands.length; i++) {
      const tx = cands[i];
      const id = map.at(tx, ty);
      if (!BUMPABLE[id] && !SOLID_TILE[id]) continue;
      const d = Math.abs((tx * TILE + 8) - cx);
      if (d < bestD) { bestD = d; best = tx; }
    }
    if (best < 0) return;
    this.bumpTile(best, ty, p);
  }

  bumpTile(tx, ty, p) {
    const map = this.map;
    const id = map.at(tx, ty);
    if (!BUMPABLE[id]) {
      if (SOLID_TILE[id]) this.audio.sfx('bump');
      return;
    }
    const big = p.big;
    const idx = map.idx(tx, ty);

    if (id === T.BRICK) {
      if (big) {
        map.set(tx, ty, T.EMPTY);
        this.audio.sfx('brickbreak');
        this.addScore(50, tx * TILE + 8, ty * TILE);
        this.particles.shards(tx * TILE + 8, ty * TILE + 8, '#c0603a', '#e59268');
        this.camera.addShake(1.6, 0.12);
        this.hitStop(0.04);
        this.flipEnemiesOn(tx, ty);
        return;
      }
      this.audio.sfx('bump');
      this.startBump(tx, ty);
      this.flipEnemiesOn(tx, ty);
      return;
    }

    // reward blocks
    this.startBump(tx, ty);
    this.flipEnemiesOn(tx, ty);
    const wx = tx * TILE, wy = ty * TILE;

    if (id === T.QMULTI) {
      let st = this.multiBlocks.get(idx);
      if (!st) { st = { n: 0, t: 0 }; this.multiBlocks.set(idx, st); }
      st.n++;
      st.t = 0;
      this.items.push(new Spark(this, wx, wy - TILE, { free: true, vx: rrange(-18, 18) }));
      this.audio.sfx('coin');
      if (st.n >= 8) map.set(tx, ty, T.USED);
      return;
    }

    if (id === T.QCOIN || id === T.HCOIN) {
      map.set(tx, ty, T.USED);
      this.items.push(new Spark(this, wx, wy - TILE, { free: true }));
      this.audio.sfx('coin');
      return;
    }

    if (id === T.QPOWER || id === T.HPOWER) {
      map.set(tx, ty, T.USED);
      const kind = this.choosePower();
      this.items.push(new PowerUp(this, wx + 1, wy, kind));
      this.audio.sfx('powerup');
      this.particles.sparkle(wx + 8, wy, '#fff6c0');
      return;
    }
  }

  /** power-up choice adapts to the player's current form */
  choosePower() {
    const f = this.player.form;
    const r = Math.random();
    if (f === 'small') return r < 0.82 ? 'growth' : 'shield';
    if (r < 0.34) return 'ember';
    if (r < 0.56) return 'feather';
    if (r < 0.74) return 'shield';
    if (r < 0.88) return 'star';
    return '1up';
  }

  startBump(tx, ty) {
    const idx = this.map.idx(tx, ty);
    for (let i = 0; i < this.bumps.length; i++) if (this.bumps[i].idx === idx) return;
    this.map.dynamic.add(idx);
    this.map.invalidateChunkAt(tx, ty);
    this.bumps.push({ tx: tx, ty: ty, idx: idx, t: 0 });
  }

  flipEnemiesOn(tx, ty) {
    const topY = ty * TILE;
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (e.dead || !e.active) continue;
      if (e.y + e.h <= topY + 3 && e.y + e.h >= topY - 6 &&
        e.x + e.w > tx * TILE && e.x < (tx + 1) * TILE) {
        if (e.type === 'boss') continue;
        e.killBy('shell');
      }
    }
  }

  updateBumps(dt) {
    for (let i = this.bumps.length - 1; i >= 0; i--) {
      const b = this.bumps[i];
      b.t += dt;
      if (b.t >= 0.22) {
        this.map.dynamic.delete(b.idx);
        this.map.invalidateChunkAt(b.tx, b.ty);
        this.bumps.splice(i, 1);
      }
    }
    this.multiBlocks.forEach((st, idx) => {
      st.t += dt;
      if (st.t > 4 && st.n < 8) {
        const tx = idx % this.map.w, ty = (idx / this.map.w) | 0;
        if (this.map.at(tx, ty) === T.QMULTI) this.map.set(tx, ty, T.USED);
        this.multiBlocks.delete(idx);
      }
    });
  }

  bumpOffset(tx, ty) {
    for (let i = 0; i < this.bumps.length; i++) {
      const b = this.bumps[i];
      if (b.tx === tx && b.ty === ty) {
        const k = b.t / 0.22;
        return -Math.sin(k * Math.PI) * 7;
      }
    }
    return 0;
  }

  /* ------------------------------------------------------------- collecting */
  collectSpark(x, y, silent) {
    this.game.sparks++;
    this.sparksThisLevel++;
    this.addScore(200, 0, 0);
    if (!silent) this.audio.sfx('coin');
    this.particles.sparkle(x, y, '#ffe98a');
    if (this.game.sparks >= 100) {
      this.game.sparks -= 100;
      this.addLife();
    }
  }

  /* ------------------------------------------------------------------ warps */
  checkWarps(input) {
    const p = this.player;
    if (p.state !== PSTATE.NORMAL) return;
    for (let i = 0; i < this.warps.length; i++) {
      const w = this.warps[i];
      if (!rectHit(p.x, p.y, p.w, p.h, w.x, w.y, w.w, w.h)) continue;
      const wantDown = w.dir === 'down' && input.down(ACT.DOWN) && p.onGround;
      const wantUp = w.dir === 'up' && input.down(ACT.UP) && p.onGround;
      const wantSide = (w.dir === 'left' || w.dir === 'right') &&
        input.down(w.dir === 'left' ? ACT.LEFT : ACT.RIGHT);
      if (wantDown || wantUp || wantSide) {
        p.state = PSTATE.PIPE;
        p.pipe = {
          phase: 'in', t: 0, dir: w.dir, warp: w,
          outDir: w.dir === 'down' ? 'up' : (w.dir === 'up' ? 'down' : w.dir)
        };
        p.vx = 0; p.vy = 0;
        // centre the player on the pipe mouth so the slide reads cleanly
        p.x = w.x + w.w * 0.5 - p.w * 0.5;
        this.audio.sfx('warp');
        return;
      }
    }
  }

  doWarp(pipeState) {
    const w = pipeState.warp;
    if (!w || !w.to) return;
    const p = this.player;
    // returning through a bonus-room exit uses `back`, otherwise `to`
    const dest = w.entered ? (w.back || w.to) : w.to;
    w.entered = !w.entered;
    p.x = dest.x * TILE;
    p.y = dest.y * TILE - p.h;
    p.vx = 0; p.vy = 0;
    p.resolveOverlap();
    this.camera.snapTo(p.x - this.camera.vw * 0.5, p.y - this.camera.vh * 0.6);
    pipeState.outDir = 'up';
  }

  /* ----------------------------------------------------------------- update */
  update(dt, input) {
    if (this.hitStopT > 0) {
      this.hitStopT -= dt;
      // still advance particles a little so hit-stop feels punchy, not frozen
      this.particles.update(dt * 0.25);
      return;
    }
    if (this.flashT > 0) this.flashT -= dt;
    this.stateT += dt;

    switch (this.state) {
      case 'play': this.updatePlay(dt, input); break;
      case 'dying': this.updateDying(dt); break;
      case 'poleslide': this.updatePole(dt, input); break;
      case 'clear': this.updateClear(dt); break;
      case 'bossdead': this.updateBossDead(dt); break;
    }
  }

  updatePlay(dt, input) {
    const p = this.player;

    /* timer */
    this.timeAccum += dt;
    while (this.timeAccum >= 1) {
      this.timeAccum -= 1;
      this.time--;
      if (this.time === 100 && !this.hurryPlayed) {
        this.hurryPlayed = true;
        this.audio.sfx('heartbeat');
      }
      if (this.time <= 0) {
        this.time = 0;
        p.die(this);
        return;
      }
    }

    /* platforms move first so riders inherit this frame's delta */
    for (let i = 0; i < this.platforms.length; i++) this.platforms[i].update(dt);

    if (p.ridingPlat && !p.ridingPlat.remove) {
      p.carryX = p.ridingPlat.dx || 0;
      p.carryY = 0;
    }
    p.ridingPlat = null;

    p.update(dt, input, this);
    this.resolvePlatforms(p);
    this.checkWarps(input);

    /* enemies */
    const camL = this.camera.x, camR = this.camera.x + this.camera.vw;
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (!e.active) {
        if (e.x + e.w > camL - e.wakeDist && e.x < camR + e.wakeDist) e.wake();
        else continue;
      }
      // sleep far-off-screen enemies, but never a moving shell or the boss
      const far = e.x + e.w < camL - 420 || e.x > camR + 420;
      if (far && e.type !== 'boss' && !(e.type === 'shellcrawler' && e.mode === 'spin')) continue;
      e.update(dt);
      this.resolvePlatforms(e);
      if (e.y > this.map.pixH + 80) e.remove = true;
    }

    for (let i = 0; i < this.projectiles.length; i++) this.projectiles[i].update(dt);
    for (let i = 0; i < this.items.length; i++) this.items[i].update(dt);

    this.collide();
    this.updateBumps(dt);
    this.updateSecrets();
    this.particles.update(dt);
    this.cull();

    if (this.stompChainT > 0) {
      this.stompChainT -= dt;
      if (this.stompChainT <= 0) this.stompChain = 0;
    }
    if (!this.enemies.some(e => e.type === 'shellcrawler' && e.mode === 'spin')) this.shellChain = 0;

    /* seal the arena once the player commits to the boss fight */
    if (this.boss && !this.boss.defeated && !this.gatesClosed &&
      p.cx > this.boss.arena.x0 + 8 && p.cx < this.boss.arena.x1 - 8) {
      this.closeBossGates();
    }

    /* fall out of the world */
    if (p.y > this.map.pixH + 24 && p.state !== PSTATE.DYING) p.die(this);

    /* goal */
    if (p.state === PSTATE.NORMAL) this.checkGoal();
  }

  updateDying(dt) {
    this.player.update(dt, this.game.input, this);
    this.particles.update(dt);
    if (this.stateT > 2.2) this.game.onLevelFailed();
  }

  updatePole(dt, input) {
    this.player.update(dt, input, this);
    this.particles.update(dt);
    for (let i = 0; i < this.platforms.length; i++) this.platforms[i].update(dt);
    if (this.player.state === PSTATE.WALKOFF && this.stateT > 2.6) {
      this.state = 'clear';
      this.stateT = 0;
      this.game.onLevelCleared(this);
    }
  }

  updateClear(dt) {
    this.player.update(dt, this.game.input, this);
    this.particles.update(dt);
  }

  updateBossDead(dt) {
    for (let i = 0; i < this.enemies.length; i++) if (this.enemies[i].active) this.enemies[i].update(dt);
    this.player.update(dt, this.game.input, this);
    this.particles.update(dt);
    this.resolvePlatforms(this.player);
    if (this.stateT > 2.6 && this.state === 'bossdead') {
      this.state = 'play';
      this.player.controlLock = 0;
      this.audio.playMusic(this.def.music === 'boss' ? 'castle' : this.def.music);
      // open the way to the goal
      this.flash('#ffffff', 0.2);
    }
  }

  /** snap actors onto moving/falling/cloud platforms */
  resolvePlatforms(a) {
    for (let i = 0; i < this.platforms.length; i++) {
      const pl = this.platforms[i];
      if (!pl.solidTop || pl.remove) continue;
      if (a.x + a.w <= pl.x + 1 || a.x >= pl.x + pl.w - 1) continue;
      const prevBottom = a.py + a.h;
      const bottom = a.y + a.h;
      if (a.vy >= -0.01 && prevBottom <= pl.py + 3 && bottom >= pl.y - 0.5 && bottom <= pl.y + pl.h + 4) {
        a.y = pl.y - a.h;
        a.vy = 0;
        a.onGround = true;
        a.landed = a.landed || !a.wasOnGround;
        if (a === this.player) {
          a.ridingPlat = pl;
          if (pl.trigger) pl.trigger();
        } else {
          a.x += pl.dx || 0;
        }
      }
    }
  }

  /* --------------------------------------------------------------- collisions */
  collide() {
    const p = this.player;
    const playing = p.state === PSTATE.NORMAL || p.state === PSTATE.TRANSFORM;

    /* --- items --- */
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (it.remove) continue;
      if (!playing && p.state !== PSTATE.WALKOFF) continue;
      if (!rectHit(p.x, p.y, p.w, p.h, it.x, it.y, it.w, it.h)) continue;
      if (it instanceof Spark) {
        it.remove = true;
        this.collectSpark(it.cx, it.cy);
      } else if (it instanceof Emberstone) {
        it.remove = true;
        this.addScore(2000, it.cx, it.cy, true);
        this.audio.sfx('emberstone');
        this.particles.burst(it.cx, it.cy, 18, '#ffd07a', '#ff6a2a', 170, 0.7);
        this.particles.ring(it.cx, it.cy, '#ffe27a', 6);
        this.camera.addShake(1.4, 0.14);
      } else if (it instanceof PowerUp && it.state === 'live') {
        it.remove = true;
        p.applyPower(it.kind, this);
        if (it.kind === 'star') this.flash('#ffffff', 0.12);
      }
    }

    /* --- projectiles --- */
    for (let i = 0; i < this.projectiles.length; i++) {
      const pr = this.projectiles[i];
      if (pr.remove) continue;
      if (pr.isFireball) {
        for (let j = 0; j < this.enemies.length; j++) {
          const e = this.enemies[j];
          if (e.dead || !e.active || e.harmless) continue;
          if (!rectHit(pr.x, pr.y, pr.w, pr.h, e.x, e.y, e.w, e.h)) continue;
          if (e.type === 'boss') {
            if (e.hurtBoss(1, 'fire')) pr.pop();
          } else if (e.fireKillable) {
            e.killBy('fire');
            pr.pop();
          } else {
            pr.pop();
          }
          break;
        }
      } else if (playing && p.invuln <= 0 && p.star <= 0) {
        if (rectHit(pr.x, pr.y, pr.w, pr.h, p.x, p.y, p.w, p.h)) {
          if (p.hurt(this)) pr.remove = true;
        }
      } else if (playing && p.star > 0 && rectHit(pr.x, pr.y, pr.w, pr.h, p.x, p.y, p.w, p.h)) {
        pr.remove = true;
        this.particles.burst(pr.cx, pr.cy, 6, '#ffe45c', '#ffffff', 100, 0.3);
      }
    }

    if (!playing) return;

    /* --- enemies --- */
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (e.dead || !e.active || e.harmless) continue;
      if (!rectHit(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) continue;

      /* star power flattens everything on contact */
      if (p.star > 0 && e.type !== 'boss') {
        e.killBy('shell');
        this.stompChain++;
        this.addScore(200 * Math.min(8, this.stompChain), e.cx, e.y);
        continue;
      }

      /* a stationary shell is a kickable object, not a threat */
      if (e.type === 'shellcrawler' && e.mode === 'shell') {
        const fromLeft = p.cx < e.cx;
        e.kick(fromLeft ? 1 : -1);
        this.addScore(400, e.cx, e.y, true);
        p.x += fromLeft ? -2 : 2;
        continue;
      }

      /* stomp test: falling, and the player's feet were above the enemy's top */
      const feetPrev = p.py + p.h;
      const stomping = p.vy > 0 && feetPrev <= e.y + 6;

      if (stomping && (e.stompable || e.type === 'boss')) {
        const bounced = e.onStomp(p, this);
        if (bounced) {
          p.y = e.y - p.h;
          p.bounce(this.game.input.down(ACT.JUMP));
          this.stompChain++;
          this.stompChainT = 1.2;
          if (this.stompChain > 1 && e.type !== 'boss') {
            const v = Math.min(8000, 200 * Math.pow(2, Math.min(this.stompChain - 1, 5)));
            this.addScore(v, e.cx, e.y - 6, true);
          }
          continue;
        }
      }
      p.hurt(this);
    }
  }

  /* ------------------------------------------------------------- secrets */
  updateSecrets() {
    const p = this.player;
    for (let i = 0; i < this.secrets.length; i++) {
      const s = this.secrets[i];
      const inside = rectHit(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h);
      if (inside && s.found < 1) {
        if (s.found === 0) {
          this.audio.sfx('checkpoint');
          this.particles.popText(p.cx, p.y - 10, 'SECRET!', '#8bff8a');
        }
        s.found = Math.min(1, s.found + 0.06);
      } else if (!inside && s.found > 0 && s.found < 1) {
        s.found = Math.min(1, s.found + 0.06);
      }
    }
  }

  /* ---------------------------------------------------------------- goal */
  checkGoal() {
    const map = this.map, p = this.player;
    if (map.goalX < 0) return;
    if (p.x + p.w < map.goalX - 6 || p.x > map.goalX + 8) return;
    if (p.y + p.h < map.goalTopY - 4) return;

    // grabbing the pole higher up is worth more
    const t = clamp(1 - (p.y - map.goalTopY) / Math.max(1, map.goalBaseY - map.goalTopY), 0, 1);
    const bonus = [500, 1000, 2000, 4000, 8000][Math.min(4, Math.floor(t * 5))];
    this.addScore(bonus, p.cx, p.y - 8, true);

    p.state = PSTATE.POLE;
    p.stateT = 0;
    p.x = map.goalX - p.w * 0.5 + 2;
    p.vx = 0; p.vy = 0;
    p.facing = 1;
    this.state = 'poleslide';
    this.stateT = 0;
    this.audio.stopMusic({ fade: 0.2 });
    this.audio.sfx('flag');
    this.particles.burst(map.goalX, p.cy, 14, '#ffe98a', '#ffffff', 150, 0.6);
  }

  /* ----------------------------------------------------------------- cull */
  cull() {
    let w = 0;
    for (let i = 0; i < this.enemies.length; i++) if (!this.enemies[i].remove) this.enemies[w++] = this.enemies[i];
    this.enemies.length = w;
    w = 0;
    for (let i = 0; i < this.items.length; i++) if (!this.items[i].remove) this.items[w++] = this.items[i];
    this.items.length = w;
    w = 0;
    for (let i = 0; i < this.projectiles.length; i++) if (!this.projectiles[i].remove) this.projectiles[w++] = this.projectiles[i];
    this.projectiles.length = w;
    w = 0;
    for (let i = 0; i < this.platforms.length; i++) if (!this.platforms[i].remove) this.platforms[w++] = this.platforms[i];
    this.platforms.length = w;
  }

  respawn() {
    const p = this.player;
    const cp = this.checkpoint;
    p.form = 'small'; p.h = FORM_H.small; p.shield = false;
    if (cp) p.spawnAt(cp.x, cp.y);
    else p.spawnAt(this.startPos.x, this.startPos.y);
    this.time = this.def.time || 300;
    this.timeAccum = 0;
    this.hurryPlayed = false;
    this.state = 'play';
    this.stateT = 0;
    this.stompChain = 0;
    this.particles.clear();
    // wake nothing; enemies re-activate as the camera reaches them
    this.enemies.forEach(e => { if (e.respawnable !== false) e.active = false; });

    // A boss left mid-attack (stunned, charging, half-dead) would resume in a
    // nonsense state and could strand the fight — reset it completely.
    if (this.boss && !this.boss.defeated) {
      const b = this.boss;
      b.hp = b.maxHp;
      b.phase = 1;
      b.state = 'intro';
      b.t = 1.6;
      b.stun = 0; b.iframe = 0; b.flash = 0;
      b.vx = 0; b.vy = 0;
      b.dir = -1;
      b.active = true;
      b.x = b.spawnX; b.y = b.spawnY;
      b.px = b.x; b.py = b.y;
      this.openBossGates();
      this.gatesClosed = false;
      this.projectiles.length = 0;
    }
    this.camera.snapTo(p.x - this.camera.vw * 0.5, p.y - this.camera.vh * 0.5);
    this.audio.playMusic(this.def.music || 'overworld');
  }

  /* -------------------------------------------------------------- checkpoint */
  checkCheckpoint() {
    const p = this.player;
    const tx = Math.floor(p.cx / TILE), ty = Math.floor(p.cy / TILE);
    for (let y = ty - 1; y <= ty + 1; y++) {
      if (this.map.at(tx, y) === T.CHECKPOINT) {
        if (!this.checkpoint || this.checkpoint.tx !== tx) {
          this.checkpoint = { x: tx * TILE, y: (y + 1) * TILE, tx: tx };
          this.audio.sfx('checkpoint');
          this.particles.burst(tx * TILE + 8, y * TILE + 8, 14, '#8bff8a', '#ffffff', 130, 0.6);
          this.particles.popText(tx * TILE + 8, y * TILE - 4, 'CHECKPOINT', '#8bff8a');
        }
        return;
      }
    }
  }

  /* ---------------------------------------------------------------- render */
  render(g, alpha, time) {
    const cam = this.camera;
    const camX = cam.rx, camY = cam.ry;
    const vw = g.canvas.width, vh = g.canvas.height;

    Art.drawBG(g, this.map.theme, camX, camY, time, vw, vh, this.quality);

    /* background decor */
    this.renderDecor(g, camX, camY, time, true);

    /* tiles */
    this.map.render(g, camX, camY, vw, vh, time);

    /* bumped blocks are drawn by hand, offset upward */
    for (let i = 0; i < this.bumps.length; i++) {
      const b = this.bumps[i];
      const id = this.map.at(b.tx, b.ty);
      if (id === T.EMPTY) continue;
      const img = Art.tile(id, this.map.theme, this.map.variant[b.idx]);
      if (img) g.drawImage(img, b.tx * TILE - camX, b.ty * TILE - camY + this.bumpOffset(b.tx, b.ty));
    }

    /* platforms */
    for (let i = 0; i < this.platforms.length; i++) this.platforms[i].render(g, camX, camY, alpha);

    /* items */
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (it.x - camX < -32 || it.x - camX > vw + 32) continue;
      it.render(g, camX, camY, alpha);
    }

    /* enemies */
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (!e.active) continue;
      if (e.x - camX < -80 || e.x - camX > vw + 80) continue;
      e.render(g, camX, camY, alpha);
    }

    /* projectiles */
    for (let i = 0; i < this.projectiles.length; i++) this.projectiles[i].render(g, camX, camY, alpha);

    /* player */
    this.player.render(g, camX, camY, alpha, time);

    /* foreground decor */
    this.renderDecor(g, camX, camY, time, false);

    /* particles */
    this.particles.render(g, camX, camY, alpha);

    /* undiscovered secret rooms are masked out */
    for (let i = 0; i < this.secrets.length; i++) {
      const s = this.secrets[i];
      if (s.found >= 1) continue;
      g.globalAlpha = 1 - s.found;
      g.fillStyle = this.map.theme === 'cave' || this.map.theme === 'castle' ? '#120a14' : '#1a2338';
      g.fillRect(Math.round(s.x - camX), Math.round(s.y - camY), s.w, s.h);
      g.globalAlpha = 1;
    }

    /* full-screen flash */
    if (this.flashT > 0) {
      g.globalAlpha = clamp(this.flashT * 4, 0, 0.8);
      g.fillStyle = this.flashCol;
      g.fillRect(0, 0, vw, vh);
      g.globalAlpha = 1;
    }
  }

  renderDecor(g, camX, camY, time, back) {
    const map = this.map;
    const vw = g.canvas.width;
    const b0 = Math.max(0, ((camX / CHUNK_PX) | 0) - 1);
    const b1 = ((camX + vw) / CHUNK_PX | 0) + 1;
    for (let b = b0; b <= b1; b++) {
      const list = map.decorBuckets[b];
      if (!list) continue;
      for (let i = 0; i < list.length; i++) {
        const d = list[i];
        if (!!d.back !== back) continue;
        const sway = d.sway === 0 ? 0 : ((Math.sin(time * 1.6 + d.sway) * 0.5 + 0.5) > 0.5 ? 1 : 0);
        const img = Art.decor(d.n, map.theme, sway);
        if (!img) continue;
        const dx = Math.round(d.x - camX);
        if (dx < -64 || dx > vw + 64) continue;
        const dy = d.ceil ? Math.round(d.y - camY) : Math.round(d.y - camY - img.height);
        g.drawImage(img, dx, dy);
      }
    }
  }
}
