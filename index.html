<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Backrooms</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Courier New", Courier, monospace; color: #e9dfae; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #notesBox { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; font-size: 18px; letter-spacing: 0.18em; color: #efe2a8; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  #notesBox .lbl { opacity: 0.6; font-size: 14px; }
  #message { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); max-width: 80vw; text-align: center; font-size: 17px; letter-spacing: 0.08em; color: #f1e6b8; text-shadow: 0 0 8px #000, 0 0 3px #000; opacity: 0; transition: opacity 0.6s; }
  .bar { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); height: 6px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(240, 225, 160, 0.35); transition: opacity 0.5s; }
  .bar .fill { height: 100%; width: 100%; background: #d8c77a; }
  #stamina { left: 16px; width: min(26vw, 220px); }
  #battery { right: 16px; width: min(18vw, 140px); }
  #battery::before { content: ''; position: absolute; right: -5px; top: 1px; width: 3px; height: 4px; background: rgba(240, 225, 160, 0.5); }
  #batteryPct { position: absolute; right: 0; bottom: 10px; font-size: 13px; color: #e8dca0; text-shadow: 0 0 4px #000; white-space: nowrap; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 245, 200, 0.55); }

  /* Overlay screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 6, 2, 0.82); text-align: center; }
  .screen h1 { font-size: clamp(32px, 7vw, 72px); letter-spacing: 0.25em; margin: 0 0 0.3em; color: #f3e6a2; text-shadow: 0 0 18px rgba(255, 220, 120, 0.35); }
  .screen p { max-width: 640px; line-height: 1.5; opacity: 0.85; padding: 0 16px; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(40, 34, 14, 0.85); color: #f1e4a6; border: 1px solid #8a7a3a; padding: 12px 28px; margin: 6px; font: inherit; font-size: 18px; letter-spacing: 0.15em; min-width: 240px; }
  #scareOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; z-index: 20; }
  #scareOverlay canvas { height: 118vh; max-width: none; }
  .btn:hover { background: rgba(90, 76, 28, 0.9); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="notesBox"><span class="lbl">NOTES</span> <span id="notesCount">0 / 5</span></div>
  <div id="message"></div>
  <div id="stamina" class="bar"><div id="staminaFill" class="fill"></div></div>
  <div id="battery" class="bar"><div id="batteryFill" class="fill"></div><span id="batteryPct">100%</span></div>
</div>

<div id="startScreen" class="screen">
  <h1>THE BACKROOMS</h1>
  <p>Click to enter. WASD to move, mouse to look, Shift to run, C to crouch.</p>
  <button class="btn" id="btnStart">ENTER</button>
</div>

<div id="scareOverlay"></div>

<div id="gameOverScreen" class="screen hidden">
  <h1>YOU WERE CAUGHT</h1>
  <p>You survived <span id="goTime">0:00</span>.</p>
  <button class="btn" id="btnRetry">TRY AGAIN</button>
</div>

<div id="loadError" class="screen hidden">
  <h1>NO SIGNAL</h1>
  <p>Could not load Three.js from the internet. Check your connection and reload the page.</p>
</div>

<script type="module">

//  LIGHT SAMPLING (CPU) — how lit is a point right now?
// ============================================================================
function sampleLight(x, z, y = 1.0) {

    const lx = cx + dx, lz = cz + dz, t = world.lightType(lx, lz);

// ============================================================================

Object.assign(flash, { intensity: 0, dir: new THREE.Vector3(0, 0, -1), flicker: 1, flickerT: 0 });
const FLASH_DRAIN = 1 / 110;     // seconds of light per full battery = 110
function toggleFlashlight() {
  if (game.state !== 'playing') return;
  if (!flash.on && flash.battery <= 0.001) { Sound.click(0.2, 900); showMessage('The flashlight is dead. Find batteries.', 2.5); return; }
  flash.on = !flash.on;
  Sound.click(0.3, flash.on ? 2600 : 1800);
}
function updateStamina(dt) {
  if (player.running) {
    player.stamina = Math.max(0, player.stamina - dt / 6.5);
    player.restTimer = 0.7;
    if (player.stamina <= 0) { player.exhausted = true; showMessage('You are out of breath...', 2); }
  } else {
    player.restTimer -= dt;
    if (player.restTimer <= 0) player.stamina = Math.min(1, player.stamina + dt / (player.moving ? 7.5 : 4.5));
  }
  if (player.exhausted && player.stamina >= 0.35) player.exhausted = false;
  if (player.exhausted || player.stamina < 0.2) {
    player.breathT -= dt;
    if (player.breathT <= 0) { Sound.breathe(player.exhausted ? 1 : 0.5); player.breathT = player.exhausted ? 0.85 : 1.3; }
  }
}
const _fRight = new THREE.Vector3(), _fUp = new THREE.Vector3();
function updateFlashlight(dt) {
  camera.getWorldDirection(_camDir);
  flash.dir.lerp(_camDir, 1 - Math.exp(-dt * 16)).normalize();
  _fRight.setFromMatrixColumn(camera.matrixWorld, 0);
  _fUp.setFromMatrixColumn(camera.matrixWorld, 1);
  U.uFlashPos.value.copy(camera.position).addScaledVector(_fRight, 0.14).addScaledVector(_fUp, -0.16);
  U.uFlashDir.value.copy(flash.dir);
  if (flash.on) {
    flash.battery = Math.max(0, flash.battery - dt * FLASH_DRAIN);
    if (flash.battery <= 0) { flash.on = false; Sound.click(0.2, 900); showMessage('The flashlight died.', 2.5); }
  }
  // weak batteries stutter
  flash.flickerT -= dt;
  if (flash.flickerT <= 0) {
    flash.flickerT = 0.03 + Math.random() * 0.08;
    const weak = flash.battery < 0.2 ? (0.2 - flash.battery) / 0.2 : 0;
    flash.flicker = Math.random() < weak * 0.45 ? 0.15 + Math.random() * 0.4 : 1;
    if (monster.active && game.danger > 0.7 && Math.random() < 0.08) flash.flicker *= 0.3;
  }
  const target = flash.on ? (0.45 + 0.55 * Math.min(1, flash.battery * 3)) * 2.4 * flash.flicker : 0;
  flash.intensity += (target - flash.intensity) * Math.min(1, dt * 30);
  U.uFlash.value = flash.intensity;
}

// ============================================================================
//  ITEMS (batteries per chunk; notes & exit use the same machinery)
// ============================================================================
const ITEM_VERT = /* glsl */`
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vDepth;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vUv = uv;
  vNormal = normalize(mat3(modelMatrix) * normal);
  vec4 mv = viewMatrix * wp;
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}
`;
const ITEM_FRAG = /* glsl */`
${GLSL_FRAG_COMMON}
uniform vec3 uColor;
uniform float uEnv;
uniform float uGlow;
uniform vec3 uLightColor;
uniform sampler2D map;
uniform float uUseMap;
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vDepth;
void main() {
  vec3 n = normalize(vNormal);
  vec3 base = uColor;
  if (uUseMap > 0.5) base *= texture2D(map, vUv).rgb;
  vec3 lit = uLightColor * (uEnv * (0.55 + 0.45 * max(n.y, 0.0))) + flashlight(vWorld, n) + vec3(0.03);
  vec3 col = base * lit + base * uGlow;
  col = applyFog(col, vDepth, uEnv);
  gl_FragColor = vec4(toDisplay(col), 1.0);
}
`;
function itemMaterial(color, glow = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uColor: { value: new THREE.Color(color) }, uEnv: { value: 0.5 }, uGlow: { value: glow }, map: { value: null }, uUseMap: { value: 0 } },
    vertexShader: ITEM_VERT, fragmentShader: ITEM_FRAG,
  });
}
// soft sparkle sprite so items can be spotted in the dark
const glintTex = (() => {
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(0.15, 'rgba(255,240,190,0.6)'); gr.addColorStop(1, 'rgba(255,230,160,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(255,250,230,0.8)'; g.fillRect(31, 4, 2, 56); g.fillRect(4, 31, 56, 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function makeGlint(scale = 0.25) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glintTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.6, fog: false }));
  s.scale.set(scale, scale, scale);
  return s;
}
function buildBatteryMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.2, 12), itemMaterial(0x2e5a3a));
  body.rotation.z = Math.PI / 2; g.add(body);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.06, 12), itemMaterial(0xd8c25a));
  band.rotation.z = Math.PI / 2; band.position.x = 0.05; g.add(band);
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.03, 8), itemMaterial(0xb08040, 0.2));
  tip.rotation.z = Math.PI / 2; tip.position.x = 0.115; g.add(tip);
  const glint = makeGlint(0.35); glint.position.y = 0.08; g.add(glint);
  g.userData.glint = glint;
  return g;
}

const items = new Map();            // id -> item
const collectedItems = new Set();   // ids of picked-up chunk items
function chunkItemSpots(kx, kz) {
  // deterministic battery placement for a chunk
  const out = [];
  if (kx === 0 && kz === 0) return out;
  const r = mulberry32((hash2(kx, kz, world.seed + 404) * 4294967296) >>> 0);
  const chance = world.level === 2 ? 0.45 : 0.38;
  if (r() < chance) {
    const lx = Math.floor(r() * CHUNK), lz = Math.floor(r() * CHUNK);
    const cx = kx * CHUNK + lx, cz = kz * CHUNK + lz;
    out.push({ id: 'b' + kx + ',' + kz, type: 'battery', x: (cx + 0.25 + r() * 0.5) * CELL, z: (cz + 0.25 + r() * 0.5) * CELL, rot: r() * Math.PI * 2 });
  }
  return out;
}
function addItem(spec, chunkKey) {
  if (items.has(spec.id)) return;
  let mesh;
  if (spec.type === 'battery') mesh = buildBatteryMesh();
  else if (spec.type === 'note') mesh = buildNoteMesh(spec);
  else if (spec.type === 'exit') mesh = buildExitMesh(spec);
  mesh.position.set(spec.x, spec.y || (spec.type === 'battery' ? 0.045 : 0), spec.z);
  mesh.rotation.y = spec.rot || 0;
  scene.add(mesh);
  const it = { ...spec, mesh, chunkKey, env: sampleLight(spec.x, spec.z, 0.3), envT: Math.random() * 0.3 };
  items.set(spec.id, it);
  setItemEnv(it);
}
function removeItem(id) {
  const it = items.get(id); if (!it) return;
  scene.remove(it.mesh);
  it.mesh.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  items.delete(id);
}
function setItemEnv(it) {
  it.mesh.traverse((o) => { if (o.material && o.material.uniforms && o.material.uniforms.uEnv) o.material.uniforms.uEnv.value = it.env; });
}
function spawnChunkItems(kx, kz) {
  const key = ckey(kx, kz);
  for (const s of chunkItemSpots(kx, kz)) if (!collectedItems.has(s.id)) addItem(s, key);
  for (const s of worldItemSpecs()) if (fdiv(s.x, CHUNK_SIZE) === kx && fdiv(s.z, CHUNK_SIZE) === kz && !s.taken) addItem(s, key);
}
function despawnChunkItems(key) {
  for (const [id, it] of items) if (it.chunkKey === key) removeItem(id);
}
function clearItems() { for (const id of [...items.keys()]) removeItem(id); }
// items that live at fixed world positions (notes, exit) — filled in by the goal system
function worldItemSpecs() { return goal.specs; }

function updateItems(dt) {
  const t = U.uTime.value;
  for (const it of [...items.values()]) {
    it.envT -= dt;
    if (it.envT <= 0) { it.envT = 0.25; it.env = sampleLight(it.x, it.z, 0.4); setItemEnv(it); }
    const g = it.mesh.userData.glint;
    if (g) g.material.opacity = (0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3 + it.x))) * (1.2 - Math.min(1, it.env));
    if (it.type === 'note' && it.mesh.userData.paper) it.mesh.userData.paper.position.y = 0.02 + Math.sin(t * 1.3 + it.z) * 0.004;
    const d = Math.hypot(it.x - player.pos.x, it.z - player.pos.z);
    if (it.type === 'battery' && d < 0.9) {
      collectedItems.add(it.id);
      removeItem(it.id);
      flash.battery = Math.min(1, flash.battery + 0.5);
      Sound.click(0.35, 3200); setTimeout(() => Sound.click(0.25, 2200), 70);
      showMessage('Battery found  +50%', 2.5);
    } else if (it.type === 'note' && d < 1.1) {
      pickNote(it);
    } else if (it.type === 'exit' && d < 1.25) {
      reachExit();
    }
  }
}

const keys = Object.create(null);
const input = { lookX: 0, lookY: 0, sensitivity: 1.0, locked: false, touchRun: false };

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyC' && !e.repeat) player.crouchToggle = !player.crouchToggle;
  if (e.code === 'KeyF' && !e.repeat) toggleFlashlight();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.addEventListener('mousemove', (e) => {
  if (!input.locked || game.state !== 'playing') return;
  input.lookX += e.movementX || 0;
  input.lookY += e.movementY || 0;
});
document.addEventListener('pointerlockchange', () => {
  input.locked = document.pointerLockElement === renderer.domElement;
});
function requestLock() {
  try {
    const p = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* pointer lock unavailable (e.g. headless) */ }
}
renderer.domElement.addEventListener('click', () => { if (game.state === 'playing' && !input.locked) requestLock(); });

// ============================================================================
//  PLAYER
// ============================================================================
const player = {
  pos: new THREE.Vector3(CELL * 0.5, 0, CELL * 0.5),
  vel: new THREE.Vector3(),
  yaw: Math.PI, pitch: 0,
  radius: 0.28,
  eye: 1.62,
  crouchToggle: false,
  crouching: false, running: false, moving: false,
  bobPhase: 0, bobAmt: 0,
  speed: 0,
  stamina: 1, exhausted: false, restTimer: 0, breathT: 0,
};
const SPEED_WALK = 2.6, SPEED_RUN = 5.2, SPEED_CROUCH = 1.25;
const EYE_STAND = 1.62, EYE_CROUCH = 0.92;

const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _wish = new THREE.Vector3();
function updatePlayer(dt) {
  // --- look ---
  const sens = 0.0022 * input.sensitivity;
  player.yaw -= input.lookX * sens;
  player.pitch -= input.lookY * sens;
  player.pitch = clamp(player.pitch, -1.45, 1.45);
  input.lookX = 0; input.lookY = 0;

  // --- move intent ---
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  player.moving = len > 0.05;

  player.crouching = player.crouchToggle;
  const wantRun = (keys.ShiftLeft || keys.ShiftRight || input.touchRun) && player.moving && mz > 0.1 && !player.crouching && !player.exhausted && player.stamina > 0;
  player.running = wantRun;
  const target = player.crouching ? SPEED_CROUCH : player.running ? SPEED_RUN : SPEED_WALK;

  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _right.set(-_fwd.z, 0, _fwd.x);
  _wish.set(0, 0, 0).addScaledVector(_fwd, mz).addScaledVector(_right, mx).multiplyScalar(target);

  const accel = player.moving ? 10 : 12;
  const k = 1 - Math.exp(-accel * dt);
  player.vel.x += (_wish.x - player.vel.x) * k;
  player.vel.z += (_wish.z - player.vel.z) * k;
  player.speed = Math.hypot(player.vel.x, player.vel.z);

  // --- integrate with sub-steps + collision ---
  const dist = player.speed * dt;
  const steps = Math.max(1, Math.ceil(dist / 0.1));
  for (let i = 0; i < steps; i++) {
    player.pos.x += (player.vel.x * dt) / steps;
    player.pos.z += (player.vel.z * dt) / steps;
    resolveCircle(player.pos, player.radius);
  }

  // --- crouch height & head bob ---
  const eyeTarget = player.crouching ? EYE_CROUCH : EYE_STAND;
  player.eye += (eyeTarget - player.eye) * (1 - Math.exp(-10 * dt));
  const stepLen = player.running ? 1.05 : player.crouching ? 0.55 : 0.75;
  const prevPhase = player.bobPhase;
  player.bobPhase += (player.speed * dt / stepLen) * Math.PI;
  player.bobAmt += ((player.speed > 0.3 ? 1 : 0) - player.bobAmt) * (1 - Math.exp(-6 * dt));
  if (Math.floor(prevPhase / Math.PI) !== Math.floor(player.bobPhase / Math.PI) && player.speed > 0.5) {
    onFootstep();
  }

  const bobScale = player.running ? 0.065 : player.crouching ? 0.025 : 0.04;
  const bobY = Math.abs(Math.sin(player.bobPhase)) * bobScale * player.bobAmt;
  const bobX = Math.cos(player.bobPhase) * bobScale * 0.6 * player.bobAmt;
  camera.position.set(
    player.pos.x + _right.x * bobX,
    player.eye + bobY - bobScale * 0.5 * player.bobAmt,
    player.pos.z + _right.z * bobX
  );
  camera.rotation.set(player.pitch, player.yaw, Math.cos(player.bobPhase) * 0.004 * player.bobAmt);
}

let footstepCount = 0;
function onFootstep() {
  footstepCount++;
  const kind = player.running ? 'run' : player.crouching ? 'crouch' : 'walk';
  Sound.footstep(kind, world.level === 2 ? 'water' : 'carpet');
  emitNoise(player.pos.x, player.pos.z, kind === 'run' ? 21 : kind === 'crouch' ? 1.8 : 6.5);
}

// ============================================================================
//  GAME STATE
// ============================================================================
const game = { state: 'menu', time: 0, danger: 0, heartTimer: 0, notes: 0, level: 1 };
function notesCollected() { return game.notes; }
function onChaseStart() {}
function onPlayerCaught() { $('hud').classList.add('hidden'); }
function onGameOver() {
  game.state = 'gameover';
  if (document.pointerLockElement) document.exitPointerLock();
  $('goTime').textContent = formatTime(game.time);
  $('gameOverScreen').classList.remove('hidden');
}
function formatTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }

// Choose a spawn facing the most open direction
function spawnPlayer(x, z) {
  player.pos.set(x, 0, z); player.vel.set(0, 0, 0);
  let best = 0, bestD = -1;
  for (let a = 0; a < 16; a++) {
    const yaw = (a / 16) * Math.PI * 2, dx = -Math.sin(yaw), dz = -Math.cos(yaw);
    let d = 0; while (d < 30 && world.segmentClear(x, z, x + dx * (d + 1), z + dz * (d + 1))) d += 1;
    if (d > bestD) { bestD = d; best = yaw; }
  }
  player.yaw = best; player.pitch = 0; player.crouchToggle = false; player.eye = EYE_STAND;
}
function newGame(level = 1) {
  game.level = level; game.time = 0; game.notes = 0; game.danger = 0;
  player.stamina = 1; player.exhausted = false;
  flash.on = false; flash.battery = 1; flash.intensity = 0;
  collectedItems.clear(); goal.specs = [];
  world = new World((Math.random() * 1e9) | 0, level);
  clearChunks();
  spawnPlayer(CELL * 0.5, CELL * 0.5);
  updateChunks(player.pos.x, player.pos.z, true);
  resetMonster();
}
function startGame() {
  $('startScreen').classList.add('hidden');
  $('gameOverScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  newGame(1);
  game.state = 'playing';
  Sound.init();
  requestLock();
}
$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);

// ============================================================================
//  MAIN LOOP
// ============================================================================
const clock = new THREE.Clock();
const _camDir = new THREE.Vector3();
function updateDanger(dt) {
  const md = Math.hypot(monster.pos.x - player.pos.x, monster.pos.z - player.pos.z);
  let d = Math.pow(clamp(1 - md / 26, 0, 1), 1.5);
  if (monster.state === 'chase') d = Math.max(d, 0.55 + 0.45 * clamp(1 - md / 20, 0, 1));
  if (monster.sees) d = Math.min(1, d + 0.1);
  game.danger += (d - game.danger) * Math.min(1, dt * 2);
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (game.state === 'playing') {
    game.time += dt;
    U.uTime.value = (U.uTime.value + dt) % 1000;
    updatePlayer(dt);
    updateStamina(dt);
    updateFlashlight(dt);
    updateMonster(dt);
    updateItems(dt);
    updateHUD(dt);
    updateChunks(player.pos.x, player.pos.z);
    updateAmbientAudio(dt);
    updateDanger(dt);
    camera.getWorldDirection(_camDir);
    Sound.setListener(camera.position, _camDir);
    // heartbeat when danger is near
    if (game.danger > 0.04) {
      game.heartTimer -= dt;
      if (game.heartTimer <= 0) { Sound.heartbeat(clamp(0.25 + game.danger, 0, 1.2)); game.heartTimer = 60 / lerp(62, 165, clamp(game.danger, 0, 1)); }
    } else game.heartTimer = 0;
  } else if (game.state === 'caught') {
    U.uTime.value = (U.uTime.value + dt) % 1000;
    updateJumpScare(dt);
  }
  renderer.render(scene, camera);
}
