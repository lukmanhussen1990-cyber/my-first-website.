/* ==========================================================================
   EMBERLEAP — engine part 2
   TileMap (parse · collision · chunked rendering) · Camera · ParticleSystem
   ========================================================================== */

const CHAR_TO_TILE = {
  ' ': T.EMPTY, '.': T.EMPTY,
  '#': T.GROUND, '=': T.SOLID, 'b': T.BRICK,
  '?': T.QCOIN, '!': T.QPOWER, '&': T.QMULTI,
  'h': T.HCOIN, 'H': T.HPOWER,
  '-': T.SEMI, '^': T.SPIKE,
  '~': T.WATER_TOP, 'w': T.WATER, 'L': T.LAVA_TOP, 'l': T.LAVA,
  '[': T.PIPE_TL, ']': T.PIPE_TR, '{': T.PIPE_BL, '}': T.PIPE_BR,
  '/': T.SLOPE_R, '\\': T.SLOPE_L,
  'T': T.GOAL_POLE, '_': T.GOAL_BASE, 'K': T.CHECKPOINT,
  '|': T.VINE, '+': T.BRIDGE, 'D': T.DOOR
};

/* entity characters embedded directly in the ASCII map */
const CHAR_TO_ENTITY = {
  'X': 'start',
  'o': 'spark', 'O': 'emberstone',
  'g': 'walker', 's': 'shellcrawler', 'j': 'winghopper', 'v': 'tunnelplant',
  'e': 'beetle', 'f': 'flyingguard', 'n': 'cannoncreature', 'B': 'boss',
  'M': 'movingplat', 'F': 'fallingplat', 'c': 'cloudplat'
};

/* tiles whose art animates — these are excluded from the baked chunks and
   drawn per-frame on top, so the static bake stays valid                     */
const ANIMATED_TILE = new Uint8Array(64);
[T.QCOIN, T.QPOWER, T.QMULTI, T.WATER_TOP, T.WATER, T.LAVA_TOP, T.LAVA].forEach(function (i) { ANIMATED_TILE[i] = 1; });

const CHUNK = 16;               // tiles per chunk edge
const CHUNK_PX = CHUNK * TILE;  // 256

class TileMap {
  constructor(def) {
    const rows = def.rows;
    this.h = rows.length;
    this.w = rows[0].length;
    this.theme = def.theme || 'grass';
    this.grid = new Uint8Array(this.w * this.h);
    this.variant = new Uint8Array(this.w * this.h);
    this.spawns = [];
    this.dynamic = new Set();      // tile indices currently drawn by hand (bumping)
    this.pixW = this.w * TILE;
    this.pixH = this.h * TILE;

    const rng = mulberry32(0xBEEF ^ (this.w * 7919) ^ (this.h * 104729));

    for (let y = 0; y < this.h; y++) {
      const row = rows[y];
      for (let x = 0; x < this.w; x++) {
        const ch = row[x] === undefined ? ' ' : row[x];
        const i = y * this.w + x;
        if (CHAR_TO_ENTITY[ch]) {
          this.spawns.push({ type: CHAR_TO_ENTITY[ch], x: x * TILE, y: y * TILE, tx: x, ty: y });
          this.grid[i] = T.EMPTY;
        } else {
          const t = CHAR_TO_TILE[ch];
          this.grid[i] = t === undefined ? T.EMPTY : t;
        }
        this.variant[i] = (rng() * 3) | 0;
      }
    }

    /* chunked static render cache (LRU) */
    this.chunksX = Math.ceil(this.w / CHUNK);
    this.chunksY = Math.ceil(this.h / CHUNK);
    this.chunkCache = new Map();
    this.chunkOrder = [];
    this.maxChunks = 14;

    this.buildDecor(def);
    this.findGoal();
  }

  idx(tx, ty) { return ty * this.w + tx; }
  inb(tx, ty) { return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h; }

  at(tx, ty) {
    if (tx < 0 || tx >= this.w) return T.SOLID;      // walls at the level edges
    if (ty < 0) return T.EMPTY;                      // open sky above
    if (ty >= this.h) return T.EMPTY;                // the void below (a death pit)
    return this.grid[ty * this.w + tx];
  }
  atPix(px, py) { return this.at(Math.floor(px / TILE), Math.floor(py / TILE)); }

  set(tx, ty, v) {
    if (!this.inb(tx, ty)) return;
    this.grid[ty * this.w + tx] = v;
    this.invalidateChunkAt(tx, ty);
  }

  isSolid(tx, ty) { return SOLID_TILE[this.at(tx, ty)] === 1; }

  /**
   * Art variant for a tile. GROUND with solid rock directly above it uses the
   * reserved "buried" variant 3, so only the exposed surface grows grass.
   */
  variantFor(tx, ty, id, i) {
    if (id === T.GROUND && SOLID_TILE[this.at(tx, ty - 1)]) return 3;
    return this.variant[i] % 3;
  }
  isSlope(tx, ty) { return SLOPE_TILE[this.at(tx, ty)] === 1; }

  /** height (0..16) of the slope surface above the tile's bottom edge */
  slopeHeight(id, localX) {
    localX = clamp(localX, 0, 15);
    if (id === T.SLOPE_R) return localX + 1;
    if (id === T.SLOPE_L) return 16 - localX;
    return 0;
  }
  /** world Y of the ground surface at world X, if a slope occupies (tx,ty) */
  slopeSurfaceY(tx, ty, worldX) {
    const id = this.at(tx, ty);
    if (!SLOPE_TILE[id]) return null;
    const localX = Math.floor(worldX) - tx * TILE;
    return (ty + 1) * TILE - this.slopeHeight(id, localX);
  }

  /** any solid tile overlapping the rect? (slopes excluded — handled separately) */
  rectSolid(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (SOLID_TILE[this.at(tx, ty)]) return true;
      }
    }
    return false;
  }

  /* -------------------------------------------------- decorative dressing */
  buildDecor(def) {
    // Deterministic props scattered on exposed surfaces. Purely visual.
    const rng = mulberry32(0x51ED ^ this.w ^ (this.h << 8));
    const th = this.theme;
    this.decor = [];
    const surfaceNames = {
      grass: ['bush', 'flower', 'rock', 'fern'],
      sunset: ['bush', 'rock', 'flower'],
      forest: ['fern', 'mushroom', 'bush', 'flower'],
      night: ['bush', 'flower', 'rock'],
      cave: ['crystal', 'mushroom', 'rock'],
      water: ['lilypad', 'rock'],
      castle: ['rock']
    };
    const names = surfaceNames[th] || surfaceNames.grass;
    for (let x = 1; x < this.w - 1; x++) {
      for (let y = 1; y < this.h; y++) {
        const here = this.at(x, y), above = this.at(x, y - 1);
        if (here === T.GROUND && above === T.EMPTY) {
          if (rng() < 0.17) {
            const n = names[(rng() * names.length) | 0];
            this.decor.push({ n: n, x: x * TILE + ((rng() * 5) | 0) - 2, y: y * TILE, sway: rng() * 6.28, back: false });
          }
          break;                                    // only the topmost surface per column
        }
        if (here !== T.EMPTY) break;
      }
      // ceiling props in caves / castles
      if (th === 'cave' || th === 'castle') {
        for (let y = 1; y < this.h - 1; y++) {
          if (this.at(x, y) === T.GROUND && this.at(x, y + 1) === T.EMPTY && rng() < 0.13) {
            this.decor.push({ n: 'stalactite', x: x * TILE, y: (y + 1) * TILE, sway: 0, back: true, ceil: true });
            break;
          }
        }
      }
    }
    // background trees for outdoor themes
    if (th === 'grass' || th === 'forest' || th === 'sunset' || th === 'night') {
      for (let x = 2; x < this.w - 2; x += 3) {
        if (rng() < 0.22) {
          for (let y = 1; y < this.h; y++) {
            if (this.at(x, y) === T.GROUND && this.at(x, y - 1) === T.EMPTY) {
              this.decor.push({ n: 'tree', x: x * TILE - 8, y: y * TILE, sway: rng() * 6.28, back: true });
              break;
            }
            if (this.at(x, y) !== T.EMPTY) break;
          }
        }
      }
    }
    this.decorBack = this.decor.filter(function (d) { return d.back; });
    this.decorFront = this.decor.filter(function (d) { return !d.back; });
    // bucket decor by column-chunk so rendering can cull in O(visible)
    this.decorBuckets = {};
    const self = this;
    this.decor.forEach(function (d) {
      const b = (d.x / CHUNK_PX) | 0;
      (self.decorBuckets[b] || (self.decorBuckets[b] = [])).push(d);
    });
  }

  findGoal() {
    this.goalX = -1; this.goalTopY = 0; this.goalBaseY = 0;
    for (let x = this.w - 1; x >= 0; x--) {
      for (let y = 0; y < this.h; y++) {
        if (this.at(x, y) === T.GOAL_POLE) {
          this.goalX = x * TILE + 8;
          this.goalTopY = y * TILE;
          let yy = y;
          while (yy < this.h && (this.at(x, yy) === T.GOAL_POLE)) yy++;
          this.goalBaseY = yy * TILE;
          return;
        }
      }
    }
  }

  /* ------------------------------------------------------ chunk rendering */
  invalidateChunkAt(tx, ty) {
    const key = ((ty / CHUNK) | 0) * this.chunksX + ((tx / CHUNK) | 0);
    if (this.chunkCache.has(key)) {
      this.chunkCache.delete(key);
      const i = this.chunkOrder.indexOf(key);
      if (i >= 0) this.chunkOrder.splice(i, 1);
    }
  }

  getChunk(cx, cy) {
    const key = cy * this.chunksX + cx;
    let c = this.chunkCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = CHUNK_PX; c.height = CHUNK_PX;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const x0 = cx * CHUNK, y0 = cy * CHUNK;
    for (let y = 0; y < CHUNK; y++) {
      const ty = y0 + y;
      if (ty >= this.h) break;
      for (let x = 0; x < CHUNK; x++) {
        const tx = x0 + x;
        if (tx >= this.w) break;
        const i = ty * this.w + tx;
        const id = this.grid[i];
        if (id === T.EMPTY || ANIMATED_TILE[id] || this.dynamic.has(i)) continue;
        if (id === T.HCOIN || id === T.HPOWER) continue;    // invisible until struck
        const img = Art.tile(id, this.theme, this.variantFor(tx, ty, id, i));
        if (img) g.drawImage(img, x * TILE, y * TILE);
      }
    }
    this.chunkCache.set(key, c);
    this.chunkOrder.push(key);
    while (this.chunkOrder.length > this.maxChunks) {
      const old = this.chunkOrder.shift();
      this.chunkCache.delete(old);
    }
    return c;
  }

  /** draws the tile layer for the given camera rect */
  render(g, camX, camY, vw, vh, time) {
    const cx0 = clamp(((camX / CHUNK_PX) | 0), 0, this.chunksX - 1);
    const cx1 = clamp((((camX + vw) / CHUNK_PX) | 0), 0, this.chunksX - 1);
    const cy0 = clamp(((camY / CHUNK_PX) | 0), 0, this.chunksY - 1);
    const cy1 = clamp((((camY + vh) / CHUNK_PX) | 0), 0, this.chunksY - 1);
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const c = this.getChunk(cx, cy);
        g.drawImage(c, Math.round(cx * CHUNK_PX - camX), Math.round(cy * CHUNK_PX - camY));
      }
    }
    // animated tiles on top, culled to the view
    const tx0 = clamp(((camX / TILE) | 0) - 1, 0, this.w - 1);
    const tx1 = clamp((((camX + vw) / TILE) | 0) + 1, 0, this.w - 1);
    const ty0 = clamp(((camY / TILE) | 0) - 1, 0, this.h - 1);
    const ty1 = clamp((((camY + vh) / TILE) | 0) + 1, 0, this.h - 1);
    const wf = ((time * 6) | 0) & 3;         // water/lava animation frame
    const qf = ((time * 5.5) | 0) & 3;       // reward-block pulse frame
    for (let ty = ty0; ty <= ty1; ty++) {
      const base = ty * this.w;
      for (let tx = tx0; tx <= tx1; tx++) {
        const i = base + tx;
        const id = this.grid[i];
        if (!ANIMATED_TILE[id] || this.dynamic.has(i)) continue;
        let variant;
        if (id === T.WATER || id === T.WATER_TOP || id === T.LAVA || id === T.LAVA_TOP) {
          variant = (wf + tx) & 3;
        } else {
          variant = qf;
        }
        const img = Art.tile(id, this.theme, variant);
        if (img) g.drawImage(img, tx * TILE - camX, ty * TILE - camY);
      }
    }
  }
}

/* --------------------------------------------------------------- Camera */
class Camera {
  constructor() {
    this.x = 0; this.y = 0;
    this.px = 0; this.py = 0;
    this.tx = 0; this.ty = 0;
    this.vw = 320; this.vh = 208;
    this.boundsW = 0; this.boundsH = 0;
    this.shake = 0; this.shakeMag = 0;
    this.shakeX = 0; this.shakeY = 0;
    this.lookAhead = 0;
    this.cinematic = null;
    this.enabled = true;
  }
  setBounds(w, h) { this.boundsW = w; this.boundsH = h; }
  setView(w, h) { this.vw = w; this.vh = h; }

  snapTo(x, y) {
    this.tx = x; this.ty = y;
    this.x = this.px = this.clampX(x);
    this.y = this.py = this.clampY(y);
  }
  clampX(x) { return clamp(x, 0, Math.max(0, this.boundsW - this.vw)); }
  clampY(y) { return clamp(y, 0, Math.max(0, this.boundsH - this.vh)); }

  addShake(mag, dur) {
    if (!SaveManager.data.settings.screenShake) return;
    this.shakeMag = Math.max(this.shakeMag, mag);
    this.shake = Math.max(this.shake, dur);
  }

  follow(target, dt, opts) {
    opts = opts || {};
    this.px = this.x; this.py = this.y;
    if (this.cinematic) {
      const c = this.cinematic;
      c.t += dt;
      const k = clamp(c.t / c.dur, 0, 1);
      const e = easeInOutQuad(k);
      this.tx = lerp(c.fromX, c.toX, e);
      this.ty = lerp(c.fromY, c.toY, e);
      this.x = this.clampX(this.tx);
      this.y = this.clampY(this.ty);
      if (k >= 1) { const cb = c.done; this.cinematic = null; if (cb) cb(); }
    } else {
      // horizontal: gentle look-ahead in the direction of travel, biased
      // slightly behind centre so the player sees more of what is ahead
      const laTarget = clamp(target.vx / PHYS.runMax, -1, 1) * (opts.lookAhead === undefined ? 44 : opts.lookAhead);
      this.lookAhead = lerp(this.lookAhead, laTarget, 1 - Math.pow(0.001, dt));
      const desiredX = target.x + target.w * 0.5 - this.vw * 0.5 + this.lookAhead;
      const sx = 1 - Math.pow(0.0008, dt);
      this.tx = lerp(this.tx, desiredX, sx);

      // vertical: a dead zone with a faster catch-up when grounded or falling fast
      const centreY = target.y + target.h * 0.5;
      let desiredY = centreY - this.vh * 0.58;
      const dz = opts.deadzone === undefined ? 26 : opts.deadzone;
      const diff = desiredY - this.ty;
      if (Math.abs(diff) > dz) this.ty += diff - sign(diff) * dz;
      const sy = 1 - Math.pow(target.onGround ? 0.0006 : 0.02, dt);
      this.ty = lerp(this.ty, desiredY, target.onGround ? sy : sy * 0.5);

      this.x = this.clampX(this.tx);
      this.y = this.clampY(this.ty);
    }

    if (this.shake > 0) {
      this.shake -= dt;
      const k = Math.max(0, this.shake);
      const m = this.shakeMag * Math.min(1, k * 4);
      this.shakeX = (Math.random() * 2 - 1) * m;
      this.shakeY = (Math.random() * 2 - 1) * m;
      if (this.shake <= 0) { this.shakeMag = 0; this.shakeX = this.shakeY = 0; }
    } else { this.shakeX = this.shakeY = 0; }
  }

  moveTo(x, y, dur, done) {
    this.cinematic = { fromX: this.tx, fromY: this.ty, toX: x, toY: y, dur: dur, t: 0, done: done };
  }

  /** rendered position, including shake, rounded to whole pixels */
  get rx() { return Math.round(this.x + this.shakeX); }
  get ry() { return Math.round(this.y + this.shakeY); }
}

/* ------------------------------------------------------- ParticleSystem
   One flat pooled array. Particles are plain objects reused forever, so the
   GC never sees churn during play.                                          */
const P_KIND = {
  DUST: 0, SPARK: 1, SHARD: 2, SMOKE: 3, STAR: 4, SPLASH: 5,
  BUBBLE: 6, EMBER: 7, RING: 8, TEXT: 9, GLOW: 10, LEAF: 11
};

class ParticleSystem {
  constructor(max) {
    this.max = max || 260;
    this.pool = new Array(this.max);
    for (let i = 0; i < this.max; i++) {
      this.pool[i] = {
        alive: false, kind: 0, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0,
        life: 0, maxLife: 1, size: 1, col: '#fff', col2: '#fff',
        grav: 0, drag: 0, rot: 0, vrot: 0, text: '', scale: 1, fade: 1
      };
    }
    this.head = 0;
    this.count = 0;
    this.budget = this.max;
  }
  setBudget(n) { this.budget = clamp(n | 0, 30, this.max); }
  clear() {
    for (let i = 0; i < this.max; i++) this.pool[i].alive = false;
    this.count = 0;
  }
  _get() {
    // find a free slot; if none within the budget, recycle the oldest
    for (let i = 0; i < this.budget; i++) {
      const p = this.pool[(this.head + i) % this.budget];
      if (!p.alive) { this.head = (this.head + i + 1) % this.budget; p.alive = true; this.count++; return p; }
    }
    const p = this.pool[this.head % this.budget];
    this.head = (this.head + 1) % this.budget;
    p.alive = true;
    return p;
  }
  spawn(kind, x, y, o) {
    o = o || {};
    const p = this._get();
    p.kind = kind; p.x = p.px = x; p.y = p.py = y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.life = p.maxLife = o.life || 0.5;
    p.size = o.size || 2;
    p.col = o.col || '#ffffff';
    p.col2 = o.col2 || p.col;
    p.grav = o.grav === undefined ? 0 : o.grav;
    p.drag = o.drag === undefined ? 0 : o.drag;
    p.rot = o.rot || 0; p.vrot = o.vrot || 0;
    p.text = o.text || '';
    p.scale = o.scale || 1;
    p.fade = o.fade === undefined ? 1 : o.fade;
    return p;
  }

  /* --- convenience emitters ------------------------------------------- */
  dust(x, y, dir, n) {
    n = n || 3;
    for (let i = 0; i < n; i++) {
      this.spawn(P_KIND.DUST, x + rrange(-2, 2), y + rrange(-1, 1), {
        vx: -dir * rrange(6, 34) + rrange(-8, 8), vy: rrange(-26, -4),
        life: rrange(0.24, 0.44), size: (rrange(1, 3) | 0) + 1,
        col: '#e8dcc0', col2: '#b8a789', grav: 90, drag: 2.4
      });
    }
  }
  landPuff(x, y, power) {
    const n = clamp(2 + (power * 5) | 0, 3, 9);
    for (let i = 0; i < n; i++) {
      const d = i % 2 ? 1 : -1;
      this.spawn(P_KIND.DUST, x + rrange(-4, 4), y, {
        vx: d * rrange(22, 74) * (0.5 + power), vy: rrange(-38, -8) * (0.4 + power),
        life: rrange(0.28, 0.5), size: (rrange(1, 3) | 0) + 1,
        col: '#f2e8cf', col2: '#a8987a', grav: 130, drag: 3
      });
    }
  }
  jumpPuff(x, y) {
    for (let i = 0; i < 5; i++) {
      const a = Math.PI + rrange(-0.9, 0.9);
      this.spawn(P_KIND.SMOKE, x + rrange(-3, 3), y, {
        vx: Math.cos(a) * rrange(10, 40), vy: -Math.sin(a) * rrange(4, 22) + 12,
        life: rrange(0.22, 0.4), size: 2, col: '#ffffff', col2: '#cfe3ef', grav: 20, drag: 3
      });
    }
  }
  sparkle(x, y, col) {
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * 6.283;
      const sp = rrange(20, 70);
      this.spawn(P_KIND.SPARK, x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: rrange(0.25, 0.55), size: 2,
        col: col || '#ffe98a', col2: '#fff8d8', grav: 120, drag: 1.5
      });
    }
  }
  burst(x, y, n, col, col2, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283;
      const sp = rrange(speed * 0.35, speed);
      this.spawn(P_KIND.SPARK, x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rrange(life * 0.5, life), size: (rrange(1, 3) | 0) + 1,
        col: col, col2: col2 || col, grav: 140, drag: 1.2
      });
    }
  }
  shards(x, y, col, col2) {
    const dirs = [[-1, -1.3], [1, -1.3], [-1, -0.6], [1, -0.6]];
    for (let i = 0; i < 4; i++) {
      this.spawn(P_KIND.SHARD, x, y, {
        vx: dirs[i][0] * rrange(40, 90), vy: dirs[i][1] * rrange(90, 150),
        life: rrange(0.6, 0.95), size: 4, col: col, col2: col2,
        grav: 560, vrot: dirs[i][0] * rrange(6, 12)
      });
    }
  }
  splash(x, y) {
    for (let i = 0; i < 8; i++) {
      this.spawn(P_KIND.SPLASH, x + rrange(-5, 5), y, {
        vx: rrange(-52, 52), vy: rrange(-118, -46),
        life: rrange(0.3, 0.62), size: 2, col: '#bfeaff', col2: '#6fbde0', grav: 320
      });
    }
  }
  ring(x, y, col, r) {
    this.spawn(P_KIND.RING, x, y, { life: 0.34, size: r || 4, col: col || '#ffffff' });
  }
  popText(x, y, txt, col) {
    this.spawn(P_KIND.TEXT, x, y, {
      vy: -34, life: 0.85, text: txt, col: col || '#ffffff', grav: 26, drag: 1.2
    });
  }

  update(dt) {
    let alive = 0;
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      p.px = p.x; p.py = p.y;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      if (p.drag) {
        const f = Math.exp(-p.drag * dt);
        p.vx *= f; p.vy *= f;
      }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      alive++;
    }
    this.count = alive;
  }

  render(g, camX, camY, alpha) {
    const vw = g.canvas.width, vh = g.canvas.height;
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      const x = Math.round(lerp(p.px, p.x, alpha) - camX);
      const y = Math.round(lerp(p.py, p.y, alpha) - camY);
      if (x < -24 || y < -24 || x > vw + 24 || y > vh + 24) continue;
      const k = p.life / p.maxLife;
      switch (p.kind) {
        case P_KIND.TEXT:
          g.globalAlpha = clamp(k * 2, 0, 1);
          Text.draw(g, p.text, x, y, { color: p.col, align: 'center', outline: '#2a1c10' });
          g.globalAlpha = 1;
          break;
        case P_KIND.RING: {
          const rr = p.size * (1 + (1 - k) * 3);
          g.globalAlpha = k;
          g.strokeStyle = p.col;
          g.lineWidth = 1;
          g.beginPath();
          g.arc(x + 0.5, y + 0.5, rr, 0, 6.283);
          g.stroke();
          g.globalAlpha = 1;
          break;
        }
        case P_KIND.SHARD: {
          g.save();
          g.translate(x, y);
          g.rotate(p.rot);
          g.fillStyle = p.col;
          g.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          g.fillStyle = p.col2;
          g.fillRect(-p.size / 2, -p.size / 2, p.size, 1);
          g.restore();
          break;
        }
        case P_KIND.GLOW: {
          g.globalAlpha = k * 0.6;
          g.fillStyle = p.col;
          const s = p.size * (0.6 + k * 0.8);
          g.fillRect(x - s, y - s, s * 2, s * 2);
          g.globalAlpha = 1;
          break;
        }
        default: {
          const s = Math.max(1, Math.round(p.size * (p.fade ? (0.45 + k * 0.55) : 1)));
          g.fillStyle = k > 0.5 ? p.col : p.col2;
          g.fillRect(x - (s >> 1), y - (s >> 1), s, s);
        }
      }
    }
  }
}

   EMBERLEAP — engine part 3
   Actor collision core · Player
   ========================================================================== */

/* -------------------------------------------------------- collision core
   Move-and-resolve against the tile grid. X and Y are resolved separately
   (the standard platformer approach — it makes corner cases predictable),
   and the whole move is substepped so nothing tunnels at high speed.        */
function moveActor(a, map, dt) {
  a.px = a.x; a.py = a.y;
  a.wasOnGround = a.onGround;
  a.hitWall = 0; a.hitCeil = false; a.landed = false;
  const prevBottom = a.y + a.h;

  let dx = a.vx * dt + (a.carryX || 0);
  let dy = a.vy * dt + (a.carryY || 0);
  a.carryX = 0; a.carryY = 0;

  const maxStep = 6;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / maxStep));
  const sdx = dx / steps, sdy = dy / steps;

  a.onGround = false;
  a.onSlope = false;
  a.groundTile = -1;

  for (let s = 0; s < steps; s++) {
    /* ---- horizontal ---- */
    if (sdx !== 0) {
      a.x += sdx;
      const y0 = Math.floor((a.y + 1) / TILE);
      const y1 = Math.floor((a.y + a.h - 1.001) / TILE);
      if (sdx > 0) {
        const tx = Math.floor((a.x + a.w - 0.001) / TILE);
        for (let ty = y0; ty <= y1; ty++) {
          if (SOLID_TILE[map.at(tx, ty)]) {
            a.x = tx * TILE - a.w - 0.001;
            if (a.vx > 0) a.vx = 0;
            a.hitWall = 1;
            break;
          }
        }
      } else {
        const tx = Math.floor(a.x / TILE);
        for (let ty = y0; ty <= y1; ty++) {
          if (SOLID_TILE[map.at(tx, ty)]) {
            a.x = (tx + 1) * TILE + 0.001;
            if (a.vx < 0) a.vx = 0;
            a.hitWall = -1;
            break;
          }
        }
      }
    }

    /* ---- vertical ---- */
    if (sdy !== 0) {
      const beforeBottom = a.y + a.h;
      a.y += sdy;
      const x0 = Math.floor((a.x + 0.6) / TILE);
      const x1 = Math.floor((a.x + a.w - 0.6) / TILE);
      if (sdy > 0) {
        const ty = Math.floor((a.y + a.h - 0.001) / TILE);
        for (let tx = x0; tx <= x1; tx++) {
          const id = map.at(tx, ty);
          const solid = SOLID_TILE[id] === 1;
          const semi = SEMI_TILE[id] === 1 && !a.ignoreSemi &&
            beforeBottom <= ty * TILE + 1.5;
          if (solid || semi) {
            a.y = ty * TILE - a.h;
            a.vy = 0;
            a.onGround = true;
            a.groundTile = id;
            break;
          }
        }
      } else {
        const ty = Math.floor(a.y / TILE);
        for (let tx = x0; tx <= x1; tx++) {
          if (SOLID_TILE[map.at(tx, ty)]) {
            a.y = (ty + 1) * TILE;
            if (a.vy < 0) a.vy = 0;
            a.hitCeil = true;
            a.ceilTx = tx; a.ceilTy = ty;
            break;
          }
        }
      }
    }

    /* ---- slopes: resolve against the ramp surface under the centre ---- */
    if (!a.noSlopes) {
      const cx = a.x + a.w * 0.5;
      const tx = Math.floor(cx / TILE);
      for (let k = -1; k <= 1; k++) {
        const ty = Math.floor((a.y + a.h - 1) / TILE) + k;
        const sy = map.slopeSurfaceY(tx, ty, cx);
        if (sy === null) continue;
        if (a.y + a.h > sy && a.y + a.h < sy + TILE + 10) {
          if (a.vy >= -1) {
            a.y = sy - a.h;
            a.vy = 0;
            a.onGround = true;
            a.onSlope = true;
            a.groundTile = map.at(tx, ty);
          }
          break;
        }
      }
    }
  }

  /* keep the actor glued to downhill slopes / small steps instead of
     launching off them every time the gradient changes                     */
  if (!a.onGround && a.wasOnGround && a.vy >= 0 && !a.noSnap) {
    const cx = a.x + a.w * 0.5;
    for (let probe = 1; probe <= 9; probe++) {
      const testY = a.y + probe;
      const bottom = testY + a.h;
      const ty = Math.floor((bottom - 0.001) / TILE);
      const tx = Math.floor(cx / TILE);
      const sy = map.slopeSurfaceY(tx, ty, cx);
      if (sy !== null && bottom >= sy - 1) {
        a.y = sy - a.h; a.vy = 0; a.onGround = true; a.onSlope = true; break;
      }
      const x0 = Math.floor((a.x + 0.6) / TILE), x1 = Math.floor((a.x + a.w - 0.6) / TILE);
      let hit = false;
      for (let txx = x0; txx <= x1; txx++) {
        const id = map.at(txx, ty);
        if (SOLID_TILE[id] || (SEMI_TILE[id] && !a.ignoreSemi && prevBottom <= ty * TILE + 1.5)) {
          a.y = ty * TILE - a.h; a.vy = 0; a.onGround = true; a.groundTile = id; hit = true; break;
        }
      }
      if (hit) break;
    }
  }

  if (a.onGround && !a.wasOnGround) a.landed = true;

  // hard clamp inside the level so nothing can escape sideways
  if (a.x < 0) { a.x = 0; if (a.vx < 0) a.vx = 0; a.hitWall = -1; }
  const maxX = map.pixW - a.w;
  if (a.x > maxX) { a.x = maxX; if (a.vx > 0) a.vx = 0; a.hitWall = 1; }
}

/** true if any tile overlapping the rect is a hazard of the given table */
function rectHasTile(map, x, y, w, h, table) {
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (table[map.at(tx, ty)]) return true;
  return false;
}

/* ------------------------------------------------------------------ Player */
const PSTATE = {
  NORMAL: 0, HURT: 1, DYING: 2, PIPE: 3, CLIMB: 4,
  VICTORY: 5, POLE: 6, WALKOFF: 7, TRANSFORM: 8, DOOR: 9
};

class Player {
  constructor(level) {
    this.level = level;
    this.x = 0; this.y = 0; this.px = 0; this.py = 0;
    this.w = FORM_W; this.h = FORM_H.small;
    this.vx = 0; this.vy = 0;
    this.form = 'small';
    this.shield = false;
    this.facing = 1;
    this.onGround = false; this.wasOnGround = false;
    this.state = PSTATE.NORMAL;
    this.stateT = 0;
    this.coyote = 0;
    this.jumpHeld = false;
    this.jumping = false;
    this.crouch = false;
    this.skid = false;
    this.running = false;
    this.invuln = 0;
    this.star = 0;
    this.blinkT = rrange(1.5, 4);
    this.blinking = 0;
    this.animT = 0;
    this.walkPhase = 0;
    this.squashX = 1; this.squashY = 1;
    this.dustT = 0;
    this.inWater = false;
    this.wasInWater = false;
    this.swimStroke = 0;
    this.fireCooldown = 0;
    this.fireballs = 0;
    this.glide = false;
    this.climbing = false;
    this.climbT = 0;
    this.ignoreSemi = false;
    this.dropT = 0;
    this.pipe = null;
    this.hitFlash = 0;
    this.carryX = 0; this.carryY = 0;
    this.ridingPlat = null;
    this.transformTo = null;
    this.deathT = 0;
    this.poleY = 0;
    this.controlLock = 0;
    this.spawnGrace = 0;
  }

  get big() { return this.form !== 'small'; }
  get cx() { return this.x + this.w * 0.5; }
  get cy() { return this.y + this.h * 0.5; }

  setForm(f, silent) {
    if (this.form === f) return;
    const oldH = this.h;
    this.form = f;
    this.h = FORM_H[f] || FORM_H.small;
    // grow upward from the feet, then nudge out of anything we now overlap
    this.y -= (this.h - oldH);
    this.resolveOverlap();
    if (!silent) {
      this.state = PSTATE.TRANSFORM;
      this.stateT = 0;
      this.transformTo = f;
    }
  }

  /** push the player out of solid geometry (used after growing / warping) */
  resolveOverlap() {
    const map = this.level.map;
    if (!map.rectSolid(this.x, this.y, this.w, this.h)) return;
    const tries = [
      [0, -1], [0, -2], [0, -3], [0, -4], [0, -6], [0, -8], [0, -12], [0, -16],
      [-2, 0], [2, 0], [-4, 0], [4, 0], [-6, -4], [6, -4], [0, 2], [0, 4], [0, 8]
    ];
    for (let i = 0; i < tries.length; i++) {
      const nx = this.x + tries[i][0], ny = this.y + tries[i][1];
      if (!map.rectSolid(nx, ny, this.w, this.h)) { this.x = nx; this.y = ny; return; }
    }
    // last resort: scan straight up for open space so we can never be entombed
    for (let up = 1; up <= 64; up++) {
      if (!map.rectSolid(this.x, this.y - up, this.w, this.h)) { this.y -= up; return; }
    }
  }

  spawnAt(x, y) {
    this.x = x; this.y = y - this.h;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.state = PSTATE.NORMAL; this.stateT = 0;
    this.onGround = false; this.coyote = 0;
    this.invuln = 0.6; this.spawnGrace = 0.35;
    this.star = 0; this.glide = false; this.climbing = false;
    this.crouch = false; this.pipe = null;
    this.resolveOverlap();
  }

  /* ------------------------------------------------------------ update */
  update(dt, input, lvl) {
    this.stateT += dt;
    this.animT += dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.spawnGrace > 0) this.spawnGrace -= dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;
    if (this.dropT > 0) { this.dropT -= dt; this.ignoreSemi = true; } else this.ignoreSemi = false;
    if (this.controlLock > 0) this.controlLock -= dt;

    if (this.star > 0) {
      this.star -= dt;
      if (this.star <= 0) { this.star = 0; lvl.onStarEnd(); }
    }

    // blink timer (idle charm)
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      this.blinking = 0.13;
      this.blinkT = rrange(1.8, 5.2);
    }
    if (this.blinking > 0) this.blinking -= dt;

    switch (this.state) {
      case PSTATE.DYING: this.updateDying(dt, lvl); return;
      case PSTATE.PIPE: this.updatePipe(dt, lvl); return;
      case PSTATE.POLE: this.updatePole(dt, lvl); return;
      case PSTATE.WALKOFF: this.updateWalkoff(dt, lvl); return;
      case PSTATE.TRANSFORM: this.updateTransform(dt, lvl); return;
      case PSTATE.DOOR: return;
      default: break;
    }

    const map = lvl.map;
    const locked = this.controlLock > 0;
    let mvL = !locked && input.down(ACT.LEFT);
    let mvR = !locked && input.down(ACT.RIGHT);
    const mvU = !locked && input.down(ACT.UP);
    const mvD = !locked && input.down(ACT.DOWN);
    if (mvL && mvR) { mvL = mvR = false; }
    this.running = !locked && input.down(ACT.RUN);

    /* --------------------------------------------------- water / swimming */
    this.wasInWater = this.inWater;
    this.inWater = rectHasTile(map, this.x + 2, this.y + this.h * 0.35, this.w - 4, this.h * 0.6, WATER_TILE);
    if (this.inWater && !this.wasInWater) {
      lvl.particles.splash(this.cx, this.y + this.h);
      lvl.audio.sfx('swim');
    } else if (!this.inWater && this.wasInWater) {
      lvl.particles.splash(this.cx, this.y + this.h);
    }

    /* -------------------------------------------------------- climbing */
    const onVine = map.atPix(this.cx, this.cy) === T.VINE || map.atPix(this.cx, this.y + 4) === T.VINE;
    if (this.climbing) {
      if (!onVine || input.pressed(ACT.JUMP)) {
        this.climbing = false;
        if (input.down(ACT.JUMP)) { this.vy = PHYS.jumpVy * 0.8; this.jumping = true; this.jumpHeld = true; lvl.audio.sfx('jump'); }
      } else {
        this.vy = (mvU ? -PHYS.climbSpeed : (mvD ? PHYS.climbSpeed : 0));
        this.vx = (mvR ? 30 : (mvL ? -30 : 0));
        if (mvU || mvD) this.climbT += dt * 6;
        moveActor(this, map, dt);
        this.postMove(dt, lvl);
        return;
      }
    } else if (onVine && (mvU || (mvD && !this.onGround))) {
      this.climbing = true;
      this.vx = 0; this.vy = 0; this.jumping = false;
    }

    /* --------------------------------------------------------- crouch */
    const wantCrouch = mvD && this.onGround && !this.inWater;
    if (wantCrouch && !this.crouch) {
      this.crouch = true;
      if (this.big) { this.h = 16; this.y += FORM_H.big - 16; }
    } else if (!wantCrouch && this.crouch) {
      // only stand back up if there is room
      const targetH = FORM_H[this.form];
      const ny = this.y - (targetH - this.h);
      if (!map.rectSolid(this.x, ny, this.w, targetH)) {
        this.crouch = false; this.y = ny; this.h = targetH;
      }
    }

    /* -------------------------------------------------------- horizontal */
    const dir = (mvR ? 1 : 0) - (mvL ? 1 : 0);
    const maxSpeed = this.inWater ? PHYS.swimMax
      : (this.crouch ? PHYS.walkMax * 0.36 : (this.running ? PHYS.runMax : PHYS.walkMax));
    const accel = this.inWater ? PHYS.swimAccel
      : (this.onGround ? PHYS.accelGround : PHYS.accelAir);

    this.skid = false;
    if (dir !== 0) {
      this.facing = dir;
      const reversing = sign(this.vx) !== 0 && sign(this.vx) !== dir;
      if (reversing && this.onGround && Math.abs(this.vx) > 42) {
        this.skid = true;
        this.vx = approach(this.vx, dir * maxSpeed, PHYS.skidDecel * dt);
        this.dustT -= dt;
        if (this.dustT <= 0) {
          this.dustT = 0.045;
          lvl.particles.dust(this.cx - dir * 4, this.y + this.h - 1, dir, 2);
        }
      } else {
        const a = accel * (reversing ? PHYS.turnBoost : 1);
        // let momentum above the cap bleed off naturally rather than snapping
        if (Math.abs(this.vx) > maxSpeed && sign(this.vx) === dir) {
          this.vx = approach(this.vx, dir * maxSpeed, PHYS.frictionGround * 0.5 * dt);
        } else {
          this.vx = approach(this.vx, dir * maxSpeed, a * dt);
        }
      }
    } else {
      const f = this.inWater ? 120 : (this.onGround ? PHYS.frictionGround : PHYS.frictionAir);
      this.vx = approach(this.vx, 0, f * dt);
    }

    /* running dust while at speed on the ground */
    if (this.onGround && !this.skid && Math.abs(this.vx) > PHYS.walkMax * 1.02) {
      this.dustT -= dt;
      if (this.dustT <= 0) {
        this.dustT = 0.075;
        lvl.particles.dust(this.cx - this.facing * 5, this.y + this.h - 1, this.facing, 1);
      }
    }

    /* ------------------------------------------------------------ jump */
    if (this.onGround) this.coyote = PHYS.coyote; else if (this.coyote > 0) this.coyote -= dt;

    const jumpPressed = !locked && input.buffered(ACT.JUMP, PHYS.buffer) && input.down(ACT.JUMP);
    const canJump = (this.onGround || this.coyote > 0) && !this.inWater;

    if (this.inWater) {
      if (!locked && input.pressed(ACT.JUMP)) {
        this.vy = PHYS.swimUp;
        this.swimStroke = 0.35;
        lvl.particles.spawn(P_KIND.BUBBLE, this.cx + rrange(-3, 3), this.cy, {
          vy: -26, life: 0.7, size: 2, col: '#cfefff', col2: '#8fd0f0', drag: 0.4
        });
        lvl.audio.sfx('swim');
        input.eatBuffer(ACT.JUMP);
      }
    } else if (jumpPressed && canJump) {
      // drop through a thin platform instead of jumping when ducking on one
      if (mvD && SEMI_TILE[this.groundTile]) {
        this.dropT = 0.2;
        this.onGround = false;
        this.y += 1;
      } else {
        const base = this.big ? PHYS.jumpVyBig : PHYS.jumpVy;
        this.vy = base - Math.abs(this.vx) * PHYS.jumpSpeedBonus;
        this.jumping = true;
        this.jumpHeld = true;
        this.onGround = false;
        this.coyote = 0;
        this.squashX = 0.78; this.squashY = 1.26;
        lvl.particles.jumpPuff(this.cx, this.y + this.h);
        lvl.audio.sfx(this.big ? 'jumpbig' : 'jump');
      }
      input.eatBuffer(ACT.JUMP);
    }
    if (!input.down(ACT.JUMP)) this.jumpHeld = false;
    if (this.vy >= 0) this.jumping = false;

    /* glide (Sky Feather) — hold jump while falling */
    this.glide = false;
    if (this.form === 'sky' && !this.onGround && !this.inWater && this.vy > 20 &&
      input.down(ACT.JUMP) && !locked) {
      this.glide = true;
    }

    /* ------------------------------------------------------------ gravity */
    let g;
    if (this.inWater) {
      g = PHYS.swimGrav;
      this.vy = Math.min(this.vy + g * dt, PHYS.swimMaxFall);
    } else if (this.glide) {
      this.vy = approach(this.vy, PHYS.glideFall, PHYS.glideGrav * dt);
      if (Math.random() < 0.25) {
        lvl.particles.spawn(P_KIND.SMOKE, this.cx + rrange(-6, 6), this.y + this.h - 4, {
          vx: -this.facing * 20, vy: 8, life: 0.35, size: 2, col: '#ffffff', col2: '#cfe6ff', drag: 2
        });
      }
    } else {
      if (this.vy < 0) g = (this.jumpHeld && this.jumping) ? PHYS.gRiseHeld : PHYS.gRiseFree;
      else g = PHYS.gFall;
      this.vy = Math.min(this.vy + g * dt * (lvl.def.gravityScale || 1), PHYS.maxFall);
    }

    /* ------------------------------------------------------------ move */
    moveActor(this, map, dt);
    this.postMove(dt, lvl);

    /* ------------------------------------------------ ceiling block bumps */
    if (this.hitCeil) {
      lvl.bumpFromBelow(this);
    }

    /* --------------------------------------------------------- fireball */
    if (this.form === 'ember' && !locked && input.pressed(ACT.RUN) &&
      this.fireCooldown <= 0 && lvl.countFireballs() < PHYS.maxFireballs) {
      this.fireCooldown = 0.24;
      lvl.spawnFireball(this.cx + this.facing * 6, this.y + this.h * 0.35, this.facing);
      lvl.audio.sfx('fireball');
      this.squashX = 1.16; this.squashY = 0.86;
    }
  }

  postMove(dt, lvl) {
    /* landing feedback */
    if (this.landed) {
      const power = clamp(Math.abs(this.py - this.y) / 8, 0.15, 1.4);
      const vpow = clamp(this.vyPrev / 260, 0.2, 1.2);
      this.squashX = 1 + 0.24 * vpow; this.squashY = 1 - 0.24 * vpow;
      if (this.vyPrev > 120) {
        lvl.particles.landPuff(this.cx, this.y + this.h, clamp(this.vyPrev / 380, 0.2, 1));
        lvl.audio.sfx('land');
        if (this.vyPrev > 330) lvl.camera.addShake(1.1, 0.1);
      }
      this.jumping = false;
    }
    this.vyPrev = this.vy > 0 ? this.vy : (this.landed ? this.vyPrev : 0);
    if (this.vy > 0) this.vyPrev = this.vy;

    /* squash/stretch relaxes back toward 1 */
    const relax = 1 - Math.pow(0.0001, dt);
    this.squashX = lerp(this.squashX, 1, relax);
    this.squashY = lerp(this.squashY, 1, relax);
    // airborne stretch based on vertical speed
    if (!this.onGround && !this.inWater && this.state === PSTATE.NORMAL) {
      const k = clamp(this.vy / 340, -1, 1);
      this.squashX = lerp(this.squashX, 1 - Math.abs(k) * 0.11, 0.35);
      this.squashY = lerp(this.squashY, 1 + Math.abs(k) * 0.13, 0.35);
    }

    if (Math.abs(this.vx) > 4) this.walkPhase += Math.abs(this.vx) * dt * (this.running ? 0.085 : 0.1);
    else this.walkPhase = 0;
  }

  /* ------------------------------------------------------- state updates */
  updateTransform(dt, lvl) {
    // brief pose freeze while the sprite swaps — reads as a "pop"
    this.vx = approach(this.vx, 0, 700 * dt);
    this.vy = Math.min(this.vy + PHYS.gFall * dt, PHYS.maxFall);
    moveActor(this, lvl.map, dt);
    const k = this.stateT / 0.42;
    this.squashX = 1 + Math.sin(k * Math.PI * 3) * 0.22;
    this.squashY = 1 - Math.sin(k * Math.PI * 3) * 0.22;
    if (this.stateT >= 0.42) {
      this.state = PSTATE.NORMAL;
      this.squashX = this.squashY = 1;
      this.transformTo = null;
    }
  }

  updateDying(dt, lvl) {
    this.deathT += dt;
    if (this.deathT > 0.45) {
      this.vy = Math.min(this.vy + 1500 * dt, 520);
      this.y += this.vy * dt;
    }
  }

  updatePipe(dt, lvl) {
    const p = this.pipe;
    if (!p) { this.state = PSTATE.NORMAL; return; }
    p.t += dt;
    const speed = 26;
    if (p.phase === 'in') {
      if (p.dir === 'down') this.y += speed * dt;
      else if (p.dir === 'up') this.y -= speed * dt;
      else this.x += (p.dir === 'right' ? 1 : -1) * speed * dt;
      if (p.t > 0.72) {
        p.phase = 'out'; p.t = 0;
        lvl.doWarp(p);
      }
    } else {
      if (p.outDir === 'up') this.y -= speed * dt;
      else if (p.outDir === 'down') this.y += speed * dt;
      else this.x += (p.outDir === 'right' ? 1 : -1) * speed * dt;
      if (p.t > 0.72) {
        this.state = PSTATE.NORMAL;
        this.pipe = null;
        this.vy = 0; this.vx = 0;
        this.resolveOverlap();
      }
    }
  }

  updatePole(dt, lvl) {
    // slide down the goal pole, then hop off and walk to the castle
    const targetY = lvl.map.goalBaseY - this.h;
    this.vx = 0;
    this.y += 92 * dt;
    if (this.y >= targetY) {
      this.y = targetY;
      this.state = PSTATE.WALKOFF;
      this.stateT = 0;
      this.facing = 1;
      this.x += 10;
      lvl.onPoleBottom();
    }
  }

  updateWalkoff(dt, lvl) {
    this.vx = 62;
    this.vy = Math.min(this.vy + PHYS.gFall * dt, PHYS.maxFall);
    this.facing = 1;
    moveActor(this, lvl.map, dt);
    this.walkPhase += dt * 6.5;
  }

  /* --------------------------------------------------------- damage/death */
  hurt(lvl, force) {
    if (this.state !== PSTATE.NORMAL && this.state !== PSTATE.TRANSFORM) return false;
    if (this.invuln > 0 && !force) return false;
    if (this.star > 0 && !force) return false;

    if (this.shield && !force) {
      this.shield = false;
      this.invuln = 1.2;
      this.hitFlash = 0.25;
      lvl.particles.burst(this.cx, this.cy, 14, '#9fe8ff', '#ffffff', 150, 0.55);
      lvl.particles.ring(this.cx, this.cy, '#bff0ff', 8);
      lvl.audio.sfx('fizz');
      lvl.camera.addShake(1.6, 0.16);
      lvl.hitStop(0.06);
      return true;
    }
    if (this.big) {
      this.setForm('small', true);
      this.invuln = PHYS.hurtInvuln;
      this.hitFlash = 0.3;
      this.state = PSTATE.NORMAL;
      lvl.particles.burst(this.cx, this.cy, 12, '#ffd479', '#ffffff', 130, 0.5);
      lvl.audio.sfx('powerdown');
      lvl.camera.addShake(2.2, 0.2);
      lvl.hitStop(0.09);
      this.vy = Math.min(this.vy, -70);
      return true;
    }
    this.die(lvl);
    return true;
  }

  die(lvl) {
    if (this.state === PSTATE.DYING) return;
    this.state = PSTATE.DYING;
    this.deathT = 0;
    this.vy = -330;
    this.vx = 0;
    this.shield = false;
    this.star = 0;
    lvl.onPlayerDeath();
  }

  /* --------------------------------------------------------- power-ups */
  applyPower(kind, lvl) {
    switch (kind) {
      case 'growth':
        if (this.form === 'small') { this.setForm('big'); lvl.addScore(1000, this.cx, this.y); }
        else lvl.addScore(1000, this.cx, this.y);
        break;
      case 'ember':
        this.setForm('ember');
        lvl.addScore(1000, this.cx, this.y);
        break;
      case 'feather':
        this.setForm('sky');
        lvl.addScore(1000, this.cx, this.y);
        break;
      case 'shield':
        this.shield = true;
        if (this.form === 'small') this.setForm('big');
        lvl.addScore(1000, this.cx, this.y);
        break;
      case 'star':
        this.star = PHYS.starTime;
        lvl.onStarStart();
        lvl.addScore(1000, this.cx, this.y);
        break;
      case '1up':
        lvl.addLife();
        break;
    }
    if (kind !== '1up') lvl.audio.sfx('powerup');
    lvl.particles.ring(this.cx, this.cy, '#ffffff', 6);
    lvl.particles.burst(this.cx, this.cy, 14, '#fff2b0', '#ffffff', 140, 0.6);
  }

  bounce(held) {
    this.vy = held ? PHYS.bounceVyHeld : PHYS.bounceVy;
    this.jumping = true;
    this.jumpHeld = held;
    this.onGround = false;
    this.squashX = 1.22; this.squashY = 0.8;
  }

  /* --------------------------------------------------------- animation */
  animName() {
    if (this.state === PSTATE.DYING) return 'hurt';
    if (this.state === PSTATE.POLE) return 'climb';
    if (this.state === PSTATE.PIPE) return 'pipe';
    if (this.state === PSTATE.VICTORY) return 'victory';
    if (this.climbing) return 'climb';
    if (this.inWater) return 'swim';
    if (this.crouch) return 'crouch';
    if (this.skid) return 'skid';
    if (!this.onGround) return this.vy < -12 ? 'jump' : 'fall';
    if (Math.abs(this.vx) > PHYS.walkMax * 1.03) return 'run';
    if (Math.abs(this.vx) > 6) return 'walk';
    if (this.blinking > 0) return 'blink';
    return 'idle';
  }

  animFrame(name) {
    switch (name) {
      case 'walk': return (this.walkPhase | 0) & 3;
      case 'run': return (this.walkPhase * 1.25 | 0) & 3;
      case 'climb': return ((this.climbT | 0) & 1);
      case 'swim': return ((this.animT * 5) | 0) & 1;
      case 'victory': return ((this.animT * 4) | 0) & 1;
      default: return 0;
    }
  }

  render(g, camX, camY, alpha, time) {
    if (this.state === PSTATE.DOOR) return;
    // flicker while invulnerable, but stay visible during the spawn grace
    if (this.invuln > 0 && this.spawnGrace <= 0 && this.state !== PSTATE.DYING) {
      if ((((this.invuln * 24) | 0) & 1) === 0) return;
    }
    const rxp = lerp(this.px, this.x, alpha);
    const ryp = lerp(this.py, this.y, alpha);
    const name = this.animName();
    const frame = this.animFrame(name);
    const art = Art.hero(this.form, name, frame);
    if (!art || !art.c) return;

    const bx = rxp - camX, by = ryp - camY;
    // sprites are anchored to the *full-height* hitbox; when crouching the
    // hitbox shrinks from the top, so shift the anchor back down
    const anchorY = this.crouch ? by - (FORM_H[this.form] - this.h) : by;

    g.save();
    const footX = Math.round(bx + this.w * 0.5);
    const footY = Math.round(anchorY + FORM_H[this.form]);
    g.translate(footX, footY);
    g.scale(this.facing < 0 ? -this.squashX : this.squashX, this.squashY);
    if (this.star > 0) {
      // invincibility: cycle a hue overlay by compositing over the sprite
      g.globalAlpha = 1;
      g.drawImage(art.c, -Math.round(this.w * 0.5) + art.ox, art.oy - FORM_H[this.form] + (this.crouch ? 0 : 0));
      g.globalCompositeOperation = 'source-atop';
      const hues = ['#ff5a5a', '#ffd34d', '#7bff8a', '#5ad0ff', '#c98bff'];
      g.globalAlpha = 0.55;
      g.fillStyle = hues[((time * 18) | 0) % hues.length];
      g.fillRect(-24, -40, 48, 48);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    } else {
      g.drawImage(art.c, -Math.round(this.w * 0.5) + art.ox, art.oy - FORM_H[this.form]);
      if (this.hitFlash > 0) {
        g.globalCompositeOperation = 'source-atop';
        g.globalAlpha = clamp(this.hitFlash * 3, 0, 0.9);
        g.fillStyle = '#ffffff';
        g.fillRect(-24, -40, 48, 48);
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
      }
    }
    g.restore();

    /* shield bubble overlay — drawn by the engine so it fits every form */
    if (this.shield) {
      const r = (this.big ? 17 : 11) + Math.sin(time * 5) * 0.8;
      const cx = Math.round(bx + this.w * 0.5);
      const cy = Math.round(anchorY + FORM_H[this.form] * 0.5);
      g.save();
      g.globalAlpha = 0.28 + Math.sin(time * 4) * 0.06;
      g.fillStyle = '#8fe4ff';
      g.beginPath(); g.arc(cx, cy, r, 0, 6.283); g.fill();
      g.globalAlpha = 0.85;
      g.strokeStyle = '#dff6ff';
      g.lineWidth = 1;
      g.beginPath(); g.arc(cx + 0.5, cy + 0.5, r, 0, 6.283); g.stroke();
      g.globalAlpha = 0.55;
      g.fillStyle = '#ffffff';
      g.fillRect(cx - r * 0.55, cy - r * 0.72, 2, 4);
      g.restore();
    }
  }
}

/* ========================================================================
   ENTITIES: enemies, projectiles, items, boss
   ======================================================================== */

/* ==========================================================================
   EMBERLEAP — engine part 4
   Enemies & AI · projectiles · collectibles · power-ups · platforms · boss
   ========================================================================== */

/* Base for everything that lives in the world and collides with tiles. */
class Entity {
  constructor(lvl, x, y, w, h) {
    this.lvl = lvl;
    this.x = x; this.y = y; this.px = x; this.py = y;
    this.w = w; this.h = h;
    this.vx = 0; this.vy = 0;
    this.dead = false;
    this.remove = false;
    this.active = false;
    this.onGround = false;
    this.carryX = 0; this.carryY = 0;
    this.gravity = 900;
    this.zBack = false;        // render behind the tile layer
  }
  get cx() { return this.x + this.w * 0.5; }
  get cy() { return this.y + this.h * 0.5; }
  overlapsPlayer(p) { return rectHit(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h); }
  render() { }
  update() { }
  drawArt(g, art, camX, camY, alpha, flip, extra) {
    if (!art || !art.c) return;
    const x = Math.round(lerp(this.px, this.x, alpha) - camX);
    const y = Math.round(lerp(this.py, this.y, alpha) - camY);
    if (flip) {
      g.save();
      g.translate(x + this.w * 0.5, y);
      g.scale(-1, extra && extra.sy ? extra.sy : 1);
      g.drawImage(art.c, -this.w * 0.5 + art.ox, art.oy);
      g.restore();
    } else if (extra && (extra.sx || extra.sy)) {
      g.save();
      g.translate(x + this.w * 0.5, y + this.h);
      g.scale(extra.sx || 1, extra.sy || 1);
      g.drawImage(art.c, -this.w * 0.5 + art.ox, art.oy - this.h);
      g.restore();
    } else {
      g.drawImage(art.c, x + art.ox, y + art.oy);
    }
  }
}

/* ---------------------------------------------------------------- Enemy */
class Enemy extends Entity {
  constructor(lvl, x, y, w, h) {
    super(lvl, x, y, w, h);
    this.dir = -1;
    this.stompable = true;
    this.fireKillable = true;
    this.shellKillable = true;
    this.squashT = 0;
    this.flipDying = false;
    this.animT = 0;
    this.hp = 1;
    this.scoreValue = 100;
    this.type = 'enemy';
    this.turnAtLedge = false;
    this.wakeDist = 40;        // extra pixels beyond the view before waking
  }

  wake() { this.active = true; }

  /** shared "walk along the floor, turn at walls" body */
  walkPhysics(dt, speed) {
    this.vx = this.dir * speed;
    this.vy = Math.min(this.vy + this.gravity * dt, 420);
    if (this.turnAtLedge && this.onGround) {
      const aheadX = this.dir > 0 ? this.x + this.w + 2 : this.x - 2;
      const belowY = this.y + this.h + 3;
      const t = this.lvl.map.atPix(aheadX, belowY);
      if (!SOLID_TILE[t] && !SEMI_TILE[t] && !SLOPE_TILE[t]) this.dir = -this.dir;
    }
    moveActor(this, this.lvl.map, dt);
    if (this.hitWall) this.dir = -this.dir;
    // enemies drowning in hazards just die
    if (rectHasTile(this.lvl.map, this.x + 2, this.y + this.h - 4, this.w - 4, 4, HAZARD_TILE)) {
      this.killBy('fire');
    }
  }

  /** stomped by the player from above */
  onStomp(p, lvl) {
    this.killBy('stomp');
    return true;                 // true -> the player bounces
  }

  killBy(how) {
    const lvl = this.lvl;
    if (this.dead) return;
    this.dead = true;
    lvl.addScore(this.scoreValue, this.cx, this.y, true);
    if (how === 'stomp') {
      this.squashT = 0.45;
      lvl.particles.burst(this.cx, this.y + this.h - 3, 8, '#ffe6a8', '#c88b4a', 110, 0.4);
      lvl.audio.sfx('stomp');
      lvl.camera.addShake(1.2, 0.09);
      lvl.hitStop(0.055);
    } else {
      this.flipDying = true;
      this.vy = -230;
      this.vx = (how === 'shell' ? sign(this.vx || 1) : 1) * 40;
      lvl.particles.burst(this.cx, this.cy, 12, how === 'fire' ? '#ffb15a' : '#fff0b0', '#ff6a3d', 150, 0.55);
      lvl.audio.sfx(how === 'fire' ? 'fizz' : 'kick');
      lvl.camera.addShake(1.4, 0.1);
      lvl.hitStop(0.05);
    }
  }

  updateDeath(dt) {
    if (this.squashT > 0) {
      this.squashT -= dt;
      if (this.squashT <= 0) this.remove = true;
      return true;
    }
    if (this.flipDying) {
      this.vy += 900 * dt;
      this.px = this.x; this.py = this.y;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y > this.lvl.map.pixH + 60) this.remove = true;
      return true;
    }
    return false;
  }
}

/* ------------------------------------------------------------- Walker
   Patrols, turns at walls. The tutorial enemy: predictable and slow.       */
class Walker extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x, y - 14, 14, 14);
    this.type = 'walker';
    this.speed = 26;
    this.scoreValue = 100;
    this.turnAtLedge = false;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    this.walkPhysics(dt, this.speed);
  }
  render(g, camX, camY, alpha) {
    let art;
    if (this.squashT > 0) art = Art.enemy('walker', 'squash', 0);
    else if (this.flipDying) art = Art.enemy('walker', 'flip', 0);
    else art = Art.enemy('walker', 'walk', ((this.animT * 6) | 0) & 1);
    this.drawArt(g, art, camX, camY, alpha, this.dir > 0, this.flipDying ? { sy: -1 } : null);
  }
}

/* --------------------------------------------------------- Shellcrawler
   Stomp once -> retracts into a shell. Kick the shell and it becomes a
   ricocheting projectile that mows down other enemies (and you).           */
class Shellcrawler extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x, y - 16, 14, 16);
    this.type = 'shellcrawler';
    this.speed = 32;
    this.mode = 'walk';        // walk | shell | spin
    this.shellT = 0;
    this.scoreValue = 100;
    this.turnAtLedge = false;
  }
  toShell() {
    this.mode = 'shell';
    this.shellT = 6.5;
    this.vx = 0;
    const oldBottom = this.y + this.h;
    this.h = 13; this.w = 14;
    this.y = oldBottom - this.h;
    this.lvl.particles.burst(this.cx, this.cy, 8, '#ffe6a8', '#b7793c', 100, 0.4);
  }
  kick(dirFrom) {
    this.mode = 'spin';
    this.vx = dirFrom * 176;
    this.dir = dirFrom;
    this.shellT = 0;
    this.lvl.audio.sfx('kick');
    this.lvl.particles.burst(this.cx, this.cy, 6, '#fff3c4', '#ffffff', 130, 0.3);
    this.lvl.camera.addShake(1.1, 0.08);
  }
  onStomp(p, lvl) {
    if (this.mode === 'walk') {
      this.toShell();
      lvl.audio.sfx('stomp');
      lvl.addScore(100, this.cx, this.y, true);
      lvl.camera.addShake(1.1, 0.08);
      lvl.hitStop(0.05);
      return true;
    }
    if (this.mode === 'spin') {                 // stomping a moving shell stops it
      this.mode = 'shell'; this.vx = 0; this.shellT = 6.5;
      lvl.audio.sfx('stomp');
      return true;
    }
    // stationary shell: kick it away from the player
    this.kick(p.cx < this.cx ? 1 : -1);
    lvl.addScore(400, this.cx, this.y, true);
    return true;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    if (this.mode === 'walk') {
      this.walkPhysics(dt, this.speed);
    } else if (this.mode === 'shell') {
      this.vx = approach(this.vx, 0, 400 * dt);
      this.vy = Math.min(this.vy + this.gravity * dt, 420);
      moveActor(this, this.lvl.map, dt);
      this.shellT -= dt;
      if (this.shellT <= 0) {                   // pops back out
        this.mode = 'walk';
        const oldBottom = this.y + this.h;
        this.h = 16; this.y = oldBottom - this.h;
        this.lvl.particles.sparkle(this.cx, this.cy, '#ffe6a8');
      }
    } else {                                     // spinning
      this.vy = Math.min(this.vy + this.gravity * dt, 420);
      this.vx = this.dir * 176;
      moveActor(this, this.lvl.map, dt);
      if (this.hitWall) {
        this.dir = -this.dir;
        this.lvl.audio.sfx('shellhit');
        this.lvl.particles.burst(this.cx + this.hitWall * 6, this.cy, 5, '#ffffff', '#ffe08a', 90, 0.25);
        this.lvl.camera.addShake(0.8, 0.06);
      }
      // mow down anything it touches
      const list = this.lvl.enemies;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e === this || e.dead || !e.active) continue;
        if (e.shellKillable && rectHit(this.x, this.y, this.w, this.h, e.x, e.y, e.w, e.h)) {
          e.killBy('shell');
          this.lvl.comboFromShell();
        }
      }
      if (rectHasTile(this.lvl.map, this.x + 2, this.y + this.h - 3, this.w - 4, 3, HAZARD_TILE)) this.killBy('fire');
    }
  }
  render(g, camX, camY, alpha) {
    let art;
    if (this.flipDying) art = Art.enemy('shellcrawler', 'shell', 0);
    else if (this.mode === 'walk') art = Art.enemy('shellcrawler', 'walk', ((this.animT * 6) | 0) & 1);
    else if (this.mode === 'shell') {
      // wobble just before popping back out, as a fair warning
      const warn = this.shellT < 1.6 && (((this.shellT * 12) | 0) & 1);
      art = Art.enemy('shellcrawler', warn ? 'shellspin' : 'shell', 0);
    } else art = Art.enemy('shellcrawler', 'shellspin', ((this.animT * 22) | 0) & 1);
    this.drawArt(g, art, camX, camY, alpha, this.dir > 0, this.flipDying ? { sy: -1 } : null);
  }
}

/* ----------------------------------------------------------- WingHopper */
class WingHopper extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x, y - 16, 14, 16);
    this.type = 'winghopper';
    this.winged = true;
    this.hopT = rrange(0.4, 1.1);
    this.speed = 22;
    this.scoreValue = 200;
    this.turnAtLedge = true;
  }
  onStomp(p, lvl) {
    if (this.winged) {                 // knock the wings off first
      this.winged = false;
      this.speed = 34;
      this.scoreValue = 100;
      lvl.audio.sfx('stomp');
      lvl.addScore(200, this.cx, this.y, true);
      lvl.particles.burst(this.cx, this.cy, 10, '#e8f4ff', '#ffffff', 120, 0.5);
      lvl.hitStop(0.05);
      return true;
    }
    this.killBy('stomp');
    return true;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    if (this.winged) {
      this.hopT -= dt;
      if (this.onGround && this.hopT <= 0) {
        this.vy = -212;
        this.hopT = rrange(0.75, 1.15);
        this.lvl.particles.dust(this.cx, this.y + this.h, this.dir, 2);
      }
    }
    this.walkPhysics(dt, this.speed);
  }
  render(g, camX, camY, alpha) {
    let art;
    if (this.squashT > 0) art = Art.enemy('walker', 'squash', 0);
    else if (this.flipDying) art = Art.enemy('winghopper', 'hop', 0);
    else if (this.winged) art = Art.enemy('winghopper', 'fly', ((this.animT * 11) | 0) & 1);
    else art = Art.enemy('winghopper', 'hop', 0);
    this.drawArt(g, art, camX, camY, alpha, this.dir > 0, this.flipDying ? { sy: -1 } : null);
  }
}

/* ----------------------------------------------------------- TunnelPlant
   Rises out of a tunnel on a cycle, but never while the player is standing
   right on top of the pipe — that rule is what makes it fair.              */
class TunnelPlant extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x + 1, y, 14, 20);
    this.type = 'tunnelplant';
    this.baseY = y + 20;          // fully hidden position (bottom of the sprite)
    this.topY = y;                // fully extended
    this.stompable = false;
    this.phase = 'hide';
    this.t = rrange(0.5, 1.6);
    this.ext = 0;
    this.scoreValue = 200;
    this.gravity = 0;
    this.wakeDist = 8;
  }
  update(dt) {
    if (this.updateDeath(dt)) { this.y += 0; return; }
    this.animT += dt;
    const p = this.lvl.player;
    const nearby = Math.abs(p.cx - (this.x + this.w * 0.5)) < 26;
    this.t -= dt;
    switch (this.phase) {
      case 'hide':
        this.ext = approach(this.ext, 0, dt * 3.2);
        if (this.t <= 0 && !nearby) { this.phase = 'rise'; this.t = 0; }
        break;
      case 'rise':
        this.ext = approach(this.ext, 1, dt * 2.6);
        if (this.ext >= 1) { this.phase = 'out'; this.t = 1.5; }
        break;
      case 'out':
        if (this.t <= 0) { this.phase = 'down'; }
        break;
      case 'down':
        this.ext = approach(this.ext, 0, dt * 2.6);
        if (this.ext <= 0) { this.phase = 'hide'; this.t = rrange(1.1, 2.0); }
        break;
    }
    this.px = this.x; this.py = this.y;
    this.y = this.baseY - this.h * this.ext;
    // only dangerous once it has actually emerged
    this.harmless = this.ext < 0.25;
  }
  render(g, camX, camY, alpha) {
    if (this.ext <= 0.02 && !this.dead) return;
    const art = Art.enemy('tunnelplant', 'bite', ((this.animT * 5) | 0) & 1);
    if (!art) return;
    const x = Math.round(this.x - camX), y = Math.round(this.y - camY);
    // clip to the pipe mouth so it slides out instead of popping
    g.save();
    g.beginPath();
    g.rect(x - 4, Math.round(this.baseY - this.h - camY), this.w + 8, this.h);
    g.clip();
    g.drawImage(art.c, x + art.ox, y + art.oy);
    g.restore();
  }
}

/* --------------------------------------------------------------- Beetle
   Armoured on top: stomping hurts you. Fire, shells and stars kill it.     */
class Beetle extends Enemy {
  constructor(lvl, x, y) {
    super(lvl, x, y - 14, 16, 14);
    this.type = 'beetle';
    this.speed = 20;
    this.stompable = false;
    this.scoreValue = 200;
    this.turnAtLedge = true;
  }
  update(dt) {
    if (this.updateDeath(dt)) return;
    this.animT += dt;
    this.walkPhysics(dt, this.speed);
  }
  render(g, camX, camY, alpha) {
    const art = this.flipDying ? Art.enemy('beetle', 'flip', 0)
      : Art.enemy('beetle', 'walk', ((this.animT * 5) | 0) & 1);
