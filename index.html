<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Backrooms</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Courier New", Courier, monospace; color: #e9dfae; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 245, 200, 0.55); }

  /* Overlay screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 6, 2, 0.82); text-align: center; }
  .screen h1 { font-size: clamp(32px, 7vw, 72px); letter-spacing: 0.25em; margin: 0 0 0.3em; color: #f3e6a2; text-shadow: 0 0 18px rgba(255, 220, 120, 0.35); }
  .screen p { max-width: 640px; line-height: 1.5; opacity: 0.85; padding: 0 16px; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(40, 34, 14, 0.85); color: #f1e4a6; border: 1px solid #8a7a3a; padding: 12px 28px; margin: 6px; font: inherit; font-size: 18px; letter-spacing: 0.15em; min-width: 240px; }
  .btn:hover { background: rgba(90, 76, 28, 0.9); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
</div>

<div id="startScreen" class="screen">
  <h1>THE BACKROOMS</h1>
  <p>Click to enter. WASD to move, mouse to look, Shift to run, C to crouch.</p>
  <button class="btn" id="btnStart">ENTER</button>
</div>

<div id="loadError" class="screen hidden">
  <h1>NO SIGNAL</h1>
  <p>Could not load Three.js from the internet. Check your connection and reload the page.</p>
</div>

<script type="module">
// ============================================================================
//  BOOT: load Three.js from a CDN (with fallbacks)
// ============================================================================
const CDN_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://unpkg.com/three@0.160.0/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',

for (const url of CDN_URLS) {
  try { THREE = await import(url); break; } catch (e) { console.warn('Three.js CDN failed:', url, e); }

  document.getElementById('startScreen').classList.add('hidden');

// ============================================================================
//  CONSTANTS & UTILITIES
// ============================================================================
const CELL = 2.4;          // size of one grid cell (m)
const WALL_H = 2.9;        // ceiling height (m)

const $ = (id) => document.getElementById(id);

// Deterministic integer hash -> [0,1)

  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 1442695041;

const container = $('game');

scene.background = new THREE.Color(0x1a1608);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 120);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;

// ============================================================================
//  WORLD GENERATION (endless, deterministic, chunked)
// ============================================================================
const CHUNK = 8;                      // cells per chunk side

const fdiv = (a, b) => Math.floor(a / b);

  style(kx, kz) {

    const p = (STYLE_BORDER[this.style(kx - 1, kz)] + STYLE_BORDER[this.style(kx, kz)]) * 0.5;

    const s = this.seed;
    if (i === Math.floor(hash2(kx, kz, s + 14) * CHUNK) || i === Math.floor(hash2(kx, kz, s + 15) * CHUNK)) return false;
    const p = (STYLE_BORDER[this.style(kx, kz - 1)] + STYLE_BORDER[this.style(kx, kz)]) * 0.5;
    return hash2(kx, kz * CHUNK + i, s + 16) < p;

  darkness(cx, cz) {

    const a = hash2(ix, iz, s + 21), b = hash2(ix + 1, iz, s + 21), c = hash2(ix, iz + 1, s + 21), d = hash2(ix + 1, iz + 1, s + 21);

    const key = ckey(kx, kz);
    if (key === this._lk) return this._ld;

      d = this.generate(kx, kz);
      this.cache.set(key, d);

    const style = this.style(kx, kz);

      else if (r2 < 0.10) type = LIGHT.FLICKER;

// ---------------------------------------------------------------------------
//  Collision against walls and pillars (circle vs axis-aligned boxes)
// ---------------------------------------------------------------------------

    if (world.pillar(i, j)) { const b = _boxes[n++]; b.x0 = i * CELL - ph; b.x1 = i * CELL + ph; b.z0 = j * CELL - ph; b.z1 = j * CELL + ph; }

// ============================================================================
//  CHUNK MESHES

class GeoBuilder {

const SEG = 4;   // floor/ceiling subdivisions per cell

      walls.quad(xs, 0, Z + h, xe - xs, 0, 0, 0, H, 0, 0, 0, 1, su, wsegV, 1);
      if (!contA && !world.wallW(gxA, gz) && !world.wallW(gxA, gz - 1)) walls.quad(xs, 0, Z - h, 0, 0, T, 0, H, 0, -1, 0, 0, 1, wsegV, 1);
      if (!contB && !world.wallW(gxB + 1, gz) && !world.wallW(gxB + 1, gz - 1)) walls.quad(xe, 0, Z - h, 0, 0, T, 0, H, 0, 1, 0, 0, 1, wsegV, 1);
    }
  }
  // --- pillars, floor, ceiling, light panels ---
  const ph = PILLAR / 2;
  for (let lz = 0; lz < N; lz++) for (let lx = 0; lx < N; lx++) {
    const cx = gx0 + lx, cz = gz0 + lz, x0 = cx * CELL, z0 = cz * CELL;
    if (world.pillar(cx, cz)) {
      walls.quad(x0 - ph, 0, z0 - ph, PILLAR, 0, 0, 0, H, 0, 0, 0, -1, 1, wsegV, 1);
      walls.quad(x0 - ph, 0, z0 + ph, PILLAR, 0, 0, 0, H, 0, 0, 0, 1, 1, wsegV, 1);
      walls.quad(x0 - ph, 0, z0 - ph, 0, 0, PILLAR, 0, H, 0, -1, 0, 0, 1, wsegV, 1);
      walls.quad(x0 + ph, 0, z0 - ph, 0, 0, PILLAR, 0, H, 0, 1, 0, 0, 1, wsegV, 1);
    }
    floor.quad(x0, 0, z0, CELL, 0, 0, 0, 0, CELL, 0, 1, 0, SEG, SEG, 0);
    ceil.quad(x0, H, z0, CELL, 0, 0, 0, 0, CELL, 0, -1, 0, SEG, SEG, 0);
    if (world.lightType(cx, cz) >= 0) {
      const mx = x0 + CELL / 2, mz = z0 + CELL / 2;
      panels.quad(mx - 0.3, H - 0.012, mz - 0.6, 0.6, 0, 0, 0, 0, 1.2, 0, -1, 0, 1, 1, 0);
    }
  }
  return { walls: walls.build(), floor: floor.build(), ceil: ceil.build(), panels: panels.build() };
}

const MAT = {
  wall: new THREE.MeshLambertMaterial({ color: 0xc9b458 }),
  floor: new THREE.MeshLambertMaterial({ color: 0x6b5a2e }),
  ceil: new THREE.MeshLambertMaterial({ color: 0xd8d2b0 }),
  panel: new THREE.MeshBasicMaterial({ color: 0xfff8e0 }),
};
scene.add(new THREE.HemisphereLight(0xfff2c0, 0x403010, 0.9));

const LOAD_RADIUS = 2;
const chunkMeshes = new Map();
function buildChunk(kx, kz) {
  const g = buildChunkGeometry(kx, kz);
  const group = new THREE.Group();
  group.add(new THREE.Mesh(g.walls, MAT.wall), new THREE.Mesh(g.floor, MAT.floor), new THREE.Mesh(g.ceil, MAT.ceil), new THREE.Mesh(g.panels, MAT.panel));
  scene.add(group);
  chunkMeshes.set(ckey(kx, kz), { kx, kz, group });
}
function disposeChunk(c) {
  scene.remove(c.group);
  c.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
}
function clearChunks() { for (const c of chunkMeshes.values()) disposeChunk(c); chunkMeshes.clear(); }
const _needed = [];
function updateChunks(px, pz, force = false) {
  const pkx = fdiv(px, CHUNK_SIZE), pkz = fdiv(pz, CHUNK_SIZE);
  for (const [key, c] of chunkMeshes) {
    if (Math.max(Math.abs(c.kx - pkx), Math.abs(c.kz - pkz)) > LOAD_RADIUS + 1) { disposeChunk(c); chunkMeshes.delete(key); }
  }
  _needed.length = 0;
  for (let dz = -LOAD_RADIUS; dz <= LOAD_RADIUS; dz++) for (let dx = -LOAD_RADIUS; dx <= LOAD_RADIUS; dx++) {
    if (!chunkMeshes.has(ckey(pkx + dx, pkz + dz))) _needed.push([pkx + dx, pkz + dz, dx * dx + dz * dz]);
  }
  if (!_needed.length) return;
  _needed.sort((a, b) => a[2] - b[2]);
  let budget = force ? Infinity : 1;
  for (const [kx, kz] of _needed) { if (budget-- <= 0) break; buildChunk(kx, kz); }
}

const playerLight = new THREE.PointLight(0xfff0c0, 2.5, 14, 1.2);
scene.add(playerLight);

// ============================================================================
//  INPUT
// ============================================================================
const keys = Object.create(null);
const input = { lookX: 0, lookY: 0, sensitivity: 1.0, locked: false };

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyC' && !e.repeat) player.crouchToggle = !player.crouchToggle;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.addEventListener('mousemove', (e) => {
  if (!input.locked || game.state !== 'playing') return;
  input.lookX += e.movementX || 0;
  input.lookY += e.movementY || 0;
});
document.addEventListener('pointerlockchange', () => {
  input.locked = document.pointerLockElement === renderer.domElement;
});
function requestLock() {
  try {
    const p = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* pointer lock unavailable (e.g. headless) */ }
}
renderer.domElement.addEventListener('click', () => { if (game.state === 'playing' && !input.locked) requestLock(); });

// ============================================================================
//  PLAYER
// ============================================================================
const player = {
  pos: new THREE.Vector3(CELL * 0.5, 0, CELL * 0.5),
  vel: new THREE.Vector3(),
  yaw: Math.PI, pitch: 0,
  radius: 0.28,
  eye: 1.62,
  crouchToggle: false,
  crouching: false, running: false, moving: false,
  bobPhase: 0, bobAmt: 0,
  speed: 0,
};
const SPEED_WALK = 2.6, SPEED_RUN = 5.2, SPEED_CROUCH = 1.25;
const EYE_STAND = 1.62, EYE_CROUCH = 0.92;

const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _wish = new THREE.Vector3();
function updatePlayer(dt) {
  // --- look ---
  const sens = 0.0022 * input.sensitivity;
  player.yaw -= input.lookX * sens;
  player.pitch -= input.lookY * sens;
  player.pitch = clamp(player.pitch, -1.45, 1.45);
  input.lookX = 0; input.lookY = 0;

  // --- move intent ---
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  player.moving = len > 0.05;

  player.crouching = player.crouchToggle;
  const wantRun = (keys.ShiftLeft || keys.ShiftRight) && player.moving && mz > 0.1 && !player.crouching;
  player.running = wantRun;
  const target = player.crouching ? SPEED_CROUCH : player.running ? SPEED_RUN : SPEED_WALK;

  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _right.set(-_fwd.z, 0, _fwd.x);
  _wish.set(0, 0, 0).addScaledVector(_fwd, mz).addScaledVector(_right, mx).multiplyScalar(target);

  const accel = player.moving ? 10 : 12;
  const k = 1 - Math.exp(-accel * dt);
  player.vel.x += (_wish.x - player.vel.x) * k;
  player.vel.z += (_wish.z - player.vel.z) * k;
  player.speed = Math.hypot(player.vel.x, player.vel.z);

  // --- integrate with sub-steps + collision ---
  const dist = player.speed * dt;
  const steps = Math.max(1, Math.ceil(dist / 0.1));
  for (let i = 0; i < steps; i++) {
    player.pos.x += (player.vel.x * dt) / steps;
    player.pos.z += (player.vel.z * dt) / steps;
    resolveCircle(player.pos, player.radius);
  }

  // --- crouch height & head bob ---
  const eyeTarget = player.crouching ? EYE_CROUCH : EYE_STAND;
  player.eye += (eyeTarget - player.eye) * (1 - Math.exp(-10 * dt));
  const stepLen = player.running ? 1.05 : player.crouching ? 0.55 : 0.75;
  const prevPhase = player.bobPhase;
  player.bobPhase += (player.speed * dt / stepLen) * Math.PI;
  player.bobAmt += ((player.speed > 0.3 ? 1 : 0) - player.bobAmt) * (1 - Math.exp(-6 * dt));
  if (Math.floor(prevPhase / Math.PI) !== Math.floor(player.bobPhase / Math.PI) && player.speed > 0.5) {
    onFootstep();
  }

  const bobScale = player.running ? 0.065 : player.crouching ? 0.025 : 0.04;
  const bobY = Math.abs(Math.sin(player.bobPhase)) * bobScale * player.bobAmt;
  const bobX = Math.cos(player.bobPhase) * bobScale * 0.6 * player.bobAmt;
  camera.position.set(
    player.pos.x + _right.x * bobX,
    player.eye + bobY - bobScale * 0.5 * player.bobAmt,
    player.pos.z + _right.z * bobX
  );
  camera.rotation.set(player.pitch, player.yaw, Math.cos(player.bobPhase) * 0.004 * player.bobAmt);
}

let footstepCount = 0;
function onFootstep() { footstepCount++; }

// ============================================================================
//  GAME STATE
// ============================================================================
const game = { state: 'menu', time: 0 };
function startGame() {
  $('startScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  game.state = 'playing';
  requestLock();
}
$('btnStart').addEventListener('click', startGame);

// ============================================================================
//  MAIN LOOP
// ============================================================================
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (game.state === 'playing') {
    game.time += dt;
    updatePlayer(dt);
    playerLight.position.set(player.pos.x, WALL_H - 0.3, player.pos.z);
    updateChunks(player.pos.x, player.pos.z);
  }
  renderer.render(scene, camera);
}
camera.position.set(player.pos.x, EYE_STAND, player.pos.z);
camera.rotation.set(0, player.yaw, 0);
updateChunks(player.pos.x, player.pos.z, true);
frame();

// Debug / test hook
window.__bk = { THREE, game, player, keys, input, camera, get world() { return world; }, chunkMeshes, updateChunks, startGame, get footsteps() { return footstepCount; } };
</script>
</body>
</html>
