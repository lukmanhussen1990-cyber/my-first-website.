<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2a07b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dash District</title>
<style>
/* Layout concept: full-bleed 3D canvas, HUD floats in the four corners inside the safe area. */
:root {
  --ink: #1b1530;
  --panel: rgba(22, 18, 40, 0.58);
  --panel-edge: rgba(255, 255, 255, 0.10);
  --white: #ffffff;
  --gold: #ffd23f;
  --gold-deep: #f29a12;
  --blue: #2f8cf0;
  --blue-deep: #1758b8;
  --green: #4fdc4a;
  --green-deep: #23a12b;
  --orange: #ff7a1a;
  --pink: #ff5fa2;
  --sky: #f2a07b;
  --font: "Arial Rounded MT Bold", ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Baloo 2", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  --u: clamp(0.62px, calc(min(100vw, 100vh) / 720), 1.35px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: var(--sky); color: var(--white);
  font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none;
}
#game { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#6f9fe0, #b5a2d8 45%, #f6a3a0 70%, #ffc58a); }
#game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#fxCanvas { pointer-events: none; }
#loading {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(#6f9fe0, #b5a2d8 45%, #f6a3a0 70%, #ffc58a); z-index: 50;
  font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 3px 0 rgba(40, 20, 60, 0.45);
}
#loading .lt { font-size: calc(var(--u) * 46); }
#loading .ls { font-size: calc(var(--u) * 20); opacity: 0.9; }
#loading .bar { width: calc(var(--u) * 260); height: calc(var(--u) * 14); border-radius: 99px; background: rgba(20, 16, 40, 0.45); overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.5); }
#loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(var(--gold), var(--gold-deep)); transition: width 0.2s; }
#loading.err .bar { display: none; }
#hudMini { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; text-align: right; font-weight: 900; text-shadow: 0 3px 0 rgba(30, 20, 50, 0.5); pointer-events: none; }
#hudMini .hm-score { font-size: calc(var(--u) * 54); letter-spacing: 0.02em; }
#hudMini .hm-coins { font-size: calc(var(--u) * 26); color: var(--gold); }
#tMsg { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); display: none; padding: 16px 22px; border-radius: 18px; background: var(--panel); font-weight: 900; font-size: calc(var(--u) * 30); text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="game">
  <canvas id="gl" tabindex="0" aria-label="Dash District game view"></canvas>
  <canvas id="fxCanvas"></canvas>
</div>
<div id="loading">
  <div class="lt">DASH DISTRICT</div>
  <div class="ls" id="loadingMsg">Loading the city…</div>
  <div class="bar"><i id="loadingBar"></i></div>
</div>
<div id="hudMini">
  <div class="hm-score"><span id="tScore">000000</span></div>
  <div class="hm-coins"><span id="tCoins">0</span> coins</div>
</div>
<div id="tMsg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

// ==== CORE ====
// Core helpers, tuning constants, random numbers, a tiny event bus and the safe save system.

if (typeof THREE === 'undefined') {
  const box = document.getElementById('loading');
  const msg = document.getElementById('loadingMsg');
  if (box) box.classList.add('err');
  if (msg) msg.textContent = 'Could not load the 3D engine. Check your internet connection and reload the page.';
  return;
}

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smoothstep = t => t * t * (3 - 2 * t);
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const pad6 = n => {
  const s = String(Math.max(0, Math.floor(n)));
  return s.length >= 6 ? s : '000000'.slice(s.length) + s;
};
const fmtInt = n => String(Math.max(0, Math.floor(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

const QUERY = new URLSearchParams(location.search);
const DEBUG = QUERY.has('debug');
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const IS_MOBILE = IS_TOUCH && Math.min(screen.width, screen.height) < 900;
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const CFG = {
  LANE_W: 2.8,
  LANE_X: [-2.8, 0, 2.8],
  SEG_LEN: 40,
  SPAWN_AHEAD: 235,      // how far ahead content is generated
  RECYCLE_BEHIND: 16,    // how far behind the player things are recycled
  SPEED_START: 15,
  SPEED_MAX: 36,
  SPEED_DIST: 4200,      // distance scale of the speed curve
  GRAVITY: 52,
  JUMP_H: 2.15,
  JUMP_H_SNEAKERS: 4.6,
  ROLL_TIME: 0.62,
  LANE_TIME: 0.16,
  PLAYER_H: 1.75,
  PLAYER_ROLL_H: 0.85,
  PLAYER_HW: 0.3,        // half width of the player's collision box
  PLAYER_HD: 0.28,       // half depth of the player's collision box
  TRAIN_W: 2.5,
  TRAIN_H: 3.3,
  CAR_LEN: 12.5,
  CAR_GAP: 0.55,
  RAMP_LEN: 9,
  JET_ALT: 6.2,
  BED_HALF: 4.3,         // half width of the track bed
  WALK_Y: 0.5,           // left sidewalk height
  PLATFORM_Y: 0.9        // right platform height
};

// Seeded random generator used by the level generator (seedable for tests via ?seed=).
const RNG = (() => {
  let s = (Math.random() * 4294967296) >>> 0;
  function next() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    seed(n) { s = (n >>> 0) || 1; },
    range: (a, b) => a + next() * (b - a),
    int: (a, b) => Math.floor(a + next() * (b - a + 1)),
    chance: p => next() < p,
    pick: arr => arr[Math.floor(next() * arr.length)],
    weighted(list) { // list of [weight, value]
      let total = 0;
      for (const it of list) total += Math.max(0, it[0]);
      let r = next() * total;
      for (const it of list) { r -= Math.max(0, it[0]); if (r <= 0) return it[1]; }
      return list[list.length - 1][1];
    }
  };
})();
if (QUERY.has('seed')) RNG.seed(parseInt(QUERY.get('seed'), 10) || 1);

// Minimal publish/subscribe bus so systems (missions, audio, effects) can react to gameplay events.
const Bus = (() => {
  const map = new Map();
  return {
    on(name, fn) { if (!map.has(name)) map.set(name, []); map.get(name).push(fn); },
    emit(name, data) { const l = map.get(name); if (l) for (let i = 0; i < l.length; i++) l[i](data); }
  };
})();

// Persistent save data. Every storage access is wrapped so private mode or blocked storage never crashes the game.
const Save = (() => {
  const KEY = 'dashdistrict.save.v1';
  const defaults = () => ({
    best: 0, coins: 0, mult: 1, runs: 0,
    sound: true, music: true,
    missions: null, tiers: {}, totals: {}
  });
  const num = (v, d) => (typeof v === 'number' && isFinite(v) && v >= 0 ? v : d);
  let data = defaults();
  function sanitize(obj) {
    const d = defaults();
    if (!obj || typeof obj !== 'object') return d;
    d.best = Math.floor(num(obj.best, 0));
    d.coins = Math.floor(num(obj.coins, 0));
    d.mult = clamp(Math.floor(num(obj.mult, 1)), 1, 30);
    d.runs = Math.floor(num(obj.runs, 0));
    d.sound = obj.sound !== false;
    d.music = obj.music !== false;
    d.missions = Array.isArray(obj.missions) ? obj.missions : null;
    d.tiers = obj.tiers && typeof obj.tiers === 'object' ? obj.tiers : {};
    d.totals = obj.totals && typeof obj.totals === 'object' ? obj.totals : {};
    return d;
  }
  function load() {
    try {
      const raw = window.localStorage ? localStorage.getItem(KEY) : null;
      data = raw ? sanitize(JSON.parse(raw)) : defaults();
    } catch (e) {
      data = defaults();
    }
  }
  function persist() {
    try {
      if (window.localStorage) localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  }
  load();
  return {
    get data() { return data; },
    save: persist,
    reload: load
  };
})();

// ==== TEXTURES ====
// Canvas texture factory. Every texture in the game is painted here with 2D canvas code.

const Tex = (() => {
  const cache = new Map();
  let maxAniso = 1;
  const FONT_HEAVY = '"Arial Black", "Arial Rounded MT Bold", Impact, "Segoe UI Black", sans-serif';

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  // Create (or fetch from cache) a CanvasTexture painted by draw(ctx, w, h).
  function make(key, w, h, draw, opts) {
    if (cache.has(key)) return cache.get(key);
    opts = opts || {};
    const c = canvas(w, h);
    const g = c.getContext('2d');
    draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = opts.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
    t.wrapT = opts.clamp || opts.clampY ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
    t.anisotropy = opts.aniso === false ? 1 : maxAniso;
    if (opts.noMips) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
    if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
    cache.set(key, t);
    return t;
  }

  // ---------- drawing helpers ----------
  function rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function speckle(g, x0, y0, w, h, count, colors, rMin, rMax, alpha) {
    for (let i = 0; i < count; i++) {
      g.globalAlpha = alpha === undefined ? 1 : alpha * (0.5 + Math.random() * 0.5);
      g.fillStyle = colors[(Math.random() * colors.length) | 0];
      const r = rMin + Math.random() * (rMax - rMin);
      g.fillRect(x0 + Math.random() * w, y0 + Math.random() * h, r, r);
    }
    g.globalAlpha = 1;
  }
  function star(g, cx, cy, outer, inner, points, rot) {
    g.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = (rot === undefined ? -Math.PI / 2 : rot) + (i / (points * 2)) * TAU;
      const r = i % 2 === 0 ? outer : inner;
      const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  }
  function crown(g, cx, cy, s, fill, outline) {
    g.save();
    g.translate(cx, cy);
    g.beginPath();
    g.moveTo(-s, s * 0.5);
    g.lineTo(-s, -s * 0.35); g.lineTo(-s * 0.5, s * 0.05); g.lineTo(0, -s * 0.6);
    g.lineTo(s * 0.5, s * 0.05); g.lineTo(s, -s * 0.35); g.lineTo(s, s * 0.5);
    g.closePath();
    g.lineJoin = 'round';
    if (outline) { g.strokeStyle = outline; g.lineWidth = s * 0.28; g.stroke(); }
    g.fillStyle = fill; g.fill();
    for (const [px, py] of [[-s, -s * 0.35], [0, -s * 0.6], [s, -s * 0.35]]) {
      g.beginPath(); g.arc(px, py, s * 0.16, 0, TAU);
      if (outline) { g.lineWidth = s * 0.12; g.stroke(); }
      g.fill();
    }
    g.restore();
  }
  function heart(g, cx, cy, s, fill, outline) {
    g.save(); g.translate(cx, cy);
    g.beginPath();
    g.moveTo(0, s * 0.35);
    g.bezierCurveTo(-s * 1.1, -s * 0.3, -s * 0.5, -s * 1.0, 0, -s * 0.45);
    g.bezierCurveTo(s * 0.5, -s * 1.0, s * 1.1, -s * 0.3, 0, s * 0.35);
    g.closePath();
    if (outline) { g.strokeStyle = outline; g.lineWidth = s * 0.25; g.lineJoin = 'round'; g.stroke(); }
    g.fillStyle = fill; g.fill();
    g.restore();
  }
  function bolt(g, cx, cy, s, fill, outline) {
    g.save(); g.translate(cx, cy);
    g.beginPath();
    g.moveTo(s * 0.15, -s); g.lineTo(-s * 0.55, s * 0.1); g.lineTo(-s * 0.05, s * 0.1);
    g.lineTo(-s * 0.25, s); g.lineTo(s * 0.55, -s * 0.15); g.lineTo(s * 0.05, -s * 0.15);
    g.closePath();
    g.lineJoin = 'round';
    if (outline) { g.strokeStyle = outline; g.lineWidth = s * 0.2; g.stroke(); }
    g.fillStyle = fill; g.fill();
    g.restore();
  }
  function splat(g, cx, cy, r, color) {
    g.fillStyle = color;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * TAU, d = r * (1 + Math.random() * 0.9), rr2 = r * (0.1 + Math.random() * 0.22);
      g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rr2, 0, TAU); g.fill();
    }
  }
  function scribble(g, x, y, w, h, color, width) {
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(x, y + h * Math.random());
    for (let i = 1; i <= 6; i++) {
      const px = x + (w * i) / 6;
      g.quadraticCurveTo(px - w / 12, y + Math.random() * h, px, y + Math.random() * h);
    }
    g.stroke();
  }

  // Bubble-letter graffiti word: extrusion, dark outline, coloured rim, gradient fill, glossy shine, drips.
  function bubbleWord(g, text, cx, cy, size, c, rot, sx) {
    const W = g.canvas.width, H = g.canvas.height;
    const apply = ctx => {
      ctx.translate(cx, cy); ctx.rotate(rot || 0); ctx.scale(sx || 0.8, 1);
      ctx.font = `900 ${size}px ${FONT_HEAVY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    };
    g.save(); apply(g);
    const tw = g.measureText(text).width;
    g.strokeStyle = c.shadow; g.fillStyle = c.shadow; g.lineWidth = size * 0.25;
    for (let i = 1; i <= 7; i++) { g.strokeText(text, i * size * 0.014, i * size * 0.018); g.fillText(text, i * size * 0.014, i * size * 0.018); }
    g.strokeStyle = c.outline; g.lineWidth = size * 0.25; g.strokeText(text, 0, 0);
    g.strokeStyle = c.rim; g.lineWidth = size * 0.12; g.strokeText(text, 0, 0);
    // drips
    g.fillStyle = c.rim;
    for (let i = 0; i < 5; i++) {
      const dx = (Math.random() - 0.5) * tw * 0.8, len = size * (0.12 + Math.random() * 0.3), wd = size * (0.04 + Math.random() * 0.03);
      rr(g, dx - wd / 2, size * 0.3, wd, len, wd / 2); g.fill();
      g.beginPath(); g.arc(dx, size * 0.3 + len, wd * 0.75, 0, TAU); g.fill();
    }
    g.restore();
    const off = canvas(W, H), o = off.getContext('2d');
    o.save(); apply(o);
    const grd = o.createLinearGradient(0, -size * 0.45, 0, size * 0.45);
    grd.addColorStop(0, c.top); grd.addColorStop(0.55, c.mid || c.top); grd.addColorStop(1, c.bot);
    o.fillStyle = grd; o.fillText(text, 0, 0);
    o.globalCompositeOperation = 'source-atop';
    o.fillStyle = 'rgba(255,255,255,0.5)';
    o.beginPath(); o.ellipse(-tw * 0.05, -size * 0.24, tw * 0.55, size * 0.13, 0, 0, TAU); o.fill();
    o.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 6; i++) { o.beginPath(); o.ellipse(-tw * 0.4 + (i / 5) * tw * 0.8, -size * 0.22, size * 0.05, size * 0.025, -0.4, 0, TAU); o.fill(); }
    o.fillStyle = 'rgba(0,0,0,0.12)';
    o.fillRect(-tw, size * 0.18, tw * 2, size);
    o.restore();
    g.drawImage(off, 0, 0);
  }

  // ---------- track atlas: bed (top half) + sleeper wood (below) ----------
  function trackAtlas() {
    return make('track', 512, 1024, (g) => {
      g.fillStyle = '#6f4b37';
      g.fillRect(0, 0, 512, 1024);
      // bed: x 0..512, y 0..512, seamless vertically
      speckle(g, 0, 0, 512, 512, 5200, ['#5f3f2e', '#7c5640', '#83604a', '#5a3a2a'], 1, 3, 0.8);
      const laneU = [0.174, 0.5, 0.826];
      for (const u of laneU) {
        const cx = u * 512, half = 0.155 * 512;
        const grd = g.createLinearGradient(cx - half, 0, cx + half, 0);
        grd.addColorStop(0, 'rgba(70,45,32,0)'); grd.addColorStop(0.15, 'rgba(70,45,32,0.55)');
        grd.addColorStop(0.85, 'rgba(70,45,32,0.55)'); grd.addColorStop(1, 'rgba(70,45,32,0)');
        g.fillStyle = grd; g.fillRect(cx - half, 0, half * 2, 512);
        for (let i = 0; i < 1500; i++) {
          const x = cx + (Math.random() * 2 - 1) * half * 0.95, y = Math.random() * 512, s = 1.0 + Math.random() * 2.2;
          const tone = 74 + Math.random() * 40;
          for (const yy of [y, y - 512, y + 512]) {
            if (yy < -s || yy > 512 + s) continue;
            g.fillStyle = `rgb(${tone + 22 | 0},${tone + 2 | 0},${tone - 16 | 0})`;
            g.beginPath(); g.ellipse(x, yy, s, s * 0.75, i, 0, TAU); g.fill();
            g.fillStyle = 'rgba(255,236,214,0.10)';
            g.beginPath(); g.ellipse(x - s * 0.25, yy - s * 0.3, s * 0.45, s * 0.3, 0, 0, TAU); g.fill();
          }
        }
        g.fillStyle = 'rgba(40,24,16,0.18)';
        g.fillRect(cx - 6, 0, 12, 512);
      }
      // wood: x 0..512, y 576..704
      const wy = 576, wh = 128;
      const grd = g.createLinearGradient(0, wy, 0, wy + wh);
      grd.addColorStop(0, '#9a6640'); grd.addColorStop(0.5, '#845232'); grd.addColorStop(1, '#6c4127');
      g.fillStyle = grd; g.fillRect(0, wy, 512, wh);
      for (let i = 0; i < 46; i++) {
        g.strokeStyle = Math.random() < 0.5 ? 'rgba(60,32,18,0.45)' : 'rgba(176,126,84,0.3)';
        g.lineWidth = 1 + Math.random() * 2.5;
        const y = wy + Math.random() * wh;
        g.beginPath(); g.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x * 0.04 + i) * 2.5);
        g.stroke();
      }
      speckle(g, 0, wy, 512, wh, 600, ['#4e2c18', '#a4744e'], 1, 2, 0.6);
    });
  }

  // ---------- walkway atlas: sidewalk tiles, platform, curb face, trim ----------
  // tiles    : x 0..256,   y 0..256   (2 x 2 tiles)
  // platform : x 256..512, y 0..256   (yellow safety line at the left edge = track side)
  // curb     : x 0..512,   y 272..400
  // trim     : x 0..512,   y 416..512 (cream coping colour)
  function walksAtlas() {
    return make('walks', 512, 512, (g) => {
      const t = 128;
      for (let iy = 0; iy < 2; iy++) for (let ix = 0; ix < 2; ix++) {
        const tone = Math.random() * 14;
        g.fillStyle = `rgb(${228 - tone | 0},${172 - tone | 0},${130 - tone | 0})`;
        g.fillRect(ix * t, iy * t, t, t);
        const grd = g.createLinearGradient(ix * t, iy * t, ix * t + t, iy * t + t);
        grd.addColorStop(0, 'rgba(255,235,210,0.25)'); grd.addColorStop(1, 'rgba(120,70,40,0.12)');
        g.fillStyle = grd; g.fillRect(ix * t, iy * t, t, t);
      }
      speckle(g, 0, 0, 256, 256, 1400, ['#b8805c', '#f0c39c', '#c99070'], 1, 2.5, 0.55);
      g.fillStyle = '#9a6446';
      g.fillRect(0, 0, 256, 3); g.fillRect(0, t - 2, 256, 4); g.fillRect(0, 0, 3, 256); g.fillRect(t - 2, 0, 4, 256);
      g.fillStyle = 'rgba(255,230,200,0.35)';
      g.fillRect(3, 3, 253, 2); g.fillRect(3, t + 2, 253, 2);
      // platform

  // ---------- obstacles ----------
  function stripes() {
    return make('stripes', 256, 64, (g, w, h) => {
      g.fillStyle = '#f4f1ec'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#e2302b';
      for (let x = -h; x < w + h; x += 64) {
        g.beginPath(); g.moveTo(x, h); g.lineTo(x + 32, h); g.lineTo(x + 32 + h, 0); g.lineTo(x + h, 0); g.closePath(); g.fill();
      }
      const grd = g.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, 'rgba(255,255,255,0.35)'); grd.addColorStop(0.5, 'rgba(255,255,255,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.25)');
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(60,20,20,0.55)'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);

  function chevron() {
    return make('chevron', 256, 256, (g, w, h) => {
      g.fillStyle = '#f6f3ee'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#e1322c';
      const step = 64;
      for (let y = -w; y < h + w; y += step) {
        g.beginPath();
        g.moveTo(0, y); g.lineTo(w / 2, y - w * 0.35); g.lineTo(w, y);
        g.lineTo(w, y + step / 2); g.lineTo(w / 2, y + step / 2 - w * 0.35); g.lineTo(0, y + step / 2);
        g.closePath(); g.fill();
      }
      const grd = g.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, 'rgba(255,255,255,0.25)'); grd.addColorStop(1, 'rgba(0,0,0,0.18)');
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#3a2a2a'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
    }, { clamp: true });
  }

  function ramp() {
    return make('ramp', 128, 256, (g, w, h) => {
      const grd = g.createLinearGradient(0, 0, w, 0);
      grd.addColorStop(0, '#8d949e'); grd.addColorStop(0.5, '#b4bac2'); grd.addColorStop(1, '#8d949e');
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.fillStyle = 'rgba(70,74,82,0.55)';
      for (let y = 6; y < h; y += 14) for (let x = 20; x < w - 20; x += 14) {
        g.save(); g.translate(x + ((y / 14) % 2) * 7, y); g.rotate(0.6); g.fillRect(-4, -1, 8, 2.5); g.restore();
      }
      const edge = 16;
      for (const x0 of [0, w - edge]) {
        g.fillStyle = '#f3c21b'; g.fillRect(x0, 0, edge, h);
        g.fillStyle = '#1d1d22';
        for (let y = -edge; y < h; y += 24) {
          g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + edge, y + edge); g.lineTo(x0 + edge, y + edge + 10); g.lineTo(x0, y + 10); g.closePath(); g.fill();
        }
      }
    });
  }

  // Train texture atlas (1024x512): side x0..1024 y0..256 | front x0..196 y256..512 | roof x196..1024 y256..384 | dark x196..1024 y384..512
  function train(scheme) {
    const S = scheme === 'red'
      ? { top: '#f07868', body: '#d93d43', low: '#a8222f', stripe: '#fbf3ea', accent: '#ffcf3d', num: '12' }
      : { top: '#5f8fea', body: '#4370d6', low: '#2a49a8', stripe: '#eef3fb', accent: '#ff5a4f', num: '07' };
    return make('train-' + scheme, 1024, 512, (g) => {
      let grd = g.createLinearGradient(0, 0, 0, 256);
      grd.addColorStop(0, '#cfd8ea'); grd.addColorStop(0.05, S.top); grd.addColorStop(0.12, S.body); grd.addColorStop(0.62, S.body);
      grd.addColorStop(0.63, S.stripe); grd.addColorStop(0.73, S.stripe); grd.addColorStop(0.74, S.low); grd.addColorStop(1, S.low);
      g.fillStyle = grd; g.fillRect(0, 0, 1024, 256);
      g.fillStyle = S.accent; g.fillRect(0, 194, 1024, 6);
      const drawWindow = (x, y, w, h) => {
        rr(g, x, y, w, h, 14);

        wg.addColorStop(0, '#3a5c9c'); wg.addColorStop(0.45, '#15234e'); wg.addColorStop(1, '#263f78');
        g.fillStyle = wg; g.fill();

        g.fillStyle = 'rgba(200,226,255,0.16)';
        g.beginPath(); g.moveTo(x + w * 0.55, y + h); g.lineTo(x + w * 0.8, y); g.lineTo(x + w * 0.87, y); g.lineTo(x + w * 0.62, y + h); g.fill();
        g.fillStyle = 'rgba(255,190,140,0.18)';
        g.fillRect(x, y + h * 0.72, w, h * 0.28);
        g.restore();
        g.strokeStyle = 'rgba(230,238,255,0.9)'; g.lineWidth = 5; rr(g, x, y, w, h, 14); g.stroke();
      };
      const doors = [150, 690];
      for (let x = 22; x < 1000; x += 136) {
        if (doors.some(d => x + 118 > d - 12 && x < d + 118)) continue;

        drawWindow(d + 11, 40, 35, 90); drawWindow(d + 62, 40, 35, 90);

      }
      g.fillStyle = 'rgba(255,255,255,0.92)'; g.font = 'bold 30px Arial, sans-serif'; g.fillText(S.num, 900, 232);
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 250, 1024, 6);
      // front
      const fx = 0, fy = 256, fw = 196, fh = 256;
      grd = g.createLinearGradient(0, fy, 0, fy + fh);
      grd.addColorStop(0, S.top); grd.addColorStop(0.12, S.body); grd.addColorStop(0.7, S.body); grd.addColorStop(0.71, S.stripe);
      grd.addColorStop(0.79, S.stripe); grd.addColorStop(0.8, S.low); grd.addColorStop(1, S.low);
      g.fillStyle = grd; g.fillRect(fx, fy, fw, fh);
      rr(g, fx + 16, fy + 40, fw - 32, 94, 18);
      const ws = g.createLinearGradient(fx, fy + 40, fx + fw, fy + 134);
      ws.addColorStop(0, '#46679f'); ws.addColorStop(0.5, '#121c40'); ws.addColorStop(1, '#2a4378');
      g.fillStyle = ws; g.fill();
      g.strokeStyle = '#e3e9f6'; g.lineWidth = 6; g.stroke();
      g.fillStyle = '#e3e9f6'; g.fillRect(fx + fw / 2 - 3, fy + 40, 6, 94);
      g.fillStyle = 'rgba(200,225,255,0.28)';
      g.beginPath(); g.moveTo(fx + 30, fy + 130); g.lineTo(fx + 60, fy + 44); g.lineTo(fx + 82, fy + 44); g.lineTo(fx + 52, fy + 130); g.fill();
      g.fillStyle = '#16120e'; rr(g, fx + 44, fy + 12, fw - 88, 22, 4); g.fill();
      g.fillStyle = '#ffb02e'; g.font = 'bold 15px Arial, sans-serif'; g.textAlign = 'center';
      g.fillText('DASH LINE', fx + fw / 2, fy + 29); g.textAlign = 'left';
      for (const hx of [fx + 38, fx + fw - 38]) {
        const lg = g.createRadialGradient(hx, fy + 162, 2, hx, fy + 162, 18);
        lg.addColorStop(0, '#fffbe8'); lg.addColorStop(0.5, '#ffe7a0'); lg.addColorStop(1, '#c79a3a');
        g.fillStyle = lg; g.beginPath(); g.arc(hx, fy + 162, 16, 0, TAU); g.fill();
        g.strokeStyle = '#2a2a33'; g.lineWidth = 4; g.stroke();
      }
      g.fillStyle = '#ff4136'; g.fillRect(fx + 72, fy + 156, 12, 12); g.fillRect(fx + fw - 84, fy + 156, 12, 12);
      g.fillStyle = '#2a2a33'; rr(g, fx + 70, fy + 216, fw - 140, 30, 6); g.fill();

      for (const vx of [rx + 120, rx + 520]) {
        g.fillStyle = '#7d8696'; rr(g, vx, ry + 34, 150, 60, 8); g.fill();
        g.fillStyle = '#5d6676';
        for (let k = 0; k < 6; k++) g.fillRect(vx + 12 + k * 23, ry + 42, 10, 44);

        for (let i = 0; i < 5; i++) g.fillRect(1300 + i * 70, 30, 36, 200);

  // ---------- building facades (512 x 512 tile = 4 window columns x 4 floors) ----------
  const FACADES = [
    { base: '#f3a3a8', dark: '#d9858e', trim: '#fff1e8', shutter: '#3fae8f', style: 'balcony' },
    { base: '#f6a75e', dark: '#dc8a44', trim: '#fff0d8', shutter: '#e0583a', style: 'arch' },
    { base: '#f4ddb6', dark: '#dcc096', trim: '#ffffff', shutter: '#5f8fd8', style: 'square' },
    { base: '#db7a5c', dark: '#b85f45', trim: '#f8e6d2', shutter: '#2f6f6a', style: 'brick' },
    { base: '#f7c296', dark: '#dfa577', trim: '#fffaf0', shutter: '#3a86e8', style: 'awning' },
    { base: '#e8a6c8', dark: '#cc87ac', trim: '#fff2fa', shutter: '#7b4fd0', style: 'balcony' }
  ];
  function facade(v) {
    const F = FACADES[v % FACADES.length];
    return make('facade' + v, 512, 512, (g, w, h) => {
      let grd = g.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, F.base); grd.addColorStop(1, F.dark);
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      speckle(g, 0, 0, w, h, 3000, ['rgba(255,255,255,0.35)', 'rgba(90,40,30,0.25)'], 1, 2.5, 0.6);
      if (F.style === 'brick') {
        g.fillStyle = 'rgba(120,50,35,0.28)';
        for (let y = 0; y < h; y += 14) { g.fillRect(0, y, w, 2); for (let x = (y / 14) % 2 ? 0 : 16; x < w; x += 32) g.fillRect(x, y, 2, 14); }
      }
      // cornice band at the top of each floor (the top one doubles as the roof cornice)
      for (let fy = 0; fy < 4; fy++) {
        const y = fy * 128;
        g.fillStyle = F.trim; g.fillRect(0, y, w, 20);
        g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, y + 20, w, 5);
        g.fillStyle = 'rgba(0,0,0,0.12)'; for (let x = 4; x < w; x += 16) g.fillRect(x, y + 12, 8, 6);
      }
      for (let fy = 0; fy < 4; fy++) {
        for (let cx = 0; cx < 4; cx++) {
          const x = cx * 128 + 30, y = fy * 128 + 38, ww = 68, wh = 76;
          const lit = Math.random() < 0.22;

// Geometry helpers: placement, vertex painting, merging, rounded boxes, capsules and limbs.

  const _e = new THREE.Euler();
  const _p = new THREE.Vector3();
  const _s = new THREE.Vector3();

  // Clone a geometry and transform it. o: {x,y,z, rx,ry,rz, s, sx,sy,sz}

  { name: 'high', pr: 1.5, shadow: 1024, fogFar: 235 },
  { name: 'ultra', pr: 2.0, shadow: 2048, fogFar: 235 }
];

const Gfx = {
  renderer: null, scene: null, camera: null, sun: null, hemi: null, sky: null,
  width: 1, height: 1, aspect: 1,
  quality: 3,
  camBack: 6.4, camUp: 3.3, baseFov: 62,

  init() {
    const canvas = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: !(IS_MOBILE && window.devicePixelRatio >= 2),
      powerPreference: 'high-performance', stencil: false, alpha: false
    });
    renderer.setClearColor(PALETTE.fog, 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = true;
    this.renderer = renderer;
    Tex.setMaxAniso(renderer.capabilities.getMaxAnisotropy());

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(PALETTE.fog, 48, 235);
    this.scene = scene;

    const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 420);
    camera.position.set(0, 3.3, 6.4);
    this.camera = camera;
    scene.add(camera);

    const hemi = new THREE.HemisphereLight(0xdde4ff, 0xf6b07a, 0.6);
    scene.add(hemi);
    this.hemi = hemi;

    const sun = new THREE.DirectionalLight(0xffd29a, 0.86);
    sun.position.set(-9, 22, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera;
    sc.left = -15; sc.right = 15; sc.top = 32; sc.bottom = -26; sc.near = 1; sc.far = 95;
    sun.shadow.bias = -0.0008;
    sun.shadow.normalBias = 0.03;
    scene.add(sun);
    scene.add(sun.target);
    this.sun = sun;

    this.sky = this.buildSky();
    scene.add(this.sky);
    this.buildHorizon();

    const q = parseInt(QUERY.get('q'), 10);
    this.quality = isFinite(q) ? clamp(q, 0, 3) : (IS_MOBILE ? 2 : 3);
    this.applyQuality(true);
    this.resize();
  },

  buildSky() {
    const geo = new THREE.SphereGeometry(300, 32, 16);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        cTop: { value: new THREE.Color(PALETTE.skyTop) },
        cMid: { value: new THREE.Color(PALETTE.skyMid) },
        cLow: { value: new THREE.Color(PALETTE.skyLow) },
        cHor: { value: new THREE.Color(PALETTE.skyHorizon) },
        cSun: { value: new THREE.Color(PALETTE.sun) },
        cFog: { value: new THREE.Color(PALETTE.fog) },
        sunDir: { value: new THREE.Vector3(0.12, 0.06, -1).normalize() }
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = position;
          vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          gl_Position = p.xyww;
        }`,
      fragmentShader: `
        uniform vec3 cTop, cMid, cLow, cHor, cSun, cFog;
        uniform vec3 sunDir;
        varying vec3 vDir;
        void main() {
          vec3 d = normalize(vDir);
          float h = d.y;
          vec3 col = mix(cHor, cLow, smoothstep(0.0, 0.10, h));
          col = mix(col, cMid, smoothstep(0.06, 0.24, h));
          col = mix(col, cTop, smoothstep(0.2, 0.62, h));
          float s = max(dot(d, sunDir), 0.0);
          col += cSun * (pow(s, 9.0) * 0.16 + pow(s, 70.0) * 0.28 + pow(s, 900.0) * 0.55);
          col = mix(col, cFog, smoothstep(0.02, -0.04, h));
          gl_FragColor = vec4(col, 1.0);
        }`
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = -100;
    mesh.frustumCulled = false;
    return mesh;
  },

  // Hazy city skyline (two cylinder layers) and soft sunset clouds; both follow the camera like the sky.
  buildHorizon() {
    this.horizon = new THREE.Group();
    const layers = [
      { tex: Tex.skyline(0), r: 335, h: 82, rep: 2.5, order: -90 },
      { tex: Tex.skyline(1), r: 305, h: 58, rep: 3.5, order: -80 }
    ];
    this.skylines = [];
    for (const L of layers) {
      L.tex.repeat.set(L.rep, 1);
      const geo = new THREE.CylinderGeometry(L.r, L.r, L.h, 64, 1, true);
      const mat = new THREE.MeshBasicMaterial({ map: L.tex, transparent: true, depthWrite: false, fog: false, side: THREE.BackSide });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = L.order;
      mesh.frustumCulled = false;
      mesh.userData.h = L.h;
      this.horizon.add(mesh);
      this.skylines.push(mesh);
    }
    const cloudMat = new THREE.SpriteMaterial({ map: Tex.cloud(), transparent: true, depthWrite: false, fog: false, opacity: 0.92 });
    const clouds = [[-0.95, 0.16, 1.0], [-0.55, 0.26, 1.25], [-0.15, 0.12, 0.8], [0.3, 0.22, 1.1], [0.72, 0.14, 0.95], [1.1, 0.3, 1.3], [-1.35, 0.33, 1.15]];
    for (const [az, el, sc] of clouds) {
      const sp = new THREE.Sprite(cloudMat);
      const d = 280;
      sp.position.set(Math.sin(az) * d * Math.cos(el), Math.sin(el) * d, -Math.cos(az) * d * Math.cos(el));
      sp.scale.set(78 * sc, 34 * sc, 1);
      sp.renderOrder = -95;
      this.horizon.add(sp);
    }
    this.scene.add(this.horizon);
  },

  applyQuality(initial) {
    const preset = QUALITY[this.quality];
    const pr = Math.min(window.devicePixelRatio || 1, preset.pr);
    this.renderer.setPixelRatio(pr);
    const shadows = preset.shadow > 0;
    const sun = this.sun;
    if (shadows) {
      if (sun.shadow.mapSize.x !== preset.shadow) {
        sun.shadow.mapSize.set(preset.shadow, preset.shadow);
        if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
      }
    }
    const changed = sun.castShadow !== shadows || this.renderer.shadowMap.enabled !== shadows;
    sun.castShadow = shadows;
    this.renderer.shadowMap.enabled = shadows;
    this.scene.fog.far = preset.fogFar;
    if (changed && !initial) {
      this.scene.traverse(o => {
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; });
      });
    }
    if (!initial) this.resize();
  },

  setQuality(q) {
    q = clamp(q, 0, 3);
    if (q === this.quality) return;
    this.quality = q;
    this.applyQuality(false);
  },

  // Field of view and camera distance adapt to the screen shape so all 3 lanes stay visible.
  resize() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    this.width = w; this.height = h; this.aspect = w / h;
    const a = this.aspect;
    // portrait (a < 1): pull back, raise and widen so the side lanes stay on screen
    const port = clamp((1 - a) / 0.55, 0, 1);
    let fov;
    if (a >= 1.6) fov = 54;
    else if (a >= 1) fov = lerp(62, 54, (a - 1) / 0.6);
    else fov = lerp(62, 76, port);
    this.baseFov = fov;
    this.camBack = a >= 1 ? lerp(4.8, 5.4, clamp((a - 1) / 0.8, 0, 1)) : lerp(4.8, 6.3, port);
    this.camUp = a >= 1 ? lerp(2.95, 3.2, clamp((a - 1) / 0.8, 0, 1)) : lerp(2.95, 3.55, port);
    this.camera.aspect = a;
    this.camera.fov = fov;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h, false);
  },

  // Keep the sun and its shadow frustum centred around the runner.
  follow(x, z) {
    this.sun.position.set(x - 9, 22, z + 14);
    this.sun.target.position.set(x, 0, z - 14);
    this.sky.position.copy(this.camera.position);
    const c = this.camera.position;
    this.horizon.position.set(c.x, 0, c.z);
    for (const m of this.skylines) m.position.y = c.y * 0.92 + m.userData.h / 2 - 9;
  },

  render() {
    this.renderer.render(this.scene, this.camera);
  }
};

// ==== WORLD ====
// Endless world. A segment with index k spans z in [-(k+1)*SEG_LEN, -k*SEG_LEN]. Segments behind the runner jump to
// the front and are re-decorated (graffiti variant, bushes, buildings, palms, benches, signs, banners, bridges).

const World = {
  segs: [],
  count: 8,
  mats: {},
  geos: {},
  inst: {},
  pools: { building: [], banner: [], sign: [], bridge: [] },
  glow: null,

  init() {
    const L = CFG.SEG_LEN, B = CFG.BED_HALF;
    const m = this.mats, g = this.geos;

    // ---------- materials ----------
    m.track = new THREE.MeshLambertMaterial({ map: Tex.trackAtlas() });
    m.rail = new THREE.MeshPhongMaterial({ color: 0x6d7078, specular: 0x8a8f99, shininess: 30 });
    m.bright = new THREE.MeshBasicMaterial({ vertexColors: true });
    m.walks = new THREE.MeshLambertMaterial({ map: Tex.walksAtlas() });
    m.walls = [0, 1, 2, 3].map(v => new THREE.MeshLambertMaterial({ map: Tex.graffiti(v) }));
    m.props = new THREE.MeshLambertMaterial({ vertexColors: true });
    m.facades = Tex.FACADES.map((f, i) => new THREE.MeshLambertMaterial({ map: Tex.facade(i) }));
    const stoneTex = Tex.stone();
    m.stone = new THREE.MeshLambertMaterial({ map: stoneTex });
    m.banner = new THREE.MeshLambertMaterial({ map: Tex.banner(), alphaTest: 0.5, side: THREE.DoubleSide });
    m.sign = new THREE.MeshLambertMaterial({ map: Tex.metroSign(), emissive: 0x1a2a55 });
    m.palm = new THREE.MeshLambertMaterial({ map: Tex.palm(), alphaTest: 0.45, side: THREE.DoubleSide });

    // ---------- shared segment geometry ----------
    g.ground = this.buildGround();
    g.rails = this.buildRails();
    g.bright = this.buildBright();
    g.walks = this.buildWalks();
    g.wall = new THREE.PlaneGeometry(L, 4.0);
    g.wall.rotateY(Math.PI / 2);
    g.wall.translate(-B - 5.3, CFG.WALK_Y + 2.0, 0);
    g.props = [0, 1, 2, 3].map(v => this.buildProps(v));

    // ---------- instanced decorations ----------
    const palmGeo = this.buildPalm();
    const palm = new THREE.InstancedMesh(palmGeo, m.palm, this.count * 3);
    palm.castShadow = true;
    palm.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: m.palm.map, alphaTest: 0.45 });
    const bench = new THREE.InstancedMesh(this.buildBench(), m.props, this.count);
    const gantry = new THREE.InstancedMesh(this.buildGantry(), m.props, this.count);
    gantry.castShadow = true;
    for (const im of [palm, bench, gantry]) {
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      im.frustumCulled = false;
      Gfx.scene.add(im);
    }
    this.inst = { palm, bench, gantry };
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._p = new THREE.Vector3(); this._s = new THREE.Vector3(); this._e = new THREE.Euler();

    // ---------- lamp glows: one Points object for every lamp ----------
    const glowGeo = new THREE.BufferGeometry();
    glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.count * 2 * 3), 3));
    const glowMat = new THREE.PointsMaterial({ map: Tex.glow(), size: 2.6, sizeAttenuation: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd9a0 });
    this.glow = new THREE.Points(glowGeo, glowMat);
    this.glow.frustumCulled = false;
    Gfx.scene.add(this.glow);

    // ---------- overhead wires (follow the runner; uniform along z) ----------
    this.wires = this.buildWires();
    Gfx.scene.add(this.wires);

    // building prefabs: [width along z, depth, floors]
    this.prefabs = [];
    for (let f = 0; f < Tex.FACADES.length; f++) {
      for (const dims of [[10, 7, 3], [12, 7, 4], [14, 8, 5], [11, 7, 6]]) this.prefabs.push({ facade: f, geo: this.buildBuilding(dims[0], dims[1], dims[2]), w: dims[0], floors: dims[2] });
    }
    g.banner = new THREE.PlaneGeometry(1.25, 2.5);
    g.bracket = Geo.paint(new THREE.BoxGeometry(1.5, 0.08, 0.08), 0x2b2b33);
    g.signBoard = new THREE.BoxGeometry(5.4, 1.35, 0.14);
    this.remapBoxFront(g.signBoard);
    g.signPosts = Geo.merge([
      Geo.paint(Geo.place(new THREE.CylinderGeometry(0.08, 0.08, 4.8, 8), { x: -2.1, y: 2.4 }), 0x2b2b33),
      Geo.paint(Geo.place(new THREE.CylinderGeometry(0.08, 0.08, 4.8, 8), { x: 2.1, y: 2.4 }), 0x2b2b33)
    ]);
    g.bridge = this.buildBridge();

    for (let i = 0; i < this.count; i++) {
      const seg = new THREE.Group();
      const add = (geo, mat, shadow) => {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.receiveShadow = !!shadow;
        mesh.matrixAutoUpdate = false;
        mesh.updateMatrix();
        seg.add(mesh);
        return mesh;
      };
      add(g.ground, m.track, true);
      add(g.rails, m.rail, false);
      add(g.bright, m.bright, false);
      add(g.walks, m.walks, true);
      seg.userData.wall = add(g.wall, m.walls[0], true);
      seg.userData.props = add(g.props[0], m.props, true);
      seg.userData.index = 0;
      seg.userData.deco = [];
      seg.userData.slot = i;
      Gfx.scene.add(seg);
      this.segs.push(seg);
    }
    this.reset();
  },

  // ---------- geometry builders ----------
  // Bed (one quad per texture tile so the atlas can repeat) + sleepers mapped to the wood region.
  buildGround() {
    const L = CFG.SEG_LEN, B = CFG.BED_HALF;
    const parts = [];
    const tile = 8;
    for (let z = -L / 2; z < L / 2 - 1e-6; z += tile) {
      const q = new THREE.PlaneGeometry(B * 2, tile);
      q.rotateX(-Math.PI / 2);
      q.translate(0, -0.14, z + tile / 2);
      const uv = q.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i), 0.5 + 0.002 + uv.getY(i) * 0.496);
      parts.push(q);
    }
    const box = new THREE.BoxGeometry(2.3, 0.16, 0.36);
    const buv = box.attributes.uv;
    for (let i = 0; i < buv.count; i++) buv.setXY(i, buv.getX(i), 0.3828 + buv.getY(i) * 0.1094);
    const step = 1.25;
    for (const lx of CFG.LANE_X) {
      for (let z = -L / 2 + step / 2; z < L / 2; z += step) {
        parts.push(Geo.place(box, { x: lx + (Math.random() - 0.5) * 0.06, y: -0.08, z, ry: (Math.random() - 0.5) * 0.03 }));
      }
    }
    return Geo.merge(parts);
  },

  buildRails() {
    const L = CFG.SEG_LEN, parts = [];
    const flange = new THREE.BoxGeometry(0.22, 0.04, L), web = new THREE.BoxGeometry(0.05, 0.11, L), head = new THREE.BoxGeometry(0.11, 0.05, L);
    for (const lx of CFG.LANE_X) for (const side of [-0.72, 0.72]) {
      const x = lx + side;
      parts.push(Geo.place(flange, { x, y: 0.02 }), Geo.place(web, { x, y: 0.095 }), Geo.place(head, { x, y: 0.165 }));
    }
    return Geo.merge(parts);
  },

  // Always-bright parts (no lighting): polished rail tops and lamp lanterns.
  buildBright() {
    const L = CFG.SEG_LEN, parts = [];
    const top = new THREE.PlaneGeometry(0.09, L);
    top.rotateX(-Math.PI / 2);
    for (const lx of CFG.LANE_X) for (const side of [-0.72, 0.72]) parts.push(Geo.paint(Geo.place(top, { x: lx + side, y: 0.191 }), 0xeef2f7));
    for (const lz of [-L / 4, L / 4]) {
      parts.push(Geo.paint(Geo.place(new THREE.CylinderGeometry(0.19, 0.15, 0.42, 6), { x: -5.0, y: 4.18, z: lz }), 0xfff0c0));
    }
    return Geo.merge(parts);
  },

  // Sidewalk top + curb, platform top + face, all mapped into the walkway atlas (one quad per tile).
  buildWalks() {
    const L = CFG.SEG_LEN, B = CFG.BED_HALF, W = CFG.WALK_Y, P = CFG.PLATFORM_Y;
    const parts = [];
    const quad = (w, h, u0, v0, u1, v1, place) => {
      const q = new THREE.PlaneGeometry(w, h);
      const uv = q.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, lerp(u0, u1, uv.getX(i)), lerp(v0, v1, uv.getY(i)));
      parts.push(Geo.place(q, place));
    };
    const e = 0.003;
    // sidewalk top: 5.3 wide, tiles 2.65 x 2.5
    for (let z = -L / 2; z < L / 2 - 1e-6; z += 2.5) for (let k = 0; k < 2; k++) {
      quad(2.65, 2.5, 0 + e, 0.5 + e, 0.5 - e, 1 - e, { x: -B - 1.325 - k * 2.65, y: W, z: z + 1.25, rx: -Math.PI / 2 });
    }
    // platform top: 4.2 wide, one tile per 5 units (track side = yellow line at u=0.5)
    for (let z = -L / 2; z < L / 2 - 1e-6; z += 5) quad(4.2, 5, 0.5 + e, 0.5 + e, 1 - e, 1 - e, { x: B + 2.1, y: P, z: z + 2.5, rx: -Math.PI / 2 });
    // curb faces
    for (let z = -L / 2; z < L / 2 - 1e-6; z += 5) {
      quad(5, W + 0.14, 0 + e, 0.219 + e, 1 - e, 0.469 - e, { x: -B, y: (W - 0.14) / 2, z: z + 2.5, ry: Math.PI / 2 });
      quad(5, P + 0.14, 0 + e, 0.219 + e, 1 - e, 0.469 - e, { x: B, y: (P - 0.14) / 2, z: z + 2.5, ry: -Math.PI / 2 });
    }
    return Geo.merge(parts);
  },

  // Fixed props of a segment: wall coping, lamp posts, lantern caps and bushes on the wall (4 bush layouts).
  buildProps(variant) {
    const L = CFG.SEG_LEN, B = CFG.BED_HALF, parts = [];
    const wallX = -B - 5.3, wallTop = CFG.WALK_Y + 4.0;
    parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.6, 0.28, L), { x: wallX - 0.1, y: wallTop + 0.14 }), 0xead2b6));
    parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.12, 0.12, L), { x: wallX + 0.24, y: wallTop - 0.02 }), 0xc9a48a));
    const strip = new THREE.PlaneGeometry(1, L);
    strip.rotateX(-Math.PI / 2);
    parts.push(Geo.paint(Geo.place(strip, { x: -17.5, y: 0.45, sx: 15.4 }), 0x6f8a4a));
    parts.push(Geo.paint(Geo.place(strip, { x: 8.95, y: CFG.PLATFORM_Y, sx: 1.3 }), 0xcfb19c));
    const black = 0x23242b;
    for (const lz of [-L / 4, L / 4]) {
      parts.push(Geo.paint(Geo.place(new THREE.CylinderGeometry(0.17, 0.22, 0.5, 10), { x: -5.0, y: CFG.WALK_Y + 0.25, z: lz }), black));
      parts.push(Geo.paint(Geo.place(new THREE.CylinderGeometry(0.06, 0.08, 3.5, 8), { x: -5.0, y: CFG.WALK_Y + 2.0, z: lz }), black));
      parts.push(Geo.paint(Geo.place(new THREE.CylinderGeometry(0.11, 0.11, 0.12, 8), { x: -5.0, y: 3.86, z: lz }), black));
      parts.push(Geo.paint(Geo.place(new THREE.ConeGeometry(0.28, 0.32, 6), { x: -5.0, y: 4.55, z: lz }), black));
      parts.push(Geo.paint(Geo.place(new THREE.SphereGeometry(0.06, 6, 4), { x: -5.0, y: 4.75, z: lz }), black));
    }
    const greens = [0x3f9b3a, 0x4fb040, 0x2f8a3a, 0x66bf4a];
    const ico = new THREE.IcosahedronGeometry(1, 1);
    let z = -L / 2 + 1 + variant * 0.7;
    let k = 0;
    while (z < L / 2 - 1) {
      const r = 0.7 + ((k * 37 + variant * 11) % 10) / 10 * 0.8;
      parts.push(Geo.paint(Geo.place(ico, { x: wallX - 0.6 - (k % 2) * 0.5, y: wallTop + 0.25 + r * 0.45, z, sx: r * 1.1, sy: r * 0.8, sz: r * 1.2 }), greens[(k + variant) % 4]));
      z += 1.6 + ((k * 13 + variant * 7) % 7) * 0.45;
      k++;
    }
    return Geo.merge(parts);
  },

  buildPalm() {
    const parts = [];
    const trunk = new THREE.CylinderGeometry(0.18, 0.3, 7.5, 8, 6, true);
    const pos = trunk.attributes.position, uv = trunk.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i), t = (y + 3.75) / 7.5;
      pos.setX(i, pos.getX(i) + Math.sin(t * 1.4) * 0.5);
      uv.setXY(i, uv.getX(i) * 0.25, uv.getY(i) * 3);
    }
    trunk.translate(0, 3.75, 0);
    trunk.computeVertexNormals();
    parts.push(trunk);
    const topX = Math.sin(1.4) * 0.5, topY = 7.4;
    const N = 9;
    for (let i = 0; i < N; i++) {
      const frond = new THREE.PlaneGeometry(1.7, 3.8, 1, 6);
      const fp = frond.attributes.position, fu = frond.attributes.uv;
      for (let k = 0; k < fp.count; k++) {
        const t = (fp.getY(k) + 1.9) / 3.8;
        fp.setY(k, t * 3.8);
        fp.setZ(k, -t * t * 2.0);
        fu.setXY(k, 0.25 + fu.getX(k) * 0.75, fu.getY(k));
      }
      frond.rotateX(-Math.PI / 2 + 0.35);
      frond.rotateY((i / N) * TAU + (i % 2) * 0.2);
      frond.translate(topX, topY, 0);
      parts.push(frond);
    }
    const g = Geo.merge(parts);
    g.computeBoundingSphere();
    return g;
  },

  buildBench() {
    const parts = [];
    const wood = 0xb5753f, metal = 0x2b2c33;
    for (let i = 0; i < 3; i++) parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.16, 0.06, 2.2), { x: 0.05 + i * 0.18, y: 0.48 }), wood));
    for (let i = 0; i < 2; i++) parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.05, 0.16, 2.2), { x: -0.08, y: 0.68 + i * 0.2, rz: 0.15 }), wood));
    for (const z of [-0.95, 0.95]) {
      parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.6, 0.06, 0.07), { x: 0.2, y: 0.43, z }), metal));
      parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.06, 0.45, 0.07), { x: 0.42, y: 0.22, z }), metal));
      parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.06, 0.95, 0.07), { x: -0.06, y: 0.47, z }), metal));
    }
    return Geo.merge(parts);
  },

  buildGantry() {
    const parts = [];
    const c = 0x3a3d46;
    for (const x of [-4.65, 4.65]) {
      parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.22, 9.9, 0.22), { x, y: 4.95 + (x > 0 ? CFG.PLATFORM_Y : CFG.WALK_Y) - 0.4 }), c));
    }
    parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(9.7, 0.26, 0.22), { y: 9.75 }), c));
    parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(9.7, 0.1, 0.12), { y: 9.35 }), c));
    for (const lx of CFG.LANE_X) parts.push(Geo.paint(Geo.place(new THREE.BoxGeometry(0.06, 0.8, 0.06), { x: lx, y: 9.0 }), 0x55585f));
    return Geo.merge(parts);
  },

  // Long thin dark boxes for the catenary wires (contact + messenger per lane, feeders on the sides).
  buildWires() {
    const parts = [];
    const len = 420;
    const box = new THREE.BoxGeometry(0.035, 0.035, len);
    for (const lx of CFG.LANE_X) {
      parts.push(Geo.place(box, { x: lx, y: 8.6, z: -len / 2 + 40 }));
      parts.push(Geo.place(box, { x: lx, y: 9.3, z: -len / 2 + 40 }));
    }
    for (const x of [-4.65, 4.65]) parts.push(Geo.place(box, { x, y: 9.6, z: -len / 2 + 40, sx: 1.4, sy: 1.4 }));
    const mesh = new THREE.Mesh(Geo.merge(parts), new THREE.MeshBasicMaterial({ color: 0x2a2630 }));
    mesh.frustumCulled = false;
    return mesh;
  },

  // Building box with a facade texture tiled per floor; the cornice cap reuses the cornice band of the texture.
  buildBuilding(w, d, floors) {
    const H = floors * 3.2;
    const box = new THREE.BoxGeometry(d, H, w);
    const uv = box.attributes.uv;
    const perFace = 4;
    const faceDims = [[w, H], [w, H], [d, w], [d, w], [d, H], [d, H]];
    for (let f = 0; f < 6; f++) {
      const [fw, fh] = faceDims[f];
      const ru = fw / 13.2, rv = fh / 12.8;
      for (let i = f * perFace; i < (f + 1) * perFace; i++) uv.setXY(i, uv.getX(i) * ru, uv.getY(i) * rv);
    }
    box.translate(0, H / 2, 0);
    const cap = new THREE.BoxGeometry(d + 0.5, 0.55, w + 0.5);
    const cuv = cap.attributes.uv;
    for (let i = 0; i < cuv.count; i++) cuv.setXY(i, cuv.getX(i) * 2, 0.965 + cuv.getY(i) * 0.03);
    cap.translate(0, H + 0.27, 0);
    return Geo.merge([box, cap]);
  },

  // Box whose +z face shows the whole texture; other faces sample its blue border.
  remapBoxFront(geo) {
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      const face = Math.floor(i / 4);
      if (face !== 4) uv.setXY(i, 0.01 + uv.getX(i) * 0.004, 0.5);
    }
  },

  buildBridge() {
    const s = new THREE.Shape();
    s.moveTo(-17, -1.5); s.lineTo(17, -1.5); s.lineTo(17, 13); s.lineTo(-17, 13); s.closePath();
    const hole = new THREE.Path();
    const R = 9.2, spring = 2.2;
    hole.moveTo(-R, -1); hole.lineTo(-R, spring);
    hole.absarc(0, spring, R, Math.PI, 0, true);
    hole.lineTo(R, -1); hole.closePath();
    s.holes.push(hole);
    const geo = new THREE.ExtrudeGeometry(s, { depth: 7, bevelEnabled: false, curveSegments: 24 });
    geo.translate(0, 0, -3.5);
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 4, uv.getY(i) / 4);
    const parapets = [];
    for (const z of [-3.3, 3.3]) {
      const p = new THREE.BoxGeometry(34, 1.0, 0.4);
      const puv = p.attributes.uv;
      for (let i = 0; i < puv.count; i++) puv.setXY(i, puv.getX(i) * 8, puv.getY(i) * 0.25);
      parapets.push(Geo.place(p, { y: 13.5, z }));
    }
    const band = new THREE.BoxGeometry(34.6, 0.5, 7.6);
    const buv = band.attributes.uv;
    for (let i = 0; i < buv.count; i++) buv.setXY(i, buv.getX(i) * 8, buv.getY(i) * 0.12);
    return Geo.merge([geo, ...parapets, Geo.place(band, { y: 12.9 })]);
  },

  // ---------- pooled decoration objects ----------
  takeMesh(pool, make) {
    const o = pool.length ? pool.pop() : make();
    o.visible = true;
    return o;
  },

  addBuilding(seg, side, zLocal, prefab) {
    const mesh = this.takeMesh(this.pools.building, () => {
      const me = new THREE.Mesh(this.prefabs[0].geo, this.mats.facades[0]);
      me.matrixAutoUpdate = false;
      Gfx.scene.add(me);
      return me;
    });
    mesh.geometry = prefab.geo;
    mesh.material = this.mats.facades[prefab.facade];
    const depth = prefab.geo.boundingBox.max.x - prefab.geo.boundingBox.min.x - 0.5;
    const x = side < 0 ? -13.2 - depth / 2 : 9.4 + depth / 2;
    mesh.position.set(x, 0, seg.position.z + zLocal);
    mesh.updateMatrix();
    seg.userData.deco.push({ pool: this.pools.building, obj: mesh });
    return mesh;
  },

  place(seg, index) {
    const L = CFG.SEG_LEN;
    // release previous decorations
    for (const d of seg.userData.deco) { d.obj.visible = false; d.pool.push(d.obj); }
    seg.userData.deco.length = 0;
    seg.userData.index = index;
    seg.position.set(0, 0, this.centerZ(index));
    seg.updateMatrixWorld(true);
    const r = this.hash(index);
    const isBridge = index > 2 && index % 9 === 5;
    seg.userData.wall.material = this.mats.walls[(index + (r * 7 | 0)) % 4];
    seg.userData.props.geometry = this.geos.props[(r * 4) | 0];

    // lamp glows
    const gp = this.glow.geometry.attributes.position;
    const slot = seg.userData.slot;
    gp.setXYZ(slot * 2, -5.0, 4.2, seg.position.z - L / 4);
    gp.setXYZ(slot * 2 + 1, -5.0, 4.2, seg.position.z + L / 4);
    gp.needsUpdate = true;

    // instanced: palms (3 slots), bench (1), gantry (1)
    const rnd = this.rng(index);
    for (let k = 0; k < 3; k++) {
      const show = !isBridge && rnd() < 0.8;
      const z = seg.position.z - L / 2 + (k + 0.25 + rnd() * 0.5) * (L / 3);
      this.setInst(this.inst.palm, slot * 3 + k, show, -10.9 - rnd() * 1.5, CFG.WALK_Y, z, rnd() * TAU, 1.15 + rnd() * 0.45);
    }
    const benchZ = seg.position.z + (rnd() < 0.5 ? -2 : 2) + (rnd() - 0.5) * 6;
    this.setInst(this.inst.bench, slot, rnd() < 0.7, -9.05, CFG.WALK_Y, benchZ, 0, 1);
    this.setInst(this.inst.gantry, slot, index % 2 === 0 && !isBridge, 0, 0, seg.position.z, 0, 1);

    // buildings: fill each side with back-to-back blocks
    if (!isBridge) {
      for (const side of [-1, 1]) {
        let z = -L / 2 + rnd() * 1.5;
        while (z < L / 2 - 4) {
          const prefab = this.prefabs[(rnd() * this.prefabs.length) | 0];
          if (z + prefab.w > L / 2 + 2) break;
          const b = this.addBuilding(seg, side, z + prefab.w / 2, prefab);
          if (side > 0 && rnd() < 0.45) this.addBanner(seg, b, prefab, rnd);
          z += prefab.w + 0.6 + rnd() * 1.6;
        }
      }
      if (index % 3 === 1) this.addSign(seg, (rnd() - 0.5) * 16);
    } else {
      const br = this.takeMesh(this.pools.bridge, () => {
        const me = new THREE.Mesh(this.geos.bridge, this.mats.stone);
        me.castShadow = true; me.receiveShadow = true; me.matrixAutoUpdate = false;
        Gfx.scene.add(me);
        return me;
      });
      br.position.set(0, 0, seg.position.z);
      br.updateMatrix();
      seg.userData.deco.push({ pool: this.pools.bridge, obj: br });
    }
    this.inst.palm.instanceMatrix.needsUpdate = true;
    this.inst.bench.instanceMatrix.needsUpdate = true;
    this.inst.gantry.instanceMatrix.needsUpdate = true;
  },

  addBanner(seg, building, prefab, rnd) {
    const grp = this.takeMesh(this.pools.banner, () => {
      const gr = new THREE.Group();
      const flag = new THREE.Mesh(this.geos.banner, this.mats.banner);
      flag.position.set(-0.9, -1.3, 0);
      const rod = new THREE.Mesh(this.geos.bracket, this.mats.props);
      rod.position.set(-0.7, 0, 0);
      gr.add(flag, rod);
      Gfx.scene.add(gr);
      return gr;
    });
    const H = prefab.floors * 3.2;
    grp.position.set(building.position.x - (building.geometry.boundingBox.max.x - 0.25), Math.min(H - 1.5, 6.5 + rnd() * 3), building.position.z + (rnd() - 0.5) * (prefab.w - 3));
    seg.userData.deco.push({ pool: this.pools.banner, obj: grp });
  },

  addSign(seg, zLocal) {
    const grp = this.takeMesh(this.pools.sign, () => {
      const gr = new THREE.Group();
      const board = new THREE.Mesh(this.geos.signBoard, this.mats.sign);
      board.position.y = 5.1;
      board.castShadow = true;
      const posts = new THREE.Mesh(this.geos.signPosts, this.mats.props);
      gr.add(board, posts);
      gr.rotation.y = -0.42;
      Gfx.scene.add(gr);
      return gr;
    });
    grp.position.set(7.1, CFG.PLATFORM_Y, seg.position.z + zLocal);
    seg.userData.deco.push({ pool: this.pools.sign, obj: grp });
  },

  setInst(im, i, show, x, y, z, ry, s) {
    this._e.set(0, ry, 0);
    this._q.setFromEuler(this._e);
    this._p.set(x, y, z);
    const k = show ? s : 0.0001;
    this._s.set(k, k, k);
    this._m.compose(this._p, this._q, this._s);
    im.setMatrixAt(i, this._m);
  },

  // deterministic per-segment randomness so decorations look varied but stable
  hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); },
  rng(seed) {
    let s = (seed * 2654435761) >>> 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  },

  centerZ(index) { return -index * CFG.SEG_LEN - CFG.SEG_LEN / 2; },

  reset() {
    for (let i = 0; i < this.count; i++) this.place(this.segs[i], i - 1);
  },

  update(playerZ) {
    const L = CFG.SEG_LEN;
    for (const seg of this.segs) {
      const farEdge = -(seg.userData.index + 1) * L;
      if (farEdge > playerZ + CFG.RECYCLE_BEHIND) this.place(seg, seg.userData.index + this.count);
    }
    this.wires.position.z = playerZ;
  }
};

// ==== OBJECTS ====
// Pooled gameplay objects: barriers, trains (parked / oncoming), ramps and instanced coins.
// Every obstacle stores zf (near end, larger z) and zb (far end) in world space; the runner moves toward -z.

const OB_DIM = {

const Obstacles = {

    g.fullBumper = Geo.merge([
      Geo.place(new THREE.BoxGeometry(2.3, 0.42, 0.34), { y: 0.72, z: 0.05 }),
      Geo.place(new THREE.CylinderGeometry(0.17, 0.17, 0.3, 12), { x: -0.75, y: 0.72, z: 0.32, rx: Math.PI / 2 }),
      Geo.place(new THREE.CylinderGeometry(0.17, 0.17, 0.3, 12), { x: 0.75, y: 0.72, z: 0.32, rx: Math.PI / 2 })
    ]);
    g.fullFrame = Geo.merge([
      Geo.place(new THREE.BoxGeometry(0.18, 2.75, 0.18), { x: -1.1, y: 1.375, z: -0.1 }),
      Geo.place(new THREE.BoxGeometry(0.18, 2.75, 0.18), { x: 1.1, y: 1.375, z: -0.1 }),
