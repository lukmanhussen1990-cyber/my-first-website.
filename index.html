}

/* ================================================================
   DESKTOP ICONS
   ================================================================ */
const DESKTOP_APPS=["files","editor","terminal","draw","calc","music","game","settings","recycle"];
function refreshDesktop(){
  const d=$("#desktop"); d.innerHTML="";
  const cols=isMobile()?3:1; // mobile: flow grid feel; desktop: vertical columns
  let items=[];
  DESKTOP_APPS.forEach(id=>items.push({key:"app:"+id,type:"app",app:id,label:APPS[id].name,icon:APPS[id].icon}));
  // desktop folder files
  const deskFolder=getNode("/Desktop");
  if(deskFolder) Object.entries(deskFolder.children).forEach(([name,node])=>{
    items.push({key:"file:/Desktop/"+name,type:"file",path:"/Desktop/"+name,label:name,icon:fileIcon(node,name),node});
  });
  const gw=isMobile()?86:96, gh=isMobile()?92:104;
  const areaH=window.innerHeight-52-10;
  const perCol=Math.max(1,Math.floor(areaH/gh));
  items.forEach((it,i)=>{
    const el=document.createElement("div");
    el.className="icon"; el.dataset.key=it.key;
    el.innerHTML=`<div class="glyph">${it.icon}</div><div class="label">${escapeHtml(it.label)}</div>`;
    let pos=state.iconPos[it.key];
    if(!pos){
      const col=Math.floor(i/perCol), row=i%perCol;
      pos={x:10+col*gw, y:10+row*gh};
      state.iconPos[it.key]=pos;
    }
    el.style.left=pos.x+"px"; el.style.top=pos.y+"px";
    const openIt=()=>{ if(it.type==="app")APPS[it.app].open(); else {
      const n=getNode(it.path); if(!n)return; if(n.type==="folder")openFileExplorer(it.path); else if(n.kind==="drawing")openDrawing(it.path); else openEditor(it.path);
    }};
    // click / dblclick handling with drag
    makeIconDraggable(el,it.key,openIt);
    // context menu
    el.oncontextmenu=e=>{ e.preventDefault(); desktopIconMenu(e.clientX,e.clientY,it); };
    attachLongPress(el,(x,y)=>desktopIconMenu(x,y,it));
    d.appendChild(el);
  });
  save();
}
function desktopIconMenu(x,y,it){
  const items=[{icon:"📂",label:"Open",action:()=>{ if(it.type==="app")APPS[it.app].open(); else { const n=getNode(it.path); if(n){ if(n.type==="folder")openFileExplorer(it.path); else if(n.kind==="drawing")openDrawing(it.path); else openEditor(it.path);} } }}];
  if(it.type==="file"){
    items.push({icon:"✏️",label:"Rename",action:()=>modalPrompt("Rename",it.label,v=>{ const nn=fsRename(it.path,v); if(nn){ delete state.iconPos[it.key]; refreshDesktop(); } })});
    items.push({icon:"🗑️",label:"Delete",action:()=>{ fsDelete(it.path); delete state.iconPos[it.key]; refreshDesktop(); notify("🗑️","Deleted",it.label); }});
  }
  showContextMenu(x,y,items);
}
function makeIconDraggable(el,key,onOpen){
  let sx,sy,ox,oy,moved,drag=false,downT=0,lastTap=0;
  const down=e=>{
    if(e.button===2) return;
    drag=true; moved=false; downT=now();
    const p=point(e); sx=p.x; sy=p.y; ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    $$(".icon").forEach(x=>x.classList.remove("selected")); el.classList.add("selected");
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    document.addEventListener("touchmove",move,{passive:false}); document.addEventListener("touchend",up);
  };
  const move=e=>{
    if(!drag) return;
    const p=point(e); const dx=p.x-sx, dy=p.y-sy;
    if(Math.hypot(dx,dy)>5) moved=true;
    if(moved){ if(e.cancelable)e.preventDefault();
      let nx=ox+dx, ny=oy+dy;
      nx=Math.max(0,Math.min(nx,window.innerWidth-84));
      ny=Math.max(0,Math.min(ny,window.innerHeight-52-96));
      el.style.left=nx+"px"; el.style.top=ny+"px"; }
  };
  const up=e=>{
    drag=false;
    document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
    document.removeEventListener("touchmove",move); document.removeEventListener("touchend",up);
    if(moved){ state.iconPos[key]={x:parseFloat(el.style.left),y:parseFloat(el.style.top)}; save(); }
    else {
      // treat as open on double-click (desktop) or double-tap (mobile)
      const t=now();
      if(t-lastTap<400){ onOpen(); lastTap=0; }
      else lastTap=t;
    }
  };
  el.addEventListener("mousedown",down);
  el.addEventListener("touchstart",down,{passive:true});
  el.addEventListener("dblclick",e=>{ e.preventDefault(); onOpen(); });
}
// clicking empty desktop clears selection + context menu for new items
$("#desktop").addEventListener("mousedown",e=>{ if(e.target.id==="desktop") $$(".icon").forEach(x=>x.classList.remove("selected")); });
$("#desktop").addEventListener("contextmenu",e=>{
  if(e.target.closest(".icon")) return;
  e.preventDefault();
  showContextMenu(e.clientX,e.clientY,[
    {icon:"📄",label:"New Text File",action:()=>modalPrompt("File name","untitled.txt",v=>{ if(v.trim()){fsCreate("/Desktop",v.trim(),"file");refreshDesktop();} })},
    {icon:"📁",label:"New Folder",action:()=>modalPrompt("Folder name","New Folder",v=>{ if(v.trim()){fsCreate("/Desktop",v.trim(),"folder");refreshDesktop();} })},
    {sep:true},
    {icon:"🖼️",label:"Change Wallpaper",action:()=>openSettings()},
    {icon:"🔄",label:"Refresh",action:()=>refreshDesktop()}
  ]);
});
attachLongPress($("#desktop"),(x,y,e)=>{
  if(e.target.closest(".icon")) return;
  showContextMenu(x,y,[
    {icon:"📄",label:"New Text File",action:()=>modalPrompt("File name","untitled.txt",v=>{ if(v.trim()){fsCreate("/Desktop",v.trim(),"file");refreshDesktop();} })},
    {icon:"📁",label:"New Folder",action:()=>modalPrompt("Folder name","New Folder",v=>{ if(v.trim()){fsCreate("/Desktop",v.trim(),"folder");refreshDesktop();} })},
    {icon:"🖼️",label:"Change Wallpaper",action:()=>openSettings()}
  ]);
});

/* ================================================================
   START MENU + SEARCH
   ================================================================ */
function buildAppGrid(){
  const grid=$("#appGrid");
  grid.innerHTML="";
  Object.entries(APPS).forEach(([id,a])=>{
    const t=document.createElement("button"); t.className="app-tile";
    t.innerHTML=`<span class="g">${a.icon}</span><span>${escapeHtml(a.name)}</span>`;
    t.onclick=()=>{ a.open(); closeStart(); };
    grid.appendChild(t);
  });
}
function openStart(){ $("#startMenu").classList.add("open"); $("#searchBox").value=""; doSearch(""); setTimeout(()=>$("#searchBox").focus(),50); }
function closeStart(){ $("#startMenu").classList.remove("open"); }
function toggleStart(){ $("#startMenu").classList.contains("open")?closeStart():openStart(); }
$("#startBtn").addEventListener("click",e=>{ e.stopPropagation(); toggleStart(); });
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn")) closeStart(); });
$("#lockFromStart").onclick=()=>{ closeStart(); lockScreen(); };
$("#restartFromStart").onclick=()=>{ closeStart(); restart(); };
$("#searchBox").addEventListener("input",e=>doSearch(e.target.value));
function doSearch(q){
  q=q.trim().toLowerCase();
  const res=$("#searchResults"), grid=$("#appGrid");
  if(!q){ res.style.display="none"; grid.style.display="grid"; return; }
  res.style.display="flex"; grid.style.display="none";
  const matches=[];
  Object.entries(APPS).forEach(([id,a])=>{ if(a.name.toLowerCase().includes(q)) matches.push({icon:a.icon,label:a.name,sub:"App",action:()=>{a.open();closeStart();}}); });
  // search files
  function walk(node,path){
    Object.entries(node.children||{}).forEach(([name,child])=>{
      const p=normPath(path+"/"+name);
      if(name.toLowerCase().includes(q)) matches.push({icon:fileIcon(child,name),label:name,sub:p,action:()=>{ if(child.type==="folder")openFileExplorer(p); else if(child.kind==="drawing")openDrawing(p); else openEditor(p); closeStart(); }});
      if(child.type==="folder") walk(child,p);
    });
  }
  walk(state.fs,"/");
  res.innerHTML="";
  if(!matches.length){ res.innerHTML=`<div class="search-row" style="color:var(--muted);">No results for "${escapeHtml(q)}"</div>`; return; }
  matches.slice(0,20).forEach(m=>{ const r=document.createElement("div"); r.className="search-row";
    r.innerHTML=`<span>${m.icon}</span><span>${escapeHtml(m.label)}</span><span class="sub">${escapeHtml(m.sub)}</span>`;
    r.onclick=m.action; res.appendChild(r); });
}
$("#searchTray").onclick=()=>{ openStart(); };

/* ================================================================
   CLOCK / TASKBAR TRAY
   ================================================================ */
function tickClock(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
  const time=hh+":"+mm;
  const dateStr=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("#tClock").textContent=time; $("#tDate").textContent=dateStr;
  $("#lockClock").textContent=time;
  $("#lockDate").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}

/* ================================================================
   LOCK / BOOT / RESTART
   ================================================================ */
function lockScreen(){ $("#lock").style.display="flex"; }
function unlock(){ $("#lock").style.display="none"; beep(660,.1,.04); }
$("#unlockBtn").onclick=unlock;
$("#lock").addEventListener("click",e=>{ if(e.target.id==="lock"||e.target.classList.contains("lock-hint")||e.target.classList.contains("lock-avatar")) unlock(); });
$("#lockTray").onclick=lockScreen;
function restart(){
  Object.keys(windows).forEach(closeWin);
  $("#boot").style.display="flex";
  $("#boot").querySelector(".boot-bar>i").style.animation="none";
  void $("#boot").offsetWidth;
  $("#boot").querySelector(".boot-bar>i").style.animation="load 1.6s ease forwards";
  setTimeout(()=>{ $("#boot").style.display="none"; lockScreen(); },1700);
}

/* ================================================================
   THEME / WALLPAPER / ACCENT APPLICATION
   ================================================================ */
function applyTheme(){ document.documentElement.setAttribute("data-theme",state.settings.theme); }
function applyWallpaper(){ const scr=$("#screen"); scr.className=""; scr.classList.add(state.settings.wallpaper); }
function applyAccent(){
  document.documentElement.style.setProperty("--accent",state.settings.accent);
  document.documentElement.style.setProperty("--accent-2",state.settings.accent);
}
function applyAll(){ applyTheme(); applyWallpaper(); applyAccent(); $("#userName").textContent=state.settings.userName; }

/* ================================================================
   KEYBOARD SHORTCUTS
   ================================================================ */
document.addEventListener("keydown",e=>{
  // ignore when typing in inputs (except global combos)
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==="Escape"){ hideContextMenu(); closeStart(); $("#modalWrap").classList.remove("open"); }
  if(e.ctrlKey&&e.altKey&&(e.key==="t"||e.key==="T")){ e.preventDefault(); openTerminal(); }
  if(e.ctrlKey&&e.altKey&&(e.key==="e"||e.key==="E")){ e.preventDefault(); openFileExplorer(); }
  if(e.ctrlKey&&e.altKey&&(e.key==="l"||e.key==="L")){ e.preventDefault(); lockScreen(); }
  if(typing) return;
  if(e.key==="Meta"||e.key==="OS"){ /* handled by start btn */ }
  // Alt+F4 close active window
  if(e.altKey&&e.key==="F4"){ e.preventDefault(); const top=topWindowId(); if(top)closeWin(top); }
});
function topWindowId(){
  let best=null,bz=-1;
  Object.entries(windows).forEach(([id,w])=>{ if(w.min)return; const z=+w.el.style.zIndex||0; if(z>bz){bz=z;best=id;} });
  return best;
}

/* ================================================================
   RESPONSIVE — keep windows inside on resize
   ================================================================ */
let rzTimer=null;
window.addEventListener("resize",()=>{
  Object.values(windows).forEach(w=>{ if(w.max){ const scr=$("#screen").getBoundingClientRect(); w.el.style.width=scr.width+"px"; w.el.style.height=(scr.height-52)+"px"; } else clampToScreen(w.el); });
  clearTimeout(rzTimer); rzTimer=setTimeout(refreshDesktop,300);
});

/* ================================================================
   BOOT SEQUENCE
   ================================================================ */
function bootUp(){
  load();
  applyAll();
  buildAppGrid();
  refreshDesktop();
  tickClock(); setInterval(tickClock,1000);
  // boot animation then lock screen
  setTimeout(()=>{
    $("#boot").style.transition="opacity .5s"; $("#boot").style.opacity="0";
    setTimeout(()=>{ $("#boot").style.display="none"; $("#boot").style.opacity="1"; }, 500);
    lockScreen();
    setTimeout(()=>notify("👋","Welcome to MiniOS","Tap the ▦ button to open apps."),900);
  }, 2400);
}
document.addEventListener("DOMContentLoaded",bootUp);
// safety: if DOMContentLoaded already fired
if(document.readyState!=="loading") { /* bootUp attached above will run on event; ensure */ }
})();
