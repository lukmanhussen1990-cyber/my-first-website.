function styleBubble(el, cx, cy, r, hw, fill = 0.09, tint = null) {
  const k = r / 96; hw = hw === undefined ? r : hw;
  el.style.width = (2 * hw) + 'px'; el.style.height = (2 * r) + 'px';
  el.style.borderRadius = (0.56 * Math.min(r, hw)) + 'px';   // Claude-style rounded-square buttons
  el.style.left = (cx - hw) + 'px'; el.style.top = (cy - r) + 'px';
  el.style.background = tint ? tint : `rgba(255,255,255,${fill})`;
  el.style.boxShadow = [
    `inset 0 0 ${14 * k}px ${0 * k}px rgba(255,255,255,0.11)`,
    `inset ${4 * k}px ${11 * k}px ${17 * k}px ${-3 * k}px rgba(255,255,255,0.66)`,
    `inset ${0 * k}px ${-9 * k}px ${15 * k}px ${-6 * k}px rgba(255,255,255,0.24)`].join(',');
}

function renderA(f) {

  const rm = document.getElementById('remnP');
  if (f === 61) {
    // last trace of the opening's orange starburst (continuity with S01 frame 60)
    rm.setAttribute('d', BURST_D);
    rm.setAttribute('transform', 'translate(962 540) rotate(352) scale(9)');
    rm.setAttribute('fill', 'rgb(217,119,87)');
    rm.setAttribute('fill-opacity', '0.45'); rm.style.filter = 'blur(1.2px)';
  } else rm.setAttribute('d', '');
  const bp = document.getElementById('bubP'), bs = document.getElementById('bubS');
  const ps = document.getElementById('plusSvg');
  if (f > 115) { bp.style.display = bs.style.display = ps.style.display = 'none'; return; }
  // plus bubble
  const r = P(A_PR, f), cx = P(A_PX, f);
  bp.style.display = 'block';
  if (r > 0.5) styleBubble(bp, cx, CY, r, r, P(A_FILL, f)); else { styleBubble(bp, cx, CY, 0.5); bp.style.background = 'none'; bp.style.boxShadow = 'none'; bp.style.backdropFilter = 'none'; }
  bp.style.backdropFilter = r > 0.5 ? 'blur(5px)' : 'none';
  const dr = Math.abs(P(A_PR, f + 0.5) - P(A_PR, f - 0.5));
  bp.style.filter = (r > 0.5 && dr > 2) ? `blur(${(0.2 * dr).toFixed(2)}px)` : 'none';
  const shrink = f >= 107 ? r / 96.1 : 1;
  const arm = P(A_ARM, f) * shrink, sw = P(A_STROKE, f) * shrink;
  // the plus is drawn in its own coordinates: half length (to the round cap end) = arm
  const half = Math.max(0.01, arm - sw / 2);
  ps.setAttribute('viewBox', `${-arm - 4} ${-arm - 4} ${2 * arm + 8} ${2 * arm + 8}`);
  ps.style.width = ps.style.height = (2 * arm + 8) + 'px';
  ps.style.left = (cx - arm - 4) + 'px'; ps.style.top = (CY - arm - 4) + 'px'; ps.style.display = 'block';
  ps.firstElementChild.setAttribute('d', `M${-half} 0H${half}M0 ${-half}V${half}`);
  ps.firstElementChild.setAttribute('stroke-width', sw);
  ps.style.transform = `rotate(${P(A_ROT, f)}deg)`;
  const dth = Math.abs(P(A_ROT, f + 0.5) - P(A_ROT, f - 0.5)) * Math.PI / 180;
  const pb = 0.12 * dth * arm + 0.06 * Math.abs(P(A_ARM, f + 0.5) - P(A_ARM, f - 0.5));
  ps.style.filter = pb > 0.3 ? `blur(${pb.toFixed(2)}px)` : 'none';
  ps.style.opacity = 1;
  ps.style.transformOrigin = '50% 50%';
  // send bubble

  bs.style.opacity = P(A_SOP, f);
  const sc = 4.55 * (f >= 107 ? sr / 97.4 : 1), size = 24 * sc;

  sv.style.left = (hw - 2.5 - size / 2) + 'px'; sv.style.top = (sr + 0.3 - size / 2) + 'px';

  });
  pill = claudeComposer({ width: COMP.w, height: COMP.h, font: "'Inter'", border: 'rgba(255,255,255,0.42)', blur: 22,
    btnBorder: 'rgba(255,255,255,0.38)', muted: 'rgba(255,255,255,0.82)' });
  Object.assign(pill.style, { left: COMP.x + 'px', top: COMP.y + 'px', boxShadow: '0 10px 40px rgba(10,8,40,0.10)',
    background: 'linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.035) 60%, rgba(255,255,255,0.09) 100%)' });
  const hi = document.createElement('div');
  Object.assign(hi.style, { position: 'absolute', inset: '-1.5px', borderRadius: (0.19 * COMP.h) + 'px', pointerEvents: 'none',
    boxShadow: 'inset 0 1.5px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.12), inset 7px 5px 8px -5px rgba(255,255,255,0.40)' });
  pill.appendChild(hi);
  const tt = pill.parts.t; tt.textContent = '';
  qSpan1 = document.createElement('span'); qSpan2 = document.createElement('span');
  qSpan1.className = qSpan2.className = 'word'; qSpan1.style.position = qSpan2.style.position = 'static';
  tt.appendChild(qSpan1); tt.appendChild(qSpan2);
  document.getElementById('ui').appendChild(pill);
}

function layerTransform(f) {
  if (f <= 158) { const z = P(B_ZI, f); return { z, cx: 959.5, cy: 542 }; }
  return { z: P(B_ZL, f), cx: 959.5, cy: 559 };
}

function renderB(f) {
  const ui = document.getElementById('ui');
  if (f < 116 || f > 222) { ui.style.display = 'none'; return; }
  ui.style.display = 'block';
  const { z, cx, cy } = layerTransform(f);
  ui.style.transform = `translate(${cx}px,${cy}px) scale(${z}) translate(${-cx}px,${-cy}px)`;
  // --- headline
  const hl = document.getElementById('hl');
  const dy = P(HL_DY, f), ho = P(HL_OP, f);
  const bx = P(HL_BLUR.map(r => [r[0], r[1]]), f), by = P(HL_BLUR.map(r => [r[0], r[2]]), f);
  hl.style.transform = `translateY(${dy}px)`;
  document.getElementById('hlBlurG').setAttribute('stdDeviation', `${bx.toFixed(2)} ${by.toFixed(2)}`);
  hl.style.filter = by > 0.05 ? 'url(#hlBlur)' : 'none';
  hl.style.opacity = ho;
  const bk = (j) => P(BAND.map(r => [r[0], r[j]]), f);
  const L0 = bk(1), L1 = bk(2), R1 = bk(3), R0 = bk(4), K = bk(5);
  hlSpans.forEach((s, i) => {
    const T = HL_T[i];
    const g = ease.outQuad(invlerp(T.a, T.a + 2.5, f));        // ghost fade-in
    const sol = ease.outCubic(invlerp(T.s - 1, T.s + 4, f));    // to solid
    const op = Math.min(1, 0.6 * g + 0.4 * sol);
    const blur = (1 - sol) * (2.0 + 3 * (1 - g));
    const dx = P(HL_DX[i], f);
    s.style.left = HL_X[i] + 'px';
    s.style.top = (HL_BASE - 0.97 * HL_SIZE + 10.5) + 'px';
    s.style.transform = `translateX(${dx}px)`;
    s.style.opacity = op;
    s.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    // violet band in headline coordinates -> word-local gradient stops (24px padding)
    const o = 24 - HL_X[i], wc = rgba(mixc([255, 255, 255], VIOLET, Math.min(1, K)));
    const st = [[L0, 0], [L1, 1], [R1, 1], [R0, 0]];
    const stops = st.map(([x, w]) => `${w ? wc : '#fff'} ${(x + o).toFixed(1)}px`).join(', ');
    s.style.backgroundImage = `linear-gradient(90deg, ${stops})`;
    s.style.webkitBackgroundClip = 'text'; s.style.backgroundClip = 'text'; s.style.color = 'transparent';
  });
  // --- composer internals: buttons slide out from the centre, model selector rises in
  const plusX = P(B_PLUS, f), discX = P(B_DISC, f);
  const pl = pill.parts.plus, tl = pill.parts.tools, sd = pill.parts.send, md = pill.parts.model;
  pl.style.transform = `translateX(${plusX - 445}px)`;
  tl.style.transform = `translateX(${(plusX - 445) * 1.08}px)`;
  sd.style.transform = `translateX(${discX - 1463.3}px)`;
  const vD = Math.abs(P(B_DISC, f + 0.5) - P(B_DISC, f - 0.5)) * z, vP = Math.abs(P(B_PLUS, f + 0.5) - P(B_PLUS, f - 0.5)) * z;
  const sD = 0.15 * vD, sP = 0.15 * vP;
  document.getElementById('mbDiscG').setAttribute('stdDeviation', `${sD.toFixed(2)} 0.3`);
  document.getElementById('mbPlusG').setAttribute('stdDeviation', `${sP.toFixed(2)} 0.3`);
  sd.style.filter = sD > 0.4 ? 'url(#mbDisc)' : 'none';
  pl.style.filter = tl.style.filter = sP > 0.4 ? 'url(#mbPlus)' : 'none';
  pl.style.opacity = P([[116, 0.55], [118, 0.7], [120, 0.9], [121, 1]], f);
  tl.style.opacity = P([[119, 0], [123, 0.7], [126, 1]], f);
  md.style.transform = `translateY(${P(B_MIC_DY, f)}px)`;
  md.style.opacity = P(B_MIC_OP, f);
  // --- query text
  let q = '';
  for (const [f0, t] of QUERIES) if (f >= f0) q = t;
  if (q === 'Ask anything...') {
    qSpan1.textContent = 'Ask'; qSpan2.textContent = ' anything...';
    const p2 = ease.outCubic(invlerp(131, 134, f));
    qSpan2.style.opacity = p2; qSpan2.style.filter = p2 < 1 ? `blur(${(4 * (1 - p2)).toFixed(2)}px)` : 'none';
    qSpan1.style.opacity = 1; qSpan1.style.filter = 'none';
  } else {
    qSpan1.textContent = q; qSpan2.textContent = '';
    const p1 = q === 'Ask' ? ease.outCubic(invlerp(125, 127, f)) : 1;
    qSpan1.style.opacity = p1; qSpan1.style.filter = p1 < 1 ? `blur(${(4 * (1 - p1)).toFixed(2)}px)` : 'none';
  }
}

// ---------------- C: big panel ----------------
const C_S = [[223, 1.0], [224, 1.0129], [225, 1.0229], [226, 1.0330], [227, 1.0415], [228, 1.0487], [229, 1.0544],
  [230, 1.0587], [231, 1.0645], [232, 1.0673], [233, 1.0716], [234, 1.0759], [235, 1.0788], [236, 1.0831], [237, 1.0860],
  [238, 1.0903], [239, 1.0946], [240, 1.0989], [241, 1.1032], [242, 1.1074], [243, 1.1146], [244, 1.1203], [245, 1.1289],
  [246, 1.1390], [247, 1.1504], [248, 1.1648], [249, 1.1819], [250, 1.2034]];
const C_CX = 975, C_CY = 550;
const PANEL = { x: 277, y: 449 };
const PT_WORDS = ['Which', 'doctor', 'is', 'right'];
const PT_X = [333, 545, 762.5, 826.5];
const PT_BASE = 570.1, PT_SIZE = 77.3, PT_TRACK = -1.5, PT_SX = 0.911;
const PT_T = [{ a: 223.8, s: 231.2 }, { a: 230.8, s: 238.3 }, { a: 238.3, s: 245.2 }, { a: 244.9, s: 252.3 }];
let ptSpans = null;
function buildC() {
  const pt = document.getElementById('ptext');
  ptSpans = PT_WORDS.map((w, i) => {
    const s = document.createElement('span'); s.className = 'word'; s.textContent = w;
    s.style.fontSize = PT_SIZE + 'px'; s.style.letterSpacing = PT_TRACK + 'px';
    s.style.transformOrigin = '0 0';
    pt.appendChild(s); return s;
  });
}
function renderC(f) {
  const w = document.getElementById('pwrap');
  if (f < 223) { w.style.display = 'none'; return; }
  w.style.display = 'block';
  const S = P(C_S, f);
  w.style.transform = `translate(${C_CX}px,${C_CY}px) scale(${S}) translate(${-C_CX}px,${-C_CY}px)`;
  const pn = document.getElementById('panel'), pb = document.getElementById('pborder');
  const box = { left: (PANEL.x - 1) + 'px', top: (PANEL.y - 1) + 'px', width: (1920 - PANEL.x + 400) + 'px',
    height: (1080 - PANEL.y + 400) + 'px', borderRadius: '88px 0 0 0', position: 'absolute', boxSizing: 'border-box' };
  Object.assign(pn.style, box, { background: 'linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.07) 30%, rgba(255,255,255,0.055))' });
  Object.assign(pb.style, box, { border: '2px solid rgba(255,255,255,0.85)', borderRight: 'none', borderBottom: 'none', background: 'none' });
  // horizontal motion blur while the push-in accelerates (zoom about x = 975: speed grows with distance)
  const dS = P(C_S, f + 0.5) - P(C_S, f - 0.5);
  const sig = (xl) => 0.2 * Math.abs(xl - C_CX) * dS / S;   // layer x -> blur in layer units
  const sB = sig(PANEL.x);
  document.getElementById('mbBorderG').setAttribute('stdDeviation', `${sB.toFixed(2)} ${(0.3 * sB).toFixed(2)}`);
  pb.style.filter = sB > 0.3 ? 'url(#mbBorder)' : 'none';
  ptSpans.forEach((s, i) => {
    const T = PT_T[i];
    const sol = invlerp(T.a, T.s, f);
    s.style.left = PT_X[i] + 'px';
    s.style.top = (PT_BASE - 0.97 * PT_SIZE) + 'px';
    s.style.transform = `scaleX(${PT_SX})`;
    s.style.opacity = sol;
    const sm = sig(PT_X[i] + 60), sr = (sol > 0 && sol < 1 ? (1 - sol) * 1.8 : 0);
    document.getElementById(`mbW${i}G`).setAttribute('stdDeviation', `${(sm + sr).toFixed(2)} ${(0.3 * sm + sr).toFixed(2)}`);
    s.style.filter = (sm + sr) > 0.05 ? `url(#mbW${i})` : 'none';
  });
}

let built = false;
const plateImg = document.getElementById('plate');
window.renderFrame = async (f) => {
  if (!built) { buildB(); buildC(); built = true; }
  await setImg(plateImg, `../../plates/S02_cloud_chat/clouds_${String(f).padStart(4, '0')}.png`);
  renderA(f); renderB(f); renderC(f);
};
window.sceneReady = document.fonts.load("600 70px 'Inter Display'").then(() => document.fonts.load("400 45px 'Inter Display'"));
</script>
