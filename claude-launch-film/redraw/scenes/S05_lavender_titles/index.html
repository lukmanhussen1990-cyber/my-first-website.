<!doctype html>
<html><head><meta charset="utf-8"><title>S05 lavender titles</title>
<link rel="stylesheet" href="../../shared/base.css">
<script src="../../shared/lib.js"></script>
<script src="../../shared/components.js"></script>
<script src="../../shared/titles.js"></script>
</head><body>
<div id="stage"><img class="plate" id="bg"></div>
<script>
// S05 (f449-525): lavender light field (reference background, text removed) with two redrawn,
// re-typeset title lines. Timings, zoom, colours and blur pulses measured on the reference.
const stage = document.getElementById('stage');
const V = [114, 99, 238], D = [10, 10, 28];
const line1 = new TitleLine(stage, {
  text: 'Build to move beyond generic', font: "'Inter'", size: 74, tracking: -0.02, weight: 400,
  cx: 952, baseline: 560, layout: 'progressive', presenceDur: 7,
  S: [[449, 1.19], [453, 1.16], [457, 1.065], [463, 1.01], [470, 1.0], [490, 0.995], [496, 0.975]],
  X: [[449, -16], [455, 0], [470, 8], [490, 0]],
  blur: [[449, 1.5], [452, 0], [459, 0], [460, 3.0], [461, 2.6], [462, 2.2], [463, 1.3], [464, 0], [473, 0], [475, 1.8], [477, 2.2], [478, 1.0], [479, 0], [491, 0], [495, 3], [496, 5]],
  opacity: [[449, 1], [490, 1], [493, 0.85], [494, 0.65], [495, 0.35], [496, 0]],
  units: [
    { in: 447.5, dur: 5.5, from: V, to: D, blur0: 4 },
    { in: 454, dur: 6, from: V, to: D, blur0: 6, presenceDur: 4 },
    { in: 459, dur: 6, from: V, to: D, blur0: 6, presenceDur: 4 },
    { in: 464, dur: 4, opacityAt: [[464, 0], [467, 1]], colorAt: [[464, V], [469, [92, 80, 192]], [475, D]], blurAt: [[464, 6], [467, 1], [468, 0]], weight: 400, weightTo: 640, weightAt: 468, weightDur: 4, presenceDur: 4 },
    { in: 478, dur: 3, opacityAt: [[478, 0], [481, 1]], colorAt: [[478, V], [482, V], [488, D]], blurAt: [[478, 5], [481, 1], [483, 0]], presenceDur: 4 },
  ],
});
const V2 = [117, 101, 241];
// "healthcare search" (client request: a different, livelier animation plus a small search motif).
// The letters of "healthcare" ripple up one after another and darken to ink; "search" types itself
// out in violet behind a caret while a small magnifying glass follows the typing, then pings twice.
const SEARCH_T0 = 502, TYPE_DT = 1.3;
const HC = Array.from('healthcare').map((_, k) => {
  const t0 = 495 + k * 0.55;
  return { in: t0, dur: 6, rise: 30, blur0: 6, opacityAt: [[t0, 0], [t0 + 2.5, 1]],
    colorAt: [[t0, V2], [t0 + 8, [108, 94, 222]], [t0 + 13, [70, 63, 138]], [518, [31, 31, 62]], [522, [15, 15, 41]]] };
});
const SE = Array.from('search').map((_, k) => {
  const t0 = SEARCH_T0 + k * TYPE_DT;
  return { in: t0, dur: 3, opacityAt: [[t0, 0], [t0 + 0.5, 1]], riseAt: [[t0, 7], [t0 + 3, 0]],
    colorAt: [[t0, [126, 104, 252]], [512, [112, 92, 246]], [520, [86, 66, 220]]] };
});
const line2 = new TitleLine(stage, {
  text: 'healthcare search', unit: 'letter', font: "'Inter Display'", size: 84.5, tracking: -0.02, weight: 400,
  cx: 955.5, baseline: 574, layout: 'full',
  S: [[495, 1.12], [507, 1.12], [508, 1.117], [512, 1.085], [516, 1.05], [520, 1.0], [522, 0.964], [524, 0.919], [525, 0.893]],
  opacity: [[494, 0], [495, 1]],
  units: [...HC, ...SE],
});
// caret + magnifier live inside the line so they share its zoom
const caret = document.createElement('div');
Object.assign(caret.style, { position: 'absolute', width: '4px', height: '78px', borderRadius: '2px', background: 'rgb(118,96,250)' });
line2.el.appendChild(caret);
const lens = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
lens.setAttribute('width', 120); lens.setAttribute('height', 120); lens.setAttribute('viewBox', '-60 -60 120 120');
lens.style.position = 'absolute'; lens.style.overflow = 'visible';
lens.innerHTML = `<circle class="r1" r="14" fill="none" stroke="rgb(118,96,250)" stroke-width="2.5"/><circle class="r2" r="14" fill="none" stroke="rgb(118,96,250)" stroke-width="2.5"/>
  <g class="g"><circle r="13" fill="rgba(255,255,255,0.35)" stroke="rgb(108,86,244)" stroke-width="4.2"/>
  <path d="M9.6 9.6 L21 21" stroke="rgb(108,86,244)" stroke-width="5" stroke-linecap="round"/>
  <path d="M-6 -4 A7 7 0 0 1 -1 -8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>`;
line2.el.appendChild(lens);
const SI = Array.from('healthcare search').map((c, i) => i).filter(i => i >= 11);   // span indices of "search"
let lensX = null;
function searchFX(f) {
  const L = line2, base = L.o.baseline;
  const typed = SI.filter((i, k) => f >= SEARCH_T0 + k * TYPE_DT);
  const lastI = typed.length ? typed[typed.length - 1] : SI[0] - 1;
  const sp = L.spans[lastI];
  const cx = parseFloat(sp.style.left) + L.w[lastI] + 5;
  // caret: solid while typing, one blink, then gone
  const blink = f < 510.5 || (f >= 512 && f < 514);
  caret.style.display = (f >= SEARCH_T0 - 1 && f < 514 && blink) ? 'block' : 'none';
  caret.style.left = cx + 'px'; caret.style.top = (base - 66) + 'px';
  // magnifier trails the caret above the word, then settles over the end of "search" and pings
  const target = cx + 26;
  lensX = (lensX === null || f < SEARCH_T0) ? target : lensX + (target - lensX) * 0.55;
  const op = kf(f, [[SEARCH_T0 - 1, 0], [SEARCH_T0 + 1, 1], [516, 1], [519, 0]]);
  const rot = kf(f, [[509, 0], [510.5, -16], [512, 10], [513.5, -4], [515, 0]]);
  const bob = kf(f, [[509, 0], [510.5, -6], [512, 2], [513.5, 0]]);
  lens.style.left = (lensX - 60) + 'px'; lens.style.top = (base - 96 - 60 + bob) + 'px';
  lens.style.opacity = op; lens.style.display = op > 0.002 ? 'block' : 'none';
  lens.querySelector('.g').setAttribute('transform', `rotate(${rot})`);
  [[510, '.r1'], [512.5, '.r2']].forEach(([t0, c]) => {
    const u = clamp((f - t0) / 6), r = lens.querySelector(c);
    r.setAttribute('r', (14 + 34 * ease.outCubic(u)).toFixed(2));
    r.setAttribute('stroke-opacity', (f < t0 ? 0 : 0.7 * (1 - u)).toFixed(3));
  });
}
window.renderFrame = async (f) => {
  await setImg(document.getElementById('bg'), `../../plates/S05_lavender_titles/bg_${String(f).padStart(4, '0')}.jpg`);
  line1.el.style.display = f <= 496 ? 'block' : 'none';
  line2.el.style.display = f >= 495 ? 'block' : 'none';
  if (f <= 496) line1.render(f);
  if (f >= 495) { line2.render(f); searchFX(f); }
};
window.sceneReady = document.fonts.ready;
</script>
</body></html>
