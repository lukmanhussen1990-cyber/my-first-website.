  // focus ring pulse when the field takes focus

  ringEl.style.boxShadow = f >= 503 ? `0 0 0 ${(1 + 7 * ease.outCubic(rp)).toFixed(2)}px rgba(118,96,250,${(0.32 * (1 - rp)).toFixed(3)})` : 'none';
  // centre the whole line on cx at baseline 574 (it glides as the field opens)
  const w = row.offsetWidth;
  row.style.left = (L2.cx - w / 2).toFixed(2) + 'px';
  row.style.top = (L2.base - BASE_DY).toFixed(2) + 'px';
  l2.style.transform = `scale(${kf(f, L2.S)})`;
  // "healthcare": letters ripple up, violet ink darkening to navy
  HCs.forEach((s, k) => {
    const t0 = 495 + k * 0.5, u = clamp((f - t0) / 6), e = ease.outCubic(u);
    s.style.opacity = clamp((f - t0) / 2.5).toFixed(3);
    s.style.transform = `translateY(${(24 * (1 - e)).toFixed(2)}px)`;
    const bl = 6 * (1 - e); s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
    s.style.color = rgba(kf(f, [[t0, V2], [t0 + 8, [108, 94, 222]], [t0 + 13, [70, 63, 138]], [518, [31, 31, 62]], [522, INK]]));
  });
  // magnifier draws itself, then gives a small settle once the query is in
  const dc = ease.inOutCubic(clamp((f - 501.5) / 4)), dh = ease.outCubic(clamp((f - 504.5) / 2.2));
  lensC.setAttribute('stroke-dashoffset', (C_LEN * (1 - dc)).toFixed(2));
  lensH.setAttribute('stroke-dashoffset', (H_LEN * (1 - dh)).toFixed(2));
  lensG.style.opacity = clamp((f - 505) / 2).toFixed(3);
  const wig = kf(f, [[511, 0], [512.5, -14], [514, 7], [515.5, -2.5], [517, 0]]);
  const pop = kf(f, [[511, 1], [512.5, 1.12], [514.5, 0.97], [516, 1]]);
  mg.setAttribute('transform', `translate(22 22) rotate(${wig.toFixed(2)}) scale(${pop.toFixed(4)}) translate(-22 -22)`);
  // typing
  let typed = 0;
  Qs.forEach((s, k) => {
    const t0 = TYPE0 + k * TYPE_DT, u = clamp((f - t0) / 2);
    if (f >= t0) typed = k + 1;
    s.style.display = f >= t0 ? 'inline-block' : 'none';
    s.style.opacity = clamp((f - t0) / 0.8).toFixed(3);
    s.style.transform = `translateY(${(7 * (1 - ease.outCubic(u))).toFixed(2)}px)`;
    const bl = 2.5 * (1 - u); s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
  });
  // caret: solid while typing, then a soft blink, gone once the search runs
  const tEnd = TYPE0 + 5 * TYPE_DT + 1;
  let ca = f < 502.5 ? 0 : f <= tEnd ? 1 : 0.5 + 0.5 * Math.cos((f - tEnd) / 7.5 * 2 * Math.PI);
  if (f > 516) ca = 0;
  caretEl.style.opacity = ca.toFixed(3);
  const lastQ = Qs[Math.max(0, typed - 1)];
  caretEl.style.left = (typed ? lastQ.offsetLeft + lastQ.offsetWidth + 4 : 0).toFixed(1) + 'px';
  // sheen across the glass and the progress line along its base ("searching")
  const sp = 0.5 - 0.5 * Math.cos(Math.PI * clamp((f - 510.5) / 5));
  sheen.style.transform = `translateX(${(-90 + (FW + 180) * sp).toFixed(1)}px) rotate(18deg)`;
  sheen.style.opacity = (f >= 510.5 && f <= 516) ? 1 : 0;
  const pp = ease.inOutCubic(clamp((f - 510) / 5.5));
  prog.style.transform = `scaleX(${pp.toFixed(4)})`;
  prog.style.opacity = (f < 510 ? 0 : 1 - clamp((f - 516) / 3)).toFixed(3);
}
window.renderFrame = async (f) => {
  await setImg(document.getElementById('bg'), `../../plates/S05_lavender_titles/bg_${String(f).padStart(4, '0')}.jpg`);
  l1.style.display = f <= 496 ? 'block' : 'none';
  l2.style.display = f >= 495 ? 'block' : 'none';
  if (f <= 496) renderL1(f);
  if (f >= 495) renderL2(f);
};
window.sceneReady = document.fonts.ready;
</script>
