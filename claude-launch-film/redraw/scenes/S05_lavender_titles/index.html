<!doctype html>
<html><head><meta charset="utf-8"><title>S05 lavender titles</title>
<link rel="stylesheet" href="../../shared/base.css">
<script src="../../shared/lib.js"></script>
<script src="../../shared/components.js"></script>
<script src="../../shared/titles.js"></script>
</head><body>
<div id="stage"><img class="plate" id="bg"></div>
<script>
// S05 (f449-525): lavender light field (reference background, text removed) with two redrawn,
// re-typeset title lines. Timings, zoom, colours and blur pulses measured on the reference.
const stage = document.getElementById('stage');
const V = [114, 99, 238], D = [10, 10, 28];
const line1 = new TitleLine(stage, {
  text: 'Build to move beyond generic', font: "'Inter'", size: 74, tracking: -0.02, weight: 400,
  cx: 952, baseline: 560, layout: 'progressive', presenceDur: 7,
  S: [[449, 1.19], [453, 1.16], [457, 1.065], [463, 1.01], [470, 1.0], [490, 0.995], [496, 0.975]],
  X: [[449, -16], [455, 0], [470, 8], [490, 0]],
  blur: [[449, 1.5], [452, 0], [459, 0], [460, 3.0], [461, 2.6], [462, 2.2], [463, 1.3], [464, 0], [473, 0], [475, 1.8], [477, 2.2], [478, 1.0], [479, 0], [491, 0], [495, 3], [496, 5]],
  opacity: [[449, 1], [490, 1], [493, 0.85], [494, 0.65], [495, 0.35], [496, 0]],
  units: [
    { in: 444, dur: 4, opacityAt: [[448, 1]], colorAt: [[449, [118, 100, 238]], [450, [112, 96, 228]], [452, [80, 72, 160]], [455, [40, 38, 90]], [458, D]], blurAt: [[449, 1.2], [451, 0.4], [452, 0]] },   // continues the violet 'Build' of the flash frames
    { in: 454, dur: 6, from: V, to: D, blur0: 6, presenceDur: 4 },
    { in: 459, dur: 6, from: V, to: D, blur0: 6, presenceDur: 4 },
    { in: 464, dur: 4, opacityAt: [[464, 0], [467, 1]], colorAt: [[464, V], [469, [92, 80, 192]], [475, D]], blurAt: [[464, 6], [467, 1], [468, 0]], weight: 400, weightTo: 640, weightAt: 468, weightDur: 4, presenceDur: 4 },
    { in: 478, dur: 3, opacityAt: [[478, 0], [481, 1]], colorAt: [[478, V], [482, V], [488, D]], blurAt: [[478, 5], [481, 1], [483, 0]], presenceDur: 4 },
  ],
});
const V2 = [117, 101, 241];
// ---------------------------------------------------------------------------------------------
// "healthcare search" (f495-525), redesigned at the client's request (premium search moment, kept
// small): "healthcare" ripples up letter by letter; a compact frosted-glass search field then opens
// to its right (the line glides to stay centred), a gradient magnifier draws itself, "search" is
// typed behind a soft caret, a sheen crosses the glass while a thin violet-to-coral progress line
// runs along its base, the glyph settles, and the whole line eases back into the cut.
// ---------------------------------------------------------------------------------------------
const L2 = { cx: 955.5, base: 574, size: 84.5,
  S: [[495, 1.12], [507, 1.12], [508, 1.117], [512, 1.085], [516, 1.05], [520, 1.0], [522, 0.964], [524, 0.919], [525, 0.893]] };
const INK = [15, 15, 41];
const l2 = document.createElement('div');
l2.id = 'l2';
l2.innerHTML = `
<style>
  #l2 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: ${L2.cx}px ${L2.base}px; }
  #l2 .row { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; white-space: nowrap;
             font-family: 'Inter Display'; font-weight: 400; font-size: ${L2.size}px; letter-spacing: -0.02em; line-height: 1; }
  #l2 .ch { display: inline-block; will-change: transform; }
  #l2 .field { position: relative; display: inline-flex; align-items: baseline; overflow: visible; }
  #l2 .clip { box-sizing: border-box; position: relative; display: inline-flex; align-items: baseline; overflow: hidden; padding: 16px 28px 14px 18px; margin: -16px 0 -14px 0; border-radius: 34px; }
  #l2 .bg { position: absolute; inset: 0; border-radius: 34px; transform-origin: 50% 58%;
            background: linear-gradient(180deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.40) 55%, rgba(246,244,255,0.46) 100%);
            backdrop-filter: blur(14px) saturate(1.35); -webkit-backdrop-filter: blur(14px) saturate(1.35);
            box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(110,90,240,0.18), 0 0 0 1px rgba(255,255,255,0.55),
                        0 14px 34px -6px rgba(70,48,190,0.28), 0 3px 8px rgba(70,48,190,0.12); }
  #l2 .ring { position: absolute; inset: 0; border-radius: 34px; pointer-events: none; }
  #l2 .sheen { position: absolute; top: -40%; height: 180%; width: 70px; left: 0; border-radius: 30px;
               background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.85), rgba(255,255,255,0)); filter: blur(3px); }
  #l2 .prog { position: absolute; left: 22px; right: 24px; bottom: 8px; height: 3px; border-radius: 3px; transform-origin: 0 50%;
              background: linear-gradient(90deg, #7B61FF, #A06BF2 60%, #D97757); box-shadow: 0 0 10px rgba(123,97,255,0.65), 0 0 3px rgba(217,119,87,0.6); }
  #l2 .mag { position: relative; width: 66px; height: 66px; margin: 0 10px 0 -4px; align-self: center; flex: none; transform: translateY(-3px); }
  #l2 .q { position: relative; color: rgb(86, 64, 232); }
  #l2 .caret { position: absolute; top: 0.04em; left: 0; width: 4.5px; height: 0.78em; border-radius: 3px; background: rgb(110, 86, 246); }
</style>
<div class="row"><span class="hc"></span><span class="gap"></span>
  <span class="field"><span class="clip"><span class="bg"><span class="sheen"></span><span class="prog"></span></span><span class="ring"></span>
    <svg class="mag" viewBox="0 0 52 52"><defs><linearGradient id="magG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6BFF"/><stop offset="0.65" stop-color="#6A4FF2"/><stop offset="1" stop-color="#D97757"/></linearGradient></defs>
      <g class="mg"><circle class="lensC" cx="22" cy="22" r="12.5" fill="none" stroke="url(#magG)" stroke-width="4.6" stroke-linecap="round" transform="rotate(-90 22 22)"/>
      <path class="lensH" d="M31.5 31.5 L41 41" fill="none" stroke="url(#magG)" stroke-width="4.6" stroke-linecap="round"/>
      <path class="lensG" d="M15.5 18.5 A7.5 7.5 0 0 1 20 14" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2.4" stroke-linecap="round"/></g></svg>
    <span class="q">​<span class="caret"></span></span></span></span></div>`;
stage.appendChild(l2);
const row = l2.querySelector('.row'), hcEl = l2.querySelector('.hc'), qEl = l2.querySelector('.q'), gapEl = l2.querySelector('.gap');
const clipEl = l2.querySelector('.clip'), bgEl = l2.querySelector('.bg'), ringEl = l2.querySelector('.ring');
const sheen = l2.querySelector('.sheen'), prog = l2.querySelector('.prog'), caretEl = l2.querySelector('.caret');
const lensC = l2.querySelector('.lensC'), lensH = l2.querySelector('.lensH'), lensG = l2.querySelector('.lensG'), mg = l2.querySelector('.mg');
const HCs = Array.from('healthcare').map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; hcEl.appendChild(s); return s; });
const Qs = Array.from('search').map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; qEl.insertBefore(s, qEl.querySelector('.caret')); return s; });
const C_LEN = 2 * Math.PI * 12.5, H_LEN = Math.hypot(9.5, 9.5);
lensC.setAttribute('stroke-dasharray', C_LEN.toFixed(2)); lensH.setAttribute('stroke-dasharray', H_LEN.toFixed(2));
let FW = null, GAP = 30, BASE_DY = 0;
function measure2() {
  l2.style.transform = 'none'; clipEl.style.width = 'auto';
  FW = clipEl.getBoundingClientRect().width;            // full field width with "search" typed
  const probe = document.createElement('span'); probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  hcEl.appendChild(probe); row.style.top = '0px'; BASE_DY = probe.getBoundingClientRect().top; hcEl.removeChild(probe);
}
const TYPE0 = 504.2, TYPE_DT = 1.05;
function renderL2(f) {
  if (FW === null) measure2();
  // field opening (layout width) and the glass body's spring
  const po = ease.inOutCubic(clamp((f - 499) / 6.5));
  const ph = clamp((f - 499) / 4.5), spring = ph >= 1 ? 1 : 1 + 1.7 * Math.pow(ph - 1, 3) + 0.7 * Math.pow(ph - 1, 2);
  gapEl.style.display = 'inline-block'; gapEl.style.width = (GAP * po).toFixed(2) + 'px';
  clipEl.style.width = (FW * po).toFixed(2) + 'px';
  clipEl.style.visibility = po > 0.002 ? 'visible' : 'hidden';
  bgEl.style.opacity = clamp((f - 499) / 2.5).toFixed(3);
  bgEl.style.transform = `scaleY(${(0.35 + 0.65 * spring).toFixed(4)})`;
  // focus ring pulse when the field takes focus
  const rp = clamp((f - 503) / 6);
  ringEl.style.boxShadow = f >= 503 ? `0 0 0 ${(1 + 7 * ease.outCubic(rp)).toFixed(2)}px rgba(118,96,250,${(0.32 * (1 - rp)).toFixed(3)})` : 'none';
  // centre the whole line on cx at baseline 574 (it glides as the field opens)
  const w = row.offsetWidth;
  row.style.left = (L2.cx - w / 2).toFixed(2) + 'px';
  row.style.top = (L2.base - BASE_DY).toFixed(2) + 'px';
  l2.style.transform = `scale(${kf(f, L2.S)})`;
  // "healthcare": letters ripple up, violet ink darkening to navy
  HCs.forEach((s, k) => {
    const t0 = 495 + k * 0.5, u = clamp((f - t0) / 6), e = ease.outCubic(u);
    s.style.opacity = clamp((f - t0) / 2.5).toFixed(3);
    s.style.transform = `translateY(${(24 * (1 - e)).toFixed(2)}px)`;
    const bl = 6 * (1 - e); s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
    s.style.color = rgba(kf(f, [[t0, V2], [t0 + 8, [108, 94, 222]], [t0 + 13, [70, 63, 138]], [518, [31, 31, 62]], [522, INK]]));
  });
  // magnifier draws itself, then gives a small settle once the query is in
  const dc = ease.inOutCubic(clamp((f - 501.5) / 4)), dh = ease.outCubic(clamp((f - 504.5) / 2.2));
  lensC.setAttribute('stroke-dashoffset', (C_LEN * (1 - dc)).toFixed(2));
  lensH.setAttribute('stroke-dashoffset', (H_LEN * (1 - dh)).toFixed(2));
  lensG.style.opacity = clamp((f - 505) / 2).toFixed(3);
  const wig = kf(f, [[511, 0], [512.5, -14], [514, 7], [515.5, -2.5], [517, 0]]);
  const pop = kf(f, [[511, 1], [512.5, 1.12], [514.5, 0.97], [516, 1]]);
  mg.setAttribute('transform', `translate(22 22) rotate(${wig.toFixed(2)}) scale(${pop.toFixed(4)}) translate(-22 -22)`);
  // typing
  let typed = 0;
  Qs.forEach((s, k) => {
    const t0 = TYPE0 + k * TYPE_DT, u = clamp((f - t0) / 2);
    if (f >= t0) typed = k + 1;
    s.style.display = f >= t0 ? 'inline-block' : 'none';
    s.style.opacity = clamp((f - t0) / 0.8).toFixed(3);
    s.style.transform = `translateY(${(7 * (1 - ease.outCubic(u))).toFixed(2)}px)`;
    const bl = 2.5 * (1 - u); s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
  });
  // caret: solid while typing, then a soft blink, gone once the search runs
  const tEnd = TYPE0 + 5 * TYPE_DT + 1;
  let ca = f < 502.5 ? 0 : f <= tEnd ? 1 : 0.5 + 0.5 * Math.cos((f - tEnd) / 7.5 * 2 * Math.PI);
  if (f > 516) ca = 0;
  caretEl.style.opacity = ca.toFixed(3);
  const lastQ = Qs[Math.max(0, typed - 1)];
  caretEl.style.left = (typed ? lastQ.offsetLeft + lastQ.offsetWidth + 4 : 0).toFixed(1) + 'px';
  // sheen across the glass and the progress line along its base ("searching")
  const sp = 0.5 - 0.5 * Math.cos(Math.PI * clamp((f - 510.5) / 5));
  sheen.style.transform = `translateX(${(-90 + (FW + 180) * sp).toFixed(1)}px) rotate(18deg)`;
  sheen.style.opacity = (f >= 510.5 && f <= 516) ? 1 : 0;
  const pp = ease.inOutCubic(clamp((f - 510) / 5.5));
  prog.style.transform = `scaleX(${pp.toFixed(4)})`;
  prog.style.opacity = (f < 510 ? 0 : 1 - clamp((f - 516) / 3)).toFixed(3);
}
window.renderFrame = async (f) => {
  await setImg(document.getElementById('bg'), `../../plates/S05_lavender_titles/bg_${String(f).padStart(4, '0')}.jpg`);
  line1.el.style.display = f <= 496 ? 'block' : 'none';
  l2.style.display = f >= 495 ? 'block' : 'none';
  if (f <= 496) line1.render(f);
  if (f >= 495) renderL2(f);
};
window.sceneReady = document.fonts.ready;
</script>
</body></html>
