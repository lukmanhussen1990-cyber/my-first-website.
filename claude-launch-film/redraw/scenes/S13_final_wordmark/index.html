  hk.rimPath.setAttribute('d', heartPath(HK.cx, HK.cy, s)); hk.rimPath.setAttribute('stroke-width', (6 + 10 * u).toFixed(2));

  hk.pim.style.transform = `translateY(${(-560 - 2.4 * (f - HK.iris[0])).toFixed(2)}px)`;   // the wallpaper drifts up slowly

  KT.hops.forEach(h => { const w = clamp((f - h) / 11); if (w > 0 && w < 1) { ky -= 24 * Math.sin(Math.PI * w); const land = clamp((f - h - 9) / 4); ksy *= 1 - 0.05 * Math.sin(Math.PI * land); ksx *= 1 + 0.04 * Math.sin(Math.PI * land); } });

function renderSticker(f) {

}
// the lockup on the wallpaper: the wordmark takes a raspberry sticker outline, the mark a white die-cut border
function styleLockup(f) {

  LK.word.style.filter = a > 0.001 ? `drop-shadow(0 6px 8px rgba(173,20,87,${(0.35 * a).toFixed(3)}))` : 'none';
  LK.mark.setAttribute('stroke', '#fff'); LK.mark.setAttribute('stroke-linejoin', 'round'); LK.mark.setAttribute('paint-order', 'stroke');

// the Claude mark gives a happy little wiggle as the credit sticker lands
function markSpin(f) { const t = f - (CC.t0 + 1); return t <= 0 ? 0 : 11 * Math.exp(-t / 6) * Math.sin(2 * Math.PI * t / 8); }

// the S01 opening mark at frame 1 (SPARK_R 4.0 x 1.35 tip radius, 16 deg, centre 962/539.5) is where the film loops to
const LOOP = { x: 962.0, y: 539.5, rotEnd: 360 + 16 - 27.4, rotStart: 1414, tipEnd: 3.5 };   // one turn, landing one opening-frame short of 16 deg
function sparkTip(f) {
  if (f < 1430) return lerp(52.2, 58, ease.inOutCubic(clamp((f - 1414) / 16)));
  return 58 - (58 - LOOP.tipEnd) * Math.pow(clamp((f - 1430) / 23), 4);
}
function sparkRot(f) {                                                        // winds up to S01's opening spin rate (27.4 deg/frame)
  const n = 1453 - LOOP.rotStart, total = LOOP.rotEnd, p = 27.4 * n / total;
  return total * Math.pow(clamp((f - LOOP.rotStart) / n), p);
}

window.renderFrame = async (f) => {
  const irisCover = clamp((f - HK.iris[0]) / (HK.iris[1] - HK.iris[0]));
  await skyCam(stage, f, { shade: 1 - irisCover });
  if (!LK) { await ClaudeLockup.ready(); await document.fonts.load(`500 ${CC.size}px 'Kawaii'`); await document.fonts.load(`700 ${CC.size}px 'Kawaii'`);
    LK = new ClaudeLockup(stage, { cx: 960, cy: 524, size: 150, burst: 58, gap: 32, t0: 1268 }); }
  if (!hk) { buildHK(); stage.appendChild(LK.root); stage.appendChild(hk.layer); stage.appendChild(document.getElementById('spark'));
    await Promise.all([hk.pim.decode(), hk.kit.decode()]).catch(() => {}); }
  const P = pose(f);
  const wipe = 1 - ease.inOutCubic(clamp((f - 1402) / 14));                 // the wordmark folds back into the mark
  LK.render(f, { scale: P.sc, dy: P.dy, wipe, spin: markSpin(f) });
  styleLockup(f);
  hk.layer.style.display = f >= HK.iris[0] && f < 1412 ? 'block' : 'none';
  renderHK(f);
  // from 1414 the mark is drawn here: it glides back to the centre, then winds down into the opening's point of light
  const sp = document.getElementById('sp');
  if (f < 1414) { sp.setAttribute('d', ''); LK.mark.style.visibility = 'visible'; return; }
  LK.mark.style.visibility = 'hidden';
  const mx0 = 960 + (LK.markX - 960) * P.sc, my0 = 524 + P.dy;               // the lockup mark's place on screen
  const g = ease.inOutQuint(clamp((f - 1414) / 18));
  const x = lerp(mx0, LOOP.x, g), y = lerp(my0, LOOP.y, g);
  const tip = sparkTip(f), rot = sparkRot(f);
  sp.setAttribute('d', CL_BURST_D);
  sp.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(3)}) scale(${tip.toFixed(4)})`);
  // the opening's motion softness (S01): blur grows with the speed of the spin and the shrink
  const dR = Math.abs(sparkTip(f + 0.5) - sparkTip(f - 0.5)) / 1.35, dA = Math.abs(sparkRot(f + 0.5) - sparkRot(f - 0.5)) * Math.PI / 180 * tip / 1.35;
  const sd = 1.35 * Math.min(2, 0.3 + 0.05 * Math.hypot(dR, dA));
  document.getElementById('sbg').setAttribute('stdDeviation', (sd / Math.max(tip, 1)).toFixed(4));
  sp.setAttribute('filter', sd > 0.2 ? 'url(#sb)' : '');
};
window.sceneReady = document.fonts.ready;
</script>
