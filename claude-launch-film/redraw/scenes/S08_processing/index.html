    let col = mixc(LIGHT, [200, 190, 255], 0.0);
    if (f > t0 + 6 && done < 0.5) col = mixc(LIGHT, BRIGHT, gauss(R.lx[k] - shimP, 60));
    if (done > 0) col = mixc(col, [206, 198, 240], clamp(done));
    if (isDot) {
      const wv = Math.max(0, Math.sin(2 * Math.PI * (f - t0) / 20 - (k - R.letters.length) * 1.0));
      op2 *= done > 0.5 ? 1 : 0.35 + 0.65 * wv; ty -= done > 0.5 ? 0 : 5 * wv;
    }
    s.style.transform = `translateY(${ty.toFixed(2)}px)`;
    s.style.opacity = op2.toFixed(3);
    s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
    s.style.color = rgba(col);
    s.style.textShadow = done < 0.5 ? `0 0 18px rgba(170,140,255,${(0.45 * op2).toFixed(2)})` : 'none';
  });
}

// ------------------------------------------------------------------ frame
window.renderFrame = async (f) => {
  if (!M) measure();
  await setImg($('bg'), `../../plates/S08_processing/bg_${String(f).padStart(4, '0')}.jpg`);
  const cam = $('cam');
  const lift = CAM_B * ease.inOutCubic(clamp((f - 785) / 10));
  const zoom = 1 + 0.07 * ease.inOutCubic(clamp((f - 838) / 24));
  const panX = kf(f, [[845, 0], [848, 3], [851, 8], [854, 15], [857, 25], [860, 41], [862, 55]]);
  const intro = ease.outCubic(clamp((f - 721) / 7));
  cam.style.transform = `translate(${panX.toFixed(2)}px, ${(lift + 14 * (1 - intro)).toFixed(2)}px) scale(${(zoom * (0.97 + 0.03 * intro)).toFixed(4)})`;
  cam.style.transformOrigin = `960px ${(HUB.y).toFixed(0)}px`;
  cam.style.opacity = clamp((f - 721) / 4).toFixed(3);
  // dot grid breathing behind everything, drifting up slowly
  $('grid').setAttribute('opacity', (0.13 * clamp((f - 724) / 10)).toFixed(3));
  $('grid').setAttribute('y', (-(f - 719) * 0.35 % 30).toFixed(2));
  // ---- step 1: spine draws itself, top to bottom
  const spineOp = 1 - 0.72 * ease.inOutCubic(clamp((f - 786) / 9));
  spine.setAttribute('opacity', spineOp.toFixed(3));
  VERT.forEach((v, i) => {
    const p = clamp((f - 726 - i * 1.6) / 7);
    draw(v.body, p); draw(v.wl, clamp((p - 0.3) / 0.7)); draw(v.wr, clamp((p - 0.3) / 0.7));
    v.body.setAttribute('fill', `rgba(255,255,255,${(0.10 * clamp((p - 0.6) / 0.4)).toFixed(3)})`);
    if (v.disc) v.disc.setAttribute('opacity', clamp((f - 731 - i * 1.6) / 4).toFixed(3));
  });
  draw(sacrum, clamp((f - 734) / 8)); sacrum.setAttribute('fill', `rgba(255,255,255,${(0.07 * clamp((f - 739) / 4)).toFixed(3)})`);
  // scan brackets converge on the spine, then let go in step 2
  const sbOut = clamp((f - 784) / 4);
  SB.render({ x0: 838, y0: 330, x1: 1084, y1: 664 }, { t: clamp((f - 728) / 7), spread: 70, op: clamp((f - 728) / 2) * (1 - sbOut),
    flash: gauss(f - 742, 1.3) });
  // scan beam: two passes
  const passes = [[731, 746], [757, 771]];
  let by = null, bop = 0;
  for (const [a, b] of passes) if (f >= a - 0.5 && f <= b + 1.5) { const t = ease.inOutCubic(clamp((f - a) / (b - a))); by = 312 + t * 350; bop = Math.min(clamp((f - a + 0.5) / 1.5), 1 - clamp((f - b) / 1.5)) * (a === 731 ? 1 : 0.7); }
  beamLine.style.display = beamBand.style.display = by === null ? 'none' : 'block';
  if (by !== null) { beamLine.setAttribute('y', (by - 1.2).toFixed(1)); beamBand.setAttribute('y', (by - 64).toFixed(1)); beamLine.setAttribute('opacity', bop.toFixed(3)); beamBand.setAttribute('opacity', bop.toFixed(3)); }
  // ---- the sore spot ignites when the first pass reaches it, then keeps pulsing (it becomes the hub)
  const hIn = clamp((f - 741.5) / 3);
  hot.setAttribute('opacity', hIn.toFixed(3));
  hotCore.setAttribute('r', (7.5 * (0.6 + 0.4 * backOut(hIn, 2.5)) + (f > 786 ? 1.5 * ease.inOutCubic(clamp((f - 786) / 8)) : 0)).toFixed(2));
  hotHalo.setAttribute('r', (24 + 4 * Math.sin((f - 742) / 7)).toFixed(2));
  hotRings.forEach((c, j) => {
    const ph = ((f - 742 - j * 6) % 18 + 18) % 18 / 18;
    c.setAttribute('r', (9 + 44 * ease.outCubic(ph)).toFixed(2));
    c.setAttribute('opacity', (f >= 742 + j * 6 ? 0.85 * (1 - ph) : 0).toFixed(3));
  });
  // ---- callouts (step 1)
  const cOut = clamp((f - 781) / 5);
  CALL.forEach(c => {
    const p = clamp((f - c.t0) / 5);
    draw(c.line, p); c.line.setAttribute('opacity', (1 - cOut).toFixed(3)); c.dot.setAttribute('opacity', (clamp((f - c.t0) / 1.5) * (1 - cOut)).toFixed(3));
    const pp = clamp((f - c.t0 - 3.5) / 5);
    c.p.style.display = pp > 0 && cOut < 1 ? 'flex' : 'none';
    const pw = c.p.offsetWidth;
    c.p.style.left = (c.side > 0 ? c.at[0] : c.at[0] - pw).toFixed(1) + 'px'; c.p.style.top = (c.at[1] - 20).toFixed(1) + 'px';
    c.p.style.opacity = (clamp(pp * 2) * (1 - cOut)).toFixed(3);
    c.p.style.transformOrigin = c.side > 0 ? '0 50%' : '100% 50%';
    c.p.style.transform = `translateX(${(c.side * 14 * (1 - ease.outCubic(pp))).toFixed(2)}px) scale(${(0.85 + 0.15 * backOut(pp, 2)).toFixed(4)})`;
  });
  // ---- step 2: the network
  NET.forEach((n, i) => {
    const p = ease.inOutCubic(clamp((f - n.t0) / 6));
    draw(n.edge, p); n.edge.setAttribute('opacity', p > 0 ? 1 : 0);
    const arr = clamp((f - n.t0 - 5) / 5);
    n.node.setAttribute('opacity', clamp(arr * 3).toFixed(3));
    n.node.setAttribute('r', (6 * (0.3 + 0.7 * backOut(arr, 2.6))).toFixed(2));
    const rph = ((f - n.t0 - 5) % 26 + 26) % 26 / 26;
    n.ring.setAttribute('r', (8 + 16 * ease.outCubic(rph)).toFixed(2));
    n.ring.setAttribute('opacity', (arr >= 1 ? 0.6 * (1 - rph) : 0).toFixed(3));
    // light pulses travelling hub -> node
    n.ps.forEach((c, j) => {
      const t = ((f - n.t0 - 8 - j * 11) % 22 + 22) % 22 / 22, on = f >= n.t0 + 8 + j * 11;
      const [x, y] = qpt(n.q, ease.inOutQuad(t));
      c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
      c.setAttribute('opacity', on ? (Math.sin(Math.PI * t) * 0.95).toFixed(3) : 0);
    });
    // label
    const lp = clamp((f - n.t0 - 6) / 5);
    n.p.style.display = lp > 0 ? 'flex' : 'none';
    const pw = n.p.offsetWidth;
    n.p.style.left = (n.side > 0 ? n.x + 22 : n.x - 22 - pw).toFixed(1) + 'px'; n.p.style.top = (n.y - 20).toFixed(1) + 'px';
    n.p.style.opacity = clamp(lp * 2).toFixed(3);
    n.p.style.transformOrigin = n.side > 0 ? '0 50%' : '100% 50%';
    n.p.style.transform = `translateX(${(n.side * 16 * (1 - ease.outCubic(lp))).toFixed(2)}px) scale(${(0.82 + 0.18 * backOut(lp, 2)).toFixed(4)})`;
  });
  LINKEL.forEach((l, j) => { const p = ease.inOutCubic(clamp((f - 812 - j * 2.4) / 7)); draw(l, p); l.setAttribute('opacity', p > 0 ? 1 : 0); });
  // gentle life in the network once it is built
  $('edges').setAttribute('transform', '');
  // ---- status rows
  const doneA = clamp((f - 781) / 7);
  const mv = ease.inOutCubic(clamp((f - 783) / 8));
  RA.r.style.display = f >= 722 ? 'flex' : 'none';
  renderRow(RA, f, 724, { y: lerp(BASE_ACTIVE, BASE_DONE, mv), scale: lerp(1, 0.56, mv), op: lerp(1, 0.78, mv), done: doneA });
  RB.r.style.display = f >= 786 ? 'flex' : 'none';
  if (f >= 786) renderRow(RB, f, 787.5, { y: BASE_ACTIVE, done: 0 });
  // ---- progress
  const pg = kf(f, [[726, 0], [782, 0.5, 'inOutCubic'], [789, 0.52], [858, 1.0, 'inOutCubic']]);
  const PW = 560, px0 = 960 - PW / 2, py = 820;
  prog.style.left = px0 + 'px'; prog.style.top = py + 'px';
  prog.style.opacity = clamp((f - 726) / 5).toFixed(3);
  prog.querySelector('.track').style.width = PW + 'px';
  prog.querySelector('.fill').style.width = (PW * pg).toFixed(1) + 'px';
  prog.querySelector('.head').style.left = (PW * pg).toFixed(1) + 'px';
  prog.querySelector('.head').style.opacity = (pg > 0.01 ? 1 : 0);
  const pct = prog.querySelector('.pct'); pct.textContent = Math.round(pg * 100) + '%'; pct.style.left = (PW + 18) + 'px';
  prog.querySelector('.stp').textContent = f < 786 ? 'STEP 1 / 2' : 'STEP 2 / 2';
  prog.querySelector('.fill').style.boxShadow = `0 0 ${(12 + 16 * gauss(f - 858, 2)).toFixed(1)}px rgba(${f > 850 ? '229,138,104' : '160,110,255'},0.65)`;
};
window.sceneReady = document.fonts.ready;
</script>
