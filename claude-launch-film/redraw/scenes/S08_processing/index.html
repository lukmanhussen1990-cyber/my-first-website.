  const hx = DOTF[0] + panX, hy = DOTF[1] + lift, ux0 = LINK.x0 + panX, ux1 = LINK.x1 + panX, uy = LINK.y;
  LINK.under.setAttribute('d', `M ${ux0.toFixed(1)} ${uy} L ${ux1.toFixed(1)} ${uy}`);

  LINK.flow.setAttribute('stroke-dashoffset', (1 - pf).toFixed(4)); LINK.flow.style.display = pf > 0 ? 'block' : 'none';
  if (pf > 0 && pf < 1) { const pt = LINK.flow.getPointAtLength(LINK.flow.getTotalLength() * pf); LINK.head.setAttribute('cx', pt.x); LINK.head.setAttribute('cy', pt.y); LINK.head.style.display = 'block'; }
  else if (pu > 0 && pu < 1) { LINK.head.setAttribute('cx', ux0 + (ux1 - ux0) * pu); LINK.head.setAttribute('cy', uy); LINK.head.style.display = 'block'; }
  else LINK.head.style.display = 'none';
  const rp2 = clamp((f - 814) / 14);
  LINK.rip.setAttribute('cx', hx); LINK.rip.setAttribute('cy', hy); LINK.rip.setAttribute('r', (40 + 70 * expoOut(rp2)).toFixed(2));
  LINK.rip.style.opacity = rp2 > 0 && rp2 < 1 ? (0.9 * (1 - rp2)).toFixed(3) : 0;
  const lkOut = f < 784 ? 0 : 1; $('link').style.opacity = lkOut;
};
