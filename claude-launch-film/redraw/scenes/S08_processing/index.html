</head><body>
<div id="stage"><img class="plate" id="bg"><div id="grp"></div></div>
<script>
// S08 (f719-862), third design pass at the client's request (professional, restrained): an editorial status frame.
// A small tracked label "CLAUDE IS THINKING" with Claude's turning spark sits above a large serif headline (the
// serif Claude's replies use in this film). Headline words rise out of clean masks with a long exponential ease;
// the ellipsis steps; at the change the first line rises away word by word as the second rises in, like a ticker.
// No glows, particles or flares. Timing and the closing pan follow the reference.
const $ = id => document.getElementById(id);
const BURST_D = "M -0.4729 -0.8811 L -0.5288 -0.8054 L -0.5252 -0.7658 L -0.5089 -0.7045 L -0.4477 -0.6054 L -0.3432 -0.4253 L -0.2459 -0.2469 L -0.2297 -0.2217 L -0.2315 -0.2163 L -0.2441 -0.2073 L -0.2783 -0.2361 L -0.4423 -0.3550 L -0.6819 -0.5388 L -0.7143 -0.5442 L -0.7630 -0.5460 L -0.8134 -0.4919 L -0.8008 -0.4145 L -0.7702 -0.3766 L -0.7252 -0.3478 L -0.6153 -0.2667 L -0.2387 -0.0163 L -0.2189 0.0017 L -0.2225 0.0126 L -0.2585 0.0144 L -0.4315 -0.0055 L -0.5756 -0.0127 L -0.6783 -0.0217 L -0.8621 -0.0325 L -0.9143 -0.0379 L -0.9504 -0.0127 L -0.9540 0.0126 L -0.9125 0.0666 L -0.8729 0.0756 L -0.5071 0.0936 L -0.3090 0.0972 L -0.2297 0.1026 L -0.2225 0.1135 L -0.2279 0.1279 L -0.2387 0.1369 L -0.5918 0.3333 L -0.7360 0.4324 L -0.7558 0.4522 L -0.7612 0.5098 L -0.7252 0.5441 L -0.6369 0.5333 L -0.1486 0.2162 L -0.1450 0.2180 L -0.1432 0.2288 L -0.2207 0.3189 L -0.3252 0.4576 L -0.5053 0.6846 L -0.5414 0.7369 L -0.5450 0.7873 L -0.4891 0.8143 L -0.4585 0.8017 L -0.3270 0.6612 L -0.0513 0.2846 L -0.0405 0.2810 L -0.0369 0.2882 L -0.0513 0.3405 L -0.0711 0.4810 L -0.1270 0.7549 L -0.1504 0.8612 L -0.1270 0.9152 L -0.0801 0.9513 L -0.0261 0.9315 L -0.0009 0.9026 L 0.0514 0.3441 L 0.0604 0.3387 L 0.0658 0.3405 L 0.1523 0.4900 L 0.2334 0.6143 L 0.3649 0.8017 L 0.4190 0.8107 L 0.4604 0.7963 L 0.4640 0.7927 L 0.4748 0.7711 L 0.4676 0.6918 L 0.4640 0.6810 L 0.2532 0.3675 L 0.2532 0.3513 L 0.2640 0.3513 L 0.4784 0.5351 L 0.6478 0.6612 L 0.6712 0.6630 L 0.6946 0.6306 L 0.6856 0.5855 L 0.4946 0.4071 L 0.3451 0.2738 L 0.2550 0.1855 L 0.2568 0.1747 L 0.2694 0.1747 L 0.3703 0.2017 L 0.7883 0.3008 L 0.8838 0.2522 L 0.8892 0.2216 L 0.8856 0.2108 L 0.8532 0.1675 L 0.7919 0.1279 L 0.5811 0.1117 L 0.3991 0.1099 L 0.2658 0.0972 L 0.2622 0.0918 L 0.2712 0.0864 L 0.5289 0.0252 L 0.7379 -0.0163 L 0.8532 -0.0451 L 0.8604 -0.0505 L 0.8838 -0.1082 L 0.8766 -0.1370 L 0.8135 -0.1676 L 0.5523 -0.1226 L 0.3397 -0.0757 L 0.3199 -0.0739 L 0.3126 -0.0829 L 0.3775 -0.1946 L 0.4838 -0.3370 L 0.6207 -0.5117 L 0.6460 -0.6000 L 0.5901 -0.6829 L 0.5090 -0.6847 L 0.4712 -0.6559 L 0.3955 -0.5766 L 0.3415 -0.5154 L 0.2190 -0.3622 L 0.1469 -0.2649 L 0.1235 -0.2415 L 0.1091 -0.2415 L 0.1072 -0.2487 L 0.1775 -0.6090 L 0.2045 -0.7928 L 0.1667 -0.8451 L 0.1253 -0.8649 L 0.0712 -0.8307 L 0.0658 -0.8253 L 0.0388 -0.7604 L 0.0154 -0.4901 L -0.0045 -0.3280 L -0.0135 -0.1892 L -0.0243 -0.1874 L -0.0333 -0.2037 L -0.0531 -0.2739 L -0.2117 -0.5820 L -0.3306 -0.8523 L -0.3666 -0.8829 L -0.4423 -0.8919 Z";
const expoOut = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const exitE = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const CX = 960, BASE = 596, SIZE = 78;
const grp = $('grp');
// overline: spark + label
const over = document.createElement('div'); over.className = 'over';
over.innerHTML = `<svg width="22" height="22" viewBox="-1 -1 2 2" style="overflow:visible"><path d="${BURST_D}" fill="#E08A69"/></svg><div class="lbl"><span>CLAUDE IS THINKING</span></div>`;
grp.appendChild(over);
const spark = over.querySelector('svg'), lbl = over.querySelector('.lbl span');
// headline lines: one masked box per word
function makeLine(text) {
  const el = document.createElement('div'); el.className = 'head'; el.style.fontSize = SIZE + 'px'; grp.appendChild(el);
  const meas = document.createElement('span'); meas.style.cssText = `visibility:hidden;white-space:pre;font-family:'Claude Serif';font-weight:500;font-size:${SIZE}px;letter-spacing:-0.012em;line-height:1`;
  meas.textContent = text + '...'; el.appendChild(meas);
  const node = meas.firstChild, r0 = meas.getBoundingClientRect(), rg = document.createRange();
  const probe = document.createElement('span'); probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline'; meas.appendChild(probe);
  const bOff = probe.getBoundingClientRect().top - r0.top; meas.removeChild(probe);
  const words = []; let i = 0;
  for (const m of text.matchAll(/\S+/g)) { rg.setStart(node, m.index); rg.setEnd(node, m.index + m[0].length); const b = rg.getBoundingClientRect(); words.push({ t: m[0], x: b.left - r0.left, w: b.width }); }
  const dots = [0, 1, 2].map(k => { rg.setStart(node, text.length + k); rg.setEnd(node, text.length + k + 1); const b = rg.getBoundingClientRect(); return { x: b.left - r0.left, w: b.width }; });
  const width = r0.width; el.removeChild(meas);
  words.forEach(w => { const box = document.createElement('div'); box.className = 'w'; box.style.left = w.x + 'px'; const s = document.createElement('span'); s.textContent = w.t; box.appendChild(s); el.appendChild(box); w.box = box; w.s = s; });
  dots.forEach(d => { const s = document.createElement('div'); s.className = 'w'; s.style.left = d.x + 'px'; s.innerHTML = '<span>.</span>'; el.appendChild(s); d.box = s; d.s = s.firstChild; });
  return { el, words, dots, width, bOff };
}
let L1 = null, L2 = null;   // built after the serif has loaded (word positions are measured)
function renderLine(L, f, inT, outT, push, panX) {
  const top = BASE - L.bOff - 0.06 * SIZE;
  L.el.style.left = (CX - L.width / 2).toFixed(2) + 'px'; L.el.style.top = top.toFixed(2) + 'px';
  L.el.style.transformOrigin = `${(L.width / 2).toFixed(1)}px ${(L.bOff).toFixed(1)}px`;
  L.el.style.transform = `translateX(${panX.toFixed(2)}px) scale(${push.toFixed(5)})`;
  const H = 1.32 * SIZE;
  L.words.forEach((w, i) => {
    const a = inT + i * 2.6, pin = expoOut(clamp((f - a) / 22));
    const b = outT + i * 1.2, pout = outT ? exitE(clamp((f - b) / 9)) : 0;
    const y = (1 - pin) * H - pout * H;
    w.s.style.transform = `translateY(${y.toFixed(2)}px)`;
    w.box.style.visibility = (f >= a - 0.5 && pout < 1) ? 'visible' : 'hidden';
  });
  // ellipsis: rises in after the last word, then steps (one dot brightens at a time)
  const dIn = inT + L.words.length * 2.6 + 4;
  L.dots.forEach((d, k) => {
    const pin = expoOut(clamp((f - dIn - k * 1.5) / 18)), pout = outT ? exitE(clamp((f - outT - L.words.length * 1.2) / 9)) : 0;
    d.s.style.transform = `translateY(${((1 - pin) * H - pout * H).toFixed(2)}px)`;
    const step = Math.floor(((f - dIn - 14) / 7) % 4 + 4) % 4;
    d.s.style.opacity = f < dIn + 14 ? 1 : (step === 3 ? 1 : (k <= step ? 1 : 0.28));
    d.box.style.visibility = (f >= dIn - 0.5 && pout < 1) ? 'visible' : 'hidden';
  });
}
window.renderFrame = async (f) => {
  if (!L1) { await document.fonts.load("500 78px 'Claude Serif'"); await document.fonts.load("600 17px 'Inter'");
    L1 = makeLine('Analyzing the affected area'); L2 = makeLine('Mapping anatomical connections'); }
  await setImg($('bg'), `../../plates/S08_processing/bg_${String(f).padStart(4, '0')}.jpg`);
  const panX = kf(f, [[845, 0], [848, 3], [851, 8], [854, 15], [857, 25], [860, 41], [862, 55]]);
  // overline: spark turns in and keeps turning; the label wipes in from the left
  const oi = expoOut(clamp((f - 723) / 18));
  const ow = over.getBoundingClientRect().width;
  over.style.left = (CX - ow / 2 + panX).toFixed(2) + 'px'; over.style.top = (BASE - SIZE - 66).toFixed(2) + 'px';
  over.style.opacity = clamp((f - 723) / 6).toFixed(3);
  spark.style.transform = `rotate(${(-120 * (1 - oi) + 1.8 * (f - 723)).toFixed(2)}deg) scale(${(0.5 + 0.5 * oi).toFixed(4)})`;
  const lw = expoOut(clamp((f - 726) / 20));
  lbl.parentNode.style.clipPath = `inset(0 ${((1 - lw) * 100).toFixed(2)}% 0 0)`;
  lbl.style.transform = `translateX(${(-18 * (1 - lw)).toFixed(2)}px)`;
  // headlines: line 1 rises in, rises out at the change while line 2 rises in
  const push1 = 1 + 0.02 * clamp((f - 726) / 60), push2 = 1 + 0.02 * clamp((f - 786) / 76);
  L1.el.style.display = f <= 795 ? 'block' : 'none';
  if (f <= 795) renderLine(L1, f, 727, 779, push1, 0);
  L2.el.style.display = f >= 784 ? 'block' : 'none';
  if (f >= 784) renderLine(L2, f, 788.5, 0, push2, panX);
};
window.sceneReady = document.fonts.ready;
</script>
