<!doctype html>
<html><head><meta charset="utf-8">
<title>S01 opening</title>
<link rel="stylesheet" href="../../shared/base.css">
<script src="../../shared/lib.js"></script>
<script src="../../shared/components.js"></script>
<style>
  body { background: rgb(1, 3, 19); }
  #stage { background: rgb(1, 3, 19); }
  #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #spark { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
</style>
</head><body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <svg id="spark" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs><filter id="sb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="sbg" stdDeviation="0"/></filter></defs>
    <path id="sp" d="" fill="#fff"/>
  </svg>
</div>
<script>
// ---------------------------------------------------------------------------------------------
// S01 (frames 1-60): the client's orange starburst logo grows (in place of the reference's white four-point sparkle) at the centre of a navy field, then a
// scalloped (14-lobe) circular mask opens from the centre onto the aerial cloud plate while the
// sparkle turns into a dark cut-out that shrinks and spins away. All numbers measured on the
// reference frames (see rd/plates/S01_opening/tools/g1common.py for the mask fits).
// ---------------------------------------------------------------------------------------------
const NAVY = [1, 3, 19];
const SC = [962.0, 539.5];               // sparkle centre (stage px)
// sparkle tip radius (px) per frame
const SPARK_R = [[1, 4.0], [2, 17.6], [3, 25.8], [4, 32.3], [5, 37.2], [6, 41.5], [7, 45.4], [8, 48.4], [9, 51.4], [10, 53.9],
  [11, 56.0], [12, 58.2], [13, 59.7], [14, 61.9], [15, 63.4], [16, 64.9], [17, 65.8], [18, 67.0], [19, 67.6], [20, 68.8],
  [21, 69.2], [22, 70.0], [24, 69.8], [27, 70.2], [30, 70.8], [33, 71.0], [36, 70.9], [38, 70.4], [40, 69.8], [42, 69.0],
  [44, 68.8], [46, 66.0], [48, 64.0], [50, 59.5], [52, 56.0], [54, 51.0], [55, 48.0], [56, 43.5], [57, 38.5],
  [58, 31.5], [59, 23.5], [60, 15.5], [61, 0]];
// sparkle tip angle (deg, clockwise) per frame
const SPARK_ROT = [[1, 16], [2, 43.4], [3, 64.5], [4, 80.4], [5, 92.9], [6, 103.3], [7, 112.6], [8, 120.4], [9, 127.6],
  [10, 133.9], [11, 139.5], [12, 144.6], [13, 148.9], [14, 152.9], [15, 156.9], [16, 160.0], [17, 163.2], [18, 165.5],
  [19, 168.3], [20, 170.2], [21, 172.1], [22, 173.4], [23, 174.9], [24, 176.2], [25, 177.3], [26, 178.0], [27, 178.8],
  [28, 179.2], [29, 179.7], [31, 179.9], [33, 180.1], [34, 180.3], [35, 180.8], [36, 181.2], [37, 181.9], [38, 182.7],
  [39, 183.6], [40, 184.8], [41, 186.1], [42, 187.6], [43, 189.3], [44, 191.1], [45, 193.2], [46, 196.0], [47, 198.8],
  [48, 202.1], [49, 205.8], [50, 209.8], [51, 214.4], [52, 219.8], [53, 226.0], [54, 233.0], [55, 243.0], [56, 255.0],
  [57, 267.0], [58, 280.0], [59, 300.0], [60, 325.0]];
// solid fill grey while it turns from white to black, then black with decreasing opacity
const SPARK_GREY = [[21, 255], [22, 236], [23, 189], [24, 128], [25, 67], [26, 18], [27, 0]];
const SPARK_ALPHA = [[38, 1], [40, 0.98], [42, 0.965], [44, 0.94], [46, 0.925], [48, 0.895], [50, 0.86], [52, 0.83],
  [54, 0.79], [56, 0.73], [58, 0.68], [60, 0.59]];
// flower mask (14 lobes, lobe circle radius = 0.332 * Rmax), measured per frame
const N_LOBES = 14, Q = 0.332;
const RMAX = [[20, 0.0], [21, 38.0], [22, 63.0], [23, 100.8], [24, 152.6], [25, 213.6], [26, 271.9], [27, 322.3], [28, 364.9], [29, 400.8], [30, 431.6], [31, 457.9], [32, 480.7], [33, 500.9], [34, 518.9], [35, 535.0], [36, 549.3], [37, 562.5], [38, 574.0], [39, 584.4], [40, 594.1], [41, 602.6], [42, 610.8], [43, 619.6], [44, 629.3], [45, 639.8], [46, 651.3], [47, 664.4], [48, 679.2], [49, 696.2], [50, 715.8], [51, 738.3], [52, 765.5], [53, 797.6], [54, 836.0], [55, 882.0], [56, 939.0], [57, 1007.4], [58, 1096.0], [59, 1209.0], [60, 1344.0], [61, 1504.0]];
const MCX = [[42, 961.8], [43, 962.0], [44, 962.1], [45, 962.3], [46, 962.7], [47, 963.1], [48, 963.7], [49, 964.3],
  [50, 965.2], [51, 966.3], [52, 967.7], [53, 969.2], [54, 971.1], [55, 973.4], [56, 976.5], [57, 978.6], [58, 980], [60, 980]];
const MCY = 540.0;
const lin = (keys, f) => kf(f, keys);
const PHI = [[21, 3.88], [22, 5.13], [23, 6.38], [24, 7.61], [25, 8.70], [26, 9.80], [27, 10.96], [28, 12.15], [29, 13.37], [30, 14.58], [31, 15.81], [32, 17.08], [33, 18.35], [34, 19.63], [35, 20.92], [36, 22.24], [37, 23.55], [38, 24.85], [39, 26.18], [40, 27.53], [41, 28.87], [42, 30.16], [43, 31.49], [44, 32.82], [45, 34.13], [46, 35.44], [47, 36.76], [48, 38.07], [49, 39.36], [50, 40.59], [51, 41.83], [52, 43.10], [53, 44.34], [54, 45.52], [55, 46.77], [56, 47.96], [57, 49.05], [58, 50.20], [59, 51.35], [60, 52.50], [61, 53.65]];
const phiDeg = f => kf(f, PHI);

// Opening logo: the client's starburst mark (vectorised from their file, unit radius = longest ray)
// replaces the reference's four-point sparkle; it follows the sparkle's measured size/spin/fade.
const BURST_PATH = 'M -0.4729 -0.8811 L -0.5288 -0.8054 L -0.5252 -0.7658 L -0.5089 -0.7045 L -0.4477 -0.6054 L -0.3432 -0.4253 L -0.2459 -0.2469 L -0.2297 -0.2217 L -0.2315 -0.2163 L -0.2441 -0.2073 L -0.2783 -0.2361 L -0.4423 -0.3550 L -0.6819 -0.5388 L -0.7143 -0.5442 L -0.7630 -0.5460 L -0.8134 -0.4919 L -0.8008 -0.4145 L -0.7702 -0.3766 L -0.7252 -0.3478 L -0.6153 -0.2667 L -0.2387 -0.0163 L -0.2189 0.0017 L -0.2225 0.0126 L -0.2585 0.0144 L -0.4315 -0.0055 L -0.5756 -0.0127 L -0.6783 -0.0217 L -0.8621 -0.0325 L -0.9143 -0.0379 L -0.9504 -0.0127 L -0.9540 0.0126 L -0.9125 0.0666 L -0.8729 0.0756 L -0.5071 0.0936 L -0.3090 0.0972 L -0.2297 0.1026 L -0.2225 0.1135 L -0.2279 0.1279 L -0.2387 0.1369 L -0.5918 0.3333 L -0.7360 0.4324 L -0.7558 0.4522 L -0.7612 0.5098 L -0.7252 0.5441 L -0.6369 0.5333 L -0.1486 0.2162 L -0.1450 0.2180 L -0.1432 0.2288 L -0.2207 0.3189 L -0.3252 0.4576 L -0.5053 0.6846 L -0.5414 0.7369 L -0.5450 0.7873 L -0.4891 0.8143 L -0.4585 0.8017 L -0.3270 0.6612 L -0.0513 0.2846 L -0.0405 0.2810 L -0.0369 0.2882 L -0.0513 0.3405 L -0.0711 0.4810 L -0.1270 0.7549 L -0.1504 0.8612 L -0.1270 0.9152 L -0.0801 0.9513 L -0.0261 0.9315 L -0.0009 0.9026 L 0.0514 0.3441 L 0.0604 0.3387 L 0.0658 0.3405 L 0.1523 0.4900 L 0.2334 0.6143 L 0.3649 0.8017 L 0.4190 0.8107 L 0.4604 0.7963 L 0.4640 0.7927 L 0.4748 0.7711 L 0.4676 0.6918 L 0.4640 0.6810 L 0.2532 0.3675 L 0.2532 0.3513 L 0.2640 0.3513 L 0.4784 0.5351 L 0.6478 0.6612 L 0.6712 0.6630 L 0.6946 0.6306 L 0.6856 0.5855 L 0.4946 0.4071 L 0.3451 0.2738 L 0.2550 0.1855 L 0.2568 0.1747 L 0.2694 0.1747 L 0.3703 0.2017 L 0.7883 0.3008 L 0.8838 0.2522 L 0.8892 0.2216 L 0.8856 0.2108 L 0.8532 0.1675 L 0.7919 0.1279 L 0.5811 0.1117 L 0.3991 0.1099 L 0.2658 0.0972 L 0.2622 0.0918 L 0.2712 0.0864 L 0.5289 0.0252 L 0.7379 -0.0163 L 0.8532 -0.0451 L 0.8604 -0.0505 L 0.8838 -0.1082 L 0.8766 -0.1370 L 0.8135 -0.1676 L 0.5523 -0.1226 L 0.3397 -0.0757 L 0.3199 -0.0739 L 0.3126 -0.0829 L 0.3775 -0.1946 L 0.4838 -0.3370 L 0.6207 -0.5117 L 0.6460 -0.6000 L 0.5901 -0.6829 L 0.5090 -0.6847 L 0.4712 -0.6559 L 0.3955 -0.5766 L 0.3415 -0.5154 L 0.2190 -0.3622 L 0.1469 -0.2649 L 0.1235 -0.2415 L 0.1091 -0.2415 L 0.1072 -0.2487 L 0.1775 -0.6090 L 0.2045 -0.7928 L 0.1667 -0.8451 L 0.1253 -0.8649 L 0.0712 -0.8307 L 0.0658 -0.8253 L 0.0388 -0.7604 L 0.0154 -0.4901 L -0.0045 -0.3280 L -0.0135 -0.1892 L -0.0243 -0.1874 L -0.0333 -0.2037 L -0.0531 -0.2739 L -0.2117 -0.5820 L -0.3306 -0.8523 L -0.3666 -0.8829 L -0.4423 -0.8919 Z';
const BURST_RGB = [217,119,87];
function sparkPath(R) { return BURST_PATH; }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mask = document.createElement('canvas'); mask.width = 1920; mask.height = 1080;
const mctx = mask.getContext('2d');
const plateImg = new Image();

function drawFlower(c, f) {
  // union of a central disk and 14 lobe circles; accumulated over the shutter (radial motion blur)
  const M = 14;
  c.clearRect(0, 0, 1920, 1080);
  c.globalCompositeOperation = 'lighter';
  for (let k = 0; k < M; k++) {
    const t = f - 0.25 + 0.5 * (k + 0.5) / M;
    const Rm = lin(RMAX, t); if (Rm <= 0) continue;
    const rho = Q * Rm, D = Rm - rho, ph = phiDeg(t) * Math.PI / 180;
    const cx = lin(MCX, t), cy = MCY;
    c.fillStyle = `rgba(255,255,255,${Math.min(1, 1.03 / M)})`;
    c.beginPath();
    c.arc(cx, cy, D, 0, Math.PI * 2);
    for (let i = 0; i < N_LOBES; i++) {
      const a = ph + i * 2 * Math.PI / N_LOBES;
      const x = cx + D * Math.cos(a), y = cy + D * Math.sin(a);
      c.moveTo(x + rho, y);
      c.arc(x, y, rho, 0, Math.PI * 2);
    }
    c.fill('nonzero');
  }
  c.globalCompositeOperation = 'source-over';
}

window.renderFrame = async (f) => {
  // --- clouds through the scalloped mask
  ctx.clearRect(0, 0, 1920, 1080);
  if (f >= 21) {
    await setImg(plateImg, `../../plates/S01_opening/clouds_${String(f).padStart(4, '0')}.png`);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(plateImg, 0, 0, 1920, 1080);
    drawFlower(mctx, f);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(mask, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
  // --- sparkle
  const sp = document.getElementById('sp');
  const R = lin(SPARK_R, f), rot = lin(SPARK_ROT, f);
  if (R < 0.3) { sp.setAttribute('d', ''); return; }
  sp.setAttribute('d', sparkPath(R));
  sp.setAttribute('transform', `translate(${SC[0]} ${SC[1]}) rotate(${rot}) scale(${R * 1.35})`);
  let alpha = f <= 38 ? 1 : lin(SPARK_ALPHA, f);
  sp.setAttribute('fill', `rgb(${BURST_RGB.join(',')})`);
  sp.setAttribute('fill-opacity', alpha);
  // slight softness while it is growing / spinning fast (reference edges are soft there)
  const dR = Math.abs(lin(SPARK_R, f + 0.5) - lin(SPARK_R, f - 0.5));
  const dA = Math.abs(lin(SPARK_ROT, f + 0.5) - lin(SPARK_ROT, f - 0.5)) * Math.PI / 180 * R;
  const sd = Math.min(2, 0.3 + 0.05 * Math.hypot(dR, dA));
  document.getElementById('sbg').setAttribute('stdDeviation', (sd / Math.max(R, 1)).toFixed(4));
  sp.setAttribute('filter', sd > 0.15 ? 'url(#sb)' : '');
};
window.sceneReady = Promise.resolve();
</script>
</body></html>
