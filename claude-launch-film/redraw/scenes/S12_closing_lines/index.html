<div id="stage"><img class="plate" id="bg"></div>
<script>

// leaves to the left; line B slides in from the right, each new word gliding into place, then zooms.
const stage = document.getElementById('stage');
const W = [238, 238, 250], G = [150, 150, 172], VI = [148, 132, 255];
const A = new TitleLine(stage, {
  text: 'Because the right diagnosis', font: "'Inter'", size: 74, tracking: -0.02, weight: 400,
  fitWidth: { unit: 0, width: 274, by: 'tracking' }, cx: 952, baseline: 562, layout: 'progressive', presenceDur: 10,
  S: [[1168, 1.274], [1169, 1.219], [1170, 1.168], [1171, 1.124], [1172, 1.091], [1173, 1.066], [1174, 1.047], [1175, 1.029], [1176, 1.018], [1177, 1.007], [1178, 1.0]],

      typeAt: [[1195, 0.08], [1196, 0.22], [1198, 0.46], [1200, 0.78], [1202, 1]] },

});
const B = new TitleLine(stage, {
  text: 'starts with the right direction', font: "'Inter'", size: 75, tracking: -0.02, weight: 400,
  fitWidth: { unit: 'all', width: 921, by: 'tracking' }, cx: 958, baseline: 562, layout: 'full',

  await setImg(document.getElementById('bg'), `../../plates/S12_closing_lines/bg_${String(f).padStart(4, '0')}.jpg`);

  B.el.style.display = f >= 1208 ? 'block' : 'none';
  if (f <= 1207) A.render(f); else B.render(f);
};
window.sceneReady = document.fonts.ready;
</script>
</body></html>
