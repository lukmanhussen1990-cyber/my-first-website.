<script>
const K = 3, OX = 440, OY = 195;
document.getElementById('root').style.transform = `scale(${K}) translate(${-OX}px, ${-OY}px)`;
// ---- Claude-style sidebar on the reference glass strip (same rows as the reference icons)
const SIDE_X = 506;
const side = document.getElementById('side');
function put(html, x, y, w, h) { const d = document.createElement('div'); d.className = 'ic'; Object.assign(d.style, { left: (x - w / 2) + 'px', top: (y - h / 2) + 'px', width: w + 'px', height: h + 'px' }); d.innerHTML = html; side.appendChild(d); return d; }
const IC = (p, s = 22, c = 'rgba(250,249,245,0.92)', sw = 1.7) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
put(IC('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>', 24), SIDE_X, 270, 34, 34);                    // sidebar toggle
put(`<div style="width:30px;height:30px;border-radius:50%;background:#D97757;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(217,119,87,0.45)">${IC('<path d="M12 5v14"/><path d="M5 12h14"/>', 18, '#fff', 2.4)}</div>`, SIDE_X, 335, 34, 34);   // new chat
put(`<div style="width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center">${IC('<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12Z"/>', 21)}</div>`, SIDE_X, 440, 44, 44);   // chats (active)
put(IC('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>', 21), SIDE_X, 530, 30, 30);   // projects
put(IC('<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/>', 20), SIDE_X, 594, 30, 30);                              // artifacts
put(IC('<path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="m14 5-4 14"/>', 20), SIDE_X, 634, 30, 30);                  // code
put(IC('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/>', 20), SIDE_X, 718, 30, 30);       // starred
put(`<div style="width:46px;height:46px;border-radius:50%;background:#2B2A27;border:1.5px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:600;font-size:16px;color:#F5F4EF;letter-spacing:0.02em">AB</div>`, 503.5, 806, 50, 50);
// ---- composer (Claude style) in place of the reference input
const comp = claudeComposer({ width: 456, height: 80, fontSize: 14, font: "'Inter'", border: 'rgba(255,255,255,0.30)', blur: 0,
  btnBorder: 'rgba(255,255,255,0.28)', muted: 'rgba(255,255,255,0.72)',
  surface: 'linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06))' });
Object.assign(comp.style, { left: '561px', top: '744px', boxShadow: '0 6px 18px rgba(10,6,40,0.20)' });
const ph = document.createElement('span'); ph.textContent = 'Reply to Claude…'; ph.style.color = 'rgba(255,255,255,0.55)';
comp.parts.text.insertBefore(ph, comp.parts.t);
document.getElementById('compwrap').appendChild(comp);
// ---- Claude's reply (same content as the reference), streamed word by word
const R = [
  ['p', [['Persistent ', 0], ['sharp lower-back (lumbar) pain', 1], [' usually comes from a strained muscle/ligament, an irritated disc, or a “pinched” nerve — and since you said ', 0], ['persistent + sharp', 1], [', it’s worth being a bit careful.', 0]]],
  ['h', [['What you can do now (next 48–72 hours)', 0]]],
  ['li', [['Keep moving gently:', 1], [' short walks around the house; avoid long bed rest.', 0]]],
  ['li', [['Heat:', 1], [' warm compress 15–20 min, 2–3 times a day (helps spasm and stiffness).', 0]]],
  ['li', [['Avoid:', 1], [' heavy lifting, bending + twisting together, sudden jerks, long sitting.', 0]]],
  ['li', [['Support:', 1], [' when sitting, roll a small towel behind your lower back; stand up every 30–45 min.', 0]]],
  ['li', [['Sleep:', 1], [' side-lying with a pillow between your knees, or on your back with a pillow under your knees.', 0]]],
  ['li', [['Gentle stretches only if tolerable:', 1], [' knee-to-chest (one leg at a time), child’s pose; stop if pain shoots down.', 0]]],
  ['h', [['Desi comfort', 0]]],
  ['li', [['Ajwain potli warm compress', 1], [' (warm ajwain in a cloth) on the lower back for 10–15 min.', 0]]],
  ['li', [['Haldi doodh', 1], [' at night if it suits you (and no allergy or acid-reflux flare).', 0]]],
  ['h', [['Watch-outs (get checked urgently)', 0]]],
  ['p', [['If any of these happen, don’t wait:', 1], [' leg weakness, numbness in the groin/saddle area, loss of urine or stool control, fever with back pain, pain after a fall or accident, or severe unrelenting pain.', 0]]],
  ['h', [['Who to see', 0]]],
  ['p', [['Given it’s ', 0], ['persistent sharp lumbar pain', 1], [', an ', 0], ['orthopedics', 1], [' doctor (or a spine specialist) is a good fit.', 0]]],
];
const reply = document.getElementById('reply');
const words = [];   // {el, c0}: span + cumulative char index of its first char
let cum = 0;
R.forEach(([t, runs]) => {
  const b = document.createElement('div'); b.className = 'blk ' + (t === 'h' ? 'h' : t === 'li' ? 'li' : 'p');
  const prev = R[reply.children.length - 1];
  if (t === 'p' && reply.children.length > 0 && prev && prev[0] !== 'h') b.style.marginTop = '17px';
  if (t === 'li') b.style.marginTop = '0px';
  runs.forEach(([txt, bold]) => {
    const host = bold ? document.createElement('b') : b;
    if (bold) b.appendChild(host);
    txt.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { host.appendChild(document.createTextNode(tok)); cum += tok.length; return; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = tok; host.appendChild(s);
      words.push({ el: s, c0: cum, li: t === 'li' ? b : null }); cum += tok.length;
    });
  });
  reply.appendChild(b);
});
const TOTAL = cum;
// reference streaming: [frame a line completes, fraction of the reply text completed]
const LINES = [[908, 0], [911, 72], [914, 150], [917, 201], [921, 239], [923, 309], [925, 378], [927, 456], [929, 531], [933, 547], [937, 624], [940, 636], [941, 715], [942, 746], [943.5, 758], [944, 832], [945, 842], [946.5, 914], [948, 947], [949, 1019], [951, 1096], [953, 1138], [957, 1148], [959, 1223], [961, 1249]];
const REF_TOTAL = 1249;
const SCROLL = {"920": 0.0, "921": 0.12, "922": 0.19, "923": 0.32, "924": 0.19, "925": 0.25, "926": 0.11, "927": 0.11, "928": 0.09, "929": 0.05, "930": -0.3, "931": -0.65, "932": -1.29, "933": -2.6, "934": -4.1, "935": -5.91, "936": -8.54, "937": -11.72, "938": -15.64, "939": -20.11, "940": -25.76, "941": -32.95, "942": -42.08, "943": -53.58, "944": -68.23, "945": -87.46, "946": -113.77, "947": -146.13, "948": -178.62, "949": -204.48, "950": -223.98, "951": -238.81, "952": -250.37, "953": -259.22, "954": -266.48, "955": -272.33, "956": -277.11, "957": -280.88, "958": -284.03, "959": -286.59, "960": -288.6, "961": -290.39, "962": -291.77, "963": -292.56, "964": -293.06, "965": -293.29, "966": -293.21, "967": -293.22, "968": -293.26, "969": -293.23, "970": -293.27, "971": -293.26, "972": -293.18};
window.renderFlat = async (f) => {
  const n = kf(f, LINES) / REF_TOTAL * TOTAL;
  let lastVisible = null;
  words.forEach(w => {
    // a word fades in over ~3 frames from lavender to white once the stream passes it
    if (w.t0 === undefined) {          // frame at which the stream reaches this word
      const c = w.c0 / TOTAL * REF_TOTAL; let k = 1;
      while (k < LINES.length - 1 && LINES[k][1] < c) k++;
      const [fa, ca] = LINES[k - 1], [fb, cb] = LINES[k];
      w.t0 = fa + (fb - fa) * clamp((c - ca) / Math.max(1e-6, cb - ca));
    }
    const a = clamp((f - w.t0) / 3);
    w.el.style.opacity = a.toFixed(3);
    w.el.style.color = a >= 1 ? '' : rgba(mixc([196, 186, 255], [250, 249, 245], a));
    if (a > 0) lastVisible = w;
    if (w.li) w.li.classList.toggle('on', true);
  });
  // bullets appear with their first word
  document.querySelectorAll('#reply .li').forEach(li => { const first = li.querySelector('.w'); li.style.setProperty('--bo', first ? first.style.opacity : 1); });
  // the reference scroll curve, rescaled so the end of this (re-typeset) reply plus Claude's mark
  // settles just above the composer
  if (window.SC_K === undefined) {
    const cTop = document.getElementById('content').getBoundingClientRect().top;
    const bottom = (reply.getBoundingClientRect().bottom - cTop) / K + 8 + 18 + 10;   // + mark + gap
    window.SC_K = Math.max(0, bottom - 526) / 293.3;
  }
  const sc = (SCROLL[f] !== undefined ? SCROLL[f] : 0) * window.SC_K;
  document.getElementById('content').style.transform = `translateY(${sc}px)`;
  // Claude's starburst sits under the newest text (spinning while it streams)
  const sp = document.getElementById('spark');
  if (n > 0.5) {
    const rr = lastVisible ? lastVisible.el.getBoundingClientRect() : null;
    const cr = document.getElementById('content').getBoundingClientRect();
    const ry = document.getElementById('reply').getBoundingClientRect();
    const y = rr ? (rr.bottom - cr.top) / K + 8 : 0;
    sp.style.display = 'block'; sp.style.left = '9px'; sp.style.top = y + 'px';
    const streaming = n < TOTAL - 0.5;
    sp.style.transform = `rotate(${(streaming ? f * 14 : 961 * 14 + (f - 961) * 2)}deg)`;
  } else sp.style.display = 'none';
};
window.sceneReady = Promise.all([document.fonts.load("400 14px 'Claude Serif'"), document.fonts.load("600 14px 'Claude Serif'"), document.fonts.load("400 14px 'Inter'"), document.fonts.load("600 16px 'Inter'")]);
</script>
