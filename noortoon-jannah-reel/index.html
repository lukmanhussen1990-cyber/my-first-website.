<script>
'use strict';
/* =====================================================================================
   HOW BIG IS JANNAH?  —  NoorToon reel, 1080x1920, 30 fps, 45 s
   Every frame is a pure function of time:  render(t)  draws the exact frame for t seconds.
   All randomness is seeded, so every run (preview or export) paints identical pixels.
   ===================================================================================== */

const W = 1080, H = 1920, FPS = 30, DURATION = 45, FRAMES = FPS * DURATION;
const CREAM = '#F3E6C4', GOLD = '#E8C27A', EMPH = '#F6CF7F';
const PAGE_NAME = 'NoorToon';
const TAU = Math.PI * 2, DEG = Math.PI / 180;

const canvas = document.getElementById('c');

/* ---------------------------------- math helpers ---------------------------------- */

/* ------------------------------ shared seeded content ------------------------------ */
function makeStars(seed, n, o = {}) {
  const { x0 = -80, x1 = W + 80, y0 = -80, y1 = H + 80, bright = 0.07 } = o;
  const R = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) {
    const big = R() < bright;
    out.push({ x: lerp(x0, x1, R()), y: lerp(y0, y1, R()), r: big ? lerp(1.7, 2.8, R()) : lerp(0.55, 1.6, Math.pow(R(), 2)),
               a: lerp(0.3, 1, R()), f: lerp(0.5, 2.1, R()), p: R() * TAU, big, warm: R() < 0.3 });
  }

}
function drawStars(stars, t, mul = 1, fade = null) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    let a = s.a * (0.62 + 0.38 * Math.sin(t * s.f + s.p)) * mul;
    if (fade) a *= fade(s.x, s.y);
    if (a <= 0.01) continue;
    ctx.globalAlpha = Math.min(1, a);
    ctx.fillStyle = s.warm ? '#FFE7BE' : '#E6EEFF';
    circle(s.x, s.y, s.r); ctx.fill();
    if (s.big) sparkle(s.x, s.y, s.r * 7, a * 0.55, s.warm ? 'gold' : 'pearl');
  }
  ctx.restore();

const DUST = (() => {
  const R = mulberry32(7), a = [];
  for (let i = 0; i < 84; i++) {
    const depth = R(), bokeh = depth > 0.9;
    a.push({ x0: R() * W, y0: R() * (H + 240), vy: lerp(9, 36, depth), sw: lerp(8, 30, R()), sf: lerp(0.18, 0.6, R()),
             p: R() * TAU, r: bokeh ? lerp(12, 22, R()) : lerp(1.4, 3.8, depth), a: bokeh ? lerp(0.07, 0.14, R()) : lerp(0.3, 0.85, R()),
             tf: lerp(0.7, 2.4, R()) });
  }
  return a;
})();
function drawDust(t, mul = 1) {
  if (mul <= 0) return;
  const span = H + 240;
  for (const d of DUST) {
    const y = ((((d.y0 - d.vy * t) % span) + span) % span) - 120;
    const x = d.x0 + d.sw * Math.sin(d.sf * t + d.p);
    const tw = 0.5 + 0.5 * Math.sin(d.tf * t + d.p * 1.7);
    glow(x, y, d.r * 3.4, 'gold', d.a * (0.35 + 0.65 * tw) * mul);
  }

/* --------------------------------- built assets --------------------------------- */
const A = {};   // filled by buildAssets()

function buildGrain() {
  const R = mulberry32(99), tiles = [];
  for (let k = 0; k < 8; k++) {
    const s = 256, c = makeCanvas(s, s), g = c.getContext('2d'), img = g.createImageData(s, s), d = img.data;
    for (let i = 0; i < s * s; i++) {
      const n = (R() + R() + R() - 1.5) / 1.5;

}
function buildPaper() {                     // static "painted paper" unevenness
  const w = 360, h = 640, c = makeCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

}
function buildFineTexture() {               // fine painted-canvas tooth; overlay mostly shows on mid-tones (objects)

  gr.addColorStop(0.75, 'rgba(0,0,0,0.42)'); gr.addColorStop(1, 'rgba(0,0,0,0.78)');

/* ---- Earth: an equirectangular painted map made from 3D noise, projected per pixel ---- */

  const hx = mirror ? 46 : w - 46, hy = h * 0.55;
  g.strokeStyle = 'rgba(60,34,6,0.7)'; g.lineWidth = 6; g.beginPath(); g.arc(hx + 2, hy + 3, 20, 0, TAU); g.stroke();
  g.strokeStyle = '#F6DC98'; g.lineWidth = 5; g.beginPath(); g.arc(hx, hy, 20, 0, TAU); g.stroke();

}
function circle2(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function studs(g, x, y, r) {

function buildBeyondDoor(w, h, S) {

  }

  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.4; g.drawImage(A.paper, 0, 0, w, h);

}

/* ---- galaxies for the "heavens" zoom ---- */
function buildGalaxy(seed, core, arm) {
  const s = 320, c = makeCanvas(s, s), g = c.getContext('2d'), R = mulberry32(seed);
  g.translate(s / 2, s / 2);
  const cg = g.createRadialGradient(0, 0, 0, 0, 0, s * 0.42);
  cg.addColorStop(0, `rgba(${core},0.9)`); cg.addColorStop(0.12, `rgba(${core},0.45)`); cg.addColorStop(0.4, `rgba(${arm},0.12)`); cg.addColorStop(1, `rgba(${arm},0)`);
  g.fillStyle = cg; g.fillRect(-s / 2, -s / 2, s, s);
  g.globalCompositeOperation = 'lighter';
  const arms = 2 + Math.floor(R() * 2);
  for (let i = 0; i < 2600; i++) {
    const a = R() * 3.2 * Math.PI, which = Math.floor(R() * arms);
    const rr = 6 * Math.exp(0.28 * a) * (1 + (R() - 0.5) * 0.35);
    if (rr > s * 0.46) continue;
    const ang = a + (which * TAU) / arms + (R() - 0.5) * 0.45;
    const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
    const near = rr < 30;
    g.fillStyle = `rgba(${near ? core : (R() < 0.08 ? '255,170,200' : arm)},${lerp(0.18, 0.7, R())})`;
    g.fillRect(x, y, R() < 0.12 ? 2 : 1.2, R() < 0.12 ? 2 : 1.2);
  }
  return c;
}

}

/* 1 · A WHIP'S SPACE ------------------------------------------------------------ */
const WHIP = { creakStart: 1.1, thud: 2.5 };
function whipAngle(lt) {
  const a0 = -5 * DEG, a1 = 13 * DEG;
  if (lt < WHIP.creakStart) return a0 + Math.sin(lt * 2.4) * 0.5 * DEG;
  if (lt < WHIP.thud) {
    const p = (lt - WHIP.creakStart) / (WHIP.thud - WHIP.creakStart);
    return lerp(a0 + Math.sin(WHIP.creakStart * 2.4) * 0.5 * DEG, a1, easeInSine(p) * 0.85 + 0.15 * p * p);
  }
  const tau = lt - WHIP.thud;
  return a1 - 2.0 * DEG * Math.exp(-4.5 * tau) * Math.sin(13 * tau);
}
function brassGradH(x0, x1, y = 0) {
  const g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, '#3E2A0E'); g.addColorStop(0.16, '#8E6A2C'); g.addColorStop(0.36, '#E6C676');
  g.addColorStop(0.48, '#FFF0C6'); g.addColorStop(0.6, '#D0A452'); g.addColorStop(0.84, '#71501E'); g.addColorStop(1, '#36240C');

}

  ctx.lineTo(cx + rx, y); ctx.closePath(); ctx.fill();
  const tg = ctx.createLinearGradient(cx - rx, y - ry, cx + rx, y + ry);
  tg.addColorStop(0, '#FFEFC0'); tg.addColorStop(0.45, '#D9B060'); tg.addColorStop(1, '#7A5620');
  ctx.fillStyle = tg; ellipse(cx, y, rx, ry); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,0.5)'; ctx.lineWidth = 1.5; ellipse(cx, y, rx - 1, ry - 0.5); ctx.stroke();
}
function chain(x0, y0, x1, y1) {
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = '#5A3E14'; ctx.lineWidth = 3.4; ctx.setLineDash([7, 3.5]);

  ctx.strokeStyle = '#EED08A'; ctx.lineWidth = 1.6; ctx.lineDashOffset = -1;
  ctx.beginPath(); ctx.moveTo(x0 - 0.6, y0); ctx.lineTo(x1 - 0.6, y1); ctx.stroke();
  ctx.restore();
}
function sceneWhip(lt, dur, t) {
  fillBG([[0, '#101107'], [0.32, '#232310'], [0.58, '#353119'], [0.82, '#24200F'], [1, '#100F07']]);
  glow(540, 700, 660, 'gold', 0.4);
  glow(540, 720, 340, 'warm', 0.2);
  glowE(540, 1004, 560, 80, 'gold', 0.22);
  const ang = whipAngle(lt);
  const tip = clamp((ang + 5 * DEG) / (18 * DEG));
  const P = { x: 540, y: 572 }, ARM = 286, CH = 214;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const EL = { x: P.x - ARM * ca, y: P.y - ARM * sa }, ER = { x: P.x + ARM * ca, y: P.y + ARM * sa };

  shadowE(EL.x, 1006, 120, 16, 0.25 * (1 - (EL.y + CH + 40 - 700) / 600));

  cylinder(540, 944, 122, 19, 22);
  ctx.fillStyle = brassGradH(518, 562);
  ctx.beginPath(); ctx.moveTo(522, 948); ctx.lineTo(527, 600); ctx.lineTo(553, 600); ctx.lineTo(558, 948); ctx.closePath(); ctx.fill();
  for (const [y, rx] of [[930, 40], [800, 26], [690, 22], [610, 26]]) cylinder(540, y, rx, rx * 0.22, 9);

  ctx.beginPath(); ctx.arc(P.x, P.y, 84, -Math.PI / 2 - 0.62, -Math.PI / 2 + 0.62); ctx.stroke();
  for (let i = -5; i <= 5; i++) {
    const a = -Math.PI / 2 + i * 0.12, l = i === 0 ? 14 : 8;
    ctx.beginPath(); ctx.moveTo(P.x + Math.cos(a) * 84, P.y + Math.sin(a) * 84); ctx.lineTo(P.x + Math.cos(a) * (84 - l), P.y + Math.sin(a) * (84 - l)); ctx.stroke();
  }

  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(0, -92); ctx.lineTo(6, 0); ctx.closePath(); ctx.fill();   // needle

    kg.addColorStop(0, '#FFF3CF'); kg.addColorStop(0.5, '#D2A552'); kg.addColorStop(1, '#5A3E12');
    ctx.fillStyle = kg; circle(s * ARM, 0, 11); ctx.fill();
  }

  hg.addColorStop(0, '#FFF6D6'); hg.addColorStop(0.45, '#DDB463'); hg.addColorStop(1, '#5E4214');
  ctx.fillStyle = hg; circle(0, 0, 24); ctx.fill();
  ctx.strokeStyle = 'rgba(60,40,10,0.6)'; ctx.lineWidth = 2; circle(0, 0, 13); ctx.stroke();
  ctx.restore();
  // a little light catches the brass when it settles
  glow(P.x, P.y, 60, 'white', 0.25 + 0.3 * Math.exp(-6 * Math.max(0, lt - WHIP.thud)) * (lt > WHIP.thud ? 1 : 0));

function drawPan(E, L, kind, t, tip) {
  const cx = E.x, rimY = E.y + L, rx = 104, ry = 17, depth = 40;
  chain(E.x, E.y, cx, rimY - ry * 0.85);

  } else {

    glowE(cx, rimY - 70, 70, 150, 'gold', 0.18 * gA);                       // a soft column of Jannah light
    glowE(cx, rimY - 12, 170, 70, 'green', 0.7 * gA);
    glowE(cx, rimY - 14, 100, 36, 'gold', 0.7 * gA);
    glowE(cx, rimY - 14, 60, 14, 'white', 0.45 * gA);

    ctx.fillStyle = soil; ctx.beginPath(); ctx.roundRect(sx, sy - 8, sw, 19, 9); ctx.fill();

    }

    }

  ctx.strokeStyle = '#FFE9B0'; ctx.lineWidth = 2.5;

  chain(E.x, E.y, cx - rx + 3, rimY);
  chain(E.x, E.y, cx + rx - 3, rimY);

/* 2 · THE PEARL TENT ------------------------------------------------------------ */
const PEARL = { growStart: 1.0, tentStart: 2.0, tentEnd: 3.0, ground: 1000, rMax: 280, cyFloat: 720 };
function pearlState(lt) {
  const grow = easeOutCubic(inv(PEARL.growStart, PEARL.growStart + 1.8, lt));
  const pulse = 1 + 0.035 * Math.sin(lt * 5) * (1 - grow);
  const r = lerp(44, PEARL.rMax, grow) * pulse;
  const tent = easeInOutCubic(inv(PEARL.tentStart, PEARL.tentEnd, lt));
  const cy = lerp(PEARL.cyFloat, PEARL.ground - 0.58 * PEARL.rMax, tent);   // settles into the ground as a dome
  const clipY = PEARL.ground;
  const door = easeInOutCubic(inv(2.35, 3.25, lt));
  const g = clamp(0.35 + lt / 1.2) * (0.85 + 0.15 * Math.sin(lt * 3));
  return { r, cy, tent, clipY, door, grow, g };
}
function sceneShafts(t, a, col = '200,230,255') {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const x = 120 + i * 175 + Math.sin(t * 0.4 + i * 1.3) * 40, w = 70 + (i % 3) * 40, sk = 260 + 40 * Math.sin(t * 0.3 + i);
    const gr = ctx.createLinearGradient(0, -100, 0, 1350);
    gr.addColorStop(0, `rgba(${col},${a * (0.7 + 0.3 * Math.sin(t + i))})`); gr.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.moveTo(x, -100); ctx.lineTo(x + w, -100); ctx.lineTo(x + w + sk, 1350); ctx.lineTo(x + sk - w * 0.5, 1350); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function scenePearl(lt, dur, t) {
  fillBG([[0, '#030F1C'], [0.28, '#07233C'], [0.58, '#0B3352'], [0.82, '#0A2842'], [1, '#041422']]);
  sceneShafts(t, 0.06);
  const s = pearlState(lt);
  glow(540, s.cy, 380 + s.r * 1.05, 'pearl', 0.16 + 0.2 * s.g);
  glow(540, s.cy, 200 + s.r * 0.5, 'white', 0.1 + 0.1 * s.g);
  if (s.tent > 0) {                                       // the soft lit ground the tent settles on
    glowE(540, PEARL.ground + 8, 640, 92, 'pearl', 0.38 * s.tent);
    glowE(540, PEARL.ground + 4, 420, 40, 'white', 0.22 * s.tent);
    ctx.save(); ctx.globalAlpha = s.tent;
    const fg = ctx.createLinearGradient(0, PEARL.ground - 14, 0, 1500);
    fg.addColorStop(0, 'rgba(160,190,220,0)'); fg.addColorStop(0.03, 'rgba(160,190,220,0.16)'); fg.addColorStop(1, 'rgba(10,30,50,0)');
    ctx.fillStyle = fg; ctx.fillRect(-100, PEARL.ground - 14, W + 200, 620);
    ctx.restore();
    shadowE(540, PEARL.ground + 2, s.r * 0.95, 16, 0.35 * s.tent, '10,20,40');
  }
  drawPearl(540, s.cy, s.r, s.clipY, s, t);
  if (s.door > 0) drawTentDoor(s, t);
  // the thin measuring line stretches with the pearl while the number counts
  const ma = clamp((lt - PEARL.growStart) / 0.2) * (1 - 0.25 * clamp((lt - 3.7) / 0.4));
  if (ma > 0) {
    const half = s.r + 18, y = s.cy;
    ctx.save(); ctx.globalAlpha = ma; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(10,20,40,0.55)'; ctx.shadowBlur = 6;
    ctx.strokeStyle = '#E8C27A'; ctx.lineWidth = 3;

/* 5 · 100 LEVELS ---------------------------------------------------------------- */
const LV = { first: 0.3, interval: 0.26, spacing: 125, n: 18, eyeY: 360, rx: 300, appearAt: 3.44, base: 900 };
const lvAppear = k => LV.first + k * LV.interval;

  const camH = lvCamH(lt), rise = clamp(camH / 1800);

  for (let k = 0; k < LV.n; k++) {
    const a0 = lvAppear(k);

    const ap = easeOutCubic(inv(a0, a0 + 0.45, lt));
    const y = LV.base - k * LV.spacing + camH + (1 - ap) * 30;

  items.sort((a, b) => a.y - b.y);

  nb.addColorStop(0, 'rgba(6,11,34,0)'); nb.addColorStop(0.45, 'rgba(6,11,34,0.55)'); nb.addColorStop(1, 'rgba(6,11,34,0.7)');

}
function drawLevel(k, y, a, t, lt) {

  side.addColorStop(0, '#FBE3A0'); side.addColorStop(0.5, '#C99A48'); side.addColorStop(1, '#6E4A18');
  ctx.fillStyle = side;

  ctx.ellipse(540, y + thick, rx, ary, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();

    fg.addColorStop(0, mixHex('#F4F2D0', '#FFF4D6', warm)); fg.addColorStop(0.4, mixHex('#B8D88E', '#D8DC92', warm));
    fg.addColorStop(0.8, mixHex('#5E9452', '#8EA45A', warm)); fg.addColorStop(1, '#3C6A3E');
    ctx.fillStyle = fg; ellipse(540, y, rx, ary); ctx.fill();

      if (tr.u * tr.u + tr.v * tr.v > 0.72) continue;

      ctx.fillStyle = tg; circle(tx, ty - hh * 0.62, hh * 0.46); ctx.fill();
    }
  } else {                                           // a glowing golden underside, seen from below
    const ug = ctx.createRadialGradient(540, y + thick, 8, 540, y + thick, rx);
    ug.addColorStop(0, '#FFF4CE'); ug.addColorStop(0.45, '#F0C878'); ug.addColorStop(1, '#A87830');
    ctx.fillStyle = ug; ellipse(540, y + thick, rx, ary); ctx.fill();

  ctx.shadowColor = 'rgba(255,204,116,1)'; ctx.shadowBlur = 18;

}

/* 6 · AS WIDE AS THE HEAVENS ---------------------------------------------------- */
const SPACE = { zoomStart: 0.45, zoomEnd: 2.75, Lmax: 7.2 };
function spaceZoom(lt) {
  const p = inv(SPACE.zoomStart, SPACE.zoomEnd, lt), e = p * p * p * (p * (p * 6 - 15) + 10);
  return SPACE.Lmax * e + 0.1 * lt;
}
const SPACE_LAYERS = (() => {
  const R = mulberry32(606), layers = [];
  for (let j = 0; j < 12; j++) {
    const stars = [];
    for (let i = 0; i < 260; i++) {
      const a = R() * TAU, d = Math.sqrt(R()) * 1.25;
      stars.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 1.05, r: lerp(0.6, 2.3, Math.pow(R(), 3)), a: lerp(0.35, 1, R()), warm: R() < 0.3, f: lerp(0.6, 2, R()), p: R() * TAU });
    }
    const gals = [];

      const a = R() * TAU, d = lerp(0.25, 1.15, R());
      gals.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, s: lerp(0.06, 0.16, R()), rot: R() * TAU, tilt: lerp(0.35, 0.9, R()), g: Math.floor(R() * 3) });
    }
    const neb = [];
    for (let i = 0; i < 2; i++) { const a = R() * TAU, d = lerp(0.2, 1, R()); neb.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, s: lerp(0.3, 0.6, R()), c: ['violet', 'teal', 'rose', 'blue'][Math.floor(R() * 4)] }); }

const STARS_SPACE = makeStars(616, 320, { bright: 0.03 });
function sceneHeavens(lt, dur, t) {
  fillBG([[0, '#010208'], [0.5, '#050819'], [1, '#020309']]);

  // a faint, far milky band that never moves: the sky is always deep
  glowE(540, 760, 1100, 260, 'violet', 0.10, 'lighter', -0.5);
  glowE(600, 700, 800, 160, 'blue', 0.08, 'lighter', -0.5);
  drawStars(STARS_SPACE, t, 0.45 * smooth(inv(0.3, 2.5, lt)));
  for (const ly of SPACE_LAYERS) {
    const s = Math.exp(ly.lam - L) * 2.4;                  // apparent size of this shell
    if (s < 0.06 || s > 6) continue;
    const w = smooth(inv(0.08, 0.3, s)) * smooth(inv(5.5, 2.8, s));
    if (w <= 0.01) continue;
    for (const n of ly.neb) glow(cx + n.x * s * RS, cy + n.y * s * RS, n.s * s * RS, n.c, 0.1 * w);
    for (const g of ly.gals) {

    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';

      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;

}

/* 7 · THE LAST PERSON ----------------------------------------------------------- */
const LAST = { popStart: 1.5, popGap: 0.2, ring: 268, centerR: 104, globeR: 56 };

function sceneLast(lt, dur, t) {

    drawEarth(x, y, LAST.globeR * sc, 60 + t * 12 + k * 33, { halo: 0.6, tint: 1 });
    sparkle(x + LAST.globeR * 0.5, y - LAST.globeR * 0.6, 30, 0.6 * flash + 0.15 * (0.5 + 0.5 * Math.sin(t * 2 + k)), 'gold');

  text1: 'Ask Allah for Al-Firdaws, the highest level of Jannah', br1: 'Ask Allah for Al-Firdaws,', source1: 'SAHIH AL-BUKHARI 2790', start1: 0.3, out1: 2.65,
  text2: 'O Allah, grant us Al-Firdaws. Ameen', br2: 'O Allah, grant us', start2: 3.0, cta: 'Comment Ameen', ctaAt: 3.8,
};
const TYPE = { start: 0.4, step: 0.025, fade: 0.1 };
const MAIN_Y = 1180, MAIN_MAXW = 800;            // 140..940 px: clear of the right-hand Instagram buttons
const COUNT_DUR = 1.8;

function sceneAt(t) {
  for (const s of SCENES) if (t < s.end) return s;
  return SCENES[SCENES.length - 1];
}

/* text layout: balanced two-line wrap, per-letter positions measured with real kerning */
const LAYOUT = new Map();
function layoutText(text, size, br) {
  const key = text + '|' + size + '|' + (br || '');
  if (LAYOUT.has(key)) return LAYOUT.get(key);
  ctx.save(); ctx.font = `${size}px "Patrick Hand"`; ctx.letterSpacing = '0px';
  const words = text.split(' ');
  let lines = [text];
  if (br && text.startsWith(br + ' ')) lines = [br, text.slice(br.length + 1)];       // hand-picked phrase break
  else if (ctx.measureText(text).width > MAIN_MAXW * 0.875) {                          // otherwise: balanced two lines
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      const m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
      if (!best || m < best.m) best = { m, lines: [a, b] };
    }
    lines = best.lines;
  }
  // if a line is wider than the safe column, tighten tracking by a hair (never more than 1.5 px)
  let spacing = 0;
  const widths = lines.map(l => ctx.measureText(l).width), widest = Math.max(...widths);
  if (widest > MAIN_MAXW) spacing = Math.max(-1.5, (MAIN_MAXW - widest) / (lines[widths.indexOf(widest)].length - 1));
  ctx.letterSpacing = spacing + 'px';
  const caps = new Set(words.filter(w => /^[A-Z]{2,}$/.test(w.replace(/[^A-Za-z]/g, ''))));
  const out = { size, spacing, lines: [], count: 0, maxW: 0 };
  let idx = 0;
  for (const line of lines) {
    const w = ctx.measureText(line).width - spacing, chars = [];
    let wordStart = 0;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === ' ') wordStart = i + 1;
      const word = line.slice(wordStart).split(' ')[0];
      chars.push({ ch: line[i], x: ctx.measureText(line.slice(0, i)).width, idx: idx++, emph: caps.has(word) });
    }
    idx++;                                         // the space that became the line break
    out.lines.push({ text: line, w, chars });
    out.maxW = Math.max(out.maxW, w);
  }
  out.count = idx - 1;
  ctx.restore();
  LAYOUT.set(key, out);
  return out;
}
function typeEnd(L, start) { return start + (L.count - 1) * TYPE.step + TYPE.fade; }
function textShadow(strong) {
  if (strong) { ctx.shadowColor = 'rgba(58,32,4,0.95)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 2; }
  else { ctx.shadowColor = 'rgba(8,5,2,0.7)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; }
}
function drawTyped(L, cy, lt, start, alphaMul, strong) {
  const lh = L.size * 1.22, n = L.lines.length;
  ctx.save();
  ctx.font = `${L.size}px "Patrick Hand"`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '0px';
  textShadow(strong);
  for (let li = 0; li < n; li++) {
    const line = L.lines[li], y = cy + (li - (n - 1) / 2) * lh + L.size * 0.34, x0 = 540 - line.w / 2;
    for (const c of line.chars) {
      if (c.ch === ' ') continue;
      const a = clamp((lt - (start + c.idx * TYPE.step)) / TYPE.fade);
      if (a <= 0) continue;
      ctx.globalAlpha = a * alphaMul;
      ctx.fillStyle = c.emph ? EMPH : CREAM;
      ctx.fillText(c.ch, x0 + c.x, y);
      if (strong) { ctx.shadowBlur = 10; ctx.fillText(c.ch, x0 + c.x, y); ctx.shadowBlur = 4; ctx.fillText(c.ch, x0 + c.x, y); ctx.shadowBlur = 22; }
    }
  }
  ctx.restore();
  return cy + ((n - 1) / 2) * lh + L.size * 0.34;   // baseline of the last line
}
function drawSpaced(text, x, y, font, spacing, color, alpha, strong, halo) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = font; ctx.letterSpacing = spacing + 'px'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (strong || halo) {                           // a dark halo on its own (shadow-only pass) for bright backgrounds
    ctx.save(); ctx.globalAlpha = Math.min(1, alpha * 1.8); ctx.fillStyle = '#000';
    ctx.shadowColor = 'rgba(58,32,4,0.95)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 10000;
    ctx.fillText(text, x + spacing / 2 - 10000, y); ctx.restore();
  }
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  if (!strong) { textShadow(false); ctx.shadowBlur = 8; ctx.shadowOffsetY = 2; }
  ctx.fillText(text, x + spacing / 2, y);
  ctx.restore();
}
function drawSource(text, y, a, strong) { drawSpaced(text, 540, y, '600 24px "Cormorant Garamond"', 4, CREAM, 0.45 * a, strong); }
function drawBigNumber(num, lt) {
  let txt, a, sc = 1, burst = 0;
  if (num.value != null) {
    if (lt < num.start - 0.05) return;
    const p = clamp((lt - num.start) / COUNT_DUR);
    txt = String(Math.round(num.value * easeOutCubic(p)));
    a = clamp((lt - num.start + 0.05) / 0.25);
  } else {
    const p = (lt - num.pop) / 0.5;
    if (p < 0) return;
    sc = Math.max(0.01, easeOutBack(clamp(p), 2.4)); a = clamp(p * 4); burst = Math.exp(-4 * Math.max(0, lt - num.pop));
    txt = num.text;
  }
  glow(540, 300, 260 + 120 * burst, 'gold', 0.16 * a + 0.5 * burst);
  ctx.save();
  ctx.translate(540, 300); ctx.scale(sc, sc);
  ctx.font = '500 150px "Cormorant Garamond"'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '0px';
  ctx.globalAlpha = a; ctx.fillStyle = CREAM;
  ctx.shadowColor = `rgba(232,194,122,${0.55 + 0.4 * burst})`; ctx.shadowBlur = 34 + 30 * burst;
  ctx.fillText(txt, 0, 48);
  ctx.shadowColor = 'rgba(10,6,2,0.55)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillText(txt, 0, 48);
  ctx.restore();
  if (num.label) drawSpaced(num.label, 540, 404, '600 24px "Cormorant Garamond"', 5, CREAM, 0.6 * a, false, true);
}
function drawArabicTitle(t) {
  ctx.save();
  ctx.font = '100px Amiri'; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = GOLD;
  ctx.shadowColor = 'rgba(255,196,100,0.85)'; ctx.shadowBlur = 30 + 6 * Math.sin(t * 2);
  ctx.fillText('الجنة', 540, 706);
  ctx.shadowColor = 'rgba(20,10,0,0.6)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  ctx.fillText('الجنة', 540, 706);
  ctx.restore();
  // ornament under the word
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createLinearGradient(400, 0, 680, 0);
  lg.addColorStop(0, 'rgba(232,194,122,0)'); lg.addColorStop(0.5, 'rgba(232,194,122,0.9)'); lg.addColorStop(1, 'rgba(232,194,122,0)');
  ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(410, 776); ctx.lineTo(670, 776); ctx.stroke();
  ctx.fillStyle = 'rgba(240,206,140,0.95)'; ctx.beginPath(); ctx.moveTo(540, 768); ctx.lineTo(548, 776); ctx.lineTo(540, 784); ctx.lineTo(532, 776); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawSceneText(sc, lt, t) {
  const T = sc.text;
  if (sc.id === 'title') drawArabicTitle(t);
  if (T) {
    if (T.number) drawBigNumber(T.number, lt);
    const size = T.size || 60, L = layoutText(T.main, size, T.br);
    const last = drawTyped(L, MAIN_Y, T.static ? 1e9 : lt, TYPE.start, 1, T.strongShadow);
    if (T.source) drawSource(T.source, last + 62, clamp((lt - typeEnd(L, TYPE.start) - 0.15) / 0.45), T.strongShadow);
  }
  if (sc.id === 'ending') {
    const E = ENDING;
    const out = 1 - smooth(inv(E.out1, E.out1 + 0.3, lt));
    if (out > 0) {
      const L1 = layoutText(E.text1, 60, E.br1), last = drawTyped(L1, MAIN_Y, lt, E.start1, out);
      drawSource(E.source1, last + 62, out * clamp((lt - typeEnd(L1, E.start1) - 0.15) / 0.45));
    }
    if (lt >= E.start2 - 0.01) {
      const L2 = layoutText(E.text2, 60, E.br2), last = drawTyped(L2, MAIN_Y, lt, E.start2, 1);
      const ca = smooth(clamp((lt - E.ctaAt) / 0.4));
      if (ca > 0) {
        ctx.save(); ctx.font = '36px "Patrick Hand"'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        textShadow(false); ctx.globalAlpha = 0.7 * ca; ctx.fillStyle = CREAM;
        ctx.fillText(E.cta, 540, last + 78 - 6 * (1 - ca));
        ctx.restore();
      }
    }
  }
}
function drawPageName() {
  ctx.save();
  ctx.font = 'italic 500 30px "Cormorant Garamond"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0.5px';
  ctx.fillStyle = CREAM; ctx.globalAlpha = 0.55;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 1;
  ctx.fillText(PAGE_NAME, 540, 90);
  ctx.restore();
}
function drawGrain(frame, amt) {
  const R = mulberry32(5000 + frame), tile = A.grain[Math.floor(R() * A.grain.length)];
  const pat = ctx.createPattern(tile, 'repeat');
  pat.setTransform(new DOMMatrix([1.6, 0, 0, 1.6, Math.floor(R() * 256), Math.floor(R() * 256)]));
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = amt; ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H); ctx.restore();
}
const SCENE_LOOK = {           // per-scene overlay strengths: dust, vignette, paper texture, grain
  title: [0.8, 0.85, 0.5, 0.11], whip: [1, 0.9, 0.55, 0.11], pearl: [0.8, 0.85, 0.5, 0.11], tree: [0.9, 0.9, 0.55, 0.11],
  gate: [1, 0.9, 0.55, 0.11], levels: [0.8, 0.75, 0.5, 0.1], heavens: [0.35, 0.8, 0.35, 0.1], last: [1, 0.9, 0.55, 0.11],
  beyond: [0.7, 0.5, 0.45, 0.09], ending: [0.75, 0.9, 0.4, 0.1],
};

/* ===================================== render(t) ===================================== */
function render(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const sc = sceneAt(t), lt = t - sc.start, dur = sc.end - sc.start, look = SCENE_LOOK[sc.id];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)';
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // world layer: per-scene camera + the very slow push-in (1.00 → 1.04)
  const cam = sc.camera ? sc.camera(lt, dur) : { s: 1, fx: 540, fy: sc.focusY, ax: 540, ay: sc.focusY };
  const push = 1 + 0.04 * clamp(lt / dur);
  ctx.save();
  ctx.translate(cam.ax, cam.ay); ctx.scale(cam.s * push, cam.s * push); ctx.translate(-cam.fx, -cam.fy);
  sc.draw(lt, dur, t);
  ctx.restore();
  // atmosphere: golden dust, painted-paper texture, vignette
  drawDust(t, look[0]);
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = look[2]; ctx.drawImage(A.paper, 0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.2; ctx.fillStyle = ctx.createPattern(A.fine, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = look[1]; ctx.drawImage(A.vignette, 0, 0); ctx.restore();
  // text
  drawSceneText(sc, lt, t);
  // film grain
  drawGrain(Math.round(t * FPS), look[3]);
  // fade in from black (0.3 s) / fade to black (0.3 s); the title is visible on frame 0
  const fin = sc.start === 0 ? 1 : clamp(lt / 0.3), fout = clamp((dur - lt) / 0.3), vis = Math.min(fin, fout);
  if (vis < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - vis})`; ctx.fillRect(0, 0, W, H); }
  drawPageName();
}

/* ======================= cue sheet (single source of truth for audio) ======================= */
function buildCues() {
  const cues = { fps: FPS, duration: DURATION, scenes: SCENES.map(s => ({ id: s.id, start: s.start, end: s.end })), ticks: [], counts: [], ev: {} };
  const addTicks = (text, size, t0, br) => {
    const L = layoutText(text, size, br);
    for (const line of L.lines) for (const c of line.chars) if (c.ch !== ' ') cues.ticks.push(+(t0 + c.idx * TYPE.step).toFixed(4));
  };
  for (const s of SCENES) {
    if (!s.text) continue;
    if (!s.text.static) addTicks(s.text.main, s.text.size || 60, s.start + TYPE.start, s.text.br);
    const n = s.text.number;
    if (n && n.value != null) cues.counts.push({ start: s.start + n.start, dur: COUNT_DUR, value: n.value, scene: s.id });
  }
  const S = Object.fromEntries(SCENES.map(s => [s.id, s.start]));
  addTicks(ENDING.text1, 60, S.ending + ENDING.start1, ENDING.br1);
  addTicks(ENDING.text2, 60, S.ending + ENDING.start2, ENDING.br2);
  cues.ev = {
    titleSwell: [0, 3],
    whipCreak: [S.whip + WHIP.creakStart, S.whip + WHIP.thud], whipThud: S.whip + WHIP.thud,
    pearlShimmer: [S.pearl + 0.3, S.pearl + 1.2], pearlTent: [S.pearl + PEARL.tentStart, S.pearl + 3.4],
    treeWind: [S.tree, S.tree + 4.5],
    gateRumble: [S.gate + GATE.openStart, S.gate + GATE.openEnd], gateAir: [S.gate + 2.6, S.gate + 4.5],
    levelWhooshes: Array.from({ length: LV.n }, (_, k) => S.levels + lvAppear(k)).filter((x, k) => k % 2 === 0 && x < S.levels + 4.0),
    spaceWhoosh: [S.heavens + SPACE.zoomStart - 0.1, S.heavens + SPACE.zoomEnd], spaceAir: [S.heavens + 2.3, S.heavens + 4.5],
    pops: Array.from({ length: 10 }, (_, k) => S.last + lastPopTime(k)), numberPop: S.last + LAST.popStart,
    beyondSwell: [S.beyond + 0.2, S.beyond + BEYOND.openEnd], beyondShimmer: [S.beyond + BEYOND.openStart + 0.6, S.beyond + 4.5],
    endingAir: [S.ending, 45],
  };
  return cues;
}

/* ================================== boot & preview ================================== */
const params = new URLSearchParams(location.search);
const EXPORT = params.has('export');
if (EXPORT) document.body.className = 'export';

const ready = (async () => {
  await Promise.all([
    document.fonts.load('60px "Patrick Hand"'), document.fonts.load('76px "Patrick Hand"'), document.fonts.load('36px "Patrick Hand"'),
    document.fonts.load('500 150px "Cormorant Garamond"', '0123456789×'), document.fonts.load('600 24px "Cormorant Garamond"'),
    document.fonts.load('italic 500 30px "Cormorant Garamond"'), document.fonts.load('italic 600 33px "Cormorant Garamond"'),
    document.fonts.load('100px Amiri', 'الجنة'),
  ]);
  await document.fonts.ready;
  await buildAssets();
  render(0);
  return true;
})();

window.render = render;
window.NOOR = {
  W, H, FPS, DURATION, FRAMES, ready, render, cues: buildCues,
  frame(i) { render(i / FPS); return canvas.toDataURL('image/png'); },
  still(t) { render(t); return canvas.toDataURL('image/png'); },
  fontsOk() { return [...document.fonts].map(f => `${f.family} ${f.style} ${f.weight}: ${f.status}`); },
};

if (!EXPORT) {
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const statusEl = document.getElementById('status'), aud = document.getElementById('aud'), snd = document.getElementById('snd');
  let playing = false, t0 = 0, tStart = 0, audioOk = false, cur = 0;
  aud.addEventListener('canplay', () => { audioOk = true; statusEl.textContent = 'Ready · sound from output/audio.mp3 · Space = play/pause, ←/→ = one frame'; });
  aud.addEventListener('error', () => { audioOk = false; statusEl.textContent = 'Ready · (no output/audio.mp3 yet — run build.sh for sound)'; });
  aud.src = 'output/audio.mp3';
  const show = (t) => { cur = t; render(t); scrub.value = t.toFixed(3); timeEl.textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)} s`; };
  const now = () => (audioOk && !aud.paused ? aud.currentTime : tStart + (performance.now() - t0) / 1000);
  function loop() {
    if (!playing) return;
    let t = now();
    if (t >= DURATION) { t = DURATION - 1e-3; setPlaying(false); }
    show(t);
    requestAnimationFrame(loop);
  }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? '❚❚ Pause' : '▶ Play';
    if (p) {
      if (cur >= DURATION - 0.05) cur = 0;
      tStart = cur; t0 = performance.now();
      if (audioOk && snd.checked) { aud.currentTime = cur; aud.play().catch(() => {}); }
      requestAnimationFrame(loop);
    } else { aud.pause(); }
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => {
    const t = parseFloat(scrub.value);
    if (playing) { tStart = t; t0 = performance.now(); if (audioOk && snd.checked) aud.currentTime = t; }
    show(t);
  });
  snd.addEventListener('change', () => { if (!snd.checked) aud.pause(); else if (playing && audioOk) { aud.currentTime = cur; aud.play().catch(() => {}); } });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlaying(false); show(clamp(cur + (e.code === 'ArrowRight' ? 1 : -1) / FPS, 0, DURATION - 1e-3)); }
  });
  ready.then(() => { show(0); if (!audioOk) statusEl.textContent = 'Ready · Space = play/pause, ←/→ = step one frame'; });
}
</script>
