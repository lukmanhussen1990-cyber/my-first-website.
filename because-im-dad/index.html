<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Because I'm Dad</title>
<style>
  @font-face { font-family: 'Patrick Hand'; src: url('fonts/patrick-hand-latin-400-normal.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; background: #000; }
  body.render #stage { width: 720px; height: 720px; }
  body:not(.render) { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; font-family: Inter, sans-serif; color: #ddd; }
  body:not(.render) #stage { width: min(720px, 100vw); height: auto; aspect-ratio: 1; }
  #stage { display: block; }
  #ui { display: flex; gap: 10px; align-items: center; width: min(720px, calc(100vw - 32px)); }
  #ui input { flex: 1; }
  #ui button { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="plaid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#b93a31"/>
      <rect x="0" y="6" width="18" height="5" fill="#8a2621" opacity="0.85"/>
      <rect x="6" y="0" width="5" height="18" fill="#8a2621" opacity="0.6"/>
      <rect x="0" y="14" width="18" height="1.4" fill="#e3745f" opacity="0.75"/>
      <rect x="14" y="0" width="1.4" height="18" fill="#e3745f" opacity="0.75"/>
    </pattern>
    <pattern id="woodV" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#b07a4c"/>
      <path d="M0 0 V40 M20 0 V40" stroke="#946238" stroke-width="2"/>
      <path d="M8 6 q2 8 0 16 M30 18 q2 8 0 14" stroke="#9c6a40" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="woodH" width="120" height="26" patternUnits="userSpaceOnUse">
      <rect width="120" height="26" fill="#c08a58"/>
      <path d="M0 0 H120 M70 0 V26 M10 13 V26" stroke="#9e6c40" stroke-width="2"/>
      <path d="M0 13 H120" stroke="#ad7a4b" stroke-width="1.2"/>
    </pattern>
    <pattern id="tiles" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#e9e3d6"/>
      <path d="M0 0 H60 M0 0 V60" stroke="#cfc6b3" stroke-width="2"/>
    </pattern>
    <pattern id="starsWall" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#4a5f8f"/>
      <path d="M18 14 l2 5 5 0 -4 3 2 5 -5 -3 -5 3 2 -5 -4 -3 5 0z" fill="#6f84b5" opacity="0.6"/>
      <circle cx="52" cy="48" r="2.5" fill="#6f84b5" opacity="0.6"/>
    </pattern>
    <pattern id="stripesWall" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#efe1c6"/>
      <rect x="0" width="12" height="36" fill="#e6d4b2"/>
    </pattern>
    <pattern id="brick" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#9c4d3c"/>
      <path d="M0 0 H60 M0 15 H60 M15 0 V15 M45 15 V30" stroke="#6f3328" stroke-width="2"/>
    </pattern>
    <clipPath id="picClip"><rect x="0" y="0" width="720" height="480"/></clipPath>
  </defs>
  <defs id="dyn-defs"></defs>
  <g id="frame"></g>
</svg>
<div id="ui"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.0s</span></div>
<audio id="music" src="music.wav" preload="auto"></audio>
<script src="lib.js"></script>
<script src="chars.js"></script>
<script src="props.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
</body>
</html>
