<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="description" content="SHADOW BLADE: OLD CITY - an original retro mobile-era stealth action game.">
<title>SHADOW BLADE: OLD CITY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#08080a;overflow:hidden;
  font-family:"Lucida Console","Courier New",monospace;color:#cfcab5;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 38%,#1b1d24 0%,#0d0e12 55%,#070709 100%)}

/* ---------- fake handset ---------- */
#phone{position:relative;width:322px;height:664px;padding:13px 13px 10px;transform-origin:center center;
  border-radius:36px;background:linear-gradient(158deg,#585c66 0%,#31343c 26%,#1b1d22 62%,#3a3e46 100%);
  box-shadow:0 0 0 2px #0b0c0f,0 22px 46px rgba(0,0,0,.72),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 6px rgba(0,0,0,.5)}
#phone:before{content:"";position:absolute;inset:5px;border-radius:31px;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.spk{width:62px;height:6px;border-radius:3px;margin:2px auto 4px;
  background:repeating-linear-gradient(90deg,#101216 0 2px,#4b4f58 2px 4px);box-shadow:inset 0 1px 1px #000}
.brand{text-align:center;font-size:9px;letter-spacing:3px;color:#9aa0ad;margin-bottom:6px;text-shadow:0 1px 0 #000}
.bezel{position:relative;width:274px;height:354px;margin:0 auto;padding:16px 17px;border-radius:8px;
  background:linear-gradient(180deg,#111318,#04050a 60%,#0b0d12);
  box-shadow:inset 0 0 0 2px #0a0b0e,inset 0 3px 9px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
#screen{display:block;width:240px;height:320px;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#000;box-shadow:0 0 12px rgba(120,190,140,.10)}
.glare{position:absolute;inset:16px 17px;pointer-events:none;border-radius:2px;
  background:linear-gradient(197deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.03) 18%,rgba(255,255,255,0) 42%)}
.scan{position:absolute;inset:16px 17px;pointer-events:none;opacity:.20;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,rgba(0,0,0,0) 1px 3px)}

/* ---------- keys ---------- */
.krow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px}
button{font-family:inherit;color:#d5d2c6;border:0;cursor:pointer;background:none}
.key{position:relative;background:linear-gradient(180deg,#4c505a,#2a2d34 55%,#1e2026);
  border-radius:9px;box-shadow:0 2px 0 #0d0e11,inset 0 1px 0 rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key.dn{transform:translateY(2px);box-shadow:0 0 0 #0d0e11,inset 0 1px 3px rgba(0,0,0,.7);
  background:linear-gradient(180deg,#6d7581,#3a3e47)}
.key .n{font-size:14px;font-weight:700;color:#e8e5da;text-shadow:0 1px 1px #000}
.key .s{font-size:6.5px;letter-spacing:.6px;color:#8f96a3;margin-top:2px}
.key .g{font-size:6px;letter-spacing:.4px;color:#7fae86;margin-top:1px}
.soft{width:72px;height:26px;font-size:8.5px;letter-spacing:1px;border-radius:8px 8px 14px 14px;
  background:linear-gradient(180deg,#474b55,#23262c);box-shadow:0 2px 0 #0d0e11,inset 0 1px 0 rgba(255,255,255,.2)}
.navwrap{position:relative;width:96px;height:60px}
.nav{position:absolute;border-radius:6px;background:linear-gradient(180deg,#4c505a,#25282e);
  box-shadow:0 2px 0 #0d0e11,inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#c9ccd4}
#nU{left:33px;top:0;width:30px;height:20px}
#nD{left:33px;top:40px;width:30px;height:20px}
#nL{left:2px;top:16px;width:24px;height:28px}
#nR{left:70px;top:16px;width:24px;height:28px}
#nC{left:29px;top:17px;width:38px;height:26px;border-radius:13px;font-size:8px;letter-spacing:1px;
  background:linear-gradient(180deg,#5d626d,#2c2f36)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:6px;justify-content:center;margin-top:8px}
.pad .key{height:34px}
.callrow{display:flex;justify-content:center;gap:96px;margin-top:7px}
.callrow .key{width:56px;height:22px;border-radius:11px}
.callrow .n{font-size:9px}
#hint{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:9px;color:#5c5f68;letter-spacing:1px}

/* ---------- fullscreen / touch ---------- */
#fsbtn{position:fixed;right:10px;top:10px;z-index:40;font-size:10px;letter-spacing:1px;padding:8px 11px;
  border-radius:6px;background:#1b1e24;border:1px solid #383c45;color:#96e0a4;opacity:.85}
#fsbtn:active{background:#2a2f38}
body.fs #stage{background:#000}
body.fs #phone{display:none}
body.fs #screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10}
body.fs #touch{display:block}
#touch{display:none;position:fixed;inset:0;z-index:30}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(200,230,205,.30);background:rgba(150,220,170,.10);
  color:rgba(225,245,230,.72);font-size:13px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;line-height:1.1;backdrop-filter:blur(1px)}
.tb b{font-size:15px}.tb i{font-size:7px;font-style:normal;opacity:.75}
.tb.dn{background:rgba(150,220,170,.30);border-color:rgba(220,255,225,.7)}
.tb.sq{border-radius:9px}
#tL{left:14px;bottom:96px;width:74px;height:74px}
#tR{left:100px;bottom:96px;width:74px;height:74px}
#tU{left:57px;bottom:180px;width:74px;height:74px}
#tD{left:57px;bottom:14px;width:74px;height:74px}
#tA{right:16px;bottom:104px;width:84px;height:84px}
#tS{right:104px;bottom:34px;width:72px;height:72px}
#tB{right:20px;bottom:16px;width:70px;height:70px}
#tP{right:14px;top:56px;width:46px;height:34px;border-radius:8px;font-size:11px}
.hidden{display:none!important}
@media (max-width:420px){#fsbtn{font-size:9px;padding:6px 8px}}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div class="spk"></div>
    <div class="brand">MOBIA 6300</div>
    <div class="bezel">
      <canvas id="screen" width="240" height="320"></canvas>
      <div class="scan"></div><div class="glare"></div>
    </div>
    <div class="krow">
      <button class="soft" data-k="SOFT1">SELECT</button>
      <div class="navwrap">
        <button class="nav" id="nU" data-k="2">&#9650;</button>
        <button class="nav" id="nL" data-k="4">&#9664;</button>
        <button class="nav" id="nR" data-k="6">&#9654;</button>
        <button class="nav" id="nD" data-k="8">&#9660;</button>
        <button class="nav" id="nC" data-k="5">OK</button>
      </div>
      <button class="soft" data-k="SOFT2">BACK</button>
    </div>
    <div class="callrow">
      <button class="key" data-k="SOFT1"><span class="n">&#9742;</span></button>
      <button class="key" data-k="SOFT2"><span class="n">&#9743;</span></button>
    </div>
    <div class="pad">
      <button class="key" data-k="1"><span class="n">1</span><span class="s">.,?!</span></button>
      <button class="key" data-k="2"><span class="n">2</span><span class="s">abc</span><span class="g">JUMP</span></button>
      <button class="key" data-k="3"><span class="n">3</span><span class="s">def</span></button>
      <button class="key" data-k="4"><span class="n">4</span><span class="s">ghi</span><span class="g">LEFT</span></button>
      <button class="key" data-k="5"><span class="n">5</span><span class="s">jkl</span><span class="g">ATTACK</span></button>
      <button class="key" data-k="6"><span class="n">6</span><span class="s">mno</span><span class="g">RIGHT</span></button>
      <button class="key" data-k="7"><span class="n">7</span><span class="s">pqrs</span></button>
      <button class="key" data-k="8"><span class="n">8</span><span class="s">tuv</span><span class="g">CROUCH</span></button>
      <button class="key" data-k="9"><span class="n">9</span><span class="s">wxyz</span></button>
      <button class="key" data-k="STAR"><span class="n">&#42;</span><span class="s">+</span><span class="g">BLOCK</span></button>
      <button class="key" data-k="0"><span class="n">0</span><span class="s">space</span><span class="g">STEALTH</span></button>
      <button class="key" data-k="HASH"><span class="n">&#35;</span><span class="s">shift</span><span class="g">PAUSE</span></button>
    </div>
    <div id="hint">KEYPAD 4 6 2 8 5 0 &#42; &#35; &nbsp;/&nbsp; ARROWS Z X C P</div>
  </div>
  <div id="touch">
    <div class="tb" id="tL" data-k="4"><b>&#9664;</b><i>4</i></div>
    <div class="tb" id="tR" data-k="6"><b>&#9654;</b><i>6</i></div>
    <div class="tb" id="tU" data-k="2"><b>&#9650;</b><i>2 JUMP</i></div>
    <div class="tb" id="tD" data-k="8"><b>&#9660;</b><i>8 DOWN</i></div>
    <div class="tb" id="tA" data-k="5"><b>5</b><i>ATTACK</i></div>
    <div class="tb" id="tS" data-k="0"><b>0</b><i>STEALTH</i></div>
    <div class="tb" id="tB" data-k="STAR"><b>&#42;</b><i>BLOCK</i></div>
    <div class="tb sq" id="tP" data-k="HASH">&#35;</div>
  </div>
  <button id="fsbtn">&#9974; FULLSCREEN</button>
</div>
<script>
"use strict";
/* =====================================================================
   SHADOW BLADE: OLD CITY
   An original single-file retro stealth-action game (2007-2010 handset era).
   All art, audio and code generated procedurally. No external assets.
   ===================================================================== */

/* ---------------------------------------------------------------- consts */
var SW=240, SH=320;              /* handset screen                          */
var HUD_H=22, BAR_H=20;          /* top HUD + bottom softkey bar            */
var VY=HUD_H, VH=SH-HUD_H-BAR_H; /* gameplay viewport                       */
var TS=16;                       /* tile size                               */
var STEP=1/60;                   /* fixed logic step                        */

/* limited "phone palette" ------------------------------------------------ */
var P={
  night0:'#080a14', night1:'#0e1222', night2:'#161c31', night3:'#232b46',
  star:'#cdd6ee', moon:'#e6e2c4', moonD:'#b9b48f',
  far0:'#12172a', far1:'#1a2138', far2:'#242c48',
  mid0:'#1e2233', mid1:'#2a2f43',
  stone0:'#221f1a', stone1:'#332e26', stone2:'#4a4335', stone3:'#635a45', stone4:'#7d7259',
  sand0:'#3d3121', sand1:'#7d6842', sand2:'#a08654', sand3:'#c0a271',
  roof0:'#3a201d', roof1:'#59302a', roof2:'#7a4438', roof3:'#a05c46',
  wood0:'#2a1c11', wood1:'#452f1c', wood2:'#684728', wood3:'#8b6236',
  cloth0:'#4d1b26', cloth1:'#7a2c38', cloth2:'#a8404f',
  cloth3:'#1c3a4d', cloth4:'#2e5e78',
  marb0:'#3b3a44', marb1:'#5b5a68', marb2:'#83828f', marb3:'#a9a8b4',
  gold0:'#6b4d10', gold1:'#a87c1c', gold2:'#d9ad35', gold3:'#f4dd88',
  steel0:'#33383f', steel1:'#565d68', steel2:'#818b99', steel3:'#b9c3d0',
  skin:'#b8875a', skinD:'#8a6440',
  leaf0:'#1e3320', leaf1:'#2e5030', leaf2:'#437043',
  fire0:'#8a3a10', fire1:'#d8781c', fire2:'#f6c452', fire3:'#fff0b4',
  blood:'#8e1f24',
  ui0:'#0c1410', ui1:'#1d3326', ui2:'#3f6b47', ui3:'#78c489', ui4:'#c8f0cf',
  white:'#e8ecf2', black:'#000000', shadow:'rgba(0,0,0,.45)'
};

/* ---------------------------------------------------------------- tiles */
var T_EMPTY=0,T_STONE=1,T_STONETOP=2,T_SAND=3,T_SANDTOP=4,T_ROOF=5,T_FILL=6,
    T_WOOD=7,T_LADDER=8,T_SPIKE=9,T_MARB=10,T_MARBTOP=11,T_WINDOW=12,T_BRICK=13,
    T_LATTICE=14,T_CARPET=15,T_BANNER=16,T_AWNA=17,T_AWNB=18,T_RUBBLE=19,
    T_GRASS=20,T_ROPE=21,T_PILLAR=22,T_CRATEBG=23,T_SANDDEEP=24,T_ARCH=25,
    T_HAY=26,T_TENTPOLE=27,T_BARS=28,T_GOLDTRIM=29,T_COUNT=30;

var SOLID=new Uint8Array(T_COUNT), ONEWAY=new Uint8Array(T_COUNT),
    CLIMB=new Uint8Array(T_COUNT), HAZARD=new Uint8Array(T_COUNT),
    OPAQUE=new Uint8Array(T_COUNT);
[T_STONE,T_STONETOP,T_SAND,T_SANDTOP,T_ROOF,T_FILL,T_MARB,T_MARBTOP,T_WINDOW,
 T_BRICK,T_SANDDEEP,T_GRASS,T_GOLDTRIM].forEach(function(t){SOLID[t]=1;OPAQUE[t]=1;});
SOLID[T_LATTICE]=1; SOLID[T_BARS]=1;      /* solid but you can see through  */
ONEWAY[T_WOOD]=1;
CLIMB[T_LADDER]=1; CLIMB[T_ROPE]=1;
HAZARD[T_SPIKE]=1;

/* ---------------------------------------------------------------- utils */
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;
  var g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
function ctxOf(c){var g=c.getContext('2d');g.imageSmoothingEnabled=false;return g;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function sign(v){return v<0?-1:(v>0?1:0);}
function lerp(a,b,t){return a+(b-a)*t;}
function apr(a,b,d){return a<b?Math.min(a+d,b):Math.max(a-d,b);}
function rndr(s){var t=s>>>0;return function(){t+=0x6D2B79F5;var x=t;x=Math.imul(x^x>>>15,x|1);
  x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296;};}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

/* --------------------------------------------------------- tile painting */
function paintTile(g,id,v){
  var R=rndr(id*977+v*31+7), i,j,n;
  function f(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
  function speck(c,n2,y0,y1){for(i=0;i<n2;i++)f((R()*16)|0,y0+((R()*(y1-y0))|0),1,1,c);}
  switch(id){
  case T_STONE: case T_STONETOP:
    f(0,0,16,16,P.stone1);
    for(j=0;j<4;j++){var off=(j%2)*8;
      for(i=0;i<2;i++){var bx=(off+i*8)%16;
        f(bx,j*4,8,4,j%2?P.stone1:P.stone2);
        f(bx,j*4,8,1,P.stone2); f(bx,j*4+3,8,1,P.stone0);
        f(bx+7,j*4,1,4,P.stone0);}}
    speck(P.stone3,7,1,15); speck(P.stone0,6,1,15);
    if(id===T_STONETOP){f(0,0,16,2,P.stone3);f(0,0,16,1,P.stone4);
      for(i=0;i<16;i+=4)f(i,2,1,1,P.stone0);
      if(R()<.5){f(3,1,3,1,P.leaf1);f(10,1,2,1,P.leaf1);} }
    break;
  case T_SAND: case T_SANDTOP: case T_SANDDEEP:
    f(0,0,16,16,id===T_SANDDEEP?P.sand0:P.sand1);
    speck(P.sand2,10,0,16); speck(P.sand0,10,0,16);
    if(id===T_SANDTOP){f(0,0,16,3,P.sand2);f(0,0,16,1,P.sand3);
      speck(P.sand3,4,0,3); for(i=0;i<16;i+=5)f(i+(R()*2|0),3,2,1,P.sand1);}
    break;
  case T_ROOF:
    f(0,0,16,16,P.roof1);
    for(j=0;j<4;j++){var yy=j*4, o=(j%2)*4;
      for(i=-1;i<4;i++){var xx=o+i*8;
        f(xx,yy,7,4,j%2?P.roof1:P.roof2);
        f(xx,yy,7,1,P.roof3); f(xx,yy+3,7,1,P.roof0); f(xx+7,yy,1,4,P.roof0);}}
    speck(P.roof0,8,0,16);
    break;
  case T_FILL:
    f(0,0,16,16,P.stone0);
    speck('#2c261f',12,0,16); f(0,0,16,1,'#1a1712');
    break;
  case T_BRICK:
    f(0,0,16,16,P.roof0);
    for(j=0;j<4;j++){var o2=(j%2)*4;
      for(i=-1;i<3;i++){f(o2+i*8+1,j*4+1,6,2,j%2?'#5a2f26':'#6b3830');}}
    speck('#3a201d',8,0,16);
    break;
  case T_MARB: case T_MARBTOP:
    f(0,0,16,16,P.marb1);
    for(j=0;j<2;j++)for(i=0;i<2;i++){f(i*8,j*8,8,8,(i+j)%2?P.marb1:P.marb2);
      f(i*8,j*8,8,1,P.marb3);f(i*8,j*8+7,8,1,P.marb0);f(i*8+7,j*8,1,8,P.marb0);}
    speck(P.marb3,5,0,16);
    if(id===T_MARBTOP){f(0,0,16,2,P.marb3);f(0,2,16,1,P.gold1);f(0,0,16,1,'#c9c8d4');}
    break;
  case T_GOLDTRIM:
    f(0,0,16,16,P.marb1); f(0,0,16,4,P.gold1); f(0,0,16,1,P.gold3); f(0,4,16,1,P.gold0);
    for(i=0;i<16;i+=4){f(i+1,5,2,2,P.gold2);} f(0,12,16,4,P.marb2);
    break;
  case T_WINDOW:
    f(0,0,16,16,P.stone1); f(0,0,16,1,P.stone2);
    f(3,3,10,11,P.stone0); f(4,4,8,9,'#2a1e12');
    if(v%2===0){f(4,4,8,9,P.fire0);f(5,5,6,7,P.fire1);f(6,6,4,4,P.fire2);}
    f(7,3,2,11,P.stone1); f(3,7,10,2,P.stone1);
    break;
  case T_WOOD:
    f(0,0,16,5,P.wood2); f(0,0,16,1,P.wood3); f(0,4,16,1,P.wood0);
    for(i=0;i<16;i+=6)f(i,1,1,3,P.wood1);
    speck(P.wood1,5,1,4);
    break;
  case T_LADDER:
    f(2,0,2,16,P.wood2); f(12,0,2,16,P.wood2);
    f(2,0,1,16,P.wood3); f(12,0,1,16,P.wood3);
    for(j=1;j<16;j+=5){f(2,j,12,2,P.wood3);f(2,j+2,12,1,P.wood0);}
    break;
  case T_ROPE:
    f(7,0,2,16,P.wood3);
    for(j=0;j<16;j+=3){f(7,j,1,1,P.wood1);f(8,j+1,1,1,P.wood1);}
    break;
  case T_SPIKE:
    f(0,12,16,4,P.stone1); f(0,12,16,1,P.stone0);
    for(i=0;i<4;i++){var sx=i*4+1;
      f(sx+1,3,1,9,P.steel2); f(sx,6,3,6,P.steel1); f(sx,10,3,2,P.steel0);
      f(sx+1,3,1,3,P.steel3);}
    break;
  case T_LATTICE:
    for(i=0;i<16;i+=4){f(i,0,1,16,P.wood2);f(0,i,16,1,P.wood2);}
    f(0,0,16,1,P.wood3);
    break;
  case T_BARS:
    for(i=1;i<16;i+=5){f(i,0,2,16,P.steel1);f(i,0,1,16,P.steel2);}
    f(0,3,16,2,P.steel0); f(0,11,16,2,P.steel0);
    break;
  case T_CARPET:
    f(0,11,16,5,P.cloth1); f(0,11,16,1,P.cloth2); f(0,15,16,1,P.cloth0);
    for(i=0;i<16;i+=4)f(i+1,12,2,2,P.gold1);
    break;
  case T_BANNER:
    f(3,0,10,16,P.cloth1); f(3,0,10,1,P.gold1); f(3,0,1,16,P.cloth2); f(12,0,1,16,P.cloth0);
    f(6,4,4,4,P.gold2); f(7,5,2,2,P.cloth0);
    break;
  case T_AWNA: case T_AWNB:
    var c1=id===T_AWNA?P.cloth1:P.cloth3, c2=id===T_AWNA?P.cloth2:P.cloth4;

function drawChar(g,C,pose,f){
  var big=C.big?1:0;
  var legH=6+big, hipY=AY-legH, torsoH=7+big, shY=hipY-torsoH, headTop=shY-6;
  var fr=function(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);};
  function line(x0,y0,x1,y1,c,w){
    w=w||1; var dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy))|0;
    for(var i=0;i<=n;i++){fr(x0+dx*i/n,y0+dy*i/n,w,w,c);} }
  function leg(hx,y0,dx,lift,c){
    var h=AY-lift-y0; if(h<3)h=3; var half=(h>>1);
    fr(hx+(dx*0.35),y0,2,half,c);
    fr(hx+dx,y0+half,2,h-half,c);

  function head(ty){

      fr(3,ty+1,1,5,C.hoodD); fr(4,ty+1,5,1,C.hoodL);
      fr(10,ty+2,1,4,C.hoodD); fr(2,ty+2,1,3,C.hoodD); fr(1,ty+3,1,2,C.hoodD);
      fr(7,ty+3,3,3,C.face); fr(8,ty+4,2,1,s==='hood'?C.skin:'#8fbf5a');

      fr(5,ty+6,5,1,C.hair||'#2e2018');
      fr(4,ty,8,1,C.metalD); fr(4,ty+1,8,2,C.metal); fr(4,ty+1,7,1,C.metalL);
      fr(9,ty+3,1,3,C.metalD); fr(3,ty+2,1,3,C.metalD); fr(11,ty+1,1,2,C.metalD);
      if(C.plume){fr(6,ty-3,2,4,C.plume); fr(5,ty-1,4,1,C.plume); fr(6,ty-3,1,2,'#f0e0a0');}

  function torso(y0,h,lean){

    fr(4+lean,y0,8,2,C.robe); fr(4+lean,y0,8,1,C.robeL);
    fr(5+lean,y0+2,6,h-2,C.robe);
    fr(5+lean,y0+2,1,h-2,C.robeL); fr(10+lean,y0+2,1,h-2,C.robeD);
    fr(5+lean,y0+h-2,6,2,C.sash); fr(5+lean,y0+h-2,6,1,'rgba(255,255,255,.14)');
  }
  function coat(y0,sway){
    if(!C.coat)return;
    fr(4+sway,y0,8,3,C.robeD); fr(3+sway,y0+1,2,4,C.robeD);
    fr(4+sway,y0,8,1,C.robe); fr(2+sway,y0+3,2,2,C.hoodD);
  }
  function armB(x,y,dx,dy2){ line(x,y,x+dx,y+dy2,C.robeD,2); }
  function armF(x,y,dx,dy2){ line(x,y,x+dx,y+dy2,C.robeL,2); fr(x+dx,y+dy2,2,2,C.skin); }
  function sword(x0,y0,x1,y1){

  var wt=[[3,0,-3,0],[2,1,-2,0],[0,2,0,0],[-2,0,2,0],[-3,0,3,1],[0,0,0,2]];

    armB(5+ln,shY+3-bb,-t[0]*.8,4); armF(10+ln,shY+3-bb,t[0]*.8+ (sp?1:0),4);
    head(headTop-bb+(sp?1:0));
    if(C.weap==='sword')sword(11,hipY-1,14,hipY+4);
    if(C.weap==='spear')line(12,headTop-2,13,AY,'#684728',2);
    if(C.weap==='bow')arc(3,shY+5,5,-1.1,1.1,C.metalD);
    break; }
  case 'crouch': case 'sneak': {
    var d=4, dx2=pose==='sneak'?[0,2,0,-2][f%4]:0;

  case 'jump': {
    leg(6,hipY,-2,3,C.robeD); leg(9,hipY,3,1,C.robe);
    coat(hipY-2,-2); torso(shY-1,torsoH,0);
    armB(5,shY+2,-2,-3); armF(10,shY+2,2,-4); head(headTop-1);

    coat(hipY-1,-3); torso(shY,torsoH,0);
    armB(5,shY+2,-3,-2); armF(10,shY+2,3,-2); head(headTop);

  case 'hang': {
    var hh=f&1;
    leg(6,hipY+hh,-1,0,C.robeD); leg(9,hipY+hh,2,2,C.robe);
    coat(hipY-1+hh,-1); torso(shY+1+hh,torsoH,0);
    armB(6,shY+hh,0,-6); armF(10,shY+hh,1,-6);
    fr(6,shY+hh-7,2,2,C.skin); fr(11,shY+hh-7,2,2,C.skin);

  case 'ledge': {

    leg(6,hipY+k,-2,2,C.robeD); leg(9,hipY+k,3,3,C.robe);

  case 'block': {

var SPR={};
function buildChars(){
  for(var name in CHARS){
    var C=CHARS[name], set={};
    for(var pose in POSEF){
      var arr=[];
      for(var f=0;f<POSEF[pose];f++){
        var c=mk(CW,CH); drawChar(ctxOf(c),C,pose,f); arr.push(c);

}
function blit(g,img,cx,cy,dir){
  if(dir<0){ g.save(); g.scale(-1,1);
    g.drawImage(img,-(Math.round(cx)+CW-AX),Math.round(cy)-AY); g.restore(); }
  else g.drawImage(img,Math.round(cx)-AX,Math.round(cy)-AY);
}

var AU={ctx:null,master:null,on:true,ready:false};
function auInit(){
  if(AU.ctx)return;

  AU.master=AU.ctx.createGain(); AU.master.gain.value=0.5; AU.master.connect(AU.ctx.destination);
  AU.mus=AU.ctx.createGain(); AU.mus.gain.value=0.34; AU.mus.connect(AU.master);

}

function tone(f,dur,type,vol,slide,when,dest){

/* ================================================================ builder */
function Builder(w,h){
  var g=new Uint8Array(w*h), ents=[], zones=[];
  var B={w:w,h:h,g:g,ents:ents,zones:zones};
  function idx(x,y){return y*w+x;}
  B.t=function(x,y,id){ if(x>=0&&y>=0&&x<w&&y<h)g[idx(x,y)]=id; };
  B.get=function(x,y){ return (x<0||y<0||x>=w||y>=h)?0:g[idx(x,y)]; };
  B.r=function(x,y,ww,hh,id){ for(var j=0;j<hh;j++)for(var i=0;i<ww;i++)B.t(x+i,y+j,id); };
  B.ground=function(x,ww,y,top,fill){ B.r(x,y,ww,1,top); B.r(x,y+1,ww,h-y-1,fill); };
  B.bldg=function(x,y,ww,hh,o){
    o=o||{};
    B.r(x,y,ww,hh,o.fill||T_FILL);
    B.r(x,y,ww,1,o.roof||T_ROOF);
    if(o.wall!==0){ B.r(x,y+1,1,hh-1,o.side||T_STONE); B.r(x+ww-1,y+1,1,hh-1,o.side||T_STONE); }
    if(o.win!==0){ for(var j=y+2;j<y+hh-1;j+=3)for(var i=x+2;i<x+ww-2;i+=4)
      if(((i*7+j*13)%5)<3)B.t(i,j,T_WINDOW); }
  };
  B.plat=function(x,y,ww){ B.r(x,y,ww,1,T_WOOD); };
  B.lad=function(x,y,hh){ B.r(x,y,1,hh,T_LADDER); };
  B.ent=function(type,tx,ty,o){ o=o||{}; o.type=type; o.x=tx*TS+TS/2; o.y=ty*TS+TS; o.tx=tx; o.ty=ty;
    ents.push(o); return o; };
  B.zone=function(id,x,y,ww,hh){ zones.push({id:id,x:x*TS,y:y*TS,w:ww*TS,h:hh*TS}); };
  B.awn=function(x,y,ww,alt){ for(var i=0;i<ww;i++)B.t(x+i,y,(alt?T_AWNB:T_AWNA)); };
  return B;
}

function collideX(e,dx){
  e.x+=dx; if(!dx)return;
  var s=dx>0?1:-1, lim=null, i,d,
      x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-1)/TS),
      y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-1)/TS), xx,yy;
  for(yy=y0;yy<=y1;yy++)for(xx=x0;xx<=x1;xx++){
    if(SOLID[tileIdx(xx,yy)]){
      var v=s>0?xx*TS-e.w:xx*TS+TS;
      if(lim===null||(s>0?v<lim:v>lim))lim=v;
    }}
  var S=G.solids;
  for(i=0;i<S.length;i++){ d=S[i];
    if(d.dead||d.opened)continue;
    if(e.x<d.x+d.w&&e.x+e.w>d.x&&e.y<d.y+d.h&&e.y+e.h>d.y){
      var v2=s>0?d.x-e.w:d.x+d.w;
      if(lim===null||(s>0?v2<lim:v2>lim))lim=v2;
    }}
  if(lim!==null){ e.x=lim; e.vx=0; e.bumpX=s; }
}
function collideY(e,dy){
  var prevB=e.y+e.h, prevT=e.y;
  e.y+=dy; if(!dy)return;
  var s=dy>0?1:-1, lim=null, land=null, i,d,
      x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-1)/TS),
      y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-1)/TS), xx,yy,t;
  for(yy=y0;yy<=y1;yy++)for(xx=x0;xx<=x1;xx++){
    t=tileIdx(xx,yy);
    if(SOLID[t]){
      var v=s>0?yy*TS-e.h:yy*TS+TS;
      if(lim===null||(s>0?v<lim:v>lim)){lim=v;land=s>0;}
    }else if(ONEWAY[t]&&s>0&&!e.dropT&&prevB<=yy*TS+3){
      var v3=yy*TS-e.h;
      if(lim===null||v3<lim){lim=v3;land=1;}
    }}
  var S=G.solids;
  for(i=0;i<S.length;i++){ d=S[i];
    if(d.dead||d.opened)continue;
    if(e.x<d.x+d.w&&e.x+e.w>d.x&&e.y<d.y+d.h&&e.y+e.h>d.y){
      if(d.oneway){ if(s>0&&!e.dropT&&prevB<=d.y+4+Math.abs(d.vy||0)){
          var v4=d.y-e.h; if(lim===null||v4<lim){lim=v4;land=1;e.ride=d;} } }
      else { var v5=s>0?d.y-e.h:d.y+d.h;
        if(lim===null||(s>0?v5<lim:v5>lim)){lim=v5;land=s>0;} }
    }}
  if(lim!==null){ e.y=lim; if(s>0){e.onGround=1;e.fallV=e.vy;} e.vy=0; }
}
function rectFree(x,y,w,h){
  var x0=Math.floor(x/TS),x1=Math.floor((x+w-1)/TS),
      y0=Math.floor(y/TS),y1=Math.floor((y+h-1)/TS),xx,yy;
  for(yy=y0;yy<=y1;yy++)for(xx=x0;xx<=x1;xx++)if(SOLID[tileIdx(xx,yy)])return false;
  var S=G.solids;
  for(var i=0;i<S.length;i++){var d=S[i];
    if(d.dead||d.opened||d.oneway)continue;
    if(x<d.x+d.w&&x+w>d.x&&y<d.y+d.h&&y+h>d.y)return false;}
  return true;
}
function losClear(x0,y0,x1,y1){
  var dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy))/6|0;
  if(n<1)return true;
  for(var i=1;i<n;i++){
    var x=x0+dx*i/n, y=y0+dy*i/n;
    if(OPAQUE[tileAtPx(x,y)])return false;
    var S=G.solids;
    for(var j=0;j<S.length;j++){var d=S[j];
      if(d.dead||d.opened||d.oneway||d.seeThru)continue;
      if(x>=d.x&&x<=d.x+d.w&&y>=d.y&&y<=d.y+d.h)return false;}
  }
  return true;
}
/* ------------------------------------------------------------- particles */
function part(x,y,vx,vy,life,col,size,grav){
  if(G.parts.length>150)G.parts.shift();
  G.parts.push({x:x,y:y,vx:vx,vy:vy,l:life,ml:life,c:col,s:size||1,g:grav===undefined?90:grav});
}
function dust(x,y,n,col){
  for(var i=0;i<n;i++)part(x+(Math.random()*8-4),y-1,(Math.random()*36-18),
    -Math.random()*22,0.35+Math.random()*0.3,col||'#8a7452',1,40);
}
function sparks(x,y,dir){
  for(var i=0;i<7;i++)part(x,y,dir*(20+Math.random()*70),(Math.random()*90-45),
    0.22+Math.random()*0.2,i%2?'#f4dd88':'#e8ecf2',1,60);
}
function gore(x,y,dir){
  for(var i=0;i<8;i++)part(x,y,dir*(10+Math.random()*46),-(Math.random()*50),
    0.4+Math.random()*0.3,i%3?'#8e1f24':'#5a1216',1,160);
}
function shards(x,y,col){
  for(var i=0;i<10;i++)part(x+(Math.random()*12-6),y-(Math.random()*10),
    (Math.random()*90-45),-(20+Math.random()*70),0.5+Math.random()*0.4,col,1,220);
}
function updParts(dt){
  for(var i=G.parts.length-1;i>=0;i--){var p=G.parts[i];
    p.l-=dt; if(p.l<=0){G.parts.splice(i,1);continue;}
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
}
function noiseAt(x,y,r,src){ G.noises.push({x:x,y:y,r:r,src:src,l:0.25}); }
function shake(v){ G.shake=Math.min(6,G.shake+v); }
function say(t,dur){ G.msg=t; G.msgT=dur||2.6; }
function banner(t,dur){ G.banner=t; G.bannerT=dur||1.8; }

/* ================================================================= player */
function makePlayer(x,y){
  return {x:x-4,y:y-18,w:9,h:18,vx:0,vy:0,dir:1,onGround:0,
    hp:6,maxhp:6,st:'idle',t:0,f:0,ft:0,crouch:0,dropT:0,coy:0,jbuf:0,
    atkT:0,atkHit:0,blockT:0,hurtT:0,invT:0,takeT:0,takeTgt:null,rollT:0,
    hang:null,climbT:0,ladder:0,hidden:0,inHide:null,whistleT:0,fallV:0,
    dead:0,ride:null,noisy:0,winT:0,combo:0};
}
function pcx(p){return p.x+p.w/2;}
function pcy(p){return p.y+p.h/2;}
function pfeet(p){return p.y+p.h;}
function setAnim(p,st){ if(p.st!==st){p.st=st;p.f=0;p.ft=0;} }

function nearInteract(p){
  var best=null,bd=1e9;
  for(var i=0;i<G.ents.length;i++){var e=G.ents[i];
    if(!e.interact||e.dead)continue;
    var d=dist2(pcx(p),pcy(p),e.x+e.w/2,e.y+e.h/2);
    if(d<26*26&&d<bd){bd=d;best=e;}}
  return best;
}
function takedownTarget(p){
  var best=null,bd=1e9;
  for(var i=0;i<G.ents.length;i++){var e=G.ents[i];
    if(e.kind!=='guard'||e.dead||e.boss)continue;
    var dx=(e.x+e.w/2)-pcx(p), dy=(e.y+e.h)-pfeet(p);
    if(Math.abs(dx)>20||Math.abs(dy)>16)continue;
    var behind=(e.dir>0&&dx>0)||(e.dir<0&&dx<0);
    var unaware=(e.state!=='chase'&&e.state!=='attack')||e.stun>0;
    if(!(behind||e.stun>0||p.vy>60)||!unaware)continue;
    var d=dx*dx+dy*dy; if(d<bd){bd=d;best=e;}}
  return best;
}
function playerHurt(p,dmg,fromX){
  if(p.invT>0||p.dead)return;
  var dir=fromX>pcx(p)?-1:1;
  if(p.blockT>0&&((dir<0&&p.dir>0)||(dir>0&&p.dir<0))){
    sfx('clang'); sparks(pcx(p)+p.dir*8,pcy(p),p.dir); shake(1.6);
    p.vx=dir*40; p.invT=0.25; return;
  }
  p.hp-=dmg; p.invT=1.0; p.hurtT=0.34; setAnim(p,'hurt');
  p.vx=dir*70; p.vy=-70; shake(2.4); gore(pcx(p),pcy(p),dir);
  if(p.hp<=0){ p.hp=0; p.dead=1; setAnim(p,'dead'); sfx('die'); musStop();
    G.over=1; G.endT=1.4; }
  else sfx('hurt');
}
function playerAttack(p){
  if(p.atkT>0||p.takeT>0||p.dead)return;
  p.atkT=0.34; p.atkHit=0; setAnim(p,'attack'); sfx('slash');
  noiseAt(pcx(p),pcy(p),70,'atk');
}
function doTakedown(p,g){
  p.takeT=0.55; p.takeTgt=g; setAnim(p,'take');
  p.x=g.x+(g.dir>0?-10:g.w+1); p.dir=g.dir; p.vx=0;
  g.stun=2.5; g.beingKilled=1;
}
function whistle(p){
  p.whistleT=3.2; sfx('susp'); noiseAt(pcx(p),pcy(p),150,'whistle');
  for(var i=0;i<4;i++)part(pcx(p)+p.dir*6,pcy(p)-6,p.dir*(20+i*12),-8-i*4,0.5,'#78c489',1,-10);
}
function updPlayer(p,dt){
  var lf=K.left,rt=K.right,up=K.up,dn=K.down;
  p.t+=dt; if(p.dropT>0)p.dropT-=dt; if(p.invT>0)p.invT-=dt;
  if(p.whistleT>0)p.whistleT-=dt;
  if(p.blockT>0)p.blockT-=dt;
  if(G.over&&!p.dead){ lf=rt=up=dn=0; }

  if(p.dead){ p.vy+=700*dt; collideY(p,p.vy*dt); return; }

  /* ---- takedown lock ---- */
  if(p.takeT>0){
    p.takeT-=dt; p.f=p.takeT>0.36?0:(p.takeT>0.18?1:2);
    if(p.takeT<=0.30&&p.takeTgt&&!p.takeTgt.dead){
      killGuard(p.takeTgt,p.dir,1); p.takeTgt=null;
      sfx('take'); shake(2); }
    if(p.takeT<=0){ p.takeTgt=null; setAnim(p,'idle'); }
    return;
  }
  /* ---- dodge roll ---- */
  if(p.rollT>0){
    p.rollT-=dt; setAnim(p,'roll');
    p.ft+=dt; if(p.ft>0.09){p.ft=0;p.f^=1;}
    p.vx=p.dir*116; p.vy+=700*dt; p.onGround=0;
    collideX(p,p.vx*dt); collideY(p,p.vy*dt);
    if(((G.t*14)|0)%2===0)dust(pcx(p),pfeet(p),1);
    if(p.rollT<=0){
      if(!K.down&&rectFree(p.x,p.y-7,p.w,18)){ p.crouch=0; p.y-=7; p.h=18; }
      setAnim(p,'idle');
    }
    return;
  }
  /* ---- ledge hang ---- */
  if(p.st==='hang'){
    p.vx=0; p.vy=0; p.ft+=dt;
    if(p.ft>0.18)p.f=((p.t*3)|0)&1;
    if(press('up')||K.up){ p.st='ledge'; p.climbT=0.34; p.f=0; sfx('step'); }
    else if(K.down||press('down')){ p.st='fall'; p.y+=3; p.hang=null; p.dropT=0.2; }
    else if(press('atk')&&0){}
    return;
  }
  if(p.st==='ledge'){
    p.climbT-=dt; p.f=p.climbT>0.17?0:1;
    if(p.climbT<=0){
      p.y=p.hang.y-p.h; p.x=p.dir>0?p.hang.x+2:p.hang.x-p.w-2;
      if(!rectFree(p.x,p.y,p.w,p.h))p.y-=3;
      p.hang=null; setAnim(p,'idle'); p.vy=0; dust(pcx(p),pfeet(p),3);
    }
    return;
  }
  /* ---- ladders ---- */
  var midT=tileAtPx(pcx(p),pcy(p)), headT=tileAtPx(pcx(p),p.y+3);
  var onLad=CLIMB[midT]||CLIMB[headT];
  if(onLad&&(up||dn)&&!p.ladder&&p.atkT<=0){ p.ladder=1; p.vx=0;p.vy=0;
    p.x=Math.floor(pcx(p)/TS)*TS+TS/2-p.w/2; }
  if(p.ladder){
    if(!onLad&&!CLIMB[tileAtPx(pcx(p),pfeet(p)-2)])p.ladder=0;
    else{
      setAnim(p,'ladder'); p.vy=0;
      var lv=(up?-1:0)+(dn?1:0);
      if(lv){ p.ft+=dt; if(p.ft>0.14){p.ft=0;p.f^=1;} }
      collideY(p,lv*38*dt);
      if(lv&&((G.t*6|0)%9===0))sfx('step');
      if(lf||rt){ p.dir=rt?1:-1; }
      if(press('up')&&!CLIMB[tileAtPx(pcx(p),p.y-2)]&&!lv){}
      if(press('atk')||press('stl')){ p.ladder=0; p.vy=-150; p.vx=p.dir*40; }
      if((lf||rt)&&rectFree(p.x+(rt?1:-1)*10,p.y,p.w,p.h)&&!CLIMB[tileAtPx(pcx(p)+(rt?12:-12),pcy(p))]){
        p.ladder=0; p.vx=(rt?1:-1)*50; }
      if(dn&&p.onGround)p.ladder=0;
      return;
    }
  }
  /* ---- crouch ---- */
  var wantCrouch=dn&&p.onGround&&p.atkT<=0;
  if(wantCrouch&&!p.crouch){ p.crouch=1; p.y+=7; p.h=11; }
  else if(!wantCrouch&&p.crouch){
    if(rectFree(p.x,p.y-7,p.w,18)){ p.crouch=0; p.y-=7; p.h=18; }
  }
  /* ---- horizontal ---- */
  var spd=p.crouch?34:(p.st==='block'?26:78), acc=p.onGround?700:400;
  var want=(rt?1:0)-(lf?1:0);
  if(p.hurtT>0){ p.hurtT-=dt; want=0; }
  if(p.atkT>0)want*=0.35;
  if(want){ p.vx=apr(p.vx,want*spd,acc*dt); if(p.atkT<=0&&p.hurtT<=0)p.dir=want; }
  else p.vx=apr(p.vx,0,(p.onGround?760:260)*dt);
  /* ---- jump ---- */
  if(press('up'))p.jbuf=0.13;
  if(p.jbuf>0)p.jbuf-=dt;
  if(p.onGround)p.coy=0.10; else if(p.coy>0)p.coy-=dt;
  if(p.jbuf>0&&p.coy>0&&p.atkT<=0&&!p.crouch){
    p.vy=-232; p.onGround=0; p.coy=0; p.jbuf=0; sfx('jump');
    dust(pcx(p),pfeet(p),4); noiseAt(pcx(p),pfeet(p),34,'step');
  }
  if(p.vy<0&&!K.up)p.vy+=520*dt;                 /* variable jump          */
  if(dn&&p.onGround&&press('down')){              /* drop through platform  */
    var ft=tileAtPx(pcx(p),pfeet(p)+2);
    if(ONEWAY[ft]||(p.ride&&p.ride.oneway)){ p.dropT=0.24; p.onGround=0; p.y+=2; sfx('step'); }
  }
  /* ---- attack / block / stealth ---- */
  if(press('atk')){
    var it=nearInteract(p);
    if(it){ it.interact(it,p); }
    else playerAttack(p);
  }
  p.blockT=(K.blk&&p.onGround&&p.atkT<=0)?0.12:p.blockT;
  if(press('blk')&&(K.left||K.right)&&p.onGround&&p.atkT<=0){
    p.rollT=0.40; p.invT=Math.max(p.invT,0.32); p.dir=K.right?1:-1;
    if(!p.crouch){p.crouch=1;p.y+=7;p.h=11;}
    sfx('step'); dust(pcx(p),pfeet(p),3); return;
  }
  if(press('stl')){
    var tg=takedownTarget(p);
    if(tg)doTakedown(p,tg);
    else if(p.whistleT<=0)whistle(p);
  }
  if(p.atkT>0){
    p.atkT-=dt;
    p.f=p.atkT>0.22?0:(p.atkT>0.09?1:2);
    if(!p.atkHit&&p.atkT<=0.24){ p.atkHit=1; swingHit(p); }
    if(p.atkT<=0)setAnim(p,'idle');
  }
  /* ---- gravity + move ---- */
  p.vy+=660*dt; if(p.vy>300)p.vy=300;
  var wasAir=!p.onGround; p.onGround=0; p.ride=null;
  collideX(p,p.vx*dt);
  collideY(p,p.vy*dt);
  if(p.ride&&p.ride.oneway){ p.x+=(p.ride.mvx||0)*dt; }
  if(p.onGround&&wasAir){
    if(p.fallV>170){ dust(pcx(p),pfeet(p),7); sfx('land'); shake(p.fallV>250?1.4:0.7);
      noiseAt(pcx(p),pfeet(p),p.fallV>240?90:55,'land'); }
    else if(p.fallV>60)dust(pcx(p),pfeet(p),3);
  }
  /* ---- ledge grab ---- */
  if(!p.onGround&&p.vy>10&&p.st!=='hang'&&!p.crouch&&(lf||rt)){
    var fx=p.dir>0?p.x+p.w+2:p.x-2, gy=p.y+3;
    var tx=Math.floor(fx/TS), ty=Math.floor(gy/TS);
    if(SOLID[tileIdx(tx,ty)]&&!SOLID[tileIdx(tx,ty-1)]&&
       ((p.dir>0&&rt)||(p.dir<0&&lf))&&p.y+3>ty*TS-4&&p.y+3<ty*TS+10){
      p.hang={x:p.dir>0?tx*TS:tx*TS+TS,y:ty*TS};
      p.y=ty*TS-2; p.x=p.dir>0?tx*TS-p.w-1:tx*TS+TS+1;
      p.vy=0;p.vx=0; setAnim(p,'hang'); sfx('step'); return;
    }
  }
  /* ---- hazards ---- */
  if(HAZARD[tileAtPx(pcx(p),pfeet(p)-1)]||HAZARD[tileAtPx(pcx(p),pcy(p))]){
    playerHurt(p,2,pcx(p)+(p.vx>0?9:-9));
    p.vy=-190; p.vx=-p.dir*60;
  }
  if(p.y>G.h*TS+40){ p.hp=0; p.dead=1; setAnim(p,'dead'); sfx('die'); G.over=1; G.endT=1.2; }
  /* ---- hide ---- */
  p.inHide=null;
  for(var i=0;i<G.ents.length;i++){var e=G.ents[i];
    if(e.type!=='hide')continue;
    if(pcx(p)>e.x&&pcx(p)<e.x+e.w&&pfeet(p)>e.y&&pfeet(p)<e.y+e.h+8)p.inHide=e;}
  p.hidden=(p.inHide&&p.crouch)?1:0;
  /* ---- noise from running ---- */
  p.noisy=0;
  if(p.onGround&&Math.abs(p.vx)>44){ p.noisy=1;
    if(((G.t*9)|0)!==p._sf){p._sf=(G.t*9)|0; sfx('step'); noiseAt(pcx(p),pfeet(p),48,'step');} }
  /* ---- animation ---- */
  if(p.atkT>0)setAnim(p,'attack');
  else if(p.hurtT>0)setAnim(p,'hurt');
  else if(p.blockT>0&&K.blk)setAnim(p,'block');
  else if(!p.onGround)setAnim(p,p.vy<-20?'jump':'fall');
  else if(p.crouch)setAnim(p,Math.abs(p.vx)>6?'sneak':'crouch');
  else if(Math.abs(p.vx)>10)setAnim(p,'run');
  else setAnim(p,'idle');
  var fps=p.st==='run'?11:(p.st==='sneak'?7:(p.st==='idle'?2.2:6));
  p.ft+=dt; var nf=POSEF[p.st]||1;
  if(p.ft>1/fps){ p.ft=0; p.f=(p.f+1)%nf; }
  if(p.st==='attack')p.f=p.atkT>0.22?0:(p.atkT>0.09?1:2);
}
function swingHit(p){
  var hx=p.dir>0?p.x+p.w-2:p.x-16, hy=p.y+(p.crouch?0:2), hw=18, hh=p.crouch?11:15;
  var hit=0;
  for(var i=0;i<G.ents.length;i++){ var e=G.ents[i];
    if(e.dead)continue;
    if(e.kind==='guard'){
      if(hx<e.x+e.w&&hx+hw>e.x&&hy<e.y+e.h&&hy+hh>e.y){
        hurtGuard(e,e.blockT>0?0:(1+(p.combo>1?1:0)),p.dir); hit=1; }
    }else if(e.breakable&&!e.broken){
      if(hx<e.x+e.w&&hx+hw>e.x&&hy<e.y+e.h&&hy+hh>e.y){ breakProp(e); hit=1; }
    }}
  if(hit){ shake(1.8); p.combo=(p.combo||0)+1; p.vx+=p.dir*26; }
}

function makeGuard(type,o){
  var s=GST[type];
  var g={kind:'guard',type:type,spr:s.spr,x:o.x-6,y:o.y-(s.boss?21:18),
    w:s.boss?12:10,h:s.boss?21:18,vx:0,vy:0,dir:o.face||1,onGround:0,
    hp:s.hp,maxhp:s.hp,st:'idle',f:0,ft:0,state:'patrol',sT:0,susp:0,alerted:0,
    stun:0,atkT:0,atkHit:0,blockT:0,shotT:0,dead:0,deadT:0,seen:0,found:0,
    p0:(o.p?o.p[0]*TS:o.x-40),p1:(o.p?o.p[1]*TS:o.x+40),homeX:o.x,homeY:o.y,
    invX:0,invY:0,slow:o.slow?1:0,boss:s.boss?1:0,phase:0,cool:0,ride:null,

function guardEye(g){ return {x:g.x+g.w/2, y:g.y+4}; }
function guardSee(g){
  var p=G.P;
  if(p.dead||p.hidden||g.dead)return 0;
  var e=guardEye(g), px2=pcx(p), py2=pcy(p);
  var dx=px2-e.x, dy=py2-e.y, ad=Math.abs(dx);
  var range=GST[g.type].sight*(g.alerted?1.3:1)*(g.state==='invest'||g.state==='search'?1.15:1);
  if(p.crouch)range*=0.60;
  if(!p.noisy&&Math.abs(p.vx)<8&&p.onGround)range*=0.85;
  if(p.inHide)range*=0.55;
  if(ad>range||Math.abs(dy)>62)return 0;
  var front=(dx>=0&&g.dir>0)||(dx<=0&&g.dir<0);
  if(!front&&ad>18)return 0;
  if(Math.abs(dy)>26&&ad<10)return 0;
  if(!losClear(e.x,e.y,px2,py2))return 0;
  var v=1-ad/range; if(!front)v*=0.5;
  return clamp(v*1.35,0.08,1.3);
}
function shout(g,x,y,rad){

    if(o.kind!=='guard'||o.dead||o===g)continue;
    if(dist2(o.x,o.y,g.x,g.y)<rad*rad){
      if(o.state!=='chase'){ o.state='invest'; o.sT=0; o.invX=x; o.invY=y;
        o.susp=Math.max(o.susp,0.72); o.mark=1; o.markT=1.4; o.alerted=1; }
    }}
}
function alertGuard(g){

function hurtGuard(g,dmg,dir){

function guardWalk(g,want,spd,dt){

  if(g.onGround&&g.state!=='chase'){
    var below=tileAtPx(ahead,g.y+g.h+4), belowSolid=SOLID[below]||ONEWAY[below];
    if(!belowSolid&&!ridingSolid(g,ahead))want=0;
  }
  var wall=SOLID[tileAtPx(ahead+want*4,g.y+g.h-6)];
  if(wall&&g.onGround){
    if(g.state==='chase'&&!SOLID[tileAtPx(ahead+want*4,g.y+g.h-22)]){ g.vy=-200; }
    else want=0;

function ridingSolid(g,x){

function updGuard(g,dt){
  var p=G.P, s=GST[g.type];

    g.deadT+=dt; g.vy+=700*dt; g.vx=apr(g.vx,0,300*dt);

  }
  if(g.stun>0){ g.stun-=dt; g.st='hurt';

  if(g.markT>0)g.markT-=dt;

    if(g.susp>=1)alertGuard(g);

      g.invX=pcx(p); g.invY=pcy(p); }
  }else{
    g.susp=Math.max(0,g.susp-dt*(g.state==='chase'?0.20:0.42));
  }
  /* hear noises */
  for(var n=0;n<G.noises.length;n++){var no=G.noises[n];
    if(no.used&&no.used[g._id])continue;

    if(d2<no.r*no.r&&g.state!=='chase'){
      if(!no.used)no.used={}; no.used[g._id]=1;
      g.invX=no.x; g.invY=no.y; g.state='invest'; g.sT=0;
      g.susp=Math.max(g.susp,no.src==='fight'?0.85:0.5);

    }}
  /* see bodies */
  if(!g.found&&g.state!=='chase'){
    for(var b=0;b<G.ents.length;b++){var o=G.ents[b];

      var bdx=(o.x-g.x), abx=Math.abs(bdx);
      if(abx<86&&Math.abs(o.y-g.y)<40&&((bdx>0&&g.dir>0)||(bdx<0&&g.dir<0))&&
         losClear(g.x+g.w/2,g.y+6,o.x+o.w/2,o.y+o.h/2)){
        g.found=1; g.susp=Math.max(g.susp,0.9); g.state='invest'; g.sT=0;
        g.invX=o.x; g.invY=o.y; g.mark=1; g.markT=1.6; sfx('susp');
        shout(g,o.x,o.y,120); G.alarm=Math.max(G.alarm,0.6); G.alertT=Math.max(G.alertT,3);
      }}
  }
  var want=0;
  switch(g.state){
  case 'patrol': {
    var tgt=g.dir>0?g.p1:g.p0;
    want=guardWalk(g,g.dir,spd,dt);
    if(want===0||Math.abs(g.x-tgt)<8){ g.state='pause'; g.sT=0.6+Math.random()*1.4; g.vx=0; }
    g.st=Math.abs(g.vx)>4?'walk':'idle';
    break; }
  case 'pause': {

  case 'chase': {

        if(B2.rung)continue; var dd=dist2(g.x,g.y,B2.x,B2.y);
        if(dd<bd&&dd<300*300&&Math.abs(B2.y-g.y)<50){bd=dd;bb=B2;}}
      if(bb&&Math.random()<0.02){ g.bell=bb; g.bellTried=1; g.state='bell'; break; }
    }
    if(g.atkT>0)break;
    if(s.ranged){
      if(adc<70){ guardWalk(g,dxc>0?-1:1,spd*0.9,dt); g.st='walk'; g.dir=dxc>0?1:-1; }
      else if(adc>s.reach){ guardWalk(g,dxc>0?1:-1,spd,dt); g.st='walk'; }
      else { g.vx=apr(g.vx,0,600*dt); g.dir=dxc>0?1:-1;

    }else{

function findLadder(g){

function pullLever(e,p){

function updAlly(a,dt){
  var p=G.P;

  if(!a.free){ a.st='idle'; a.dir=(pcx(p)>a.x)?1:-1; return; }

  if(!a._tt||G.t-a._tt>0.08){ a._tt=G.t; a.trail.push({x:pcx(p),y:pfeet(p)});
    if(a.trail.length>26)a.trail.shift(); }
  var tgt=a.trail.length>14?a.trail[a.trail.length-14]:null;
  var want=0;
  if(tgt){
    var dx=tgt.x-(a.x+a.w/2);
    if(Math.abs(dx)>12){ want=dx>0?1:-1; a.dir=want; }
    if(tgt.y<a.y-6&&a.onGround)a.vy=-210;
  }
  if(dist2(a.x,a.y,pcx(p),pfeet(p))>240*240){ a.x=pcx(p)-4; a.y=pfeet(p)-18; a.vy=0; a.trail=[]; }
  var ahead=a.x+a.w/2+want*9;

    if(tgt&&tgt.y>a.y+8){} else a.vy=-190;
  }
  if(a.onGround&&SOLID[tileAtPx(ahead,a.y+a.h-6)])a.vy=-200;
  a.vx=apr(a.vx,want*54,700*dt);
  a.vy+=700*dt; if(a.vy>300)a.vy=300;
  a.onGround=0; collideX(a,a.vx*dt); collideY(a,a.vy*dt);
  if(HAZARD[tileAtPx(a.x+a.w/2,a.y+a.h-1)])hurtAlly(a,1);
  a.st=Math.abs(a.vx)>8?(a.onGround?'walk':'jump'):(a.onGround?'idle':'fall');
  a.ft+=dt; var nf=POSEF[a.st]||1;

}
function updHerald(h,dt){

  if(g.hp<=g.maxhp*0.30&&g.phase<2){ g.phase=2; summonGuards(g,2); g.rage=1;
    banner('"YOU DIE HERE, SHADOW."',1.8); }

    g.vy+=700*dt; g.onGround=0; g.bumpX=0;

    if(!p.dead&&aabb(g,p))playerHurt(p,2,g.x+g.w/2);
    if(g.dashT<=0)g.cool=0.7;
    return true;
  }
  if(g.state==='chase'&&g.cool<=0&&g.atkT<=0){
    var ad=Math.abs(pcx(p)-(g.x+g.w/2));

      g.dashT=0.55+(g.rage?0.12:0); g.dir=pcx(p)>g.x?1:-1; sfx('slash'); shake(1.6);
      return true; }
  }
  return false;
}

function renderWorld(){
  var sh=G.shake, ox=sh?(Math.random()*2-1)*sh:0, oy=sh?(Math.random()*2-1)*sh:0;
  var cx=clamp(Math.round(G.cam.x+ox),0,Math.max(0,G.w*TS-SW));
  var cy=clamp(Math.round(G.cam.y+oy),0,Math.max(0,G.h*TS-VH));
  drawSky(cx,cy);
  X.save(); X.beginPath(); X.rect(0,VY,SW,VH); X.clip();
  X.translate(-cx,VY-cy);
  X.drawImage(G.baked,cx,cy,SW,VH,cx,cy,SW,VH);
  var i,e,p=G.P;
  for(i=0;i<G.ents.length;i++){ e=G.ents[i];
    if(e.x+ (e.w||16) <cx-24||e.x>cx+SW+24)continue;
    if(e.type==='hide'||e.type==='torch'||e.type==='sign'||e.type==='check'||
       e.type==='goal'||e.type==='bell'||e.type==='gate'||e.type==='mover'||e.type==='lever'){
      if(e.type==='torch')drawTorch(e); else if(!e.dead)drawProp(e); }
  }
  for(i=0;i<G.ents.length;i++){ e=G.ents[i];
    if(e.dead&&e.kind!=='guard')continue;
    if(e.x+(e.w||16)<cx-24||e.x>cx+SW+24)continue;
    if(e.kind==='guard'){
      if(!e.dead)drawGuardExtras(e);
      X.globalAlpha=e.dead?0.95:1;
      drawFig(e,e.spr,e.st,e.f); X.globalAlpha=1;
    }else if(e.type==='npc'){ drawFig(e,'ally',e.st,e.f);
      if(!e.free&&!e.dead&&((G.t*2)|0)%2)txtc(X,'?',e.x+5,e.y-10,P.ui3,1,'#000');
    }else if(e.type==='herald'){ drawFig(e,'herald',e.st,e.f);
      if(!e.caught)txtc(X,'!',e.x+5,e.y-10,P.gold2,1,'#000');
    }else if(e.type!=='hide'&&e.type!=='torch'&&e.type!=='sign'&&e.type!=='check'&&
             e.type!=='goal'&&e.type!=='bell'&&e.type!=='gate'&&e.type!=='mover'&&e.type!=='lever'){
      drawProp(e); }
  }
  /* player */
  if(p){
    var alpha=(p.invT>0&&((G.t*22)|0)%2===0)?0.35:1;
    if(p.hidden)alpha*=0.55;
    X.globalAlpha=alpha;
    drawFig(p,'player',p.st,p.f);
    X.globalAlpha=1;
    if(p.hidden){ txtc(X,'HIDDEN',pcx(p),p.y-10,P.ui3,1,'#0c1410'); }
    if(p.whistleT>2.9){ var r=(3.2-p.whistleT)*90;
      X.strokeStyle='rgba(120,196,137,.5)'; X.lineWidth=1;
      X.beginPath(); X.arc(pcx(p),pcy(p),r,0,6.3); X.stroke(); }
  }
  /* particles */
  for(i=0;i<G.parts.length;i++){ var q=G.parts[i];
    X.globalAlpha=Math.min(1,q.l/q.ml*1.6);
    X.fillStyle=q.c; X.fillRect(q.x|0,q.y|0,q.s,q.s); }
  X.globalAlpha=1;
  /* night veil + lights */
  var veil=G.L.sky==='dungeon'?0.46:(G.L.sky==='palace'?0.30:0.26);
  X.fillStyle='rgba(8,10,26,'+veil+')'; X.fillRect(cx,cy,SW,VH);
  X.globalCompositeOperation='lighter';
  for(i=0;i<G.torches.length;i++){ e=G.torches[i];
    if(e.x<cx-40||e.x>cx+SW+40)continue;
    var fl=1+Math.sin(e.t*9)*0.06;
    X.globalAlpha=0.9*fl; X.drawImage(GLOW,e.x-29,e.y-31,62,62); }
  for(i=0;i<G.ents.length;i++){ e=G.ents[i];
    if(e.type==='item'&&!e.dead&&e.x>cx-40&&e.x<cx+SW+40){
      X.globalAlpha=0.5; X.drawImage(GLOW,e.x-24,e.y-24,58,58); } }
  X.globalAlpha=1; X.globalCompositeOperation='source-over';
  X.restore();
}

/* =============================================================== mission */
function objDone(o){
  switch(o.id){
  case 'coins': return G.coins>=o.need;
  case 'catch': return !!G.flags.catch;
  case 'orders': return !!G.hasItem.orders;
  case 'key': return !!G.hasItem.key;
  case 'free': return !!G.flags.free;
  case 'boss': return !!G.bossDead;
  case 'hall': return !!G.flags.hall;
  case 'silent': return !G.bellRung;
  case 'gate': return !!G.flags.gate;
  default: return !!G.flags[o.id];
  }
}
function goalReady(){
  for(var i=0;i<G.objs.length;i++){ var o=G.objs[i];
    if(o.opt||o.id==='gate')continue;
    if(!objDone(o))return false; }
  return true;
}
function tryFinish(){
  if(!goalReady()){
    for(var i=0;i<G.objs.length;i++){var o=G.objs[i];
      if(!o.opt&&o.id!=='gate'&&!objDone(o)){ say('FIRST: '+o.t); sfx('back'); return; }}
    return;
  }
  if(G.ally&&!G.ally.dead&&dist2(G.ally.x,G.ally.y,G.P.x,G.P.y)>90*90){
    say('KARIM IS TOO FAR BEHIND'); sfx('back'); return; }
  G.flags.gate=1; completeMission();
}
function completeMission(){
  if(G.over)return;
  G.over=2; musStop(); sfx('win');
  var rank = (G.kills===0&&!G.everAlert)?'GHOST':((!G.everAlert)?'SHADOW':(G.bellRung?'BLOODY':'BLADE'));
  G.rank=rank;
  SAVE.done[G.lvl]=1;
  if(SAVE.unlocked<G.lvl+2)SAVE.unlocked=Math.min(LEVELS.length,G.lvl+2);
  var b=SAVE.best[G.lvl]||{coins:0};
  if(G.coins>=(b.coins||0))SAVE.best[G.lvl]={coins:G.coins,rank:rank,kills:G.kills};
  storeSave();
  fadeTo(function(){ G.st=(G.lvl>=LEVELS.length-1)?'end':'done'; G.selT=0; });
}
function failMission(reason){
  if(G.over)return;
  G.over=1; G.failMsg=reason||'YOU WERE KILLED'; G.endT=1.3; musStop(); sfx('fail');
}
function loadLevel(i,fromCheck){
  var L=LEVELS[i]; G.lvl=i; G.L=L; G.w=L.w; G.h=L.h;
  var B=Builder(L.w,L.h); L.build(B);
  G.grid=B.g; G.zones=B.zones;
  spawnEnts(B.ents);
  bakeLevel(); buildBg();
  var sx=L.spawn[0]*TS+8, sy=L.spawn[1]*TS+16;
  if(fromCheck&&G.checkX!==undefined&&G.checkLvl===i){ sx=G.checkX+4; sy=G.checkY; }
  else { G.checkX=undefined; G.coins=0; }
  G.checkLvl=i;
  G.P=makePlayer(sx,sy);
  G.parts=[]; G.alarm=0; G.alertT=0; G.t=0; G.shake=0; G.over=0; G.endT=0;
  G.kills=0; G.everAlert=0; G.secret=0; G.flags={}; G.hasItem={};
  G.msg=''; G.msgT=0; G.banner=''; G.bannerT=0; G.signTxt=null;
  G.timer=L.time||0; G.paused=0; G.rank='';
  G.objs=[]; for(var k=0;k<L.obj.length;k++){var o=L.obj[k];
    G.objs.push({id:o.id,t:o.t,need:o.need,opt:o.opt,done:0});}
  G.cam.x=clamp(sx-SW/2,0,G.w*TS-SW); G.cam.y=clamp(sy-VH/2,0,G.h*TS-VH);
  musPlay(L.music);
}
function updPlay(dt){
  var i,e,p=G.P;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*16);
  if(G.msgT>0)G.msgT-=dt;
  if(G.bannerT>0)G.bannerT-=dt;
  updPlayer(p,dt);
  var n=G.ents.length;
  for(i=0;i<n;i++){ e=G.ents[i];
    if(e.kind==='guard'){
      if(e.boss){ if(bossTick(e,dt))continue; }
      updGuard(e,dt);
    }else if(e.kind==='arrow'){ updArrow(e,dt); }
    else if(e.type==='npc'){ updAlly(e,dt); }
    else if(e.type==='herald'){ updHerald(e,dt); }
  }
  for(i=G.ents.length-1;i>=0;i--)if(G.ents[i].dead&&(G.ents[i].kind==='arrow'||G.ents[i].kind==='pick'))
    G.ents.splice(i,1);
  updProps(dt); updParts(dt);
  /* alarm state */
  var chasing=0, maxS=0;
  for(i=0;i<G.ents.length;i++){ e=G.ents[i];
    if(e.kind!=='guard'||e.dead)continue;
    if(e.state==='chase'||e.state==='bell')chasing=1;
    if(e.susp>maxS)maxS=e.susp; }
  if(chasing){ G.alarm=1; G.alertT=6; G.everAlert=1; }
  else{ if(G.alertT>0)G.alertT-=dt;
    G.alarm=Math.max(G.alertT/6*0.92,Math.min(0.8,maxS)); }
  if(AU.ready){ if(G.alarm>0.7)musSet('chase'); else if(G.alertT<=0)musSet(G.L.music); }
  /* zones */
  for(i=0;i<G.zones.length;i++){ var z=G.zones[i];
    if(pcx(p)>z.x&&pcx(p)<z.x+z.w&&pcy(p)>z.y&&pcy(p)<z.y+z.h){
      if(!G.flags[z.id]){ G.flags[z.id]=1;
        if(z.id==='secret'){ G.secret=1; sfx('ok'); banner('HIDDEN PLACE FOUND',1.6); } } } }
  /* objectives */
  for(i=0;i<G.objs.length;i++){ var o=G.objs[i];
    if(!o.done&&objDone(o)){ o.done=1;
      if(!o.opt){ sfx('ok'); banner('OBJECTIVE COMPLETE',1.5); }
      else banner('BONUS: '+o.t,1.4); } }
  /* timer */
  if(G.L.time&&!G.over){
    G.timer-=dt;
    if(G.timer<=0){ G.timer=0; failMission('THE MESSENGER REACHED THE GATE'); } }
  /* camera */
  var tx=pcx(p)+p.dir*16-SW/2, ty=pcy(p)-VH*0.54;
  if(!p.onGround)ty=pcy(p)-VH/2-2;
  var k=1-Math.pow(0.0012,dt);
  G.cam.x=lerp(G.cam.x,tx,k); G.cam.y=lerp(G.cam.y,ty,k*0.9);
  G.cam.x=clamp(G.cam.x,0,Math.max(0,G.w*TS-SW));
  G.cam.y=clamp(G.cam.y,0,Math.max(0,G.h*TS-VH));
  /* end sequence */
  if(G.over===1){ G.endT-=dt;
    if(G.endT<=0)fadeTo(function(){G.st='fail';}); }
}
/* =============================================================== screens */
var MENU={i:0,items:[]}, TITLE_T=0;
function fadeTo(cb){ if(G.fadeCB)return; G.fade=0; G.fadeDir=1; G.fadeCB=cb; }
function fadeIn(){ G.fade=1; G.fadeDir=-1; G.fadeCB=null; }
function updFade(dt){
  if(G.fadeDir>0){ G.fade+=dt*3.2;
    if(G.fade>=1){ G.fade=1; G.fadeDir=-1; if(G.fadeCB){var c=G.fadeCB;G.fadeCB=null;c();} } }
  else if(G.fade>0){ G.fade-=dt*3.0; if(G.fade<0)G.fade=0; }
}
function menuNav(n){
  if(press('up')){MENU.i=(MENU.i+n-1)%n;sfx('menu');}
  if(press('down')){MENU.i=(MENU.i+1)%n;sfx('menu');}
  return press('atk')||press('s1');
}
function drawLogo(y){

  txtc(X,'OLD CITY',SW/2,y+38,P.gold2,1,'#0c1410');
  /* blade motif */
  var bx=SW/2+52, by=y+8, sw=Math.sin(t*2)*2;
  X.fillStyle=P.steel1; for(var i=0;i<16;i++)X.fillRect(bx+i*0.6+sw,by+16-i,2,2);
  X.fillStyle=P.steel3; for(i=0;i<10;i++)X.fillRect(bx+i*0.6+sw+1,by+16-i,1,1);
  X.fillStyle=P.cloth1; X.fillRect(bx-2+sw,by+15,6,3);

function updScreens(dt){
  G.t+=dt; TITLE_T+=dt;
  switch(G.st){
  case 'boot':
    if(G.t>1.9||anyPress())fadeTo(function(){G.st='title';G.t=0;});
    break;
  case 'title':
    if(press('atk')||press('s1')||press('stl')){ sfx('ok');
      MENU.i=0; fadeTo(function(){G.st='menu';}); }
    break;
  case 'menu': {
    var items=['NEW GAME','MISSIONS','HOW TO PLAY','SOUND: '+(AU.on?'ON':'OFF')];
    MENU.items=items;
    if(menuNav(items.length)){
      sfx('ok');
      if(MENU.i===0){ SAVE.unlocked=Math.max(1,SAVE.unlocked); storeSave();
        fadeTo(function(){ loadLevel(0); G.st='brief'; G.briefT=0; }); }
      else if(MENU.i===1){ MENU.i=0; fadeTo(function(){G.st='select';}); }
      else if(MENU.i===2){ fadeTo(function(){G.st='howto';}); }
      else { AU.on=!AU.on; SAVE.sound=AU.on?1:0; storeSave();
        if(AU.on){auInit();auResume();musPlay('menu');} else musStop(); }
    }
    if(press('pause')||press('s2')){ sfx('back'); fadeTo(function(){G.st='title';}); }
    break; }
  case 'select': {
    if(press('up')){MENU.i=(MENU.i+LEVELS.length-1)%LEVELS.length;sfx('menu');}
    if(press('down')){MENU.i=(MENU.i+1)%LEVELS.length;sfx('menu');}
    if(press('atk')||press('s1')){
      if(MENU.i<SAVE.unlocked){ sfx('ok');
        var pick=MENU.i;
        fadeTo(function(){ loadLevel(pick); G.st='brief'; G.briefT=0; }); }
      else sfx('back');
    }
    if(press('pause')||press('s2')){ sfx('back'); MENU.i=0; fadeTo(function(){G.st='menu';}); }
    break; }
  case 'howto':
    if(press('atk')||press('s1')||press('pause')||press('s2')){ sfx('back');
      fadeTo(function(){G.st='menu';}); }
    break;
  case 'brief':
    G.briefT+=dt;
    if(press('atk')||press('s1')){
      var full=G.L.brief.join('').length;
      if(G.briefT*26<full)G.briefT=full/26;
      else fadeTo(function(){ G.st='play'; banner(G.L.name,2.0); });
    }
    if(press('pause')||press('s2')){ sfx('back'); musStop();
      fadeTo(function(){G.st='select';}); }
    break;
  case 'play':
    if(press('pause')){ sfx('menu'); MENU.i=0; G.st='pause'; break; }
    updPlay(dt);
    break;
  case 'pause': {
    var pit=['RESUME','RESTART CHECKPOINT','RESTART MISSION','SOUND: '+(AU.on?'ON':'OFF'),'ABANDON'];
    MENU.items=pit;
    if(press('pause')){ sfx('menu'); G.st='play'; break; }
    if(menuNav(pit.length)){ sfx('ok');
      if(MENU.i===0)G.st='play';
      else if(MENU.i===1)fadeTo(function(){loadLevel(G.lvl,1);G.st='play';});
      else if(MENU.i===2)fadeTo(function(){G.checkX=undefined;loadLevel(G.lvl);G.st='play';});
      else if(MENU.i===3){ AU.on=!AU.on; SAVE.sound=AU.on?1:0; storeSave();
        if(AU.on){auInit();auResume();musPlay(G.L.music);}else musStop(); }
      else { musStop(); MENU.i=0; fadeTo(function(){G.st='select';}); }
    }
    break; }
  case 'done': {
    G.selT=(G.selT||0)+dt;
    if(press('atk')||press('s1')){ sfx('ok');
      var nx=G.lvl+1;
      fadeTo(function(){ if(nx<LEVELS.length&&nx<SAVE.unlocked){ loadLevel(nx); G.st='brief'; G.briefT=0; }
        else { MENU.i=0; G.st='select'; musPlay('menu'); } });
    }
    break; }
  case 'fail': {
    var fit2=['RETRY FROM CHECKPOINT','RESTART MISSION','ABANDON'];
    MENU.items=fit2;
    if(menuNav(fit2.length)){ sfx('ok');
      if(MENU.i===0)fadeTo(function(){loadLevel(G.lvl,1);G.st='play';});
      else if(MENU.i===1)fadeTo(function(){G.checkX=undefined;loadLevel(G.lvl);G.st='play';});
      else { MENU.i=0; fadeTo(function(){G.st='select';musPlay('menu');}); }
    }
    break; }
  case 'end':
    G.selT=(G.selT||0)+dt;
    if(press('atk')||press('s1')){ sfx('ok'); MENU.i=0;
      fadeTo(function(){G.st='title';musPlay('menu');}); }
    break;
  }
}

function drawSkyMenu(){

  X.fillStyle=P.moon; X.fillRect(187,26,18,20); X.fillRect(186,27,20,18);

  var base=SH-60;
  for(i=0;i<14;i++){ var w=12+((i*37)%26), h=20+((i*53)%70);
    X.fillStyle=P.far1; X.fillRect(i*18-4,base-h,w,h+60);
    if(i%3===0){ X.fillStyle=P.far2; X.fillRect(i*18+w/2-1,base-h-8,2,8); }
    for(var q=0;q<3;q++)if(((i*7+q*11)%5)<2){ X.fillStyle='#4a3a1e';
      X.fillRect(i*18+2,base-h+8+q*10,3,4); } }
}
/* ================================================================== loop */
var last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.2)dt=0.2;
  acc+=dt;
  var steps=0;
  while(acc>=STEP&&steps<5){
    updScreens(STEP);
    updFade(STEP);
    acc-=STEP; steps++;
  }
  if(acc>STEP*5)acc=0;
  drawScreens();
  if(G.fade>0)drawDither(G.fade,'#04060a');
  drawScan();
  clearPress();
}
/* ================================================================== boot */
function fit(){
  var ph=document.getElementById('phone'), fs=document.body.classList.contains('fs');
  if(fs){
    var s=Math.min(innerWidth/SW,innerHeight/SH);
    cvs.style.width=(SW*s)+'px'; cvs.style.height=(SH*s)+'px';
  }else{
    cvs.style.width='240px'; cvs.style.height='320px';
    var sc=Math.min(innerWidth/336,innerHeight/678,1.6);
    ph.style.transform='scale('+sc+')';
  }
}
function toggleFS(){
  var b=document.body;
  b.classList.toggle('fs');
  var fs=b.classList.contains('fs');
  document.getElementById('fsbtn').innerHTML=fs?'&#9974; WINDOW':'&#9974; FULLSCREEN';
  if(fs&&document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(function(){});
  else if(!fs&&document.fullscreenElement&&document.exitFullscreen)
    document.exitFullscreen().catch(function(){});
  fit();
}
function boot(){
  loadSave();
  buildTiles(); buildChars(); buildGlow();
  bindButtons();
  document.getElementById('fsbtn').addEventListener('click',function(e){
    e.preventDefault(); auInit(); auResume(); toggleFS(); });
  addEventListener('resize',fit);
  addEventListener('orientationchange',function(){setTimeout(fit,120);});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&G.st==='play'){G.st='pause';MENU.i=0;} });
  cvs.addEventListener('pointerdown',function(){auInit();auResume();
    if(AU.on&&!MU.name&&G.st!=='play')musPlay('menu');});
  fit();
  G.st='boot'; G.t=0; G.fade=1; G.fadeDir=-1;
  requestAnimationFrame(frame);
}
boot();
