<!doctype html><html><head><meta charset="utf-8">
<meta name="art" data-out="src/assets/art/scene-heart.webp" data-w="1080" data-h="900" data-scale="1" data-quality="78">
<title>scene-heart</title>
</head><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="module">
/*
 * HEART TRIAL — two players in a rain-soaked alley. One is hurt and sits
 * against the wall; the other stands over them, deciding. Crimson backlight
 * from the street beyond, a neon heart blade sign, wet ground reflections.
 * Bottom ~35% fades into #09090b for UI text.
 */
import { setup, done } from '../lib/paint.js';
import {
  rand, layer, clamp, lerp, smooth, rgba, TAU, blurred, bloom, brightPass, fadeBottom, cinematicGrade,
  rimFromMask, rainLit, particles, grainLuma, light, chroma, spline, capsule, noiseLayer,
} from '../lib/world-kit.js';
import { makeCamera, scatter, renderPixels, tone, valueNoise } from '../lib/world-3d.js';

const { ctx, W, H } = setup();
if (!new URLSearchParams(location.search).has('v')) done();
else setTimeout(paint, 20);

function paint() {
  const cam = makeCamera({ F: 1100, cx: 540, cy: 270, pos: [0, 1.2, 0] });
  // figures and the backdrop were laid out for F=900/cy=292; Z maps that layout onto this framing
  const ZX = (x) => 540 + (x - 540) * (1100 / 900), ZY = (y) => 270 + (y - 292) * (1100 / 900), ZS = 1100 / 900;
  const WL = -1.9, WR = 1.6, ZEND = 30, YTOP = 24;
  const n1 = valueNoise(11), n2 = valueNoise(12), n3 = valueNoise(13);
  const RED = [1.0, 0.1, 0.09];

  /* ---------------------------------------------------------- backdrop: the street beyond */
  const BD = layer(W, H);
  {
    const b = BD.ctx;
    b.setTransform(ZS, 0, 0, ZS, 540 - 540 * ZS, 270 - 292 * ZS);
    const g = b.createLinearGradient(0, 0, 0, 330);
    g.addColorStop(0, 'rgb(18,3,6)');
    g.addColorStop(0.5, 'rgb(70,8,14)');
    g.addColorStop(0.85, 'rgb(150,22,26)');
    g.addColorStop(1, 'rgb(200,50,44)');
    b.fillStyle = g;
    b.fillRect(0, 0, W, 340);
    // distant facades across the street
    const r = rand(5);
    for (let x = 470; x < 610; x += r.range(8, 22)) {
      const top = r.range(40, 210);
      b.fillStyle = `rgba(${20 + r() * 20},4,8,${0.55 + r() * 0.3})`;
      b.fillRect(x, top, r.range(10, 26), 330 - top);
      for (let k = 0; k < 8; k++) {
        if (r() < 0.6) continue;
        b.fillStyle = r() < 0.7 ? 'rgba(255,90,80,0.8)' : 'rgba(255,190,140,0.7)';
        b.fillRect(x + r.range(2, 14), r.range(top + 4, 320), 2, 2.4);
      }
    }
    // a lamp post silhouette and a bright source low in the street
    b.fillStyle = 'rgba(20,2,4,0.9)';
    b.fillRect(561, 196, 3, 134);
    b.fillRect(548, 196, 18, 3);
    const lg = b.createRadialGradient(552, 202, 0, 552, 202, 50);
    lg.addColorStop(0, 'rgba(255,220,210,1)');
    lg.addColorStop(0.08, 'rgba(255,80,70,0.85)');
    lg.addColorStop(1, 'rgba(255,40,40,0)');
    b.fillStyle = lg;
    b.fillRect(500, 150, 110, 110);
    // haze band near the ground
    const hg = b.createLinearGradient(0, 260, 0, 335);
    hg.addColorStop(0, 'rgba(255,90,80,0)');
    hg.addColorStop(1, 'rgba(230,80,70,0.55)');
    b.fillStyle = hg;
    b.fillRect(0, 260, W, 80);
  }
  const bd = BD.ctx.getImageData(0, 0, W, H).data;
  const sampleBD = (sx, sy) => {
    const x = clamp(Math.round(sx), 0, W - 1), y = clamp(Math.round(sy), 0, H - 1);
    const i = (y * W + x) * 4;
    return [bd[i] / 255, bd[i + 1] / 255, bd[i + 2] / 255];
  };

  /* ---------------------------------------------------------- lights (world space) */
  const LIGHTS = [
    { p: [0.2, 2.2, 33], c: [1.0, 0.14, 0.11], I: 70, fog: 0.42 }, // the street glow behind the alley end
    { p: [-1.45, 3.25, 13], c: [1.0, 0.1, 0.16], I: 2.4, fog: 0.75 }, // neon heart sign
    { p: [1.38, 2.95, 16.5], c: [0.55, 0.72, 1.0], I: 1.4, fog: 0.7 }, // cold lamp over a back door
    { p: [1.5, 4.6, 7.5], c: [1.0, 0.5, 0.2], I: 0.35, fog: 0.4 }, // a warm window
    { p: [-1.1, 2.4, 1.6], c: [0.9, 0.1, 0.12], I: 2.6, fog: 0.12 }, // red spill from off-screen left
    { p: [1.0, 3.2, 2.4], c: [0.85, 0.12, 0.16], I: 1.5, fog: 0.12 }, // a sign behind the camera, right
  ];
  const SIG = 0.05; // fog density

  /* ---------------------------------------------------------- materials */
  function wallTex(side, z, y) {
    // stains, rain streaks, panel seams and bricks near the ground on the left wall
    let a = 0.13 + (n1.fbm(z * 0.35, y * 0.35, 4) - 0.5) * 0.12;
    a *= 0.75 + n2.fbm(z * 2.2, y * 0.12, 3) * 0.5; // vertical streaking
    const near = clamp(1 - z / 14);
    if (side < 0 && y < 3.0) {
      const row = Math.floor(y / 0.085);
      const off = (row % 2) * 0.11;
      const bz = (z + off) / 0.22 - Math.floor((z + off) / 0.22);
      const by = y / 0.085 - row;
      const mortar = (bz < 0.07 || by < 0.12) ? 1 : 0;
      a = a * (0.85 + n3(row * 7.1, Math.floor((z + off) / 0.22) * 3.3) * 0.4);
      a *= 1 - mortar * 0.45 * near;
    } else {
      const seamY = Math.abs(((y + 0.6) % 1.5) - 0.75) > 0.735 ? 1 : 0;
      const seamZ = Math.abs(((z + 0.3) % 2.4) - 1.2) > 1.19 ? 1 : 0;
      a *= 1 - (seamY + seamZ) * 0.35 * near;
    }
    // grime at the base
    a *= 0.55 + 0.45 * smooth(0, 1.2, y);
    return a;
  }
  const wetness = (x, z) => smooth(0.42, 0.62, n1.fbm(x * 0.9 + 3, z * 0.55, 4));

  function shadeSurface(P, N, alb, out, spec = 0, V = null) {
    const bounce = 0.05 + 0.25 * clamp(P[2] / 30);
    let r = 0.012 + bounce, g = 0.006 + bounce * 0.12, b = 0.008 + bounce * 0.12;
    for (const L of LIGHTS) {
      const dx = L.p[0] - P[0], dy = L.p[1] - P[1], dz = L.p[2] - P[2];
      const d2 = dx * dx + dy * dy + dz * dz;
      const d = Math.sqrt(d2);
      const ndl = Math.max(0, (N[0] * dx + N[1] * dy + N[2] * dz) / d);
      let k = (L.I * ndl) / (d2 + 0.6);
      if (spec && V) {
        // Blinn-Phong highlight for wet surfaces
        const hx = dx / d - V[0], hy = dy / d - V[1], hz = dz / d - V[2];
        const hl = Math.hypot(hx, hy, hz) || 1;
        const ndh = Math.max(0, (N[0] * hx + N[1] * hy + N[2] * hz) / hl);
        k += (spec * L.I * Math.pow(ndh, 90)) / (d2 * 0.15 + 1);
      }
      r += L.c[0] * k;
      g += L.c[1] * k;
      b += L.c[2] * k;
    }
    out[0] = r * alb;
    out[1] = g * alb;
    out[2] = b * alb;
    return out;
  }

  /** Trace a ray against walls / ground / the open end. Returns { t, kind, P }. */
  function trace(o, d, allowGround = true) {
    let t = Infinity, kind = 'end';
    if (d[0] < 0) { const tt = (WL - o[0]) / d[0]; if (tt > 0 && tt < t) { t = tt; kind = 'L'; } }
    if (d[0] > 0) { const tt = (WR - o[0]) / d[0]; if (tt > 0 && tt < t) { t = tt; kind = 'R'; } }
    if (allowGround && d[1] < 0) { const tt = (0 - o[1]) / d[1]; if (tt > 0 && tt < t) { t = tt; kind = 'G'; } }
    const tEnd = (ZEND - o[2]) / d[2];
    if (tEnd < t) { t = tEnd; kind = 'end'; }
    const P = [o[0] + d[0] * t, o[1] + d[1] * t, o[2] + d[2] * t];
    if ((kind === 'L' || kind === 'R') && P[1] > YTOP) kind = 'sky';
    return { t, kind, P };
  }
  const tmp = [0, 0, 0];
  function surfaceColor(hit, d, out, depth = 0) {
    const { kind, P } = hit;
    if (kind === 'end' || kind === 'sky') {
      const [sx, sy] = cam.project(P);
      const c = sampleBD(sx, sy);
      out[0] = c[0] * 0.95; out[1] = c[1] * 0.95; out[2] = c[2] * 0.95;
      return out;
    }
    if (kind === 'L' || kind === 'R') {
      const side = kind === 'L' ? -1 : 1;
      const alb = wallTex(side, P[2], P[1]);
      shadeSurface(P, [-side, 0, 0], alb, out);
      // sheen of rain on the walls near the light
      return out;
    }
    // ground: wet asphalt with puddles that mirror the scene
    const w = wetness(P[0], P[2]);
    const alb = 0.05 + n2.fbm(P[0] * 3, P[2] * 3, 3) * 0.04;
    shadeSurface(P, [0, 1, 0], alb * (1 - w * 0.6), out, 0.6 + w * 1.2, d);
    if (depth === 0) {
      // perturbed mirror ray (ripples / rough asphalt)
      const rough = (1 - w) * 0.05 + 0.006;
      const jx = (n3(P[0] * 40, P[2] * 40) - 0.5) * rough * 2, jz = (n3(P[0] * 40 + 9, P[2] * 40) - 0.5) * rough * 2;
      const rd = [d[0] + jx, -d[1], d[2] + jz];
      const rl = Math.hypot(rd[0], rd[1], rd[2]);
      rd[0] /= rl; rd[1] /= rl; rd[2] /= rl;
      const rh = trace(P, rd, false);
      const rc = surfaceColor(rh, rd, [0, 0, 0], 1);
      // fog inside the reflection too
      let fr = 0, fg = 0, fb = 0;
      for (const L of LIGHTS) {
        const s = scatter(P, rd, Math.min(rh.t, 60), L.p) * L.I * SIG * L.fog;
        fr += L.c[0] * s; fg += L.c[1] * s; fb += L.c[2] * s;
      }
      const fres = 0.12 + 0.6 * w;
      const ext = Math.exp(-SIG * 0.6 * rh.t);
      out[0] += (rc[0] * ext + fr) * fres;
      out[1] += (rc[1] * ext + fg) * fres;
      out[2] += (rc[2] * ext + fb) * fres;
    }
    return out;
  }

  /* ---------------------------------------------------------- per-pixel render */
  const o = cam.pos;
  renderPixels(ctx, W, H, (sx, sy, out) => {
    const d = cam.ray(sx, sy);
    const hit = trace(o, d, true);
    const c = surfaceColor(hit, d, tmp, 0);
    const t = Math.min(hit.t, 60);
    let fr = 0, fg = 0, fb = 0;
    for (const L of LIGHTS) {
      const s = scatter(o, d, t, L.p) * L.I * SIG * L.fog;
      fr += L.c[0] * s; fg += L.c[1] * s; fb += L.c[2] * s;
    }
    // patchy fog density
    const ext = Math.exp(-SIG * 0.5 * t);
    const fogMod = 0.7 + n2.fbm(sx * 0.006, sy * 0.01, 3) * 0.6;
    // ambient red haze grows with distance down the alley
    const amb = Math.min(t, 34) * 0.0032 * fogMod;
    const R = c[0] * ext + fr * fogMod + amb + 0.006;
    const G = c[1] * ext + fg * fogMod + amb * 0.14 + 0.005;
    const B = c[2] * ext + fb * fogMod + amb * 0.14 + 0.007;
    out[0] = tone(R * 1.05);
    out[1] = tone(G * 1.05);
    out[2] = tone(B * 1.05);
  });

  const E = layer(W, H); // emissive accents for bloom
  const e = E.ctx;
  const P = (x, y, z) => cam.project([x, y, z]);
  const quad = (c2, pts) => { c2.beginPath(); pts.forEach((p, i) => (i ? c2.lineTo(p[0], p[1]) : c2.moveTo(p[0], p[1]))); c2.closePath(); };

  /* ---------------------------------------------------------- wall furniture */
  {
    const r = rand(77);
    // left wall windows (dark, barred), one dim red
    for (const [z0, z1, y0, y1, lit] of [[5.2, 6.4, 3.1, 4.3, 0], [8.6, 9.5, 4.8, 5.8, 0], [13.6, 14.4, 3.0, 4.0, 1], [18, 18.6, 4.8, 5.6, 0], [22, 22.6, 3.2, 4.0, 1]]) {
      quad(ctx, [P(WL, y0, z0), P(WL, y0, z1), P(WL, y1, z1), P(WL, y1, z0)]);
      ctx.fillStyle = lit ? 'rgba(90,14,18,0.95)' : 'rgba(5,5,7,0.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(60,50,54,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(24,22,24,0.95)';
      for (let k = 1; k < 5; k++) {
        const z = lerp(z0, z1, k / 5);
        ctx.beginPath(); ctx.moveTo(...P(WL + 0.02, y0, z)); ctx.lineTo(...P(WL + 0.02, y1, z)); ctx.stroke();
      }
      if (lit) { quad(e, [P(WL, y0, z0), P(WL, y0, z1), P(WL, y1, z1), P(WL, y1, z0)]); e.fillStyle = 'rgba(255,40,40,0.3)'; e.fill(); }
    }
    // right wall: back door under the cold lamp, small windows
    quad(ctx, [P(WR, 0, 15.6), P(WR, 0, 17.0), P(WR, 2.3, 17.0), P(WR, 2.3, 15.6)]);
    ctx.fillStyle = 'rgba(12,14,18,0.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,140,170,0.3)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    {
      const [lx, ly] = P(1.38, 2.95, 16.5);
      ctx.fillStyle = 'rgb(220,235,255)';
      ctx.fillRect(lx - 3, ly - 1, 6, 2.4);
      e.fillStyle = 'rgba(200,220,255,1)';
      e.fillRect(lx - 4, ly - 1.5, 8, 3);
    }
    for (const [z0, z1, y0, y1, lit] of [[7.0, 8.0, 4.2, 5.1, 2], [11, 11.8, 3.4, 4.3, 0], [20, 20.7, 4.4, 5.2, 0]]) {
      quad(ctx, [P(WR, y0, z0), P(WR, y0, z1), P(WR, y1, z1), P(WR, y1, z0)]);
      ctx.fillStyle = lit === 2 ? 'rgba(120,60,24,0.9)' : 'rgba(5,5,7,0.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(60,50,54,0.5)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      if (lit === 2) { quad(e, [P(WR, y0, z0), P(WR, y0, z1), P(WR, y1, z1), P(WR, y1, z0)]); e.fillStyle = 'rgba(255,130,60,0.35)'; e.fill(); }
    }
    // a small AC unit far down the right wall
    {
      const z = 19.5, y = 3.0, xo = 0.45;
      quad(ctx, [P(WR - xo, y, z), P(WR - xo, y, z + 0.8), P(WR - xo, y + 0.55, z + 0.8), P(WR - xo, y + 0.55, z)]);
      ctx.fillStyle = 'rgb(16,14,16)'; ctx.fill();
      quad(ctx, [P(WR, y, z), P(WR - xo, y, z), P(WR - xo, y, z + 0.8), P(WR, y, z + 0.8)]);
      ctx.fillStyle = 'rgb(24,18,20)'; ctx.fill();
    }
    // pipes along both walls
    const pipe = (x, y, z0, z1, w, col) => {
      ctx.strokeStyle = col;
      ctx.beginPath();
      for (let z = z0; z <= z1; z += 0.25) { const [sx, sy] = P(x, y, z); z === z0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy); }
      ctx.lineWidth = Math.max(1, w * cam.scaleAt([x, y, (z0 + z1) / 3]));
      ctx.stroke();
    };
    pipe(WR - 0.08, 2.65, 2.2, 30, 0.07, 'rgba(18,16,20,0.95)');
    pipe(WR - 0.06, 2.72, 2.2, 30, 0.015, 'rgba(200,80,80,0.3)');
    pipe(WL + 0.08, 5.6, 2.5, 30, 0.08, 'rgba(16,14,18,0.95)');
    for (const [x, z] of [[WR - 0.1, 5.0], [WL + 0.1, 7.6], [WL + 0.1, 15.5], [WR - 0.1, 12.6], [WR - 0.1, 23]]) {
      const a = P(x, 0, z), b = P(x, 12, z);
      ctx.strokeStyle = 'rgba(16,14,18,0.95)';
      ctx.lineWidth = Math.max(1.2, 0.08 * cam.scaleAt([x, 2, z]));
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      ctx.strokeStyle = 'rgba(220,70,80,0.22)';
      ctx.lineWidth = 1;
      const off = x < 0 ? 0.5 : -0.5;
      ctx.beginPath(); ctx.moveTo(a[0] + off * ctx.lineWidth * 3, a[1]); ctx.lineTo(b[0] + off * 3, b[1]); ctx.stroke();
    }
    // fire-escape grating far down the right wall (see-through)
    for (const y of [4.6, 7.4]) {
      const z0 = 17.5, z1 = 22, x1 = WR - 0.85;
      ctx.strokeStyle = 'rgba(10,8,10,0.9)';
      ctx.lineWidth = 1;
      for (let z = z0; z <= z1; z += 0.3) { ctx.beginPath(); ctx.moveTo(...P(WR, y, z)); ctx.lineTo(...P(x1, y, z)); ctx.stroke(); }
      for (let z = z0; z <= z1; z += 0.5) { ctx.beginPath(); ctx.moveTo(...P(x1, y, z)); ctx.lineTo(...P(x1, y + 0.9, z)); ctx.stroke(); }
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(...P(x1, y + 0.9, z0)); ctx.lineTo(...P(x1, y + 0.9, z1)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(...P(x1, y, z0)); ctx.lineTo(...P(x1, y, z1)); ctx.stroke();
    }
    // overhead cables silhouetted against the glow
    for (let k = 0; k < 10; k++) {
      const z = 7 + k * 2.4 + r() * 1.5, z2 = z + r() * 3 - 1;
      const y0 = 4.6 + r() * 4, y1 = 4.2 + r() * 5, sag = 0.4 + r() * 1.2;
      ctx.strokeStyle = `rgba(6,3,5,${0.75 + r() * 0.25})`;
      ctx.lineWidth = Math.max(0.8, 0.025 * cam.scaleAt([0, y0, z]));
      ctx.beginPath();
      for (let s = 0; s <= 24; s++) {
        const t = s / 24;
        const x = lerp(WL, WR, t), y = lerp(y0, y1, t) - sag * 4 * t * (1 - t), zz = lerp(z, z2, t);
        const [sx, sy] = P(x, y, zz);
        s ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      }
      ctx.stroke();
    }
    // a string of dead festival lanterns, two still glowing
    {
      const z = 14, y0 = 4.6, y1 = 4.3;
      ctx.strokeStyle = 'rgba(6,3,5,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let s = 0; s <= 16; s++) {
        const t = s / 16;
        const [sx, sy] = P(lerp(WL, WR, t), lerp(y0, y1, t) - 0.9 * 4 * t * (1 - t), z + t * 0.6);
        s ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      }
      ctx.stroke();
      for (let s = 1; s < 8; s++) {
        const t = s / 8;
        const x = lerp(WL, WR, t), y = lerp(y0, y1, t) - 0.9 * 4 * t * (1 - t) - 0.22, zz = z + t * 0.6;
        const [sx, sy] = P(x, y, zz);
        const rad = 0.13 * cam.scaleAt([x, y, zz]);
        const on = s === 2 || s === 6 || s === 4;
        const g = ctx.createRadialGradient(sx - rad * 0.3, sy - rad * 0.3, 0, sx, sy, rad * 1.2);
        g.addColorStop(0, on ? (s === 4 ? 'rgb(170,50,46)' : 'rgb(255,120,100)') : 'rgb(70,28,30)');
        g.addColorStop(1, on ? 'rgb(150,20,24)' : 'rgb(20,8,10)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(sx, sy, rad, rad * 1.25, 0, 0, TAU); ctx.fill();
        if (on) { e.fillStyle = 'rgba(255,60,50,0.8)'; e.beginPath(); e.ellipse(sx, sy, rad, rad * 1.25, 0, 0, TAU); e.fill(); }
      }
    }
    // bags and a crate tucked against the walls, grounded with contact shadows
    const bag = (x, z, w, h) => {
      const [sx, sy] = P(x, 0, z);
      const s = cam.scaleAt([x, 0, z]);
      ctx.save();
      ctx.filter = 'blur(3px)';
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.beginPath(); ctx.ellipse(sx, sy, w * s * 0.6, w * s * 0.12, 0, 0, TAU); ctx.fill();
      ctx.restore();
      const g = ctx.createLinearGradient(sx, sy - h * s, sx, sy);
      g.addColorStop(0, 'rgb(34,22,26)');
      g.addColorStop(0.4, 'rgb(12,9,11)');
      g.addColorStop(1, 'rgb(6,5,6)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sx - w * s * 0.5, sy);
      ctx.bezierCurveTo(sx - w * s * 0.62, sy - h * s * 0.7, sx - w * s * 0.2, sy - h * s * 1.05, sx + w * s * 0.05, sy - h * s);
      ctx.bezierCurveTo(sx + w * s * 0.4, sy - h * s * 0.95, sx + w * s * 0.6, sy - h * s * 0.5, sx + w * s * 0.5, sy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,80,80,0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    };
    bag(WL + 0.3, 9.6, 0.5, 0.42);
    bag(WL + 0.62, 10.1, 0.42, 0.34);
    bag(WR - 0.35, 12.6, 0.45, 0.38);
    bag(WL + 0.28, 16, 0.4, 0.34);
    {
      const x0 = WL + 0.05, x1 = WL + 0.7, z0 = 11.6, z1 = 12.2, h = 0.5;

    const r = rand(43);
    for (let i = 0; i < 70; i++) {
      const z = 3 + Math.pow(r(), 0.7) * 26, x = lerp(WL + 0.1, WR - 0.1, r());
      const [sx, sy] = P(x, 0, z);
      const s = cam.scaleAt([x, 0, z]);
      const k = L(sx, sy - 4);
      if (k < 0.04) continue;
      ctx.strokeStyle = `rgba(255,170,160,${Math.min(0.5, k * 1.4)})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(sx, sy, 0.035 * s + 0.6, 0.012 * s + 0.3, 0, Math.PI, TAU); ctx.stroke();
    }
    particles(ctx, W, H, { count: 260, seed: 44, size: [0.6, 2.2], color: [255, 120, 110], alpha: 0.5, lum: (x, y) => L(x, y) * 1.4 });
  }

  /* ---------------------------------------------------------- bloom + grade */
  {
    const bp = brightPass(ctx.canvas, 0.62, 0.18, 0.55);
    const em = layer(W, H);
    em.ctx.drawImage(bp, 0, 0);
    em.ctx.globalCompositeOperation = 'lighter';
    em.ctx.drawImage(E.c, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.6;
    ctx.drawImage(E.c, 0, 0);
    ctx.restore();
    bloom(ctx, em.c, W, H, [{ r: 3, a: 0.45 }, { r: 14, a: 0.45 }, { r: 48, a: 0.4 }, { r: 120, a: 0.35 }]);
  }
  cinematicGrade(ctx, W, H, { contrast: 1.1, sat: 0.9, lift: [0.006, 0.004, 0.008], shadowTint: [0.004, 0, 0.006], highTint: [0.02, -0.01, -0.012], keepRed: 0.8 });
  chroma(ctx, W, H, 1.6);
  // vignette + bottom fade into the app background
  {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.32, W * 0.2, W * 0.5, H * 0.4, W * 0.85);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  fadeBottom(ctx, W, H, H * 0.5, H * 0.9, [9, 9, 11]);
  grainLuma(ctx, W, H, { amount: 9, seed: 45 });
  fadeBottom(ctx, W, H, H * 0.86, H * 0.97, [9, 9, 11]);
  done();
}
