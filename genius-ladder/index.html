<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genius Ladder</title>
  <style>
    :root { --bg: #0b0d16; --fg: #e9ecf5; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
    body:not(.preview) canvas { display: block; }
    body.preview { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
    #stage canvas { height: min(82vh, 1920px); width: auto; aspect-ratio: 9 / 16; border-radius: 10px; }
    #bar { display: none; gap: 10px; align-items: center; width: min(100%, 520px); }
    body.preview #bar { display: flex; }
    #scrub { flex: 1; }
    button { background: #FFD21F; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="bar">
    <button id="play">Play / Pause</button>
    <input id="scrub" type="range" min="0" step="0.0333" value="0" />
    <span id="time"></span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
