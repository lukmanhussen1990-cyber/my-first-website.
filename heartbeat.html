<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbeat</title>
  <style>
    :root {
      --bg: #06060b;
      --heart: #ff2d55;
      --trace: #3dff8f;
      --trace-dim: rgba(61, 255, 143, 0.55);
      --grid-minor: rgba(61, 255, 143, 0.05);
      --grid-major: rgba(61, 255, 143, 0.11);
      --panel: rgba(8, 18, 14, 0.72);
      --panel-border: rgba(61, 255, 143, 0.16);
      --text: #eafff3;
      --muted: #6f8f7f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 4vh, 3rem);
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255, 45, 85, 0.13), transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(61, 255, 143, 0.05), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    /* Full-screen particle layer */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(820px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.5rem, 4vh, 2.75rem);
    }

    /* ---------- Heart ---------- */
    .stage {
      position: relative;
      width: clamp(150px, 34vw, 230px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .glow {
      position: absolute;
      inset: -60%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 45, 85, 0.55) 0%, rgba(255, 45, 85, 0.18) 35%, transparent 65%);
      filter: blur(8px);
      will-change: opacity, transform;
    }

    .heart {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 10px 22px rgba(255, 20, 70, 0.45));
      will-change: transform;
    }

    .floor-shadow {
      position: absolute;
      bottom: -14%;
      left: 50%;
      width: 60%;
      height: 10%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 45, 85, 0.35), transparent 70%);
      transform: translateX(-50%);
      will-change: transform, opacity;
    }

    /* ---------- Monitor ---------- */
    .monitor {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 0 40px rgba(61, 255, 143, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .screen {
      position: relative;
      height: 180px;
      background-color: rgba(0, 0, 0, 0.35);
      background-image:
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
        linear-gradient(var(--grid-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
      background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
      background-position: -1px -1px;
    }

    /* Subtle CRT scanlines + vignette */
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55));
      pointer-events: none;
    }

    #ecg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 4px var(--trace)) drop-shadow(0 0 10px var(--trace-dim));
    }

    .tag {
      position: absolute;
      top: 10px;
      font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.12em;
      color: var(--trace);
      opacity: 0.7;
      z-index: 1;
    }
    .tag.left { left: 14px; }
    .tag.right { right: 14px; }

    .vitals {
      min-width: 170px;
      padding: 18px 22px;
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .vitals .label {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .vitals .mini-heart {
      width: 14px;
      height: 14px;
      fill: var(--heart);
      filter: drop-shadow(0 0 6px var(--heart));
      will-change: opacity, transform;
    }

    .vitals .bpm {
      font: 700 64px/1 ui-monospace, "SF Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--trace);
      text-shadow: 0 0 12px rgba(61, 255, 143, 0.6), 0 0 30px rgba(61, 255, 143, 0.25);
    }

    .vitals .unit {
      font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .controls {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-top: 1px solid var(--panel-border);
      font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    /* Custom range slider */
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--trace) var(--fill, 20%), rgba(61, 255, 143, 0.12) var(--fill, 20%));
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #eafff3;
      border: 3px solid var(--trace);
      box-shadow: 0 0 12px var(--trace);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #eafff3;
      border: 3px solid var(--trace);
      box-shadow: 0 0 12px var(--trace);
    }
    input[type="range"]:focus-visible { box-shadow: 0 0 0 3px rgba(61, 255, 143, 0.3); }

    @media (max-width: 560px) {
      .monitor { grid-template-columns: 1fr; }
      .vitals {
        border-left: none;
        border-top: 1px solid var(--panel-border);
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
      }
      .vitals .bpm { font-size: 48px; }
      .screen { height: 150px; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main>
    <div class="stage">
      <div class="glow" id="glow"></div>
      <div class="floor-shadow" id="floorShadow"></div>
      <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <path id="heartPath" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          <radialGradient id="heartFill" cx="36%" cy="30%" r="78%">
            <stop offset="0"    stop-color="#ff9aac"/>
            <stop offset="0.28" stop-color="#ff3b62"/>
            <stop offset="0.65" stop-color="#d10a3c"/>
            <stop offset="1"    stop-color="#5a0019"/>
          </radialGradient>
          <linearGradient id="rimLight" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff6d8a" stop-opacity="0.7"/>
            <stop offset="0.35" stop-color="#ff6d8a" stop-opacity="0"/>
          </linearGradient>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.55"/>
          </filter>
          <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.1"/>
          </filter>
          <clipPath id="heartClip"><use href="#heartPath"/></clipPath>
        </defs>

        <!-- Body -->
        <use href="#heartPath" fill="url(#heartFill)"/>

        <g clip-path="url(#heartClip)">
          <!-- Inner edge shading for depth -->
          <use href="#heartPath" fill="none" stroke="#2a0008" stroke-width="2.4" opacity="0.55" filter="url(#softer)"/>
          <!-- Bounce light along the bottom -->
          <use href="#heartPath" fill="none" stroke="url(#rimLight)" stroke-width="1.2" filter="url(#soft)"/>
          <!-- Specular highlights -->
          <ellipse cx="7.4" cy="7.3" rx="3.1" ry="1.8" fill="#fff" opacity="0.55" filter="url(#soft)" transform="rotate(-35 7.4 7.3)"/>
          <ellipse cx="6.3" cy="6.6" rx="0.9" ry="0.5" fill="#fff" opacity="0.9" filter="url(#soft)" transform="rotate(-35 6.3 6.6)"/>
          <ellipse cx="16.4" cy="6.3" rx="1.7" ry="0.8" fill="#fff" opacity="0.28" filter="url(#soft)" transform="rotate(28 16.4 6.3)"/>
        </g>
      </svg>
    </div>

    <section class="monitor" aria-label="Heart monitor">
      <div class="screen">
        <span class="tag left">II</span>
        <span class="tag right">25 mm/s</span>
        <canvas id="ecg" aria-hidden="true"></canvas>
      </div>

      <div class="vitals">
        <div class="label">
          <svg class="mini-heart" id="miniHeart" viewBox="0 0 24 24" aria-hidden="true"><use href="#heartPath"/></svg>
          HR
        </div>
        <div class="bpm" id="bpm" aria-live="polite">72</div>
        <div class="unit">BPM</div>
      </div>

      <label class="controls">
        40
        <input type="range" id="rate" min="40" max="180" value="72" aria-label="Heart rate in beats per minute">
        180
      </label>
    </section>
  </main>

  <script>
    (() => {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const heartEl = document.getElementById('heart');
      const glowEl = document.getElementById('glow');
      const floorEl = document.getElementById('floorShadow');
      const miniHeart = document.getElementById('miniHeart');
      const bpmEl = document.getElementById('bpm');
      const rateEl = document.getElementById('rate');
      const ecgCanvas = document.getElementById('ecg');
      const fxCanvas = document.getElementById('fx');
      const ecgCtx = ecgCanvas.getContext('2d');
      const fxCtx = fxCanvas.getContext('2d');

      let bpm = Number(rateEl.value);

      // ---------- Waveforms ----------
      const gauss = (x, mu, s) => { const d = (x - mu) / s; return Math.exp(-0.5 * d * d); };

      // Realistic PQRST complex over one beat (phase 0..1)
      const ecg = p =>
          0.10 * gauss(p, 0.16, 0.025)   // P wave
        - 0.12 * gauss(p, 0.295, 0.009)  // Q
        + 1.00 * gauss(p, 0.32, 0.011)   // R spike
        - 0.24 * gauss(p, 0.345, 0.011)  // S
        + 0.28 * gauss(p, 0.56, 0.045);  // T wave

      // "Lub-dub" contraction, timed to the R spike
      const pulse = p => 0.15 * gauss(p, 0.34, 0.035) + 0.07 * gauss(p, 0.50, 0.04);

      // ---------- Controls ----------
      function setRate(v) {
        bpm = Number(v);
        bpmEl.textContent = bpm;
        const pct = ((bpm - rateEl.min) / (rateEl.max - rateEl.min)) * 100;
        rateEl.style.setProperty('--fill', pct + '%');
      }
      rateEl.addEventListener('input', e => setRate(e.target.value));
      setRate(rateEl.value);

      // ---------- ECG monitor (sweeping trace) ----------
      const GAP = 26;          // erase bar ahead of the sweep head
      let W = 0, H = 0, buf, headX = 0;

      function resizeEcg() {
        const dpr = window.devicePixelRatio || 1;
        W = Math.max(1, Math.floor(ecgCanvas.clientWidth));
        H = Math.max(1, Math.floor(ecgCanvas.clientHeight));
        ecgCanvas.width = W * dpr;
        ecgCanvas.height = H * dpr;
        ecgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buf = new Float32Array(W).fill(NaN);
        headX = 0;
        if (reduceMotion) {
          // Static full trace
          const beatsAcross = 3.5;
          for (let x = 0; x < W; x++) buf[x] = ecg(((x / W) * beatsAcross) % 1);
          headX = W - 1 + GAP;
          drawEcg();
        }
      }

      function drawEcg() {
        ecgCtx.clearRect(0, 0, W, H);
        const mid = H * 0.62, amp = H * 0.42;
        const head = Math.floor(headX) % W;
        const span = W - GAP;
        const SEG = 5;

        ecgCtx.lineWidth = 2;
        ecgCtx.lineJoin = 'round';
        ecgCtx.lineCap = 'round';
        ecgCtx.strokeStyle = '#3dff8f';

        for (let age = 0; age < span; age += SEG) {
          const a = 1 - age / span;
          ecgCtx.globalAlpha = 0.08 + 0.92 * a * a;
          ecgCtx.beginPath();
          let started = false, prevCol = -1;
          for (let k = 0; k <= SEG && age + k < span; k++) {
            const col = ((head - age - k) % W + W) % W;
            const v = buf[col];
            if (Number.isNaN(v) || (prevCol !== -1 && col > prevCol)) { started = false; prevCol = col; continue; }
            const y = mid - v * amp;
            if (!started) { ecgCtx.moveTo(col, y); started = true; } else ecgCtx.lineTo(col, y);
            prevCol = col;
          }
          ecgCtx.stroke();
        }

        // Bright leading dot
        const hv = buf[head];
        if (!Number.isNaN(hv)) {
          const y = mid - hv * amp;
          ecgCtx.globalAlpha = 1;
          const g = ecgCtx.createRadialGradient(head, y, 0, head, y, 14);
          g.addColorStop(0, 'rgba(230,255,240,1)');
          g.addColorStop(0.25, 'rgba(61,255,143,0.9)');
          g.addColorStop(1, 'rgba(61,255,143,0)');
          ecgCtx.fillStyle = g;
          ecgCtx.beginPath();
          ecgCtx.arc(head, y, 14, 0, Math.PI * 2);
          ecgCtx.fill();
        }
        ecgCtx.globalAlpha = 1;
      }

      // ---------- Particles & shockwaves ----------
      let FW = 0, FH = 0;
      const sparks = [], rings = [], dust = [];

      function resizeFx() {
        const dpr = window.devicePixelRatio || 1;
        FW = window.innerWidth;
        FH = window.innerHeight;
        fxCanvas.width = FW * dpr;
        fxCanvas.height = FH * dpr;
        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dust.length = 0;
        const n = Math.round((FW * FH) / 22000);
        for (let i = 0; i < n; i++) {
          dust.push({
            x: Math.random() * FW,
            y: Math.random() * FH,
            r: Math.random() * 1.4 + 0.3,
            vy: -(Math.random() * 8 + 3),
            tw: Math.random() * Math.PI * 2
          });
        }
      }

      function heartCenter() {
        const r = heartEl.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height * 0.52, size: r.width };
      }

      function emitBeat() {
        const c = heartCenter();
        rings.push({ x: c.x, y: c.y, r: c.size * 0.35, max: c.size * 1.6, life: 1 });
        rings.push({ x: c.x, y: c.y, r: c.size * 0.3, max: c.size * 1.15, life: 1, thin: true });
        const count = 18;
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 60 + Math.random() * 160;
          sparks.push({
            x: c.x + Math.cos(ang) * c.size * 0.25,
            y: c.y + Math.sin(ang) * c.size * 0.25,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 20,
            life: 1,
            decay: 0.6 + Math.random() * 0.7,
            r: Math.random() * 2.2 + 0.8
          });
        }
      }

      function drawFx(dt, t) {
        fxCtx.clearRect(0, 0, FW, FH);
        fxCtx.globalCompositeOperation = 'lighter';

        // Ambient dust
        for (const d of dust) {
          d.y += d.vy * dt;
          if (d.y < -5) { d.y = FH + 5; d.x = Math.random() * FW; }
          const a = 0.15 + 0.15 * Math.sin(t * 1.5 + d.tw);
          fxCtx.fillStyle = `rgba(255,120,150,${a})`;
          fxCtx.beginPath();
          fxCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          fxCtx.fill();
        }

        // Shockwave rings
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life -= dt * 1.4;
          if (r.life <= 0) { rings.splice(i, 1); continue; }
          const k = 1 - r.life;
          const rad = r.r + (r.max - r.r) * (1 - Math.pow(1 - k, 3));
          fxCtx.strokeStyle = `rgba(255,60,100,${r.life * (r.thin ? 0.35 : 0.5)})`;
          fxCtx.lineWidth = r.thin ? 1 : 2.5 * r.life + 0.5;
          fxCtx.beginPath();
          fxCtx.arc(r.x, r.y, rad, 0, Math.PI * 2);
          fxCtx.stroke();
        }

        // Sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.life -= dt * s.decay;
          if (s.life <= 0) { sparks.splice(i, 1); continue; }
          s.vx *= 1 - 1.6 * dt;
          s.vy *= 1 - 1.6 * dt;
          s.vy += 18 * dt;
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          const rad = s.r * 4;
          const g = fxCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad);
          g.addColorStop(0, `rgba(255,220,230,${s.life})`);
          g.addColorStop(0.3, `rgba(255,60,100,${s.life * 0.7})`);
          g.addColorStop(1, 'rgba(255,45,85,0)');
          fxCtx.fillStyle = g;
          fxCtx.beginPath();
          fxCtx.arc(s.x, s.y, rad, 0, Math.PI * 2);
          fxCtx.fill();
        }

        fxCtx.globalCompositeOperation = 'source-over';
      }

      // ---------- Main loop ----------
      const R_PHASE = 0.32;
      let phase = 0, last = performance.now(), lastBeat = Math.floor(phase - R_PHASE);

      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        const t = now / 1000;

        const prevPhase = phase;
        phase += dt * bpm / 60;
        const p = phase % 1;

        // Heart + glow
        const k = pulse(p);
        const s = 1 + k;
        const glowK = Math.min(1, k / 0.15);
        heartEl.style.transform = `scale(${s})`;
        glowEl.style.opacity = (0.35 + 0.65 * glowK).toFixed(3);
        glowEl.style.transform = `scale(${1 + k * 1.2})`;
        floorEl.style.transform = `translateX(-50%) scale(${1 + k * 0.8}, ${1 - k * 0.5})`;
        floorEl.style.opacity = (0.6 + 0.4 * glowK).toFixed(3);
        miniHeart.style.opacity = (0.35 + 0.65 * glowK).toFixed(3);
        miniHeart.style.transform = `scale(${1 + k * 1.5})`;

        // Beat event on each R spike
        const beatIdx = Math.floor(phase - R_PHASE);
        if (beatIdx !== lastBeat) { lastBeat = beatIdx; emitBeat(); }

        // Advance ECG sweep
        const speed = Math.max(W / 4.5, 120);
        const from = Math.floor(headX);
        headX += speed * dt;
        const to = Math.floor(headX);
        const steps = to - from;
        for (let i = 1; i <= steps; i++) {
          const pp = prevPhase + (phase - prevPhase) * (i / steps);
          const noise = (Math.random() - 0.5) * 0.012 + Math.sin((from + i) * 0.05 + t) * 0.006;
          buf[(from + i) % W] = ecg(pp % 1) + noise;
        }
        if (headX > W * 1000) headX -= W * 1000;

        drawEcg();
        drawFx(dt, t);
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', () => { resizeEcg(); resizeFx(); });
      resizeEcg();
      resizeFx();

      if (!reduceMotion) requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
