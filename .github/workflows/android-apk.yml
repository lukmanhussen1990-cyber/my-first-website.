name: Android APK

# Builds an installable (sideloadable) release APK of Last Mile.
# - Every run uploads the APK as a workflow artifact.
# - Pushing a tag like `v1.0.0` also publishes it on a GitHub Release.
#
# The release APK is signed with the debug keystore generated by `expo prebuild`,
# which is fine for direct installs. For Google Play use `eas build -p android
# --profile production` with a real upload key instead.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'server/**']
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/LastMile-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LastMile-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist-apk/*.apk --title "Last Mile ${GITHUB_REF_NAME}" --generate-notes
