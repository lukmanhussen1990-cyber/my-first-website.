<script>
// Bulbul & Shabnaj: a wedding film, everything drawn from scratch. 72 bpm: 1 beat = 25 frames, 1 bar = 100 frames.
const $ = id => document.getElementById(id);
// ------------------------------------------------------------------ camera (world == screen at zoom 1)
// layers move with parallax: depth 0 = infinitely far (barely moves), 1 = the arch plane, >1 nearer than the arch
const CAM = f => ({
  x: kf(f, [[1, 960], [205, 960], [300, 990, 'inOutCubic'], [500, 996], [585, 960, 'inOutCubic']]),
  y: kf(f, [[1, 540], [205, 548], [300, 1080, 'inOutCubic'], [500, 1086], [585, 540, 'inOutCubic'], [700, 540], [800, 600, 'inOutCubic']]),
  z: kf(f, [[1, 1.0], [205, 1.035, 'inOutSine'], [300, 2.35, 'inOutCubic'], [500, 2.46], [585, 1.0, 'inOutCubic'], [700, 1.0], [800, 0.9, 'inOutCubic'], [1300, 0.94, 'inOutSine']]) });
function camMatrix(f, depth) {
  const c = CAM(f), z = 1 + (c.z - 1) * depth, px = 960 + (c.x - 960) * depth, py = 540 + (c.y - 540) * depth;
  return [z, 960 - px * z, 540 - py * z];
}
function place(el, f, depth) {
  const c = CAM(f), z = 1 + (c.z - 1) * depth, px = 960 + (c.x - 960) * depth, py = 540 + (c.y - 540) * depth;
  el.style.transform = `translate(${(960 - px * z).toFixed(2)}px, ${(540 - py * z).toFixed(2)}px) scale(${z.toFixed(5)})`;

// ------------------------------------------------------------------ sky: plate + twinkling stars + moon
let STARS = null;
function buildStars() {
  const r = mulberry32(42); STARS = [];
  for (let i = 0; i < 230; i++) {
    const y = Math.pow(r(), 1.3) * 1050, x = r() * 2600, m = Math.pow(r(), 3);

  }
}
function drawStars(f, fade) {
  const c = $('cStars'), g = c.getContext('2d'); g.clearRect(0, 0, 2600, 1500);

    const a = clamp(fade * (0.35 + 0.65 * tw)), rad = 0.7 + s.m * 1.1;
    const col = s.warm ? '255,226,190' : '228,236,255';
    const gr = g.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad * 3.2);
    gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.35, `rgba(${col},${a * 0.45})`); gr.addColorStop(1, `rgba(${col},0)`);

    if (s.glint) { g.strokeStyle = `rgba(${col},${a * 0.5})`; g.lineWidth = 0.8; const L = 7 + 9 * s.m * tw;
      g.beginPath(); g.moveTo(s.x - L, s.y); g.lineTo(s.x + L, s.y); g.moveTo(s.x, s.y - L); g.lineTo(s.x, s.y + L); g.stroke(); }
  });
}
let MOON = null;
function buildMoon() {
  const svg = $('Lmoon'), defs = svgEl('defs', {}, svg);
  defs.innerHTML = `<radialGradient id="moonHalo"><stop offset="0" stop-color="rgba(255,236,200,0.34)"/><stop offset="0.35" stop-color="rgba(255,226,190,0.12)"/><stop offset="1" stop-color="rgba(255,220,190,0)"/></radialGradient>
    <radialGradient id="moonFace" cx="0.38" cy="0.4" r="0.75"><stop offset="0" stop-color="#FFF8E6"/><stop offset="0.7" stop-color="#F3E2BE"/><stop offset="1" stop-color="#D9C192"/></radialGradient>
    <mask id="crescent"><rect x="-200" y="-200" width="400" height="400" fill="#fff"/><circle cx="20" cy="-14" r="44" fill="#000"/></mask>`;
  const g = svgEl('g', {}, svg);
  svgEl('circle', { cx: 0, cy: 0, r: 230, fill: 'url(#moonHalo)' }, g);
  svgEl('circle', { cx: 0, cy: 0, r: 50, fill: 'url(#moonFace)', mask: 'url(#crescent)' }, g);

// ------------------------------------------------------------------ the rose bush, the bulbul, dew and song
let GARDEN = null;
const GD = 0.82;                                            // the garden sits a little behind the arch
const BIRD_LAND = 372, MATE_IN = 800, MATE_LAND = 846, TURN = 850, MATE_TURN = 1192, LEAVE = 1204;

function songState(f, phrases, len = 18) {

}
const turnState = (f, t0) => { const u = clamp((f - t0) / 7); return { m: Math.cos(Math.PI * ease.inOutSine(u)), hop: 12 * Math.sin(Math.PI * u) }; };
// one bird: arrive along an arc, perch, sing, maybe turn around, leave together toward the moon
function oneBird(f, o) {

    phrases: [402, 427, 452, 477, 862, 887], turn: TURN, leave: LEAVE + 4, blinks: [440, 506, 548, 930, 1040, 1150] });
  const b2 = oneBird(f, { inT0: MATE_IN, inT1: MATE_LAND, from: [2050, 760], via: [1560, 820], perch: GARDEN.perch2, face: 1, ph: 2,
    phrases: [874, 899], turn: MATE_TURN, leave: LEAVE, blinks: [905, 990, 1100] });

}
const beakOf = B => { const S = GARDEN.bird.o.S; return [B.x - 0.44 * S * B.mirror, B.y - 0.64 * S + B.st.bob * S]; };
function birdState(f) { return birds(f)[0] || null; }
function drawGarden(f) {

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1920, 1080);
  const [z, tx, ty] = camMatrix(f, GD); ctx.setTransform(z, 0, 0, z, tx, ty);

  GARDEN.drawBush(ctx, { grow, branchGrow, open, budIn: Math.max(0, budIn), sway });
  birds(f).forEach(B => { ctx.save(); ctx.translate(B.x, B.y); ctx.scale(B.mirror, 1); GARDEN.bird.draw(ctx, B.st); ctx.restore(); });

// gold song motes: little lights that leave the bulbul's beak as it sings and drift up, curling
const SONG = (() => { const r = mulberry32(77), m = []; for (const p0 of [402, 427, 452, 477]) for (let i = 0; i < 9; i++)
  m.push({ t0: p0 + i * 1.7 + r() * 1.5, vx: -0.2 + 0.9 * r(), vy: -1.5 - 1.2 * r(), curl: (r() - 0.5) * 0.1, sz: 1.8 + 2.2 * r(), life: 46 + 20 * r(), ph: r() * 6 }); return m; })();
function drawSong(ctx, f, B) {
  const [bx, by] = beakOf(B);

    const t = f - m.t0; if (t < 0 || t > m.life) return;

// ------------------------------------------------------------------ the names, written by the song
let NAMES = null;
const TL = { stream: [500, 546], w1: [548, 592], amp: [592, 606], w2: [604, 662], sheen1: [600, 652], sheen2: [664, 716], div: [662, 684], sub: [670, 702] };

const toScreen = (f, d, p) => { const [z, tx, ty] = camMatrix(f, d); return [p[0] * z + tx, p[1] * z + ty]; };

const GLITTER = (() => { const r = mulberry32(919); return Array.from({ length: 140 }, () => ({ u: r(), dx: (r() - 0.5) * 30, dy: (r() - 0.5) * 34, sz: 0.8 + 1.8 * r(), life: 16 + 22 * r(), ph: r() * 6 })); })();
function glow(g, x, y, r, a, core = '255,244,214', mid = '255,206,120') {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${core},${a})`); gr.addColorStop(0.25, `rgba(${mid},${a * 0.5})`); gr.addColorStop(1, `rgba(${mid},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
}
function drawFx(f) {

const HEART = (() => { const r = mulberry32(14), pts = []; for (let i = 0; i < 56; i++) { const t = i / 56 * 6.283;

let PARTY = null, MONO = null;
// ------------------------------------------------------------------ arch
let ARCH = null;

  const gb = $('cBack').getContext('2d'), gf = $('cFront').getContext('2d');
  gb.clearRect(0, 0, 1920, 1080); gf.clearRect(0, 0, 1920, 1080);
  PARTY.draw(gb, f, 'back'); PARTY.draw(gf, f, 'front');
  drawFx(f);
  $('fade').style.opacity = smooth(1262, 1300, f).toFixed(4);
};
window.sceneReady = document.fonts.ready;
</script>
