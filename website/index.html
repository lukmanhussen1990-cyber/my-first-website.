  .wf-spin {
    z-index: 5; left: calc(462.8 * var(--fs)); top: calc(355.6 * var(--fs)); width: calc(600 * var(--fs)); height: calc(600 * var(--fs)); border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 240, 200, 0) 0deg, rgba(255, 240, 200, 0) 240deg, rgba(255, 220, 150, .75) 322deg, #fff 352deg, rgba(255, 255, 255, 0) 356deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 91.4%, #000 93.2%, #000 95.9%, transparent 97.8%);
    mask-image: radial-gradient(circle closest-side, transparent 91.4%, #000 93.2%, #000 95.9%, transparent 97.8%);
    animation: spin 6.5s linear infinite;
  }

  /* the crown: floats a little, and a shine sweeps across it every 4 s (a bright copy of the crown seen through a moving window) */
  .wf-crown {
    z-index: 6; left: calc(585 * var(--fs)); top: calc(0 * var(--fs)); width: calc(356 * var(--fs)); height: calc(392 * var(--fs));
    background-position: calc(-585 * var(--fs)) calc(0 * var(--fs));
    clip-path: polygon(0.00% 0.00%, 99.89% 0.00%, 99.89% 76.53%, 94.27% 100.00%, 5.62% 100.00%, 0.00% 76.53%);
    animation: crownFloat 3.6s ease-in-out infinite;
  }

  .wf-shine {
    left: 0; top: 0; width: 35%; height: 100%; overflow: hidden; transform: translateX(-100%);
    -webkit-mask-image: linear-gradient(100deg, transparent 6%, #000 40%, #000 60%, transparent 94%);
    mask-image: linear-gradient(100deg, transparent 6%, #000 40%, #000 60%, transparent 94%);
    animation: shineWin 4s ease-in-out infinite;
  }
  .wf-shine-in {
    left: 0; top: 0; width: calc(356 * var(--fs)); height: calc(392 * var(--fs)); background-position: calc(-585 * var(--fs)) calc(0 * var(--fs));
    filter: brightness(1.75) saturate(1.15); transform: translateX(35%); animation: shineIn 4s ease-in-out infinite;
  }

  @keyframes crownFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.4%); } }     /* about 3-4 px */
  @keyframes shineWin { 0%, 52% { transform: translateX(-100%); } 84%, 100% { transform: translateX(290%); } }
  @keyframes shineIn { 0%, 52% { transform: translateX(35%); } 84%, 100% { transform: translateX(-101.5%); } }

  /* sparkles + falling feathers are drawn on this one small canvas */
  .wf-fx { z-index: 7; left: 0; top: 0; width: 100%; height: 100%; }

  /* readable text on top of the wings */
  .hero .name { text-shadow: 0 2px 5px rgba(0, 0, 0, .55), 0 0 6px rgba(255, 180, 200, .95), 0 0 18px rgba(var(--accent-rgb), .8), 0 0 36px rgba(var(--accent2-rgb), .55); }
  .hero .status, .hero .hello { text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 12px rgba(0, 0, 0, .6); }

  /* in the background (app minimised), on very slow phones, and for people who turned animations off */
  .app-bg .wf, .app-bg .wf * { animation-play-state: paused !important; }
  .ultra .wf-spin, .ultra .wf-shine, .ultra .wf-fx { display: none; }
  .ultra .wf *, .ultra .wf *::after { animation: none !important; }

  @media (prefers-reduced-motion: reduce) {
    #bg, .ring, .fp-disc, .bars i, .wave i, .wf *, .wf *::after, .pop, .pop *, .pop *::after { animation: none !important; }
    body.entered #app { transition-duration: .01s; }
  }

  /* ---------- 0. opening intro (everything here only moves with transform / opacity, so it stays smooth) ---------- */
  #intro { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: #000; overflow: hidden; cursor: pointer;
           animation: iFailsafe .01s linear 7s forwards; }          /* if the script ever fails, the intro hides itself after 7 s */
  @keyframes iFailsafe { to { visibility: hidden; pointer-events: none; } }
  #intro.out { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #intro.out.fast { transition-duration: .3s; }
  .i-art {
    --a: min(100vw, 64vh); --a: min(100vw, 64svh);                /* the logo's square: as wide as the screen, never taller than 64% of it */
    position: absolute; left: 50%; top: 50%; width: var(--a); height: var(--a);
    margin: calc(var(--a) / -2) 0 0 calc(var(--a) / -2);
  }
  #intro.out .i-art { transform: scale(1.1); transition: transform .5s ease-in; }
  .i-zoom { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 50% 46%; will-change: transform; }
  .i-zoom img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; -webkit-user-drag: none; will-change: transform, opacity; }
  .i-glow {
    position: absolute; top: -30%; right: -30%; bottom: -30%; left: -30%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 44%, rgba(255, 45, 30, .5), rgba(255, 45, 30, 0) 56%); will-change: transform, opacity;
  }
  .i-vig { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, .92) 100%); }
  .i-flash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fff; opacity: 0; pointer-events: none; will-change: opacity; }
  .i-slash {
    position: absolute; left: -30%; top: 47%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 32%, #ff3a2a 70%, rgba(255, 60, 40, 0));
    box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85); will-change: transform, opacity;
  }
  .i-slash.a { --r: -22deg; }
  .i-slash.b { --r: 15deg; top: 57%; }
  .i-embers i {
    position: absolute; bottom: -8px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; opacity: 0; pointer-events: none;
    background: #ff5a3a; box-shadow: 0 0 6px 1px rgba(255, 70, 40, .85); will-change: transform, opacity;
  }
  .i-hint {
    position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255, 255, 255, .42); opacity: 0;
  }
  /* the timeline (seconds): 0.1 scene fades in · 0.36 slash · 0.52-0.82 name slams in (impact 0.82) · 1.0 slash · 1.14-1.52 tag swipes in (impact 1.52) · 2.65 end */
  .play .i-art     { animation: iShake 2.6s linear; }
  .play .i-zoom    { animation: iZoom 3.3s linear both; }
  .play .i-scene   { animation: iScene 1.1s cubic-bezier(.1, .6, .2, 1) .1s both; }
  .play .i-glow    { animation: iGlow 2.6s ease-out .3s both; }
  .play .i-name    { animation: iName .3s cubic-bezier(.55, 0, .95, .45) .52s both; }
  .play .i-tag     { animation: iTag .38s cubic-bezier(.2, .8, .2, 1) 1.14s both; }
  .play .i-slash.a { animation: iSlash .3s cubic-bezier(.3, .1, .2, 1) .36s both; }
  .play .i-slash.b { animation: iSlash .28s cubic-bezier(.3, .1, .2, 1) 1s both; }
  .play .i-flash   { animation: iFlash 2.6s linear both; }
  .play .i-embers i { animation: iEmber var(--d) ease-out var(--dl) both; }
  .play .i-hint    { animation: iHint .6s ease 1.3s both; }
  @keyframes iZoom  { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes iScene { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes iGlow  { 0% { opacity: 0; transform: scale(.6); } 22% { opacity: .95; } 100% { opacity: .5; transform: scale(1.12); } }
  @keyframes iName  { from { opacity: 0; transform: scale(1.9) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes iTag   { from { opacity: 1; clip-path: inset(0 100% 0 0); transform: translateX(-30px) skewX(-12deg); } to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes iSlash { 0% { opacity: 0; transform: rotate(var(--r)) translateX(-80%); } 15% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateX(80%); } }
  @keyframes iFlash { 0%, 30% { opacity: 0; } 31.5% { opacity: .55; } 38% { opacity: 0; } 58% { opacity: 0; } 59.2% { opacity: .3; } 65% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes iShake {
    0%, 30% { transform: translate(0, 0); }
    31.5% { transform: translate(-11px, 6px); } 34% { transform: translate(9px, -7px); } 37% { transform: translate(-6px, 4px); }
    40.5% { transform: translate(4px, -3px); } 44% { transform: translate(-2px, 1px); } 47%, 58% { transform: translate(0, 0); }
    59.5% { transform: translate(5px, -3px); } 62.5% { transform: translate(-4px, 3px); } 66% { transform: translate(2px, -1px); } 69%, 100% { transform: translate(0, 0); }
  }
  @keyframes iEmber { 0% { opacity: 0; transform: translate(0, 0); } 14% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -62vh); } }
  @keyframes iHint  { from { opacity: 0; } to { opacity: 1; } }
  /* the white flash and the red slash that punch in when you tap "Click here" */
  #flash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
  #swipe {
    position: fixed; z-index: 71; left: -30%; top: 46%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 30%, #ff3a2a 70%, rgba(255, 60, 40, 0)); box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85);
  }

  /* ---------- 1. enter screen ---------- */
  #enter {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #000; cursor: pointer; outline: none;
    transition: opacity .4s ease, visibility .4s;
  }
  #enter.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #enterText {
    font-size: clamp(15px, 4.6vw, 24px); letter-spacing: .25em; line-height: 1.7; text-align: center;
    text-shadow: 0 0 12px rgba(255, 255, 255, .45);
  }
  #enterText::after { content: "|"; margin-left: .05em; animation: blink 1s steps(1) infinite; }
</style>

          if (avg > 26 || slowShare > 0.3) { degrade(avg); if (!isUltra()) round(); }
        });
      }, 3500);
    })();
  }

  /* ---------- Android app: pause everything while the app is in the background; back button ---------- */
  var resumeList = [];
  window.appPaused = function () {
    if (paused) return;

    resumeList.forEach(function (m) { swallow(m.play()); });

    wfUpdate(); wfBeat(true);
  };
  window.appBack = handleBack;

  /* =====================================================================
     WINGS FRAME: sparkles + falling feathers on one small canvas, the glow pulsing on the beat, pause in the background
     ===================================================================== */
  var wfEl = document.querySelector("#avHome .wf");
  var WF_SPARKS = [[0.1341,0.6006],[0.8411,0.8057],[0.2773,0.2715],[0.2135,0.8018],[0.1074,0.1367],[0.9271,0.6045],[0.7109,0.8936],[0.1595,0.1953],[0.9316,0.4902],[0.3867,0.958],[0.2181,0.8818],[0.7962,0.2471],[0.9349,0.415],[0.054,0.3809],[0.8815,0.1152],[0.0612,0.377],[0.9668,0.3027],[0.3874,0.9697],[0.6745,0.2607],[0.0872,0.4355],[0.0475,0.1855],[0.8874,0.7393],[0.7292,0.8594],[0.0866,0.125],[0.9076,0.6396],[0.2109,0.8262],[0.8359,0.709],[0.9049,0.0664],[0.375,0.9551],[0.1152,0.6426],[0.946,0.418],[0.0716,0.6318],[0.2826,0.2432],[0.9395,0.5625],[0.9342,0.1816],[0.9342,0.415],[0.0977,0.4824],[0.1426,0.7236],[0.2812,0.9336],[0.0521,0.2832],[0.2715,0.8145],[0.1999,0.2148],[0.0892,0.4922],[0.6595,0.3809],[0.7487,0.7969],[0.1185,0.6465],[0.8314,0.79],[0.8717,0.7959],[0.6745,0.2812],[0.1921,0.8389],[0.2539,0.7881],[0.0384,0.2031],[0.304,0.2744],[0.2793,0.7783],[0.2884,0.915],[0.2409,0.8975],[0.8997,0.4678],[0.2604,0.3037],[0.9141,0.4746],[0.2142,0.8047]];                       // spots on / around the wings (0..1 of the frame)
  var WF_FROM = [[0.9368,0.4287],[0.9186,0.4512],[0.9238,0.4883],[0.0944,0.5293],[0.0579,0.415],[0.9225,0.5254],[0.9095,0.7275],[0.9258,0.6348],[0.0729,0.4629],[0.0332,0.3408],[0.1523,0.7178],[0.9036,0.7207],[0.06,0.36],[0.04,0.45],[0.08,0.53],[0.13,0.62],[0.18,0.69],[0.24,0.73],[0.29,0.7],[0.9332,0.36],[0.9532,0.45],[0.9132,0.53],[0.8632,0.62],[0.8132,0.69],[0.7532,0.73],[0.7032,0.7]];                         // where feathers come loose (wing edges)
  var WF_FEATHER = [1150, 852, 151, 107];       // a loose feather inside frame.png (pixels), used as the falling feather
  var wf = { cv: $("wfx"), g: null, img: null, spr: null, run: false, last: 0, acc: 0, w: 0, h: 0, k: 1, sp: [], fe: [] };
  function wfSprite() {                         // one gold sparkle, drawn once
    var c = document.createElement("canvas"); c.width = c.height = 64;
    var x = c.getContext("2d"), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,250,225,1)"); gr.addColorStop(.16, "rgba(255,214,120,.85)"); gr.addColorStop(.5, "rgba(255,160,60,.2)"); gr.addColorStop(1, "rgba(255,140,40,0)");
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    x.fillStyle = "rgba(255,252,236,.95)";
    x.beginPath(); x.moveTo(32, 2); x.quadraticCurveTo(34.6, 29.4, 62, 32); x.quadraticCurveTo(34.6, 34.6, 32, 62); x.quadraticCurveTo(29.4, 34.6, 2, 32); x.quadraticCurveTo(29.4, 29.4, 32, 2); x.fill();
    return c;
  }
  function wfSpark(s, first) {
    var p = WF_SPARKS[Math.floor(Math.random() * WF_SPARKS.length)], u = wf.w / 405;
    s.x = p[0] * wf.w + (Math.random() - .5) * 12 * u; s.y = p[1] * wf.h + (Math.random() - .5) * 12 * u;
    s.s = (7 + Math.random() * 13) * u; s.T = .8 + Math.random() * .9; s.d = Math.random() * (first ? 1.6 : .7); s.t = 0;
    return s;
  }
  function wfFeather(f, first) {
    var p = WF_FROM[Math.floor(Math.random() * WF_FROM.length)], u = wf.w / 405;
    f.x0 = p[0] * wf.w; f.y0 = p[1] * wf.h; f.t = 0; f.T = 3.4 + Math.random() * 1.8; f.d = first ? Math.random() * 3 : .6 + Math.random() * 2.2;
    f.vy = (13 + Math.random() * 13) * u; f.vx = (p[0] < .5 ? -1 : 1) * (2 + Math.random() * 5) * u; f.amp = (5 + Math.random() * 8) * u; f.ph = Math.random() * 6.28;
    f.r = (Math.random() - .5) * 1.4; f.vr = (Math.random() - .5) * .9; f.sc = (.5 + Math.random() * .32) * wf.w / 1536; f.flip = Math.random() < .5;
    return f;
  }
  function wfWanted() { return entered && !!C.frame && fx.on && curScreen === "home" && !playerOpen && !termOpen && !paused && !document.hidden && !isUltra() && !reduced; }
  function wfUpdate() { if (!wf.cv) return; if (wfWanted()) { if (!wf.run) wfStart(); } else if (wf.run) wfStop(); }
  function wfStart() {
    var w = wf.cv.offsetWidth, h = wf.cv.offsetHeight; if (!w || !h) return;
    wf.k = Math.min(window.devicePixelRatio || 1, isLite() ? 1 : 1.5);
    wf.cv.width = Math.round(w * wf.k); wf.cv.height = Math.round(h * wf.k); wf.w = w; wf.h = h;
    wf.g = wf.cv.getContext("2d"); wf.spr = wf.spr || wfSprite();
    if (!wf.img) { wf.img = new Image(); wf.img.decoding = "async"; wf.img.src = C.frame; }
    var ns = isLite() ? 9 : 14, nf = isLite() ? 3 : 5, i;
    wf.sp = []; for (i = 0; i < ns; i++) wf.sp.push(wfSpark({}, true));
    wf.fe = []; for (i = 0; i < nf; i++) wf.fe.push(wfFeather({}, true));
    wf.run = true; wf.last = 0; wf.acc = 0;
    requestAnimationFrame(wfFrame);
  }
  function wfStop() { wf.run = false; if (wf.g) wf.g.clearRect(0, 0, wf.cv.width, wf.cv.height); }
  function wfFrame(t) {
    if (!wf.run) return;
    requestAnimationFrame(wfFrame);
    var dt = wf.last ? Math.min(.1, (t - wf.last) / 1000) : .033; wf.last = t;
    wf.acc += dt; if (wf.acc < (isLite() ? .04 : .032)) return;        // about 25 / 30 frames a second
    var step = wf.acc, g = wf.g, i, a, z; wf.acc = 0;
    g.setTransform(wf.k, 0, 0, wf.k, 0, 0); g.clearRect(0, 0, wf.w, wf.h);
    for (i = 0; i < wf.sp.length; i++) {                                // sparkles twinkle (fade in and out) at random spots
      var s = wf.sp[i]; s.t += step;
      if (s.t < s.d) continue;
      var u = (s.t - s.d) / s.T;
      if (u >= 1) { wfSpark(s, false); continue; }
      a = Math.sin(Math.PI * u); z = s.s * (.55 + .45 * a);
      g.globalAlpha = a; g.drawImage(wf.spr, s.x - z / 2, s.y - z / 2, z, z);
    }
    var im = wf.img, ok = im && im.complete && im.naturalWidth;
    for (i = 0; ok && i < wf.fe.length; i++) {                          // feathers drift down, sway and fade out
      var f = wf.fe[i]; f.t += step;
      if (f.t < f.d) continue;
      var e = f.t - f.d;
      if (e >= f.T) { wfFeather(f, false); continue; }
      a = Math.min(1, e / .5) * Math.min(1, (f.T - e) / 1.6) * .9;
      var dw = WF_FEATHER[2] * f.sc, dh = WF_FEATHER[3] * f.sc;
      g.save(); g.globalAlpha = a;
      g.translate(f.x0 + f.vx * e + Math.sin(f.ph + e * 1.7) * f.amp, f.y0 + f.vy * e); g.rotate(f.r + f.vr * e);
      if (f.flip) g.scale(-1, 1);
      g.drawImage(im, WF_FEATHER[0], WF_FEATHER[1], WF_FEATHER[2], WF_FEATHER[3], -dw / 2, -dh / 2, dw, dh);
      g.restore();
    }
    g.globalAlpha = 1;
  }
  window.addEventListener("resize", function () { if (wf.run) { wfStop(); wfStart(); } });
  document.addEventListener("visibilitychange", wfUpdate);

  // the glow pulses on the beat while music plays (each song's tempo + first beat are in CONFIG), slowly when paused
  var wfBeatAt = 0, wfBeatVar = "";
  function beatOf() { var s = songs[idx]; return s && +s.bpm > 30 ? { p: 60 / s.bpm, o: +s.beat || 0 } : { p: .6, o: 0 }; }
  function wfBeat(force) {
    if (!wfEl) return;
    var on = !audio.paused && !reduced, b = beatOf(), v = b.p.toFixed(4) + "s";
    if (v !== wfBeatVar) { wfBeatVar = v; wfEl.style.setProperty("--beat", v); }
    if (wfEl.classList.contains("beat") !== on) wfEl.classList.toggle("beat", on);
    if (!on) return;
    var now = Date.now(); if (!force && now - wfBeatAt < 5000) return; wfBeatAt = now;
    requestAnimationFrame(function () {                                // line the pulse up with the song (re-checked every few seconds)
      qa(".wf-halo", wfEl).forEach(function (el) {
        if (!el.getAnimations) return;
        el.getAnimations().forEach(function (an) {
          if (an.animationName && an.animationName !== "haloBeat") return;
          var ph = ((audio.currentTime - b.o) % b.p + b.p) % b.p;
          try { an.currentTime = ph * 1000; } catch (x) {}
        });
      });
    });
  }
  ["play", "pause", "seeked", "loadedmetadata"].forEach(function (ev) { audio.addEventListener(ev, function () { wfBeat(true); }); });
  audio.addEventListener("timeupdate", function () { wfBeat(false); });

  /* =====================================================================
     ROOM AT THE BOTTOM: every screen can scroll its last row above the floating mini player and the nav bar,
     and Home squeezes a little on short screens so the whole music card is always above the nav bar
     ===================================================================== */
  function fitBottom() {
    var app = $("app"), mini = $("mini");
    if (!app.clientHeight || !mini.offsetHeight) return;
    app.style.setProperty("--mini-space", Math.ceil(app.clientHeight - mini.offsetTop + 22) + "px");   // up to the mini player + a gap
  }
  function fitHome() {
    var h = el.home;
    if (!h || h.style.display === "none" || !h.clientHeight) return;
    var over = function (q) { h.style.setProperty("--q", q.toFixed(3)); return h.scrollHeight - h.clientHeight > 0; };
    if (!over(0)) return;                                   // fits as designed
    if (over(1)) return;                                    // a very small screen: fully squeezed, the rest scrolls
    var lo = 0, hi = 1;
    for (var i = 0; i < 7; i++) { var mid = (lo + hi) / 2; if (over(mid)) lo = mid; else hi = mid; }
    over(hi);
  }
  function fitAll() { fitBottom(); fitHome(); }
  window.addEventListener("resize", fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  /* ---------- the Settings card: its picture, and the gold sparkles that twinkle around its frame ---------- */
  var WF2_SPARKS = [[0.8804,0.6627],[0.3325,0.8652],[0.9378,0.437],[0.5303,0.1483],[0.429,0.8971],[0.6069,0.1475],[0.0271,0.2033],[0.508,0.9067],[0.2129,0.2903],[0.8142,0.2313],[0.0821,0.5646],[0.7974,0.2568],[0.2089,0.2687],[0.0463,0.1212],[0.0861,0.1427],[0.3884,0.1443],[0.996,0.3214],[0.0191,0.2935],[0.8142,0.248],[0.0478,0.4258],[0.0957,0.6292],[0.193,0.2679],[0.6523,0.2368],[0.8349,0.2089],[0.9298,0.1451],[0.3828,0.1754],[0.0718,0.4968],[0.799,0.74],[0.6499,0.87],[0.3708,0.1834],[0.953,0.2177],[0.9051,0.6124],[0.5973,0.1427],[0.1858,0.7169],[0.0199,0.3668],[0.2751,0.8525],[0.0534,0.0909],[0.756,0.3325],[0.1627,0.6898],[0.0311,0.2943]];      // spots on / around the wings, crown and swirls (0..1 of frame2.png)
  qa(".setprof img.sav").forEach(function (e) { e.src = C.avatarImage; });
  var wf2Placed = false;

    var w = f.offsetWidth, h = f.offsetHeight; wf2Placed = true;
    qa(".wf2-sp").forEach(function (s, i) {
      sparkSpots(s, function () { var q = WF2_SPARKS[Math.floor(Math.random() * WF2_SPARKS.length)]; return [q[0] * w, q[1] * h]; });
      s.style.setProperty("--d", (7 + Math.random() * 3).toFixed(2) + "s"); s.style.setProperty("--dl", (-i * 1.37).toFixed(2) + "s");
    });
  }

  /* ---------- start up ---------- */
  var clockEl = $("clock");
  function tickClock() { var d = new Date(); clockEl.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  tickClock(); setInterval(tickClock, 20000);
  buildSocial();
  qa(".js-name").forEach(function (e) { e.textContent = C.name; });
  qa(".js-handle").forEach(function (e) { e.textContent = C.handle; });
  qa(".js-q-social").forEach(function (e) { e.textContent = "“" + C.quotes.social + "”"; });
  qa(".js-q-stats").forEach(function (e) { e.textContent = "“" + C.quotes.stats + "”"; });
  qa(".js-followers").forEach(function (e) { e.textContent = fmtNum(C.stats.followers); });
  qa(".js-following").forEach(function (e) { e.textContent = fmtNum(C.stats.following); });
  qa(".js-posts").forEach(function (e) { e.textContent = fmtNum(C.stats.posts); });
  $("pfBio").textContent = "";
  setToggle(".js-shuffle", shuffleOn); setToggle(".js-repeat", repeatOn);
  var swb = $("swBlur"), swf = $("swFx");
  setSwitch(swb, blurIsOn()); setSwitch(swf, fx.on);
  swb.addEventListener("click", function () { var on = swb.getAttribute("aria-checked") !== "true"; setBlur(on); toast(on ? "Soft blur on" : "Soft blur off", on ? "Prettier glass. Turn it off if it lags." : "Plain glass, smoothest.", { icon: "sparkles" }); });
  swf.addEventListener("click", function () {
    fx.on = swf.getAttribute("aria-checked") !== "true"; setSwitch(swf, fx.on); store.set("fx", fx.on ? "1" : "0");
    root.classList.toggle("nofx", !fx.on);                 // the gold sparkles go too (popup, Settings frame, Home frame)
    if (fx.on) fxStart(); else fxStop();
    wfUpdate();
  });
  applyTheme(root.getAttribute("data-theme"), true);
  applyStatus(); applyFlags();
  root.classList.toggle("nofx", !fx.on);
  load(idx, false);
  applyVolume(); applyBrightness();
  updateChrome();
  fitAll();
})();
