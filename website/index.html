  .bdg.lock { opacity: .5; } .bdg.lock svg.ic { color: var(--text3); }
  .tl { list-style: none; } .tl li { display: flex; gap: 12px; padding: 11px 0; align-items: baseline; } .tl li + li { box-shadow: 0 -1px 0 rgba(255, 255, 255, .09); }
  .tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--glow); flex: none; transform: translateY(-1px); }
  .tl span { flex: 1; } .tl small { color: var(--text3); font-size: 12.5px; white-space: nowrap; }
  .field { width: 100%; min-height: 96px; padding: 14px; resize: none; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); outline: none; font-size: 16px; line-height: 1.45; -webkit-user-select: text; user-select: text; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .22); }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 14px; border-radius: 16px; text-align: center; font-weight: 600; font-size: 15.5px; background: rgba(255, 255, 255, .08); border: 1px solid var(--edge); }
  .btn.main { color: #06101e; border: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 20px var(--glow); }
  .qa { padding: 12px 0; } .qa + .qa { box-shadow: 0 -1px 0 rgba(255, 255, 255, .09); } .qa b { display: block; margin-bottom: 4px; }

  #menuback { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 59; display: none; }
  #menu {
    position: absolute; z-index: 60; min-width: 210px; padding: 6px; border-radius: 20px; display: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 60%), rgba(var(--surface-rgb), .985); border: 1px solid var(--edge); box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
    opacity: 0; transform: scale(.9) translateY(-6px); transform-origin: 20px 0; transition: opacity .18s, transform .28s cubic-bezier(.2, 1.3, .4, 1);
  }
  #menu.open { opacity: 1; transform: none; }
  .mi { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 15.5px; }
  .mi .d { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: currentColor; }
  .mi b { flex: 1; font-weight: 500; } .mi .ck { width: 18px; height: 18px; color: var(--accent); }
  .mi .num { color: var(--text); font-weight: 600; } .mi.info { cursor: default; } .mi.info b { color: var(--text2); }
  .mi.sep { box-shadow: 0 -1px 0 rgba(255, 255, 255, .08); border-radius: 0 0 12px 12px; margin-top: 4px; padding-top: 14px; color: var(--accent); font-weight: 600; }

  /* =====================================================================
     POPUP MESSAGE ("Status updated!" and every other message): a glowing pill at the top, above everything.
     Black glass with a diagonal reflection · thick glowing red border with a gold line · gold sparkles on the border ·
     a round medallion on the left (spinning red-gold ring, orbiting light, the crown or an icon) · a close button.
     Only transform / opacity are animated; it all stops while the app is in the background.
     ===================================================================== */
  #toast { position: fixed; z-index: 120; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; width: min(92vw, 410px); margin-left: calc(min(92vw, 410px) / -2); pointer-events: none; }
  .pop { position: relative; display: flex; align-items: center; min-height: 80px; padding: 11px 46px 12px 90px; pointer-events: auto; transform-origin: 50% 0;
         animation: popIn .62s cubic-bezier(.22, 1.35, .36, 1) both; }
  .pop.out { animation: popOut .36s cubic-bezier(.55, 0, .8, .45) forwards; pointer-events: none; }
  @keyframes popIn { 0% { opacity: 0; transform: translateY(-118%) scale(.8); } 45% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes popOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-110%) scale(.94); } }

  /* outer red glow (pulses softly) */
  .pop-glow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 0 1.5px rgba(255, 70, 50, .95), 0 0 10px 3px rgba(255, 32, 22, .9), 0 0 28px 8px rgba(255, 10, 0, .5), 0 0 54px 14px rgba(255, 40, 0, .2);
    animation: popGlow 1.6s ease-in-out infinite alternate; }
  @keyframes popGlow { from { opacity: .5; } to { opacity: 1; } }
  /* the pill: black glass, a red glow inside, a diagonal reflection, the thick red border with a dark inner edge */
  .pop-body { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 999px; overflow: hidden; pointer-events: none;
    background:
      linear-gradient(113deg, rgba(255, 255, 255, 0) 34%, rgba(255, 228, 214, .07) 42%, rgba(255, 236, 226, .2) 48%, rgba(255, 228, 214, .06) 54%, rgba(255, 255, 255, 0) 62%),
      radial-gradient(64% 130% at 16% 28%, rgba(176, 14, 12, .6), rgba(176, 14, 12, 0) 72%),
      radial-gradient(56% 120% at 90% 78%, rgba(130, 10, 8, .45), rgba(130, 10, 8, 0) 72%),
      linear-gradient(180deg, #2c0709, #0a0203 50%, #180306);
    box-shadow: inset 0 0 0 3px #ff2a22, inset 0 0 0 4.5px rgba(110, 0, 0, .95), inset 0 0 18px 5px rgba(255, 28, 24, .42), inset 0 12px 16px rgba(255, 130, 100, .07); }
  /* the gold light line just inside the red border: brightest along the top and the lower right */
  .pop-body::before { content: ""; position: absolute; top: 3.5px; right: 3.5px; bottom: 3.5px; left: 3.5px; border-radius: 999px; padding: 1.8px;
    background: linear-gradient(180deg, #fff4c4, rgba(255, 200, 96, .45) 30%, rgba(255, 170, 70, 0) 50%),
                linear-gradient(-14deg, #ffe08c, rgba(255, 170, 70, .35) 22%, rgba(255, 150, 60, 0) 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  /* the shine: sweeps across once, left to right, right after the pill has landed */
  .pop-shine { position: absolute; top: -10%; bottom: -10%; left: 0; width: 30%;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 240, 214, .28) 42%, rgba(255, 252, 240, .55) 50%, rgba(255, 240, 214, .28) 58%, rgba(255, 255, 255, 0));
    transform: translateX(-140%) skewX(-18deg); animation: popShine 1.05s .62s cubic-bezier(.45, 0, .3, 1) both; }
  @keyframes popShine { from { transform: translateX(-140%) skewX(-18deg); } to { transform: translateX(380%) skewX(-18deg); } }

  /* glowing light streaks around the medallion and along the bottom of the pill (drawn once) */
  .pop-streak { position: absolute; left: -22px; top: -16px; width: calc(100% + 40px); height: calc(100% + 32px); overflow: visible; pointer-events: none; }
  .pop-streak path { fill: none; stroke-linecap: round; }
  .pop-streak .glo { stroke-width: 7; opacity: .45; }
  .pop-streak .lin { stroke-width: 2.2; }
  .pop-streak .thin { stroke-width: 1.3; }

  /* gold sparkles that twinkle on the border (placed at random spots by the script) */
  .pop-sp { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255, 240, 190, .95) 0, rgba(255, 196, 90, .5) 24%, rgba(255, 150, 40, 0) 60%);
    animation: tw4 var(--d, 4.4s) var(--dl, 0s) linear infinite; }
  .pop-sp::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fffbea;
    clip-path: polygon(50% 0, 56.5% 43.5%, 100% 50%, 56.5% 56.5%, 50% 100%, 43.5% 56.5%, 0 50%, 43.5% 43.5%); }
  /* a sparkle twinkles at four spots in turn (--x1/--y1 … --x4/--y4, set once by the script); it moves only while invisible */
  @keyframes tw4 {
    0%, 25% { opacity: 0; transform: translate(var(--x1), var(--y1)) scale(.25) rotate(0deg); }
    6% { opacity: 1; transform: translate(var(--x1), var(--y1)) scale(1) rotate(45deg); }
    12.5% { opacity: 0; transform: translate(var(--x1), var(--y1)) scale(.25) rotate(90deg); }
    25.01%, 50% { opacity: 0; transform: translate(var(--x2), var(--y2)) scale(.25) rotate(0deg); }
    31% { opacity: 1; transform: translate(var(--x2), var(--y2)) scale(1) rotate(45deg); }
    37.5% { opacity: 0; transform: translate(var(--x2), var(--y2)) scale(.25) rotate(90deg); }
    50.01%, 75% { opacity: 0; transform: translate(var(--x3), var(--y3)) scale(.25) rotate(0deg); }
    56% { opacity: 1; transform: translate(var(--x3), var(--y3)) scale(1) rotate(45deg); }
    62.5% { opacity: 0; transform: translate(var(--x3), var(--y3)) scale(.25) rotate(90deg); }
    75.01%, 100% { opacity: 0; transform: translate(var(--x4), var(--y4)) scale(.25) rotate(0deg); }
    81% { opacity: 1; transform: translate(var(--x4), var(--y4)) scale(1) rotate(45deg); }
    87.5% { opacity: 0; transform: translate(var(--x4), var(--y4)) scale(.25) rotate(90deg); }
  }

  /* the medallion: red glow, dark red disc, a spinning red-gold ring, light orbiting on a tilted ellipse, the crown (or an icon) */
  .pm { position: absolute; left: -2px; top: 50%; width: 86px; height: 86px; margin-top: -43px; pointer-events: none; }
  .pm-glow { position: absolute; top: -16px; right: -16px; bottom: -16px; left: -16px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 50, 24, .55) 38%, rgba(255, 24, 0, .2) 58%, rgba(255, 0, 0, 0) 71%); }
  .pm-disc { position: absolute; top: 7px; right: 7px; bottom: 7px; left: 7px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #8a0d0b, #420407 52%, #170104 82%);
    box-shadow: inset 0 0 14px rgba(255, 70, 40, .6), inset 0 0 0 1.5px rgba(255, 130, 90, .55), 0 0 0 2px #ff3a26, 0 0 14px 4px rgba(255, 60, 20, .9), 0 0 30px 7px rgba(255, 30, 0, .4); }
  .pm-ring { position: absolute; top: 2px; right: 2px; bottom: 2px; left: 2px; border-radius: 50%;
    background: conic-gradient(from 0deg, #ff2a16, #ffb03c 40deg, #fff3bf 62deg, #ffb03c 84deg, #ff2a16 132deg, #a70b0b 190deg, #ff3416 240deg, #ffcf68 288deg, #fff 300deg, #ffcf68 312deg, #ff2a16 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.1px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.1px));
    animation: spin 5.5s linear infinite; }
  .pm-orbit { position: absolute; left: -18px; top: -18px; width: 122px; height: 122px; transform: rotate(-24deg) scaleY(.36); }
  .pm-orbit i { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 190, 80, 0) 0deg, rgba(255, 190, 80, 0) 236deg, rgba(255, 160, 60, .85) 326deg, #fff 350deg, rgba(255, 255, 255, 0) 355deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px), #000 calc(100% - .6px), transparent 100%);
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px), #000 calc(100% - .6px), transparent 100%);
    animation: spin 2.4s linear infinite; }
  .pm-orbit i + i { animation-duration: 3.4s; animation-direction: reverse; opacity: .7; }
  /* the crown: a cut-out of the crown in assets/frame2.png (box 512 x 306 px of that picture, from 372 / 44) */
  .pm-crown { position: absolute; left: 50%; top: 50%; width: 64px; height: 38.25px; margin: -22px 0 0 -32px; filter: drop-shadow(0 0 4px rgba(255, 170, 60, .65));
    animation: pmDrop .78s .26s cubic-bezier(.25, .8, .35, 1) both, pmBob 2.6s 1.1s ease-in-out infinite; }
  .pm-crown-in { width: 100%; height: 100%; background-image: var(--frame2-img); background-repeat: no-repeat;

    clip-path: polygon(1.56% 47.06%, 10.35% 47.06%, 25.00% 34.64%, 44.53% 1.96%, 55.27% 1.96%, 74.22% 34.64%, 89.45% 47.06%, 98.24% 47.06%, 98.24% 63.40%, 85.94% 98.37%, 75.78% 94.44%, 64.06% 91.83%, 49.80% 90.85%, 35.74% 91.83%, 24.02% 94.44%, 13.67% 98.37%, 1.56% 63.40%); }

  /* =====================================================================

          background: linear-gradient(180deg, rgba(217, 194, 74, 0), #D9C24A 18%, #f7dc85 50%, #D9C24A 82%, rgba(217, 194, 74, 0)); box-shadow: 0 0 6px rgba(242, 163, 58, .6); }

  @media (prefers-reduced-motion: reduce) { #chg *, #chg *::after { animation: none !important; } #chgfx { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    #bg, .ring, .bars i, .wf *, .wf *::after, .pop, .pop *, .pop *::after, #player *, #player *::after, #s-home .hero *, .vtick *, .vt-shine::after { animation: none !important; }
    body.entered #app { transition-duration: .01s; }
  }

  /* ---------- 0. opening intro (everything here only moves with transform / opacity, so it stays smooth) ---------- */
  #intro { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: #000; overflow: hidden; cursor: pointer;
           animation: iFailsafe .01s linear 7s forwards; }          /* if the script ever fails, the intro hides itself after 7 s */
  @keyframes iFailsafe { to { visibility: hidden; pointer-events: none; } }
  #intro.out { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #intro.out.fast { transition-duration: .3s; }
  .i-art {
    --a: min(100vw, 64vh); --a: min(100vw, 64svh);                /* the logo's square: as wide as the screen, never taller than 64% of it */
    position: absolute; left: 50%; top: 50%; width: var(--a); height: var(--a);
    margin: calc(var(--a) / -2) 0 0 calc(var(--a) / -2);
  }
  #intro.out .i-art { transform: scale(1.1); transition: transform .5s ease-in; }
  .i-zoom { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 50% 46%; will-change: transform; }
  .i-zoom img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; -webkit-user-drag: none; will-change: transform, opacity; }
  .i-glow {
    position: absolute; top: -30%; right: -30%; bottom: -30%; left: -30%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 44%, rgba(255, 45, 30, .5), rgba(255, 45, 30, 0) 56%); will-change: transform, opacity;
  }
  .i-vig { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, .92) 100%); }
  .i-flash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fff; opacity: 0; pointer-events: none; will-change: opacity; }
  .i-slash {
    position: absolute; left: -30%; top: 47%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 32%, #ff3a2a 70%, rgba(255, 60, 40, 0));
    box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85); will-change: transform, opacity;
  }
  .i-slash.a { --r: -22deg; }
  .i-slash.b { --r: 15deg; top: 57%; }
  .i-embers i {
    position: absolute; bottom: -8px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; opacity: 0; pointer-events: none;
    background: #ff5a3a; box-shadow: 0 0 6px 1px rgba(255, 70, 40, .85); will-change: transform, opacity;
  }
  .i-hint {
    position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255, 255, 255, .42); opacity: 0;
  }
  /* the timeline (seconds): 0.1 scene fades in · 0.36 slash · 0.52-0.82 name slams in (impact 0.82) · 1.0 slash · 1.14-1.52 tag swipes in (impact 1.52) · 2.65 end */
  .play .i-art     { animation: iShake 2.6s linear; }
  .play .i-zoom    { animation: iZoom 3.3s linear both; }
  .play .i-scene   { animation: iScene 1.1s cubic-bezier(.1, .6, .2, 1) .1s both; }
  .play .i-glow    { animation: iGlow 2.6s ease-out .3s both; }
  .play .i-name    { animation: iName .3s cubic-bezier(.55, 0, .95, .45) .52s both; }
  .play .i-tag     { animation: iTag .38s cubic-bezier(.2, .8, .2, 1) 1.14s both; }
  .play .i-slash.a { animation: iSlash .3s cubic-bezier(.3, .1, .2, 1) .36s both; }
  .play .i-slash.b { animation: iSlash .28s cubic-bezier(.3, .1, .2, 1) 1s both; }
  .play .i-flash   { animation: iFlash 2.6s linear both; }
  .play .i-embers i { animation: iEmber var(--d) ease-out var(--dl) both; }
  .play .i-hint    { animation: iHint .6s ease 1.3s both; }
  @keyframes iZoom  { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes iScene { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes iGlow  { 0% { opacity: 0; transform: scale(.6); } 22% { opacity: .95; } 100% { opacity: .5; transform: scale(1.12); } }
  @keyframes iName  { from { opacity: 0; transform: scale(1.9) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes iTag   { from { opacity: 1; clip-path: inset(0 100% 0 0); transform: translateX(-30px) skewX(-12deg); } to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes iSlash { 0% { opacity: 0; transform: rotate(var(--r)) translateX(-80%); } 15% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateX(80%); } }
  @keyframes iFlash { 0%, 30% { opacity: 0; } 31.5% { opacity: .55; } 38% { opacity: 0; } 58% { opacity: 0; } 59.2% { opacity: .3; } 65% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes iShake {
    0%, 30% { transform: translate(0, 0); }
    31.5% { transform: translate(-11px, 6px); } 34% { transform: translate(9px, -7px); } 37% { transform: translate(-6px, 4px); }
    40.5% { transform: translate(4px, -3px); } 44% { transform: translate(-2px, 1px); } 47%, 58% { transform: translate(0, 0); }
    59.5% { transform: translate(5px, -3px); } 62.5% { transform: translate(-4px, 3px); } 66% { transform: translate(2px, -1px); } 69%, 100% { transform: translate(0, 0); }
  }
  @keyframes iEmber { 0% { opacity: 0; transform: translate(0, 0); } 14% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -62vh); } }
  @keyframes iHint  { from { opacity: 0; } to { opacity: 1; } }
  /* the white flash and the red slash that punch in when you tap "Click here" */
  #flash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
  #swipe {
    position: fixed; z-index: 71; left: -30%; top: 46%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 30%, #ff3a2a 70%, rgba(255, 60, 40, 0)); box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85);
  }

  /* ---------- 1. enter screen ---------- */
  #enter {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #000; cursor: pointer; outline: none;
    transition: opacity .4s ease, visibility .4s;
  }
  #enter.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #enterText {
    font-size: clamp(15px, 4.6vw, 24px); letter-spacing: .25em; line-height: 1.7; text-align: center;
    text-shadow: 0 0 12px rgba(255, 255, 255, .45);
  }
  #enterText::after { content: "|"; margin-left: .05em; animation: blink 1s steps(1) infinite; }
</style>

  <div id="shade"></div>

    <div class="pt-rings" id="ptRings"><i></i><i></i><i></i><i></i></div>

        </button>

  /* =====================================================================
     STATS: weekly activity line chart (SVG)
     ===================================================================== */
  var DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], chartBuilt = false;
  function drawChart() {
    var box = $("wk");
    $("stViews").textContent = fmtK(views);
    if (!chartBuilt) buildChart(box);
    var path = box.querySelector(".line"), dots = qa(".dot,.lbl", box);
    if (reduced || !path.animate || !path.getTotalLength) return;
    var len = path.getTotalLength();
    qa(".line,.lineglow", box).forEach(function (pth) { pth.style.strokeDasharray = len; pth.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1100, easing: "cubic-bezier(.3,.6,.2,1)" }); });
    box.querySelector(".area").animate([{ opacity: 0 }, { opacity: .1 }], { duration: 1100, easing: "ease-out" });
    dots.forEach(function (d, i) { d.animate([{ opacity: 0, transform: "scale(.2)" }, { opacity: 1, transform: "none" }], { duration: 360, delay: 160 + 130 * (i % 7), easing: "cubic-bezier(.3,1.6,.5,1)", fill: "backwards" }); });
  }
  function buildChart(box) {
    var data = (C.weekly || []).slice(0, 7); while (data.length < 7) data.push(0);
    var W = 320, H = 168, L = 34, R = 12, T = 22, B = 28, peakV = Math.max.apply(null, data), top = Math.max(10, Math.ceil(peakV * 1.15 / 10) * 10);
    var X = function (i) { return L + i * (W - L - R) / 6; }, Y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var pts = data.map(function (v, i) { return [X(i), Y(v)]; });
    var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {                       // smooth curve (Catmull-Rom turned into Béziers)
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    var base = (H - B).toFixed(1), area = d + " L" + pts[6][0].toFixed(1) + " " + base + " L" + pts[0][0].toFixed(1) + " " + base + " Z";
    var peak = data.indexOf(peakV), s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Weekly activity: ' + data.map(function (v, i) { return DAYS[i] + " " + v; }).join(", ") + '"><title>Weekly activity</title>';
    [0, top / 2, top].forEach(function (v) { s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text class="tick" x="' + (L - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + "</text>"; });
    DAYS.forEach(function (n, i) { s += '<text class="day" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + n + "</text>"; });
    s += '<path class="area" d="' + area + '"/><path class="lineglow" d="' + d + '"/><path class="line" d="' + d + '"/><line class="cross" id="cross" y1="' + T + '" y2="' + base + '" x1="0" x2="0"/>';
    pts.forEach(function (p, i) { s += '<circle class="dot' + (i === 6 ? " hot" : "") + '" id="dot' + i + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5"/>'; });
    [peak, 6].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (i) { s += '<text class="lbl" x="' + pts[i][0].toFixed(1) + '" y="' + (pts[i][1] - 11).toFixed(1) + '" text-anchor="middle">' + data[i] + "</text>"; });
    DAYS.forEach(function (n, i) { s += '<rect class="hit" data-i="' + i + '" x="' + (X(i) - (W - L - R) / 12).toFixed(1) + '" y="0" width="' + ((W - L - R) / 6).toFixed(1) + '" height="' + H + '"/>'; });
    s += "</svg>";
    s += '<table class="sr"><caption>Weekly activity</caption><tr><th>Day</th><th>Visits</th></tr>' + data.map(function (v, i) { return "<tr><td>" + DAYS[i] + "</td><td>" + v + "</td></tr>"; }).join("") + "</table>";
    s += '<div id="tip"><b></b><span></span></div>';

    var tip = $("tip"), cross = $("cross"), svg = box.querySelector("svg");
    function show(i) {

      qa(".dot", box).forEach(function (dd, k) { dd.setAttribute("r", k === i ? 6 : 4.5); });
      tip.firstChild.textContent = data[i] + " visits"; tip.lastChild.textContent = DAYS[i];
      var bw = box.getBoundingClientRect().width, sc = bw / W, tx = Math.max(0, Math.min(bw - tip.offsetWidth, pts[i][0] * sc - tip.offsetWidth / 2));
      tip.style.transform = "translate(" + tx + "px," + Math.max(0, pts[i][1] * sc - tip.offsetHeight - 14) + "px)"; tip.style.opacity = 1;
    }
    var tipTimer = 0;
    function hide() { clearTimeout(tipTimer); cross.style.opacity = 0; tip.style.opacity = 0; qa(".dot", box).forEach(function (dd) { dd.setAttribute("r", 4.5); }); }
    function hideLater() { clearTimeout(tipTimer); tipTimer = setTimeout(hide, 3500); }

  }

    g.fillStyle = pv.fx.down; g.fillRect(0, base + 2, W, H - base);
    g.globalCompositeOperation = "source-over";
  }
  function pvFx(g, W, H, base) {                          // gradients made once per size
    var red = g.createLinearGradient(0, 0, 0, base); red.addColorStop(0, "#ff9ab2"); red.addColorStop(.45, "#ff3d68"); red.addColorStop(1, "#ff1f45");
    var ends = g.createLinearGradient(0, 0, W, 0);
    ends.addColorStop(0, "rgba(0,0,0,.8)"); ends.addColorStop(.07, "rgba(0,0,0,0)"); ends.addColorStop(.93, "rgba(0,0,0,0)"); ends.addColorStop(1, "rgba(0,0,0,.8)");
    var down = g.createLinearGradient(0, base, 0, H); down.addColorStop(0, "rgba(0,0,0,0)"); down.addColorStop(1, "rgba(0,0,0,.95)");
    pv.fx = { red: red, ends: ends, down: down };
  }
  function pvFrame(t) {
    pv.raf = requestAnimationFrame(pvFrame);
    var dt = pv.last ? Math.min(.1, (t - pv.last) / 1000) : .016; pv.last = t;
    pv.acc += dt; if (pv.acc < .031) return;                               // about 30 frames a second
    dt = pv.acc; pv.acc = 0;
    var target = audio.paused || reduced ? 0 : 1;                          // the cover: one turn in 16 s, slows down smoothly when paused
    pv.spd += (target - pv.spd) * Math.min(1, dt * 3.2);
    if (Math.abs(target - pv.spd) < .015) pv.spd = target;                   // comes to rest in about a second
    pvSpin(pv.spd, dt);
    var p = (dragging || pv.seekDrag) ? +seeks[0].value / 1000 : audio.duration ? audio.currentTime / audio.duration : 0;
    var deg = p * 360;
    if (Math.abs(deg - pv.deg) > .35) {                                     // the white dot + the pink arc: how far the song is
      pv.deg = deg; pvDot.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
      pvDone.setAttribute("stroke-dasharray", (p * PV_C).toFixed(1) + " 1000"); pvHalo.setAttribute("stroke-dasharray", (p * PV_C).toFixed(1) + " 1000");
    }
    var L = pvLevel(t, dt);
    if (!isUltra() && Math.abs(L - pv.gl) > .012) {                          // the red glow follows the loudness (only real changes)
      pv.gl = L; pvGlow.style.opacity = (.42 + .58 * L).toFixed(3); pvGlow.style.transform = "scale(" + (1 + .06 * L).toFixed(3) + ")";
    }
    pvDraw(p);
  }
  // tap (or drag) on the waveform to jump to that part of the song
  (function () {
    var c = pv.cv, on = false;
    var at = function (e) { var r = c.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
    var show = function (f) { seeks.forEach(function (s) { s.value = Math.round(f * 1000); fillIn(s, f * 100); }); setTimes(f * (audio.duration || 0), f); };
    c.addEventListener("pointerdown", function (e) { on = true; pv.seekDrag = true; try { c.setPointerCapture(e.pointerId); } catch (x) {} show(at(e)); });
    c.addEventListener("pointermove", function (e) { if (on) show(at(e)); });
    var end = function (e) { if (!on) return; on = false; var f = at(e); if (audio.duration) audio.currentTime = f * audio.duration; pv.seekDrag = false; };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", function () { on = false; pv.seekDrag = false; });
  })();
  function fitTitle() {                                    // a long song name gets a little smaller (then "…")
    var t = qa("#player .fp-title")[0], sp = t && t.querySelector(".js-title"); if (!sp || !t.clientWidth) return;
    var fs = 26; t.style.fontSize = fs + "px";
    while (sp.scrollWidth > sp.clientWidth + 1 && fs > 18) { fs -= 1; t.style.fontSize = fs + "px"; }
  }
  function fitPlayer() {                                   // everything on one screen: squeeze a little on short screens
    var pl = $("player"); if (!pl.clientHeight) return;
    var over = function (q) { pl.style.setProperty("--pq", q.toFixed(3)); return pl.scrollHeight - pl.clientHeight > 0; };
    if (!over(0)) return;
    if (over(1)) return;
    var lo = 0, hi = 1;
    for (var i = 0; i < 7; i++) { var mid = (lo + hi) / 2; if (over(mid)) lo = mid; else hi = mid; }
    over(hi);
  }
  window.addEventListener("resize", function () { if (playerOpen) { fitPlayer(); pvSize(); fitTitle(); } });

  // swipe left / right on the cover: it slides out, the next (or previous) song's cover slides in, and it plays
  (function () {
    var cv = $("fpCover"), sx = 0, sy = 0, dx = 0, on = false, locked = false;
    cv.addEventListener("pointerdown", function (e) { on = true; locked = false; sx = e.clientX; sy = e.clientY; dx = 0; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
    cv.addEventListener("pointermove", function (e) {
      if (!on) return; dx = e.clientX - sx;
      if (!locked && Math.abs(e.clientY - sy) > Math.abs(dx) + 10) { on = false; cv.style.transform = ""; cv.classList.remove("drag"); return; }
      if (!locked && Math.abs(dx) > 6) { locked = true; cv.classList.add("drag"); }
      if (locked) cv.style.transform = "translateX(" + dx * .8 + "px) rotate(" + dx / 26 + "deg)";
    });
    function end() {
      if (!on) return; on = false; cv.classList.remove("drag");
      var from = cv.style.transform || "none";
      if (!(locked && Math.abs(dx) > 60)) {
        if (locked && cv.animate && !reduced) cv.animate([{ transform: from }, { transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,1.3,.4,1)" });
        cv.style.transform = ""; return;
      }
      swipeSong(dx < 0 ? 1 : -1, from);
    }
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  })();
  function swipeSong(d, from) {                            // d: 1 = next (swiped left), -1 = previous (swiped right)
    var cv = $("fpCover"), w = cv.offsetWidth * .9 + 80;
    var change = function () { swiping = true; if (songs.length < 2) restart(); else if (d > 0) nextSong(); else load(idx - 1, true, -1); swiping = false; };
    cv.style.transform = "";
    if (reduced || !cv.animate) { change(); return; }
    var out = cv.animate([{ transform: from || "none", opacity: 1 }, { transform: "translateX(" + (-d * w) + "px) rotate(" + (-d * 14) + "deg)", opacity: 0 }],
                         { duration: 230, easing: "cubic-bezier(.4,0,.8,.4)", fill: "forwards" });
    out.onfinish = function () {
      change(); out.cancel();
      cv.animate([{ transform: "translateX(" + (d * w) + "px) rotate(" + (d * 14) + "deg)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 440, easing: "cubic-bezier(.2,.9,.3,1)" });
    };
  }
  function burst(el, n, r0, r1, cls) {                     // a small burst of sparkles round el (red round the star by default)
    if (reduced || !el.animate || !visible(el)) return;
    n = n || 10; r0 = r0 || 16; r1 = r1 || 28;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i"); s.className = "burst" + (cls ? " " + cls : ""); el.appendChild(s);
      var a = i / n * Math.PI * 2 + Math.random() * .5, r = r0 + Math.random() * (r1 - r0), x = Math.cos(a) * r, y = Math.sin(a) * r;
      s.animate([{ transform: "translate(0,0) scale(.5)", opacity: 1 }, { transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(1.1)", opacity: 1, offset: .55 },
                 { transform: "translate(" + (x * 1.35).toFixed(1) + "px," + (y * 1.35).toFixed(1) + "px) scale(.3)", opacity: 0 }],
                { duration: 520 + Math.random() * 200, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = (function (n) { return function () { n.remove(); }; })(s);
    }
  }

  // the side panel's volume (drag it up / down; arrow keys too)
  qa("#fpSide .js-vvol").forEach(function (v) {
    var drag = false, at = function (e) { var r = v.getBoundingClientRect(); setVol(Math.round(Math.max(0, Math.min(1, (r.bottom - e.clientY) / r.height)) * 100)); };
    v.addEventListener("pointerdown", function (e) { drag = true; e.preventDefault(); try { v.setPointerCapture(e.pointerId); } catch (x) {} at(e); });
    v.addEventListener("pointermove", function (e) { if (drag) at(e); });
    v.addEventListener("pointerup", function () { drag = false; }); v.addEventListener("pointercancel", function () { drag = false; });
    v.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowUp" || e.key === "ArrowRight" ? 5 : e.key === "ArrowDown" || e.key === "ArrowLeft" ? -5 : 0;
      if (d) { e.preventDefault(); setVol(vol + d); }
    });
  });

  /* ---------- the ••• menu: Like · Song info · Sleep timer ---------- */
  var sleepAt = 0, sleepMin = 0, sleepTimer = 0;
  function sleepLeft() { return sleepAt ? Math.max(0, sleepAt - Date.now()) : 0; }
  function setSleep(m) {
    clearTimeout(sleepTimer); sleepAt = 0; sleepMin = 0;
    if (!m) { toast("Sleep timer off", "The music keeps playing.", { icon: "moon" }); return; }
    sleepMin = m; sleepAt = Date.now() + m * 60000; sleepTimer = setTimeout(sleepNow, m * 60000);
    toast("Sleep timer on", "The music stops in " + m + " min.", { icon: "moon", hl: m + " min" });
  }
  function sleepNow() {                                    // fade out over 8 s, pause, and put the volume back
    sleepAt = 0; sleepMin = 0;
    var t0 = Date.now();
    (function step() {
      var k = 1 - (Date.now() - t0) / 8000;
      if (k <= 0 || audio.paused) { audio.pause(); fadeK = 1; applyVolume(); toast("Good night", "The sleep timer stopped the music.", { icon: "moon" }); return; }
      fadeK = k; applyVolume(); setTimeout(step, 100);
    })();
  }
  function moreMenu(anchor) {
    var s = songs[idx] || {}, liked = !!likes[s.file], left = sleepLeft();
    var items = [{ icon: "heart", label: liked ? "Unlike this song" : "Like this song", run: toggleLike },
                 { icon: "info", label: "Song info", run: songInfo }];
    [15, 30, 60].forEach(function (m) { items.push({ icon: "moon", label: "Sleep timer: " + m + " min", check: left > 0 && sleepMin === m, run: function () { setSleep(m); } }); });
    if (left > 0) items.push({ cls: "sep", icon: "x", label: "Sleep timer off (" + Math.ceil(left / 60000) + " min left)", run: function () { setSleep(0); } });
    openMenu(anchor, items);
  }
  function songInfo() {
    var s = songs[idx] || {};
    openSheet("Song info", '<div class="facts">' + fact("music", "Title", s.title || s.file) + fact("user", "Artist", artistOf(s)) +
      fact("clock", "Length", audio.duration ? fmt(audio.duration) : "–") + fact("activity", "Tempo", +s.bpm > 30 ? Math.round(s.bpm) + " BPM" : "–") +
      fact("heart", "Liked", likes[s.file] ? "Yes" : "No") + fact("file-text", "File", String(s.file || "").split("/").pop()) + "</div>");
  }

  /* ---------- the equalizer popup (Bass · Mid · Treble) ---------- */
  var eqOpen = false;
  function eqLabel(i) { var r = qa(".js-eq")[i]; r.parentNode.querySelector("span").textContent = (eqGain[i] > 0 ? "+" : "") + eqGain[i] + " dB"; fillIn(r, (eqGain[i] + 12) / 24 * 100); }
  qa(".js-eq").forEach(function (r, i) {
    r.value = eqGain[i]; eqLabel(i);
    r.addEventListener("input", function () { mxEq(i, +r.value); eqLabel(i); });
  });
  function openEq(anchor) {
    closeMenu();
    var p = $("eqpop"), app = $("app"), ar = anchor.getBoundingClientRect(), pr = app.getBoundingClientRect();
    $("eqNote").textContent = mx.on ? "" : mxSafe() ? "It starts working as soon as a song plays." : "The equalizer works in the app (or when the page is on a web server).";
    p.style.display = "block";
    var h = p.offsetHeight, w = p.offsetWidth;
    p.style.left = Math.min(pr.width - w - 10, ar.right - pr.left + 10) + "px";
    p.style.top = Math.max(10, Math.min(pr.height - h - 10, ar.bottom - pr.top - h + 6)) + "px";
    $("menuback").style.display = "block"; void p.offsetWidth; p.classList.add("open"); eqOpen = true;
  }
  function closeEq() {
    if (!eqOpen) return;
    eqOpen = false; $("eqpop").classList.remove("open");
    setTimeout(function () { if (!eqOpen) { $("eqpop").style.display = "none"; if (!menuOpen) $("menuback").style.display = "none"; } }, 220);
  }
  $("menuback").addEventListener("click", closeEq);

  /* ---------- start up ---------- */
  var clockEl = $("clock");
  function tickClock() { var d = new Date(); clockEl.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  tickClock(); setInterval(tickClock, 20000);
  buildSocial();
  qa(".js-name").forEach(function (e) { e.textContent = C.name; });
  qa(".js-handle").forEach(function (e) { e.textContent = C.handle; });
  qa(".js-q-social").forEach(function (e) { e.textContent = "“" + C.quotes.social + "”"; });
  qa(".js-q-stats").forEach(function (e) { e.textContent = "“" + C.quotes.stats + "”"; });
  qa(".js-followers").forEach(function (e) { e.textContent = fmtNum(C.stats.followers); });
  qa(".js-following").forEach(function (e) { e.textContent = fmtNum(C.stats.following); });
  qa(".js-posts").forEach(function (e) { e.textContent = fmtNum(C.stats.posts); });
  $("pfBio").textContent = "";
  setToggle(".js-shuffle", shuffleOn); setToggle(".js-repeat", repeatOn);
  var swb = $("swBlur"), swf = $("swFx");
  setSwitch(swb, blurIsOn()); setSwitch(swf, fx.on);
  swb.addEventListener("click", function () { var on = swb.getAttribute("aria-checked") !== "true"; setBlur(on); toast(on ? "Soft blur on" : "Soft blur off", on ? "Prettier glass. Turn it off if it lags." : "Plain glass, smoothest.", { icon: "sparkles" }); });
  swf.addEventListener("click", function () {
    fx.on = swf.getAttribute("aria-checked") !== "true"; setSwitch(swf, fx.on); store.set("fx", fx.on ? "1" : "0");
    root.classList.toggle("nofx", !fx.on);                 // the gold sparkles go too (popup, Settings frame, Home frame)
    if (fx.on) fxStart(); else fxStop();
    wfUpdate();
  });
  applyTheme(root.getAttribute("data-theme"), true);
  applyStatus(); applyFlags();
  root.classList.toggle("nofx", !fx.on);
  load(idx, false);
  applyVolume(); applyBrightness();
  updateChrome();
  fitAll();
})();
</script>
</body>
