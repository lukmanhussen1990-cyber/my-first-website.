<title>Imran's page</title>

<script>
/* =====================================================================
   ✏️  CONFIG — EDIT EVERYTHING HERE
   All pictures, videos and songs live in the "assets" folder next to this file.
   (The Android app reads the app name from `name` below too.)
   ===================================================================== */
const CONFIG = {
  name: "Imran",                        // your name (typed on the Home screen, page title, app name)
  handle: "imran",                      // shown as @imran
  version: "1.9",                       // shown in Settings → About

  // ---------- your files (inside the assets folder) ----------
  avatarImage: "assets/avatar.jpg",     // your main picture (Settings card, song covers, browser tab icon)
  avatarMedia: [                        // the profile picture on Home / Profile: these show one by one, each fading in over the last
    "assets/avatar.mp4",                //   (a picture stays avatarImageSeconds, a clip plays to its end; then it starts again)
    "assets/avatar.jpg",
    "assets/avatar-crown.mp4",
    "assets/avatar-selfie.jpg",
    "assets/avatar-purple.jpg",
    "assets/avatar-painting.jpg",
    "assets/avatar-drawing.jpg",
    "assets/avatar-cooked.jpg",
  ],
  background:  "assets/background.mp4", // background video (muted, loops, slowly zooms)
  frame:       "assets/frame.png",      // the wings + crown frame around the profile clip on Home ("" = no frame, a plain glowing ring instead)
  frame2:      "assets/frame2.png",     // the wings + crown frame on the Settings card; its crown is also in the popup messages ("" = plain ring)
  frameTint:   "gold",                  // "gold" = the Home frame glows warm orange-gold (to match the logo and the name) · "" = red
  // the logo tile next to the Home frame (tap it: the logo spins, sparks fly and this popup shows) · image: "" = no tile
  badge: { image: "assets/claude-logo.png", title: "Built with Claude", text: "This app was designed and coded with Claude." },

  // ---------- music ----------
  // cover: "" = use the profile picture as the cover art · artist: "" = "Unknown Artist"
  // bpm + beat: the song's tempo and the second its first beat falls on, so the frame's glow pulses on the beat
  // party: true = "party mode" while that song plays (disco ball, laser beams, light dots, neon cards, a waveform on the music card)
  //             (leave them out for a new song: the glow then pulses at a steady pace while it plays)
  songs: [
    { title: "Jingle Bells",            artist: "",            file: "assets/jingle-bells.mp3",            cover: "", bpm: 132.00, beat: 0.410 },
    { title: "Forever Young",           artist: "Alphaville",  file: "assets/forever-young.mp3",           cover: "", bpm: 136.84, beat: 0.400 },
    { title: "Never Gonna Give You Up", artist: "Rick Astley", file: "assets/never-gonna-give-you-up.mp3", cover: "", bpm: 113.63, beat: 0.255 },
    { title: "MONTAGEM PERIGOSA (Super Slowed)", artist: "KVRXD", file: "assets/montagem-perigosa.mp3",    cover: "", bpm: 95.24, beat: 0.595 },
    { title: "Dracula",                 artist: "Tame Impala", file: "assets/dracula.mp3",                 cover: "", bpm: 114.99, beat: 0.040, party: true },
  ],
  randomFirstSong: false,               // true = start with a random song each visit

  // ---------- fonts (any name from fonts.google.com) ----------
  nameFont: "Pacifico",                 // your name on the Profile screen and the Settings card (handwritten)
  // your name on Home: Montserrat ExtraBold Italic, from assets/montserrat-800-italic.woff2 (in the app, so it also works offline)
  textFont: "Inter",                    // everything else
  quoteFont: "Courier Prime",           // the "Better Things Ahead." card (typewriter)

  // ---------- text ----------
  enterText: "Click here to see me",
  status: "online",                     // first status: "online" · "idle" · "dnd" (you can change it inside the app)
  bio: ["Hello, World!"],               // typed on the Home screen (more lines = one after another)
  profileBio: "Just a boy with big dreams, building a better tomorrow.",   // typed on the Profile screen
  quotes: { social: "Better Things Ahead.", stats: "Small steps every day lead to big results." },

  // ---------- Profile screen ----------
  stats: { followers: 248, following: 36, posts: 12 },
  about: "Hey, I'm Imran. I love music, games and making cool things. This is my little corner of the internet.",
  joined: "2026",
  interests: ["Music", "Gaming", "Coding", "Edits", "Movies"],
  weekly: [22, 38, 30, 52, 44, 66, 58],  // Weekly Activity chart: Mon … Sun

  // ---------- social links ("" = hide that one) ----------
  links: {
    discord:  "https://discord.com/users/YOUR_DISCORD_ID",
    github:   "https://github.com/YOUR_USERNAME",
    telegram: "https://t.me/YOUR_USERNAME",
    roblox:   "https://www.roblox.com/users/YOUR_ROBLOX_ID/profile",
    youtube:  "https://www.youtube.com/@YOUR_CHANNEL",
    tiktok:   "https://www.tiktok.com/@YOUR_USERNAME",
  },
  linkNotes: { discord: "Join my server", github: "View my projects", telegram: "Chat with me",
               roblox: "Play with me", youtube: "My channel", tiktok: "Shorts & more" },

  // ---------- views counter ----------
  startViews: 2300,                     // first visit shows this number, then +1 every visit

  // ---------- profile picture timing ----------
  avatarImageSeconds: 5,                // how long each picture in avatarMedia stays before the next one fades in

  // ---------- starting values ----------
  volume: 50,                           // 0 - 100
  brightness: 22,                       // 0 - 100 (lower = darker background)
  theme: "glass",                       // "glass" · "academia" · "cyber" · "midnight" · "noir"  (you can change it in Settings → Appearance)

  // ---------- smoothness ----------
  lite: "auto",                         // "auto" = light effects on phones (no live blur behind the cards) so nothing lags
                                        // true = always light · false = always full effects (prettier, but heavy for weak phones)
  adaptive: true,                       // true = if the device still can't keep up, switch off more effects by itself

  // ---------- opening intro ----------
  intro: true,                          // the cinematic opening (the logo slams in) before the "Click here" screen · false = skip it
  introSound: true,                     // boom + whoosh sounds (made by the page itself, no files); they follow the volume slider
  introImages: { scene: "assets/intro/scene.jpg", name: "assets/intro/name.png", tag: "assets/intro/badass.png" },   // the three layers of the logo
};

(function () {
  var root = document.documentElement;
  // app 1.6 runs the page from https://appassets.androidplatform.net (so Web Audio can read the music) instead of file://.
  // The first time, the app hands over what the old page had saved (views, theme, likes, …) in the address: keep it here.
  if (location.hash.indexOf("#moved=") === 0) {
    try {
      var moved = JSON.parse(decodeURIComponent(location.hash.slice(7)));
      Object.keys(moved).forEach(function (k) { if (k.indexOf("bio:") === 0 && localStorage.getItem(k) === null) localStorage.setItem(k, String(moved[k])); });
    } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  // theme (remembered from last time)
  var THEMES = ["glass", "academia", "cyber", "midnight", "noir"], t = CONFIG.theme;
  try { var saved = localStorage.getItem("bio:theme"); if (saved) t = saved; } catch (e) {}
  root.setAttribute("data-theme", THEMES.indexOf(t) > -1 ? t : "glass");

  // light mode on / off
  var lite = CONFIG.lite;
  if (lite === "auto" || lite === undefined) lite = !!(window.matchMedia && matchMedia("(hover: none), (pointer: coarse)").matches);
  if (lite) root.classList.add("lite");
  try {
    if (localStorage.getItem("bio:softblur") === "1") root.classList.add("softblur");
    if (localStorage.getItem("bio:noblur") === "1") root.classList.add("noblur");
  } catch (e) {}

  // load the Google Fonts named above
  function load(family, weights) {
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(family.trim()).replace(/%20/g, "+") +
                (weights ? ":wght@" + weights : "") + "&display=swap";
    if (weights) link.onerror = function () { link.remove(); load(family); };   // font without those weights
    document.head.appendChild(link);
  }
  load(CONFIG.nameFont);
  load(CONFIG.quoteFont);
  load(CONFIG.textFont, "400;500;600;700;800");
  root.style.setProperty("--name-font", JSON.stringify(CONFIG.nameFont));
  root.style.setProperty("--text-font", JSON.stringify(CONFIG.textFont));
  root.style.setProperty("--quote-font", JSON.stringify(CONFIG.quoteFont));
  if (CONFIG.frame) root.style.setProperty("--frame-img", "url(" + JSON.stringify(CONFIG.frame) + ")");
  else root.classList.add("noframe");
  if (CONFIG.frameTint === "gold") root.classList.add("wfgold");
  if (CONFIG.frame2) root.style.setProperty("--frame2-img", "url(" + JSON.stringify(CONFIG.frame2) + ")");
  else root.classList.add("noframe2");
  try { if (localStorage.getItem("bio:fx") === "0") root.classList.add("nofx"); } catch (e) {}   // "Floating particles" off: no sparkles either
})();
</script>

<style>
  /* =====================================================================
     DESIGN TOKENS — the five themes only change these colours
     ===================================================================== */
  :root {
    --accent: #7ba4ff; --accent2: #b383ff; --accent3: #ff7ad1;      /* the glow rings, active tab, sliders */
    --accent-rgb: 123, 164, 255; --accent2-rgb: 179, 131, 255;
    --glow: rgba(139, 124, 255, .55);
    --glass: rgba(9, 11, 18, .52);                                 /* full effects: see-through black glass, the blur shows behind it */
    --glass-lite: rgba(8, 10, 16, .76);                            /* phones: no live blur, so the glass is a little darker */
    --edge: rgba(255, 255, 255, .2);
    --tint: rgba(28, 36, 84, .28);                                 /* colour wash over the background video */
    --surface: #0a0c14; --surface-rgb: 10, 12, 20;
    --text: #f6f8ff; --text2: rgba(232, 238, 255, .7); --text3: rgba(232, 238, 255, .46);
    --good: #36e08c; --warn: #ffc83d; --bad: #ff5a5f;
    --dim: .62;                                                    /* background darkness (brightness slider) */
    --radius: 22px; --nav-h: 68px;
    color-scheme: dark;
  }
  html[data-theme="academia"] { --accent: #e5b866; --accent2: #c98a4b; --accent3: #f2d9a0; --accent-rgb: 229, 184, 102; --accent2-rgb: 201, 138, 75; --glow: rgba(229, 184, 102, .5);
    --glass: rgba(26, 17, 9, .54); --glass-lite: rgba(22, 14, 8, .8); --edge: rgba(255, 228, 180, .24); --tint: rgba(90, 52, 18, .32); --surface: #130d07; --surface-rgb: 19, 13, 7; }
  html[data-theme="cyber"] { --accent: #26f0ff; --accent2: #b24bff; --accent3: #ff2bd6; --accent-rgb: 38, 240, 255; --accent2-rgb: 178, 75, 255; --glow: rgba(60, 220, 255, .5);
    --glass: rgba(16, 8, 38, .54); --glass-lite: rgba(13, 7, 32, .82); --edge: rgba(170, 130, 255, .28); --tint: rgba(90, 10, 130, .32); --surface: #0b0620; --surface-rgb: 11, 6, 32; }
  html[data-theme="midnight"] { --accent: #8db2ff; --accent2: #5f7bff; --accent3: #c4d4ff; --accent-rgb: 141, 178, 255; --accent2-rgb: 95, 123, 255; --glow: rgba(110, 150, 255, .5);
    --glass: rgba(6, 12, 34, .54); --glass-lite: rgba(5, 10, 28, .84); --edge: rgba(150, 180, 255, .24); --tint: rgba(4, 14, 70, .4); --surface: #060a1a; --surface-rgb: 6, 10, 26; }
  html[data-theme="noir"] { --accent: #ff4a4a; --accent2: #d3173a; --accent3: #ff9a5a; --accent-rgb: 255, 74, 74; --accent2-rgb: 211, 23, 58; --glow: rgba(255, 70, 70, .5);
    --glass: rgba(30, 8, 12, .54); --glass-lite: rgba(24, 7, 10, .84); --edge: rgba(255, 140, 140, .24); --tint: rgba(110, 0, 14, .36); --surface: #14060a; --surface-rgb: 20, 6, 10; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    color: var(--text); font-family: var(--text-font), "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500; font-size: 15px; line-height: 1.35;
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  a { color: inherit; text-decoration: none; }
  input, textarea { font: inherit; color: inherit; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* icons (inline SVG sprite): line icons use the stroke, brand icons are filled */
  svg.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  svg.ic.fill, svg.ic.on-fill { fill: currentColor; }
  svg.br { fill: currentColor; stroke: none; }

  /* a thin bright frame drawn only on the edge (a gradient shows through a ring-shaped mask): used by the music card, mini player and toast */
  .frame::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: var(--frame, linear-gradient(135deg, #fff, rgba(255, 255, 255, .22) 30%, rgba(255, 255, 255, .22) 70%, #fff));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }

  /* =====================================================================
     BACKGROUND: video (slowly zooms) · dark sheet · colour wash · particles
     ===================================================================== */
  #bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; object-fit: cover; pointer-events: none;
    animation: bgZoom 32s ease-in-out infinite alternate; will-change: transform;
  }
  @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.14); } }
  #dim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none; background: #000; opacity: var(--dim); }
  #tint {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 18%, var(--tint), rgba(0, 0, 0, 0) 72%), linear-gradient(180deg, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .4));
  }
  #shade {                                                         /* every screen except Home is a bit darker, with a vignette */
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    background: radial-gradient(ellipse at 50% 36%, rgba(0, 0, 0, .3), rgba(0, 0, 0, .84));
  }
  body.sub #shade { opacity: 1; }
  #fx { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .ultra #fx { display: none; }
  .ultra #bg { animation: none; }

  /* =====================================================================
     APP SHELL (a phone-sized column: full screen on a phone; a phone-shaped frame on a computer)
     ===================================================================== */
  #app {
    position: fixed; top: 0; bottom: 0; left: 50%; z-index: 2;
    width: min(100vw, 440px); margin-left: calc(min(100vw, 440px) / -2);
    opacity: 0; transform: translateY(46px) scale(.95);
  }
  body.entered #app { opacity: 1; transform: none; transition: opacity .7s ease, transform .9s cubic-bezier(.2, 1.2, .3, 1); }
  #statusbar { display: none; }

  .screen {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(var(--nav-h) + 46px + env(safe-area-inset-bottom, 0px));
  }
  .screen::-webkit-scrollbar { display: none; }
  #s-home { display: flex; flex-direction: column; padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  #s-home > * { flex-shrink: 0; }
  .vgap { flex: 1 1 0; min-height: 0; max-height: 58px; }
  #app.mini-on .screen { padding-bottom: var(--mini-space, calc(var(--nav-h) + 160px + env(safe-area-inset-bottom, 0px))); }

  /* computer / tablet: the app sits in a phone-shaped frame (rounded corners, bright thin edge), the page around it is darker */
  @media (min-width: 600px) and (min-height: 600px) {
    #app {
      top: 14px; bottom: 14px; width: 412px; margin-left: -206px; border-radius: 46px; overflow: hidden;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .42), 0 0 0 100vmax rgba(0, 0, 0, .62), 0 0 70px 6px rgba(var(--accent-rgb), .22);
    }
    #app::after {                                                   /* the glassy rim of the frame */
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; z-index: 100; pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), inset 0 0 38px rgba(255, 255, 255, .05);
    }
    #statusbar {
      display: flex; position: absolute; top: 0; left: 0; right: 0; height: 42px; padding: 4px 28px 0 30px; z-index: 45; pointer-events: none;
      align-items: center; justify-content: space-between; font-size: 14.5px; font-weight: 600; letter-spacing: .02em;
    }
    #statusbar .r { display: flex; align-items: center; gap: 7px; }
    #statusbar svg { fill: currentColor; }
    .screen { padding-top: 58px; }
    #player { padding-top: 50px; }
    #toast { top: 62px; width: 380px; margin-left: -190px; }
  }

  /* glass: see-through black card, thin light border, a soft sheen on top. Full effects blur what is behind it;
     phones use a plain, slightly darker glass instead, because a live blur on top of a playing video makes phones lag. */
  .glass {
    position: relative; border: 1px solid var(--edge); border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .012) 42%, rgba(255, 255, 255, 0)), var(--glass);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -1px 0 rgba(255, 255, 255, .03), 0 8px 24px rgba(0, 0, 0, .32);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  }
  .lite:not(.softblur) .glass, .noblur .glass {
    background: linear-gradient(180deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .012) 42%, rgba(255, 255, 255, 0)), var(--glass-lite);
    -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 6px 18px rgba(0, 0, 0, .34);
  }
  .ultra .glass { background: var(--glass-lite) !important; box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .tile { background: rgba(255, 255, 255, .055); border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; }

  /* touch feedback: every tappable thing squeezes a little and shows a ripple */
  .rip { position: relative; overflow: hidden; transition: transform .16s cubic-bezier(.3, 1.4, .5, 1); }
  .rip:active { transform: scale(.965); }
  .press { cursor: pointer; transition: transform .16s cubic-bezier(.3, 1.4, .5, 1); }
  .press:active { transform: scale(.975); }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; background: rgba(255, 255, 255, .26); transform: scale(0); }
  .ibtn { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, .07); border: 1px solid var(--edge); }

  /* top bar of the inner screens: a plain back arrow and a title */
  .bar { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 14px; }
  .bar h2 { flex: 1; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
  .bar .sp { flex: 1; }
  .bar .ibtn { background: none; border: 0; width: 42px; height: 42px; margin-left: -10px; }
  .bar .ibtn:last-child { margin-left: 0; margin-right: -10px; }
  .bar .ibtn svg.ic { width: 25px; height: 25px; }

  /* the shared glowing ring around avatars and covers */
  .avatar { --sz: 104px; position: relative; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; cursor: pointer; }
  .ring {
    position: absolute; top: -5px; right: -5px; bottom: -5px; left: -5px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    box-shadow: 0 0 28px var(--glow); animation: spin 8s linear infinite;
  }
  .ring::after { content: ""; position: absolute; top: 3px; right: 3px; bottom: 3px; left: 3px; border-radius: 50%; background: var(--surface); }
  .lite .ring { animation: none; }                                 /* phones: the ring keeps its glow but does not turn (saves battery) */
  .ultra .ring { animation: none; box-shadow: none; }
  .avmedia { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #111; }
  .avmedia img, .avmedia video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  /* the profile pictures and clips take turns: the new one fades in over the last one */
  .avmedia img { z-index: 1; opacity: 0; transition: opacity .9s ease; }
  .avmedia img.on { opacity: 1; }
  .avmedia img.top { z-index: 2; }
  .avmedia img.now { transition: none; }
  .avmedia video { z-index: 3; opacity: 0; transition: opacity .9s ease; }
  .avmedia video.show { opacity: 1; }
  .avatar.pulse { animation: avpulse .3s ease-out; }
  @keyframes avpulse { 40% { transform: scale(.93); } }

  /* =====================================================================
     1. HOME
     ===================================================================== */
  .pill {
    display: flex; align-items: center; gap: 9px; width: max-content; max-width: 82%; margin: 2px auto 10px;
    padding: 9px 18px 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: rgba(var(--surface-rgb), .9); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); z-index: 4;
  }
  .pill .sep { color: var(--text3); }
  .pill .pt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill svg.ic { width: 18px; height: 18px; }
  .hero { display: flex; align-items: center; gap: 18px; margin: clamp(50px, 7.6vh, 64px) 2px 24px clamp(8px, 8.6vw, 36px); }
  .hero .who { position: relative; z-index: 3; }                 /* the name, status and hello sit above the wings */
  .hero .avatar { --sz: min(33vw, 134px, 15.8vh); }
  .who { min-width: 0; flex: 1; }
  .namerow { display: flex; align-items: center; gap: 8px; }
  .crown { width: 28px; height: 28px; color: var(--text); stroke-width: 1.7; filter: none; opacity: .95; }
  .status { display: inline-flex; align-items: center; gap: 9px; margin: 3px 0; padding: 5px 4px 5px 2px; font-size: 18px; font-weight: 600; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); color: var(--good); box-shadow: 0 0 12px currentColor; }
  .status .chev { width: 17px; height: 17px; color: var(--text); }
  .hello { margin-top: 4px; font-size: 18px; font-weight: 500; color: var(--text); min-height: 1.5em; overflow-wrap: anywhere; }
  .hello .c, .typed .c { animation: blink 1s steps(1) infinite; }

  .socialbar { display: flex; align-items: center; justify-content: space-around; padding: 14px 6px; margin-bottom: 12px; border-radius: 26px; z-index: 2; }
  /* round brand badges (Home bar and Social rows) */
  .sb, .stile { display: grid; place-items: center; flex: none; border-radius: 50%; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 4px 12px rgba(0, 0, 0, .38); }
  .sb { width: 52px; height: 52px; }
  .sb svg.ic { width: 25px; height: 25px; }
  .tl-discord  { background: radial-gradient(circle at 32% 24%, #8793ff, #4651c8 72%); }
  .tl-github   { background: radial-gradient(circle at 32% 24%, #1d2028, #05060a 72%); box-shadow: inset 0 0 0 1.6px rgba(255, 255, 255, .85), 0 4px 12px rgba(0, 0, 0, .38); }
  .tl-telegram { background: radial-gradient(circle at 32% 24%, #66d2ff, #1c8fd1 72%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22), 0 0 14px rgba(42, 171, 238, .4); }
  .tl-roblox   { background: radial-gradient(circle at 32% 24%, #ff6a6a, #c3151c 72%); }
  .tl-youtube  { background: radial-gradient(circle at 32% 24%, #1d2028, #05060a 72%); color: #ff1d1d; }
  .tl-tiktok   { background: radial-gradient(circle at 32% 24%, #1d2028, #05060a 72%); }
  .sb.tl-youtube svg.ic { width: 31px; height: 31px; }
  .viewpill { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 12px; padding: 11px 22px; border-radius: 999px; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  .viewpill svg.ic { width: 21px; height: 21px; }
  .viewpill .dd { width: 17px; height: 17px; color: var(--text2); transition: transform .25s; }
  .viewpill.open .dd { transform: rotate(180deg); }

  /* short screens (or tall system bars): the script raises --q from 0 to 1 until everything fits above the nav bar */
  #s-home { --q: 0; }
  #s-home .pill { margin-bottom: calc(10px - 6px * var(--q)); }
  #s-home .socialbar { padding-top: calc(14px - 5px * var(--q)); padding-bottom: calc(14px - 5px * var(--q)); margin-bottom: calc(12px - 6px * var(--q)); }
  #s-home .sb { width: calc(52px - 6px * var(--q)); height: calc(52px - 6px * var(--q)); }
  #s-home .viewpill { padding-top: calc(11px - 4px * var(--q)); padding-bottom: calc(11px - 4px * var(--q)); margin-bottom: calc(12px - 6px * var(--q)); }
  #s-home .mcard { padding-top: calc(14px - 4px * var(--q)); padding-bottom: calc(12px - 4px * var(--q)); }
  #s-home .mhead { padding-bottom: calc(12px - 6px * var(--q)); }
  #s-home .ctrls { padding-top: calc(8px - 5px * var(--q)); }
  #s-home .pbtn { width: calc(64px - 8px * var(--q)); height: calc(64px - 8px * var(--q)); }
  #s-home .cbtn { width: calc(46px - 4px * var(--q)); height: calc(46px - 4px * var(--q)); }

  /* music card */
  .mcard { padding: 14px 16px 12px; border-radius: 28px; --frame: linear-gradient(90deg, rgba(255, 255, 255, 0) 36%, rgba(var(--accent-rgb), .8) 74%, #fff 95%, rgba(255, 255, 255, .5)); }
  .mhead { display: flex; align-items: center; gap: 13px; padding: 0 0 12px; border-radius: 14px; }
  .cover-box { position: relative; flex: none; width: 50px; height: 50px; }
  .cover-box img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; background: #111; border: 1px solid rgba(255, 255, 255, .24); box-shadow: 0 4px 14px rgba(0, 0, 0, .45); }
  .cover-ring { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 15px; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
  .mtxt { flex: 1; min-width: 0; }
  .mtxt b { display: block; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtxt i { display: block; font-style: normal; font-size: 13.5px; color: var(--text2); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex: none; }
  .bars i { width: 3.5px; height: 100%; border-radius: 2px; background: linear-gradient(180deg, #fff, #c6d2ff); transform-origin: 50% 100%; transform: scaleY(.3); animation: bar .9s ease-in-out infinite alternate; animation-play-state: paused; }
  .bars i:nth-child(2) { animation-duration: .62s; animation-delay: -.2s; } .bars i:nth-child(3) { animation-duration: 1.05s; animation-delay: -.5s; } .bars i:nth-child(4) { animation-duration: .74s; animation-delay: -.35s; }
  body.playing .bars i { animation-play-state: running; }
  @keyframes bar { from { transform: scaleY(.22); } to { transform: scaleY(1); } }
  .ultra .bars i { animation: none !important; transform: scaleY(.6); }
  #mini:not(.show) .bars i { animation: none; }
  .mhead .chev { width: 20px; height: 20px; color: var(--text2); }
  .seekrow { padding: 2px 2px 0; }
  .times { display: flex; justify-content: space-between; margin-top: 2px; font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .ctrls { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 2px; }
  .cbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--text); position: relative; }
  .cbtn svg.ic { width: 23px; height: 23px; }
  .cbtn.on { color: var(--accent); }
  .cbtn.liked { color: #ff5d8f; }
  .cbtn.liked svg.ic { fill: currentColor; }
  .cbtn.pop { animation: heartpop .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes heartpop { 40% { transform: scale(1.35); } }
  .pbtn {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; position: relative; color: #fff;
    border: 1.5px solid rgba(206, 218, 255, .9);
    background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .13), rgba(0, 0, 0, .4) 72%);
    box-shadow: 0 0 24px rgba(var(--accent-rgb), .6), inset 0 0 14px rgba(var(--accent-rgb), .25);
    transition: transform .16s cubic-bezier(.3, 1.4, .5, 1);
  }
  .pbtn:active { transform: scale(.93); }
  .pbtn svg.ic { width: 26px; height: 26px; fill: currentColor; stroke-width: 1.5; }

  /* sliders */
  input[type="range"] { --p: 0%; -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 30px; background: transparent; cursor: pointer; outline: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #fff 0, rgba(var(--accent-rgb), 1) var(--p), rgba(255, 255, 255, .2) var(--p)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(var(--accent-rgb), .9); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .2); }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: #fff; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(var(--accent-rgb), .9); }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255, 255, 255, .3); }
  .lite input[type="range"]::-webkit-slider-thumb { box-shadow: 0 0 4px rgba(var(--accent-rgb), .9); }

  /* =====================================================================
     2. PROFILE
     ===================================================================== */
  .pf-top { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pf-av { --sz: 140px; margin: 10px 0 22px; }
  .pf-av::before {                                                 /* a bright arc outside the ring, top right */
    content: ""; position: absolute; top: -13px; right: -13px; bottom: -13px; left: -13px; border-radius: 50%; pointer-events: none;
    border: 2.5px solid transparent; border-top-color: rgba(var(--accent-rgb), .95); border-right-color: rgba(var(--accent-rgb), .95); transform: rotate(-12deg);
  }
  .pencil { position: absolute; right: 2px; bottom: 6px; z-index: 6; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #05060a; border: 1.5px solid rgba(255, 255, 255, .55); }
  .pencil svg.ic { width: 17px; height: 17px; }
  .pf-name { display: flex; align-items: center; gap: 8px; }
  .pf-name b { font-family: var(--name-font), cursive; font-weight: 400; font-size: 36px; line-height: 1.3; text-shadow: 0 0 6px rgba(160, 170, 255, .8), 0 0 18px rgba(var(--accent-rgb), .6); }

  .badge-st { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; font-size: 14.5px; font-weight: 600; border: 1px solid; }
  .badge-st .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pf-bio { min-height: 3.1em; max-width: 300px; margin: 18px 6px 20px; font-size: 16.5px; line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat3 { padding: 15px 6px; text-align: center; border-radius: 20px; }
  .stat3 b { display: block; font-size: 24px; font-weight: 700; }
  .stat3 span { font-size: 13.5px; color: var(--text2); }
  .list { padding: 4px 8px; }
  .row { display: flex; align-items: center; gap: 15px; width: 100%; padding: 15px 12px; border-radius: 14px; font-size: 16.5px; }
  .row + .row { box-shadow: 0 -1px 0 rgba(255, 255, 255, .09); }
  .row b { flex: 1; font-weight: 500; }
  .row .val { color: var(--text2); font-size: 14.5px; margin-right: -4px; }
  .row .chev { width: 18px; height: 18px; color: var(--text); }
  .row .lead { color: var(--text); }

  /* =====================================================================
     4. SOCIAL
     ===================================================================== */
  .srow { display: flex; align-items: center; gap: 16px; width: 100%; padding: 11px 16px 11px 12px; margin-bottom: 12px; border-radius: 22px; }
  .stile { width: 58px; height: 58px; }
  .stile svg.ic { width: 28px; height: 28px; }
  .stile.tl-youtube svg.ic { width: 34px; height: 34px; }
  .stxt { flex: 1; min-width: 0; }
  .stxt b { display: block; font-size: 17px; font-weight: 600; }
  .stxt i { display: block; font-style: normal; font-size: 13.5px; color: var(--text2); }
  .srow .chev { width: 19px; height: 19px; color: var(--text); }
  .quote { position: relative; display: flex; align-items: center; margin-top: 16px; padding: 28px 24px; min-height: 124px; border-radius: 24px; }
  .quote p { font-size: 18px; font-weight: 500; line-height: 1.5; letter-spacing: .02em; }
  .quote .crown { position: absolute; right: 18px; bottom: 14px; width: 26px; height: 26px; opacity: .9; }
  .quote.mono { padding: 26px 24px 30px 28px; }
  .quote.mono p { font-family: var(--quote-font), "Courier New", ui-monospace, monospace; font-size: 23px; font-weight: 400; line-height: 1.4; letter-spacing: .01em; max-width: 8.6em; color: #dfe6ff; text-shadow: 0 0 14px rgba(var(--accent-rgb), .35); }
  .quote.plain { padding: 24px 22px 24px 78px; }
  .quote.plain p { max-width: 13em; font-size: 17px; line-height: 1.45; letter-spacing: .01em; color: var(--text); }
  .quote.plain::before { content: ""; position: absolute; left: 14px; top: 50%; width: 58px; height: 58px; margin-top: -29px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 70%); pointer-events: none; }
  .quote .star { position: absolute; left: 27px; top: 50%; margin-top: -16px; width: 32px; height: 32px; color: #fff; }

  /* =====================================================================
     5. STATS
     ===================================================================== */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sbox { display: block; width: 100%; padding: 18px 16px; border-radius: 22px; }
  .sbox svg.ic { width: 25px; height: 25px; color: var(--text); margin-bottom: 14px; }
  .sbox b { display: block; font-size: 31px; font-weight: 700; line-height: 1.1; }
  .sbox span { font-size: 14.5px; color: var(--text2); }
  .chart { margin-top: 12px; padding: 16px 16px 10px; border-radius: 24px; }
  .chart-h { display: flex; align-items: center; justify-content: space-between; font-size: 16.5px; font-weight: 600; margin-bottom: 4px; }
  .chart-h .chev { width: 18px; height: 18px; color: var(--text); }
  #wk { position: relative; touch-action: pan-y; }
  #wk svg { display: block; width: 100%; height: auto; overflow: visible; }
  #wk .grid { stroke: rgba(255, 255, 255, .08); stroke-width: 1; }
  #wk .tick { fill: var(--text3); font-size: 11px; }
  #wk .day { fill: var(--text2); font-size: 11.5px; }
  #wk .lineglow { fill: none; stroke: rgba(var(--accent-rgb), .7); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .28; }
  #wk .line { fill: none; stroke: #f3f6ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #wk .area { fill: #fff; opacity: .07; }
  #wk .dot { fill: #fff; stroke: var(--surface); stroke-width: 2; }
  #wk .dot.hot { fill: #fff; stroke: var(--accent); }
  #wk .cross { stroke: rgba(255, 255, 255, .3); stroke-width: 1; opacity: 0; }
  #wk .lbl { fill: var(--text); font-size: 12px; font-weight: 700; }
  #wk .hit { fill: transparent; }
  #tip { position: absolute; z-index: 3; top: 0; left: 0; padding: 7px 11px; border-radius: 12px; font-size: 12.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s;
         background: rgba(var(--surface-rgb), .98); border: 1px solid var(--edge); }
  #tip b { display: block; font-size: 15px; font-weight: 700; color: var(--text); }
  #tip span { color: var(--text2); }
  .ultra #wk .line, .ultra #wk .lineglow { stroke-dasharray: none !important; }
  .ultra #wk .lineglow { display: none; }

  /* =====================================================================
     6. THEMES
     ===================================================================== */
  .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tcard { position: relative; display: block; width: 100%; height: 156px; padding: 0; border-radius: 22px; overflow: hidden; border: 1.5px solid var(--edge); background: #0a0c16; }
  .tcard > svg.art, .tcard > img.art { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tcard .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; font-size: 14.5px; font-weight: 600; background: linear-gradient(0deg, rgba(0, 0, 0, .8), rgba(0, 0, 0, 0)); }
  .tcard .ck { position: absolute; top: 10px; right: 10px; width: 27px; height: 27px; border-radius: 50%; display: none; place-items: center; background: #fff; color: #1a2a6c; box-shadow: 0 0 14px rgba(255, 255, 255, .5); }
  .tcard .ck svg.ic { width: 16px; height: 16px; stroke-width: 3; }
  .tcard.sel { border-color: #fff; box-shadow: 0 0 0 1px rgba(255, 255, 255, .7), 0 0 22px rgba(255, 255, 255, .26), 0 0 26px var(--glow); }
  .tcard.sel .ck { display: grid; }
  .tcard.custom { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-style: solid; background: rgba(255, 255, 255, .035); color: var(--text2); }
  .tcard.custom svg.ic { width: 30px; height: 30px; }
  .tcard.custom small { font-size: 12.5px; color: var(--text3); }

  /* =====================================================================
     7. SETTINGS
     ===================================================================== */
  .setprof { display: flex; align-items: center; gap: 15px; width: 100%; padding: 14px 16px; margin-bottom: 14px; border-radius: 24px; }
  .setprof .ring { top: -3px; right: -3px; bottom: -3px; left: -3px; animation: none; box-shadow: 0 0 14px var(--glow); }
  .setprof .ring::after { top: 2px; right: 2px; bottom: 2px; left: 2px; }
  .setprof img.sav { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .setprof .chev { width: 19px; height: 19px; color: var(--text); }
  .grp { margin-bottom: 14px; }
  .ctl { display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .ctl + .ctl { box-shadow: 0 -1px 0 rgba(255, 255, 255, .09); }
  .ctl .lead { color: var(--text); }
  .ctl .grow { flex: 1; min-width: 0; }
  .ctl .grow b { display: block; font-weight: 500; font-size: 16px; }
  .ctl .grow small { display: block; color: var(--text3); font-size: 12.5px; margin-top: 1px; }
  .ctl .num { width: 36px; text-align: right; font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .ctl > b { flex: 1; font-weight: 500; font-size: 16px; }
  .sw { position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid var(--edge); transition: background .25s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: transform .28s cubic-bezier(.3, 1.4, .5, 1); }
  .sw[aria-checked="true"] { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); }
  .logout { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 18px; padding: 15px; border-radius: 20px; font-size: 16.5px; font-weight: 600; color: #ff7c82; border: 1px solid rgba(255, 90, 95, .6); background: linear-gradient(180deg, rgba(255, 60, 70, .14), rgba(255, 60, 70, .07)); }

  /* =====================================================================
     SETTINGS PROFILE CARD: the picture inside the second wings + crown frame (assets/frame2.png, 1254 x 1254).
     The frame's empty middle is a very slightly wide ellipse (half-axes 336.47 x 332.11 px, centre 626.88 / 704.49), so the
     picture is drawn 1.3 % narrower than tall (--fx / --fy) and the ellipse becomes exactly the round picture: no gap, no overlap.
     Layers (back → front): wings · picture · ring + swirls · ring glow · light line · crown (+ shine) · sparkles
     ===================================================================== */
  .setprof { min-height: 138px; padding: 10px 16px 10px 10px; border-radius: 26px; gap: 10px; overflow: visible;
    border: 1.5px solid rgba(255, 64, 48, .85); }
  .setprof.glass, .lite .setprof.glass, .noblur .setprof.glass {         /* (stronger than the phone glass rule, so phones get the glow too) */
    box-shadow: 0 0 0 1px rgba(120, 0, 0, .5), 0 0 14px 2px rgba(255, 36, 26, .45), 0 0 34px 6px rgba(255, 20, 0, .18), inset 0 0 16px rgba(255, 40, 30, .22), inset 0 1px 0 rgba(255, 220, 150, .25); }
  .setprof::before {                                                /* gold light line inside the red border, brightest on top */
    content: ""; position: absolute; top: 3px; right: 3px; bottom: 3px; left: 3px; border-radius: 23px; padding: 1.2px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 228, 150, .8), rgba(255, 190, 90, .16) 30%, rgba(255, 170, 70, 0) 55%), linear-gradient(-12deg, rgba(255, 200, 110, .5), rgba(255, 170, 70, 0) 30%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .setprof::after {                                                 /* the red glow breathes slowly; a bright flash when tapped */
    content: ""; position: absolute; top: -1.5px; right: -1.5px; bottom: -1.5px; left: -1.5px; border-radius: 26px; pointer-events: none;
    box-shadow: 0 0 10px 2px rgba(255, 50, 30, .6), 0 0 26px 6px rgba(255, 30, 0, .28); opacity: .4; animation: cardGlow 2.8s ease-in-out infinite alternate; }
  @keyframes cardGlow { to { opacity: 1; } }
  .setprof.tapfx { animation: cardTap .42s cubic-bezier(.3, 1.5, .5, 1); }
  .setprof.tapfx::after { animation: cardFlash .5s ease-out; }
  .setprof .flash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 160% at 22% 50%, rgba(255, 210, 140, .5), rgba(255, 60, 30, .25) 45%, rgba(255, 40, 20, 0) 75%); }
  .setprof.tapfx .flash { animation: flashIn .5s ease-out; }
  @keyframes cardTap { 0% { transform: scale(.97); } 45% { transform: scale(1.035); } 100% { transform: none; } }
  @keyframes cardFlash { 0% { opacity: 1; box-shadow: 0 0 18px 5px rgba(255, 120, 60, .95), 0 0 46px 12px rgba(255, 40, 0, .55); } 100% { opacity: .6; } }
  @keyframes flashIn { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  .setprof .avatar { --sz: 72px; --fx: calc(var(--sz) / 672.94); --fy: calc(var(--sz) / 664.22); margin: 34px 30px 10px 31px; isolation: isolate; }
  .setprof .avatar > .ring { display: none; }
  .noframe2 .setprof .avatar > .ring { display: block; }
  .noframe2 .wf2 { display: none; }
  .noframe2 .setprof .avatar { margin: 6px 6px 6px 8px; }
  .setprof img.sav { z-index: 3; top: -1px; left: -1px; width: calc(100% + 2px); height: calc(100% + 2px); }    /* tucked 1 px under the ring */
  .wf2 { position: absolute; left: calc(var(--sz) / 2 - 626.88 * var(--fx)); top: calc(var(--sz) / 2 - 704.49 * var(--fy));
         width: calc(1254 * var(--fx)); height: calc(1254 * var(--fy)); pointer-events: none; }
  .wf2 > *, .wf2-shine, .wf2-shine-in { position: absolute; pointer-events: none; }
  .wf2-lay { background-image: var(--frame2-img); background-repeat: no-repeat; background-size: calc(1254 * var(--fx)) calc(1254 * var(--fy)); }
  .wf2-wl, .wf2-wr { z-index: 2; }
  .wf2-wl { left: calc(0 * var(--fx)); top: calc(0 * var(--fy)); width: calc(370 * var(--fx)); height: calc(735 * var(--fy)); background-position: calc(0 * var(--fx)) calc(0 * var(--fy));
    clip-path: polygon(0.00% 0.00%, 0.00% 100.00%, 69.84% 100.00%, 69.40% 95.33%, 70.18% 89.13%, 72.54% 83.04%, 75.31% 78.58%, 80.30% 72.89%, 84.97% 68.84%, 92.35% 63.82%, 100.00% 59.75%, 100.00% 53.45%, 98.92% 53.88%, 98.92% 4.06%, 100.00% 4.06%, 100.00% 0.00%);
    -webkit-mask-image: radial-gradient(circle at calc(626.88 * var(--fx)) calc(704.49 * var(--fy)), transparent calc(var(--sz) * .56), #000 calc(var(--sz) * .61));
    mask-image: radial-gradient(circle at calc(626.88 * var(--fx)) calc(704.49 * var(--fy)), transparent calc(var(--sz) * .56), #000 calc(var(--sz) * .61));
    transform-origin: calc(300 * var(--fx)) calc(560 * var(--fy)); animation: flap2L 3s ease-in-out infinite; }
  .wf2-wr { left: calc(883 * var(--fx)); top: calc(0 * var(--fy)); width: calc(371 * var(--fx)); height: calc(735 * var(--fy)); background-position: calc(-883 * var(--fx)) calc(0 * var(--fy));
    clip-path: polygon(100.00% 0.00%, 0.20% 0.00%, 0.20% 4.06%, 1.28% 4.06%, 1.28% 53.88%, 0.20% 53.45%, 0.20% 59.75%, 7.83% 63.82%, 15.20% 68.84%, 19.85% 72.89%, 24.83% 78.58%, 27.59% 83.04%, 29.94% 89.13%, 30.73% 95.33%, 30.28% 100.00%, 100.00% 100.00%);
    -webkit-mask-image: radial-gradient(circle at calc(-256.12 * var(--fx)) calc(704.49 * var(--fy)), transparent calc(var(--sz) * .56), #000 calc(var(--sz) * .61));
    mask-image: radial-gradient(circle at calc(-256.12 * var(--fx)) calc(704.49 * var(--fy)), transparent calc(var(--sz) * .56), #000 calc(var(--sz) * .61));
    transform-origin: calc(70.76 * var(--fx)) calc(560 * var(--fy)); animation: flap2R 3s ease-in-out infinite; }
  @keyframes flap2L { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }     /* 6 degrees, mirrored */
  @keyframes flap2R { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  .wf2-ring { z-index: 4; left: calc(0 * var(--fx)); top: calc(304 * var(--fy)); width: calc(1254 * var(--fx)); height: calc(950 * var(--fy)); background-position: calc(0 * var(--fx)) calc(-304 * var(--fy));
    clip-path: polygon(82.26% 39.51%, 81.75% 34.26%, 80.74% 29.14%, 79.25% 24.22%, 77.29% 19.58%, 74.90% 15.31%, 72.12% 11.45%, 70.71% 9.83%, 68.79% 7.89%, 65.51% 5.20%, 62.09% 3.10%, 60.06% 2.13%, 58.01% 1.35%, 55.95% 0.75%, 53.88% 0.34%, 51.80% 0.10%, 49.71% 0.04%, 46.10% 0.34%, 44.03% 0.75%, 41.97% 1.35%, 39.92% 2.13%, 37.89% 3.10%, 34.47% 5.20%, 32.51% 6.73%, 30.40% 8.65%, 28.61% 10.56%, 27.13% 12.37%, 25.74% 14.30%, 23.83% 17.40%, 21.66% 21.86%, 19.93% 26.65%, 18.94% 30.40%, 18.44% 32.97%, 17.80% 38.19%, 17.67% 40.83%, 17.72% 44.74%, 0.00% 44.74%, 0.00% 100.00%, 100.00% 100.00%, 100.00% 44.74%, 82.26% 44.74%); }
  /* the red / gold glow around the ring pulses slowly */
  .wf2-halo { z-index: 5; left: calc(626.88 * var(--fx) - var(--sz) * .78); top: calc(704.49 * var(--fy) - var(--sz) * .78); width: calc(var(--sz) * 1.56); height: calc(var(--sz) * 1.56); border-radius: 50%;
    background: radial-gradient(circle closest-side, rgba(255, 220, 150, 0) 72%, rgba(255, 226, 160, .42) 77%, rgba(255, 170, 70, .34) 81%, rgba(255, 60, 30, .36) 86%, rgba(255, 40, 20, .14) 93%, rgba(255, 40, 20, 0) 100%);
    animation: halo2 2.8s ease-in-out infinite; }
  @keyframes halo2 { 0%, 100% { opacity: .45; transform: scale(.985); } 50% { opacity: 1; transform: scale(1.025); } }
  /* a thin light line runs round the ring (on its black band) */
  .wf2-spin { z-index: 5; left: calc(626.88 * var(--fx) - var(--sz) * .58); top: calc(704.49 * var(--fy) - var(--sz) * .58); width: calc(var(--sz) * 1.16); height: calc(var(--sz) * 1.16); border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 240, 200, 0) 0deg, rgba(255, 240, 200, 0) 230deg, rgba(255, 210, 140, .8) 320deg, #fff 352deg, rgba(255, 255, 255, 0) 357deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 90.5%, #000 92.5%, #000 95.5%, transparent 97.5%);
    mask-image: radial-gradient(circle closest-side, transparent 90.5%, #000 92.5%, #000 95.5%, transparent 97.5%);
    animation: spin 5.5s linear infinite; }
  /* the crown floats a few pixels; a shine sweeps across it every 4 s */
  .wf2-crown { z-index: 6; left: calc(366 * var(--fx)); top: calc(30 * var(--fy)); width: calc(522 * var(--fx)); height: calc(369 * var(--fy)); background-position: calc(-366 * var(--fx)) calc(-30 * var(--fy));
    clip-path: polygon(0.00% 99.77%, 5.13% 94.24%, 10.25% 89.59%, 15.38% 85.69%, 23.07% 81.05%, 28.19% 78.69%, 35.88% 76.14%, 41.01% 75.06%, 48.70% 74.35%, 56.38% 74.70%, 64.07% 76.14%, 71.76% 78.69%, 76.89% 81.05%, 84.58% 85.69%, 89.70% 89.59%, 94.83% 94.24%, 99.95% 99.77%, 99.95% 0.00%, 0.00% 0.00%);
    animation: crown2 3.4s ease-in-out infinite; }
  @keyframes crown2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
  .wf2-shine { left: 0; top: 0; width: 34%; height: 100%; overflow: hidden; transform: translateX(-100%);
    -webkit-mask-image: linear-gradient(100deg, transparent 6%, #000 40%, #000 60%, transparent 94%); mask-image: linear-gradient(100deg, transparent 6%, #000 40%, #000 60%, transparent 94%);
    animation: shineWin 4s ease-in-out infinite; }
  .wf2-shine-in { left: 0; top: 0; width: calc(522 * var(--fx)); height: calc(369 * var(--fy)); background-position: calc(-366 * var(--fx)) calc(-30 * var(--fy));
    filter: brightness(1.75) saturate(1.15); transform: translateX(34%); animation: shineIn2 4s ease-in-out infinite; }
  @keyframes shineIn2 { 0%, 52% { transform: translateX(34%); } 84%, 100% { transform: translateX(-98.6%); } }
  /* gold sparkles twinkle around the frame (placed at random spots by the script) */
  .wf2-sp { z-index: 7; left: 0; top: 0; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; opacity: 0;
    background: radial-gradient(circle, rgba(255, 240, 190, .95) 0, rgba(255, 196, 90, .5) 24%, rgba(255, 150, 40, 0) 60%);
    animation: tw4 var(--d, 8s) var(--dl, 0s) linear infinite; }
  .wf2-sp::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fffbea;
    clip-path: polygon(50% 0, 56.5% 43.5%, 100% 50%, 56.5% 56.5%, 50% 100%, 43.5% 56.5%, 0 50%, 43.5% 43.5%); }
  .nofx .wf2-sp { display: none; }
  .app-bg .wf2 *, .app-bg .setprof, .app-bg .setprof::after { animation-play-state: paused !important; }
  .ultra .wf2-spin, .ultra .wf2-shine, .ultra .wf2-sp { display: none; }
  .ultra .wf2 *, .ultra .setprof::after { animation: none !important; }

  .sp-txt { flex: 1; min-width: 0; text-align: left; }
  .setprof .sp-txt b { display: flex; align-items: center; gap: 7px; font-size: 21px; font-weight: 800; line-height: 1.2; }
  .setprof .sp-txt b .crown { width: 19px; height: 19px; color: #ffd36a; stroke-width: 2; filter: drop-shadow(0 0 4px rgba(255, 170, 60, .6)); }
  .setprof .sp-txt i { display: block; font-style: normal; color: var(--text2); font-size: 14.5px; margin-top: 1px; }
  /* the blue verified tick next to the name: a crisp vector seal that turns slowly, a shine across it now and then, a soft blue glow */
  .vtick { position: relative; display: block; flex: none; width: 21px; height: 21px; margin: 0 -1px 0 -2px; }
  .vtick svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 4px rgba(0, 163, 238, .55)); }
  .vt-seal { fill: #00a3ee; transform-origin: 50px 50px; animation: vtSpin 14s linear infinite; }
  .vt-ck { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: square; stroke-linejoin: miter; }
  .vt-shine { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .vt-shine::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; transform: translateX(-130%) skewX(-18deg);
                     background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); animation: vtShine 4.5s ease-in-out infinite 1s; }
  @keyframes vtSpin { to { transform: rotate(360deg); } }
  @keyframes vtShine { 0%, 70% { transform: translateX(-130%) skewX(-18deg); } 92%, 100% { transform: translateX(330%) skewX(-18deg); } }
  .setprof:active .vtick, .setprof.tap .vtick { animation: vtPop .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes vtPop { 40% { transform: scale(1.3); } }
  .app-bg .vtick *, .app-bg .vt-shine::after { animation-play-state: paused !important; }
  .ultra .vt-seal, .ultra .vt-shine::after { animation: none !important; }
  .sp-st { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 13.5px; font-weight: 600; }
  .sp-st .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); color: var(--good); box-shadow: 0 0 8px currentColor; flex: none; }

  /* =====================================================================
     3. FULL-SCREEN MUSIC PLAYER ("Now Playing"): always red, like the reference.
     Dark red smoke · spinning cover inside a segmented progress ring (white dot = how far the song is) and a thick glowing
     red ring · a glass side panel (mute, volume, •••, equalizer) · title + red star · progress · controls · waveform · volume.
     --cs is the size of the cover; --pq (0 … 1) squeezes everything a little on short screens (set by the script).
     Only transform / opacity are animated, and only while the player is open (the waveform is one canvas).
     ===================================================================== */
  #player {
    --pq: 0; --cs: calc(min(48vw, 27vh, 230px) * (1 - .2 * var(--pq))); --box: calc(var(--cs) * 1.3);
    --red: #ff2d55; --red2: #ff1f3d; --redglow: rgba(255, 30, 60, .55);
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; overflow: hidden;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 16px calc(8px + env(safe-area-inset-bottom, 0px));
    background: #0b0103; color: #fff;
    visibility: hidden; opacity: 0; transform: translateY(100%);
    transition: transform .52s cubic-bezier(.2, .8, .2, 1), opacity .4s ease, visibility 0s .52s; touch-action: manipulation;
  }
  #player.open { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
  #screens, #tabs { transition: opacity .3s ease .2s; }
  #app.pl-open #screens, #app.pl-open #tabs { opacity: 0; }                       /* hidden under the player once it has slid up (no ghosting) */

  /* dark red smoke with soft blurred red glows (big soft gradients drifting slowly, no picture behind) */
  .fp-bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: radial-gradient(120% 75% at 50% 30%, #26050d 0%, #140307 42%, #090103 100%); }
  .fp-bg i { position: absolute; border-radius: 50%; }
  .fp-bg .s1 { width: 125%; height: 62%; left: -38%; top: 2%; background: radial-gradient(closest-side, rgba(200, 16, 42, .27), rgba(200, 16, 42, 0)); }
  .fp-bg .s2 { width: 115%; height: 58%; right: -42%; top: 36%; background: radial-gradient(closest-side, rgba(150, 10, 30, .26), rgba(150, 10, 30, 0)); }
  .fp-bg .s3 { width: 90%; height: 40%; left: -20%; bottom: -8%; background: radial-gradient(closest-side, rgba(120, 6, 24, .4), rgba(120, 6, 24, 0)); }
  .fp-bg::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(ellipse 85% 70% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55)); }
  #player.open .fp-bg .s1 { animation: smoke1 21s ease-in-out infinite alternate; }
  #player.open .fp-bg .s2 { animation: smoke2 25s ease-in-out infinite alternate; }
  @keyframes smoke1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(16%, 7%) scale(1.18); } }
  @keyframes smoke2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-14%, -6%) scale(.92); } }
  #player > *:not(.fp-bg) { position: relative; z-index: 1; }

  /* top bar */
  .fp-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 46px; flex: none; }
  .fp-bar h2 { font-size: 18.5px; font-weight: 700; letter-spacing: .005em; }
  .fp-bar h2 em { font-style: normal; color: var(--red); text-shadow: 0 0 12px rgba(255, 45, 85, .45); }
  .fp-bar .ibtn { background: none; border: 0; width: 44px; height: 44px; }
  .fp-bar .ibtn svg.ic { width: 26px; height: 26px; }

  /* the middle: cover + side panel + title + progress (the side panel floats on the left, nothing goes under it) */
  .fp-main { width: 100%; display: flex; flex-direction: column; align-items: center; flex: none; margin-top: auto; padding-top: calc(8px - 6px * var(--pq)); }
  .fp-cover { position: relative; width: var(--box); height: var(--box); flex: none; touch-action: pan-y; cursor: grab; }
  .fp-cover > * { position: absolute; pointer-events: none; }
  .fp-glow { top: -22%; right: -22%; bottom: -22%; left: -22%; border-radius: 50%; opacity: .55; will-change: transform, opacity;
    background: radial-gradient(closest-side, rgba(255, 20, 50, 0) 60%, rgba(255, 24, 56, .5) 70%, rgba(255, 12, 44, .2) 84%, rgba(255, 0, 32, 0) 100%); }
  .fp-outer { top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%; border: calc(var(--cs) * .042) solid var(--red2);
    box-shadow: 0 0 12px 2px rgba(255, 26, 56, .8), 0 0 30px 6px rgba(255, 10, 40, .35), inset 0 0 10px 2px rgba(255, 40, 72, .7), inset 0 0 0 1.5px rgba(255, 160, 172, .55); }
  .fp-outer::before { content: ""; position: absolute; top: -3px; right: -3px; bottom: -3px; left: -3px; border-radius: 50%; border: 1.5px solid rgba(255, 150, 165, .5); }
  .fp-prog { top: calc(50% - var(--cs) * .556); left: calc(50% - var(--cs) * .556); width: calc(var(--cs) * 1.112); height: calc(var(--cs) * 1.112); overflow: visible; }
  .fp-prog .trk { fill: none; stroke: rgba(255, 236, 240, .62); stroke-width: 1.6; }
  .fp-prog .done { fill: none; stroke: url(#fpPink); stroke-width: 3.2; stroke-linecap: round; }
  .fp-prog .halo { fill: none; stroke: rgba(255, 45, 85, .28); stroke-width: 7; stroke-linecap: round; }
  .fp-dotw { top: calc(50% - var(--cs) * .556); left: calc(50% - var(--cs) * .556); width: calc(var(--cs) * 1.112); height: calc(var(--cs) * 1.112); will-change: transform; }
  .fp-dotw i { position: absolute; left: 50%; top: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 2px rgba(255, 255, 255, .85), 0 0 14px 5px rgba(255, 45, 85, .6); }
  .fp-disc { top: calc(50% - var(--cs) / 2); left: calc(50% - var(--cs) / 2); width: var(--cs); height: var(--cs); border-radius: 50%; overflow: hidden; background: #140306; will-change: transform;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 6px 22px rgba(0, 0, 0, .6); }
  .fp-disc img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .fp-cover .cover-ring { top: calc(50% - var(--cs) / 2); left: calc(50% - var(--cs) / 2); width: var(--cs); height: var(--cs); border-radius: 50%; border-color: var(--red); }

  /* the side panel: dark glass pill with a thin glowing red border; slides in from the left when the player opens */
  .fp-side {
    position: absolute; left: -6px; top: calc(var(--box) * .4); width: 46px; height: calc(176px - 22px * var(--pq)); z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0;
    border-radius: 23px; background: linear-gradient(180deg, rgba(46, 8, 14, .8), rgba(20, 3, 7, .88)); border: 1px solid rgba(255, 70, 92, .6);
    box-shadow: 0 0 12px rgba(255, 30, 60, .4), inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 0 12px rgba(255, 40, 70, .14);
    transform: translateX(-170%); opacity: 0; transition: transform .55s cubic-bezier(.2, 1.15, .3, 1), opacity .3s;
  }
  #player.open .fp-side { transform: none; opacity: 1; transition-delay: .22s, .22s; }
  .fp-side.flash { box-shadow: 0 0 16px 3px rgba(255, 40, 70, .75), inset 0 0 14px rgba(255, 60, 90, .3); }
  .fps-ic { width: 36px; height: 34px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; position: relative; }
  .fps-ic svg.ic { width: 21px; height: 21px; }
  .fps-dots { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; border: 1.5px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .05); font-size: 15px; letter-spacing: 1px; line-height: 1; }
  /* a thin vertical volume slider (red fill from the bottom) */
  .vsl { position: relative; flex: 1; min-height: 46px; width: 30px; margin: 6px 0; cursor: pointer; touch-action: none; outline: none; }
  .vsl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; border-radius: 3px; background: rgba(255, 255, 255, .2); }
  .vsl i { position: absolute; left: 50%; bottom: 0; width: 4px; height: 100%; margin-left: -2px; border-radius: 3px; transform-origin: 50% 100%; transform: scaleY(var(--v, .5));
    background: linear-gradient(0deg, #ff1f3d, #ff5d7e); box-shadow: 0 0 8px rgba(255, 40, 70, .8); }
  .vsl:focus-visible::before { box-shadow: 0 0 0 3px rgba(255, 255, 255, .25); }

  /* title + red star (like), artist */
  .fp-info { width: 100%; padding: 0 56px; margin-top: calc(14px - 6px * var(--pq)); text-align: center; flex: none; }
  .fp-title { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; font-size: 26px; font-weight: 800; line-height: 1.2; }
  .fp-title .js-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fp-star { position: relative; flex: none; width: 32px; height: 32px; margin-right: -6px; display: grid; place-items: center; color: var(--red); }
  .fp-star svg.ic { width: 23px; height: 23px; stroke-width: 2; }
  .fp-star.liked svg.ic { fill: currentColor; filter: drop-shadow(0 0 6px rgba(255, 40, 80, .75)); }
  .fp-star.pop svg.ic { animation: heartpop .45s cubic-bezier(.3, 1.6, .5, 1); }
  .fp-artist { margin-top: 3px; color: rgba(255, 236, 240, .68); font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .burst { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0 25%, #ff3d63 45%, rgba(255, 40, 80, 0) 72%); }

  /* progress bar: thin, white → red fill, white knob, times under it */
  .fp-seek { width: 100%; padding: 0 50px; margin-top: calc(12px - 6px * var(--pq)); flex: none; }
  #player input[type="range"] { height: 26px; }
  #player input[type="range"]::-webkit-slider-runnable-track { height: 3.5px; border-radius: 3px; background: linear-gradient(90deg, #fff 0, var(--red) var(--p), rgba(255, 255, 255, .17) var(--p)); }
  #player input[type="range"]::-webkit-slider-thumb { width: 15px; height: 15px; margin-top: -5.75px; background: #fff; box-shadow: 0 0 0 3px rgba(255, 45, 85, .25), 0 0 10px 2px rgba(255, 60, 95, .75); }
  #player input[type="range"]::-moz-range-progress { background: linear-gradient(90deg, #fff, var(--red)); }
  .fp-seek .times { margin-top: 0; color: rgba(255, 236, 240, .62); font-size: 12.5px; }

  /* controls: shuffle · previous · play / pause (dark circle, glowing red ring) · next · repeat (red when on) */
  .fp-ctrls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 330px; padding: calc(12px - 8px * var(--pq)) 4px 0; margin-top: auto; flex: none; }
  .fp-ctrls .cbtn { width: 48px; height: 48px; color: #fff; }
  .fp-ctrls .cbtn svg.ic { width: 25px; height: 25px; }
  .fp-ctrls .cbtn.on { color: var(--red); }
  .fp-ctrls .cbtn.on svg.ic { filter: drop-shadow(0 0 6px rgba(255, 45, 85, .7)); }
  #player .pbtn { width: calc(70px - 8px * var(--pq)); height: calc(70px - 8px * var(--pq)); color: #fff; border: 2.5px solid var(--red2);
    background: radial-gradient(circle at 50% 38%, #2c0a10, #0e0205 72%);
    box-shadow: 0 0 14px 3px rgba(255, 30, 60, .6), inset 0 0 12px rgba(255, 40, 72, .45), inset 0 0 0 1px rgba(255, 150, 165, .35); }
  #player .pbtn svg.ic { width: 30px; height: 30px; }
  #player .pbtn::after { content: ""; position: absolute; top: -7px; right: -7px; bottom: -7px; left: -7px; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 22px 7px rgba(255, 30, 60, .55); opacity: 0; }
  body.playing #player.open .pbtn::after { animation: pbPulse 1.9s ease-in-out infinite; }
  @keyframes pbPulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* waveform: one canvas (bars move with the music, the played part is red, a faded mirror under it); tap it to jump */

  /* the equalizer: a small glass popup with three sliders */

    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 55%), rgba(24, 4, 9, .97); border: 1px solid rgba(255, 70, 92, .55);
    box-shadow: 0 0 16px rgba(255, 30, 60, .35), 0 14px 40px rgba(0, 0, 0, .6);

  /* the phone's volume buttons: a small red panel shows the new volume (instead of the phone's own pop-up) */

  /* =====================================================================
     SHEET · MENU · TOAST
     ===================================================================== */
  #sheetwrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: none; }
  #sheetback { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, .58); opacity: 0; transition: opacity .3s; }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%; display: flex; flex-direction: column; border-radius: 30px 30px 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 30%), rgba(var(--surface-rgb), .985); border: 1px solid var(--edge); border-bottom: 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .9, .25, 1);
  }
  #sheetwrap.open #sheetback { opacity: 1; } #sheetwrap.open #sheet { transform: none; }
  .grab { width: 42px; height: 5px; margin: 10px auto 4px; border-radius: 3px; background: rgba(255, 255, 255, .25); flex: none; }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 10px; }

  .facts { margin-top: 14px; } .fact { display: flex; align-items: center; gap: 14px; padding: 12px 0; } .fact + .fact { box-shadow: 0 -1px 0 rgba(255, 255, 255, .09); }
  .fact .lead { color: var(--accent); } .fact b { flex: 1; font-weight: 500; color: var(--text2); } .fact span { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .chip { padding: 10px 17px; border-radius: 999px; font-size: 15px; font-weight: 600; background: rgba(255, 255, 255, .07); border: 1px solid var(--edge); }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bdg { padding: 16px 12px; text-align: center; border-radius: 18px; }
