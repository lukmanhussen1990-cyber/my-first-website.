<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Imran's page</title>

<script>
/* =====================================================================
   ✏️  CONFIG — EDIT EVERYTHING HERE
   Put all your files in the SAME folder as this index.html
   (the Android app reads the app name from `name` below too).
   ===================================================================== */
const CONFIG = {
  name: "Imran",                        // your name (card, page title, app name)

  // ---------- your files ----------
  avatarImage: "avatar.jpg",            // profile picture
  avatarVideo: "avatar.mp4",            // profile video (plays muted, takes turns with the picture)
  background:  "background.mp4",        // background video (muted, loops, fills the screen)

  // ---------- music (⏮ / ⏭ switch between these) ----------
  // cover: "" = use avatarImage as the cover art
  songs: [
    { title: "Jingle Bells",            artist: "",            file: "jingle-bells.mp3",            cover: "" },
    { title: "Forever Young",           artist: "Alphaville",  file: "forever-young.mp3",           cover: "" },
    { title: "Never Gonna Give You Up", artist: "Rick Astley", file: "never-gonna-give-you-up.mp3", cover: "" },
    { title: "MONTAGEM PERIGOSA (Super Slowed)", artist: "KVRXD", file: "montagem-perigosa.mp3",  cover: "" },
  ],
  loopSameSong: false,                  // true = repeat the same song, false = play the next one (and loop the list)
  randomFirstSong: false,               // true = start with a random song each visit

  // ---------- fonts (any name from fonts.google.com, e.g. "Cherry Bomb One", "Sniglet", "Comfortaa") ----------
  nameFont: "Pacifico",                 // your name
  textFont: "Fredoka",                  // all other text

  // ---------- text ----------
  enterText: "Click here to see me",
  status: { text: "Do Not Disturb", color: "#ed4245" },   // online #3ba55d · idle #faa81a · offline #747f8d
  bio: ["Hello, World"],                // more lines = types them one after another

  // ---------- social links ("" = hide that icon) ----------
  links: {
    discord:  "https://discord.com/users/YOUR_DISCORD_ID",
    github:   "https://github.com/YOUR_USERNAME",
    telegram: "https://t.me/YOUR_USERNAME",
    roblox:   "https://www.roblox.com/users/YOUR_ROBLOX_ID/profile",
    youtube:  "https://www.youtube.com/@YOUR_CHANNEL",
    tiktok:   "https://www.tiktok.com/@YOUR_USERNAME",
  },

  // ---------- views counter ----------
  startViews: 2284,                     // first visit shows this number, then +1 every visit

  // ---------- profile picture timing ----------
  avatarVideoFirst: true,               // true = video plays first, false = picture first
  avatarImageSeconds: 5,                // how long the picture stays before the video plays again

  // ---------- starting values of the sliders ----------
  volume: 50,                           // 0 - 100
  brightness: 30,                       // 0 - 100 (lower = darker background)

  // ---------- smoothness ----------
  lite: "auto",                         // "auto" = light effects on phones (no live blur behind the boxes, no tilt) so nothing lags
                                        // true = always light · false = always full effects (pretty, but heavy for weak phones)
  adaptive: true,                       // true = if the device still can't keep up, switch off more effects by itself

  // ---------- opening intro ----------
  intro: true,                          // the cinematic opening (the logo slams in) before the "Click here" screen · false = skip it
  introSound: true,                     // boom + whoosh sounds (made by the page itself, no files); they follow the volume slider
  introImages: { scene: "intro/scene.jpg", name: "intro/name.png", tag: "intro/badass.png" },   // the three layers of the logo
};

(function () {
  // light mode on / off
  var lite = CONFIG.lite;
  if (lite === "auto" || lite === undefined) lite = !!(window.matchMedia && matchMedia("(hover: none), (pointer: coarse)").matches);
  if (lite) document.documentElement.classList.add("lite");

  // load the two Google Fonts named above
  function load(family, weights) {
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(family.trim()).replace(/%20/g, "+") +
                (weights ? ":wght@" + weights : "") + "&display=swap";
    if (weights) link.onerror = function () { link.remove(); load(family); };   // font without those weights
    document.head.appendChild(link);
  }
  load(CONFIG.nameFont);
  load(CONFIG.textFont, "400;500;600");
  document.documentElement.style.setProperty("--name-font", JSON.stringify(CONFIG.nameFont));
  document.documentElement.style.setProperty("--text-font", JSON.stringify(CONFIG.textFont));
})();
</script>

<style>
  :root {
    --dim: .64;                               /* background darkness (brightness slider) */
    --edge: rgba(255, 255, 255, .14);
    --soft: rgba(255, 255, 255, .7);
    --radius: 16px;
    --w: min(92vw, 600px);
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: var(--text-font), system-ui, sans-serif; font-weight: 500;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body:not(.entered) { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 0. opening intro (everything here only moves with transform / opacity, so it stays smooth) ---------- */
  #intro { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: #000; overflow: hidden; cursor: pointer;
           animation: iFailsafe .01s linear 7s forwards; }          /* if the script ever fails, the intro hides itself after 7 s */
  @keyframes iFailsafe { to { visibility: hidden; pointer-events: none; } }
  #intro.out { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #intro.out.fast { transition-duration: .3s; }
  .i-art {
    --a: min(100vw, 64vh); --a: min(100vw, 64svh);                /* the logo's square: as wide as the screen, never taller than 64% of it */
    position: absolute; left: 50%; top: 50%; width: var(--a); height: var(--a);
    margin: calc(var(--a) / -2) 0 0 calc(var(--a) / -2);
  }
  #intro.out .i-art { transform: scale(1.1); transition: transform .5s ease-in; }
  .i-zoom { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 50% 46%; will-change: transform; }
  .i-zoom img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; -webkit-user-drag: none; will-change: transform, opacity; }
  .i-glow {
    position: absolute; top: -30%; right: -30%; bottom: -30%; left: -30%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 44%, rgba(255, 45, 30, .5), rgba(255, 45, 30, 0) 56%); will-change: transform, opacity;
  }
  .i-vig { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, .92) 100%); }
  .i-flash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fff; opacity: 0; pointer-events: none; will-change: opacity; }
  .i-slash {
    position: absolute; left: -30%; top: 47%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 32%, #ff3a2a 70%, rgba(255, 60, 40, 0));
    box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85); will-change: transform, opacity;
  }
  .i-slash.a { --r: -22deg; }
  .i-slash.b { --r: 15deg; top: 57%; }
  .i-embers i {
    position: absolute; bottom: -8px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; opacity: 0; pointer-events: none;
    background: #ff5a3a; box-shadow: 0 0 6px 1px rgba(255, 70, 40, .85); will-change: transform, opacity;
  }
  .i-hint {
    position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255, 255, 255, .42); opacity: 0;
  }
  /* the timeline (seconds): 0.1 scene fades in · 0.36 slash · 0.52-0.82 name slams in (impact 0.82) · 1.0 slash · 1.14-1.52 tag swipes in (impact 1.52) · 2.65 end */
  .play .i-art     { animation: iShake 2.6s linear; }
  .play .i-zoom    { animation: iZoom 3.3s linear both; }
  .play .i-scene   { animation: iScene 1.1s cubic-bezier(.1, .6, .2, 1) .1s both; }
  .play .i-glow    { animation: iGlow 2.6s ease-out .3s both; }
  .play .i-name    { animation: iName .3s cubic-bezier(.55, 0, .95, .45) .52s both; }
  .play .i-tag     { animation: iTag .38s cubic-bezier(.2, .8, .2, 1) 1.14s both; }
  .play .i-slash.a { animation: iSlash .3s cubic-bezier(.3, .1, .2, 1) .36s both; }
  .play .i-slash.b { animation: iSlash .28s cubic-bezier(.3, .1, .2, 1) 1s both; }
  .play .i-flash   { animation: iFlash 2.6s linear both; }
  .play .i-embers i { animation: iEmber var(--d) ease-out var(--dl) both; }
  .play .i-hint    { animation: iHint .6s ease 1.3s both; }
  @keyframes iZoom  { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes iScene { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes iGlow  { 0% { opacity: 0; transform: scale(.6); } 22% { opacity: .95; } 100% { opacity: .5; transform: scale(1.12); } }
  @keyframes iName  { from { opacity: 0; transform: scale(1.9) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes iTag   { from { opacity: 1; clip-path: inset(0 100% 0 0); transform: translateX(-30px) skewX(-12deg); } to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes iSlash { 0% { opacity: 0; transform: rotate(var(--r)) translateX(-80%); } 15% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateX(80%); } }
  @keyframes iFlash { 0%, 30% { opacity: 0; } 31.5% { opacity: .55; } 38% { opacity: 0; } 58% { opacity: 0; } 59.2% { opacity: .3; } 65% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes iShake {
    0%, 30% { transform: translate(0, 0); }
    31.5% { transform: translate(-11px, 6px); } 34% { transform: translate(9px, -7px); } 37% { transform: translate(-6px, 4px); }
    40.5% { transform: translate(4px, -3px); } 44% { transform: translate(-2px, 1px); } 47%, 58% { transform: translate(0, 0); }
    59.5% { transform: translate(5px, -3px); } 62.5% { transform: translate(-4px, 3px); } 66% { transform: translate(2px, -1px); } 69%, 100% { transform: translate(0, 0); }
  }
  @keyframes iEmber { 0% { opacity: 0; transform: translate(0, 0); } 14% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -62vh); } }
  @keyframes iHint  { from { opacity: 0; } to { opacity: 1; } }
  /* the white flash and the red slash that punch in when you tap "Click here" */
  #flash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
  #swipe {
    position: fixed; z-index: 71; left: -30%; top: 46%; width: 160%; height: 3px; margin-top: -1.5px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 60, 40, 0), #fff 30%, #ff3a2a 70%, rgba(255, 60, 40, 0)); box-shadow: 0 0 16px 3px rgba(255, 50, 35, .85);
  }

  /* ---------- 1. enter screen ---------- */
  #enter {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #000; cursor: pointer; outline: none;
    transition: opacity .4s ease, visibility .4s;
  }
  #enter.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #enterText {
    font-size: clamp(15px, 4.6vw, 24px); letter-spacing: .25em; line-height: 1.7; text-align: center;
    text-shadow: 0 0 12px rgba(255, 255, 255, .45);
  }
  #enterText::after { content: "|"; margin-left: .05em; animation: blink 1s steps(1) infinite; }

  /* ---------- 2. background ---------- */
  #bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    object-fit: cover; pointer-events: none;
  }
  /* the brightness slider only changes the OPACITY of this black sheet (the phone's graphics chip does that for free) */
  #dim {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none;
    background: #000; opacity: var(--dim);
  }
  #vig {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .45) 100%);
  }
  #scan {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px);
    transition: opacity .45s;
  }
  #scan.on { opacity: 1; transition-duration: .08s; }

  /* ---------- layout ---------- */
  #stage {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 28px 0;
  }
  html:not(.lite) #stage { transition: transform .35s ease-out; }       /* the tilt (full effects only) */
  #stage > * { opacity: 0; transform: translateY(46px) scale(.93); }
  body.entered #stage > * { opacity: 1; transform: none; transition: opacity .7s ease, transform .85s cubic-bezier(.2, 1.25, .3, 1); }
  body.entered #stage > :nth-child(2) { transition-delay: .1s; }
  body.entered #stage > :nth-child(3) { transition-delay: .2s; }

  /* dark glass. Full effects blur what is behind it; light mode (phones) uses a plain darker glass instead,
     because a live blur on top of a playing video is what makes phones lag. */
  .glass {
    position: relative;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 45%), rgba(0, 0, 0, .6);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
  }
  .lite .glass {
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 45%), rgba(10, 10, 10, .76);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .ultra .glass { background: rgba(10, 10, 10, .84); box-shadow: none; }

  /* glowing lines that travel around the boxes (like crax.lol) */
  .tick {
    position: absolute; left: 0; top: 0; height: 2px; margin-top: -1px; border-radius: 2px;
    background: #fff; box-shadow: 0 0 6px rgba(255, 255, 255, .9), 0 0 2px #fff;
    pointer-events: none; will-change: transform;
  }
  .dash { position: absolute; overflow: visible; pointer-events: none; will-change: transform; }
  .dash rect { fill: none; stroke: #fff; stroke-linecap: round; }
  .dash .g { stroke-width: 6; opacity: .22; }
  .dash .c { stroke-width: 2; }
  .lite .dash .g { display: none; }
  .ultra .dash, .ultra .tick { display: none; }

  /* ---------- 3. profile card ---------- */
  .card { width: var(--w); padding: clamp(16px, 4.4vw, 26px); }
  .top { display: flex; align-items: center; gap: clamp(14px, 4.4vw, 24px); }
  .avatar {
    position: relative; flex: none; cursor: pointer; border-radius: 50%; background: #111;
    width: clamp(80px, 23vw, 132px); height: clamp(80px, 23vw, 132px);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .12);
  }
  html:not(.lite) .avatar { box-shadow: 0 0 0 2px rgba(255, 255, 255, .12), 0 0 24px rgba(255, 255, 255, .14); }
  .avatar img, .avatar video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; border-radius: 50%;
  }
  .avatar video { opacity: 0; transition: opacity .9s ease; }
  .avatar video.show { opacity: 1; }

  .info { flex: 1; min-width: 0; }
  .name {
    font-family: var(--name-font), cursive; font-weight: 400;
    font-size: clamp(31px, 9.2vw, 52px); line-height: 1.3; letter-spacing: .02em;
    min-height: 1.3em; overflow-wrap: anywhere;
    text-shadow: 0 0 10px rgba(255, 255, 255, .7), 0 0 26px rgba(255, 255, 255, .25);
  }
  .lite .name { text-shadow: 0 0 10px rgba(255, 255, 255, .55); }
  .ultra .name { text-shadow: none; }
  .caret {
    display: inline-block; width: 2px; height: .78em; margin-left: 5px; vertical-align: -.04em;
    background: #fff; box-shadow: 0 0 8px #fff; animation: blink 1s steps(1) infinite;
  }
  .status {
    display: flex; align-items: center; gap: .65em; margin-top: 6px;
    font-size: clamp(12.5px, 3.6vw, 16px); letter-spacing: .16em; color: var(--soft); white-space: nowrap;
  }
  .dot {
    position: relative; flex: none; width: .78em; height: .78em; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
  }
  .dot::after {                      /* soft ring that grows and fades (only transform + opacity = no repainting) */
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%;
    border: 2px solid currentColor; animation: ring 2.4s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(2.5); opacity: 0; } }
  .ultra .dot::after { display: none; }
  .bio {
    margin-top: 8px; min-height: 1.5em; line-height: 1.5;
    font-size: clamp(12.5px, 3.6vw, 17px); letter-spacing: .14em; color: rgba(255, 255, 255, .9);
    overflow-wrap: anywhere;
  }
  .bio .c { animation: blink 1s steps(1) infinite; }
  .glitch { animation: jitter .2s ease-in-out; }
  @keyframes jitter {
    20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }  80% { transform: translate(2px, -2px); }
  }

  .divider { height: 1px; background: rgba(255, 255, 255, .2); margin: clamp(14px, 4vw, 22px) 0; }

  /* social icons: the glow is a text-shadow / box-shadow (drawn once), not a filter (re-drawn every frame) */
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 3.2vw, 20px); }
  .socials a {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 1.22em; height: 1.22em; font-size: clamp(24px, 7.4vw, 36px);
    color: var(--c, #fff); text-decoration: none;
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }
  .socials a i { display: block; position: relative; z-index: 1; text-shadow: 0 0 8px rgba(255, 255, 255, .4); }
  .socials a::before, .socials a::after { content: ""; position: absolute; top: 50%; left: 50%; z-index: 0; transform: translate(-50%, -50%); }
  .socials a:active, .socials a:focus-visible { transform: scale(1.22) translateY(-2px); outline: none; }
  .socials a:active i, .socials a:focus-visible i { text-shadow: 0 0 12px var(--glow, #fff), 0 0 3px var(--glow, #fff); }
  .s-discord  { --c: #5865f2; --glow: #5865f2; }
  .s-github   { --c: #0d1117; --glow: #fff; }
  .s-github::before   { width: .74em; height: .74em; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .5); }
  .s-telegram { --c: #29a9eb; --glow: #29a9eb; }
  .s-telegram::before { width: .62em; height: .62em; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(41, 169, 235, .55); }
  .s-youtube  { --c: #ff0033; --glow: #ff0033; }
  .s-youtube::before  { width: .42em; height: .42em; background: #fff; }
  .s-tiktok   { --c: #fff; --glow: #fe2c55; }
  .socials .s-tiktok i { text-shadow: -.06em -.045em 0 #25f4ee, .06em .045em 0 #fe2c55; }
  .socials .s-roblox::before   { width: .667em; height: .667em; border-radius: .04em; background: #fff; transform: translate(-50%, -50%) rotate(15deg); box-shadow: 0 0 8px rgba(255, 255, 255, .5); }
  .socials .s-roblox::after    { width: .19em; height: .19em; background: #0d0d0d; transform: translate(-50%, -50%) rotate(15deg); z-index: 1; }
  .socials .s-github:active::before, .socials .s-github:focus-visible::before,
  .socials .s-roblox:active::before, .socials .s-roblox:focus-visible::before { box-shadow: 0 0 14px rgba(255, 255, 255, .85); }
  .socials .s-telegram:active::before, .socials .s-telegram:focus-visible::before { box-shadow: 0 0 14px rgba(41, 169, 235, .9); }
  .socials .s-tiktok:active i, .socials .s-tiktok:focus-visible i { text-shadow: -.06em -.045em 0 #25f4ee, .06em .045em 0 #fe2c55, 0 0 12px #fe2c55; }
  @media (hover: hover) {
    .socials a:hover { transform: scale(1.22) translateY(-2px); }
    .socials a:hover i { text-shadow: 0 0 12px var(--glow, #fff), 0 0 3px var(--glow, #fff); }
    .socials .s-github:hover::before, .socials .s-roblox:hover::before { box-shadow: 0 0 14px rgba(255, 255, 255, .85); }
    .socials .s-telegram:hover::before { box-shadow: 0 0 14px rgba(41, 169, 235, .9); }
    .socials .s-tiktok:hover i { text-shadow: -.06em -.045em 0 #25f4ee, .06em .045em 0 #fe2c55, 0 0 12px #fe2c55; }
  }
  .ultra .socials a i { text-shadow: none; }

  .views {
    position: relative; display: flex; align-items: center; gap: .7em; width: max-content;
    margin: clamp(14px, 4vw, 20px) auto 0; padding: 7px 18px; border-radius: 999px;
    background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .08);
    font-size: clamp(13px, 3.7vw, 15px); letter-spacing: .22em;
  }
  .views .tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 4px);

<body>

    github:   ["GitHub",   '<i class="fa-brands fa-github"></i>'],
    telegram: ["Telegram", '<i class="fa-brands fa-telegram"></i>'],
    roblox:   ["Roblox",   ""],                                   // drawn with CSS
    youtube:  ["YouTube",  '<i class="fa-brands fa-youtube"></i>'],
    tiktok:   ["TikTok",   '<i class="fa-brands fa-tiktok"></i>']

  Object.keys(C.links || {}).forEach(function (key) {

  function tweenSeek(from) {                                // the progress line glides back to the start instead of jumping
    var t0 = 0; tweening = true;
    requestAnimationFrame(function step(t) {
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / 420), v = from * Math.pow(1 - p, 3);
      seek.value = Math.round(v); fill(seek, v / 10);
      if (p < 1) requestAnimationFrame(step); else tweening = false;
    });
  }
  function animateSong(dir) {                               // everything that happens when the song changes (transform / opacity only)
    if (reduced || !cover.animate) return;
    var d = dir < 0 ? -1 : 1;
    cover.animate([{ transform: "translateX(" + 22 * d + "px) scale(.5) rotate(" + 16 * d + "deg)", opacity: 0 },
                   { transform: "translateX(0) scale(1.13) rotate(" + -4 * d + "deg)", opacity: 1, offset: .6 },
                   { transform: "none", opacity: 1 }], { duration: 580, easing: "cubic-bezier(.2,.9,.3,1)" });
    ring.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(2.4)", opacity: 0 }], { duration: 680, easing: "ease-out" });
    $("player").animate([{ transform: "scale(1)" }, { transform: "scale(1.035)", offset: .35 }, { transform: "scale(1)" }], { duration: 440, easing: "cubic-bezier(.3,1.4,.5,1)" });
    if (orbits && orbits.ticks.length) { orbits.ticks[1].boost = 1; orbits.ticks[0].boost = 0.5; }     // the lines race round once
    if (!isUltra() && dim.animate) {                                                                  // the background blinks, like a beat
      var base = parseFloat(getComputedStyle(dim).opacity) || 0.5;
      dim.animate([{ opacity: base }, { opacity: base * 0.45, offset: .2 }, { opacity: base }], { duration: 650, easing: "ease-out" });
    }
  }
  function setCover(src) {
    cover.onerror = function () { cover.onerror = null; cover.src = C.avatarImage; };  // missing cover → profile picture
    cover.src = src || C.avatarImage;
  }
  function load(i, autoplay, dir) {                         // dir: 1 = forward, -1 = back (decides which way the cover flies in)
    if (!songs.length) return;
    idx = (i % songs.length + songs.length) % songs.length;
    var s = songs[idx], from = +seek.value;
    audio.loop = !!C.loopSameSong || songs.length === 1;
    audio.src = s.file;
    setCover(s.cover);
    if (entered && !reduced && from > 12) tweenSeek(from); else { seek.value = 0; fill(seek, 0); }
    cur.textContent = "0:00"; dur.textContent = "0:00";
    setMediaSession(s);
    if (autoplay) play();
    if (entered) { showNow(); animateSong(dir || 1); }
  }
  function restart() {                                      // same song again: the line glides back and the cover pulses
    var from = +seek.value;
    audio.currentTime = 0; play();
    if (!entered || reduced) return;
    if (from > 12) tweenSeek(from);
    if (ring.animate) ring.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(2.4)", opacity: 0 }], { duration: 680, easing: "ease-out" });
    if (cover.animate) cover.animate([{ transform: "scale(1)" }, { transform: "scale(.88)", offset: .3 }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.3,1.5,.5,1)" });
  }
  function prevSong() {
    if (audio.currentTime > 3 || songs.length < 2) restart();
    else load(idx - 1, true, -1);
  }
  function nextSong() {
    if (songs.length < 2) restart();
    else load(idx + 1, true, 1);
  }

  audio.addEventListener("loadedmetadata", function () { dur.textContent = fmt(audio.duration); failures = 0; });
  audio.addEventListener("timeupdate", function () {
    if (dragging || tweening) return;
    var p = audio.duration ? audio.currentTime / audio.duration : 0;
    seek.value = Math.round(p * 1000); fill(seek, p * 100);
    cur.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("ended", function () { if (!audio.loop) load(idx + 1, true); });
  audio.addEventListener("error", function () {           // missing/broken file → try the next song
    if (songs.length > 1 && ++failures < songs.length) setTimeout(function () { load(idx + 1, entered); }, 400);
  });
  audio.addEventListener("play", function () { playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; playBtn.setAttribute("aria-label", "Pause"); });
  audio.addEventListener("pause", function () { playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; playBtn.setAttribute("aria-label", "Play"); });

  playBtn.addEventListener("click", function () { if (audio.paused) play(); else audio.pause(); });
  $("prev").addEventListener("click", prevSong);
  $("next").addEventListener("click", nextSong);
  seek.addEventListener("input", function () {            // dragging: preview the time
    dragging = true;
    fill(seek, seek.value / 10);
    cur.textContent = fmt(seek.value / 1000 * (audio.duration || 0));
  });
  seek.addEventListener("change", function () {           // released: jump there
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
    dragging = false;
  });

  // lock-screen / notification controls on phones (browser only)
  function setMediaSession(s) {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title || s.file, artist: s.artist || C.name,
        artwork: /^https?:$/.test(location.protocol) ? [{ src: new URL(s.cover || C.avatarImage, location.href).href }] : []
      });
    } catch (e) {}
  }
  if ("mediaSession" in navigator) {
    [["play", play], ["pause", function () { audio.pause(); }], ["previoustrack", prevSong], ["nexttrack", nextSong]]
      .forEach(function (h) { try { navigator.mediaSession.setActionHandler(h[0], h[1]); } catch (e) {} });
  }
  load(idx, false);

  /* ---------- 5. settings: volume + background brightness ---------- */
  var volIn = $("vol"), muteBtn = $("mute"), brIn = $("bright");
  var vol = clamp(store.get("volume", C.volume), 0, 100), muted = false;
  var bright = clamp(store.get("brightness", C.brightness), 0, 100);
  function applyVolume() {
    audio.volume = vol / 100;
    audio.muted = muted || vol === 0;                       // iPhones ignore .volume, but mute still works
    volIn.value = vol; fill(volIn, vol);
    var icon = audio.muted ? "fa-volume-xmark" : vol < 50 ? "fa-volume-low" : "fa-volume-high";
    muteBtn.innerHTML = '<i class="fa-solid ' + icon + '"></i>';
  }
  function applyBrightness() {
    root.style.setProperty("--dim", (0.92 * (1 - bright / 100)).toFixed(3));
    brIn.value = bright; fill(brIn, bright);
  }
  volIn.addEventListener("input", function () { vol = +volIn.value; muted = false; applyVolume(); store.set("volume", vol); });
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    if (!muted && vol === 0) vol = 30;
    applyVolume();
  });
  brIn.addEventListener("input", function () { bright = +brIn.value; applyBrightness(); store.set("brightness", bright); });
  applyVolume();
  applyBrightness();

  /* ---------- glowing lines that travel around the boxes (like crax.lol) ----------
     Small lines (avatar, player, settings) are moved with `transform` only, so the phone never has to redraw anything.
     The long line around the card is a thin SVG outline in its own layer, updated 30 times per second. */
  var NS = "http://www.w3.org/2000/svg", RAD = 180 / Math.PI, pt = { x: 0, y: 0, a: 0 };

  function geometry(host, outside) {
    var w = host.offsetWidth, h = host.offsetHeight, cs = getComputedStyle(host);
    var border = parseFloat(cs.borderTopWidth) || 0, rr = cs.borderTopLeftRadius, r = parseFloat(rr) || 0;
    if (rr.indexOf("%") > -1) r = Math.min(w, h) * r / 100;
    var W = w + 2 * outside, H = h + 2 * outside;
    r = Math.max(0, Math.min(r + outside, W / 2, H / 2));
    var g = { W: W, H: H, r: r, off: border + outside, top: W - 2 * r, side: H - 2 * r, arc: Math.PI * r / 2 };
    g.P = 2 * (g.top + g.side) + 4 * g.arc;                 // length of the whole outline
    return g;
  }
  function pointAt(g, s) {                                  // position + direction after walking s along the outline (clockwise)
    var r = g.r, W = g.W, H = g.H, th;
    s = s % g.P; if (s < 0) s += g.P;
    if (s < g.top)  { pt.x = r + s; pt.y = 0; pt.a = 0; return pt; }
    s -= g.top;
    if (s < g.arc)  { th = r ? s / r : 0; pt.x = W - r + r * Math.sin(th); pt.y = r - r * Math.cos(th); pt.a = th * RAD; return pt; }
    s -= g.arc;
    if (s < g.side) { pt.x = W; pt.y = r + s; pt.a = 90; return pt; }
    s -= g.side;
    if (s < g.arc)  { th = r ? s / r : 0; pt.x = W - r + r * Math.cos(th); pt.y = H - r + r * Math.sin(th); pt.a = 90 + th * RAD; return pt; }
    s -= g.arc;
    if (s < g.top)  { pt.x = W - r - s; pt.y = H; pt.a = 180; return pt; }
    s -= g.top;
    if (s < g.arc)  { th = r ? s / r : 0; pt.x = r - r * Math.sin(th); pt.y = H - r + r * Math.cos(th); pt.a = 180 + th * RAD; return pt; }
    s -= g.arc;
    if (s < g.side) { pt.x = 0; pt.y = H - r - s; pt.a = 270; return pt; }
    s -= g.side;
    th = r ? s / r : 0; pt.x = r - r * Math.cos(th); pt.y = r - r * Math.sin(th); pt.a = 270 + th * RAD; return pt;
  }

  function addTick(host, len, seconds, outside) {
    var el = document.createElement("span");
    el.className = "tick"; el.setAttribute("aria-hidden", "true");
    el.style.width = len + "px"; el.style.marginLeft = (-len / 2) + "px";
    host.appendChild(el);
    var o = { g: null, pos: Math.random(), boost: 0 };
    o.fit = function () { if (host.offsetWidth) o.g = geometry(host, outside); };
    o.draw = function (dt) {
      if (!o.g) return;
      o.boost = Math.max(0, o.boost - dt * 1.5);
      o.pos = (o.pos + dt / seconds * (1 + 7 * o.boost * o.boost)) % 1;
      var p = pointAt(o.g, o.pos * o.g.P);
      el.style.transform = "translate3d(" + (p.x - o.g.off).toFixed(1) + "px," + (p.y - o.g.off).toFixed(1) + "px,0) rotate(" + p.a.toFixed(1) + "deg)";
    };
    o.fit();
    watch(host, o.fit);
    return o;
  }

  function addDash(host, len, pxPerSecond) {
    var svg = document.createElementNS(NS, "svg"), glow = document.createElementNS(NS, "rect"), core = document.createElementNS(NS, "rect");
    svg.setAttribute("class", "dash"); svg.setAttribute("aria-hidden", "true");
    glow.setAttribute("class", "g"); core.setAttribute("class", "c");
    svg.appendChild(glow); svg.appendChild(core); host.appendChild(svg);
    var o = { pos: Math.random(), L: 0 };
    o.fit = function () {
      var w = host.offsetWidth, h = host.offsetHeight;
      if (!w || !h) return;
      var cs = getComputedStyle(host), border = parseFloat(cs.borderTopWidth) || 0, sw = 2;
      var r = Math.max(0, Math.min(parseFloat(cs.borderTopLeftRadius) || 0, w / 2, h / 2) - sw / 2);
      svg.style.left = svg.style.top = -border + "px";
      svg.style.width = w + "px"; svg.style.height = h + "px";
      svg.setAttribute("viewBox", "0 0 " + w + " " + h);
      [glow, core].forEach(function (rc) {
        rc.setAttribute("x", sw / 2); rc.setAttribute("y", sw / 2);
        rc.setAttribute("width", w - sw); rc.setAttribute("height", h - sw);
        rc.setAttribute("rx", r); rc.setAttribute("ry", r);
        rc.style.strokeDasharray = len + " " + Math.max(0, 2 * (w - sw + h - sw) - 8 * r + 2 * Math.PI * r - len);
      });
      o.L = 2 * (w - sw + h - sw) - 8 * r + 2 * Math.PI * r;
    };
    o.draw = function (dt) {
      if (!o.L) return;
      o.pos = (o.pos + dt * pxPerSecond / o.L) % 1;
      var off = (-o.pos * o.L).toFixed(1);
      core.style.strokeDashoffset = off;
      if (!isLite()) glow.style.strokeDashoffset = off;
    };
    o.fit();
    watch(host, o.fit);
    return o;
  }

  function watch(host, fn) {
    if (window.ResizeObserver) new ResizeObserver(fn).observe(host);
    else window.addEventListener("resize", fn);
  }

  /* if the device can't keep up (under ~38 frames per second) the page switches off more effects by itself */
  var gov = { on: !!C.adaptive, t0: 0, n: 0, sum: 0, slow: 0 };
  function govern(t, dt) {
    if (!gov.on || !dt || paused || document.hidden) return;
    if (!gov.t0) gov.t0 = t + 3500;                          // let the intro finish first
    if (t < gov.t0 || dt > 250) return;
    gov.n++; gov.sum += dt; if (dt > 34) gov.slow++;
    if (t - gov.t0 > 2500 && gov.n > 20) {
      var avg = gov.sum / gov.n, bad = avg > 26 || gov.slow / gov.n > 0.3;
      gov.on = false;
      if (bad) degrade(avg);
    }
  }
  function degrade(avg) {
    if (!isLite()) { root.classList.add("lite"); tiltOn = false; untilt(); }
    else root.classList.add("ultra");
    if (window.console) console.info("[page] slow device (" + avg.toFixed(1) + " ms per frame): " + (isUltra() ? "ultra-light" : "light") + " effects");
    if (!isUltra()) { gov.on = true; gov.t0 = 0; gov.n = 0; gov.sum = 0; gov.slow = 0; }   // measure once more
  }

  function startOrbits() {
    var avatarEl = $("avatar");
    var ticks = [], dash = null, last = 0, lastDraw = 0, lastDash = 0;
    if (!reduced) {
      ticks = [addTick(avatarEl, 16, 3, 3), addTick($("player"), 26, 7, 0), addTick($("settings"), 18, 4, 0)];
      dash = addDash($("card"), 80, 90);
      orbits = { ticks: ticks, dash: dash };
      avatarEl.addEventListener("click", function () { ticks[0].boost = 1; });   // tap the picture = fast spin
    }
    requestAnimationFrame(function frame(t) {
      requestAnimationFrame(frame);
      var raw = last ? t - last : 0; last = t;
      govern(t, raw);
      if (reduced || paused || document.hidden || isUltra()) { lastDraw = lastDash = 0; return; }
      if (t - lastDraw < 14) return;                         // at most ~60 updates a second, even on 90/120 Hz screens
      var dt = lastDraw ? Math.min(0.05, (t - lastDraw) / 1000) : 0.016; lastDraw = t;
      for (var i = 0; i < ticks.length; i++) ticks[i].draw(dt);
      if (!lastDash || t - lastDash >= 32) {                 // the long outline: 30 times a second
        dash.draw(lastDash ? Math.min(0.1, (t - lastDash) / 1000) : 0.033); lastDash = t;
      }
    });
  }

  /* ---------- 3D tilt + scan-line flash (full effects only: computers, never phones) ---------- */
  var stage = $("stage"), scan = $("scan"), tiltOn = !isLite() && !reduced;
  function tilt(x, y) {
    var rx = (y / innerHeight * 2 - 1) * 10, ry = -(x / innerWidth * 2 - 1) * 10;
    stage.style.transform = "perspective(1000px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
  }
  function untilt() { stage.style.transform = ""; }
  function flash() { if (!tiltOn) return; scan.classList.add("on"); setTimeout(function () { scan.classList.remove("on"); }, 450); }
  document.addEventListener("pointermove", function (e) { if (tiltOn && entered && e.pointerType === "mouse") tilt(e.clientX, e.clientY); });
  document.documentElement.addEventListener("mouseleave", untilt);
  document.addEventListener("touchmove", function (e) {
    if (!tiltOn || !entered || !e.touches[0] || (e.target.closest && e.target.closest("input, button, a"))) return;
    tilt(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener("touchend", untilt);
  document.addEventListener("touchcancel", untilt);
  $("avatar").addEventListener("click", flash);
  $("avatar").addEventListener("mouseenter", flash);

  /* ---------- ENTER: the tap starts everything ---------- */
  function firstFrame(video, maxMs) {                        // resolves when the video shows its first picture (or after maxMs)
    return new Promise(function (resolve) {
      var done = false, fin = function () { if (!done) { done = true; resolve(); } };
      setTimeout(fin, maxMs);
      if (video.readyState >= 3 && video.currentTime > 0) return fin();
      video.addEventListener("playing", fin, { once: true });
    });
  }
  function impact() {                         // the punch when the page appears: flash, red slash, shake, boom
    sfx.play("reveal", true);
    if (reduced || !stage.animate) return;
    $("flash").animate([{ opacity: 0 }, { opacity: .5, offset: .16 }, { opacity: 0 }], { duration: 480, easing: "ease-out" });
    $("swipe").animate([{ opacity: 0, transform: "rotate(-14deg) translateX(-75%)" }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .75 }, { opacity: 0, transform: "rotate(-14deg) translateX(75%)" }],
                       { duration: 420, easing: "cubic-bezier(.3,.1,.2,1)" });
    stage.animate([{ transform: "translate(0, 0)" }, { transform: "translate(-7px, 4px)", offset: .12 }, { transform: "translate(6px, -4px)", offset: .3 },
                   { transform: "translate(-4px, 2px)", offset: .5 }, { transform: "translate(2px, -1px)", offset: .72 }, { transform: "translate(0, 0)" }], { duration: 420 });
  }
  function enter() {
    if (entered) return;
    entered = true;
    sfx.unlock();                             // sound may start now (we are inside the tap)
    introEnd(true);                           // tapped during the intro: skip the rest of it
    play();                                   // music (allowed because this runs inside the tap)
    swallow(bg.play());                       // background video
    enterEl.classList.add("hide");
    setTimeout(function () { enterEl.style.display = "none"; }, 500);
    firstFrame(bg, 700).then(reveal);         // the page appears once the video is really running, so nothing stutters
  }
  function reveal() {
    document.body.classList.add("entered");
    impact();
    typeLoop($("nameText"), [C.name], { type: 260, erase: 140, hold: 10000, gap: 600 });
    var bio = [].concat(C.bio || []).filter(Boolean);
    if (bio.length) typeLoop($("bioText"), bio, { type: 130, erase: 65, hold: 2000, gap: 450 });
    startAvatar();
    countUp();
    startOrbits();
    showNow();
  }
  enterEl.addEventListener("click", enter);
  enterEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
  });
  try { enterEl.focus({ preventScroll: true }); } catch (e) {}

  /* ---------- Android app: pause everything while the app is in the background ---------- */
  var resumeList = [];
  window.appPaused = function () {
    if (paused) return;
    paused = true;
    resumeList = [audio, bg, avVid].filter(function (m) { return !m.paused; });
    resumeList.forEach(function (m) { m.pause(); });
  };
  window.appResumed = function () {
    if (!paused) return;
    paused = false;
    resumeList.forEach(function (m) { swallow(m.play()); });
    resumeList = [];
  };
})();
</script>
</body>
</html>
