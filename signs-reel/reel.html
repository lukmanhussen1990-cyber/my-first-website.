<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signs before the Last Day</title>
<!--
  "Signs before the Last Day" - a 60 s Instagram Reel drawn 100% with code.

  render(t) draws the exact frame for time t (seconds). Everything random is seeded,
  so every run gives identical frames. Open this file in a browser for the preview
  (Play + scrub bar). The exporter (render_frames.mjs) loads it with ?export=1.

  URL options:  ?page=Other%20Name         page name shown at the top (default NOOR TOON)
                ?t=12.5                     open the preview at a given time
-->
<style>
  @font-face { font-family: "Patrick Hand"; src: url("fonts/PatrickHand-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-VF.ttf") format("truetype");
               font-weight: 300 700; font-style: normal; }
  @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-Italic-VF.ttf") format("truetype");
               font-weight: 300 700; font-style: italic; }
  @font-face { font-family: "Amiri"; src: url("fonts/Amiri-Regular.ttf") format("truetype"); }

  :root {
    --bg: #0b0a0f;
    --panel: #17151d;
    --line: #2b2833;
    --ink: #f3e6c4;
    --muted: #9c937f;
    --accent: #d9b46a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { min-height: 100%; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 12px; padding: 12px 16px; }
  #reel { display: block; height: calc(100vh - 116px); max-height: 1920px; width: auto;
          max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 6px;
          box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #ui { width: min(100%, 560px); background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  button { background: var(--accent); color: #1a1408; border: 0; border-radius: 8px;
           padding: 8px 16px; font-weight: 600; cursor: pointer; min-width: 84px; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); min-width: 0; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  #info { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }

  body.export { background: #000; overflow: hidden; }
  body.export #stage { padding: 0; display: block; }
  body.export #reel { width: 1080px; height: 1920px; max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
  body.export #ui { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="reel" width="1080" height="1920"></canvas>
  <div id="ui">
    <div class="row">
      <button id="play">Play</button>
      <input id="scrub" type="range" min="0" max="1799" step="1" value="0" aria-label="Scrub">
      <span id="time">0:00.00</span>
    </div>
    <div id="info">
      <span id="sceneName">Scene 1</span>
      <span class="row">
        <label><input type="checkbox" id="fast"> fast (half-res)</label>
        <label><input type="checkbox" id="mute"> mute</label>
        <button class="ghost" id="snap" title="Save this frame as PNG">PNG</button>
      </span>
    </div>
    <div id="audioNote" style="color:var(--muted);font-size:12px;display:none">
      No sound found: run the build once to create output/audio.m4a, then reload.
    </div>
  </div>
</div>
<audio id="snd" preload="auto"></audio>
<script>
'use strict';
// ============================================================================
//  CORE: constants, math, seeded random, colours, cached textures, overlays
// ============================================================================
const W = 1080, H = 1920, FPS = 30, DURATION = 60, TOTAL_FRAMES = FPS * DURATION;
const QS = new URLSearchParams(location.search);
const EXPORT = QS.has('export');
const PAGE_NAME = QS.get('page') || 'NOOR TOON';
const TAU = Math.PI * 2;
const CREAM = [243, 230, 196];                       // #F3E6C4
const FONT_HAND = '"Patrick Hand", "Amiri", cursive';
const FONT_SERIF = '"Cormorant Garamond", "Amiri", serif';
const TYPE = { start: 0.7, step: 0.035, fade: 0.12 }; // typewriter timing (seconds)
const TEXT_Y = 1180;      // centre of the main line block
const TEXT_MAX_W = 800;   // <= 900; keeps centred text out of the right 140 px
const FADE = 0.4;         // fade from / to black at every scene edge

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
const sstep = (a, b, x) => smooth(inv(a, b, x));
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIn = u => u * u * u;
const easeInOut = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOutBack = (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);

// ---------- seeded random ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(i, j = 0, s = 0) {                    // deterministic value in [0, 1)
  let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise1(x, s = 0) {                          // smooth 1D value noise in [0, 1]
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash2(i, 7, s), hash2(i + 1, 7, s), u);
}

// ---------- colours ----------
function hex(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${+a.toFixed(4)})`;
function vGrad(ctx, y0, y1, stops) {                // stops: [[pos, colour], ...]
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [p, c, a] of stops) g.addColorStop(p, rgba(c, a ?? 1));
  return g;
}

// ---------- canvas ----------
const canvas = document.getElementById('reel');
const ctx = canvas.getContext('2d', { alpha: false });
let RS = 1;                                          // render scale (0.5 in fast preview)
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- cached textures (built once, deterministically) ----------
const CACHE = { grain: [], paper: null, dots: new Map() };

function buildGrain(seed) {
  const w = 580, h = 1000, c = makeCanvas(w, h), g = c.getContext('2d');
  const img = g.createImageData(w, h), d = img.data, r = mulberry32(seed);
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() + r() + r() - 1.5) * 2;           // ~ gaussian, sd 1
    const v = clamp(128 + n * 40, 0, 255);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

function buildPaper(seed) {                          // soft painterly mottling (fbm of upscaled noise)
  const w = 540, h = 960, c = makeCanvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, w, h);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  for (const [ow, oh, a] of [[9, 16, 0.5], [20, 36, 0.42], [45, 80, 0.34], [100, 178, 0.26], [270, 480, 0.2]]) {
    const t = makeCanvas(ow, oh), tg = t.getContext('2d'), img = tg.createImageData(ow, oh);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + (r() - 0.5) * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    tg.putImageData(img, 0, 0);
    g.globalAlpha = a; g.drawImage(t, 0, 0, w, h);
  }
  g.globalAlpha = 1; g.lineCap = 'round';
  for (let i = 0; i < 1800; i++) {                   // faint brush fibres
    const x = r() * w, y = r() * h, len = 4 + r() * 14, ang = (r() - 0.5) * 0.6 + (r() < 0.5 ? 0 : Math.PI / 2);
    g.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
    g.lineWidth = 0.6 + r() * 0.9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  }
  return c;
}

function dotSprite(col) {                            // soft round light sprite, tinted
  const key = col.map(Math.round).join(',');
  let s = CACHE.dots.get(key);
  if (s) return s;
  s = makeCanvas(64, 64);
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.18, rgba(col, 0.85));
  gr.addColorStop(0.45, rgba(col, 0.3)); gr.addColorStop(0.75, rgba(col, 0.07)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  CACHE.dots.set(key, s);
  return s;
}

function buildCaches() {
  for (let i = 0; i < 8; i++) CACHE.grain.push(buildGrain(9001 + i * 17));
  CACHE.paper = buildPaper(4242);
}

// ---------- drawing helpers ----------
function drawDot(c, x, y, r, col, a) {
  if (a <= 0.003 || r <= 0) return;
  c.globalAlpha = Math.min(1, a);
  c.drawImage(dotSprite(col), x - r, y - r, r * 2, r * 2);
  c.globalAlpha = 1;
}

// big soft light (gaussian-like falloff). mode 'screen' adds light, 'source-over' paints.
function glow(c, x, y, r, col, a, sy = 1, mode = 'screen') {
  if (a <= 0.002) return;
  c.save();
  c.globalCompositeOperation = mode;
  c.translate(x, y); c.scale(1, sy);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.2, rgba(col, a * 0.78));
  g.addColorStop(0.42, rgba(col, a * 0.42)); g.addColorStop(0.68, rgba(col, a * 0.14));
  g.addColorStop(0.86, rgba(col, a * 0.035)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.fillRect(-r, -r, r * 2, r * 2);
  c.restore();
}

function softShadow(c, x, y, rx, ry, a) {           // contact shadow under objects
  c.save();
  c.translate(x, y); c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.5, `rgba(0,0,0,${a * 0.55})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
  c.restore();
}

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function makeStars(seed, n, y0, y1) {
  const r = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) {
    out.push({ x: r() * W, y: y0 + Math.pow(r(), 1.35) * (y1 - y0), s: 0.55 + Math.pow(r(), 3.2) * 2.3,
               a: 0.25 + r() * 0.75, f: 0.25 + r() * 1.1, ph: r() * TAU });
  }
  return out;
}
function drawStars(c, stars, t, alpha = 1, col = [232, 236, 255]) {
  c.save();
  c.globalCompositeOperation = 'screen';
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * s.f * TAU + s.ph);
    const a = s.a * (0.35 + 0.65 * tw) * alpha;
    if (a < 0.015) continue;
    if (s.s > 1.5) drawDot(c, s.x, s.y, s.s * 5.5, col, a * 0.45);
    c.fillStyle = rgba(col, Math.min(1, a));
    c.beginPath(); c.arc(s.x, s.y, s.s * 0.62, 0, TAU); c.fill();
    if (s.s > 2.1) {                                 // tiny cross glint on the brightest stars
      c.strokeStyle = rgba(col, a * 0.35); c.lineWidth = 1;
      const L = s.s * 4 * (0.6 + 0.4 * tw);
      c.beginPath(); c.moveTo(s.x - L, s.y); c.lineTo(s.x + L, s.y); c.moveTo(s.x, s.y - L); c.lineTo(s.x, s.y + L); c.stroke();
    }
  }
  c.restore();
}

function makeDust(seed, n, box = { x0: 0, y0: 250, x1: W, y1: 1150 }) {
  const r = mulberry32(seed), ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ x: box.x0 + r() * (box.x1 - box.x0), y: box.y0 + r() * (box.y1 - box.y0),
              vx: (r() - 0.5) * 16, vy: -4 - r() * 12, amp: 6 + r() * 18, f: 0.3 + r() * 0.9,
              tf: 0.8 + r() * 2.2, ph: r() * TAU, size: 1 + Math.pow(r(), 2) * 3, a: 0.18 + r() * 0.42 });
  }
  return { box, ps };
}
function drawDust(c, dust, t, col, alpha = 1) {
  const { x0, y0, x1, y1 } = dust.box, bw = x1 - x0, bh = y1 - y0;
  c.save();
  c.globalCompositeOperation = 'screen';
  for (const p of dust.ps) {
    let x = p.x + p.vx * t + Math.sin(t * p.f + p.ph) * p.amp;
    let y = p.y + p.vy * t + Math.cos(t * p.f * 0.73 + p.ph) * p.amp * 0.6;
    x = x0 + (((x - x0) % bw) + bw) % bw;
    y = y0 + (((y - y0) % bh) + bh) % bh;
    const edge = Math.min(x - x0, x1 - x, y - y0, y1 - y);
    const tw = 0.55 + 0.45 * Math.sin(t * p.tf + p.ph * 2);
    drawDot(c, x, y, p.size * 3.2, col, p.a * tw * alpha * sstep(0, 70, edge));
  }
  c.restore();
}

// ---------- screen overlays ----------
function paperTexture(c, amount) {
  if (amount <= 0) return;
  c.save();
  c.globalCompositeOperation = 'soft-light';
  c.globalAlpha = amount;
  c.drawImage(CACHE.paper, 0, 0, W, H);
  c.restore();
}

function vignette(c, strength = 0.8, cy = 860) {
  c.save();
  const k = 1.75;
  c.translate(540, cy); c.scale(1, k);
  const g = c.createRadialGradient(0, 0, 300, 0, 0, 820);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, `rgba(0,0,0,${strength * 0.16})`);
  g.addColorStop(0.8, `rgba(0,0,0,${strength * 0.5})`);
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  c.fillStyle = g; c.fillRect(-540, -cy / k - 10, W, H / k + 20);
  c.restore();
}

function textScrim(c, a) {                           // soft darkening behind the text block
  if (a <= 0) return;
  c.save();
  c.translate(540, 1265); c.scale(1, 0.42);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 640);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(-640, -640, 1280, 1280);
  c.restore();
}

function drawGrain(c, frame, amount = 0.2) {
  const g = CACHE.grain[frame % CACHE.grain.length];
  const ox = -Math.floor(hash2(frame, 1, 77) * 40), oy = -Math.floor(hash2(frame, 2, 77) * 40);
  c.save();
  c.globalCompositeOperation = 'soft-light';
  c.globalAlpha = amount;
  c.drawImage(g, ox, oy, g.width * 2, g.height * 2);
  c.restore();
}
// ============================================================================
//  TEXT: balanced wrapping, typewriter reveal, source line, page name
// ============================================================================
function wrapBalanced(str, font, maxW) {
  ctx.font = font;
  if (ctx.measureText(str).width <= maxW) return [str];
  const words = str.split(' ');
  let best = null;
  for (let i = 1; i < words.length; i++) {           // best single break: shortest longest line
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    if (wa > maxW || wb > maxW) continue;
    const score = Math.max(wa, wb) + (wb > wa ? 0.001 : 0);
    if (!best || score < best.score) best = { score, lines: [a, b] };
  }
  if (best) return best.lines;
  const lines = []; let cur = '';                   // fallback: greedy
  for (const w of words) {
    const tryL = cur ? cur + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tryL;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Lay out a centred block. Every character of `str` gets an index (spaces too), so the
// typewriter timing is "one character every TYPE.step seconds" across the whole string.
function layoutBlock(str, px, centerY, opts = {}) {
  const font = `${opts.weight ? opts.weight + ' ' : ''}${px}px ${opts.family || FONT_HAND}`;
  const maxW = opts.maxW || TEXT_MAX_W, lineH = opts.lineH || Math.round(px * 1.25);
  const lines = wrapBalanced(str, font, maxW);
  ctx.font = font;
  const block = { str, font, px, lines: [], count: str.length, lineH };
  const y0 = centerY - (lines.length - 1) * lineH / 2;
  let gi = 0;
  lines.forEach((ln, li) => {
    const w = ctx.measureText(ln).width, x0 = 540 - w / 2, chars = [];
    for (let k = 0; k < ln.length; k++) {
      const ch = ln[k];
      const x = ctx.measureText(ln.slice(0, k + 1)).width - ctx.measureText(ch).width; // keeps kerning
      chars.push({ ch, x: x0 + x, idx: gi + k });
    }
    block.lines.push({ text: ln, w, x0, y: y0 + li * lineH, chars });
    gi += ln.length + 1;                              // +1: the space where the line breaks
  });
  block.top = y0 - px * 0.55;
  block.bottom = y0 + (lines.length - 1) * lineH + px * 0.55;
  block.lastY = y0 + (lines.length - 1) * lineH;
  return block;
}
const typedEnd = (block, t0) => t0 + (block.count - 1) * TYPE.step + TYPE.fade;

function setTextShadow(c, px) {
  c.shadowColor = 'rgba(0,0,0,0.78)';
  c.shadowBlur = Math.round(px * 0.28);
  c.shadowOffsetY = Math.max(2, Math.round(px * 0.045));
}

// Typewriter: char k starts fading in at t0 + k*step, fully visible after `fade` seconds.
function drawTyped(c, block, lt, t0, alphaMul = 1, col = CREAM) {
  if (alphaMul <= 0) return;
  c.save();
  c.font = block.font; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillStyle = rgba(col, 1);
  setTextShadow(c, block.px);
  for (const L of block.lines) {
    for (const ch of L.chars) {
      if (ch.ch === ' ') continue;
      const a = t0 == null ? 1 : clamp((lt - t0 - ch.idx * TYPE.step) / TYPE.fade);
      if (a <= 0) continue;
      c.globalAlpha = a * alphaMul;
      c.fillText(ch.ch, ch.x, L.y + (1 - a) * 5);
    }
  }
  c.restore();
}

function blockTicks(block, absT0) {                  // one soft tick per visible typed letter
  const out = [];
  for (const L of block.lines) for (const ch of L.chars) {
    if (ch.ch !== ' ') out.push({ t: +(absT0 + ch.idx * TYPE.step).toFixed(5), x: Math.round(ch.x) });
  }
  return out.sort((a, b) => a.t - b.t);
}

// Source line: small serif capitals, 4 px letter-spacing, 45% opacity.
function layoutSource(str, y) {
  const font = `600 24px ${FONT_SERIF}`;
  ctx.font = font;
  const sp = 4, adv = [...str].map(ch => ctx.measureText(ch).width);
  const w = adv.reduce((s, a) => s + a, 0) + sp * (adv.length - 1);
  let x = 540 - w / 2;
  const chars = [...str].map((ch, i) => { const o = { ch, x }; x += adv[i] + sp; return o; });
  return { str, font, y, w, chars };
}
function drawSource(c, src, alpha) {
  if (alpha <= 0.003) return;
  c.save();
  c.font = src.font; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillStyle = rgba(CREAM, 1); c.globalAlpha = 0.45 * alpha;
  c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 8; c.shadowOffsetY = 2;
  for (const ch of src.chars) c.fillText(ch.ch, ch.x, src.y + (1 - alpha) * 4);
  c.restore();
}

// A centred line made of differently styled runs (used for "... Muhammad ﷺ").
function layoutRuns(runs, y) {
  let w = 0;
  for (const r of runs) { ctx.font = r.font; r.w = ctx.measureText(r.text).width; w += r.w; }
  let x = 540 - w / 2;
  for (const r of runs) { r.x = x; x += r.w; }

}
function drawRuns(c, line, alpha, col = CREAM) {
  c.save();

function drawPageName(c, alpha) {

// shared landscape helper: a smooth ridge line y(x) built from seeded sines
function makeRidge(seed, baseY, amp, waves = 4, step = 12) {
  const r = mulberry32(seed), comps = [];
  for (let k = 0; k < waves; k++) comps.push({ f: (0.0025 + r() * 0.006) * (1 + k * 0.9), p: r() * TAU, a: amp / (1 + k * 1.3) });
  const pts = [];
  for (let x = -40; x <= W + 40; x += step) {
    let y = baseY;
    for (const q of comps) y += Math.sin(x * q.f + q.p) * q.a;
    pts.push([x, y]);
  }
  return pts;
}
function ridgePath(c, pts, bottom = H + 10) {
  c.beginPath(); c.moveTo(pts[0][0], bottom);
  for (const [x, y] of pts) c.lineTo(x, y);
  c.lineTo(pts[pts.length - 1][0], bottom); c.closePath();
}
function ridgeStroke(c, pts, col, a, lw = 2) {
  c.save(); c.strokeStyle = rgba(col, a); c.lineWidth = lw; c.lineJoin = 'round';
  c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); c.restore();
}
const ridgeY = (pts, x) => {                          // sample ridge height at x
  const i = clamp(Math.floor((x - pts[0][0]) / (pts[1][0] - pts[0][0])), 0, pts.length - 2);
  const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
  return lerp(y0, y1, clamp((x - x0) / (x1 - x0)));
};

function buildMoon(R) {
  const s = Math.ceil(R * 2 + 8), c = makeCanvas(s, s), g = c.getContext('2d'), m = s / 2;
  const gr = g.createRadialGradient(m - R * 0.35, m + R * 0.25, R * 0.05, m, m, R);
  gr.addColorStop(0, '#fffbea'); gr.addColorStop(0.65, '#ece6cf'); gr.addColorStop(1, '#c8c3ae');
  g.fillStyle = gr; g.beginPath(); g.arc(m, m, R, 0, TAU); g.fill();
  const r = mulberry32(77);
  for (let i = 0; i < 16; i++) {                     // soft lunar maria
    const a = r() * TAU, d = r() * R * 0.8, rr = R * (0.05 + r() * 0.17);
    g.fillStyle = `rgba(140,138,124,${0.07 + r() * 0.1})`;
    g.beginPath(); g.arc(m + Math.cos(a) * d, m + Math.sin(a) * d, rr, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'destination-out';    // cut the crescent (opens to the upper right)
  g.fillStyle = '#000';
  g.beginPath(); g.arc(m + R * 0.44, m - R * 0.24, R * 0.88, 0, TAU); g.fill();
  return c;
}

function buildCloudDeck(seed, w, h, warm, a) {

    const x = r() * w, y = h * (0.15 + r() * 0.6), rad = 70 + r() * 150, k = y / h;
    const col = mix([46, 22, 58], [120, 52, 70], k * 0.8 + r() * 0.2);
    glow(g, x, y, rad, col, a * (0.55 + r() * 0.45), 0.55, 'source-over');

  for (let i = 0; i < 26; i++) {                     // warm, lit undersides
    const x = r() * w, y = h * (0.62 + r() * 0.2), rad = 80 + r() * 140;
    glow(g, x, y, rad, warm, 0.22 * a, 0.3, 'screen');

}

// glass tower: segments = [[from, to, widthFrac], ...] as fractions of the height
function drawTower(c, T, rise, lt) {
  const base = 1014, top = base - T.h * rise, side = Math.sign(540 - T.x) * Math.min(30, Math.abs(540 - T.x) * 0.12);
  c.save();
  c.beginPath(); c.rect(-200, -400, W + 400, base + 400); c.clip();
  for (const [f0, f1, wf] of T.segs) {
    const y0 = top + T.h * (1 - f1), y1 = top + T.h * (1 - f0), w = T.w * wf, L = T.x - w / 2, R = T.x + w / 2;
    if (side) {                                       // side face (the one facing the centre)
      const sx = side > 0 ? R : L, d = side;
      c.fillStyle = vGrad(c, y0, y1, [[0, hex('#1e1530')], [1, hex('#5a2a26')]]);
      c.beginPath(); c.moveTo(sx, y0); c.lineTo(sx + d, y0 + 6); c.lineTo(sx + d, y1); c.lineTo(sx, y1); c.closePath(); c.fill();
    }
    const g = c.createLinearGradient(0, top, 0, top + T.h);    // glass reflects the dusk sky
    g.addColorStop(0, '#221d40'); g.addColorStop(0.35, '#3d2650'); g.addColorStop(0.7, '#7e3d3c'); g.addColorStop(1, '#c86d3a');
    c.fillStyle = g; c.fillRect(L, y0, w, y1 - y0);
    c.save();
    c.beginPath(); c.rect(L, y0, w, y1 - y0); c.clip();
    const hz = c.createLinearGradient(L, 0, R, 0);   // rounded shading across the face
    hz.addColorStop(0, 'rgba(255,200,160,0.12)'); hz.addColorStop(0.35, 'rgba(255,255,255,0)');
    hz.addColorStop(0.7, 'rgba(0,0,0,0.12)'); hz.addColorStop(1, 'rgba(0,0,0,0.3)');
    c.fillStyle = hz; c.fillRect(L, y0, w, y1 - y0);
    for (let k = 0; k < 3; k++) {                     // vertical reflection streaks
      const sx = L + w * (0.1 + 0.3 * k + 0.08 * hash2(k, 9, T.seed)), sw = w * (0.05 + 0.08 * hash2(k, 8, T.seed));
      c.fillStyle = `rgba(255,215,190,${0.05 + 0.06 * hash2(k, 7, T.seed)})`; c.fillRect(sx, y0, sw, y1 - y0);
    }
    c.fillStyle = 'rgba(12,6,24,0.22)';               // floor lines and mullions
    for (let y = y0 + 6; y < y1; y += 14) c.fillRect(L, y, w, 1.6);
    c.fillStyle = 'rgba(12,6,24,0.14)';
    for (let x = L + w / 6; x < R - 2; x += w / 6) c.fillRect(x, y0, 1.2, y1 - y0);
    for (let y = y0 + 8; y < y1 - 4; y += 14) {        // a few warm lit windows
      for (let j = 0; j < 6; j++) {
        const hsh = hash2(Math.round((y - top) / 14), j, T.seed);
        if (hsh < 0.06) { c.fillStyle = `rgba(255,200,120,${0.22 + hsh * 4})`; c.fillRect(L + j * w / 6 + 2, y, w / 6 - 4, 8); }
      }
    }
    const sh = c.createLinearGradient(L, y0, R, y0 + w * 1.6);   // diagonal sheen
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.45, 'rgba(255,220,200,0.16)');
    sh.addColorStop(0.55, 'rgba(255,220,200,0.04)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sh; c.fillRect(L, y0, w, y1 - y0);
    c.restore();
    c.fillStyle = 'rgba(255,190,130,0.6)';            // bright edge + roof line
    c.fillRect(side >= 0 ? L : R - 2, y0, 2, y1 - y0); c.fillRect(L, y0, w, 2);
  }
  if (T.spire) {
    const yb = top + T.h * (1 - T.segs[T.segs.length - 1][1]);
    c.strokeStyle = 'rgba(230,170,130,0.9)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(T.x, yb); c.lineTo(T.x, yb - T.spire); c.stroke();
  }
  if (rise > 0 && rise < 1) {                         // sand pouring off the rising tower
    const span = base - top;
    for (let i = 0; i < 26; i++) {
      const fx = hash2(i, 3, T.seed), sp = 160 + hash2(i, 4, T.seed) * 140;
      const y = top + ((lt * sp + i * 61) % Math.max(1, span));
      drawDot(c, T.x + (fx - 0.5) * T.w * 0.95, y, 3, [200, 140, 90], 0.45 * (1 - (y - top) / span));
    }
  }
  c.restore();
}

function buildWoodTable(seed, y0, w, h, light, dark) {
  const c = makeCanvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = vGrad(g, 0, h, [[0, light], [1, dark]]); g.fillRect(0, 0, w, h);
  let y = 0, k = 0;
  while (y < h) {                                     // planks get wider towards the viewer
    const ph = 34 + y * 0.22 + r() * 10;
    g.fillStyle = `rgba(0,0,0,${0.25 + r() * 0.15})`; g.fillRect(0, y, w, 2 + y * 0.004);
    g.fillStyle = 'rgba(255,200,140,0.06)'; g.fillRect(0, y + 2 + y * 0.004, w, 1.5);
    for (let i = 0; i < 9; i++) {                    // grain lines
      const yy = y + 4 + r() * (ph - 6), a = 0.05 + r() * 0.08, f = 0.004 + r() * 0.01, p = r() * TAU;
      g.strokeStyle = r() < 0.6 ? `rgba(20,8,2,${a})` : `rgba(255,190,120,${a * 0.6})`;
      g.lineWidth = 0.8 + r() * 1.6; g.beginPath();
      for (let x = 0; x <= w; x += 24) { const yv = yy + Math.sin(x * f + p) * (2 + r() * 1.5); x ? g.lineTo(x, yv) : g.moveTo(x, yv); }
      g.stroke();
    }
    if (r() < 0.5) {                                  // a knot
      const kx = r() * w, ky = y + ph * (0.3 + r() * 0.4);
      for (let q = 0; q < 4; q++) { g.strokeStyle = `rgba(20,8,2,${0.12 - q * 0.02})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(kx, ky, 10 + q * 7, 3 + q * 2.2, 0, 0, TAU); g.stroke(); }
    }
    y += ph; k++;
  }
  return c;
}

const PAGES = {
  L: { ot: [252, 764], gt: [540, 784], ob: [208, 1004], gb: [540, 1024], bulge: 16 },
  R: { ot: [828, 764], gt: [540, 784], ob: [872, 1004], gb: [540, 1024], bulge: 16 },
};
function pagePoint(P, u, v) {
  const tx = lerp(P.ot[0], P.gt[0], u), ty = lerp(P.ot[1], P.gt[1], u);
  const bx = lerp(P.ob[0], P.gb[0], u), by = lerp(P.ob[1], P.gb[1], u);
  return [lerp(tx, bx, v), lerp(ty, by, v) - P.bulge * Math.sin(Math.PI * Math.pow(u, 0.8))];
}
function pagePath(c, P, dy = 0) {
  c.beginPath();
  for (let i = 0; i <= 24; i++) { const [x, y] = pagePoint(P, i / 24, 0); i ? c.lineTo(x, y + dy) : c.moveTo(x, y + dy); }
  for (let i = 24; i >= 0; i--) { const [x, y] = pagePoint(P, i / 24, 1); c.lineTo(x, y + dy); }
  c.closePath();
}

// ---------------------------------------------------------------------------
//  5. TIME PASSES QUICKLY - brass pocket watch; hands speed up until they blur
// ---------------------------------------------------------------------------
// Tick rate is 2 per second, then grows exponentially; everything stops dead at `stop`.
const WATCH = { f0: 2, t1: 1.4, a: 4.2, stop: 3.95, cx: 540, cy: 770 };
function watchRate(lt) { const { f0, t1, a, stop } = WATCH; return lt >= stop ? 0 : lt < t1 ? f0 : f0 * Math.exp(a * (lt - t1)); }
function watchTicks(lt) {                            // elapsed "watch seconds" = ticks
  const { f0, t1, a, stop } = WATCH, t = Math.min(lt, stop);
  return t < t1 ? f0 * t : f0 * t1 + (f0 / a) * (Math.exp(a * (t - t1)) - 1);
}
function watchAngles(lt) {                           // degrees from 12 o'clock, clockwise
  const n = watchTicks(lt), rate = watchRate(lt);

function drawHand(c, kind, deg) {

// motion blur: draw the hand many times across the angle swept while the "shutter" is open

  const sweep = Math.abs(a1 - a0);

function buildChestFront(seed) {                               // planks, straps, brackets and studs (static)

function drawLid(c, alpha) {
  const N = 18, a = alpha * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const rot = ([z, y]) => { const vz = z - CH.D, vy = y - CH.Hb; return [CH.D + vz * ca + vy * sa, CH.Hb - vz * sa + vy * ca]; };
  const pts = [];
  for (let i = 0; i <= N; i++) { const f = i / N * Math.PI; pts.push(rot([CH.D / 2 - CH.D / 2 * Math.cos(f), CH.Hb + CH.hL * Math.sin(f)])); }
  const strips = [];
  for (let i = 0; i < N; i++) {
    const [z0, y0] = pts[i], [z1, y1] = pts[i + 1], dz = z1 - z0, dy = y1 - y0, l = Math.hypot(dz, dy);
    const n = [-dy / l, dz / l], facing = n[0] * CH_VIEW[0] + n[1] * CH_VIEW[1];
    const lit = facing > 0 ? n[0] * CH_LIGHT[0] + n[1] * CH_LIGHT[1] : -(n[0] * CH_LIGHT[0] + n[1] * CH_LIGHT[1]);
    strips.push({ s0: chY(y0, z0), s1: chY(y1, z1), depth: (z0 + z1) / 2 * CH.cy - (y0 + y1) / 2 * CH.sz, outer: facing > 0, lit, i });
  }
  strips.sort((p, q) => q.depth - p.depth);
  for (const s of strips) {
    const top = Math.min(s.s0, s.s1), hgt = Math.abs(s.s1 - s.s0) + 0.8;
    const k = 0.18 + 0.82 * Math.pow(clamp(s.lit), 1.6);
    const wood = s.outer ? mix([46, 22, 10], [150, 86, 44], k) : mix([20, 9, 5], [84, 44, 24], k);
    c.fillStyle = rgba(wood); c.fillRect(CH.x0, top, CH.x1 - CH.x0, hgt);
    if (s.outer && s.i % 4 === 0) { c.fillStyle = 'rgba(15,6,2,0.45)'; c.fillRect(CH.x0, top, CH.x1 - CH.x0, Math.min(2, hgt)); }
    const metal = rgba(mix([30, 26, 22], [120, 108, 94], k));
    c.fillStyle = metal;
    for (const sx of [CH.x0 + 44, CH.x1 - 72]) c.fillRect(sx, top, 28, hgt);
    if (!s.outer) { c.fillStyle = 'rgba(120,20,30,0.25)'; c.fillRect(CH.x0 + 14, top, CH.x1 - CH.x0 - 28, hgt); }   // faded lining
  }
  const e = pts[0];                                            // highlight on the front lip
  c.fillStyle = 'rgba(255,200,140,0.25)'; c.fillRect(CH.x0, chY(e[1], e[0]) - 1, CH.x1 - CH.x0, 2);
  const h0 = rot([-3, CH.Hb]), h1 = rot([-3, CH.Hb - 64]);   // hasp plate rides with the lid
  const ha = chY(h0[1], h0[0]), hb = chY(h1[1], h1[0]);
  c.fillStyle = vGrad(c, Math.min(ha, hb), Math.max(ha, hb), [[0, hex('#6d5f50')], [1, hex('#2e2620')]]);
  c.fillRect(520, Math.min(ha, hb), 40, Math.abs(hb - ha));
  c.fillStyle = 'rgba(255,235,200,0.3)'; c.fillRect(520, Math.min(ha, hb), 2, Math.abs(hb - ha));
}

function drawPadlock(c, x, y, rot, pop, crack, lt) {         // (x, y) = top centre of the lock body
  c.save(); c.translate(x, y); c.rotate(rot);
  c.lineWidth = 8; c.lineCap = 'round';                     // shackle
  c.strokeStyle = (() => { const g = c.createLinearGradient(-20, -40, 20, 0); g.addColorStop(0, '#fff0b5'); g.addColorStop(0.5, '#c99a3c'); g.addColorStop(1, '#6a4510'); return g; })();
  c.beginPath(); c.moveTo(-17, 4 - pop); c.lineTo(-17, -16 - pop); c.arc(0, -16 - pop, 17, Math.PI, 0); c.lineTo(17, 6); c.stroke();
  const g = c.createLinearGradient(-34, 0, 34, 76);         // gold body
  g.addColorStop(0, '#fff1b8'); g.addColorStop(0.3, '#e7b850'); g.addColorStop(0.7, '#a8761f'); g.addColorStop(1, '#5c3a0b');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(-34, 4); c.lineTo(34, 4); c.lineTo(34, 44); c.quadraticCurveTo(34, 76, 0, 78); c.quadraticCurveTo(-34, 76, -34, 44); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(90,55,10,0.8)'; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = 'rgba(255,250,220,0.5)'; c.fillRect(-28, 8, 5, 40);   // highlight
  c.fillStyle = '#3a2408'; c.beginPath(); c.arc(0, 36, 6.5, 0, TAU); c.fill(); c.fillRect(-2.5, 36, 5, 16);   // keyhole
  if (crack > 0) {                                            // the crack splits the body
    const P = [[-34, 18], [-16, 28], [-6, 22], [6, 40], [16, 36], [34, 52]], n = 1 + Math.ceil(crack * (P.length - 1));
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(255,245,200,0.7)'; c.lineWidth = 2; c.beginPath(); P.slice(0, n).forEach(([px, py], i) => (i ? c.lineTo(px, py + 2) : c.moveTo(px, py + 2))); c.stroke();
    c.strokeStyle = '#2a1504'; c.lineWidth = 3; c.beginPath(); P.slice(0, n).forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py))); c.stroke();
  }
  c.restore();
}

// ---------------------------------------------------------------------------
//  8. NO ONE TAKES CHARITY - an open hand holds out coins; they pile up and spill
// ---------------------------------------------------------------------------
const COIN_G = 2800, COIN_V0 = 300;
const PALM_BASE = [[430, 876], [470, 889], [540, 895], [600, 889], [650, 880], [700, 866], [735, 848]];
const palmY = x => {
  for (let i = 0; i < PALM_BASE.length - 1; i++) {
    const [x0, y0] = PALM_BASE[i], [x1, y1] = PALM_BASE[i + 1];
    if (x <= x1) return lerp(y0, y1, clamp((x - x0) / (x1 - x0)));
  }
  return PALM_BASE[PALM_BASE.length - 1][1];
};

function simulateCoins(seed) {                       // deterministic pile: every coin's path is precomputed
  const r = mulberry32(seed), X0 = 440, BW = 10, NB = 30, bins = new Float32Array(NB), coins = [];
  const heightAt = x => { const k = Math.round((x - X0) / BW); let h = 0; for (let j = k - 1; j <= k + 1; j++) if (j >= 0 && j < NB) h = Math.max(h, bins[j]); return h; };
  const place = (x, h) => { const k = Math.round((x - X0) / BW); for (let j = k - 3; j <= k + 3; j++) if (j >= 0 && j < NB) bins[j] = Math.max(bins[j], h - Math.abs(j - k) * 3.2); };
  const cap = x => 96 - 0.9 * Math.abs(x - 572);
  const land = (tl, x) => {
    const h = heightAt(x), y = palmY(x) - h - 4 + (r() - 0.5) * 4, coin = { tl, x, y, rot: (r() - 0.5) * 0.3, spin: 6 + r() * 10, drift: (r() - 0.5) * 60, spill: false };
    if (h + 7 > cap(x) || x > 712) {                 // no room: it tumbles off the pile to the ground
      const dir = x > 560 || r() < 0.7 ? 1 : -1;
      coin.spill = true; coin.vx = dir * (170 + r() * 170); coin.vy = -(120 + r() * 120);
      coin.yg = 1036 + r() * 28;
      const dyg = coin.yg - y, tg = (-coin.vy + Math.sqrt(coin.vy * coin.vy + 2 * COIN_G * dyg)) / COIN_G;
      coin.tg = tl + tg; coin.xg = x + coin.vx * tg;
    } else place(x, h + 7);
    coins.push(coin);
  };
  for (const x of [520, 560, 600, 545, 585, 565]) land(-1, x);          // already in the hand at the start
  let t = 1.05, dt = 0.26;
  while (t < 3.75) { land(t, 572 + (r() + r() - 1) * 125); dt = Math.max(0.034, dt * 0.88); t += dt; }
  return coins;
}

function drawCoin(c, x, y, rot, flat, a = 1) {        // flat: 1 = lying flat, 0 = edge-on
  const rx = 30;
  c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = a;
  const ryy = Math.max(2.5, 11 * flat + (1 - flat) * 2.5);
  c.fillStyle = '#6e4810'; c.beginPath(); c.ellipse(0, 4.5, rx, ryy, 0, 0, TAU); c.fill();      // thickness
  const g = c.createLinearGradient(-rx, -ryy, rx, ryy);
  g.addColorStop(0, '#fff3c0'); g.addColorStop(0.35, '#f0c45c'); g.addColorStop(0.75, '#b98424'); g.addColorStop(1, '#7a520f');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, rx, ryy, 0, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(120,80,15,0.7)'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(0, 0, rx * 0.72, ryy * 0.72, 0, 0, TAU); c.stroke();
  c.fillStyle = 'rgba(255,250,225,0.55)'; c.beginPath(); c.ellipse(-rx * 0.3, -ryy * 0.3, rx * 0.32, ryy * 0.22, -0.2, 0, TAU); c.fill();
  c.restore();
}

function coinState(k, lt) {                          // position of coin k at local time lt
  if (lt < k.tl) {                                   // falling into the frame
    const tau = k.tl - lt, y = k.y - COIN_V0 * tau - 0.5 * COIN_G * tau * tau;
    return { x: k.x + k.drift * tau, y, rot: k.spin * tau * 0.15, flat: Math.abs(Math.cos(k.spin * tau)), air: true };
  }
  if (!k.spill) {
    const b = lt - k.tl, hop = b < 0.14 ? Math.sin(b / 0.14 * Math.PI) * 9 : 0;
    return { x: k.x, y: k.y - hop, rot: k.rot * (1 - clamp(b / 0.2)) + k.rot * 0.3, flat: 1, air: false };
  }
  if (lt < k.tg) {                                   // spilling over the edge
    const b = lt - k.tl;
    return { x: k.x + k.vx * b, y: k.y + k.vy * b + 0.5 * COIN_G * b * b, rot: b * 6 * Math.sign(k.vx), flat: Math.abs(Math.cos(b * 9)), air: true };
  }
  const b = lt - k.tg, hop = b < 0.12 ? Math.sin(b / 0.12 * Math.PI) * 7 : 0;
  return { x: k.xg, y: k.yg - hop, rot: 0.05, flat: 1, air: false, ground: true };
}

function handPath(c) {
  c.beginPath();
  c.moveTo(-20, 905);
  c.bezierCurveTo(80, 900, 160, 895, 230, 892);
  c.bezierCurveTo(270, 890, 300, 880, 330, 860);

  c.bezierCurveTo(440, 818, 458, 832, 452, 846);
  c.bezierCurveTo(448, 858, 430, 866, 425, 875);
  c.bezierCurveTo(470, 892, 540, 898, 600, 888);
  c.bezierCurveTo(650, 880, 700, 866, 735, 846);
  c.bezierCurveTo(752, 836, 770, 838, 772, 850);
  c.bezierCurveTo(774, 866, 752, 880, 722, 892);
  c.bezierCurveTo(680, 912, 620, 930, 540, 936);
  c.bezierCurveTo(440, 944, 330, 950, 230, 952);
  c.bezierCurveTo(160, 954, 80, 958, -20, 962);
  c.closePath();
}

function drawGoldMountain(c, px, py, alpha = 1, lt = 0) {

    c.strokeStyle = `rgba(255,236,180,${0.22 + 0.2 * v})`; c.lineWidth = 1.2; c.stroke();

      drawDot(c, x, y, (46 + 50 * flash) * pulse, [255, 110, 55], (0.32 + 0.4 * flash) * a);
      drawDot(c, x, y, (16 + 14 * flash) * pulse, [255, 215, 170], (0.7 + 0.3 * flash) * a);
      c.fillStyle = `rgba(255,246,228,${a})`; c.beginPath(); c.arc(x, y, 5.5 + 2 * flash, 0, TAU); c.fill();
    }
    const t9 = tenTime(9);                                        // the circle is complete: a soft wave
    if (lt > t9) {
      const u = clamp((lt - t9) / 0.9);
      c.strokeStyle = `rgba(255,170,120,${0.35 * (1 - u)})`; c.lineWidth = 3 * (1 - u) + 0.5;
      c.beginPath(); c.arc(cx, cy, R + u * 160, 0, TAU); c.stroke();
    }
    drawDust(c, D.embers, lt, [255, 120, 70], 0.55);
  },
  cues: S => [...Array(10).keys()].map(k => ({ type: 'thump', t: +(S.start + tenTime(k)).toFixed(5), k })),
};

// ---------------------------------------------------------------------------
//  12. SUN FROM THE WEST - light starts on the West side; the sun rises there
// ---------------------------------------------------------------------------
const SUN = { x: 300, hor: 905, from: 975, to: 640, r: 62, cx: 540, cy: 1010, rx: 292, ry: 84 };
const sunRise = lt => easeInOut(inv(1.3, 6.0, lt));
const sunLight = lt => clamp(0.55 * sstep(0.2, 1.7, lt) + 0.45 * sunRise(lt));

function drawCompass(c, L) {
  const { cx, cy, rx, ry } = SUN, k = ry / rx;
  softShadow(c, cx + 60 + 160 * (1 - L), cy + 10, rx * (1.05 + 0.5 * (1 - L)), ry * 1.1, 0.25 + 0.45 * L);   // long shadow to the East
  c.save();
  c.translate(cx, cy); c.scale(1, k);
  const rim = c.createLinearGradient(-rx, 0, rx, 0);              // brass rim lit from the West
  rim.addColorStop(0, rgba(mix([120, 80, 30], [255, 220, 140], L))); rim.addColorStop(0.5, '#6a4a1c'); rim.addColorStop(1, '#2c1d0a');
  c.fillStyle = rim; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
  const face = c.createRadialGradient(-rx * 0.3, 0, 10, 0, 0, rx * 0.9);
  face.addColorStop(0, rgba(mix([60, 52, 44], [190, 160, 120], L))); face.addColorStop(1, rgba(mix([28, 24, 20], [92, 72, 50], L)));
  c.fillStyle = face; c.beginPath(); c.arc(0, 0, rx * 0.88, 0, TAU); c.fill();
  c.strokeStyle = rgba(mix([120, 90, 50], [255, 220, 150], L), 0.7); c.lineWidth = 3;
  c.beginPath(); c.arc(0, 0, rx * 0.8, 0, TAU); c.stroke();
  for (let i = 0; i < 32; i++) {                                  // degree ticks
    const a = i / 32 * TAU, r0 = rx * (i % 4 ? 0.75 : 0.7);
    c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * rx * 0.8, Math.sin(a) * rx * 0.8); c.lineWidth = i % 4 ? 2 : 4; c.stroke();
  }
  const pt = (a, len, wid, col) => {                              // compass rose point
    c.fillStyle = col; c.beginPath(); c.moveTo(Math.cos(a) * len, Math.sin(a) * len);
    c.lineTo(Math.cos(a + Math.PI / 2) * wid, Math.sin(a + Math.PI / 2) * wid); c.lineTo(Math.cos(a - Math.PI / 2) * wid, Math.sin(a - Math.PI / 2) * wid); c.closePath(); c.fill();
  };
  for (let i = 0; i < 4; i++) pt(Math.PI / 4 + i * Math.PI / 2, rx * 0.42, 14, rgba(mix([70, 55, 35], [170, 130, 80], L)));
  for (let i = 0; i < 4; i++) pt(i * Math.PI / 2, rx * 0.6, 22, rgba(mix([90, 70, 40], [230, 190, 120], L * (i === 2 ? 1 : 0.7))));
  c.fillStyle = '#20150a'; c.beginPath(); c.arc(0, 0, 12, 0, TAU); c.fill();
  c.restore();
  c.save();                                                       // labels (letters lie on the ground plane)
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const lab = (t, x, y, size, a, col) => { c.save(); c.translate(x, y); c.scale(1, 0.72); c.font = `700 ${size}px ${FONT_SERIF}`; c.fillStyle = rgba(col, a); c.fillText(t, 0, 0); c.restore(); };
  if (L > 0.05) glow(c, cx - rx * 0.68, cy, 90, [255, 200, 120], 0.3 * L, 0.6);
  lab('W', cx - rx * 0.68, cy, 60, 0.7 + 0.3 * L, mix([215, 185, 135], [255, 240, 200], L));
  lab('E', cx + rx * 0.68, cy, 56, 0.62, [190, 170, 140]);
  lab('N', cx, cy - ry * 0.62, 26, 0.5 + 0.2 * L, [180, 160, 130]);
  lab('S', cx, cy + ry * 0.66, 26, 0.5 + 0.2 * L, [180, 160, 130]);
  c.restore();
}

SCENE_DEFS.sun = {
  look: { focusY: 820, scrim: 0.3 },
  init(S) {
    const D = S.data, r = mulberry32(1201);
    D.stars = makeStars(1202, 160, 0, 900);
    D.dust = makeDust(1203, 24, { x0: 60, y0: 380, x1: 1020, y1: 1100 });
    D.hills = makeRidge(1204, 902, 8, 4);
    D.stones = Array.from({ length: 16 }, () => ({ x: 60 + r() * 960, y: 930 + r() * 150, s: 3 + r() * 7 })).filter(p => Math.hypot((p.x - 540) / 320, (p.y - 1010) / 100) > 1.1);
  },
  draw(c, lt, dur, S) {
    const D = S.data, L = sunLight(lt), rise = sunRise(lt), sy = lerp(SUN.from, SUN.to, rise);
    c.fillStyle = vGrad(c, 0, SUN.hor, [[0, hex('#04061a')], [0.6, hex('#0d1030')], [1, hex('#231a3a')]]);
    c.fillRect(0, 0, W, SUN.hor);
    drawStars(c, D.stars, lt, 1 - 0.85 * L);
    glow(c, SUN.x, SUN.hor, 1050, [255, 120, 50], 0.06 + 0.42 * L);      // light starts on the WEST side
    glow(c, SUN.x, SUN.hor, 520, [255, 170, 90], 0.04 + 0.34 * L, 0.5);
    glow(c, 860, 760, 520, [20, 30, 80], 0.25, 1, 'source-over');        // the East stays dark
    if (sy - SUN.r < SUN.hor) {                                            // the sun, rising slowly in the West
      c.save(); c.beginPath(); c.rect(0, 0, W, SUN.hor); c.clip();
      c.save(); c.globalCompositeOperation = 'screen'; c.translate(SUN.x, sy);
      for (let i = 0; i < 14; i++) {                                       // soft rays
        const a = i / 14 * TAU + lt * 0.05, len = 520 + 140 * Math.sin(i * 2.3);
        const g = c.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
        g.addColorStop(0, `rgba(255,200,130,${0.11 * rise})`); g.addColorStop(1, 'rgba(255,200,130,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(0, 0);
        c.lineTo(Math.cos(a - 0.07) * len, Math.sin(a - 0.07) * len); c.lineTo(Math.cos(a + 0.07) * len, Math.sin(a + 0.07) * len); c.closePath(); c.fill();
      }
      c.restore();
      glow(c, SUN.x, sy, 300, [255, 190, 110], 0.55);
      const sg = c.createRadialGradient(SUN.x - 12, sy - 12, 4, SUN.x, sy, SUN.r);
      sg.addColorStop(0, '#fffdf2'); sg.addColorStop(0.55, '#ffe9a6'); sg.addColorStop(1, '#ffad55');
      c.fillStyle = sg; c.beginPath(); c.arc(SUN.x, sy, SUN.r, 0, TAU); c.fill();
      c.restore();
    }
    c.fillStyle = '#100c18'; ridgePath(c, D.hills); c.fill();
    ridgeStroke(c, D.hills, [255, 170, 100], 0.15 + 0.5 * L, 2);
    c.fillStyle = vGrad(c, SUN.hor, 1620, [[0, hex('#2a2030')], [0.15, hex('#17121d')], [1, hex('#030205')]]);
    c.fillRect(0, SUN.hor + 4, W, 1920 - SUN.hor);
    glow(c, 230, SUN.hor + 40, 760, [255, 150, 80], 0.26 * L, 0.3);       // warm light raking in from the West
    glow(c, 330, SUN.hor + 90, 420, [255, 180, 110], 0.12 * L, 0.35);
    for (const p of D.stones) {                                            // shadows stretch towards the East
      const len = p.s * (3 + 14 * (1 - rise)) * L;
      c.fillStyle = `rgba(0,0,0,${0.45 * L})`; c.beginPath(); c.ellipse(p.x + len / 2, p.y + 1, len / 2 + p.s, p.s * 0.35, 0, 0, TAU); c.fill();
      c.fillStyle = rgba(mix([40, 32, 30], [150, 110, 80], L)); c.beginPath(); c.ellipse(p.x, p.y - p.s * 0.3, p.s, p.s * 0.6, 0, 0, TAU); c.fill();
    }
    drawCompass(c, L);
    drawDust(c, D.dust, lt, [255, 200, 150], 0.4 + 0.4 * L);
  },
  cues: S => [{ type: 'swell', t: S.start + 0.2, end: S.end }],
};

// ---------------------------------------------------------------------------
//  13. ENDING - black, faint stars
// ---------------------------------------------------------------------------
SCENE_DEFS.end = {
  look: { focusY: 800, scrim: 0.2 },
  init(S) {
    S.data.stars = makeStars(1301, 240, 0, 1040);
    S.data.moon = buildMoon(60);
    S.data.dust = makeDust(1302, 18, { x0: 60, y0: 380, x1: 1020, y1: 1100 });
  },
  draw(c, lt, dur, S) {
    const D = S.data;
    c.fillStyle = vGrad(c, 0, 1920, [[0, hex('#020208')], [0.55, hex('#05050d')], [1, hex('#010103')]]);
    c.fillRect(0, 0, W, H);
    glow(c, 540, 820, 700, [90, 100, 170], 0.07);
    drawStars(c, D.stars, lt, 0.55);
    c.save(); c.globalAlpha = 0.32; c.shadowColor = 'rgba(210,220,255,0.8)'; c.shadowBlur = 30;   // faint crescent, like the title
    c.drawImage(D.moon, 540 - D.moon.width / 2, 700 - D.moon.height / 2); c.restore();
    c.fillStyle = 'rgba(160,170,220,0.06)'; c.fillRect(0, 1040, W, 1.5);
    drawDust(c, D.dust, lt, [200, 210, 255], 0.35);
  },
  cues: S => [{ type: 'endAir', t: S.start, end: S.end }],
};
// ============================================================================
//  TIMELINE (text and sources exactly as specified)
// ============================================================================
const TITLE_KICKER = 'As told by Prophet Muhammad ﷺ';
const TITLE_TEXT = 'Signs before the Last Day';
const SCENES = [
  { id: 'title',     start: 0,    end: 4 },
  { id: 'towers',    start: 4,    end: 8.5,  text: 'Shepherds will compete in building tall towers', source: 'SAHIH AL-BUKHARI 50' },
  { id: 'knowledge', start: 8.5,  end: 13,   text: 'Knowledge will be taken away', source: 'SAHIH AL-BUKHARI 1036' },
  { id: 'quake',     start: 13,   end: 17.5, text: 'Earthquakes will increase', source: 'SAHIH AL-BUKHARI 1036' },
  { id: 'time',      start: 17.5, end: 22,   text: 'Time will pass quickly', source: 'SAHIH AL-BUKHARI 1036' },
  { id: 'mosque',    start: 22,   end: 26.5, text: 'People will boast about their mosques', source: 'SUNAN ABI DAWUD 449' },
  { id: 'trust',     start: 26.5, end: 31,   text: 'Trust will be lost', source: 'SAHIH AL-BUKHARI 59' },
  { id: 'charity',   start: 31,   end: 35.5, text: 'Wealth will overflow, and no one will take charity', source: 'SAHIH MUSLIM 157' },
  { id: 'green',     start: 35.5, end: 40,   text: 'Arabia will become green with rivers', source: 'SAHIH MUSLIM 157' },
  { id: 'gold',      start: 40,   end: 44.5, text: 'The Euphrates will uncover a mountain of gold', source: 'SAHIH AL-BUKHARI 7119' },
  { id: 'ten',       start: 44.5, end: 49,   text: 'Then the 10 great signs will come', source: 'SAHIH MUSLIM 2901' },
  { id: 'sun',       start: 49,   end: 55,   text: 'The sun will rise from the West',
    second: 'Then faith will not help anyone who did not believe before', source: 'SAHIH AL-BUKHARI 4635' },
  { id: 'end',       start: 55,   end: 60,   text: 'Repent before the sun rises from the West', source: 'SAHIH MUSLIM 2703',
    typeStart: 0.3, text2: 'May Allah protect us. Ameen', text2At: 2.8 },
];

function prepareText() {
  for (const S of SCENES) {
    if (S.id === 'title') {
      S.kicker = layoutRuns([
        { text: 'As told by Prophet Muhammad ', font: `italic 500 40px ${FONT_SERIF}` },
        { text: 'ﷺ', font: '54px "Amiri", serif', dy: -1 },
      ], 1082);
      S.titleBlock = layoutBlock(TITLE_TEXT, 80, 1172);
      continue;
    }
    S.t0 = S.typeStart ?? TYPE.start;
    S.block = layoutBlock(S.text, 64, TEXT_Y);
    S.typedEnd = typedEnd(S.block, S.t0);
    if (S.second) {
      S.secondBlock = layoutBlock(S.second, 46, S.block.lastY + 92, { lineH: 58 });
      S.secondAt = S.typedEnd + 1.5;                // appears 1.5 s after the main line is finished
      S.src = layoutSource(S.source, S.secondBlock.lastY + 66);
    } else {
      S.src = layoutSource(S.source, S.block.lastY + 72);
    }
    if (S.text2) S.block2 = layoutBlock(S.text2, 64, TEXT_Y);
  }
}

function drawSceneText(c, S, lt) {
  if (S.id === 'title') {                            // visible from the very first frame (cover)
    drawRuns(c, S.kicker, 0.9);
    drawTyped(c, S.titleBlock, lt, null, 1);
    const w = 150, y = 1250, a = 0.55;               // small ornament under the title
    c.save();
    c.globalAlpha = a; c.strokeStyle = rgba([217, 180, 106], 1); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(540 - w, y); c.lineTo(540 - 14, y); c.moveTo(540 + 14, y); c.lineTo(540 + w, y); c.stroke();
    c.fillStyle = rgba([217, 180, 106], 1);
    c.beginPath(); c.moveTo(540, y - 6); c.lineTo(546, y); c.lineTo(540, y + 6); c.lineTo(534, y); c.closePath(); c.fill();
    c.restore();
    return;
  }
  if (S.id === 'end') {
    const out = 1 - sstep(S.text2At - 0.2, S.text2At, lt);    // text 1 gives way to text 2 at 2.8 s
    drawTyped(c, S.block, lt, S.t0, out);
    drawSource(c, S.src, sstep(S.typedEnd + 0.03, S.typedEnd + 0.28, lt) * out);
    drawTyped(c, S.block2, lt, S.text2At, 1);
    return;
  }
  drawTyped(c, S.block, lt, S.t0, 1);
  if (S.secondBlock) {
    const a = sstep(S.secondAt, S.secondAt + 0.6, lt);
    drawTyped(c, S.secondBlock, lt, null, a);
    drawSource(c, S.src, sstep(S.secondAt + 0.7, S.secondAt + 1.2, lt));
  } else {
    drawSource(c, S.src, sstep(S.typedEnd + 0.1, S.typedEnd + 0.6, lt));
  }
}

// ============================================================================
//  RENDER: draws the exact frame for time t (seconds). Pure function of t.
// ============================================================================
function sceneIndexAt(t) {
  for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].start) return i;
  return 0;
}

function render(t) {
  t = clamp(t, 0, DURATION - 1e-9);
  const i = sceneIndexAt(t), S = SCENES[i], dur = S.end - S.start, lt = t - S.start;
  const def = SCENE_DEFS[S.id], look = def.look || {};
  const frame = Math.round(t * FPS);
  const c = ctx;
  c.setTransform(RS, 0, 0, RS, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);

  // scene layer with a very slow camera push-in (1.00 -> 1.04)
  c.save();
  const z = 1 + 0.04 * (lt / dur), fy = look.focusY ?? 800;
  c.translate(540, fy); c.scale(z, z); c.translate(-540, -fy);
  def.draw(c, lt, dur, S);
  paperTexture(c, look.paper ?? 0.55);
  c.restore();

  vignette(c, look.vignette ?? 0.72);
  textScrim(c, look.scrim ?? 0.3);
  drawSceneText(c, S, lt);

  const fin = i === 0 ? 1 : clamp(lt / FADE), fout = clamp((dur - lt) / FADE);
  const vis = smooth(Math.min(fin, fout));
  if (vis < 1) { c.fillStyle = `rgba(0,0,0,${1 - vis})`; c.fillRect(0, 0, W, H); }

  drawGrain(c, frame, look.grain ?? 0.2);
  drawPageName(c, i === SCENES.length - 1 ? smooth(fout) : 1);
}

// ============================================================================
//  AUDIO CUES: the sound track is built from the same timeline (see make_audio.py)
// ============================================================================
function getCues() {
  const cues = { fps: FPS, duration: DURATION, scenes: [], boundaries: [], ticks: [], events: [] };
  SCENES.forEach((S, i) => {
    cues.scenes.push({ id: S.id, start: S.start, end: S.end });
    if (i > 0) cues.boundaries.push(S.start);
    if (S.block) cues.ticks.push(...blockTicks(S.block, S.start + S.t0));
    if (S.block2) cues.ticks.push(...blockTicks(S.block2, S.start + S.text2At));
    const def = SCENE_DEFS[S.id];
    if (def.cues) for (const e of def.cues(S)) cues.events.push({ scene: S.id, ...e });
  });
  cues.ticks.sort((a, b) => a.t - b.t);
  return cues;
}

// ============================================================================
//  INIT + EXPORT API
// ============================================================================
const READY = (async () => {
  await Promise.all([
    document.fonts.load('64px "Patrick Hand"'),
    document.fonts.load('italic 500 30px "Cormorant Garamond"'),
    document.fonts.load('600 24px "Cormorant Garamond"'),
    document.fonts.load('54px "Amiri"', 'ﷺ'),
  ]);
  await document.fonts.ready;
  buildCaches();
  for (const S of SCENES) { S.data = {}; SCENE_DEFS[S.id].init?.(S); }
  prepareText();
  return true;
})();
window.reelReady = READY;
window.render = render;
window.getCues = getCues;
window.fontStatus = () => [...document.fonts].map(f => `${f.family} ${f.style} ${f.weight}: ${f.status}`);
window.renderFramePNG = i => { render(i / FPS); return canvas.toDataURL('image/png'); };
window.sceneAt = t => SCENES[sceneIndexAt(t)].id;

// ============================================================================
//  PREVIEW UI (Play + scrub bar). Hidden in export mode.
// ============================================================================
if (EXPORT) {
  document.body.classList.add('export');
} else {
  const $ = id => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), timeEl = $('time'), sceneEl = $('sceneName');
  const snd = $('snd'), muteEl = $('mute'), fastEl = $('fast');
  let playing = false, t = clamp(+(QS.get('t') || 0), 0, DURATION - 1 / FPS), last = 0, audioOK = false;
  snd.addEventListener('canplay', () => { audioOK = true; });
  snd.src = 'output/audio.m4a';            // made by build.sh (same sound as the MP4)
  snd.addEventListener('error', () => { audioOK = false; $('audioNote').style.display = 'block'; });
  const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')} / 1:00.00`;
  function show() {
    render(t);
    scrub.value = Math.min(TOTAL_FRAMES - 1, Math.round(t * FPS));
    timeEl.textContent = fmt(t);
    const i = sceneIndexAt(t);
    sceneEl.textContent = `Scene ${i + 1}/13 · ${SCENES[i].id} · frame ${Math.round(t * FPS)}`;
  }
  const useAudio = () => audioOK && !muteEl.checked;
  function loop(now) {
    if (!playing) return;
    if (useAudio() && !snd.paused) t = snd.currentTime; else t += (now - last) / 1000;
    last = now;
    if (t >= DURATION - 1 / FPS) { t = DURATION - 1 / FPS; pause(); }
    show();
    if (playing) requestAnimationFrame(loop);
  }
  function play() {
    if (t >= DURATION - 1 / FPS - 1e-6) t = 0;
    playing = true; playBtn.textContent = 'Pause'; last = performance.now();
    if (useAudio()) { snd.currentTime = t; snd.play().catch(() => {}); }
    requestAnimationFrame(loop);
  }
  function pause() { playing = false; playBtn.textContent = 'Play'; snd.pause(); }
  function seek(nt) { t = clamp(nt, 0, DURATION - 1 / FPS); if (audioOK) snd.currentTime = t; show(); }
  playBtn.onclick = () => (playing ? pause() : play());
  scrub.oninput = () => seek(+scrub.value / FPS);
  muteEl.onchange = () => { if (muteEl.checked) snd.pause(); else if (playing && audioOK) { snd.currentTime = t; snd.play().catch(() => {}); } };
  fastEl.onchange = () => { RS = fastEl.checked ? 0.5 : 1; canvas.width = W * RS; canvas.height = H * RS; show(); };
  $('snap').onclick = () => {
    const keep = RS; RS = 1; canvas.width = W; canvas.height = H; render(t);
    const a = document.createElement('a'); a.download = `frame_${String(Math.round(t * FPS)).padStart(4, '0')}.png`;
    a.href = canvas.toDataURL('image/png'); a.click();
    RS = keep; canvas.width = W * RS; canvas.height = H * RS; show();
  };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') { e.preventDefault(); pause(); seek(t + (e.shiftKey ? 1 : 1 / FPS)); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); pause(); seek(t - (e.shiftKey ? 1 : 1 / FPS)); }
  });
  READY.then(show);
}
