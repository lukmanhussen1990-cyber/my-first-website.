    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="360" fill="url(#win-sky)"/>
  <g fill="#ffffff" opacity=".92">
    <ellipse cx="120" cy="88" rx="70" ry="18"/><ellipse cx="160" cy="76" rx="42" ry="20"/>
