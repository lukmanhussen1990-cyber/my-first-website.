<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Men Walking in the Rain</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070c;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(180, 205, 235, .45);
    pointer-events: none;
    animation: fade 9s ease-out forwards;
  }
  @keyframes fade {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">click for lightning</div>

<script>
(() => {
  "use strict";

  const cv  = document.getElementById("scene");
  const ctx = cv.getContext("2d");

  let W = 0, H = 0, DPR = 1, groundY = 0, streetH = 0;
  let spawnDrips = false;      // only the solid pass sheds water, not the reflection
  let far = [], near = [], lamps = [], puddles = [];
  let skyGrad = null, streetGrad = null;
  let farW = 0, nearW = 0, lampW = 0, puddleW = 0;
  const rain = [], ripples = [], drips = [];

  // world scroll offsets, in pixels travelled to the left
  let offGround = 0, offNear = 0, offFar = 0;
  let flash = 0, flashQueue = 0, nextFlash = 4 + Math.random() * 6;
  let t = 0;

  const GROUND_SPEED = 108;   // px/s — the pace the two men walk at
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------------------------------------------------------------- setup */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    groundY = Math.round(H * 0.74);
    streetH = H - groundY;

    skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0.00, "#070a12");
    skyGrad.addColorStop(0.55, "#0d1320");
    skyGrad.addColorStop(1.00, "#1b2436");

    streetGrad = ctx.createLinearGradient(0, groundY, 0, H);
    streetGrad.addColorStop(0, "#0a0e16");
    streetGrad.addColorStop(0.35, "#0f1521");
    streetGrad.addColorStop(1, "#171f2d");

    buildCity();
    buildLamps();
    buildPuddles();
    buildRain();
  }

  function buildCity() {
    farW  = W + 500;
    nearW = W + 700;
    far = [];
    near = [];

    for (let x = 0; x < farW; ) {
      const w = rnd(50, 130);
      const h = rnd(H * 0.13, H * 0.34);
      const b = { x, w, h, win: [] };
      for (let wy = 12; wy < h - 14; wy += 20) {
        for (let wx = 8; wx < w - 12; wx += 16) {
          if (Math.random() < 0.38) {
            b.win.push({ x: wx, y: wy, w: 5, h: 8, hue: rnd(28, 46), p: Math.random() * 100 });
          }
        }
      }
      far.push(b);
      x += w + rnd(4, 22);
    }

    for (let x = 0; x < nearW; ) {
      const w = rnd(90, 200);
      const h = rnd(H * 0.20, H * 0.46);
      const b = { x, w, h, win: [] };
      for (let wy = 16; wy < h - 20; wy += 30) {
        for (let wx = 14; wx < w - 18; wx += 26) {
          if (Math.random() < 0.16) {
            b.win.push({ x: wx, y: wy, w: 7, h: 11, hue: rnd(24, 40), p: Math.random() * 100 });
          }
        }
      }
      near.push(b);
      x += w + rnd(10, 40);
    }
  }

  function buildLamps() {
    lampW = Math.max(430, W * 0.55);
    lamps = [];
    for (let x = 60; x < lampW; x += lampW / 2) lamps.push({ x, flick: Math.random() * 10 });
  }

  function buildPuddles() {
    puddleW = W + 400;
    puddles = [];
    const n = Math.round(puddleW / 150);
    for (let i = 0; i < n; i++) {
      const d = rnd(0.15, 1);
      puddles.push({
        x: rnd(0, puddleW),
        y: groundY + streetH * (0.12 + 0.82 * d),
        rx: rnd(28, 95) * (0.5 + d * 0.8),
        ry: rnd(4, 11) * (0.5 + d * 0.9)
      });
    }
  }

  function buildRain() {
    rain.length = 0;
    const n = Math.min(760, Math.round(W * 0.62));
    for (let i = 0; i < n; i++) rain.push(newDrop(Math.random() * H));
  }

  function newDrop(y) {
    const z = Math.pow(Math.random(), 0.75);     // 0 = far/faint, 1 = near/fast
    return {
      x: rnd(-160, W + 160),
      y: y === undefined ? rnd(-H, 0) : y,
      z,
      vy: 620 + z * 980,
      vx: -110 - z * 130,
      len: 9 + z * 30,
      k: (9 + z * 30) / Math.hypot(-110 - z * 130, 620 + z * 980)
    };
  }

  const landY = z => groundY + streetH * (0.05 + 0.98 * z);

  /* --------------------------------------------------------------- update */

  function update(dt) {
    t += dt;
    offGround = (offGround + GROUND_SPEED * dt);
    offNear   = (offNear   + GROUND_SPEED * 0.22 * dt);
    offFar    = (offFar    + GROUND_SPEED * 0.07 * dt);

    for (const d of rain) {
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (d.y >= landY(d.z)) {
        splash(d.x, landY(d.z), d.z);
        Object.assign(d, newDrop(rnd(-140, -10)));
      } else if (d.x < -200) {
        d.x += W + 360;
      }
    }

    for (let i = drips.length - 1; i >= 0; i--) {
      const p = drips[i];
      p.x += p.vx * dt;
      p.y += (p.vy += 1400 * dt) * dt;
      if (p.y >= p.land) {
        splash(p.x, p.land, 0.85);
        drips.splice(i, 1);
      }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += r.grow * dt;
      r.a -= dt * 1.5;
      r.x -= GROUND_SPEED * dt;
      if (r.a <= 0) ripples.splice(i, 1);
    }

    // lightning
    nextFlash -= dt;
    if (nextFlash <= 0) {
      flash = 1;
      flashQueue = Math.random() < 0.55 ? 1 : 0;
      nextFlash = rnd(7, 17);
    }
    if (flash > 0) {
      flash -= dt * 3.6;
      if (flash <= 0 && flashQueue > 0) { flash = 0.55; flashQueue--; }
      if (flash < 0) flash = 0;
    }
  }

  function splash(x, y, z) {
    if (ripples.length > 260) return;
    ripples.push({ x, y, r: 1, grow: 26 + z * 46, a: 0.10 + z * 0.30 });
  }

  function triggerFlash() { flash = 1; flashQueue = Math.random() < 0.5 ? 1 : 0; }

  /* ---------------------------------------------------------------- scene */

  function drawSky() {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, groundY + 2);

    if (flash > 0.02) {
      const f = ctx.createLinearGradient(0, 0, 0, groundY);
      f.addColorStop(0, `rgba(178,205,245,${0.30 * flash})`);
      f.addColorStop(1, `rgba(178,205,245,${0.06 * flash})`);
      ctx.fillStyle = f;
      ctx.fillRect(0, 0, W, groundY + 2);
    }

    // low, dragging cloud
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 3; i++) {
      const cx = ((t * (6 + i * 4) + i * W * 0.45) % (W + 700)) - 350;
      const cy = H * (0.10 + i * 0.07);
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.34);
      rg.addColorStop(0, "rgba(70,88,120,0.20)");
      rg.addColorStop(1, "rgba(70,88,120,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(cx - W * 0.34, cy - W * 0.34, W * 0.68, W * 0.68);
    }
    ctx.restore();
  }

  function drawBuildings(list, stripW, off, base, fill, winAlpha) {
    const shift = -(off % stripW);
    for (let pass = 0; pass < 2; pass++) {
      const ox = shift + pass * stripW;
      if (ox > W || ox + stripW < 0) continue;
      for (const b of list) {
        const x = ox + b.x;
        if (x > W + 40 || x + b.w < -40) continue;
        ctx.fillStyle = fill;
        ctx.fillRect(x, base - b.h, b.w, b.h);
        for (const w of b.win) {
          const fl = 0.55 + 0.45 * Math.sin(t * 0.7 + w.p);
          ctx.fillStyle = `rgba(255,${190 + w.hue}, 130, ${winAlpha * fl})`;
          ctx.fillRect(x + w.x, base - b.h + w.y, w.w, w.h);
        }
      }
    }
  }

  function drawStreet() {
    ctx.fillStyle = streetGrad;
    ctx.fillRect(0, groundY, W, streetH);

    // kerb line
    ctx.strokeStyle = "rgba(120,150,190,0.10)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY + streetH * 0.10);
    ctx.lineTo(W, groundY + streetH * 0.10);
    ctx.stroke();

    // puddles
    const shift = -(offGround % puddleW);
    ctx.save();
    for (let pass = 0; pass < 2; pass++) {
      for (const p of puddles) {
        const x = shift + pass * puddleW + p.x;
        if (x < -140 || x > W + 140) continue;
        const g2 = ctx.createLinearGradient(x, p.y - p.ry, x, p.y + p.ry);
        g2.addColorStop(0, "rgba(150,185,230,0.13)");
        g2.addColorStop(1, "rgba(90,120,165,0.04)");
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.ellipse(x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawLampGlow(x, y) {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 190);
    rg.addColorStop(0, `rgba(255,214,150,${0.34 + flash * 0.1})`);
    rg.addColorStop(0.35, "rgba(255,190,120,0.10)");
    rg.addColorStop(1, "rgba(255,180,110,0)");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, 190, 0, Math.PI * 2);
    ctx.fill();

    // light cone onto the street
    const gc = ctx.createLinearGradient(0, y, 0, groundY + streetH * 0.55);
    gc.addColorStop(0, "rgba(255,196,128,0.11)");
    gc.addColorStop(1, "rgba(255,196,128,0)");
    ctx.fillStyle = gc;
    ctx.beginPath();
    ctx.moveTo(x - 14, y);
    ctx.lineTo(x + 14, y);
    ctx.lineTo(x + 120, groundY + streetH * 0.55);
    ctx.lineTo(x - 120, groundY + streetH * 0.55);
    ctx.closePath();
    ctx.fill();
  }

  // returns on-screen lamp head positions, used to brighten nearby raindrops
  function drawLamps() {
    const heads = [];
    const shift = -(offGround % lampW);
    const baseY = groundY + streetH * 0.06;
    const poleH = Math.max(120, H * 0.26);

    for (let pass = 0; pass < 2; pass++) {
      for (const l of lamps) {
        const x = Math.round(shift + pass * lampW + l.x);
        if (x < -80 || x > W + 80) continue;
        const headY = baseY - poleH;
        heads.push({ x, y: headY });

        drawLampGlow(x, headY);

        ctx.strokeStyle = "#05070c";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x, headY + 14);
        ctx.stroke();

        ctx.fillStyle = "#05070c";
        ctx.beginPath();
        ctx.moveTo(x - 11, headY + 16);
        ctx.lineTo(x + 11, headY + 16);
        ctx.lineTo(x + 6, headY + 2);
        ctx.lineTo(x - 6, headY + 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = `rgba(255,222,168,${0.75 + 0.1 * Math.sin(t * 9 + l.flick)})`;
        ctx.beginPath();
        ctx.ellipse(x, headY + 12, 6, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // reflection of the lamp on the wet road
        const rg = ctx.createLinearGradient(x, baseY, x, H);
        rg.addColorStop(0, "rgba(255,200,130,0.20)");
        rg.addColorStop(1, "rgba(255,200,130,0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(x - 5, baseY);
        ctx.lineTo(x + 5, baseY);
        ctx.lineTo(x + 22, H);
        ctx.lineTo(x - 22, H);
        ctx.closePath();
        ctx.fill();
      }
    }
    return heads;
  }

  /* -------------------------------------------------------------- figures */

  function ik(ax, ay, bx, by, l1, l2, dir) {
    let dx = bx - ax, dy = by - ay;
    let d = Math.hypot(dx, dy) || 0.0001;
    const ux = dx / d, uy = dy / d;
    const max = (l1 + l2) * 0.995;
    if (d > max) d = max;
    const ex = ax + ux * d, ey = ay + uy * d;
    const a = (d * d + l1 * l1 - l2 * l2) / (2 * d);
    const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = ax + ux * a, my = ay + uy * a;
    return { jx: mx - uy * hh * dir, jy: my + ux * hh * dir, ex, ey };
  }

  function limb(ax, ay, jx, jy, ex, ey, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(jx, jy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  // one walking man, origin at his feet, facing right
  function figure(h, p, o, mode) {
    const dark = mode === "dark";
    const col  = dark ? "#04060b" : "rgba(150,190,236,0.30)";
    const grow = dark ? 0 : 1.3;
    ctx.strokeStyle = col;
    ctx.fillStyle   = col;

    const legLen = 0.455 * h;
    const A      = 0.150 * h;
    const bob    = 0.013 * h * Math.cos(2 * p);
    const hipY   = -legLen + bob;
    const shY    = hipY - 0.30 * h;
    const headR  = 0.072 * h;
    const headY  = shY - 0.085 * h;
    const lean   = -0.05;                        // slight forward hunch

    ctx.save();
    ctx.rotate(lean * 0.6);

    // --- back leg, back arm (dimmer when dark so limbs read separately)
    for (const side of [1, 0]) {
      const ph = p + side * Math.PI;
      const fx = -A * Math.cos(ph);
      const lift = Math.max(0, Math.sin(ph)) * 0.11 * h;
      const fy = hipY + legLen * 0.97 - lift;
      const k = ik(0, hipY, fx, fy, legLen / 2, legLen / 2, -1);

      if (dark) ctx.strokeStyle = side ? "#080b13" : "#04060b";
      limb(0, hipY, k.jx, k.jy, k.ex, k.ey, 0.072 * h + grow);

      // shoe
      ctx.beginPath();
      ctx.ellipse(k.ex + 0.020 * h, k.ey + 0.006 * h, 0.050 * h + grow * 0.4, 0.020 * h + grow * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = dark ? (side ? "#070a11" : "#04060b") : col;
      ctx.fill();
    }
    ctx.strokeStyle = col;
    ctx.fillStyle   = col;

    // --- coat
    const sway = 0.014 * h * Math.sin(p);
    const hem  = hipY + 0.13 * h;
    ctx.beginPath();
    ctx.moveTo(-0.088 * h - grow * 0.6, shY - 0.02 * h);
    ctx.quadraticCurveTo(-0.115 * h - grow, hipY, -0.108 * h + sway - grow, hem);
    ctx.quadraticCurveTo(0, hem + 0.022 * h, 0.100 * h + sway + grow, hem);
    ctx.quadraticCurveTo(0.118 * h + grow, hipY, 0.086 * h + grow * 0.6, shY - 0.02 * h);
    ctx.quadraticCurveTo(0, shY - 0.055 * h, -0.088 * h - grow * 0.6, shY - 0.02 * h);
    ctx.closePath();
    ctx.fill();

    // --- head + hat
    ctx.beginPath();
    ctx.arc(0.012 * h, headY, headR + grow * 0.5, 0, Math.PI * 2);
    ctx.fill();

    if (o.hat === "hood") {
      // a cowl over the crown, drawn back to a soft peak behind the neck
      ctx.beginPath();
      ctx.moveTo(0.082 * h + grow, headY + 0.030 * h);
      ctx.quadraticCurveTo(0.098 * h + grow, headY - 0.058 * h, 0.020 * h, headY - 0.098 * h - grow);
      ctx.quadraticCurveTo(-0.078 * h - grow, headY - 0.108 * h - grow, -0.112 * h - grow, headY - 0.005 * h);
      ctx.quadraticCurveTo(-0.098 * h - grow, headY + 0.072 * h + grow, -0.020 * h, headY + 0.066 * h);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.ellipse(0.006 * h, headY - headR * 0.85, headR * 1.55 + grow, headR * 0.30 + grow * 0.5, -0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0.012 * h, headY - headR * 1.35, headR * 0.86 + grow * 0.6, headR * 0.72 + grow * 0.6, -0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- scarf trailing in the wind
    if (o.scarf) {
      ctx.lineCap = "round";
      for (let i = 1; i <= 5; i++) {
        const u0 = (i - 1) / 5, u1 = i / 5;
        const pt = u => [-0.05 * h - u * 0.16 * h,
                         shY + 0.01 * h + u * 0.075 * h + Math.sin(t * 6 - u * 2.6) * 0.022 * h * u];
        ctx.lineWidth = (0.030 - 0.016 * u1) * h + grow * 0.8;
        ctx.beginPath();
        ctx.moveTo(...pt(u0));
        ctx.lineTo(...pt(u1));
        ctx.stroke();
      }
    }

    // --- arms
    const sx = 0.012 * h;
    if (o.umbrella) {
      // the holding arm, raised in front
      const hx = sx + 0.085 * h, hy = shY + 0.055 * h;
      const k = ik(sx, shY, hx, hy, 0.16 * h, 0.15 * h, 1);
      limb(sx, shY, k.jx, k.jy, k.ex, k.ey, 0.058 * h + grow);
      umbrella(hx, hy, h, o.tilt, mode, o.id);
    } else {
      const ph = p + Math.PI;
      const hx = sx + 0.085 * h * -Math.cos(ph) * 0.9;
      const hy = shY + 0.30 * h - Math.abs(Math.sin(ph)) * 0.02 * h;
      const k = ik(sx, shY, hx, hy, 0.16 * h, 0.15 * h, 1);
      limb(sx, shY, k.jx, k.jy, k.ex, k.ey, 0.058 * h + grow);
    }

    // near arm always swings
    {
      const ph = p;
      const hx = sx + 0.09 * h * -Math.cos(ph) * 0.9;
      const hy = shY + 0.30 * h - Math.abs(Math.sin(ph)) * 0.02 * h;
      const k = ik(sx, shY, hx, hy, 0.16 * h, 0.15 * h, 1);
      if (dark) ctx.strokeStyle = "#04060b";
      limb(sx, shY, k.jx, k.jy, k.ex, k.ey, 0.062 * h + grow);
    }

    ctx.restore();
  }

  function umbrella(hx, hy, h, tilt, mode, id) {
    const dark = mode === "dark";
    const col  = dark ? "#04060b" : "rgba(150,190,236,0.30)";
    const grow = dark ? 0 : 1.3;
    const r    = 0.36 * h;

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(tilt + Math.sin(t * 1.6 + id) * 0.02);

    ctx.strokeStyle = col;
    ctx.fillStyle   = col;

    // shaft
    ctx.lineWidth = 0.016 * h + grow * 0.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0.05 * h);
    ctx.lineTo(0, -0.40 * h);
    ctx.stroke();

    // canopy: scalloped rim, domed top
    // rim reads as an ellipse seen edge-on: lowest in the middle, rising to the tips
    const cy = -0.40 * h;
    const seg = 4;
    const rimY = u => cy + 0.26 * r * (1 - u * u);
    ctx.beginPath();
    ctx.moveTo(-r - grow, rimY(-1));
    for (let i = 0; i < seg; i++) {
      const u0 = -1 + (2 * i) / seg, u1 = -1 + (2 * (i + 1)) / seg;
      const x0 = u0 * r, x1 = u1 * r;
      ctx.quadraticCurveTo((x0 + x1) / 2, (rimY(u0) + rimY(u1)) / 2 - 0.15 * r, x1, rimY(u1));
    }
    ctx.bezierCurveTo(r * 0.80, cy - 0.66 * r - grow, -r * 0.80, cy - 0.66 * r - grow, -r - grow, rimY(-1));
    ctx.closePath();
    ctx.fill();

    // ferrule
    ctx.lineWidth = 0.014 * h + grow * 0.4;
    ctx.beginPath();
    ctx.moveTo(0, cy - 0.52 * r);
    ctx.lineTo(0, cy - 0.74 * r);
    ctx.stroke();

    if (dark) {
      // wet highlight along the top of the canopy
      ctx.strokeStyle = "rgba(168,203,245,0.30)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-r * 0.88, cy + 0.06 * r);
      ctx.bezierCurveTo(-r * 0.70, cy - 0.58 * r, r * 0.70, cy - 0.58 * r, r * 0.88, cy + 0.06 * r);
      ctx.stroke();

      // water runs off the rim
      if (spawnDrips && Math.random() < 0.22) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const lx = side * r, ly = rimY(side);
        const m = ctx.getTransform();
        drips.push({
          x: (m.a * lx + m.c * ly + m.e) / DPR,
          y: (m.b * lx + m.d * ly + m.f) / DPR,
          vx: -22,
          vy: 40,
          land: groundY + streetH * 0.62
        });
      }
    }
    ctx.restore();
  }

  function walker(x, footY, h, p, o) {
    ctx.save();
    ctx.translate(x, footY);
    ctx.save();
    ctx.translate(-1.4, -1);            // rim-light pass, offset toward the lamp
    figure(h, p, o, "rim");
    ctx.restore();
    spawnDrips = true;
    figure(h, p, o, "dark");
    spawnDrips = false;
    ctx.restore();
  }

  function reflection(x, footY, h, p, o) {
    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.translate(x + Math.sin(t * 1.7) * 1.6, footY);
    ctx.scale(1, -0.55);
    figure(h, p, o, "dark");
    ctx.restore();
  }

  /* --------------------------------------------------------------- render */

  const RAIN_BUCKETS = 5;
  const rainBins = Array.from({ length: RAIN_BUCKETS * 2 }, () => []);

  function drawRain(heads, minZ, maxZ) {
    ctx.lineCap = "butt";
    for (const bin of rainBins) bin.length = 0;

    for (const d of rain) {
      if (d.z < minZ || d.z >= maxZ) continue;
      let lit = 0;
      for (const hd of heads) {
        if (Math.abs(d.x - hd.x) < 130 && d.y > hd.y - 40) { lit = 1; break; }
      }
      const bi = Math.min(RAIN_BUCKETS - 1, (d.z * RAIN_BUCKETS) | 0);
      rainBins[bi * 2 + lit].push(d);
    }

    for (let bi = 0; bi < RAIN_BUCKETS; bi++) {
      for (let lit = 0; lit < 2; lit++) {
        const bin = rainBins[bi * 2 + lit];
        if (!bin.length) continue;
        const z = (bi + 0.5) / RAIN_BUCKETS;
        const a = (0.09 + z * 0.30 + flash * 0.25) * (lit ? 2.1 : 1);
        ctx.strokeStyle = `rgba(186,214,247,${Math.min(a, 0.72)})`;
        ctx.lineWidth = 0.55 + z * 1.05;
        ctx.beginPath();
        for (const d of bin) {
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - d.vx * d.k, d.y - d.vy * d.k);
        }
        ctx.stroke();
      }
    }
  }

  function drawRipples() {
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(180,210,245,${Math.max(0, r.a)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.30, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawDrips() {
    ctx.strokeStyle = "rgba(190,215,245,0.42)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const p of drips) {
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.012, p.y - p.vy * 0.012);
    }
    ctx.stroke();
  }

  function drawWetSheen() {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = "#0b1019";
    ctx.lineWidth = 2;
    for (let y = groundY + 6; y < H; y += 9) {
      ctx.globalAlpha = 0.30 + 0.35 * ((y - groundY) / streetH);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMist() {
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const cx = ((t * (14 + i * 9) * -1 + i * W * 0.5) % (W + 800) + W + 800) % (W + 800) - 400;
      const cy = groundY + streetH * (0.05 + i * 0.18);
      const R = W * 0.28;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      g.addColorStop(0, `rgba(120,150,190,${0.055 + flash * 0.05})`);
      g.addColorStop(1, "rgba(120,150,190,0)");
      ctx.fillStyle = g;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
    ctx.restore();
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.72)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();

    drawBuildings(far,  farW,  offFar,  groundY + 1, flash > 0.05 ? "#1a2231" : "#131a27", 0.45);
    drawBuildings(near, nearW, offNear, groundY + 2, flash > 0.05 ? "#0d1320" : "#080c15", 0.55);

    drawStreet();
    const heads = drawLamps();

    // rain behind the men
    drawRain(heads, 0, 0.5);

    // the two men — the second one trails a little further back
    const footY = groundY + streetH * 0.46;
    const h1 = Math.max(130, Math.min(H * 0.32, 320));
    const h2 = h1 * 0.90;
    const A  = 0.150;
    const omega = (2 * Math.PI * GROUND_SPEED) / (4 * A * h1);
    const p1 = t * omega;
    const p2 = t * omega * 1.015 + 2.1;

    const manA = { umbrella: true, hat: "brim", tilt: -0.10, scarf: false, id: 0 };
    const manB = { umbrella: true, hat: "hood", tilt:  0.13, scarf: false, id: 3 };

    reflection(W * 0.40, footY - streetH * 0.12, h2, p2, manB);
    reflection(W * 0.55, footY, h1, p1, manA);
    drawWetSheen();
    drawRipples();

    walker(W * 0.40, footY - streetH * 0.12, h2, p2, manB);
    walker(W * 0.55, footY, h1, p1, manA);

    // rain in front of them
    drawRain(heads, 0.5, 1.01);
    drawDrips();

    drawMist();

    if (flash > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = `rgba(150,180,225,${0.16 * flash})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    drawVignette();
  }

  /* ----------------------------------------------------------------- loop */

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  cv.addEventListener("pointerdown", triggerFlash);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
