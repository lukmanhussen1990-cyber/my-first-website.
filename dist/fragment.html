<title>Crossy Road</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7ec850">
<meta name="description" content="Crossy Road — an endless hop-across-the-traffic arcade game. Pure HTML5 canvas, no dependencies.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
<style>
/* ── Crossy Road — UI shell ───────────────────────────────── */

:root {
  --ink: #10141c;
  --card: rgba(18, 22, 31, .82);
  --stroke: rgba(255, 255, 255, .14);
  --grass: #7ec850;
  --gold: #ffcf3f;
  --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #0d1017;
  font-family: var(--font);
  color: #fff;
  overscroll-behavior: none;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: auto;
}

.hidden { display: none !important; }

/* ── HUD ──────────────────────────────────────────────────── */

.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  pointer-events: none;
  z-index: 5;
}

.hud-score {
  font-size: clamp(38px, 9vw, 64px);
  font-weight: 900;
  letter-spacing: 1px;
  line-height: .95;
  text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 18px rgba(0, 0, 0, .25);
  font-variant-numeric: tabular-nums;
}

.hud-right { display: flex; gap: 8px; align-items: center; pointer-events: auto; }

.pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(10, 14, 20, .5);
  border: 1px solid var(--stroke);
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  font-weight: 800;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(6px);
}

.coin-dot {
  width: 15px; height: 15px; border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #ffe98a, var(--gold) 60%, #d69a08);
  box-shadow: 0 0 0 2px rgba(0, 0, 0, .18) inset;
  display: inline-block;
  flex: none;
}

.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: rgba(10, 14, 20, .5);
  color: #fff;
  font-size: 15px;
  font-family: var(--font);
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: transform .1s, background .15s;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn:hover { background: rgba(30, 38, 52, .7); }

/* ── Overlays & cards ─────────────────────────────────────── */

.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 10;
  background: radial-gradient(ellipse at center, rgba(4, 8, 14, .35), rgba(4, 8, 14, .72));
  animation: fade .25s ease;
}

@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { transform: translateY(14px) scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }

.card {
  width: min(400px, 100%);
  background: var(--card);
  border: 1px solid var(--stroke);
  border-radius: 26px;
  padding: 26px 24px 22px;
  text-align: center;
  backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: 0 26px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
  animation: pop .3s cubic-bezier(.2, .9, .3, 1.2);
  max-height: 96vh;
  overflow-y: auto;
}
.card-sm { width: min(320px, 100%); }

.title {
  font-size: clamp(36px, 11vw, 52px);
  font-weight: 900;
  letter-spacing: 2px;
  line-height: .92;
  color: #fff;
  text-shadow: 0 5px 0 #2c7a2c, 0 7px 14px rgba(0, 0, 0, .5);
}
.title span { display: block; color: var(--gold); text-shadow: 0 5px 0 #a86e00, 0 7px 14px rgba(0, 0, 0, .5); }
.title-sm { font-size: 30px; font-weight: 900; letter-spacing: 3px; margin-bottom: 18px; }

.tagline { margin: 12px 0 4px; opacity: .7; font-size: 15px; font-weight: 600; }

/* ── Character chooser ────────────────────────────────────── */

.chooser { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 14px; }

.char-stage { flex: 1; min-width: 0; }

#char-preview {
  width: 100%;
  max-width: 220px;
  height: 170px;
  display: block;
  margin: 0 auto;
}

.char-name { font-size: 19px; font-weight: 900; letter-spacing: 1px; margin-top: -6px; }
.char-status { font-size: 13px; opacity: .65; font-weight: 700; min-height: 18px; }
.char-status.locked { color: var(--gold); opacity: .95; }

.arrow {
  width: 44px; height: 60px;
  flex: none;
  font-size: 32px;
  line-height: 1;
  color: #fff;
  background: rgba(255, 255, 255, .07);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  cursor: pointer;
  font-family: var(--font);
  transition: transform .1s, background .15s;
}
.arrow:hover { background: rgba(255, 255, 255, .16); }
.arrow:active { transform: scale(.92); }

/* ── Buttons ──────────────────────────────────────────────── */

.btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 15px 18px;
  border: none;
  border-radius: 16px;
  font-family: var(--font);
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: transform .08s, filter .15s;
}
.btn:active { transform: translateY(2px) scale(.99); }

.btn-primary {
  background: linear-gradient(#8ede5c, var(--grass) 55%, #57a032);
  color: #10300d;
  box-shadow: 0 5px 0 #3d7a24, 0 12px 24px rgba(0, 0, 0, .35);
}
.btn-primary:hover { filter: brightness(1.06); }

.btn-ghost {
  background: rgba(255, 255, 255, .09);
  color: #fff;
  border: 1px solid var(--stroke);
  font-size: 15px;
  padding: 12px;
  letter-spacing: 1px;
}
.btn-ghost:hover { background: rgba(255, 255, 255, .17); }
.btn-ghost:disabled { opacity: .45; cursor: not-allowed; }

.wallet {
  margin-top: 14px;
  font-size: 15px;
  font-weight: 800;
  opacity: .85;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.hints { margin-top: 16px; font-size: 12.5px; line-height: 1.9; opacity: .55; font-weight: 600; }
.hint-touch { display: none; }

kbd {
  display: inline-block;
  min-width: 20px;
  padding: 1px 5px;
  margin: 0 1px;
  border-radius: 5px;
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .18);
  border-bottom-width: 2px;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
}

/* ── Game over ────────────────────────────────────────────── */

.over-cause { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #ff7b6b; text-transform: uppercase; }
.over-score {
  font-size: 76px; font-weight: 900; line-height: 1.05; margin-top: 6px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 5px 0 rgba(0, 0, 0, .35);
}
.over-label { font-size: 12px; letter-spacing: 4px; opacity: .55; font-weight: 800; }

.over-stats { display: flex; gap: 10px; margin: 18px 0 4px; }
.over-stats > div {
  flex: 1;
  background: rgba(255, 255, 255, .07);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 10px 6px;
}
.over-stats span { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.over-stats small { font-size: 10px; letter-spacing: 2px; opacity: .55; font-weight: 800; }

.new-best {
  margin-top: 12px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--gold);
  animation: blink 1s steps(2, end) infinite;
}
@keyframes blink { 50% { opacity: .35 } }

/* ── Touch d-pad ──────────────────────────────────────────── */

.dpad {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  width: 186px; height: 186px;
  z-index: 6;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 5px;
  opacity: .5;
}

.dbtn {
  border: 1px solid rgba(255, 255, 255, .25);
  background: rgba(10, 14, 20, .42);
  color: #fff;
  border-radius: 16px;
  font-size: 20px;
  font-family: var(--font);
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: transform .07s, background .1s;
}
.dbtn:active { transform: scale(.9); background: rgba(120, 200, 90, .55); }
.dbtn.up    { grid-area: 1 / 2; }
.dbtn.left  { grid-area: 2 / 1; }
.dbtn.right { grid-area: 2 / 3; }
.dbtn.down  { grid-area: 3 / 2; }

/* ── Responsive ───────────────────────────────────────────── */

@media (pointer: coarse) {
  .hint-touch { display: block; }
  .hints > div:first-child { display: none; }
}

@media (max-height: 620px) {
  .card { padding: 18px 18px 14px; border-radius: 20px; }
  #char-preview { height: 120px; }
  .hints { display: none; }
  .over-score { font-size: 56px; }
  .tagline { margin: 6px 0 0; }
}

@media (max-width: 380px) {
  .dpad { width: 150px; height: 150px; }
}

</style>
<canvas id="game"></canvas>

<!-- ── In-game HUD ─────────────────────────────────────────── -->
<div id="hud" class="hud hidden">
  <div class="hud-score" id="hud-score">0</div>
  <div class="hud-right">
    <div class="pill" id="hud-coins"><span class="coin-dot"></span><span id="coin-count">0</span></div>
    <button class="icon-btn" id="btn-sound" title="Sound (M)" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="btn-pause" title="Pause (Esc)" aria-label="Pause">❚❚</button>
  </div>
</div>

<!-- ── Start / character select ─────────────────────────────── -->
<div id="screen-start" class="overlay">
  <div class="card">
    <h1 class="title">CROSSY<span>ROAD</span></h1>
    <p class="tagline">How far can you hop?</p>

    <div class="chooser">
      <button class="arrow" id="char-prev" aria-label="Previous character">‹</button>
      <div class="char-stage">
        <canvas id="char-preview" width="220" height="200"></canvas>
        <div class="char-name" id="char-name">Chicken</div>
        <div class="char-status" id="char-status">Selected</div>
      </div>
      <button class="arrow" id="char-next" aria-label="Next character">›</button>
    </div>

    <button class="btn btn-primary" id="btn-play">PLAY</button>
    <button class="btn btn-ghost hidden" id="btn-unlock">Unlock</button>

    <div class="wallet"><span class="coin-dot"></span><span id="wallet-count">0</span> coins</div>

    <div class="hints">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> to hop</div>
      <div class="hint-touch">Swipe or tap the arrows to hop</div>
      <div>Don't stand still — the eagle is watching.</div>
    </div>
  </div>
</div>

<!-- ── Game over ────────────────────────────────────────────── -->
<div id="screen-over" class="overlay hidden">
  <div class="card">
    <div class="over-cause" id="over-cause">Squashed!</div>
    <div class="over-score" id="over-score">0</div>
    <div class="over-label">SCORE</div>
    <div class="over-stats">
      <div><span id="over-best">0</span><small>BEST</small></div>
      <div><span id="over-coins">0</span><small>COINS</small></div>
    </div>
    <div class="new-best hidden" id="new-best">NEW BEST!</div>
    <button class="btn btn-primary" id="btn-again">PLAY AGAIN</button>
    <button class="btn btn-ghost" id="btn-menu">CHANGE CHARACTER</button>
  </div>
</div>

<!-- ── Pause ────────────────────────────────────────────────── -->
<div id="screen-pause" class="overlay hidden">
  <div class="card card-sm">
    <h2 class="title-sm">PAUSED</h2>
    <button class="btn btn-primary" id="btn-resume">RESUME</button>
    <button class="btn btn-ghost" id="btn-quit">QUIT TO MENU</button>
  </div>
</div>

<!-- ── Touch controls ───────────────────────────────────────── -->
<div id="dpad" class="dpad hidden">
  <button class="dbtn up"    data-dir="up"    aria-label="Hop forward">▲</button>
  <button class="dbtn left"  data-dir="left"  aria-label="Hop left">◀</button>
  <button class="dbtn right" data-dir="right" aria-label="Hop right">▶</button>
  <button class="dbtn down"  data-dir="down"  aria-label="Hop back">▼</button>
</div>
<script>
/* ==== js/util.js ==== */
/* Crossy Road — small shared helpers (math, colour, storage, RNG). */
(function (global) {
  'use strict';

  var CR = global.CR || (global.CR = {});

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /** Frame-rate independent easing toward a target. */
  function damp(a, b, lambda, dt) { return lerp(a, b, 1 - Math.exp(-lambda * dt)); }

  /** Deterministic 32-bit PRNG so a run can be replayed from a seed. */
  function rng(seed) {
    var s = seed >>> 0 || 1;
    var f = function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = function (lo, hi) { return lo + f() * (hi - lo); };
    f.int = function (lo, hi) { return Math.floor(lo + f() * (hi - lo + 1)); };
    f.pick = function (arr) { return arr[Math.floor(f() * arr.length) % arr.length]; };
    f.chance = function (p) { return f() < p; };
    /** Weighted pick: entries are [value, weight]. */
    f.weighted = function (entries) {
      var total = 0, i;
      for (i = 0; i < entries.length; i++) total += entries[i][1];
      var r = f() * total;
      for (i = 0; i < entries.length; i++) {
        r -= entries[i][1];
        if (r <= 0) return entries[i][0];
      }
      return entries[entries.length - 1][0];
    };
    return f;
  }

  /* ── Colour ─────────────────────────────────────────────── */

  function hexToRgb(hex) {
    var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  var shadeCache = Object.create(null);

  /** Multiply a colour's brightness; results are cached (hot path). */
  function shade(hex, mul) {
    var key = hex + '|' + mul;
    var hit = shadeCache[key];
    if (hit) return hit;
    var c = hexToRgb(hex);
    var out = 'rgb(' +
      clamp(Math.round(c[0] * mul), 0, 255) + ',' +
      clamp(Math.round(c[1] * mul), 0, 255) + ',' +
      clamp(Math.round(c[2] * mul), 0, 255) + ')';
    shadeCache[key] = out;
    return out;
  }

  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  function mix(hexA, hexB, t) {
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    return 'rgb(' +
      Math.round(lerp(a[0], b[0], t)) + ',' +
      Math.round(lerp(a[1], b[1], t)) + ',' +
      Math.round(lerp(a[2], b[2], t)) + ')';
  }

  /* ── Persistence (never throws — private mode, file://, etc.) ── */

  var store = {
    get: function (key, fallback) {
      try {
        var v = global.localStorage.getItem('crossy.' + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { global.localStorage.setItem('crossy.' + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }
  };

  CR.util = {
    clamp: clamp, lerp: lerp, damp: damp, rng: rng,
    shade: shade, rgba: rgba, mix: mix, hexToRgb: hexToRgb,
    store: store,
    TAU: Math.PI * 2
  };
})(window);

/* ==== js/audio.js ==== */
/* Crossy Road — procedural sound. Every effect is synthesised with the
   WebAudio API, so the game ships with zero audio assets. */
(function (global) {
  'use strict';

  var CR = global.CR;
  var store = CR.util.store;

  function Audio() {
    this.ctx = null;
    this.master = null;
    this.noise = null;
    this.muted = store.get('muted', false);
    this.ready = false;
  }

  /** Must be called from a user gesture (browser autoplay policy). */
  Audio.prototype.init = function () {
    if (this.ready) { this.resume(); return; }
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.6;
      this.master.connect(this.ctx.destination);

      // One shared noise buffer for splashes/crashes.
      var len = Math.floor(this.ctx.sampleRate * 0.7);
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.ready = true;
    } catch (e) { this.ready = false; }
  };

  Audio.prototype.resume = function () {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  };

  Audio.prototype.setMuted = function (m) {
    this.muted = m;
    store.set('muted', m);
    if (this.master) this.master.gain.value = m ? 0 : 0.6;
  };

  Audio.prototype.toggle = function () { this.setMuted(!this.muted); return this.muted; };

  /* ── Primitives ───────────────────────────────────────────── */

  /** A single enveloped oscillator note. */
  Audio.prototype.tone = function (opt) {
    if (!this.ready || this.muted) return;
    var ctx = this.ctx, t0 = ctx.currentTime + (opt.delay || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.setValueAtTime(opt.from, t0);
    if (opt.to && opt.to !== opt.from) {
      if (opt.exp !== false && opt.to > 0 && opt.from > 0) osc.frequency.exponentialRampToValueAtTime(opt.to, t0 + opt.dur);
      else osc.frequency.linearRampToValueAtTime(opt.to, t0 + opt.dur);
    }
    var vol = opt.vol == null ? 0.2 : opt.vol;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.012, opt.dur * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);
    osc.connect(gain);
    if (opt.detune) osc.detune.value = opt.detune;
    gain.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + opt.dur + 0.03);
  };

  /** Filtered noise burst. */
  Audio.prototype.burst = function (opt) {
    if (!this.ready || this.muted) return;
    var ctx = this.ctx, t0 = ctx.currentTime + (opt.delay || 0);
    var src = ctx.createBufferSource();
    src.buffer = this.noise;
    var filt = ctx.createBiquadFilter();
    filt.type = opt.filter || 'lowpass';
    filt.frequency.setValueAtTime(opt.from || 1200, t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to || 300), t0 + opt.dur);
    filt.Q.value = opt.q || 1;
    var gain = ctx.createGain();
    var vol = opt.vol == null ? 0.22 : opt.vol;
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);
    src.connect(filt); filt.connect(gain); gain.connect(this.master);
    src.start(t0);
    src.stop(t0 + opt.dur + 0.02);
  };

  /* ── Game sounds ──────────────────────────────────────────── */

  Audio.prototype.hop = function () {
    this.tone({ type: 'triangle', from: 420, to: 760, dur: 0.09, vol: 0.16 });
    this.tone({ type: 'sine', from: 180, to: 120, dur: 0.07, vol: 0.1, delay: 0.07 });
  };

  Audio.prototype.blocked = function () {
    this.tone({ type: 'square', from: 150, to: 90, dur: 0.08, vol: 0.08 });
  };

  Audio.prototype.coin = function () {
    this.tone({ type: 'square', from: 988, to: 988, dur: 0.06, vol: 0.13 });
    this.tone({ type: 'square', from: 1319, to: 1319, dur: 0.13, vol: 0.13, delay: 0.055 });
  };

  Audio.prototype.splash = function () {
    this.burst({ from: 2600, to: 260, dur: 0.5, vol: 0.3 });
    this.tone({ type: 'sine', from: 300, to: 90, dur: 0.35, vol: 0.16 });
  };

  Audio.prototype.crash = function () {
    this.burst({ from: 1800, to: 120, dur: 0.4, vol: 0.34 });
    this.tone({ type: 'sawtooth', from: 160, to: 42, dur: 0.4, vol: 0.24 });
  };

  Audio.prototype.horn = function () {
    this.tone({ type: 'sawtooth', from: 233, to: 233, dur: 0.55, vol: 0.13 });
    this.tone({ type: 'sawtooth', from: 311, to: 311, dur: 0.55, vol: 0.11, detune: 8 });
  };

  Audio.prototype.trainPass = function () {

/* Crossy Road — 2.5D renderer.
 *
 * The world is a right-handed grid: +x runs right, +y runs away from the
 * camera (the direction you hop) and +z is up. It is drawn with a rotated
 * axonometric projection — no perspective divide — which gives the chunky
 * toy-box look while keeping depth sorting trivial.
 *
 *   u =  x·cosYAW + y·sinYAW      (screen right)
 *   v = -x·sinYAW + y·cosYAW      (depth: bigger = further away)
 *   screenY = -(v·sinELEV + z·cosELEV)

  var SE = Math.sin(ELEV), CE = Math.cos(ELEV);

  function Renderer(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: !!(opts && opts.alpha) });

    this.scale = 60;
    this.cam = { x: 0, y: 0 };

    this.shakeX = 0; this.shakeY = 0;
    this.queue = [];
    this.qn = 0;
    this.parts = [];
    this.pn = 0;
    this._pts = [0, 0, 0, 0, 0, 0, 0, 0];

  Renderer.CY = CY; Renderer.SY = SY; Renderer.SE = SE; Renderer.CE = CE;

  Renderer.prototype.resize = function (cssW, cssH) {
    var dpr = Math.min(global.devicePixelRatio || 1, 2.5);
    this.dpr = dpr;
    this.w = cssW; this.h = cssH;
    this.canvas.width = Math.round(cssW * dpr);
    this.canvas.height = Math.round(cssH * dpr);
    this.canvas.style.width = cssW + 'px';
    this.canvas.style.height = cssH + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Aim for ~11 columns × ~14 rows of playfield. On very tall/narrow
    // screens fall back to a floor so tiles never get postage-stamp small.
    var byCols = cssW / (11 * CY);
    var byRows = cssH / (14 * SE);
    var s = Math.min(byCols, byRows);
    var floor = Math.min(cssW / (8.5 * CY), cssH / (19 * SE));
    this.scale = util.clamp(Math.max(s, floor), 20, 120);

  Renderer.prototype.setCamera = function (x, y) { this.cam.x = x; this.cam.y = y; };

    return this.w * 0.5 + ((x - this.cam.x) * CY + (y - this.cam.y) * SY) * this.scale + this.shakeX;
  };

  Renderer.prototype.sy = function (x, y, z) {
    var v = -(x - this.cam.x) * SY + (y - this.cam.y) * CY;
    return this.h * this.anchor - (v * SE + z * CE) * this.scale + this.shakeY;
  };

  Renderer.prototype.viewRows = function () {
    var up = (this.h * this.anchor) / (this.scale * SE);
    var down = (this.h * (1 - this.anchor)) / (this.scale * SE);
    var side = (this.w * 0.5) / this.scale * (SY / CY);

   * Many small quads share a colour, so they are batched into one path
   * and filled once. */

  Renderer.prototype.beginFlat = function (color) {

    var c = this.ctx;
    c.moveTo(this.sx(x0, y0), this.sy(x0, y0, z));
    c.lineTo(this.sx(x1, y0), this.sy(x1, y0, z));
    c.lineTo(this.sx(x1, y1), this.sy(x1, y1, z));
    c.lineTo(this.sx(x0, y1), this.sy(x0, y1, z));

   * A box shows three faces. Instead of filling each face and stroking

   * strokes, and no sub-pixel gaps.
   */

    var ax = this.sx(x0, y0), ay = this.sy(x0, y0, z);      // A near-left base
    var bx = this.sx(x1, y0), by = this.sy(x1, y0, z);      // B near-right base
    var cx2 = this.sx(x1, y1), cy2 = this.sy(x1, y1, z);    // C far-right base
    var dx = cx2, dy = this.sy(x1, y1, z1);                 // D far-right top
    var ex = this.sx(x0, y1), ey = this.sy(x0, y1, z1);     // E far-left top
    var fx = ax, fy = this.sy(x0, y0, z1);                  // F near-left top
    var gx = bx, gy = this.sy(x1, y0, z1);                  // G near-right top

    c.beginPath();                                          // silhouette
    c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(cx2, cy2);
    c.lineTo(dx, dy); c.lineTo(ex, ey); c.lineTo(fx, fy);
    c.closePath();
    c.fillStyle = util.shade(color, SOUTH * l);
    c.fill();

    c.beginPath();                                          // east (+x)
    c.moveTo(bx, by); c.lineTo(cx2, cy2); c.lineTo(dx, dy); c.lineTo(gx, gy);
    c.closePath();
    c.fillStyle = util.shade(color, EAST * l);
    c.fill();

    c.beginPath();                                          // top (+z)
    c.moveTo(fx, fy); c.lineTo(gx, gy); c.lineTo(dx, dy); c.lineTo(ex, ey);

    c.globalAlpha = alpha;
    c.fillStyle = '#000';

  };

    var c = this.ctx;

    c.ellipse(px, py, rx, ry, 0, 0, util.TAU);
  };

  Renderer.prototype.endShadows = function () {
    this.ctx.fill();

  };

  Renderer.prototype.shadow = function (x, y, w, d, alpha) {

   * Composite models (a car, a train, a chicken) are built out of boxes
   * that can occlude each other. There is no z-buffer, so parts are

/* Crossy Road — endless world: row generation and traffic simulation.

        for (i = 0; i < row.border.length; i++) {
          var b = row.border[i];
          if (b.x < x0 || b.x > x1) continue;
          r.push(r.depth(b.x, y), drawScenery, { o: b.o, x: b.x, y: y });
        }
        if (row.coin && !row.coin.taken) {
          r.push(r.depth(row.coin.x, y), drawCoin, { x: row.coin.x, y: y, t: t });
        }
      } else if (row.type === 'road') {
        if (row.lamp) r.push(r.depth(row.lamp, y), drawScenery, { o: { kind: 'lamp' }, x: row.lamp, y: y });
        for (i = 0; i < row.vehicles.length; i++) {
          var veh = row.vehicles[i];
          if (veh.x < x0 - veh.len || veh.x > x1 + veh.len) continue;
          r.push(r.depth(veh.x, y), drawVehicle, { v: veh, y: y, t: t });
        }
      } else if (row.type === 'water') {
        for (i = 0; i < row.logs.length; i++) {
          var lg = row.logs[i];
          if (lg.x < x0 - lg.len || lg.x > x1 + lg.len) continue;
          r.push(r.depth(lg.x, y), drawLog, { l: lg, y: y });
        }
        for (i = 0; i < row.pads.length; i++) {
          var pd = row.pads[i];
          if (pd.x < x0 || pd.x > x1) continue;
          r.push(r.depth(pd.x, y), drawPad, { p: pd, y: y });
        }
      } else if (row.type === 'rail') {
        r.push(r.depth(W.MINX - 1, y), drawSignal, { x: W.MINX - 1, y: y, on: row.signalOn });
        r.push(r.depth(W.MAXX + 1, y), drawSignal, { x: W.MAXX + 1, y: y, on: !row.signalOn && row.state !== 'idle' });
        if (row.train) r.push(r.depth(row.train.x, y), drawTrain, { t: row.train, y: y, time: t });
      }
    }

    // Player + eagle
    var p = this.player;
    if (p.alpha > 0.01) r.push(r.depth(p.x, p.y) - 0.001, drawPlayer, { game: this });

    if (!p.alive && p.cause === 'eagle') {
      var k2 = util.clamp(p.deathT / 0.42, 0, 1);
      var ez = util.lerp(6.5, 0.5, k2) + (p.deathT > 0.42 ? p.z : 0);
      var ey = p.y + util.lerp(3.2, 0.02, k2);
      r.push(r.depth(p.x, ey) - 0.5, drawEagle, { x: p.x, y: ey, z: ez, t: t });
    } else if (this.state === 'play' && this.idle > IDLE_WARN) {
      // Circling warning shadow — you have about two seconds.
      var warn = util.clamp((this.idle - IDLE_WARN) / (IDLE_DEATH - IDLE_WARN), 0, 1);
      var sz = util.lerp(2.4, 0.9, warn);
      ctx.save();
      ctx.globalAlpha = 0.1 + warn * 0.3;
      r.shadow(p.x + Math.cos(t * 2.2) * 0.6, p.y + Math.sin(t * 2.2) * 0.6, sz, sz, 1);
      ctx.restore();
    }

    for (i = 0; i < this.particles.length; i++) {
      var pt = this.particles[i];
      r.push(r.depth(pt.x, pt.y) - 0.002, drawParticle, pt);
    }

    r.flush();

    // 4. Distance haze so the far edge of the world melts away.
    var fog = r.h * 0.24;
    var g = ctx.createLinearGradient(0, 0, 0, fog);
    g.addColorStop(0, SKY_TOP);
    g.addColorStop(0.4, util.rgba(SKY_TOP, 0.6));
    g.addColorStop(1, util.rgba(SKY_TOP, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, r.w, fog);
  };

  CR.Game = Game;
})(window);

/* ==== js/ui.js ==== */
/* Crossy Road — DOM glue: HUD, menus, character shop. */
(function (global) {
  'use strict';

  var CR = global.CR;
  var util = CR.util;

  function $(id) { return document.getElementById(id); }

  var CAUSE = {
    car: 'Squashed!',
    train: 'Off the rails!',
    water: 'Splash!',
    eagle: 'Eagle got you!'
  };

  var ui = {
    game: null,
    index: 0,
    unlocked: util.store.get('unlocked', ['chicken']),
    preview: null,
    previewT: 0
  };

  ui.init = function (game) {
    this.game = game;
    this.el = {
      hud: $('hud'), score: $('hud-score'), coins: $('coin-count'),
      start: $('screen-start'), over: $('screen-over'), pause: $('screen-pause'),
      name: $('char-name'), status: $('char-status'),
      play: $('btn-play'), unlock: $('btn-unlock'), wallet: $('wallet-count'),
      cause: $('over-cause'), overScore: $('over-score'), overBest: $('over-best'),
      overCoins: $('over-coins'), newBest: $('new-best'),
      sound: $('btn-sound'), dpad: $('dpad')
    };

    // Character preview gets its own tiny renderer.
    this.preview = new CR.Renderer($('char-preview'), { alpha: true });
    this.resizePreview();

    var i = 0;
    for (; i < CR.characters.length; i++) {
      if (CR.characters[i].id === game.charId) { this.index = i; break; }
    }
    if (!this.has(game.charId)) { this.index = 0; game.setCharacter('chicken'); }

    var self = this;
    $('char-prev').onclick = function () { self.cycle(-1); };
    $('char-next').onclick = function () { self.cycle(1); };
    this.el.play.onclick = function () { self.play(); };
    this.el.unlock.onclick = function () { self.buy(); };
    $('btn-again').onclick = function () { self.play(); };
    $('btn-menu').onclick = function () { CR.audio.click(); self.showStart(); };
    $('btn-resume').onclick = function () { CR.audio.click(); game.resume(); };
    $('btn-quit').onclick = function () { CR.audio.click(); self.showPause(false); self.showStart(); };
    $('btn-pause').onclick = function () { CR.audio.click(); game.pause(); };
    this.el.sound.onclick = function () {
      var muted = CR.audio.toggle();
      self.el.sound.textContent = muted ? '🔇' : '🔊';
      if (!muted) CR.audio.click();
    };
    this.el.sound.textContent = CR.audio.muted ? '🔇' : '🔊';

    this.refreshChar();
    this.setCoins(game.wallet);
  };

  ui.has = function (id) { return this.unlocked.indexOf(id) !== -1; };

  ui.resizePreview = function () {
    var c = $('char-preview');
    var rect = c.getBoundingClientRect();
    this.preview.resize(Math.max(120, rect.width || 220), Math.max(100, rect.height || 170));
    this.preview.scale = this.preview.h * 0.5;
    this.preview.anchor = 0.56;
    this.preview.setCamera(0, 0);
  };

  ui.cycle = function (step) {
    CR.audio.click();
    var n = CR.characters.length;
    this.index = (this.index + step + n) % n;
    var ch = CR.characters[this.index];
    if (this.has(ch.id)) this.game.setCharacter(ch.id);
    this.refreshChar();
  };

  ui.refreshChar = function () {
    var ch = CR.characters[this.index];
    var owned = this.has(ch.id);
    this.el.name.textContent = ch.name;
    this.el.status.classList.toggle('locked', !owned);
    if (owned) {
      this.el.status.textContent = this.game.charId === ch.id ? 'Selected' : 'Tap play to use';
      this.el.play.classList.remove('hidden');
      this.el.unlock.classList.add('hidden');
    } else {
      var short = ch.cost - this.game.wallet;
      this.el.status.textContent = short > 0 ? 'Locked — ' + short + ' more coins' : 'Locked';
      this.el.play.classList.add('hidden');
      this.el.unlock.classList.remove('hidden');
      this.el.unlock.textContent = 'UNLOCK — ' + ch.cost + ' COINS';
      this.el.unlock.disabled = short > 0;
    }
    this.el.wallet.textContent = this.game.wallet;
  };

  ui.buy = function () {
    var ch = CR.characters[this.index];
    if (this.game.wallet < ch.cost || this.has(ch.id)) return;
    this.game.wallet -= ch.cost;
    util.store.set('coins', this.game.wallet);
    this.unlocked.push(ch.id);
    util.store.set('unlocked', this.unlocked);
    this.game.setCharacter(ch.id);
    CR.audio.unlock();
    this.refreshChar();
    this.setCoins(this.game.wallet);
  };

  ui.play = function () {
    CR.audio.init();
    CR.audio.click();
    var ch = CR.characters[this.index];
    if (this.has(ch.id)) this.game.setCharacter(ch.id);
    this.el.start.classList.add('hidden');
    this.el.over.classList.add('hidden');
    this.el.hud.classList.remove('hidden');
    if (CR.touch) this.el.dpad.classList.remove('hidden');
    this.game.start();
  };

  ui.showStart = function () {
    this.game.toMenu();
    this.el.over.classList.add('hidden');
    this.el.hud.classList.add('hidden');
    this.el.dpad.classList.add('hidden');
    this.el.start.classList.remove('hidden');
    this.refreshChar();
  };

  ui.showGameOver = function (game) {
    this.el.cause.textContent = CAUSE[game.player.cause] || 'Game over';
    this.el.overScore.textContent = game.score;
    this.el.overBest.textContent = game.best;
    this.el.overCoins.textContent = game.runCoins;
    this.el.newBest.classList.toggle('hidden', !game.newBest);
    this.el.over.classList.remove('hidden');
    this.el.dpad.classList.add('hidden');
    this.refreshChar();
  };

  ui.showPause = function (on) {
    this.el.pause.classList.toggle('hidden', !on);
  };

  ui.setScore = function (v) { this.el.score.textContent = v; };
  ui.setCoins = function (v) { this.el.coins.textContent = v; };

  /** Idle animation on the character-select canvas. */
  ui.drawPreview = function (dt) {
    if (this.el.start.classList.contains('hidden')) return;
    var r = this.preview, t = (this.previewT += dt);
    var ctx = r.ctx;
    ctx.clearRect(0, 0, r.w, r.h);

    // little grass podium
    for (var gx = -0.5; gx <= 0.5; gx++) {
      for (var gy = -0.5; gy <= 0.5; gy++) {
        r.box(gx, gy, -0.4, 1, 1, 0.4, (gx + gy) === 0 ? '#7ec94b' : '#71bb41');
      }
    }
    var hop = Math.abs(Math.sin(t * 2.2));
    var z = Math.pow(hop, 0.7) * 0.22;
    r.shadow(0, 0, 0.66 - z * 0.3, 0.66 - z * 0.3, 0.18);
    CR.drawCharacter(r, CR.characters[this.index], {
      x: 0, y: 0, z: z,
      facing: 2,                       // turned to face the player

      squash: 1 - hop * 0.06,
      stretch: 1 + hop * 0.1
    });
  };

  CR.ui = ui;
})(window);

/* ==== js/main.js ==== */
/* Crossy Road — bootstrap, input, main loop. */
(function (global) {
  'use strict';

  var CR = global.CR;

  var canvas = document.getElementById('game');
  var game = new CR.Game(canvas);
  CR.game = game;
  CR.touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in global;

  CR.ui.init(game);

  /* ── Sizing ───────────────────────────────────────────────── */

  function resize() {
    game.r.resize(global.innerWidth, global.innerHeight);
    CR.ui.resizePreview();
  }
  global.addEventListener('resize', resize);
  global.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* ── Keyboard ─────────────────────────────────────────────── */

  var KEYS = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right'
  };

  document.addEventListener('keydown', function (e) {
    var dir = KEYS[e.code];
    if (dir) {
      e.preventDefault();
      CR.audio.init();
      if (game.state === 'menu') { CR.ui.play(); return; }
      game.move(dir);
      return;
    }
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (game.state === 'play') game.pause();
      else if (game.state === 'paused') game.resume();
    } else if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (game.state === 'menu' || game.state === 'over') CR.ui.play();
    } else if (e.code === 'KeyM') {
      var muted = CR.audio.toggle();
      document.getElementById('btn-sound').textContent = muted ? '🔇' : '🔊';
    }
  }, { passive: false });

  /* ── Touch: swipe anywhere, or the on-screen pad ──────────── */

  var t0 = null;
  canvas.addEventListener('touchstart', function (e) {
    CR.audio.init();
    var t = e.changedTouches[0];
    t0 = { x: t.clientX, y: t.clientY, time: Date.now() };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!t0) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    var dist = Math.hypot(dx, dy);
    var quick = Date.now() - t0.time < 450;
    t0 = null;
    if (game.state === 'menu') return;
    if (dist < 24) { game.move('up'); return; }          // tap = hop forward
    if (!quick && dist < 40) return;
    if (Math.abs(dx) > Math.abs(dy)) game.move(dx > 0 ? 'right' : 'left');
    else game.move(dy < 0 ? 'up' : 'down');
  }, { passive: true });

  // Mouse click on the playfield also hops forward (desktop convenience).
  canvas.addEventListener('mousedown', function () {
    CR.audio.init();
    if (game.state === 'play') game.move('up');
  });

  var pad = document.getElementById('dpad');
  Array.prototype.forEach.call(pad.querySelectorAll('.dbtn'), function (btn) {
    var dir = btn.getAttribute('data-dir');
    function press(e) { e.preventDefault(); CR.audio.init(); game.move(dir); }
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('mousedown', press);
  });

  if (CR.touch) document.body.classList.add('touch');

  /* ── Auto-pause when the tab or window goes away ──────────── */

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) game.pause();
  });
  global.addEventListener('blur', function () { game.pause(); });

  /* ── Loop ─────────────────────────────────────────────────── */

  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;             // never let a stall teleport traffic
    game.update(dt);
    game.draw();
    CR.ui.drawPreview(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})(window);

</script>
