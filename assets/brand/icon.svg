<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Last Mile app icon: full-bleed 1024 square, opaque, no rounded corners (the OS applies the
       mask). A road converging toward a sunset sun rising between two hills, on a night-to-violet
       sky.
       Generated geometry; the shared numbers also live in src/components/brand/LogoMark.tsx. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="612" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B1230"/><stop offset="0.42" stop-color="#21177A"/><stop offset="0.78" stop-color="#4C2FD1"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
    <radialGradient id="glow" cx="512" cy="612" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF5E8A" stop-opacity="0.7"/><stop offset="0.38" stop-color="#FF5E8A" stop-opacity="0.24"/><stop offset="1" stop-color="#FF5E8A" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="512" cy="612" r="294" gradientUnits="userSpaceOnUse"><stop offset="0.74" stop-color="#FFB35C" stop-opacity="0.5"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient>
    <linearGradient id="sun" x1="0" y1="390" x2="0" y2="612" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC56B"/><stop offset="0.45" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF5E8A"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="490" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#261C78"/><stop offset="0.3" stop-color="#1B1663"/><stop offset="0.62" stop-color="#10133C"/><stop offset="1" stop-color="#080C20"/></linearGradient>
    <radialGradient id="rim" cx="512" cy="612" r="560" gradientUnits="userSpaceOnUse"><stop offset="0.2" stop-color="#FF8A7A" stop-opacity="0.95"/><stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0.15"/></radialGradient>
    <linearGradient id="road" x1="0" y1="612" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF8A7A"/><stop offset="0.22" stop-color="#8A44D6"/><stop offset="0.65" stop-color="#34288A"/><stop offset="1" stop-color="#1D1C5C"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="612" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/><stop offset="0.35" stop-color="#22D3EE"/><stop offset="1" stop-color="#7DEBFA"/></linearGradient>
  </defs>
  <!-- sky -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="612" fill="url(#glow)"/>
  <!-- stars -->
  <path d="M236 176Q242.08 207.92 274 214Q242.08 220.08 236 252Q229.92 220.08 198 214Q229.92 207.92 236 176Z" fill="#FFFFFF"/>
  <path d="M792 146Q795.52 164.48 814 168Q795.52 171.52 792 190Q788.48 171.52 770 168Q788.48 164.48 792 146Z" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="372" cy="120" r="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <!-- sun (tucked behind the hills) -->
  <rect x="218" y="318" width="588" height="294" fill="url(#halo)"/>
  <path d="M290 612A222 222 0 0 1 734 612Z" fill="url(#sun)"/>
  <!-- hills + ground, with a sunset rim light on the crests -->
  <path d="M0 544C110 504 232 522 322 576C348 593 366 606 386 612L638 612C658 606 678 594 704 577C798 518 914 494 1024 528V1024H0Z" fill="url(#ground)"/>
  <path d="M0 544C110 504 232 522 322 576C348 593 366 606 386 612M1024 528C914 494 798 518 704 577C678 594 658 606 638 612" fill="none" stroke="url(#rim)" stroke-width="5" stroke-linecap="round"/>
  <!-- road: surface, cyan edge lines, white centre dashes -->
  <path d="M503 612L521 612L904 1024L120 1024Z" fill="url(#road)"/>
  <path d="M503 612L120 1024L156 1024L505.5 612ZM521 612L904 1024L868 1024L518.5 612Z" fill="url(#edge)"/>
  <path d="M497.25 949.7L526.75 949.7L530 1024L494 1024ZM503.71 801.86L520.29 801.86L522.78 858.71L501.22 858.71ZM506.23 744.05L517.77 744.05L518.87 769.25L505.13 769.25ZM507.58 713.23L516.42 713.23L517.04 727.41L506.96 727.41ZM508.41 694.07L515.59 694.07L515.98 703.15L508.02 703.15ZM508.98 681.01L515.02 681.01L515.29 687.32L508.71 687.32Z" fill="#FFFFFF"/>
