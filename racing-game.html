<!DOCTYPE html>
<html lang="en">
<head>

<title>Aurum Run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07050f;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{position:fixed;inset:0;font-family:"Courier New",Courier,monospace;color:#ffd75e}
#bar{position:fixed;left:0;right:0;top:0;height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#150d28;border-bottom:2px solid #3d2a6a;z-index:5}
#bar .t{flex:1;min-width:0;font-size:12px;font-weight:bold;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{flex:none;font:bold 11px "Courier New",Courier,monospace;color:#ffd75e;background:#2a1a4a;border:2px solid #ffd75e;padding:0 6px;height:20px;cursor:pointer;touch-action:manipulation}
#bar button:active{background:#ffd75e;color:#150d28}
body.touch #bar{height:38px}
body.touch #bar button{height:30px;padding:0 9px;font-size:12px}
#c{position:absolute;left:0;top:28px;width:320px;height:200px;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;touch-action:none}
#tc{display:none}
#tc.on{display:block}
.tb{position:fixed;z-index:6;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,215,94,.75);background:rgba(21,13,40,.55);color:#ffd75e;font:bold 20px "Courier New",Courier,monospace;border-radius:10px;touch-action:none}
.tb.on{background:rgba(255,215,94,.6);color:#150d28}
#tS{position:fixed;z-index:6;display:flex;gap:8px;touch-action:none}
#tS .tb{position:relative;flex:1 1 0;height:100%;pointer-events:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

<div id="bar"><span class="t">VANTARI AURUM GT-X &middot; MSRP $4,850,000 &middot; GRAPHICS BUDGET $12</span><button id="bP" type="button" tabindex="-1">PAUSE</button><button id="bM" type="button" tabindex="-1">SOUND:ON</button><button id="bR" type="button" tabindex="-1">RESTART</button></div>
<canvas id="c" width="320" height="200" aria-label="Aurum Run racing game"></canvas>
<div id="tc"><div id="tS"><div class="tb" id="tL">&lt;</div><div class="tb" id="tR">&gt;</div></div><div class="tb" id="tB" data-k="down">BRK</div><div class="tb" id="tG" data-k="up">GAS</div><div class="tb" id="tN" data-k="nitro">NOS</div></div>

<script>
(function(){
'use strict';
/* ===== Config ===== */
// W/H/HZ/SY change with the window (see layout); SX stays fixed so the road and car keep their pixel size
var W=320,H=200,HZ=100,SY=100,SX=160,
  SEG=200,RUMBLE=3,ROADW=1300,CAMH=1000,CAMD=1/Math.tan(50*Math.PI/180),PLAYERZ=CAMH*CAMD,
  DRAW=150,FOGD=3.5,FL=8,LANE=2/3,
  MAXS=SEG*60,BOOSTS=MAXS*1.3,ACCEL=MAXS/5,BRAKE=-MAXS,DECEL=-MAXS/5,OFFDECEL=-MAXS/2,OFFLIMIT=MAXS/4,CENTRIF=0.3,
  PW=0.37,STICKER=4850000,MPH=212/MAXS,START_TIME=45,
  WMIN=232,WMAX=400,HMIN=200,HMAX=360,
  LS_BEST='aurumRun.best',LS_MUTE='aurumRun.mute';

/* ===== Helpers ===== */
function $(id){return document.getElementById(id);}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function easeIn(a,b,p){return a+(b-a)*p*p;}
function easeIO(a,b,p){return a+(b-a)*(0.5-Math.cos(p*Math.PI)/2);}
function overlap(x1,w1,x2,w2,p){var h=(p||1)/2;return !((x1+w1*h)<(x2-w2*h)||(x1-w1*h)>(x2+w2*h));}
function hex(c){var n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){var x=hex(a),y=hex(b);return 'rgb('+Math.round(lerp(x[0],y[0],t))+','+Math.round(lerp(x[1],y[1],t))+','+Math.round(lerp(x[2],y[2],t))+')';}
function commas(v){return String(Math.abs(Math.round(v))).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function money(v){return (v<0?'-$':'$')+commas(v);}
function tri(v){v-=Math.floor(v);return 1-Math.abs(v*2-1);}
function mk(w,h,f){var c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function circ(g,cx,cy,r,c){g.fillStyle=c;for(var y=-r;y<=r;y++){var hw=Math.floor(Math.sqrt(r*r-y*y)+0.3);g.fillRect(cx-hw,cy+y,hw*2+1,1);}}
function mirror(c){return mk(c.width,c.height,function(g,w){g.translate(w,0);g.scale(-1,1);g.drawImage(c,0,0);});}
function load(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
function save(k,v){try{window.localStorage.setItem(k,String(v));}catch(e){}}

/* ===== 3x5 pixel font ===== */
var FD={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011010101010',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'.':'000000000000010',',':'000000000010100',':':'000010000010000','!':'010010010000010','?':'111001010000010','-':'000000111000000','+':'000010111010000','/':'001001010100100',"'":'010010000000000','"':'101101000000000','%':'101001010100101','(':'010100100100010',')':'010001001001010','=':'000111000111000','<':'001010100010001','>':'100010001010100','*':'000101010101000','&':'010101010101011','#':'101111101111101','_':'000000000000111'};
function gw(ch){var b=FD[ch==='$'?'S':ch];return b?b.length/5:3;}
function glyph(g,ch,x,y,sc){var b=FD[ch==='$'?'S':ch];if(!b)return;var w=b.length/5;for(var p=0;p<b.length;p++)if(b.charCodeAt(p)===49)g.fillRect(x+(p%w)*sc,y+((p/w)|0)*sc,sc,sc);if(ch==='$'){g.fillRect(x+sc,y-sc,sc,sc);g.fillRect(x+sc,y+5*sc,sc,sc);}}
function tw(s,sc){s=String(s).toUpperCase();sc=sc||1;var w=-sc;for(var i=0;i<s.length;i++)w+=(gw(s[i])+1)*sc;return w;}
function txt(g,s,x,y,c,sc,al,sh){s=String(s).toUpperCase();sc=sc||1;var w=tw(s,sc),i,cx,o=sc>1?2:1;
  if(al===1)x-=w/2;else if(al===2)x-=w;x=Math.round(x);y=Math.round(y);
  if(sh){g.fillStyle=sh;for(i=0,cx=x;i<s.length;i++){glyph(g,s[i],cx+o,y+o,sc);cx+=(gw(s[i])+1)*sc;}}
  g.fillStyle=c;for(i=0,cx=x;i<s.length;i++){glyph(g,s[i],cx,y,sc);cx+=(gw(s[i])+1)*sc;}return w;}
// centred text that word-wraps to the canvas width; returns the number of lines
function txtW(g,s,x,y,c,sc,sh){var ws=String(s).split(' '),L=[],ln='',max=W-8,i;
  for(i=0;i<ws.length;i++){var t=ln?ln+' '+ws[i]:ws[i];if(ln&&tw(t,sc)>max){L.push(ln);ln=ws[i];}else ln=t;}if(ln)L.push(ln);
  for(i=0;i<L.length;i++)txt(g,L[i],x,y+i*(6*(sc||1)+2),c,sc,1,sh);return L.length;}

/* ===== Themes (one per stage, cycling) ===== */
var TH=[
 {n:'GOLD COAST',sky:['#2a1450','#5a1e6a','#a03070','#e0566a','#f88a50','#ffc060'],fog:'#f6ae66',orb:'sun',fs:'mtn',far:'#7a3a7a',farH:'#a05a90',near:'#3a1f4e',
  grass:['#5aa040','#4e9238'],road:['#6e6a7a','#67637a'],rumble:['#f6f0e6','#d8283a'],lane:'#f6f0e6',dust:'#c8b080',
  props:[['palm',4,0.75,1.35,2.0],['palm',9,0.5,2.2,3.4],['rock',23,0.4,1.4,2.6],['bill',97,1,1.45,1.6]]},
 {n:'DUNE DESERT',sky:['#2a64c8','#3c7ad8','#5a96e4','#82b4ee','#b2d2f6','#e2f0fe'],fog:'#e8f0f8',orb:'noon',fs:'mesa',far:'#c8784e',farH:'#a85a34',near:'#d8a060',
  grass:['#e6c27a','#dab46a'],road:['#7a726c','#736b65'],rumble:['#fafafa','#e0452a'],lane:'#fafafa',dust:'#f0d8a0',
  props:[['cactus',6,0.55,1.35,3.0],['rock',11,0.45,1.4,3.2],['bill',89,1,1.45,1.6]]},
 {n:'NEON CITY',sky:['#05030e','#0b0822','#161038','#26184e','#46206e'],fog:'#3a1c5e',orb:'moon',fs:'city',far:'#2a2450',farH:'#3a3470',near:'#16122e',
  grass:['#1c1a30','#17152a'],road:['#33324a','#2e2d44'],rumble:['#ff3ad8','#30e8ff'],lane:'#ffe14d',dust:'#8a80b0',
  props:[['lamp',10,1,1.32,1.32],['bldg',6,0.8,2.3,3.4],['neon',61,1,1.45,1.6]]},
 {n:'ALPINE PASS',sky:['#3a8ad6','#58a2e2','#7cbaec','#a6d2f2','#d0e8f8','#eef8ff'],fog:'#eef6fc',orb:'day',fs:'peak',far:'#7c8aa6',farH:'#9aa6be',near:'#3a6a50',
  grass:['#eef2f8','#dde4ee'],road:['#5c6272','#565c6c'],rumble:['#ffffff','#2a5ad0'],lane:'#ffffff',dust:'#ffffff',
  props:[['pine',3,0.7,1.35,2.2],['pine',5,0.6,2.2,3.6],['rock',17,0.4,1.4,2.4],['bill',109,1,1.45,1.6]]}
];
// fog-blended colour ladders, precomputed so the road renderer never builds strings per frame
var PAL=TH.map(function(t){function lv(c){var a=[];for(var i=0;i<FL;i++)a.push(mix(t.fog,c,i/(FL-1)));return a;}
  return {grass:[lv(t.grass[0]),lv(t.grass[1])],road:[lv(t.road[0]),lv(t.road[1])],rumble:[lv(t.rumble[0]),lv(t.rumble[1])],lane:lv(t.lane)};});

/* ===== Procedural pixel art ===== */
var SD={},TT=[],TIMG=[],IMG={},carC,carG,skyKey='';
function cloud(g,x,y,s,c){circ(g,x,y,s,c);circ(g,x+s,y-(s>>1),Math.round(s*1.3),c);circ(g,x+2*s,y,s,c);g.clearRect(x-s-2,y+2,4*s+8,s*2);}
// dithered sky, rebuilt whenever the view size changes
function mkSky(t){return mk(W,HZ+8,function(g,w,h){
  var id=g.createImageData(w,h),d=id.data,cols=t.sky.map(hex),n=cols.length-1,B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],x,y;
  for(y=0;y<h;y++){var tt=Math.min(1,y/(h-8))*n,i=Math.min(n-1,Math.floor(tt)),f=tt-i;
    for(x=0;x<w;x++){var c=f*16>B[(y&3)*4+(x&3)]+0.5?cols[i+1]:cols[i],k=(y*w+x)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}
  g.putImageData(id,0,0);
  if(t.orb==='moon'){var sh=Math.max(10,h-36),ns=Math.round(w*sh*0.0048);for(x=0;x<ns;x++)R(g,ri(0,w-1),ri(0,sh),1,1,pick(['#ffffff','#a0a0ff','#ffe0a0','#ffffff']));}
});}
// sun / moon disc: drawn on its own so it can swing with the road but never leave the sky
function mkDisc(t){var r,dy,ph,c;
  if(t.orb==='sun'){r=28;dy=-20;ph=0.3;c=mk(57,57,function(g){for(var y=-r;y<=r;y++){if(y>0&&(y%7)<Math.floor(y/9)+1)continue;var hw=Math.floor(Math.sqrt(r*r-y*y));R(g,28-hw,28+y,hw*2+1,1,mix('#fff27a','#ff3a8a',(y+r)/(2*r)));}});}
  else if(t.orb==='noon'){r=14;dy=-78;ph=0.9;c=mk(29,29,function(g){circ(g,14,14,14,'rgba(255,255,255,.25)');circ(g,14,14,10,'#fffbe6');});}
  else if(t.orb==='moon'){r=11;dy=-70;ph=-0.8;c=mk(23,23,function(g){circ(g,11,11,11,'#eef0ff');g.globalCompositeOperation='destination-out';circ(g,17,7,10,'#000');g.globalCompositeOperation='source-over';});}
  else{r=12;dy=-78;ph=-0.6;c=mk(25,25,function(g){circ(g,12,12,12,'rgba(255,255,255,.3)');circ(g,12,12,8,'#ffffff');});}
  return {c:c,o:r,dy:dy,ph:ph};}
// clouds / heat streaks, anchored to the horizon (image row 100 = horizon)
function mkClouds(t){if(t.orb==='moon')return null;return mk(640,108,function(g){var k;
  if(t.orb==='sun')for(k=0;k<9;k++)R(g,ri(10,560),ri(48,92),ri(24,70),ri(1,2),k%2?'rgba(255,150,180,.7)':'rgba(255,200,150,.5)');
  else if(t.orb==='noon')for(k=0;k<5;k++)cloud(g,30+k*120+ri(0,40),ri(30,64),ri(4,7),'#ffffff');
  else for(k=0;k<6;k++)cloud(g,20+k*100+ri(0,40),ri(26,70),ri(4,8),'#ffffff');});}
function mkFar(t){return mk(640,60,function(g,w,h){var x,hh,k,y;
  if(t.fs==='mtn'){for(x=0;x<w;x++){hh=Math.round(24+11*Math.sin(x/w*6.283*3+1)+6*Math.sin(x/w*6.283*7)+3*Math.sin(x/w*6.283*13+2));R(g,x,h-hh,1,hh,t.far);R(g,x,h-hh,1,1,t.farH);}}
  else if(t.fs==='mesa'){var M=[];for(k=0;k<6;k++)M.push([k*107+rnd(0,40),rnd(18,44),rnd(14,36)]);
    for(x=0;x<w;x++){hh=4;for(k=0;k<M.length;k++){var d=Math.abs(x-M[k][0]);d=Math.min(d,w-d);var e=d-M[k][1]/2,v=e<=0?M[k][2]:e<7?M[k][2]*(1-e/7):0;if(v>hh)hh=v;}
      hh=Math.round(hh);R(g,x,h-hh,1,hh,t.far);for(y=h-hh+3;y<h;y+=5)R(g,x,y,1,1,t.farH);}}
  else if(t.fs==='city'){x=0;while(x<w){var bw=Math.min(w-x,ri(8,22));hh=ri(12,52);R(g,x,h-hh,bw,hh,t.far);R(g,x,h-hh,bw,1,t.farH);
      for(y=h-hh+3;y<h-2;y+=4)for(k=x+2;k<x+bw-1;k+=3)if(Math.random()<0.3)R(g,k,y,1,1,Math.random()<0.7?'#ffd75e':'#7ae0ff');x+=bw;}}
  else{for(x=0;x<w;x++){hh=Math.round(14+18*tri(x/w*4)+8*tri(x/w*11+0.3)+3*tri(x/w*23));R(g,x,h-hh,1,hh,t.far);if(hh>30)R(g,x,h-hh,1,Math.round((hh-30)*0.8)+1,'#f4f8ff');}}
});}
function mkNear(t){return mk(640,34,function(g,w,h){var x,k,hs=[];
  if(t.fs==='city'){x=0;while(x<w){var bw=Math.min(w-x,ri(10,26)),hh=ri(6,24);R(g,x,h-hh,bw,hh,t.near);for(k=0;k<3;k++)if(Math.random()<0.5)R(g,x+ri(1,bw-2),h-hh+ri(2,hh-2),1,1,'#ff3ad8');x+=bw;}return;}
  for(x=0;x<w;x++){hs[x]=Math.round(10+5*Math.sin(x/w*6.283*5)+4*Math.sin(x/w*6.283*11+1));R(g,x,h-hs[x],1,hs[x],t.near);}
  if(t.fs==='peak')for(x=3;x<w-3;x+=ri(4,9)){var b=h-hs[x]+2;for(k=0;k<8;k++)R(g,x-(k>>1),b-8+k,(k>>1)*2+1,1,'#1e4a34');}
});}
function mkPalm(){return mk(34,52,function(g){var y,i,s;
  for(y=51;y>=14;y--){var t=(51-y)/37,x=Math.round(12+5*t*t);R(g,x,y,3,1,y%4?'#9a6a34':'#6a4020');R(g,x+2,y,1,1,'#5a3418');}
  var L=[[-13,5],[-11,-2],[-6,-8],[2,-10],[9,-6],[13,3],[7,10],[-8,9],[0,12]];
  for(i=0;i<L.length;i++)for(s=0;s<=12;s++){var u=s/12;R(g,Math.round(16+L[i][0]*u),Math.round(13+L[i][1]*u+4*u*u),2,2,i%2?'#2a7a32':'#48ac46');}
  R(g,15,13,3,3,'#5a3a1a');R(g,17,15,2,2,'#4a2a10');});}
function mkCactus(){return mk(18,34,function(g){
  R(g,6,2,5,32,'#3e8e3a');R(g,7,1,3,1,'#3e8e3a');R(g,7,3,1,30,'#6cc060');R(g,10,3,1,30,'#2a6a28');
  R(g,1,8,3,9,'#3e8e3a');R(g,1,15,6,3,'#3e8e3a');R(g,2,8,1,8,'#6cc060');
  R(g,14,5,3,8,'#3e8e3a');R(g,10,11,7,3,'#3e8e3a');R(g,14,5,1,7,'#6cc060');});}
function mkRock(){return mk(24,14,function(g){for(var y=0;y<14;y++){var hw=Math.round(12*Math.sqrt(Math.max(0,1-Math.pow((13-y)/13.5,2))));R(g,12-hw,y,hw*2,1,y<4?'#b0a090':y>10?'#5a4c40':'#8a7a6a');}R(g,9,6,1,3,'#5a4c40');R(g,10,8,2,1,'#5a4c40');});}
function mkPine(){return mk(28,50,function(g){var T=[[2,18,7],[10,31,10],[20,44,13]],k,y;R(g,12,42,4,8,'#5a3a1e');
  for(k=0;k<3;k++)for(y=T[k][0];y<=T[k][1];y++){var w=Math.round(T[k][2]*(y-T[k][0])/(T[k][1]-T[k][0]));R(g,14-w,y,2*w+1,1,'#1e5a3a');R(g,14-w,y,2,1,'#f2f6ff');if(y>T[k][1]-2)R(g,14-w,y,2*w+1,1,'#dfe8f4');}});}
function mkLamp(){return mk(14,60,function(g){R(g,2,6,3,54,'#4a4a5a');R(g,2,6,1,54,'#6a6a7a');R(g,2,4,10,2,'#4a4a5a');R(g,8,6,5,2,'#ffe680');R(g,7,8,7,4,'rgba(255,230,128,.3)');});}
function mkBldg(col){return mk(40,74,function(g){var x,y,r;R(g,0,4,40,70,col);R(g,0,4,40,1,'#ff3ad8');R(g,18,0,1,4,'#888');R(g,18,0,1,1,'#ff4040');
  for(y=8;y<70;y+=6)for(x=3;x<37;x+=5){r=Math.random();R(g,x,y,3,3,r<0.35?'#ffd75e':r<0.5?'#7ae0ff':'#2a2650');}});}
function mkBill(a,b,bg,c1,c2,fr){return mk(50,38,function(g){R(g,10,24,3,14,'#4a3a2a');R(g,37,24,3,14,'#4a3a2a');R(g,0,0,50,26,fr);R(g,2,2,46,22,bg);txt(g,a,25,6,c1,1,1);txt(g,b,25,14,c2,1,1);});}

/* ===== Track generation (infinite, built ahead of the player) ===== */
// segs[] only holds a window of the track: seg(i) maps an absolute index to it, old ones are spliced off
var segs=[],sb=0,genY=0,genStage=1,genNext=0,genTheme=0;
function seg(i){return segs[i-sb];}
function stageLen(s){return Math.min(3000,1500+200*s);}
function bonusFor(s){return Math.round(stageLen(s)/Math.min(56,42+2*s));}
function addSeg(curve,y){
  var i=sb+segs.length,s={i:i,curve:curve,sprites:[],cars:[],light:((i/RUMBLE)|0)%2,cp:i===16?1:0,th:genTheme,clip:H,lvl:FL-1,fog:1,
    p1:{x:0,y:genY,z:i*SEG,cz:1,s:0,X:0,Y:0,Wd:0},p2:{x:0,y:y,z:(i+1)*SEG,cz:1,s:0,X:0,Y:0,Wd:0}};
  genY=y;
  if(i===genNext){s.cp=2;genStage++;genNext+=stageLen(genStage);genTheme=(genStage-1)%TH.length;}
  segs.push(s);decorate(s);
}
function addRoad(a,b,c,cu,h){var sY=genY,eY=sY+h*SEG,n=a+b+c,k;
  for(k=0;k<a;k++)addSeg(easeIn(0,cu,k/a),easeIO(sY,eY,k/n));
  for(k=0;k<b;k++)addSeg(cu,easeIO(sY,eY,(a+k)/n));
  for(k=0;k<c;k++)addSeg(easeIO(cu,0,k/c),easeIO(sY,eY,(a+b+k)/n));}
function genPiece(){
  var d=Math.min(1,(genStage-1)/6),side=Math.random()<0.5?-1:1,C=side*(2+Math.random()*(1.5+3*d)),r=Math.random();
  function hill(){if(Math.random()<0.4)return 0;var h=ri(1,3)*12*(Math.random()<0.5?-1:1),cy=genY/SEG;if(cy>50)h=-Math.abs(h);else if(cy<-50)h=Math.abs(h);return h;}
  if(r<0.2-0.08*d)addRoad(ri(10,25),ri(15,50),ri(10,25),0,hill());
  else if(r<0.55)addRoad(ri(15,30),ri(15,45),ri(15,30),C,hill());
  else if(r<0.75){addRoad(ri(12,22),ri(8,22),ri(12,22),C,0);addRoad(ri(12,22),ri(8,22),ri(12,22),-C,hill());}
  else if(r<0.88){var h=ri(2,3)*12;addRoad(20,20,20,0,h);addRoad(20,20,20,C*0.5,-h);}
  else addRoad(ri(25,40),ri(50,90),ri(25,40),C*0.55,hill());
}
function ensure(n){while(sb+segs.length<n)genPiece();}
function segAt(z){return seg(Math.floor(z/SEG));}
function addSpr(s,type,off){var d=SD[type],set=(d.mir&&off>0)?d.mir:d.imgs;s.sprites.push({d:d,img:set[(Math.random()*set.length)|0],off:off});}
function decorate(s){
  if(s.cp||s.i<14)return;
  var t=TH[s.th],i=s.i,k,p,side;
  if(Math.abs(s.curve)>=2.5&&i%7===0)addSpr(s,s.curve>0?'chevR':'chevL',(s.curve>0?-1:1)*1.3);
  for(k=0;k<t.props.length;k++){p=t.props[k];
    for(side=-1;side<=1;side+=2){
      if((i+(side>0?(p[1]>>1):0))%p[1]!==0)continue;
      if((p[0]==='bill'||p[0]==='neon')&&side!==(((i/p[1])|0)%2?1:-1))continue;
      if(Math.random()>p[2])continue;
      addSpr(s,p[0],side*rnd(p[3],p[4]));}}
}

/* ===== Update ===== */
function bgUpdate(ps,moved,dt){
  skyOff+=0.001*ps.curve*moved;hillOff+=0.002*ps.curve*moved;treeOff+=0.003*ps.curve*moved;
  if(ps.th!==bgCur){bgPrev=bgCur;bgCur=ps.th;bgT=0;}if(bgT<1)bgT=Math.min(1,bgT+dt/1.8);
  wheel=(wheel+speed*dt/300)%12;
  var b=((position+PLAYERZ)/SEG|0)-70;if(b-sb>=200){segs.splice(0,b-sb);sb=b;}
}
function attract(dt){
  ensure(((position+PLAYERZ)/SEG|0)+DRAW+10);
  var ps=segAt(position+PLAYERZ),st=position;speed=MAXS*0.45;position+=speed*dt;
  playerX+=(-ps.curve*0.06-playerX)*Math.min(1,dt*2);lean=ps.curve>1.5?1:ps.curve<-1.5?-1:0;braking=false;boosting=false;
  bgUpdate(ps,(position-st)/SEG,dt);
}
function update(dt){
  clock+=dt;
  if(screen==='paused')return;
  var i,p;
  for(i=parts.length-1;i>=0;i--){p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;}

    txt(ctx,rows[i][0],x0,y,'#c0b0e0',1,0);txt(ctx,rows[i][1],x1,y,rows[i][2],1,2);y+=8;}
  y+=3;txt(ctx,'SCORE',x0,y+3,Y,1,0);txt(ctx,commas(score()),x1,y,Y,2,2,'#000');y+=15;
  if(newRec){if(blink(4))txt(ctx,'NEW RECORD!',W/2,y,'#7af07a',2,1,'#000');}else txt(ctx,'BEST '+commas(best),W/2,y+2,'#c0b0e0',1,1);
  if(goT>0.8&&blink(2))txt(ctx,tcOn?'TAP TO RETRY':'PRESS ENTER OR TAP TO RETRY',W/2,y+17,Y,1,1,'#000');
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(shake>0&&screen==='playing')ctx.setTransform(1,0,0,1,Math.round(rnd(-3,3)*shake),Math.round(rnd(-2,2)*shake));
  renderWorld(screen==='title'?2:1);drawParts();
  ctx.setTransform(1,0,0,1,0,0);
  if(screen==='title')drawTitle();
  else if(screen==='gameover')drawOver();
  else{drawHUD();if(screen==='paused')drawPause();}
}

/* ===== Audio (WebAudio, created only inside a real user gesture) ===== */
var AC=null,master=null,eng=null,nbuf=null;
function gesture(){var u=navigator.userActivation;return !u||u.isActive;}
function initAudio(){
  if(!gesture())return;
  if(AC){if(AC.state==='suspended'){try{var pr=AC.resume();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}}return;}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    var o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=500;g.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();eng={o1:o1,o2:o2,f:f,g:g};
    nbuf=AC.createBuffer(1,(AC.sampleRate*0.6)|0,AC.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;eng=null;}
}
function tone(f,d,type,v,f2,dl){if(!AC||muted)return;var t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);}
function noise(d,v,fq){if(!AC||muted||!nbuf)return;var t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.05);}
function sfx(n){if(!AC||muted)return;
  if(n==='crash'){noise(0.5,0.6,900);tone(140,0.3,'sawtooth',0.15,40);tone(1568,0.08,'square',0.05,0,0.18);tone(2093,0.25,'square',0.05,0,0.26);}
  else if(n==='bump'){noise(0.15,0.3,700);tone(220,0.1,'square',0.05,110);}
  else if(n==='cp'){[523,659,784,1047].forEach(function(f,i){tone(f,0.14,'square',0.07,0,i*0.08);});}
  else if(n==='miss')tone(880+combo*110,0.09,'square',0.05,1320+combo*110);
  else if(n==='boost')noise(0.45,0.2,2600);
  else if(n==='tick')tone(1200,0.05,'square',0.05);
  else if(n==='start'){tone(440,0.12,'square',0.06);tone(880,0.2,'square',0.06,0,0.14);}
  else if(n==='over'){tone(392,0.2,'triangle',0.08,0,0);tone(311,0.2,'triangle',0.08,0,0.2);tone(262,0.45,'triangle',0.08,0,0.4);}
}
function engUpd(){if(!eng)return;var t=AC.currentTime,sp=speed/MAXS,on=screen==='playing'&&!muted,f=42+sp*150+(boosting?40:0);
  eng.o1.frequency.setTargetAtTime(f,t,0.05);eng.o2.frequency.setTargetAtTime(f*0.5,t,0.05);eng.f.frequency.setTargetAtTime(300+sp*1400,t,0.1);eng.g.gain.setTargetAtTime(on?0.04+sp*0.05:0,t,0.08);}
// silence the engine at once (rAF stops in hidden tabs, so engUpd would never get the chance)
function hush(){if(!eng)return;try{var t=AC.currentTime;eng.g.gain.cancelScheduledValues(t);eng.g.gain.setValueAtTime(0,t);}catch(e){}}
function toggleMute(){muted=!muted;save(LS_MUTE,muted?'1':'0');if(master)master.gain.value=muted?0:0.5;updBtns();}

/* ===== Input ===== */
var KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'nitro'};
var KF={' ':'Space',a:'KeyA',d:'KeyD',w:'KeyW',s:'KeyS',p:'KeyP',r:'KeyR',m:'KeyM',esc:'Escape',arrowleft:'ArrowLeft',arrowright:'ArrowRight',arrowup:'ArrowUp',arrowdown:'ArrowDown',enter:'Enter',escape:'Escape'};
function kcode(e){var c=e.code;if(!c||c==='Unidentified')c=KF[String(e.key||'').toLowerCase()]||e.key;return c;}
function pauseNow(){if(screen==='playing'){screen='paused';hush();updBtns();}}
function togglePause(){if(screen==='playing')pauseNow();else if(screen==='paused')resume();}
// a nitro key/pad still held on resume must be released first, or it would fire instantly
function resume(){if(screen==='paused'){screen='playing';if(keys.nitro)nitroLock=true;updBtns();}}
function restart(){startGame();}
function autoPause(){for(var k in keys)keys[k]=0;clearTouch();pauseNow();hush();}
function tapAction(){if(screen==='title')startGame();else if(screen==='paused')resume();else if(screen==='gameover'&&goT>0.8)startGame();}
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var c=kcode(e),k=KM[c];
  if(k||c==='Enter'||c==='Escape'||c==='KeyP'||c==='KeyR'||c==='KeyM')e.preventDefault();
  initAudio();
  if(k)keys[k]=1;
  if(e.repeat)return;
  if(c==='KeyP'||c==='Escape')togglePause();
  else if(c==='KeyR')restart();
  else if(c==='KeyM')toggleMute();
  else if(c==='Enter'||c==='Space'){if(screen==='title')startGame();else if(screen==='gameover'&&goT>0.8)startGame();else if(screen==='paused'&&c==='Enter')resume();}
});
window.addEventListener('keyup',function(e){var c=kcode(e),k=KM[c];if(k){keys[k]=0;e.preventDefault();}if(c==='Space')nitroLock=false;initAudio();});
// canvas: tap starts / resumes / retries; during a run a touch or pen tap pauses
cv.addEventListener('pointerdown',function(e){if(e.pointerType==='touch')enableTouch();initAudio();
  if(screen==='playing'){if(e.pointerType!=='mouse')pauseNow();}else tapAction();});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('pointerdown',function(e){if(e.pointerType==='touch')enableTouch();});
window.addEventListener('pointerup',initAudio);window.addEventListener('click',initAudio);
window.addEventListener('touchend',initAudio,{passive:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause();});
window.addEventListener('blur',autoPause);
function btn(id,f){var b=$(id);b.addEventListener('mousedown',function(e){e.preventDefault();});b.addEventListener('click',function(){initAudio();f();b.blur();});}
btn('bP',function(){if(screen==='title')startGame();else togglePause();});
btn('bM',toggleMute);btn('bR',restart);
function updBtns(){$('bM').textContent=muted?'SOUND:OFF':'SOUND:ON';$('bP').textContent=screen==='paused'?'RESUME':'PAUSE';}
// pedal pads: each pad tracks its own pointers so multi-touch (steer + gas + nitro) works
var pads=[];
Array.prototype.forEach.call(document.querySelectorAll('.tb[data-k]'),function(b){
  var k=b.getAttribute('data-k'),pad={b:b,k:k,ids:{}};pads.push(pad);
  function upd(){var on=Object.keys(pad.ids).length>0;keys[k]=on?1:0;b.classList.toggle('on',on);if(!on&&k==='nitro')nitroLock=false;}
  b.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();pad.ids[e.pointerId]=1;try{b.setPointerCapture(e.pointerId);}catch(_){}upd();tapAction();});
  function end(e){if(pad.ids[e.pointerId]){delete pad.ids[e.pointerId];upd();}}
  b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
});
// steering: one zone split in half, so a thumb can slide from < to > without lifting
var stEl=$('tS'),stIds={};
function stSide(e){var r=stEl.getBoundingClientRect();return e.clientX<r.left+r.width/2?-1:1;}
function stUpd(){var l=0,r=0;for(var id in stIds){if(stIds[id]<0)l=1;else r=1;}keys.left=l;keys.right=r;$('tL').classList.toggle('on',!!l);$('tR').classList.toggle('on',!!r);}
stEl.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();stIds[e.pointerId]=stSide(e);try{stEl.setPointerCapture(e.pointerId);}catch(_){}stUpd();tapAction();});
stEl.addEventListener('pointermove',function(e){if(stIds[e.pointerId]){var s=stSide(e);if(s!==stIds[e.pointerId]){stIds[e.pointerId]=s;stUpd();}}});
function stEnd(e){if(stIds[e.pointerId]){delete stIds[e.pointerId];stUpd();}}
stEl.addEventListener('pointerup',stEnd);stEl.addEventListener('pointercancel',stEnd);stEl.addEventListener('lostpointercapture',stEnd);
stEl.addEventListener('contextmenu',function(e){e.preventDefault();});
function clearTouch(){pads.forEach(function(p){p.ids={};p.b.classList.remove('on');});stIds={};$('tL').classList.remove('on');$('tR').classList.remove('on');}
function enableTouch(){if(tcOn)return;tcOn=true;$('tc').className='on';document.body.classList.add('touch');layout();}

/* ===== Layout: internal resolution adapts to the window, upscaled by whole device pixels ===== */
var view={w:W,h:H,scale:1,dpr:1};
function place(el,l,r,b,w,h,fs){var s=el.style;s.left=l==null?'auto':l+'px';s.right=r==null?'auto':r+'px';s.bottom=b+'px';s.width=w+'px';s.height=h+'px';if(fs)s.fontSize=fs+'px';}
function placePads(P,sab,sl,sr){
  var b=12+sab,G=Math.round(P*1.1),B=Math.round(P*0.82),N=Math.round(P*0.55),fs=Math.round(P*0.26);
  place(stEl,12+sl,null,b,2*P+8,P);$('tL').style.fontSize=$('tR').style.fontSize=Math.round(P*0.34)+'px';
  place($('tG'),null,12+sr,b,G,G,fs);place($('tB'),null,12+sr+G+10,b,B,B,Math.round(fs*0.85));place($('tN'),null,12+sr,b+G+10,G,N,Math.round(fs*0.85));
}
function layout(){
  var vw=window.innerWidth||320,vh=window.innerHeight||200,dpr=clamp(window.devicePixelRatio||1,1,4),barH=$('bar').offsetHeight||28,portrait=vh>vw;
  var cs=window.getComputedStyle($('sa')),sab=parseFloat(cs.paddingBottom)||0,sl=parseFloat(cs.paddingLeft)||0,sr=parseFloat(cs.paddingRight)||0;
  var ax=sl,aw=vw-sl-sr,ah=vh-barH,P;
  if(tcOn){
    // portrait: pads get a strip below the picture; landscape: pads get a column on each side
    if(portrait){P=Math.round(clamp(Math.min((vw-60)/3.95,vh*0.105),46,88));ah-=Math.round(40+1.65*P+sab);}
    else{P=Math.round(clamp(Math.min(vh*0.2,vw*0.09),44,80));var col=Math.round(32+2*P);ax=col+sl;aw=vw-2*col-sl-sr;}
    placePads(P,sab,sl,sr);
  }
  aw=Math.max(80,aw);ah=Math.max(60,ah);
  var awd=aw*dpr,ahd=ah*dpr,sm=Math.min(awd/WMIN,ahd/HMIN),s=Math.floor(sm);
  // whole device pixels when that costs little; on dense phone screens a fractional scale is barely visible and keeps text readable
  if(s<2||(dpr>=2&&s<4&&s/sm<0.85))s=sm;
  var w=clamp(Math.floor(awd/s+1e-6),WMIN,WMAX),h=clamp(Math.floor(ahd/s+1e-6),HMIN,Math.max(HMIN,Math.min(HMAX,Math.round(w*1.5))));
  if(w!==W||h!==H){W=w;H=h;cv.width=W;cv.height=H;}
  ctx.imageSmoothingEnabled=false;
  SY=Math.round(100+Math.max(0,H-200)*0.6);HZ=H-SY;buildSkies();
  var cw=W*s/dpr,ch=H*s/dpr,left=ax+(aw-cw)/2,top=(tcOn&&portrait)?barH:barH+(ah-ch)/2;
  left=Math.round(left*dpr)/dpr;top=Math.round(top*dpr)/dpr;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=left+'px';cv.style.top=top+'px';
  view={w:W,h:H,scale:Math.round(s/dpr*1000)/1000,dpr:dpr,integer:s===Math.floor(s)};
}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',layout);

/* ===== Boot + main loop ===== */
buildArt();resetWorld();
try{if(('ontouchstart' in window)||navigator.maxTouchPoints>0||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches))enableTouch();}catch(e){}
layout();updBtns();
var last=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=last?(t-last)/1000:1/60;last=t;
  if(!(dt>0))return;if(dt>1/30)dt=1/30;
  var n=Math.ceil(dt*60-1e-6),h=dt/n;
  for(var i=0;i<n;i++)update(h);
  engUpd();render();
}
requestAnimationFrame(frame);

/* ===== Read-only debug handle for automated tests ===== */
window.__game=Object.freeze({get state(){return {screen:screen,score:screen==='title'?0:score(),speed:Math.round(speed*MPH),money:Math.round(value),damage:Math.round(STICKER-value),
  repairs:Math.round(repairs),restored:Math.round(restored),time:Math.round(timeLeft*10)/10,stage:stage,crashes:crashes,bumps:bumps,closeShaves:misses,combo:combo,
  insurance:INS_N[insLvl],nitro:Math.round(nitro*100)/100,best:best,ending:endReason,muted:muted,touch:tcOn,segments:segs.length,
  view:{w:view.w,h:view.h,scale:view.scale,dpr:view.dpr,integer:view.integer},player:{x:Math.round(playerX*1000)/1000,y:Math.round(playerY)}};}});
})();
</script>
