/* =====================================================================

  },

           gains: { hits: 1, ambience: 1, ui: 1, music: 1 } },

/* =====================================================================
   2. MATH, EASING, DETERMINISTIC RANDOM
   ===================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const W = CONFIG.video.width, H = CONFIG.video.height;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const invLerp = (a, b, v) => clamp((v - a) / (b - a));
const smooth = (a, b, v) => { const k = invLerp(a, b, v); return k * k * (3 - 2 * k); };
const bump = (t, a, b) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const pulse = (t, t0, decay) => t < t0 ? 0 : Math.exp(-(t - t0) / decay);

const Ease = {
  linear: k => k,
  step: k => (k < 1 ? 0 : 1),
  inQuad: k => k * k,
  outQuad: k => k * (2 - k),
  inOutQuad: k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  inCubic: k => k * k * k,
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  inQuart: k => k * k * k * k,
  outQuart: k => 1 - Math.pow(1 - k, 4),
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
const snoise = x => noise1(x) * 2 - 1; // smooth noise in [-1, 1]

/* =====================================================================
   3. TIMELINE + TRACKS
   ===================================================================== */
// Interpolates numbers, arrays and plain objects; anything else snaps at the midpoint.
function mix(a, b, k) {
  if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * k;
  if (Array.isArray(a) && Array.isArray(b)) return a.map((v, i) => mix(v, b[i], k));
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    const o = {};
    for (const key in a) o[key] = key in b ? mix(a[key], b[key], k) : a[key];
    for (const key in b) if (!(key in a)) o[key] = b[key];
    return o;
  }
  return k < 0.5 ? a : b;
}

// Keyframe track: keys = [[time, value, ease?], ...]. The ease belongs to the segment that ENDS at that key.
class Track {
  constructor(keys, ease = 'inOutSine', resolve = v => v) {
    this.keys = keys.map(k => [k[0], resolve(k[1]), k[2]]).sort((p, q) => p[0] - q[0]);
    this.ease = ease;
  }
  at(t) {
    const K = this.keys;
    if (t <= K[0][0]) return K[0][1];
    for (let i = 1; i < K.length; i++) {
      if (t < K[i][0]) {
        const [t0, v0] = K[i - 1], [t1, v1, e] = K[i];
        return mix(v0, v1, Ease[e || this.ease](clamp((t - t0) / (t1 - t0))));
      }
    }
    return K[K.length - 1][1];
  }
}

// Monotone cubic (Fritsch–Carlson) spline — smooth, never overshoots. Used for depth/climb curves.
class Spline {
  constructor(pts) {
    this.x = pts.map(p => p[0]); this.y = pts.map(p => p[1]);
    const n = pts.length, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((this.y[i + 1] - this.y[i]) / (this.x[i + 1] - this.x[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
    }
    this.m = m;
  }
  at(t) {
    const X = this.x, Y = this.y, n = X.length;
    if (t <= X[0]) return Y[0];
    if (t >= X[n - 1]) return Y[n - 1];
    let i = 0; while (t > X[i + 1]) i++;
    const h = X[i + 1] - X[i], s = (t - X[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * Y[i] + (s3 - 2 * s2 + s) * h * this.m[i] + (-2 * s3 + 3 * s2) * Y[i + 1] + (s3 - s2) * h * this.m[i + 1];
  }
}

// Scene registry: named spans on the master timeline with progress helpers.
class Timeline {
  constructor(scenes) { this.scenes = scenes; this.byName = Object.fromEntries(scenes.map(s => [s.name, s])); }
  get(name) { return this.byName[name]; }
  progress(name, t, ease = 'linear') { const s = this.byName[name]; return Ease[ease](invLerp(s.start, s.end, t)); }
  active(name, t) { const s = this.byName[name]; return t >= s.start && t < s.end; }
  current(t) { return this.scenes.find(s => t >= s.start && t < s.end) || this.scenes[this.scenes.length - 1]; }
}

// Typewriter with backspace transitions. keys = [[time, text], ...]
function typewriter(keys, t, cps = 26, eraseCps = 55) {
  let cur = '', prev = '', tk = -Infinity;
  for (const [kt, txt] of keys) if (t >= kt) { prev = cur; cur = txt; tk = kt; }
  if (tk === -Infinity) return '';
  const dt = t - tk, eraseTime = prev.length / eraseCps;
  if (dt < eraseTime) return prev.slice(0, Math.max(0, prev.length - Math.floor(dt * eraseCps)));
  return cur.slice(0, Math.floor((dt - eraseTime) * cps) + 1);
}

/* =====================================================================
   4. PARTICLES — analytic (closed-form) motion, so frames render in any order.
   ===================================================================== */
class ParticleSystem {
  constructor() { this.parts = []; }

  // spec: { t, x, y, n, seed, kind, dir:[deg,deg] (0 = right, -90 = up), speed:[a,b], life:[a,b], size:[a,b],
  //         colors:[], gravity, drag, floor (fn t->y), jitter, spread (emit-time spread), spin, grow, additive }
  burst(spec) {
    const R = mulberry32(spec.seed || 7);
    for (let i = 0; i < spec.n; i++) {
      const a = lerp(spec.dir[0], spec.dir[1], R()) * DEG, s = lerp(spec.speed[0], spec.speed[1], R());
      this.parts.push({
        kind: spec.kind || 'dirt',
        t0: spec.t + (spec.spread || 0) * R(),
        x0: spec.x + (R() - 0.5) * (spec.jitter || 0),
        y0: spec.y + (R() - 0.5) * (spec.jitterY ?? spec.jitter ?? 0),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        g: spec.gravity ?? 2400, k: spec.drag ?? 0.8,
        life: lerp(spec.life[0], spec.life[1], R()),
        size: lerp(spec.size[0], spec.size[1], R()),
        color: spec.colors[Math.floor(R() * spec.colors.length)],
        floor: spec.floor || null,
        rot: R() * TAU, spin: (R() - 0.5) * (spec.spin ?? 16),
        grow: spec.grow || 0, seed: R() * 1000, additive: !!spec.additive,
        shape: Array.from({ length: 5 }, () => 0.6 + R() * 0.5),
      });
    }
  }

  // linear-drag ballistic motion: dv/dt = g - k v
  static pos(p, tau) {
    const k = p.k;
    if (k < 1e-4) return [p.x0 + p.vx * tau, p.y0 + p.vy * tau + 0.5 * p.g * tau * tau];
    const e = (1 - Math.exp(-k * tau)) / k;
    return [p.x0 + p.vx * e, p.y0 + (p.vy - p.g / k) * e + (p.g / k) * tau];
  }

  state(p, t) {
    const tau = t - p.t0;
    if (tau < 0 || tau > p.life) return null;
    let [x, y] = ParticleSystem.pos(p, tau), landed = false, flyT = tau;
    if (p.floor) {
      const fy = p.floor(t);
      if (y > fy) { // find the moment it touched down and freeze there
        let lo = 0, hi = tau;
        for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (ParticleSystem.pos(p, m)[1] > fy) hi = m; else lo = m; }
        x = ParticleSystem.pos(p, lo)[0]; y = fy; landed = true; flyT = lo;
      }
    }
    return { x, y, age: tau / p.life, landed, rot: p.rot + p.spin * flyT };
  }

  draw(ctx, t, filter) {
    for (const p of this.parts) {
      if (filter && !filter(p)) continue;
      const s = this.state(p, t);
      if (!s) continue;
      const fade = 1 - smooth(0.65, 1, s.age);
      ctx.globalCompositeOperation = p.additive ? 'lighter' : 'source-over';
      if (p.kind === 'dirt' || p.kind === 'chunk') {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
        ctx.globalAlpha = fade;
        ctx.fillStyle = p.color;
        const r = p.size, sh = p.shape;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ctx.lineTo(Math.cos(a) * r * sh[i], Math.sin(a) * r * sh[i]); }
        ctx.closePath(); ctx.fill();
        if (p.kind === 'chunk') { ctx.strokeStyle = 'rgba(255,210,140,0.35)'; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.restore();
      } else if (p.kind === 'dust') {
        const r = p.size * (1 + p.grow * s.age), g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
        g.addColorStop(0, p.color); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.2 * (1 - s.age);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
      } else if (p.kind === 'spark') {
        const tw = 0.55 + 0.45 * Math.sin(t * 18 + p.seed);
        ctx.globalAlpha = fade * tw;
        drawSparkle(ctx, s.x, s.y, p.size * (0.7 + 0.5 * tw), p.color);
      } else if (p.kind === 'sweat') {
        const v = [p.vx, p.vy + p.g * (t - p.t0)], a = Math.atan2(v[1], v[0]);
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a + Math.PI / 2);
        ctx.globalAlpha = fade * 0.95;
        drawDrop(ctx, 0, 0, p.size, p.color);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}

// four-point twinkle
function drawSparkle(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * 0.18, 0, TAU); ctx.fill();
}

// tear/sweat drop, point facing -y
function drawDrop(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 1.9);
  ctx.bezierCurveTo(x + r * 0.5, y - r * 0.9, x + r, y - r * 0.3, x + r, y + r * 0.15);
  ctx.arc(x, y + r * 0.15, r, 0, Math.PI);
  ctx.bezierCurveTo(x - r, y - r * 0.3, x - r * 0.5, y - r * 0.9, x, y - r * 1.9);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(x - r * 0.35, y, r * 0.28, 0, TAU); ctx.fill();
}

/* =====================================================================
   5. STICKMAN — joint skeleton, pose keyframes, eyes, rim glow, held tool
   ===================================================================== */
// Angles are absolute degrees: 0 = pointing down, +90 = toward the facing direction, 180 = up.
// Hands are polar targets around the shoulder, [angle, reach 0..1 of arm length], solved with 2-bone IK.
const POSE_BASE = {
  lean: 0, head: 0,                 // torso lean (+ forward), head nod (+ down/forward)
  ground: 1, hipY: -127, hipX: 0,   // ground 1 → hip height auto-fits so the lowest foot rests on the anchor
  legF: [4, 0], legB: [-5, -2],     // [thigh, shin]
  handF: [8, 0.97], handB: [-6, 0.97],
  elbowF: 1, elbowB: 1,             // elbow bend side (+1 = natural)
  held: 1, tool: -200, toolGrip: 34, gripB: 1, toolHand: 'F', // pickaxe in front hand, back hand on handle
  armFront: 0,                      // 1 → front arm is drawn over the eyes (wiping the brow)
};

const POSES = {
  // carrying / jumping
  READY:   { lean: 6, head: 4, legF: [8, 2], legB: [-8, -4], handF: [62, 0.7], tool: -200 },
  CROUCH:  { lean: 24, head: 8, legF: [64, -16], legB: [52, -30], handF: [50, 0.62], tool: -212 },
  JUMP:    { lean: 10, head: -6, legF: [74, 12], legB: [30, -58], handF: [112, 0.8], tool: -186 },
  LAND:    { lean: 30, head: 14, legF: [76, -22], legB: [60, -38], handF: [46, 0.6], tool: -222 },
  // swing cycle
  WINDUP:  { lean: -6, head: -10, legF: [20, 4], legB: [-18, -10], handF: [172, 0.92], tool: -112 },
  HIT:     { lean: 40, head: 24, legF: [42, -8], legB: [-6, -26], handF: [32, 0.62], tool: -328 },
  RECOIL:  { lean: 32, head: 16, legF: [34, -4], legB: [-6, -20], handF: [48, 0.68], tool: -308 },
  WINDUP_LOW: { lean: 10, head: 14, legF: [16, 2], legB: [-14, -8], handF: [140, 0.8], tool: -150 },
  HIT_WEAK: { lean: 34, head: 30, legF: [30, -4], legB: [-6, -18], handF: [36, 0.66], tool: -332 },
  BIG_WINDUP: { lean: -13, head: -14, legF: [24, 6], legB: [-22, -12], handF: [178, 0.98], tool: -102 },

  SIT:     { ground: 0, hipY: -14, lean: 16, head: 26, legF: [84, 6], legB: [76, -2], handF: [50, 0.56], handB: [-12, 1], held: 0 },

  // ultra-instinct ending: tense up, stand, flex as the aura ignites, settle into a glaring stance
  SIT_TENSE: { ground: 0, hipY: -14, lean: 24, head: 26, legF: [84, 4], legB: [76, -4], handF: [46, 0.5], handB: [-24, 0.7], held: 0 },

const FACE_BASE = { size: 1, lid: 0, slant: 0, happy: 0, lookX: 0, lookY: 0, brow: 0, glow: 0 };
const FACES = {
  neutral: {},
  determined: { lid: 0.28, slant: 0.85, brow: 1 },
  focus: { lid: 0.3, slant: 0.45, brow: 1, lookY: 0.75 },
  tired: { lid: 0.5, slant: -0.12, brow: 1, lookY: 0.35, size: 0.96 },
  exhausted: { lid: 0.6, slant: -0.3, brow: 1, lookY: 0.6, size: 0.95 },
  frustrated: { lid: 0.44, slant: 0.6, brow: 1, lookY: 0.55 },
  shocked: { size: 1.45 },
  shockedDown: { size: 1.45, lookY: 0.8 },
  happy: { happy: 1, size: 1.06, lookY: -0.25 },
  sad: { lid: 0.42, slant: -0.9, brow: 1, lookY: 0.8 },
  angry: { lid: 0.4, slant: 1.2, brow: 1, lookY: 0.45 },
  ultra: { lid: 0.44, slant: 1.35, brow: 1, lookY: 0.3, size: 1.1, glow: 1 },  // red-hot glowing slits
};
const poseOf = p => Object.assign({}, POSE_BASE, typeof p === 'string' ? POSES[p] : p);
const faceOf = f => Object.assign({}, FACE_BASE, typeof f === 'string' ? FACES[f] : f);

// two-bone IK; bend side is mirrored by facing so elbows always flex naturally
function ik2(s, t, a, b, f, bend) {
  const dx = t[0] - s[0], dy = t[1] - s[1], d = Math.hypot(dx, dy) || 1e-6;
  const dc = clamp(d, Math.abs(a - b) + 1e-3, a + b - 1e-3), ux = dx / d, uy = dy / d;
  const A = Math.acos(clamp((a * a + dc * dc - b * b) / (2 * a * dc), -1, 1)) * f * (bend >= 0 ? 1 : -1);
  const ex = ux * Math.cos(A) - uy * Math.sin(A), ey = ux * Math.sin(A) + uy * Math.cos(A);
  return { elbow: [s[0] + ex * a, s[1] + ey * a], hand: [s[0] + ux * dc, s[1] + uy * dc] };
}

const MASK = document.createElement('canvas'); MASK.width = 1100; MASK.height = 1100;
const MCTX = MASK.getContext('2d');

class Stickman {
  constructor(name, dims = CONFIG.figure, style = CONFIG.style) { this.name = name; this.D = dims; this.S = style; }

  // fix = { F: [x, y, weight], B: [...] } pulls a hand toward a world point (e.g. resting on a prop)
  solve(P, ax, ay, f, sq = [1, 1], fix = null) {
    const D = this.D;
    const dir = a => [f * Math.sin(a * DEG), Math.cos(a * DEG)];
    const add = (p, d, l) => [p[0] + d[0] * l, p[1] + d[1] * l];
    const leg = ([th, sh]) => { const k = add([0, 0], dir(th), D.thigh); return [k, add(k, dir(sh), D.shin)]; };
    const [kF, aF] = leg(P.legF), [kB, aB] = leg(P.legB);
    const lowest = Math.max(aF[1], aB[1]) + D.legW * 0.5;
    const hip = [ax + f * P.hipX, ay + lerp(P.hipY, -lowest, clamp(P.ground))];
    const off = p => [hip[0] + p[0], hip[1] + p[1]];
    const up = [f * Math.sin(P.lean * DEG), -Math.cos(P.lean * DEG)];
    const neck = add(hip, up, D.torso);
    const shoulder = add(hip, up, D.torso - D.torsoW * 0.34);
    const ha = (P.lean + P.head) * DEG;
    const head = add(neck, [f * Math.sin(ha), -Math.cos(ha)], D.headR * 0.98);
    const reach = D.upperArm + D.foreArm;
    const tgt0 = h => add(shoulder, dir(h[0]), reach * h[1]);
    const tgt = h => {
      const p = tgt0(h), w = fix && (h === P.handF ? fix.F : h === P.handB ? fix.B : null);
      return w ? [lerp(p[0], w[0], w[2]), lerp(p[1], w[1], w[2])] : p;
    };
    let armF, armB, tool = null;
    const held = P.held > 0.5, td = dir(P.tool);
    if (held && P.toolHand === 'B') {
      armB = ik2(shoulder, tgt(P.handB), D.upperArm, D.foreArm, f, P.elbowB);
      tool = { butt: add(armB.hand, td, -P.toolGrip), ang: P.tool };
      armF = ik2(shoulder, tgt(P.handF), D.upperArm, D.foreArm, f, P.elbowF);
    } else {
      armF = ik2(shoulder, tgt(P.handF), D.upperArm, D.foreArm, f, P.elbowF);
      if (held) tool = { butt: add(armF.hand, td, -P.toolGrip), ang: P.tool };
      const bt = held && P.gripB > 0.5 ? add(tool.butt, td, 9) : tgt(P.handB);
      armB = ik2(shoulder, bt, D.upperArm, D.foreArm, f, P.elbowB);
    }
    const J = {
      f, hip, neck, shoulder, head,
      kneeF: off(kF), ankF: off(aF), kneeB: off(kB), ankB: off(aB),
      elbowF: armF.elbow, handF: armF.hand, elbowB: armB.elbow, handB: armB.hand, tool,
    };
    // feet: short capsules pointing forward, mostly flat
    for (const s of ['F', 'B']) {
      const sh = s === 'F' ? P.legF[1] : P.legB[1], fd = dir(90 + sh * 0.35), a = J['ank' + s];
      J['toe' + s] = add(a, fd, D.legW * 0.72);
    }
    if (sq[0] !== 1 || sq[1] !== 1) { // squash & stretch around the anchor (feet)
      const S = p => [ax + (p[0] - ax) * sq[0], ay + (p[1] - ay) * sq[1]];
      for (const k in J) if (Array.isArray(J[k])) J[k] = S(J[k]);
      if (tool) tool.butt = S(tool.butt);
    }
    return J;
  }

  hairSpikes(J, amt) {
    const R = this.D.headR, f = J.f, out = [];
    if (amt < 0.02) return out;
    const A = [-118, -94, -70, -47, -25, -4, 16], L = [0.55, 0.85, 1, 0.92, 0.8, 0.62, 0.4];
    const P = (deg, r) => [J.head[0] + f * Math.sin(deg * DEG) * r, J.head[1] - Math.cos(deg * DEG) * r];
    A.forEach((a, i) => out.push([P(a - 12, R * 0.9), P(a - 16, R + R * 0.46 * L[i] * amt), P(a + 11, R * 0.9)]));
    return out;
  }

  // st: { x, y, f, pose, face, sq, hair, steam, sweat, rimColor, glow, t }
  draw(ctx, M, st) {
    const D = this.D, S = this.S, C = CONFIG.colors, z = M[0];
    const J = this.solve(st.pose, st.x, st.y, st.f, st.sq, st.fix);
    this.lastJ = J;
    const limbs = [
      { p: [J.hip, J.kneeB, J.ankB], w: D.legW, back: 1 }, { p: [J.ankB, J.toeB], w: D.legW * 1.1, back: 1 },
      { p: [J.shoulder, J.elbowB, J.handB], w: D.armW, back: 1 },
      { p: [J.hip, J.neck], w: D.torsoW },
      { p: [J.hip, J.kneeF, J.ankF], w: D.legW }, { p: [J.ankF, J.toeF], w: D.legW * 1.1 },
      { p: [J.shoulder, J.elbowF, J.handF], w: D.armW },
    ];
    const dots = [{ c: J.handB, r: D.armW * 0.62, back: 1 }, { c: J.handF, r: D.armW * 0.62 }, { c: J.head, r: D.headR }];
    const spikes = this.hairSpikes(J, st.hair || 0);

    // ---- rim + glow: dilated silhouette on an offscreen mask, composited blurred + crisp
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const grow = p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); };
    limbs.forEach(l => l.p.forEach(grow)); grow([J.head[0], J.head[1] - D.headR * 1.6]);
    const pad = 60 + S.glowBlur * 3;
    const bx = Math.floor(M[0] * x0 + M[4] - pad - D.headR * z), by = Math.floor(M[3] * y0 + M[5] - pad - D.headR * z);
    const bw = Math.min(MASK.width, Math.ceil((x1 - x0 + D.headR * 2) * z + pad * 2));
    const bh = Math.min(MASK.height, Math.ceil((y1 - y0 + D.headR * 2) * z + pad * 2));
    const rimW = S.rimWidth / z;
    MCTX.setTransform(1, 0, 0, 1, 0, 0); MCTX.clearRect(0, 0, bw + 2, bh + 2);
    MCTX.setTransform(z, 0, 0, z, M[4] - bx, M[5] - by);
    MCTX.strokeStyle = MCTX.fillStyle = st.rimColor || C.rim;
    MCTX.lineCap = 'round'; MCTX.lineJoin = 'round';
    for (const l of limbs) { MCTX.lineWidth = l.w + rimW * 2; strokePoly(MCTX, l.p); }
    for (const d of dots) { MCTX.beginPath(); MCTX.arc(d.c[0], d.c[1], d.r + rimW, 0, TAU); MCTX.fill(); }
    MCTX.lineWidth = rimW * 2;
    for (const s of spikes) { MCTX.beginPath(); s.forEach(p => MCTX.lineTo(p[0], p[1])); MCTX.closePath(); MCTX.fill(); MCTX.stroke(); }
    if ((st.aura || 0) > 0.01) this.drawAura(ctx, M, J, st, bx, by, bw, bh);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = st.glow ?? 1;
    ctx.globalAlpha = clamp(S.glowAlpha * g, 0, 1);
    ctx.filter = `blur(${(S.glowBlur * (0.7 + 0.3 * g)).toFixed(2)}px)`;
    ctx.drawImage(MASK, 0, 0, bw, bh, bx, by, bw, bh);
    if (g > 1.2) ctx.drawImage(MASK, 0, 0, bw, bh, bx, by, bw, bh);
    ctx.filter = 'none';
    ctx.globalAlpha = S.rimAlpha;
    ctx.drawImage(MASK, 0, 0, bw, bh, bx, by, bw, bh);
    ctx.restore();

    // ---- fills
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const fillDot = d => { ctx.beginPath(); ctx.arc(d.c[0], d.c[1], d.r, 0, TAU); ctx.fill(); };
    ctx.strokeStyle = ctx.fillStyle = C.figureBack;
    limbs.filter(l => l.back).forEach(l => { ctx.lineWidth = l.w; strokePoly(ctx, l.p); });
    fillDot(dots[0]);
    ctx.strokeStyle = ctx.fillStyle = C.figure;
    ctx.lineWidth = D.torsoW; strokePoly(ctx, limbs[3].p);
    fillDot(dots[2]);
    const tint = st.hairTint || 0;
    if (tint > 0.01) { // silver, glowing ultra-instinct hair
      ctx.save();
      ctx.fillStyle = mixColor(C.figure, C.uiHair, tint);
      ctx.shadowColor = `rgba(${C.aura},${0.9 * tint})`; ctx.shadowBlur = 18 * tint * z;
    }
    for (const s of spikes) { ctx.beginPath(); s.forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
    if (tint > 0.01) ctx.restore();
    ctx.strokeStyle = ctx.fillStyle = C.figure;
    limbs.slice(4, 6).forEach(l => { ctx.lineWidth = l.w; strokePoly(ctx, l.p); });
    if (J.tool && st.toolVisible !== false) drawPickaxe(ctx, J.tool.butt, J.tool.ang, J.f);
    const frontArm = () => { ctx.strokeStyle = ctx.fillStyle = C.figure; ctx.lineWidth = limbs[6].w; strokePoly(ctx, limbs[6].p); fillDot(dots[1]); };
    if (st.pose.armFront > 0.5) { this.drawEyes(ctx, J, st.face); frontArm(); }
    else { frontArm(); this.drawEyes(ctx, J, st.face); }
    if ((st.vein || 0) > 0.01) this.drawVein(ctx, J, st.vein, st.t);
    if (st.sweat > 0.01) {
      const R = D.headR;
      ctx.globalAlpha = st.sweat;
      drawDrop(ctx, J.head[0] - J.f * R * 0.86, J.head[1] - R * 0.5 + Math.sin(st.t * 5) * 1.5, R * 0.13, C.sweat);
      ctx.globalAlpha = 1;
    }
    if (st.steam > 0.01) this.drawSteam(ctx, J, st.steam, st.t);
    return J;
  }

  drawEyes(ctx, J, F) {
    const R = this.D.headR, S = this.S, f = J.f;
    const rx = R * S.eyeW * F.size, ry = R * S.eyeH * F.size;
    const cx = J.head[0] + f * (R * 0.4 + F.lookX * R * 0.12), cy = J.head[1] - R * 0.05 + F.lookY * R * 0.15;
    const gap = R * 0.235;
    if (F.glow > 0.01) { // glowing eyes + a short light trail streaming back
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const side of [-1, 1]) {
        const ex = cx + side * gap, g = ctx.createRadialGradient(ex, cy, 0, ex, cy, R * 0.6);
        g.addColorStop(0, `rgba(${CONFIG.colors.aura},${0.85 * F.glow})`); g.addColorStop(1, `rgba(${CONFIG.colors.aura},0)`);
        ctx.fillStyle = g; ctx.fillRect(ex - R * 0.6, cy - R * 0.6, R * 1.2, R * 1.2);
      }
      const tr = ctx.createLinearGradient(cx, 0, cx - f * R * 1.6, 0);
      tr.addColorStop(0, `rgba(${CONFIG.colors.auraHot},${0.8 * F.glow})`); tr.addColorStop(1, `rgba(${CONFIG.colors.aura},0)`);
      ctx.fillStyle = tr; ctx.fillRect(Math.min(cx, cx - f * R * 1.6), cy - R * 0.05, R * 1.6, R * 0.1);
      ctx.restore();
    }
    for (const side of [-1, 1]) {
      const ex = cx + side * gap, ey = cy, inner = -side;
      const lidY = ey - ry + clamp(F.lid) * 2 * ry, sl = F.slant * ry * 0.7;
      const xi = ex + inner * (rx + 1.5), xo = ex - inner * (rx + 1.5);
      ctx.save();
      ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, TAU); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(ex - rx - 2, ey - ry - 2, rx * 2 + 4, ry * 2 + 4);
      ctx.fillStyle = '#000';
      if (F.lid > 0.001 || Math.abs(F.slant) > 0.001) {
        ctx.beginPath(); ctx.moveTo(xo, lidY - sl); ctx.lineTo(xi, lidY + sl);
        ctx.lineTo(xi, ey - ry - 6); ctx.lineTo(xo, ey - ry - 6); ctx.closePath(); ctx.fill();
      }
      if (F.happy > 0.001) {
        ctx.beginPath(); ctx.ellipse(ex, ey + ry * (0.6 + (1 - F.happy) * 2.6), rx * 1.6, ry * 1.08, 0, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (S.lidLines && F.brow > 0.01) {
        const lift = ry * 0.42 + R * 0.05, ext = 1.25;
        ctx.strokeStyle = `rgba(255,255,255,${clamp(F.brow)})`; ctx.lineWidth = R * 0.07; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ex - inner * rx * ext, lidY - sl * ext - lift);
        ctx.lineTo(ex + inner * rx * ext, lidY + sl * ext - lift);
        ctx.stroke();
      }
    }
  }

  // rage aura: flickering silhouette glow smeared upward, fire tongues with hot cores, crackling arcs
  drawAura(ctx, M, J, st, bx, by, bw, bh) {
    const a = st.aura, t = st.t, z = M[0], C = CONFIG.colors, A1 = Math.min(a, 1.3);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 5; k++) {
      const fl = 0.74 + 0.26 * Math.sin(t * 31 + k * 2.1);
      ctx.globalAlpha = clamp(a * (0.8 - k * 0.14) * fl);
      ctx.filter = `blur(${((8 + k * 10) * z).toFixed(1)}px)`;
      ctx.drawImage(MASK, 0, 0, bw, bh, bx + Math.sin(t * 9 + k) * 4 * z, by - k * 20 * z * A1, bw, bh);
    }
    ctx.filter = 'none'; ctx.globalAlpha = 1;
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const roots = [J.head, J.head, J.neck, J.shoulder, J.handF, J.handB, J.hip, J.kneeF, J.kneeB, J.ankF, J.ankB, J.elbowF, J.elbowB];
    roots.forEach((p, i) => {
      for (let j = 0; j < 3; j++) {
        const seed = i * 7 + j * 3, ph = (t * (2.8 + hash(seed) * 1.8) + hash(seed + 1)) % 1;
        const h = (60 + 95 * hash(seed + 2)) * Math.sin(Math.PI * ph) * A1, w = 14 + 12 * hash(seed + 3);
        if (h < 3) continue;
        const x = p[0] + (hash(seed + 4) - 0.5) * 40, y = p[1] + (hash(seed + 5) - 0.5) * 30 - ph * 34;
        const sway = Math.sin(t * 14 + seed) * 12;
        const g = ctx.createLinearGradient(0, y, 0, y - h);
        g.addColorStop(0, `rgba(${C.auraHot},${0.7 * Math.min(a, 1)})`);
        g.addColorStop(0.35, `rgba(${C.aura},${0.6 * Math.min(a, 1)})`);
        g.addColorStop(1, `rgba(${C.aura},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x - w / 2, y);
        ctx.quadraticCurveTo(x - w / 2 + sway * 0.3, y - h * 0.55, x + sway, y - h);
        ctx.quadraticCurveTo(x + w / 2 + sway * 0.3, y - h * 0.55, x + w / 2, y);
        ctx.closePath(); ctx.fill();
      }
    });
    const tick = Math.floor(t * 18);
    for (let k = 0; k < 6; k++) { // crackling arcs of energy, re-rolled 18x a second
      if (hash(tick * 3 + k) > 0.85 * Math.min(a, 1)) continue;
      const p = roots[Math.floor(hash(tick * 5 + k) * roots.length)], pts = [];
      let x = p[0] + (hash(tick + k * 11) - 0.5) * 110, y = p[1] + (hash(tick + k * 13) - 0.5) * 110;
      pts.push([x, y]);
      for (let s = 0; s < 6; s++) { x += (hash(tick * 7 + k * 5 + s) - 0.5) * 34; y += (hash(tick * 9 + k * 3 + s) - 0.5) * 34; pts.push([x, y]); }
      ctx.lineJoin = 'miter'; ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${C.aura},0.85)`; ctx.lineWidth = 5; strokePoly(ctx, pts);
      ctx.strokeStyle = C.auraCore; ctx.lineWidth = 1.8; strokePoly(ctx, pts);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // anime anger-vein mark, pulsing on the side of the head
  drawVein(ctx, J, amt, t) {
    const R = this.D.headR, s = R * 0.3 * amt * (1 + 0.14 * Math.sin(t * 20));
    ctx.save();
    ctx.translate(J.head[0] - J.f * R * 0.36, J.head[1] - R * 0.3);
    ctx.strokeStyle = CONFIG.colors.vein; ctx.lineWidth = R * 0.12; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,40,30,0.9)'; ctx.shadowBlur = R * 0.4;
    for (let q = 0; q < 4; q++) {
      ctx.save(); ctx.rotate(q * Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(s * 0.22, -s); ctx.quadraticCurveTo(s * 0.26, -s * 0.26, s, -s * 0.22); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  drawSteam(ctx, J, amt, t) {
    const R = this.D.headR;

function catmullRomPath(pts, closed, steps = 10) {
  const p = new Path2D(), n = pts.length, P = i => pts[closed ? (i + n) % n : clamp(i, 0, n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const y = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      (i || s) ? p.lineTo(x, y) : p.moveTo(x, y);
    }
  }
  if (closed) p.closePath();
  return p;
}

// shaft cut-out from the surface down to floorY (rough walls, rounded floor corners)
function tunnelGeom(T, floorY) {
  const fill = new Path2D(), left = new Path2D(), right = new Path2D(), floor = new Path2D();
  const ys = [-6]; for (let y = 22; y < floorY - 16; y += 22) ys.push(y);
  ys.forEach((y, i) => { const x = wallX(T, y, -1); i ? (fill.lineTo(x, y), left.lineTo(x, y)) : (fill.moveTo(x, y), left.moveTo(x, y)); });
  const xl = wallX(T, floorY, -1), xr = wallX(T, floorY, 1);
  for (let i = 0; i <= 18; i++) {
    const u = i / 18, x = lerp(xl, xr, u), y = floorY - 16 * Math.pow(Math.abs(u * 2 - 1), 4) + 2.5 * snoise(x * 0.08 + T.seed);
    fill.lineTo(x, y); i ? floor.lineTo(x, y) : floor.moveTo(x, y);
    if (i === 0) left.lineTo(x, y);
    if (i === 18) right.moveTo(x, y);
  }
  for (let i = ys.length - 1; i >= 0; i--) { const x = wallX(T, ys[i], 1); fill.lineTo(x, ys[i]); right.lineTo(x, ys[i]); }
  fill.closePath();
  return { fill, left, right, floor };
}

function drawSparkles(ctx, t, amt) {

function drawCracks(ctx, list, prog, width = 2.6, color = CONFIG.colors.crack) {
  if (prog <= 0) return;

    ctx.strokeStyle = color; ctx.lineWidth = pass[0]; ctx.globalAlpha = pass[1];
    ctx.globalCompositeOperation = 'lighter';

        if (c.acc[i] <= len) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
        else { const u = (len - c.acc[i - 1]) / (c.acc[i] - c.acc[i - 1]); ctx.lineTo(lerp(c.pts[i - 1][0], c.pts[i][0], u), lerp(c.pts[i - 1][1], c.pts[i][1], u)); break; }

}

// Underground darkness layer with "holes" punched by lights.

// god rays climbing a shaft, clipped to the shaft shape; keep = fraction of brightness left at the top

// label above a character: typed text grows from a fixed left edge computed from the full text
function drawLabel(ctx, text, full, sx, sy, alpha = 1) {

  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);

  const y = clamp(sy, S.top + T.labelSize, H - S.bottom);

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// "── DAY ──" over a big odometer number: digits roll like a mechanical counter, pop on milestones,
// and the number turns gold once the gold is found (gold 0..1)
function drawDayCounter(ctx, value, pop, gold = 0) {
  const T = CONFIG.text, top = CONFIG.safe.top + 34;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.textBaseline = 'middle';
  // label row
  let sp = setFont(ctx, T.dayLabelSize, T.dayLabelTracking, 700);
  const lw = ctx.measureText(T.dayPrefix).width - sp, line = 54, gap = 20;
  const goldCol = (a) => `rgba(255,${Math.round(lerp(255, 214, gold))},${Math.round(lerp(255, 120, gold))},${a})`;
  ctx.fillStyle = goldCol(0.9);
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10;
  ctx.fillText(T.dayPrefix, W / 2 - lw / 2, top);
  ctx.fillRect(W / 2 - lw / 2 - gap - line, top - 1, line, 2); ctx.fillRect(W / 2 + lw / 2 + gap, top - 1, line, 2);
  // number: every digit centred in a fixed-width cell so counting never jitters
  const iv = Math.max(1, Math.floor(value + 1e-6)), f = value - iv, digits = String(iv);
  ctx.font = `800 ${T.daySize}px ${CONFIG.numberFont}`; ctx.letterSpacing = '0px';
  const cell = Math.max(...'0123456789'.split('').map(c => ctx.measureText(c).width));
  const dw = cell + T.daySize * T.dayTracking, h = T.daySize * 1.1, total = digits.length * dw - T.daySize * T.dayTracking;
  ctx.translate(W / 2, top + T.daySize * 0.92);
  const s = 1 + 0.16 * pop; ctx.scale(s, s);
  ctx.shadowColor = gold > 0.01 ? `rgba(255,190,80,${0.5 + 0.4 * gold})` : `rgba(255,255,255,${0.25 + 0.5 * pop})`;
  ctx.shadowBlur = 18 + 24 * pop + 14 * gold;
  ctx.fillStyle = goldCol(1);
  for (let i = 0; i < digits.length; i++) { // rolling digit: old one slides up and fades, new one rises in
    const place = digits.length - 1 - i, d = +digits[i], unit = Math.pow(10, place);
    const rolling = place === 0 || iv % unit === unit - 1, r = rolling ? smooth(0.62, 1, f) : 0; // snappy roll
    const x = -total / 2 + i * dw + cell / 2, nd = (d + 1) % 10;
    ctx.globalAlpha = 1 - r; ctx.fillText(String(d), x - ctx.measureText(String(d)).width / 2, -r * h * 0.55);
    if (r > 0.001) { ctx.globalAlpha = r; ctx.fillText(String(nd), x - ctx.measureText(String(nd)).width / 2, (1 - r) * h * 0.55); }
  }
  ctx.restore();
}

/* =====================================================================
   8. CHOREOGRAPHY — this reel's story, assembled from CONFIG
   ===================================================================== */
const TL = new Timeline(CONFIG.scenes);
const BT = CONFIG.beats, WD = CONFIG.world, FIG = CONFIG.figure;
const MONTAGE_END = TL.get('montage').end;
const FX = new ParticleSystem();
const A = new Stickman('A'), B = new Stickman('B');

// ---------- hit schedules
const montageHits = Array.from({ length: BT.montageHits }, (_, k) => BT.firstHit + k * BT.swingPeriod);
const hitsA = [...montageHits, ...BT.hitsAfterMontageA];
const hitsB = [...montageHits, ...BT.hitsAfterMontageB];
const lastB = hitsB[hitsB.length - 1];

// ---------- floors: smooth montage descent, then a small step on each later hit
const montageDepth = new Spline(WD.montageDepth);
const stepDown = (t, hits, levels, base) => hits.reduce((y, h, i) => lerp(y, levels[i], Ease.outCubic(clamp((t - h) / 0.12))), base);
const floorOf = (hits, levels) => t => (t < BT.land ? WD.pitDepth
  : t < MONTAGE_END ? montageDepth.at(t) : stepDown(t, hits, levels, montageDepth.at(MONTAGE_END)));
const floorA = floorOf(BT.hitsAfterMontageA, WD.afterMontageA);
const floorB = floorOf(BT.hitsAfterMontageB, WD.afterMontageB);
const tunnelFloorA = t => (t >= BT.breakThrough ? WD.goldTop + 16 : floorA(t));

// ---------- actor paths (anchor = feet)
function jumpPos(t, x0, x1, y1) {
  const k = clamp((t - BT.jump) / (BT.land - BT.jump));
  return [lerp(x0, x1, Ease.inOutSine(k)), lerp(0, y1, k * k) - 480 * k * (1 - k)];
}
const climbY = new Spline([[BT.climb, WD.stopB], [BT.climb + 0.3, WD.stopB - 34], [10.0, 1130], [10.9, 560], [11.7, -4]]);
function anchorA(t) {
  if (t < BT.jump) return [WD.startA, 0, 1];
  if (t < BT.land) return [...jumpPos(t, WD.startA, WD.digA, WD.pitDepth), 1];
  if (t < BT.breakThrough) return [WD.digA, floorA(t), 1];
  return [WD.digA, lerp(WD.preBreakA, WD.goldTop + 8, Ease.inQuad(clamp((t - BT.breakThrough) / 0.14))), 1];
}
function anchorB(t) {
  if (t < BT.jump) return [WD.startB, 0, -1];
  if (t < BT.land) return [...jumpPos(t, WD.startB, WD.digB, WD.pitDepth), -1];
  if (t < BT.turn) return [WD.digB, floorB(t), -1];
  if (t < BT.climb) return [lerp(WD.digB, WD.ropeB - 38, Ease.inOutSine(invLerp(BT.turn, BT.climb, t))), WD.stopB, 1];
  if (t < BT.sit) return [WD.ropeB - 38, climbY.at(t), 1];
  return [WD.tunnelB + WD.tunnelW / 2 + 26, 0, -1];
}

// ---------- pose keyframes
function swingKeys(hits, from, variants = {}) {
  const keys = []; let prev = from;
  hits.forEach((h, i) => {
    const p = h - prev, v = variants[i] || {};
    if (i > 0) keys.push([prev + p * 0.16, v.recoil || 'RECOIL', 'outQuad']);
    keys.push([prev + p * (i ? 0.68 : 0.62), v.windup || 'WINDUP', 'inOutSine']);
    keys.push([h, v.hit || 'HIT', 'inCubic']);
    prev = h;
  });
  return keys;
}
function climbKeys(t0, t1, half) {
  const keys = [];
  for (let t = t0 + half, i = 0; t < t1; t += half, i++) keys.push([t, i % 2 ? 'CLIMB_A' : 'CLIMB_B', 'inOutSine']);
  return keys;
}
const intro = [[0, 'READY'], [BT.jump - 0.02, 'CROUCH'], [BT.jump + 0.2, 'JUMP', 'outQuad'], [BT.land, 'LAND', 'inQuad'], [BT.land + 0.24, 'READY', 'outCubic']];
const swingFrom = BT.land + 0.24;

const poseA = new Track([

  [BT.finalHit - 0.3, 'BIG_WINDUP'],
  [BT.finalHit - 0.14, 'BIG_WINDUP'],
  [BT.finalHit, 'HIT_BIG', 'inCubic'],
  [BT.breakThrough, 'HIT_BIG'],
  [BT.breakThrough + 0.16, 'STARTLED', 'outCubic'],
  [BT.victory, 'STARTLED'],
  [BT.victory + 0.38, 'VICTORY', 'outBack'],
], 'inOutSine', poseOf);

const poseB = new Track([

  ...swingKeys(hitsB, swingFrom, { [hitsB.length - 1]: { windup: 'WINDUP_LOW', hit: 'HIT_WEAK' } }),
  [lastB + 0.26, 'HIT_WEAK'],
  [BT.wipe, 'STAND_TIRED'],
  [BT.wipe + 0.16, 'WIPE_A', 'outQuad'],
  [BT.wipe + 0.36, 'WIPE_B'],
  [BT.slump - 0.04, 'STAND_TIRED'],
  [BT.slump + 0.3, 'SLUMP'],
  [BT.drop, 'SLUMP'],
  [BT.drop + 0.14, 'SLUMP_EMPTY', 'outQuad'],
  [BT.turn, 'SLUMP_EMPTY'],
  [BT.climb, 'CLIMB_A'],
  ...climbKeys(BT.climb, BT.sit - 0.1, 0.21),
  [BT.sit, 'SIT'],
  [BT.notice - 0.05, 'SIT'],
  [BT.notice + 0.25, 'SIT_LOOK', 'outBack'],
  [BT.sad, 'SIT_LOOK'],

// every cue comes from the same beats/hit lists the animation uses, so sound and picture can't drift
function typeClicks(S, keys, pan, gain) {
  const T = CONFIG.text; let prev = '';
  for (const [kt, txt] of keys) {
    const erase = prev.length / T.eraseCps;
    for (let c = 0; c < prev.length; c++) SFX.click(S, kt + c / T.eraseCps, { gain: 0.06 * gain, pan, freq: 2600 });
    for (let c = 0; c < txt.length; c++) if (txt[c] !== ' ') SFX.click(S, kt + erase + c / T.typeCps, { gain: 0.13 * gain, pan, freq: 1800 + S.R() * 400 });
    prev = txt;
  }
}
function buildSoundCues(S) {
  const A = CONFIG.audio, G = A.gains, pA = A.panA, pB = A.panB, T = CONFIG.text;
  // beds: night crickets at the surface, underground room tone, drips
  SFX.crickets(S, 0, 1.6, { gain: 0.05 * G.ambience }); SFX.crickets(S, 12.9, 1.6, { gain: 0.05 * G.ambience });
  SFX.roomTone(S, 0.8, 11.8, { gain: 0.16 * G.ambience });
  for (let tt = 2.2; tt < 12; tt += 1.3 + S.R() * 1.7) SFX.plip(S, tt, { gain: 0.07 * G.ambience, pan: (S.R() - 0.5) * 1.4 });
  // hook: jump in, land
  SFX.whoosh(S, BT.jump, { dur: 0.4, f0: 300, f1: 1400, gain: 0.35, pan: pA }); SFX.whoosh(S, BT.jump, { dur: 0.4, f0: 320, f1: 1500, gain: 0.35, pan: pB });

  SFX.crumble(S, BT.land, { gain: 0.5, dur: 0.4, grains: 12 });

  hitsA.forEach(h => SFX.hit(S, h, { pan: pA, gain: G.hits }));
  hitsB.forEach(h => SFX.hit(S, h + 0.004, { pan: pB, gain: G.hits * 0.95, weak: h === lastB }));
  [3, 6, 9].forEach(i => { SFX.plip(S, hitsA[i] + 0.06, { gain: 0.16, pan: pA }); SFX.plip(S, hitsB[i] + 0.08, { gain: 0.16, pan: pB }); });
  // B gives up: wipe, sigh, steam, the glint nobody noticed, pickaxe falls, rope creaks
  SFX.whoosh(S, BT.wipe + 0.12, { dur: 0.3, f0: 1500, f1: 3500, gain: 0.22, pan: pB, q: 1.2 });
  SFX.plip(S, BT.wipe + 0.34, { gain: 0.2, pan: pB });
  SFX.breath(S, BT.slump - 0.05, { gain: 0.5, pan: pB, dur: 0.9 });
  SFX.hiss(S, BT.slump + 0.25, { gain: 0.12, pan: pB, dur: 0.9 });

  SFX.whoosh(S, BT.drop, { dur: 0.28, f0: 600, f1: 250, gain: 0.15, pan: pB });
  SFX.clatter(S, BT.drop + 0.28, { pan: pB });

  for (let tt = BT.climb + 0.1; tt < 10.4; tt += 0.21) SFX.creak(S, tt, { gain: 0.14 * (1 - invLerp(9.4, 10.4, tt)), pan: pB + 0.2 });

  SFX.pad(S, BT.reveal[0], { dur: 2.2, freqs: [220, 329.63, 440, 554.37], gain: 0.05 * G.music, attack: 0.9, release: 0.9 });
  SFX.shimmer(S, BT.reveal[0] + 0.3, { dur: 1.3, n: 24, gain: 0.16 });
  // day counter: ticks (max 15/s, pitch climbs with the count) + milestone pops
  let lastTick = -1, lastDay = 1;
  for (let tt = 0; tt < 11; tt += 1 / 240) {
    const d = Math.floor(dayTrack.at(tt) + 1e-6);
    if (d !== lastDay) { if (tt - lastTick > 1 / 15) { SFX.tick(S, tt, { gain: 0.06 * G.ui, freq: 2200 + d * 2.5 }); lastTick = tt; } lastDay = d; }
  }

  SFX.hit(S, BT.finalHit, { pan: pA, gain: 1.2 });

  SFX.whoosh(S, BT.pan[1], { dur: 0.6, f0: 700, f1: 300, gain: 0.2, pan: pB });

  SFX.sadNotes(S, BT.sad + 0.05, { gain: 0.32 * G.music });

  SFX.growl(S, BT.stand - 0.1, { dur: BT.ignite - BT.stand + 0.02, gain: 0.35, pan: pB });
  SFX.riser(S, BT.anger + 0.05, { dur: BT.ignite - BT.anger - 0.09, gain: 0.3 }); // a beat of air before the blast

  T.card.forEach((line, i) => {
    const st = i ? BT.cardLine2 : BT.cardLine1;
    for (let c = 0; c < line.length; c++) if (line[c] !== ' ') SFX.click(S, st + c / BT.cardCps, { gain: 0.2 * G.ui, freq: 1700 + S.R() * 300 });
  });

}

async function renderAudio() {
  const sr = CONFIG.audio.sampleRate, ctx = new OfflineAudioContext(2, Math.ceil(sr * CONFIG.video.duration), sr);
  buildSoundCues(makeBus(ctx));
  const buf = await ctx.startRendering();
  let peak = 0;
  for (let c = 0; c < 2; c++) for (const v of buf.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
  const k = peak > 0 ? 0.84 / peak : 1, fadeN = Math.floor(sr * 0.05); // ~-1.5 dBFS headroom for AAC
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] *= k * Math.min(1, (d.length - i) / fadeN);
  }
  return buf;
}
function encodeWav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, view = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const str = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); view.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, ch, true); view.setUint32(24, buf.sampleRate, true);
  view.setUint32(28, buf.sampleRate * ch * 2, true); view.setUint16(32, ch * 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, n * ch * 2, true);
  const data = Array.from({ length: ch }, (_, c) => buf.getChannelData(c));
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < ch; c++, o += 2) { const v = clamp(data[c][i], -1, 1); view.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); }
  return new Uint8Array(view.buffer);
}
async function renderAudioWav() {
  const u8 = encodeWav(await renderAudio());
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

  };
  if (isA) {
    const g = clamp(FXT.goldA.at(t));
    st.rimColor = mixColor('#ffffff', CONFIG.colors.goldRim, g); st.glow = 1 + 1.4 * g;
  } else {
    if (t >= lastB) st.toolVisible = false; // the planted pickaxe is drawn as a prop from here
    const w = smooth(BT.slump, BT.slump + 0.3, t) * (1 - smooth(BT.drop, BT.drop + 0.1, t));
    if (w > 0) st.fix = { F: [PLANT.butt[0], PLANT.butt[1], w] };
    const g = clamp(FXT.goldB.at(t)) * smooth(12.6, BT.notice, t), au = ex.aura.at(t);
    const lerp3 = (P, Q, k) => P.map((v, i) => lerp(v, Q[i], k));
    const rim = lerp3(lerp3([255, 255, 255], hexRGB('#ffd98c'), g), hexRGB(CONFIG.colors.uiRim), clamp(au));
    st.rimColor = `rgb(${rim.map(Math.round).join(',')})`;
    st.glow = 1 + 0.9 * g + 1.3 * clamp(au);
    st.aura = au; st.hairTint = ex.hairTint.at(t); st.vein = ex.vein.at(t);
  }
  return st;
}

function drawScene(ctx, t) {
  const C = CONFIG.colors, cam = cameraAt(t), M = camMatrix(cam, shakeAt(t));
  const reveal = FXT.reveal.at(t), goldA = FXT.goldA.at(t), goldB = FXT.goldB.at(t), gA1 = clamp(goldA);
  const fA = tunnelFloorA(t), fB = floorB(t), [TA, TB] = WORLD.tunnels;
  const flick = 1 + 0.05 * Math.sin(t * 23) + 0.03 * Math.sin(t * 37 + 1);
  const LA = [WD.ropeA, lanternY(floorA, Math.min(t, BT.breakThrough))], LB = [WD.ropeB, lanternY(floorB, Math.min(t, BT.drop))];

  setM(ctx, M);
  drawSky(ctx, t);
  drawEarth(ctx);
  const gA = drawTunnel(ctx, TA, 0, fA), gB = drawTunnel(ctx, TB, 1, fB);
  drawGrass(ctx);
  drawTreasure(ctx, t, Math.max(reveal, gA1), 1 - reveal);
  if (t < BT.breakThrough) drawCracks(ctx, WORLD.cracksA, FXT.crackA.at(t));
  drawCracks(ctx, WORLD.cracksB, FXT.crackB.at(t), 2);
  drawRope(ctx, WD.ropeA, Math.min(fA, WD.preBreakA), t);
  drawRope(ctx, WD.ropeB, fB, t + 2, t > BT.climb && t < BT.sit ? 0.25 : 1);
  const pk = propPick(t);
  if (pk) drawPickaxe(ctx, pk.butt, pk.ang, -1);

  drawDarkness(ctx, M, {
    lights: [
      { x: LA[0] + 70, y: LA[1] + 40, r: 560, i: 0.92 * flick, sy: 1.25 },
      { x: LB[0] - 70, y: LB[1] + 40, r: 560, i: 0.92 * flick, sy: 1.25 },
      { x: 540, y: 1745, r: 720, i: reveal, sy: 0.55 },
      { x: WD.tunnelA, y: WD.goldTop, r: 900, i: 0.9 * gA1 },
      { x: WD.tunnelB, y: WD.stopB, r: 520, i: 0.5 * goldB, sy: 1.3 },
    ],
    columns: [
      { x0: TA.cx - 170, x1: TA.cx + 170, y0: -10, y1: WD.goldTop, i: 0.8 * gA1 },
      { x0: TB.cx - 170, x1: TB.cx + 170, y0: -10, y1: WD.stopB, i: 0.5 * goldB },
    ],
    hide: 0,
  });

  setM(ctx, M);
  for (const L of [LA, LB]) {
    drawGlow(ctx, L[0] + (L === LA ? 60 : -60), L[1] + 60, 420, C.lantern, 0.17 * flick, 1.25);
    drawGlow(ctx, L[0], L[1] + 22, 120, C.lantern, 0.3 * flick);
    drawGlow(ctx, L[0], L[1] + 22, 40, C.lantern, 0.55 * flick);
  }
  drawGlow(ctx, 540, 1750, 640, C.goldLight, 0.2 * reveal + 0.15 * gA1, 0.5);
  drawGlow(ctx, WD.tunnelA, WD.goldTop - 10, 520, C.goldLight, 0.42 * goldA);
  drawRays(ctx, TA, gA.fill, WD.goldTop + 12, -60, goldA, t);
  drawRays(ctx, TB, gB.fill, WD.stopB + 4, -60, 0.75 * goldB, t + 3, 0.6);
  drawGlow(ctx, TB.cx + 40, 20, 330, C.goldLight, 0.42 * goldB, 0.6);   // light spilling out of B's hole
  drawGlow(ctx, TB.cx + 60, -10, 150, C.goldLight, 0.3 * goldB, 0.8);
  drawSparkles(ctx, t, reveal * 0.9 + 0.3 * gA1);
  ctx.globalCompositeOperation = 'source-over';
  drawLanternBody(ctx, LA[0], LA[1], 0.07 * Math.sin(t * 2.6), flick);
  drawLanternBody(ctx, LB[0], LB[1], 0.07 * Math.sin(t * 2.3 + 1), flick);

  const sB = actorState('B', t), sA = actorState('A', t);
  if (sB.aura > 0.01) {
    const au = Math.min(sB.aura, 1.3), burst = Math.exp(-(t - BT.ignite) / 0.45);
    drawGlow(ctx, sB.x, -160, 620, C.aura, 0.3 * au, 1.2); // rage lights the night red
    const wv = (70 + 110 * burst) * (0.85 + 0.15 * Math.sin(t * 40)); // energy pillar into the sky
    const pg = ctx.createLinearGradient(sB.x - wv, 0, sB.x + wv, 0);
    pg.addColorStop(0, `rgba(${C.aura},0)`); pg.addColorStop(0.5, `rgba(${C.auraHot},${0.5 * burst + 0.14 * au})`); pg.addColorStop(1, `rgba(${C.aura},0)`);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = pg; ctx.fillRect(sB.x - wv, -1800, wv * 2, 1800); ctx.restore();
    drawCracks(ctx, RAGE_CRACKS, clamp((t - BT.ignite) / 0.35), 3, '#ff5a3a');
  }
  B.draw(ctx, M, sB); setM(ctx, M);
  A.draw(ctx, M, sA); setM(ctx, M);
  FX.draw(ctx, t);
  const sw = (t - BT.ignite) / 0.55;
  if (sw > 0 && sw < 1) { // ignition shockwave
    const k = Ease.outCubic(sw);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,120,80,${0.85 * (1 - sw)})`; ctx.lineWidth = 2 + 12 * (1 - sw);
    ctx.beginPath(); ctx.ellipse(sB.x, -4, 40 + 560 * k, (40 + 560 * k) * 0.16, 0, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1.5 + 6 * (1 - sw);
    ctx.beginPath(); ctx.arc(sB.x, -150, 30 + 420 * k, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const flash = t >= BT.breakThrough ? Math.exp(-(t - BT.breakThrough) / 0.22) : 0;
  if (flash > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,220,150,${0.5 * flash})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  const uiFlash = t >= BT.ignite ? Math.exp(-(t - BT.ignite) / 0.16) : 0;
  if (uiFlash > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,110,80,${0.45 * uiFlash})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  drawVignette(ctx);
  const rage = clamp(sB.aura || 0);
  if (rage > 0.01) { // red grade + red vignette while he powers up
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(255,30,20,${0.55 * rage})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    const rv = ctx.createRadialGradient(W / 2, 900, 320, W / 2, 900, 1250);
    rv.addColorStop(0, 'rgba(90,0,0,0)'); rv.addColorStop(1, `rgba(80,0,0,${0.6 * rage})`);
    ctx.fillStyle = rv; ctx.fillRect(0, 0, W, H);
  }

  for (const [st, keys, lift] of [[sA, CONFIG.text.labelA, labelLiftA], [sB, CONFIG.text.labelB, labelLiftB]]) {
    const { shown, full } = labelText(keys, t), [sx, sy] = toScreen(M, st.x, st.y - lift.at(t));
    drawLabel(ctx, shown, full, sx, sy);
  }
  const pop = clamp(dayPops.reduce((s, pt) => s + (t >= pt ? Math.exp(-(t - pt) / 0.18) : 0), 0));
  drawDayCounter(ctx, dayTrack.at(t), pop, gA1);
}

function renderFrame(t) {
  t = clamp(t, 0, CONFIG.video.duration);
  const ctx = CTX;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < BT.fade[1]) drawScene(ctx, t); // the card is opaque after the fade
  drawCard(ctx, t);
  drawWatermark(ctx);
  if (showGuides) drawGuides(ctx);
}

// ---------- boot: render mode for the Playwright renderer, otherwise a small preview player
const READY = Promise.all([
  document.fonts.load(`600 40px ${CONFIG.font}`), document.fonts.load(`800 40px ${CONFIG.font}`),
  document.fonts.load(`800 40px ${CONFIG.numberFont}`),
]).then(() => document.fonts.ready);
window.REEL = { CONFIG, renderFrame, renderAudioWav, ready: READY, setGuides: v => { showGuides = v; } };

if (/render/.test(location.search)) {
  document.body.classList.add('render');
} else {
  const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), play = document.getElementById('play');
  const D = CONFIG.video.duration;
  let playing = true, t = 0, last = null;
  // sound: the offline-rendered mix is played back in sync with the picture
  let soundOn = false, actx = null, mix = null, src = null;
  const soundBtn = document.getElementById('sound');
  const syncAudio = () => {
    if (src) { try { src.stop(); } catch (e) { /* already stopped */ } src = null; }
    if (soundOn && playing && mix) { src = actx.createBufferSource(); src.buffer = mix; src.connect(actx.destination); src.start(0, t); }
  };
  soundBtn.onclick = async () => {
    actx = actx || new AudioContext();
    if (!mix) { soundBtn.textContent = 'SOUND: …'; mix = await renderAudio(); }
    soundOn = !soundOn; soundBtn.textContent = soundOn ? 'SOUND: ON' : 'SOUND: OFF';
    await actx.resume(); syncAudio();
  };
  scrub.max = D;
  const show = () => { renderFrame(t); scrub.value = t; clock.textContent = `${t.toFixed(2)}s`; };
  play.onclick = () => { playing = !playing; play.textContent = playing ? 'PAUSE' : 'PLAY'; syncAudio(); };
  scrub.oninput = () => { t = +scrub.value; playing = false; play.textContent = 'PLAY'; syncAudio(); show(); };
  document.getElementById('guides').onclick = () => { showGuides = !showGuides; show(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); play.onclick(); }
    if (e.code === 'ArrowRight') { t = Math.min(D, t + 1 / CONFIG.video.fps); playing = false; syncAudio(); show(); }
    if (e.code === 'ArrowLeft') { t = Math.max(0, t - 1 / CONFIG.video.fps); playing = false; syncAudio(); show(); }
  });
  READY.then(() => requestAnimationFrame(function loop(now) {
    if (playing) {
      if (last !== null) { const next = t + (now - last) / 1000; t = next % D; if (next >= D) syncAudio(); }
      show();
    }
    last = now;
    requestAnimationFrame(loop);
  }));
}
</script>
