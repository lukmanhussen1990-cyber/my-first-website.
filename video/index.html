<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brushstroke Disc</title>
<style>
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 100 900;
    font-stretch: 62% 125%;
    src: url(fonts/archivo-latin-standard-normal.woff2) format('woff2-variations');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    font-weight: 400;
    src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2');
  }
  html, body { margin: 0; height: 100%; background: #0b0b0a; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; }
  body.render canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="motion.js"></script>
</body>
</html>
