<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" aria-label="Lens icon">
  <!-- outer ring -->
  <circle cx="32" cy="32" r="30" stroke="#1a1a2e" stroke-width="3"/>
  <!-- lens body -->
  <circle cx="32" cy="32" r="22" fill="#e8f0fe" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- iris -->
  <circle cx="32" cy="32" r="14" fill="#4a6cf7" stroke="#1a1a2e" stroke-width="2"/>
  <!-- pupil -->
  <circle cx="32" cy="32" r="7" fill="#0f0f2d"/>
  <!-- specular highlight -->
  <circle cx="26" cy="26" r="3" fill="white" opacity="0.55"/>
  <!-- lens flare streak -->
  <line x1="38" y1="22" x2="42" y2="18" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
</svg>
