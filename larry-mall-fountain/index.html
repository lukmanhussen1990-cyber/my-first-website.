<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larry &amp; The Mall Fountain</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #07090d; color: #e8e8ee; font-family: Inter, system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { width: min(92vw, calc((100vh - 110px) * 0.5625)); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .controls { display: flex; gap: 12px; align-items: center; width: min(92vw, 420px); }
  button { background: #1f6ff0; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
  input[type=range] { flex: 1; }
  body.capture .controls { display: none; }
  body.capture .wrap { padding: 0; }
  body.capture canvas { width: 1080px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<script>if (location.search.includes('capture')) document.body.classList.add('capture');</script>
<div class="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="controls"><button id="play">▶ Play</button><input id="seek" type="range" min="0" max="1000" value="0"></div>
</div>
<script src="js/engine.js"></script>
<script src="js/characters.js"></script>
<script src="js/scenes_a.js"></script>
<script src="js/scenes_b.js"></script>
<script src="js/scenes_c.js"></script>
<script src="js/overlays.js"></script>
<script src="js/main.js"></script>
</body>
</html>
